  +      - diff_or_log_evidence
  +      - backend_stale_source_check
  +      - backend_active_identity_conflict_check
  +    merge_blockers:
  +      - missing_source_active_manifest_id
  +      - stale_source_active
  +      - non_active_source_manifest
  +      - source_identity_mismatch
  +      - merge_target_active_uuid_mismatch
  +      - active_identity_conflict
  +      - missing_source_evidence
  +      - replacement_clone_without_validation
  +      - frontend_merge_judgment_detected
  +    physical_effect:
  +      - update_existing_active_row_inside_backend_transaction
