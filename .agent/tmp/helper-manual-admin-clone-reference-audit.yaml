audit_handoff:
  id: helper-manual-admin-clone-reference-audit
  repository: github.com/tk-ud/topolactor
  branch: audit/helper-manual-admin-clone-reference
  worktype: audit_to_design_change_handoff
  created_at: "2026-06-29"
  purpose: >-
    helper manual / helper reference artifact の設計を、最新の
    docs/design/admin-console-workflow-ssot.yaml の clone / draft lifecycle と突合した
    監査結果を design_change Agent へ情報喪失なく渡すための一時ファイル。
    このファイル自体は正本ではなく、次 design_change の参照補助である。

  agent_entry:
    required_first_reads:
      - AGENTS.md
      - .agent/rules/rule.md
      - .agent/README.md
      - .agent/prompt/design-change.md
      - .agent/protocols/design-change.md
    required_ssot_reads:
      - docs/design/admin-console-workflow-ssot.yaml
      - docs/design/user-facing-helper-manual-ssot.yaml
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/pipeline-continuity-ssot.yaml
      - docs/design/cli-model-context-protocols-port-ssot.yaml
      - docs/design/cli-mcp-port-implementation-ssot.yaml
      - docs/design/ci-contract-ssot.yaml
      - docs/framework-policy.yaml
      - .agent/tasks/todo.md
    instruction: >-
      この一時監査ファイルを読み、ここに記録した gap / candidate fields / diff_ref を参考にする。
      ただし最終判断は必ず上記 SSOT 正本を読み直して行うこと。

  out_of_scope:
    - user_manual_body_copywriting
    - docs/helper/helper-manual.schema.json_creation
    - docs/helper/helper-manual.seed.json_creation
    - admin_helper_ui_implementation
    - mcp_tool_surface_creation
    - runtime_or_admin_authority_implementation

  audit_judgment:
    diff_reviewed: false
    audit_kind: ssot_full_audit_not_pr_diff_audit
    contract_design_followup_judgment: blocking
    summary: >-
      docs/design/user-facing-helper-manual-ssot.yaml は reference-only / viewer-only /
      origin evidence preservation / AI-MCP authority prohibition の基礎はある。
      しかし最新 admin-console-workflow-ssot の /admin/contents Step 1 clone / draft lifecycle を、
      MCP / Agent / admin helper が共通参照する JSON reference artifact contract として受け止める
      required vocabulary が不足している。よって implementation_change ではなく design_change が先。

  ssot_checked:
    - AGENTS.md
    - .agent/rules/rule.md
    - .agent/README.md
    - .agent/prompt/audit.md
    - .agent/protocols/audit.md
    - docs/framework-core.yaml
    - docs/framework-policy.yaml
    - docs/design/admin-console-workflow-ssot.yaml
    - docs/design/user-facing-helper-manual-ssot.yaml
    - docs/design/runtime-orchestration-ssot.yaml
    - docs/design/pipeline-continuity-ssot.yaml
    - docs/design/cli-model-context-protocols-port-ssot.yaml
    - docs/design/cli-mcp-port-implementation-ssot.yaml
    - docs/design/ci-contract-ssot.yaml
    - docs/system-roadmap.yaml
    - .agent/tasks/todo.md

  admin_workflow_canonical_points:
    step1_entry_modes:
      - create_new_topology
      - clone_active_as_replacement_draft
      - clone_active_as_new_topology_draft
    lifecycle_state_model:
      physical_state_model: draft_active_toggle
      allowed_states:
        - draft
        - active
      clone_status_enum: prohibited
      clone_semantics_location:
        - JSONB metadata
        - attribute
        - operation context
    replacement_clone_merge:
      authority_owner:
        - backend AdminRuntime
        - ManifestRepository transaction
      required_evidence:
        - source_active_manifest_id
        - source_active_topologySystemName
        - source_active_routeKey
        - source_active_dispatcher_axes
        - source_active_updated_at_or_version
        - source_active_topology_hash_or_equivalent_diff_base
        - clone_mode
        - draft_origin
        - validation_result
        - diff_or_log_evidence
      physical_lifecycle:
        - read_active_canonical_row
        - insert_clone_draft_row_with_clone_metadata_and_source_active_manifest_id
        - update_draft_row_during_authoring
        - validate_replacement_draft_and_record_diff_log_evidence
        - verify_clone_source_active_manifest_id_matches_current_active_inside_backend_transaction
        - update_existing_active_row_inside_backend_transaction
        - delete_working_draft_row_after_successful_merge
      frontend_role:
        - choose clone replacement mode
        - display source active read-only evidence
        - submit authoring intent
        - display validation / diff / merge blockers
        - submit merge request intent only
      frontend_prohibited:
        - decide_merge_target
        - decide_conflict_outcome
        - mutate_active_topology
    sql_attention_candidate_boundary:
      storage: candidate_or_evidence_surface_until_explicit_adoption
      draft_creation: explicit_adoption_only
      prohibited:
        - mass_persisting_sql_attention_candidates_as_draft_rows
        - candidate_source_as_replacement_authority
        - source_evidence_as_replacement_authority
    layout_patch_boundary:
      rule: layout_patch_apply_is_not_production_manifest_replacement_merge

  block_by_block_audit:
    helper_reference_artifact:
      judgment: partial
      issue: >-
        required_top_level_fields は reference artifact の一般項目を持つが、admin clone lifecycle を表現する
        draft_origin / clone_mode / source_active_manifest_id / replacement_merge_intent /
        diff_or_log_evidence / stale_source_blocker / backend_merge_authority が無い。
    mcp_topology_authoring_draft_reference:
      judgment: partial
      issue: >-
        structured_output_payload に layoutPatchDraft 等はあるが、replacement clone と clone-as-new topology を
        JSON payload 上で混同しないための entry_mode / clone_mode / lineage_only / replacement_authority guard が無い。
    admin_helper_projection:
      judgment: partial
      issue: >-
        viewer-only 禁止事項はあるが、clone lifecycle viewer として source evidence / blocker /
        backend authority / replacement-vs-lineage badge を表示する contract が無い。
    provenance_boundary:
      judgment: partial
      issue: >-
        origin_kind はあるが admin-console-workflow 正本の draft_origin vocabulary
        manual_new / manual_clone_replacement / manual_clone_new_topology / sql_attention_candidate と接続していない。
    user_facing_message_policy:
      judgment: partial
      issue: >-
        AI/MCP は candidate evidence まで、反映権限なしという方針はあるが、replacement clone merge、
        stale source、backend authority をユーザーにどう伝えるかが無い。
    language_policy:
      judgment: partial
      issue: >-
        layout_patch / apply_or_promote の言い換えはあるが、clone lifecycle / source active /
        replacement merge / stale blocker の user-facing mapping が無い。
    helper_manual_category_candidates:
      judgment: partial
      issue: >-
        admin_authoring_flow / mcp_topology_authoring_draft / ui_builder_authoring はあるが、
        clone lifecycle / replacement merge authority を扱う category または subcategory が無い。
    safety_boundary:
      judgment: partial
      issue: >-
        helper_projection_is_view_only はあるが、source evidence only / candidate only /
        no frontend merge authority / layout_patch_apply_not_replacement_merge が無い。
    relation_to_other_ssot:
      judgment: partial
      issue: >-
        admin_console_workflow_ssot を参照しているが、clone lifecycle block を正本追従対象として明示していない。

  contract_gap_list:
    - helper_reference_artifact.required_top_level_fields_lacks_admin_clone_lifecycle_vocabulary
    - mcp_payload_can_confuse_replacement_clone_and_clone_as_new_topology
    - origin_kind_not_mapped_to_admin_draft_origin_and_clone_mode
    - source_active_evidence_not_required_for_replacement_clone_reference
    - source_evidence_and_lineage_evidence_not_explicitly_denied_as_replacement_authority
    - replacement_merge_intent_missing
    - backend_merge_authority_missing
    - stale_source_and_merge_target_blocker_vocabulary_missing
    - diff_or_log_evidence_not_required_for_replacement_merge_reference
    - layoutPatchDraft_not_explicitly_separated_from_production_manifest_replacement_merge
    - sql_attention_candidate_not_explicitly_prevented_from_mass_draft_or_auto_merge_authority

  schema_seed_candidate_fields:
    required_or_strong_candidates:
      - authoring_lifecycle
      - entry_mode
      - draft_origin
      - clone_mode
      - source_active_manifest_id
      - source_active_evidence
      - source_active_topologySystemName
      - source_active_routeKey
      - source_active_dispatcher_axes
      - source_active_updated_at_or_version
      - source_active_topology_hash_or_diff_base
      - lineage_evidence_only
      - replacement_authority
      - replacement_merge_intent
      - replacement_merge_allowed
      - replacement_merge_blockers
      - stale_source_blocker
      - active_identity_conflict_blocker
      - merge_target_active_uuid_mismatch_blocker
      - backend_merge_authority
      - frontend_authority_boundary
      - required_validation_result
      - required_diff_or_log_evidence
      - merge_physical_effect
      - draft_row_delete_after_successful_merge
      - layout_patch_draft_boundary
      - layout_patch_apply_is_not_manifest_replacement_merge
      - sql_attention_candidate_boundary
      - candidate_to_draft_adoption_policy
      - candidate_source_is_not_replacement_authority

  design_change_scope:
    target_files:
      - docs/design/user-facing-helper-manual-ssot.yaml
      - .agent/tasks/todo.md
    target_blocks_existing_update:
      - helper_reference_artifact
      - mcp_topology_authoring_draft_reference
      - admin_helper_projection
      - provenance_boundary
      - user_facing_message_policy
      - language_policy
      - helper_manual_category_candidates
      - safety_boundary
      - relation_to_other_ssot
    target_blocks_new:
      - admin_topology_clone_lifecycle_reference_contract
      - replacement_merge_authority_boundary
      - sql_attention_candidate_reference_boundary
      - layout_patch_draft_vs_manifest_replacement_boundary
    implementation_after_design_change_only:
      - docs/helper/helper-manual.schema.json
      - docs/helper/helper-manual.seed.json
      - admin helper viewer implementation
      - schema / seed tests

  todo_gap:
    current_status: helper-manual is not_started
    issue: >-
      .agent/tasks/todo.md の helper-manual Bundle は schema/seed未実装、payload example、viewer、origin混同禁止までで、
      最新 admin clone lifecycle を helper reference artifact contract に追従させる design gap が不足している。
    required_todo_update: >-
      helper-manual Bundle に、schema/seed実装前の design_change prerequisite として、
      admin clone lifecycle 語彙・replacement merge authority・source evidence boundary・SQL Attention candidate boundary・
      layout_patch apply boundary を追記する。

  next_prompt_viability:
    design_change_prompt_can_be_issued: true
    reason: >-
      admin-console-workflow-ssot 側の正本設計は明確であり、追加質問不要。
      次 Agent は本ファイルと正本SSOTを読み、user-facing-helper-manual-ssot.yaml と todo.md を design_change で補強する。

# diff_ref はこの一時ファイルの末尾に置く。apply-ready ではなく design_change Agent 用の semantic diff reference。
diff_ref: |
  diff --git a/docs/design/user-facing-helper-manual-ssot.yaml b/docs/design/user-facing-helper-manual-ssot.yaml
  --- a/docs/design/user-facing-helper-manual-ssot.yaml
  +++ b/docs/design/user-facing-helper-manual-ssot.yaml
  @@
     helper_reference_artifact:
       required_top_level_fields:
         - id
