  +      - diff_or_log_evidence
  +      - layout_patch_boundary
  +      - sql_attention_candidate_boundary
         - review_state
         - internal_terms
         - user_facing_terms
         - mcp_draft_payload_hints
  @@
       invariant:
         - helper_artifact_is_data_defined_reference_not_authority
         - helper_artifact_must_not_contain_secret_endpoint_credential_or_raw_sql
         - helper_artifact_must_reference_canonical_ssot_for_runtime_semantics
         - helper_artifact_must_distinguish_ai_mcp_candidate_origin_from_human_admin_manual_draft
  +      - helper_artifact_must_preserve_admin_clone_lifecycle_vocabulary
  +      - helper_artifact_must_not_treat_source_evidence_or_lineage_as_replacement_authority
  +      - helper_artifact_must_not_treat_layout_patch_apply_as_manifest_replacement_merge
  +      - helper_artifact_must_not_treat_sql_attention_candidate_as_draft_or_merge_authority
  +
  +  admin_topology_clone_lifecycle_reference_contract:
  +    description: >-
  +      helper reference artifact が /admin/contents Step 1 の topology authoring lifecycle を
  +      MCP / Agent / admin helper へ誤解なく伝えるための JSON contract 語彙。
  +      正本は docs/design/admin-console-workflow-ssot.yaml であり、本ブロックは reference projection のみ。
  +    entry_mode_values:
  +      - create_new_topology
  +      - clone_active_as_replacement_draft
  +      - clone_active_as_new_topology_draft
