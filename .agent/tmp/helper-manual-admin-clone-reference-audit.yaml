   ## Bundle `helper-manual`
  
   **Status:** not_started
   **Roadmap/status SSOT:** `product.helper_manual_policy`
   **Primary SSOT:** `docs/design/user-facing-helper-manual-ssot.yaml`
  +**Design prerequisite:** latest admin clone / draft lifecycle contract追従
  
   目的:
   helper/manual をユーザー向け文章方針だけでなく、人間 / Agent / MCP / External AI / Local LLM / admin UI が共通参照する helper reference artifact として実装可能にする。現行MCPの import-candidate / draft_operation / commit_candidate lane に topology authoring draft を載せる参照点を作り、admin では同じ内容を viewer として表示する。
  
   残問題:
  +- `docs/design/user-facing-helper-manual-ssot.yaml` が最新 `admin-console-workflow-ssot.yaml` の clone / draft lifecycle を JSON reference artifact contract としてまだ受け止め切れていない。
  +- `helper_reference_artifact` の required fields に `draft_origin` / `clone_mode` / `source_active_manifest_id` / `source_active_evidence` / `replacement_merge_intent` / `replacement_merge_blockers` / `backend_merge_authority` / `diff_or_log_evidence` が不足している。
  +- replacement clone と clone-as-new topology が MCP / Agent structured output payload 上で混同されないための contract が不足している。
  +- source evidence / lineage evidence だけで replacement authority を得る誤解を防ぐ schema / seed 前提の語彙が不足している。
  +- SQL Attention candidate が draft row / production merge authority に化けないための helper reference boundary が不足している。
  +- `layoutPatchDraft` / `layout_patch:apply` が production manifest replacement merge と誤読されないための helper reference boundary が不足している。
   - `helper_reference_artifact` の schema / seed がまだ無い。
   - MCPで topology authoring draft を構築する際の `structured_output_payload` / `assigned_business_object_candidate` / `assignment_target_scope` / `preview_diff` / `unresolved_fields` の具体例が未実装。
   - admin 共通ヘッダから開く helper viewer が未実装。
   - helper viewer が admin submit / apply / promote / approval を実行しない projection-only surface であることを実装上確認する guard が無い。
   - AI/MCP由来 candidate evidence と人間の admin 手作業 draft の origin を混同しない表示・保存・監査境界が未検証。
  
   改善方針:
  -implementation_change で、SSOTに従って helper schema / seed artifact を追加し、admin common header から Drawer helper viewer を開けるようにする。viewer は検索・カテゴリ選択・tree viewer・detail modal mount までに限定し、runtime/admin/MCP authority を持たせない。MCP新規tool surfaceは作らず、既存 import-candidate lane の payload reference として実装する。
  +まず design_change で `docs/design/user-facing-helper-manual-ssot.yaml` を最新 admin clone / draft lifecycle に追従させる。helper reference artifact の required fields、MCP structured output payload guidance、admin helper projection viewer、provenance boundary、language policy、safety boundary に、replacement clone / clone-as-new / SQL Attention candidate / layout_patch boundary の語彙を追加する。その後 implementation_change で helper schema / seed artifact と admin helper viewer を実装する。viewer は検索・カテゴリ選択・tree viewer・detail modal mount までに限定し、runtime/admin/MCP authority を持たせない。MCP新規tool surfaceは作らず、既存 import-candidate lane の payload reference として実装する。
  
   残受入条件:
  +- [ ] user-facing-helper-manual SSOT が admin Step 1 entry modes / draft_origin / clone_mode / source evidence / replacement merge authority を JSON reference artifact contract として表現している。
  +- [ ] Replacement clone and clone-as-new topology cannot be confused in helper artifact / MCP payload guidance.
  +- [ ] Source evidence / lineage evidence alone cannot grant replacement authority.
  +- [ ] Replacement merge requires backend authority, validation, diff/log evidence, stale source check, and active identity conflict check.
  +- [ ] `layoutPatchDraft` / `layout_patch:apply` is not treated as production manifest replacement merge.
  +- [ ] SQL Attention candidate remains candidate/evidence until explicit adoption and cannot auto-create draft rows or merge to active.
   - [ ] helper schema / seed artifact が追加され、SSOTの required fields を満たしている。
   - [ ] helper seed に admin authoring flow / MCP topology authoring draft / UI Builder / CI Attention / approval boundary のカテゴリがある。
   - [ ] internal vocabulary と user-facing vocabulary の対応が helper artifact に定義されている。
