# structure-map.yaml — Repository Structure Overview
#
# Agent-facing SSOT for understanding the topolactor repository layout.
# For executable path requirements, see required-paths.yaml.
# For architecture rules, see .agent/rules/rule.md.

repository: topolactor
description: >
  Data-driven topology runtime for DB-backed applications.
  Architecture subject: data-defined topology.
  Not CRUD, not MVC, not conventional layered architecture.

layers:
  db:
    role: semantic_topology_space
    path: db/
    description: >
      Stores registries, relations, schemas, packages, function parameters,
      converged entity data, diff logs, and promotion policies.
      Authority for data-defined topology.
    files:
      - db/schema.sql
      - db/topology_tables.sql
      - db/promotion_tables.sql
      - db/sql_attention_logs_tables.sql
      - db/seed_empty.sql
      - docs/design/relation-registry-fk-audit-and-abstract-migration.md

  backend:
    role: abstract_runtime
    path: backend/
    description: >
      Receives user operations, resolves operation vectors and attractors,
      binds stored function parameters, validates runtime state, emits responses.
      No physical UI rendering. No silent fallback.
    directories:
      endpoint: backend/endpoint/       # thin HTTP boundary
      runtime:  backend/runtime/        # canonical runtime executor
      mapper:   backend/mapper/         # semantic mapping (not ORM)
      repository: backend/repository/   # persistence boundary
      guard:    backend/guard/          # permission and safety guards
      schema:   backend/schema/         # data and runtime contract schemas

  frontend:
    role: physical_projection_space
    path: frontend/
    description: >
      Fresh / Deno / Preact physical projection layer.
      Projects UI from packages, schemas, and component expansions.
      Route is a projection entrypoint, not domain logic.
    directories:
      routes:     frontend/routes/      # Fresh route projection entrypoints
      islands:    frontend/islands/     # local interaction points
      components: frontend/components/  # atomic UI components
      package:    frontend/package/     # UI component package groups
      schema:     frontend/schema/      # UI element and wiring schemas
      registry:   frontend/registry/    # frontend runtime registry
      runtime:    frontend/runtime/     # frontend runtime executor
      api:        frontend/api/         # backend contract clients

  infra:
    role: local_demo_runtime_hosting_boundary
    path: infra/
    description: >
      Local/demo/bootstrap hosting boundary for compose-based service wiring.
      Defines PostgreSQL, backend, frontend, nginx, and adminer bootstrap composition
      for local validation flows. This layer is not runtime policy authority and does
      not own topology semantics.
    files:
      - infra/docker-compose.yml  # compose runtime bootstrap / local demo hosting / service wiring SSOT
      - infra/nginx.conf          # frontend/backend routing boundary for local reverse proxy
      - infra/.env.example        # local compose env template

  articles:
    role: public_article_surface
    path: articles/
    description: >
      Zenn-compatible public article drafts. These files are explanatory surfaces,
      not authoritative implementation SSOT.

  agent:
    role: local_structure_guard
    path: .agent/
    description: >
      Agent-facing documentation, rules, skills, checks, tasks, and reports.
      The check script is the executable SSOT for structure validation.
    directories:
      docs:     .agent/docs/      # agenda resume/index; ssot-map.yaml maps change surfaces to docs/ SSOT
      rules:    .agent/rules/     # architecture behavior rules
      protocols: .agent/protocols/ # procedure protocols / expanded verification guidance
      skills:   .agent/skills/    # agent skill notes
      tests:    .agent/tests/     # local check scripts
      tools:    .agent/tools/     # Agent read-only repo observation entrypoints; no mutation/proof/semantic judgment
      scripts:  .agent/scripts/   # CI/gate/helper implementation bodies; reusable structured processing
      tmp:      .agent/tmp/       # temporary scenario contract surface (tmp.txt is non-persistent)
      tasks:    .agent/tasks/     # remaining task list
      reports:  .agent/reports/   # persistent routine inspection / scheduled maintenance / periodic audit reports

canonical_flow:
  - stored_topology_data
  - user_operation
  - operation_vector
  - attractor_resolve
  - structure_map_resolve
  - package_resolve
  - schema_resolve
  - component_expand
  - emission_or_projection


recursive_verification_gate:
  role: "blocks completion on audit failures and forces fix-and-reverify loop within scope"
  surfaces:
    - ".agent/protocols/completion.md"
    - ".agent/protocols/policy-judgment.md"
    - ".agent/protocols/scenario-contract.md"
    - ".agent/protocols/runtime-boundary-matrix.md"


design_ssot:
  role: design_and_machine_readable_ssot_registry
  description: >
    Design SSOT surfaces used for implementation judgment.
    Public article surfaces under articles/* are explanatory and are not authoritative implementation SSOT.
  files:
    - path: docs/design/sql-attention-logs-ssot.md
      role: design_ssot
    - path: docs/design/sql-attention-logs-ssot.yaml
      role: machine_readable_ssot
