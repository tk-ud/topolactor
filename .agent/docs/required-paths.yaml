# required-paths.yaml — Structure Check Manifest SSOT
#
# This file is the canonical machine-readable enumeration input for
# .agent/tests/check-structure.sh:
#   - required_directories: directories that must exist
#   - required_files: files that must exist (including .github/workflows/*.yml)
#   - required_content_terms: literal terms that must appear in the listed file
#
# .agent/tests/check-structure.sh reads this manifest and executes the checks;
# the shell script is the check executor/orchestrator, this manifest is the
# enumeration source of truth. Complex guards (forbidden terms, semantic drift
# guards, DB-specific structural guards, awk-based section checks) intentionally
# stay in the shell script and are NOT manifest-driven.
#
# Parsing contract (bash/awk, no yq):
#   - top-level sections end with ':' at column 0
#   - group keys are indented 2 spaces (grouping is documentation only)
#   - path list items are indented 4 spaces ('    - path')
#   - in required_content_terms, file keys are indented 2 spaces and terms are
#     double-quoted list items indented 4 spaces
#   - terms must not contain double quotes, backslashes, or tabs
#
# Boundary notes:
#   - Being listed here is not a signal to read all docs/ content; read routing
#     stays with .agent/docs/ssot-map.yaml and worktype prompts.
#   - Temporary Scenario Contract artifacts live under .agent/tmp/ and only
#     .agent/tmp/.gitkeep may remain tracked; check-structure.sh enforces this
#     directly (state check, not manifest enumeration).
#   - Runtime Boundary Failure Matrix and routine inspection surfaces are
#     routed via .agent/protocols/runtime-boundary-matrix.md and
#     .agent/protocols/report-surfaces.md.
#   - docs/system-roadmap.yaml and .agent/tasks/todo.md are dynamic reference
#     points, not implementation-state authority; they are intentionally not
#     treated as SSOT by .agent/tests/check-docs-ssot-connectivity.sh.

