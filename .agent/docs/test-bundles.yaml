# test-bundles.yaml — reverse lookup for docs/design/test-proof-manifest-ssot.yaml
#
# Boundary:
#   - This file is NOT the proof SSOT.
#   - The authoritative proof graph, proof_order, proof_type, field semantics,
#     known gaps, and missing SSOT handling live in docs/design/test-proof-manifest-ssot.yaml.
#   - This file only helps agents map roadmap/test-bundle labels to proof_id entries.

version: 2
authority_boundary:
  ssot: docs/design/test-proof-manifest-ssot.yaml
  role: reverse_lookup_index_only
  prohibited_use:
    - Do not claim proof completion from this file alone.
    - Do not add SSOT/seed/implementation paths to test_files here; use manifest fields in the SSOT.
    - Do not override proof_type, proof_order, depends_on, or known_gap state from this file.

reverse_lookup:
  - bundle_id: test-proof-manifest-ci-gate
    roadmap_bundle_refs:
      - test-proof-manifest-ci-gate
    proof_refs:
      - ssot_structure_policy_contract
      - db_schema_seed_contract
      - backend_runtime_function_contract
      - backend_runtime_integration_contract
      - runtime_trigger_scheduler_contract
      - manifest_dispatch_runtime_route_contract
      - external_intake_surface_contract
      - external_bundle_specific_proofs_gap
      - instance_substrate_contract_gap
      - admin_registration_promotion_contract
      - admin_projection_readback_contract
      - frontend_projection_expression_contract
      - frontend_admin_projection_expression_e2e_contract
    runner_surfaces:
      - .agent/tests/check-test-proof-manifest-integrity.sh
      - .agent/tests/check-unified-test-gate.sh
      - .agent/tests/check-structure.sh
    proves_lookup_for:
      - system-wide proof graph integrity
      - CI audit wiring for the manifest itself
    does_not_prove:
      - frontend/admin E2E completion
      - any known_gap edge listed by proof_type in the SSOT

  - bundle_id: db_schema_seed_contract
    proof_refs:
      - db_schema_seed_contract
    runner_surfaces:
      - .agent/tests/check-db-schema.sh
      - .agent/tests/check-unified-test-gate.sh
    does_not_prove:
      - runtime behavior from seed presence alone

  - bundle_id: backend_runtime_contracts
    proof_refs:
      - backend_runtime_function_contract
      - backend_runtime_integration_contract
    runner_surfaces:
      - .agent/tests/check-backend-tests.sh
      - .agent/tests/check-runtime-semantics.sh
      - .agent/tests/check-unified-test-gate.sh
    does_not_prove:
      - scheduler/external/frontend behavior outside the listed SSOT proof edges

  - bundle_id: runtime_scheduler_and_dispatch_route
    proof_refs:
      - runtime_trigger_scheduler_contract
      - manifest_dispatch_runtime_route_contract
    runner_surfaces:
      - .agent/tests/check-runtime-semantics.sh
      - .agent/tests/check-unified-test-gate.sh
      - .agent/tests/check-projection-lane-seed-hardening.sh
    does_not_prove:
      - external connector implementation
      - instance authority enforcement
      - final frontend/admin E2E visual DOM completion

  - bundle_id: external_intake_bundle_gate
    roadmap_bundle_refs:
      - future-external-bundle-gate
    proof_refs:
      - external_intake_surface_contract
      - external_bundle_specific_proofs_gap
    runner_surfaces:
      - .agent/tests/check-test-proof-manifest-integrity.sh
    does_not_prove:
      - Notion/Sheets/Slack/GitHub/Webhook/REST connector behavior until gap proof edges are replaced by executable proofs

  - bundle_id: instance_substrate_gate
    proof_refs:
      - instance_substrate_contract_gap
    runner_surfaces:
      - .agent/tests/check-test-proof-manifest-integrity.sh
    does_not_prove:
      - instance settings topology, primitive authority, runtime instance selection, or execution authority enforcement

  - bundle_id: docs-ssot-connectivity-structure-manifest-and-ci-workflow-gate
    proof_refs:
      - ssot_structure_policy_contract
    runner_surfaces:
      - .agent/tests/check-docs-ssot-connectivity.sh
      - .agent/tests/check-structure.sh
    proves_lookup_for:
      - docs/ SSOT reachability from agent index/route/test/prompt/protocol/workflow surfaces
      - manifest-driven required path / required term structure gate wiring
      - workflow yml referenced-script existence
    does_not_prove:
      - semantic sufficiency of any mapped SSOT read set
      - implementation completion of any roadmap bundle

  - bundle_id: frontend-admin-projection-expression-e2e-completion
    roadmap_bundle_refs:
      - frontend-admin-projection-expression-e2e-completion
    proof_refs:
      - admin_registration_promotion_contract
      - admin_projection_readback_contract
      - frontend_projection_expression_contract
      - frontend_admin_projection_expression_e2e_contract
    runner_surfaces:
      - .agent/tests/check-frontend-all-tests.sh
      - .agent/tests/check-projection-lane-seed-hardening.sh
      - .agent/tests/check-test-proof-manifest-integrity.sh
    does_not_prove:
      - live browser click simulation against deployed admin route
      - unknown props global policy beyond existing projection constructor schema checks
