# test-bundles.yaml — roadmap completion bundle → test evidence index
#
# Purpose:
#   Agent-facing reverse-lookup map: given a roadmap completion bundle,
#   immediately find which tests prove which completion conditions
#   and what is explicitly NOT proven.
#
# Usage (PR audit):
#   1. Identify the roadmap unlock key or milestone (e.g., data_binding_to_document_canvas).
#   2. Look up bundle_id referenced in docs/system-roadmap.yaml test_bundle_refs.
#   3. Read test_files / test_cases / proves / does_not_prove.
#
# Boundary:
#   - This file is a lightweight index only. Not a SSOT for design or runtime rules.
#   - For SSOT read routing at task time, use ssot-map.yaml instead.
#   - pipeline-continuity-ssot.yaml already declares test_files per lane;
#     ssot_refs below point to those definitions rather than duplicating them.
#   - proves and does_not_prove MUST both be explicit to prevent over-claiming.
#   - test_cases use the exact Deno.test or [ClassName] test name strings.

version: 1

bundles:

  - bundle_id: projection_runtime_component_props_pipeline
    roadmap_bundle_refs:
      - data_binding_to_document_canvas
    ssot_refs:
      - docs/design/pipeline-continuity-ssot.yaml  # frontend_projection_constructor_lane
    test_files:
      - frontend/tests/projectionRuntime.test.ts
      - frontend/runtime/projectionRuntime.ts
      - frontend/runtime/renderEmission.ts
    test_cases:
      - file: frontend/tests/projectionRuntime.test.ts
        cases:
          - "projectionRuntime: projection event drives runtime component lane for component_projection"
    proves:
      - projection event drives constructProjection → componentDataHub.props → renderRuntimeComponents route at unit boundary
      - SSE projection event produces correct componentType via renderRuntimeComponents (uses form_input/search_input as representative kind)
    does_not_prove:
      - DocumentCanvas-specific field coordinate binding (see document_canvas_projection_constructor_field_validation bundle)
      - DB/JSONB label/value manifest runtime (jsonb_label_value_manifest_runtime is not_started)
      - DocumentCanvas DB binding policy
      - full data_binding_to_document_canvas loop with real DB-sourced field values
      - projection event from real SSE backend push (integration scope, not covered here)

  - bundle_id: document_canvas_runtime_factory_registration
    roadmap_bundle_refs:
      - document_canvas_runtime_connected_factory_registration
    ssot_refs:
      - docs/design/ui-ux-primitive-catalog-ssot.yaml
      - docs/design/pipeline-continuity-ssot.yaml  # frontend_projection_constructor_lane
    test_files:
      - frontend/tests/runtimePrimitiveRenderer.test.ts
      - frontend/runtime/runtimeComponentFactory.ts
    test_cases:
      - file: frontend/tests/runtimePrimitiveRenderer.test.ts
        cases:
          - "runtimePrimitiveRenderer: document_canvas/document_canvas_template_editor renders without event binding"
          - "runtimePrimitiveRenderer: document_canvas/document_canvas_template_editor renders with empty props"
          - "runtimePrimitiveRenderer: runtimeConnected catalog entries are renderer-reachable (interface reachability)"
    proves:
      - document_canvas/document_canvas_template_editor is registered in runtimeComponentFactory (runtimeConnected:true verified via renderer reachability)
      - renderRuntimeComponent renders document_canvas kind without error
      - all runtimeConnected:true catalog entries are renderer-reachable (factory registered)
    does_not_prove:
      - PDF export snapshot (separate bundle, not_started)
      - production report layout engine
      - DB-side component entity registration (registrationRequired:true entries require separate promotion)

  - bundle_id: document_canvas_projection_constructor_field_validation
    roadmap_bundle_refs:
      - document_canvas_runtime_connected_factory_registration
      - data_binding_to_document_canvas
    ssot_refs:
      - docs/design/pipeline-continuity-ssot.yaml  # frontend_projection_constructor_lane
      - docs/design/ui-ux-primitive-catalog-ssot.yaml
    test_files:
      - frontend/tests/projectionConstructor.test.ts
    test_cases:
      - file: frontend/tests/projectionConstructor.test.ts
        cases:
          - "constructProjection: document_canvas/document_canvas_template_editor supported with valid fields"
          - "constructProjection: document_canvas/document_canvas_template_editor without fields is valid"
          - "constructProjection: document_canvas fields non-array is explicit error"
          - "constructProjection: document_canvas field missing key is explicit error"
          - "constructProjection: document_canvas field x non-number is explicit error"
          - "constructProjection: document_canvas field value non-string is explicit error"
          - "constructProjection: document_canvas field y non-number is explicit error"
          - "constructProjection: document_canvas backgroundImageUrl non-string is explicit error"
    proves:
      - document_canvas/document_canvas_template_editor props normalization in projectionConstructor
      - backgroundImageUrl string validation is explicit error on non-string
      - fields array validation is explicit error on non-array
      - field.key non-empty string validation is explicit error when missing
      - field.x/y number validation is explicit error on non-number
      - field.value string validation is explicit error on non-string
      - malformed document_canvas props return explicit PROJECTION_CONSTRUCTOR_INVALID_* error (not silent fallback)
    does_not_prove:
      - runtime renderer factory registration (see document_canvas_runtime_factory_registration bundle)
      - DB/JSONB label/value manifest runtime (jsonb_label_value_manifest_runtime is not_started)
      - full DB/JSONB→canvas binding loop with real DB-sourced field values
      - PDF export snapshot

  - bundle_id: document_canvas_catalog_seed_ssot_consistency
    roadmap_bundle_refs:
      - document_canvas_runtime_connected_factory_registration
    ssot_refs:
      - docs/design/ui-ux-primitive-catalog-ssot.yaml
    test_files:
      - frontend/tests/documentCanvasCatalogCheck.test.ts
      - frontend/components/catalog.ts
      - db/seed_empty.sql
      - docs/design/ui-ux-primitive-catalog-ssot.yaml
    test_cases:
      - file: frontend/tests/documentCanvasCatalogCheck.test.ts
        cases:
          - "documentCanvasCatalogCheck: entry exists in COMPONENT_CATALOG_ENTRIES"
          - "documentCanvasCatalogCheck: sourcePath file exists"
          - "documentCanvasCatalogCheck: component is exported from frontend/components/index.ts"
          - "documentCanvasCatalogCheck: seed_empty.sql contains matching ui_component_bucket row"
          - "documentCanvasCatalogCheck: SSOT contains document_canvas_template_editor entry"
          - "documentCanvasCatalogCheck: catalog and seed classification fields match"
    proves:
      - catalog/seed/design SSOT classification fields are synchronized for document_canvas_template_editor
      - runtimeConnected/registrationRequired/lifecycleStatus/componentFamily/semanticRole/visualRole/capabilityTags match across catalog, seed, and SSOT
    does_not_prove:
      - runtime DB binding completion
      - projection pipeline correctness (classification consistency check only)
      - component behavioral semantics at runtime (renderer boundary not covered here)
