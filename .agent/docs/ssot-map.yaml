# ssot-map.yaml — Change-Surface to docs/ SSOT Mapping
#
# Purpose:
# - Provide task-time mapping from change surface to docs/ SSOT read set.
# - Keep this as resume/index (not docs bundle always-read).

version: 1

mapping:
  - work_type: repository_overview
    change_surfaces:
      - repository-level orientation
      - governance entry overview
    required_docs:
      - docs/agent-development-os.md
    supporting_docs: []
    protocols: []

  - work_type: framework_core_runtime_canonical_route
    change_surfaces:
      - backend/runtime/*
      - canonical route claims
      - runtime flow semantics
    required_docs:
      - docs/framework-core.yaml
    supporting_docs: []
    protocols: []

  - work_type: policy_scoring_threshold_routing_validation_projection
    change_surfaces:
      - runtime policy values
      - scoring thresholds
      - routing or validation behavior
      - projection behavior
    required_docs:
      - docs/framework-policy.yaml
    supporting_docs: []
    protocols:
      - .agent/protocols/policy-judgment.md

  - work_type: file_structure_required_path_directory_governance
    change_surfaces:
      - repository structure checks
      - required paths
      - directory governance surfaces
    required_docs:
      - docs/file-structure.yaml
    supporting_docs: []
    protocols: []

  - work_type: registrar_admin_ui_registry_registration
    change_surfaces:
      - registrar admin UI
      - registry registration boundary
    required_docs:
      - docs/registrar-admin-ui-specification.md
    supporting_docs: []
    protocols:
      - .agent/protocols/runtime-boundary-matrix.md

  - work_type: promotion_manifest_disclosure_manifest_editing
    change_surfaces:
      - promotion manifest editor
      - disclosure requirements
      - manifest editing boundary
    required_docs:
      - docs/promotion-manifest-editor-specification.md
    supporting_docs: []
    protocols: []

  - work_type: relation_registry_fk_abstract_migration
    change_surfaces:
      - relation registry
      - foreign key policy
      - abstract migration semantics
    required_docs:
      - docs/design/relation-registry-fk-audit-and-abstract-migration.md
    supporting_docs: []
    protocols: []

  - work_type: context_route_recommendation_sql_attention_registry_tensor
    change_surfaces:
      - context route recommendation
      - SQL Attention behavior
      - registry tensor semantics
    required_docs:
      - docs/design/context-route-recommendation.md
      - docs/design/context-route-recommendation.yaml
    supporting_docs:
      - docs/framework-policy.yaml
    protocols:
      - .agent/protocols/registry-tensor-policy.md

  - work_type: runtime_orchestration_scheduler_dispatcher_projection_topology_runtime
    change_surfaces:
      - runtime orchestration os
      - runtime_timeline_scheduler
      - runtime_queue_scheduler
      - manifest_dispatcher
      - backend/Program.cs
      - backend/endpoint/DispatchEndpoint.cs
      - backend/runtime/*
      - backend/jobs/*
      - frontend api trigger lane
      - frontend sse projection lane
      - frontend/api/dispatch.ts
      - frontend/runtime/*
      - frontend/routes/*
      - backend topology transform runtime
      - topology payload vector conversion and json linking
      - topology_function_binder mapping and runtime mapping
      - projection_constructor mapping
      - manifest authority over role dispatcher runtime topology_function_binding
    required_docs:
      - docs/design/runtime-orchestration-ssot.yaml
    supporting_docs:
      - docs/framework-core.yaml
      - docs/framework-policy.yaml
      - docs/design/context-route-recommendation.md
      - docs/design/db-schema.yaml
    protocols: []

  - work_type: db_schema_table_structure_manifest
    change_surfaces:
      - db/*.sql
      - db/schema.sql
      - db/topology_tables.sql
      - db/promotion_tables.sql
      - db/context_route_tables.sql
      - db/ui_topology_tables.sql
      - db/manifest_tables.sql
      - manifest table
      - topology_definition tables
      - context_route tables
      - ui_topology tables
    required_docs:
      - docs/design/db-schema.yaml
    supporting_docs:
      - docs/design/runtime-orchestration-ssot.yaml
    protocols: []
