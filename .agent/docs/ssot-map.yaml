# ssot-map.yaml — Change-Surface to docs/ SSOT Mapping
#
# Purpose:
# - Provide task-time mapping from change surface to docs/ SSOT read set.
# - Keep this as resume/index (not docs bundle always-read).

version: 1

notes:
  - For worktype `audit`, read top-level semantic baseline SSOT first (docs/framework-core.yaml, docs/framework-policy.yaml, docs/design/runtime-orchestration-ssot.yaml, docs/design/pipeline-continuity-ssot.yaml) before using this map for surface-specific discovery.

