version: 1
purpose: Worktype-to-prompt/protocol/check executable routing map

worktypes:
  audit:
    prompt: .agent/prompt/audit.md
    required_protocols:
      - .agent/protocols/audit.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh

  specific:
    prompt: .agent/prompt/specific.md
    required_protocols:
      - .agent/protocols/specific.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-structure.sh

  implementation_change:
    prompt: .agent/prompt/implementation-change.md
    required_protocols:
      - .agent/protocols/implementation-change.md
    triggered_protocols:
      runtime_persistence_projection_changes:
        - .agent/protocols/scenario-contract.md
      policy_scoring_threshold_changes:
        - .agent/protocols/policy-judgment.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh

  design_change:
    prompt: .agent/prompt/design-change.md
    required_protocols:
      - .agent/protocols/design-change.md
    triggered_protocols:
      ssot_change:
        - .agent/protocols/ssot-change-impact.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh

  todo_maintenance:
    prompt: .agent/prompt/todo-maintenance.md
    required_protocols:
      - .agent/protocols/todo-carry-over.md
    required_checks:
      - .agent/tests/check-structure.sh

  existing_pr_update:
    prompt: .agent/prompt/existing-pr-update.md
    required_protocols:
      - .agent/protocols/completion-summary.md
    required_checks:
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh
