version: 1
purpose: Worktype-to-prompt/protocol/check executable routing map

agent_ui_tool_entry:
  tool_first: .agent/tools/agent-ui-initial-contract
  local_test: .agent/tools/agent-ui-local-test
  rule: >-
    When the Agent UI tool is usable, resolve worktype/prompt routing via
    agent-ui-initial-contract's worktypes/start subcommands instead of
    manually reading this file end to end. This routing map stays the
    fallback reference and the executable prompt/protocol/check source of
    truth either way; the tool reads this same file, it does not replace it.

worktypes:
  audit:
    prompt: .agent/prompt/audit.md
    protocol_sections_dir: .agent/protocols/audit
    required_protocols:
      - .agent/protocols/audit.md
      - .agent/protocols/audit/index.md
    triggered_protocols:
      todo_roadmap_finalization:
        - .agent/protocols/todo-carry-over.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh

  specific:
    prompt: .agent/prompt/specific.md
    protocol_sections_dir: .agent/protocols/specific
    required_protocols:
      - .agent/protocols/specific.md
      - .agent/protocols/specific/index.md
    triggered_protocols:
      todo_roadmap_finalization:
        - .agent/protocols/todo-carry-over.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-structure.sh

  implementation_change:
    prompt: .agent/prompt/implementation-change.md
    protocol_sections_dir: .agent/protocols/implementation-change
    required_protocols:
      - .agent/protocols/implementation-change.md
      - .agent/protocols/implementation-change/index.md
    triggered_protocols:
      runtime_persistence_projection_changes:
        - .agent/protocols/scenario-contract.md
      policy_scoring_threshold_changes:
        - .agent/protocols/policy-judgment.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh

  design_change:
    prompt: .agent/prompt/design-change.md
    protocol_sections_dir: .agent/protocols/design-change
    required_protocols:
      - .agent/protocols/design-change.md
      - .agent/protocols/design-change/index.md
    triggered_protocols:
      ssot_change:
        - .agent/protocols/ssot-change-impact.md
    required_checks:
      - .agent/tests/check-worktype-routing.sh
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh

  todo_maintenance:
    prompt: .agent/prompt/todo-maintenance.md
    protocol_sections_dir: .agent/protocols/todo-maintenance
    required_protocols:
      - .agent/protocols/todo-carry-over.md
      - .agent/protocols/todo-maintenance/index.md
    required_checks:
      - .agent/tests/check-system-roadmap.sh
      - .agent/tests/check-structure.sh

  existing_pr_update:
    prompt: .agent/prompt/existing-pr-update.md
    protocol_sections_dir: .agent/protocols/existing-pr-update
    required_protocols:
      - .agent/protocols/completion-summary.md
      - .agent/protocols/existing-pr-update/index.md
    required_checks:
      - .agent/tests/check-completion-judgment.sh
      - .agent/tests/check-structure.sh
