version: 2
purpose: "Section-level grep route for condition-triggered protocol reading. This is not a judgment SSOT."
usage:
  - "Use only to locate protocol files and target sections after a trigger or work-type route selects a protocol."
  - "Do not use grep hit as PASS/FAIL judgment."
  - "Protocol body remains the judgment source."
  - "Do not read the whole protocol bundle by default."

protocols:
  - id: completion-governance
    file: .agent/protocols/completion.md
    stage:
      - JUDGMENT
    sections:
      - marker: "## Trigger condition"
        grep_keys: ["completion eligibility","TODO `[x]`"]
        read_when: ["completion eligibility decision"]
    related_surfaces:
      - .agent/protocols/completion-summary.md
      - .agent/protocols/todo-carry-over.md
      - .agent/protocols/report-surfaces.md

  - id: todo-carry-over
    file: .agent/protocols/todo-carry-over.md
    stage: [PUSH_OR_PR]
    sections:
      - marker: "## TODO surface responsibility"
        grep_keys: ["todo","carry-over","remaining TODO","close candidate","roadmap","auditor finalizer"]
        read_when: ["remaining work classification"]

  - id: report-surfaces
    file: .agent/protocols/report-surfaces.md
    stage: [PUSH_OR_PR]
    sections:
      - marker: "## `.agent/reports/` usage"
        grep_keys: ["reports","routine inspection","scheduled maintenance","periodic audit",".agent/reports"]
        read_when: ["report placement routing"]

  - id: completion-summary
    file: .agent/protocols/completion-summary.md
    stage: [JUDGMENT, PUSH_OR_PR]
    sections:
      - marker: "## Completion Summary Template"
        grep_keys: ["Completion Summary Template","final completion summary","WorkEvent","output sink","PR_COMMENT_NOT_POSTED","Required check scope"]
        read_when: ["terminal completion summary composition"]
  - id: scenario-contract
    file: .agent/protocols/scenario-contract.md
    stage:
      - SCENARIO_CONTRACT
      - VERIFY_SCENARIO_DIFF
    sections:
      - marker: "## Trigger scope"
        grep_keys:
          - "runtime claim"
          - "canonical route"
          - "persistence behavior"
          - "projection behavior"
        read_when:
          - "scenario-contract trigger check"
      - marker: "## Precondition: Workflow Order Invariant Gate"
        grep_keys:
          - "docs/ SSOT reload"
          - "READ_TARGET_SURFACES"
          - "DEFINE_SCOPE"
        read_when:
          - "pre-implementation workflow validation"
      - marker: "## Position in completion sequence"
        grep_keys:
          - "Recursive Verification Gate"
          - "VERIFY_SCENARIO_DIFF"
        read_when:
          - "completion-sequence positioning"
      - marker: "## Boundary Extension Scenario"
        grep_keys:
          - "Boundary Extension Scenario"
          - "Multi-instance leakage"
          - "Frontend projection identity"
          - "UI action identity"
        read_when:
          - "boundary extension / leakage scenario handling"

  - id: boundary-identity
    file: .agent/protocols/runtime-boundary-matrix.md
    stage:
      - FILL_CHECKLISTS
      - JUDGMENT
    sections:
      - marker: "## Workflow Guard"
        grep_keys:
          - "Use this protocol only in FILL_CHECKLISTS or JUDGMENT stages"
        read_when:
          - "workflow-stage gating for boundary protocol"
      - marker: "## Trigger scope"
        grep_keys:
          - "endpoint wiring"
          - "frontend API proxy wiring"
          - "repository write"
          - "persistence mutation"
          - "DB-backed registry operation"
          - "End-to-End Boundary Identity"
          - "Frontend projection identity"
          - "UI action identity"
        read_when:
          - "boundary identity trigger confirmation"
          - "boundary checklist preparation"

  - id: policy-judgment
    file: .agent/protocols/policy-judgment.md
    stage:
      - FILL_CHECKLISTS
      - JUDGMENT
    sections:
      - marker: "## Workflow Guard"
        grep_keys:
          - "Policy Judgment Gate"
          - "Recursive Verification Gate"
        read_when:
          - "workflow-stage gating for policy protocol"
      - marker: "## Trigger scope"
        grep_keys:
          - "runtime/policy-affecting value"
          - "scoring"
          - "threshold"
          - "routing"
          - "validation"
          - "projection behavior"
        read_when:
          - "policy change trigger confirmation"
          - "policy checklist preparation"
      - marker: "Violation table:"
        grep_keys:
          - "Violation table"
          - "policy violation"
          - "CI queued/in_progress is not PASS"
        read_when:
          - "policy violation判定"
          - "CI state handling for policy judgment"

  - id: registry-topology-semantics
    file: .agent/protocols/registry-tensor-policy.md
    stage:
      - READ_TARGET_SURFACES
      - DEFINE_SCOPE
      - JUDGMENT
    sections:
      - marker: "## Trigger scope"
        grep_keys:
          - "registry tensor semantics"
          - "semantic matrix"
        read_when:
          - "registry-topology protocol trigger check"
      - marker: "## Purpose"
        grep_keys:
          - "projection semantics"
          - "registry topology"
        read_when:
          - "registry-topology intent alignment"
      - marker: "## Mandatory interpretation"
        grep_keys:
          - "tensor basis / vector basis"
          - "registry table must be explained as semantic matrix"
        read_when:
          - "mandatory interpretation confirmation"
      - marker: "## Projection surface map"
        grep_keys:
          - "Projection surface map"
          - "projection surfaces"
        read_when:
          - "projection mapping checks"
      - marker: "## SQL Attention interpretation"
        grep_keys:
          - "SQL Attention"
        read_when:
          - "SQL interpretation checks"
      - marker: "## Drift / GAP classification"
        grep_keys:
          - "Drift / GAP classification"
          - "drift"
          - "GAP"
        read_when:
          - "drift/gap classification review"


  - id: ssot-change-impact
    file: .agent/protocols/ssot-change-impact.md
    stage:
      - READ_TARGET_SURFACES
      - DEFINE_SCOPE
      - VERIFY_SCENARIO_DIFF
    sections:
      - marker: "## Trigger"
        grep_keys:
          - "docs/design"
          - "route"
          - "response"
          - "error"
          - "emission"
          - "projection"
          - "jump"
          - "persistence"
          - "externally observable contracts"
        read_when:
          - "SSOT update trigger confirmation"
      - marker: "## Required"
        grep_keys:
          - "reference surfaces"
          - "stale expectations"
          - "tests"
          - ".agent/tests"
          - "frontend contract tests"
          - "prompt routers"
          - "docs resume/index"
          - ".agent/tasks/todo.md"
        read_when:
          - "SSOT impact check execution"
      - marker: "## Prohibited"
        grep_keys:
          - "updating only SSOT body"
          - "detailed per-SSOT specifications"
          - "incident-specific"
        read_when:
          - "anti-bloat and stale-reference guard"
