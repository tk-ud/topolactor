version: 2
purpose: "Section-level grep route for condition-triggered protocol reading. This is not a judgment SSOT."
usage:
  - "Use only to locate protocol files and target sections after a trigger or work-type route selects a protocol."
  - "Work-type required routing map: .agent/routes/worktype-required-protocols.yaml"
  - "Do not use grep hit as PASS/FAIL judgment."
  - "Protocol body remains the judgment source."
  - "Do not read the whole protocol bundle by default."

protocols:
  - id: completion
    file: .agent/protocols/completion.md
    stage: [JUDGMENT]
    sections:
      - marker: "## Trigger condition"
        grep_keys:
          intent_keys: ["completion eligibility", "recursive verification gate", "required check scope"]
          body_keys: ["required check scope declaration", "WorkEvent output sink gap", "NOT EXECUTED ≠ PASS"]
          boundary_keys: ["not a substitute for protocol judgment", "structure check as semantic judgment"]
        read_when: ["completion eligibility decision"]

  - id: completion_summary
    file: .agent/protocols/completion-summary.md
    stage: [JUDGMENT, PUSH_OR_PR]
    sections:
      - marker: "## Completion Summary Template"
        grep_keys:
          intent_keys: ["PR follow-up comment", "manual paste unit", "Completion Summary全文", "existing_pr_update"]
          body_keys: ["WorkEvent", "output sink", "PR_COMMENT_NOT_POSTED", "Required check scope"]
          boundary_keys: ["final summary is required evidence output", "PR body update never replaces required PR follow-up comment"]
        read_when: ["terminal completion summary composition"]

  - id: todo_carry_over
    file: .agent/protocols/todo-carry-over.md
    stage: [PUSH_OR_PR]
    sections:
      - marker: "## TODO surface responsibility"
        grep_keys:
          intent_keys: ["remaining TODO", "carry over", "unresolved work"]
          body_keys: [".agent/tasks/todo.md", "Carry-over classification", "direct close conditions"]
          boundary_keys: ["not canonical TODO closure", "CI waiting records are not TODO"]
        read_when: ["remaining work classification"]

  - id: report_surfaces
    file: .agent/protocols/report-surfaces.md
    stage: [PUSH_OR_PR]
    sections:
      - marker: "## `.agent/reports/` usage"
        grep_keys:
          intent_keys: ["inspection report", "periodic audit", "report placement"]
          body_keys: [".agent/reports/", "routine inspection reports", "scheduled maintenance"]
          boundary_keys: ["not default place for normal PR summaries", "do not store PR-specific filled checklists"]
        read_when: ["report placement routing"]

  - id: scenario_contract
    file: .agent/protocols/scenario-contract.md
    stage: [SCENARIO_CONTRACT, VERIFY_SCENARIO_DIFF]
    sections:
      - marker: "## Trigger scope"
        grep_keys:
          intent_keys: ["scenario contract", "runtime boundary", "projection identity"]
          body_keys: ["Boundary Extension Scenario", "Multi-instance leakage", "Frontend projection identity"]
          boundary_keys: ["triggered protocol only", "do not silently skip boundary failures"]
        read_when: ["scenario-contract trigger check"]
      - marker: "## Precondition: Workflow Order Invariant Gate"
        grep_keys:
          intent_keys: ["workflow order invariant", "pre-implementation checks"]
          body_keys: ["docs/ SSOT reload", "READ_TARGET_SURFACES", "DEFINE_SCOPE"]
          boundary_keys: ["do not implement before invariant is satisfied"]
        read_when: ["pre-implementation workflow validation"]

  - id: policy_judgment
    file: .agent/protocols/policy-judgment.md
    stage: [FILL_CHECKLISTS, JUDGMENT]
    sections:
      - marker: "## Trigger scope"
        grep_keys:
          intent_keys: ["policy judgment", "scoring threshold", "routing validation projection"]
          body_keys: ["Policy Judgment Gate", "CI queued/in_progress is not PASS", "scope-irrelevant workflow-level skip is not blocking"]
          boundary_keys: ["checklist is not final judgment", "queued CI is not PASS"]
        read_when: ["policy change trigger confirmation"]

  - id: runtime_boundary_matrix
    file: .agent/protocols/runtime-boundary-matrix.md
    stage: [FILL_CHECKLISTS, JUDGMENT]
    sections:
      - marker: "## Trigger scope"
        grep_keys:
          intent_keys: ["runtime boundary failure", "end-to-end boundary identity", "leakage"]
          body_keys: ["Runtime Boundary Failure Matrix", "Repository mutation identity", "UI action identity"]
          boundary_keys: ["broken refs are explicit errors", "no silent fallback"]
        read_when: ["boundary identity trigger confirmation"]

  - id: registry_tensor_policy
    file: .agent/protocols/registry-tensor-policy.md
    stage: [READ_TARGET_SURFACES, DEFINE_SCOPE, JUDGMENT]
    sections:
      - marker: "## Trigger scope"
        grep_keys:
          intent_keys: ["registry tensor", "sql attention", "semantic matrix"]
          body_keys: ["registry tensor semantics", "Registry Tensor Policy", "Drift / GAP classification"]
          boundary_keys: ["registry table must be explained as semantic matrix", "not dictionary-only interpretation"]
        read_when: ["registry-topology protocol trigger check"]

  - id: ssot_change_impact
    file: .agent/protocols/ssot-change-impact.md
    stage: [READ_TARGET_SURFACES, DEFINE_SCOPE, VERIFY_SCENARIO_DIFF]
    sections:
      - marker: "## Trigger"
        grep_keys:
          intent_keys: ["SSOT", "docs/design", "contract", "projection", "persistence", "stale expectation", "impact propagation"]
          body_keys: ["externally observable contracts", "route / response / error / emission / projection / jump / persistence", "stale expectations"]
          boundary_keys: ["updating only SSOT body text", "must propagate impacted expectations"]
        read_when: ["SSOT update trigger confirmation"]

  - id: audit
    file: .agent/protocols/audit.md
    section_dir: .agent/protocols/audit
    stage: [JUDGMENT]
    sections:
      - marker: "## judgment_scope"
        shard: .agent/protocols/audit/03-judgment-scope.md
        grep_keys:
          intent_keys: ["audit", "semantic review", "diff review"]
          body_keys: ["semantic", "diff", "implementation meaning"]
          boundary_keys: ["structure check is not semantic audit substitute", "do not post GitHub comment when prompt output requested"]
        read_when: ["audit worktype judgment"]
      - marker: "## required_alignment_surfaces"
        shard: .agent/protocols/audit/02-required-alignment-surfaces.md
        grep_keys:
          intent_keys: ["PR record", "tool log", "alignment surfaces"]
          body_keys: ["PR body", "PR comments", "review thread", "docs/governance/logs/tool.log"]
          boundary_keys: ["trace/context surfaces only", "do not replace SSOT"]
        read_when: ["PR or tool evidence audit"]

  - id: specific
    file: .agent/protocols/specific.md
    section_dir: .agent/protocols/specific
    stage: [DEFINE_SCOPE, JUDGMENT]
    sections:
      - marker: "## judgment_scope"
        shard: .agent/protocols/specific/04-judgment-scope.md
        grep_keys:
          intent_keys: ["specific", "targeted inspection", "local scope"]
          body_keys: ["minimal target-surface", "scope expansion"]
          boundary_keys: ["do not read all docs by default", "do not expand beyond requested target"]
        read_when: ["specific worktype local-scope judgment"]

  - id: implementation_change
    file: .agent/protocols/implementation-change.md
    section_dir: .agent/protocols/implementation-change
    stage: [DEFINE_SCOPE, JUDGMENT]
    sections:
      - marker: "## blocking_conditions"
        shard: .agent/protocols/implementation-change/04-blocking-conditions.md
        grep_keys:
          intent_keys: ["implementation change", "conditional protocols", "runtime persistence projection"]
          body_keys: ["scenario-contract", "policy-judgment"]
          boundary_keys: ["trigger only matching protocols", "protocol owns judgment semantics"]
        read_when: ["implementation_change conditional protocol gate"]

  - id: design_change
    file: .agent/protocols/design-change.md
    section_dir: .agent/protocols/design-change
    stage: [DEFINE_SCOPE, JUDGMENT]
    sections:
      - marker: "## blocking_conditions"
        shard: .agent/protocols/design-change/03-blocking-conditions.md
        grep_keys:
          intent_keys: ["design change", "SSOT change", "impact propagation"]
          body_keys: ["SSOT change", "impact propagation"]
          boundary_keys: ["prompt routes worktype; protocol judges work", "do not mix directory map into protocol"]
        read_when: ["design_change impact gate"]
