# topolactor demo reverse proxy scaffold
#
# This file is for local/public-demo scaffolding only.
# It assumes services named `frontend` and `backend` when they are added to
# infra/docker-compose.yml in a later step.
#
# Routing policy:
# - /        -> Fresh/Deno frontend projection
# - /api/    -> backend runtime/API surface
#
# Do not put runtime behavior, recommendation thresholds, or topology policy here.
# Those belong in DB Registry / Manifest / function_parameters / structure_map policy.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream topolactor_frontend {
        server frontend:8000;
    }

    upstream topolactor_backend {
        server backend:5000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://topolactor_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://topolactor_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
