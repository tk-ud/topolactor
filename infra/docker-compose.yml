services:
  postgres:
    image: postgres:16-alpine
    container_name: topolactor-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: topolactor_demo
      POSTGRES_PASSWORD: topolactor_demo
      POSTGRES_DB: topolactor_demo
    ports:
      - "5432:5432"
    volumes:
      - topolactor_demo_pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/topology_tables.sql:/docker-entrypoint-initdb.d/02-topology_tables.sql:ro
      - ../db/promotion_tables.sql:/docker-entrypoint-initdb.d/03-promotion_tables.sql:ro
      - ../db/context_route_tables.sql:/docker-entrypoint-initdb.d/04-context_route_tables.sql:ro
      - ../db/seed_empty.sql:/docker-entrypoint-initdb.d/05-seed_empty.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topolactor_demo -d topolactor_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: topolactor-demo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  topolactor_demo_pgdata:
