services:
  postgres:
    image: postgres:16-alpine
    container_name: topolactor-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: topolactor_demo
      POSTGRES_PASSWORD: topolactor_demo
      POSTGRES_DB: topolactor_demo
    ports:
      - "5432:5432"
    volumes:
      - topolactor_demo_pgdata:/var/lib/postgresql/data
      - ../db:/db:ro
      - ../db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topolactor_demo -d topolactor_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: topolactor-demo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: topolactor-demo-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      BACKEND_PORT: "5000"
      # Required — set in infra/.env (copy infra/.env.example and fill in values).
      # /dispatch is always JWT-guarded; AUTH_JWT_SECRET_NOT_CONFIGURED is returned
      # when DEMO_JWT_SECRET is absent so the endpoint is never silently unauthenticated.
      DEMO_JWT_SECRET: "${DEMO_JWT_SECRET}"
      DEMO_JWT_EXPIRY_HOURS: "${DEMO_JWT_EXPIRY_HOURS}"
      # Optional — defaults to "topolactor-demo" if not set
      DEMO_JWT_ISSUER: "${DEMO_JWT_ISSUER:-topolactor-demo}"
      # Seed Runtime storage path — Issue #84. Defaults to /storage (volume-mounted below).
      SEED_STORAGE_PATH: "/storage"
    volumes:
      - topolactor_seed_storage:/storage
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: topolactor-demo-frontend
    restart: unless-stopped
    environment:
      DEMO_BACKEND_URL: "${DEMO_BACKEND_URL:-http://backend:5000}"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: topolactor-demo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  topolactor_demo_pgdata:
  topolactor_seed_storage:
