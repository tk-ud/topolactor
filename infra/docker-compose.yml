services:
  postgres:
    image: postgres:16-alpine
    container_name: topolactor-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: topolactor_demo
      POSTGRES_PASSWORD: topolactor_demo
      POSTGRES_DB: topolactor_demo
    ports:
      - "5432:5432"
    volumes:
      - topolactor_demo_pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/topology_tables.sql:/docker-entrypoint-initdb.d/02-topology_tables.sql:ro
      - ../db/promotion_tables.sql:/docker-entrypoint-initdb.d/03-promotion_tables.sql:ro
      - ../db/context_route_tables.sql:/docker-entrypoint-initdb.d/04-context_route_tables.sql:ro
      - ../db/seed_empty.sql:/docker-entrypoint-initdb.d/05-seed_empty.sql:ro
      - ../db/demo_seed.sql:/docker-entrypoint-initdb.d/06-demo_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topolactor_demo -d topolactor_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: topolactor-demo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: topolactor-demo-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "Host=postgres;Database=topolactor_demo;Username=topolactor_demo;Password=topolactor_demo"
      BACKEND_PORT: "5000"
      # Set DEMO_JWT_SECRET and DEMO_JWT_EXPIRY_HOURS in a .env file or override here
      # DEMO_JWT_SECRET: changeme
      # DEMO_JWT_EXPIRY_HOURS: 8
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: topolactor-demo-frontend
    restart: unless-stopped
    environment:
      DEMO_BACKEND_URL: "http://backend:5000"
      PORT: "8000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: topolactor-demo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  topolactor_demo_pgdata:
