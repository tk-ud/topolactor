name: db-schema-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  db-schema-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: topolactor
          POSTGRES_USER: topolactor
          POSTGRES_PASSWORD: topolactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topolactor -d topolactor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: topolactor
      POSTGRES_USER: topolactor
      POSTGRES_PASSWORD: topolactor

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect db schema-related changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed_files.txt
          if rg -q '^(db/.*\.sql|\.agent/tests/check-db-schema\.sh|\.github/workflows/db-schema-check\.yml)$' changed_files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run DB schema check
        if: steps.changes.outputs.run == 'true'
        run: bash .agent/tests/check-db-schema.sh

      - name: DB schema check not required for this change
        if: steps.changes.outputs.run != 'true'
        run: echo "No db/sql scope change detected; db-schema-check marked success by scope gating."
