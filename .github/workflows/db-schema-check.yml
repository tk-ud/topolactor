name: db-schema-check

on:
  pull_request:
    paths:
      - 'db/**/*.sql'
      - 'docs/design/db-schema.yaml'
      - '.agent/tests/check-db-schema.sh'
      - '.github/workflows/db-schema-check.yml'
  push:
    branches:
      - main
    paths:
      - 'db/**/*.sql'
      - 'docs/design/db-schema.yaml'
      - '.agent/tests/check-db-schema.sh'
      - '.github/workflows/db-schema-check.yml'

jobs:
  db-schema-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: topolactor
          POSTGRES_USER: topolactor
          POSTGRES_PASSWORD: topolactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topolactor -d topolactor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: topolactor
      POSTGRES_USER: topolactor
      POSTGRES_PASSWORD: topolactor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          if sudo apt-get update >"$tmp" 2>&1 && sudo apt-get install -y postgresql-client >>"$tmp" 2>&1; then
            echo "PASS apt install=postgresql-client"
            rm -f "$tmp"
          else
            code=$?
            echo "FAIL apt install=postgresql-client exit=$code" >&2
            cat "$tmp" >&2
            rm -f "$tmp"
            exit "$code"
          fi

      - name: Run DB schema check
        run: bash .agent/tests/check-db-schema.sh
