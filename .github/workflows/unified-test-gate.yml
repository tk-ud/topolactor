name: unified-test-gate

on:
  pull_request:
    paths:
      - 'backend/**/*.cs'
      - 'backend/**/*.csproj'
      - 'backend/**/*.sln'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'deno.json'
      - 'frontend/import_map.json'
      - 'docs/design/runtime-orchestration-ssot.yaml'
      - 'docs/design/pipeline-continuity-ssot.yaml'
      - '.agent/tests/check-unified-test-gate.sh'
      - '.github/workflows/unified-test-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**/*.cs'
      - 'backend/**/*.csproj'
      - 'backend/**/*.sln'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'deno.json'
      - 'frontend/import_map.json'
      - 'docs/design/runtime-orchestration-ssot.yaml'
      - 'docs/design/pipeline-continuity-ssot.yaml'
      - '.agent/tests/check-unified-test-gate.sh'
      - '.github/workflows/unified-test-gate.yml'

jobs:
  function-boundary:
    name: "[FUNCTION_BOUNDARY] Runtime function unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run runtime function unit tests
        run: |
          echo "Scope: RuntimeExecutor.ExecuteAsync, ManifestDispatcher.DispatchAsync,"
          echo "       ManifestDispatcher.BuildLegacyHookRequest,"
          echo "       TargetDispatchOverride.ValidateRequest, TargetDispatchOverride.TryHandleAsync,"
          echo "       OperationVectorResolver.Resolve, RuntimeGuard.Validate,"
          echo "       ContextRouteRecommendationResolver.ResolveAsync"
          dotnet test backend/tests/Topolactor.Runtime.Tests/Topolactor.Runtime.Tests.csproj \
            --nologo --verbosity minimal

  runtime-integration:
    name: "[RUNTIME_INTEGRATION] Integration boundary tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run integration boundary tests
        run: |
          echo "Scope: DefaultEntitySearchIntegrationTests"
          echo "       full dispatch path: dispatcher / executor / override / output-lane"
          dotnet test backend/tests/Topolactor.Integration.Tests/Topolactor.Integration.Tests.csproj \
            --nologo --verbosity minimal

  frontend-contract:
    name: "[FRONTEND_CONTRACT] Frontend API proxy and dispatch contract tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run frontend contract tests
        run: |
          echo "Scope: adminApi.test.ts, defaultEntitySearch.test.ts, pipelineContinuity.test.ts"
          deno test \
            frontend/tests/adminApi.test.ts \
            frontend/tests/defaultEntitySearch.test.ts \
            frontend/tests/pipelineContinuity.test.ts \
            --allow-read

  structure-gate:
    name: "[STRUCTURE_GATE] Structure check (must run last)"
    needs: [function-boundary, runtime-integration, frontend-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run structure check
        run: bash .agent/tests/check-structure.sh
