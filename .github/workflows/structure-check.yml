name: Structure Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run completion judgment invariant guard
        run: bash .agent/tests/check-completion-judgment.sh

      - name: Run system roadmap check
        run: bash .agent/tests/check-system-roadmap.sh

      - name: Run static SSOT purity check
        run: bash .agent/tests/check-static-ssot-purity.sh

      - name: Run SQL Attention SSOT check
        run: bash .agent/tests/check-sql-attention-ssot.sh

      - name: Run pipeline continuity check
        run: bash .agent/tests/check-pipeline-continuity.sh

      - name: Run CSS dictionary check
        run: bash .agent/tests/check-css-dictionary.sh

      - name: Run UI/UX executable component slice check
        run: bash .agent/tests/check-ui-ux-executable-component-slice.sh

      - name: Run test proof manifest integrity check
        run: bash .agent/tests/check-test-proof-manifest-integrity.sh

      - name: Run structure check
        run: bash .agent/tests/check-structure.sh
