name: Structure Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run completion judgment invariant guard
        run: bash .agent/tests/check-completion-judgment.sh

      - name: Run system roadmap check
        run: bash .agent/tests/check-system-roadmap.sh

      - name: Run SQL Attention SSOT check
        run: bash .agent/tests/check-sql-attention-ssot.sh

      - name: Run pipeline continuity check
        run: bash .agent/tests/check-pipeline-continuity.sh

      - name: Run structure check
        run: bash .agent/tests/check-structure.sh
