name: Structure Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run completion judgment invariant guard
        run: bash .agent/tests/check-completion-judgment.sh

      - name: Run structure check
        run: bash .agent/tests/check-structure.sh
