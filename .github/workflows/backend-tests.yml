name: backend-tests

on:
  pull_request:
    paths:
      - 'backend/**/*.cs'
      - 'backend/**/*.csproj'
      - 'backend/**/*.sln'
      - 'docs/design/runtime-orchestration-ssot.yaml'
      - 'docs/design/pipeline-continuity-ssot.yaml'
      - 'db/sql_attention_logs_tables.sql'
      - 'db/topology_tables.sql'
      - 'db/manifest_tables.sql'
      - 'db/mock_preset_tables.sql'
      - 'db/team_markdown_tables.sql'
      - 'db/seed_empty.sql'
      - 'db/external_port_compat_absorption_seed.sql'
      - 'db/audit_approval_form_preset_seed.sql'
      - 'db/email_approval_form_preset_seed.sql'
      - 'db/stripe_webhook_intake_preset_seed.sql'
      - 'db/external_port_result_context_mapping_seed.sql'
      - 'db/runtime_orchestration_tables.sql'
      - 'db/ui_component_registry_preset_catalog_bootstrap.sql'
      - 'db/auth_tables.sql'
      - 'docs/design/db-schema.yaml'
      - 'docs/design/abstract-function-primitive-registry-ssot.yaml'
      - '.agent/tests/check-backend-tests.sh'
      - '.github/workflows/backend-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**/*.cs'
      - 'backend/**/*.csproj'
      - 'backend/**/*.sln'
      - 'docs/design/runtime-orchestration-ssot.yaml'
      - 'docs/design/pipeline-continuity-ssot.yaml'
      - 'db/sql_attention_logs_tables.sql'
      - 'db/topology_tables.sql'
      - 'db/manifest_tables.sql'
      - 'db/mock_preset_tables.sql'
      - 'db/team_markdown_tables.sql'
      - 'db/seed_empty.sql'
      - 'db/external_port_compat_absorption_seed.sql'
      - 'db/audit_approval_form_preset_seed.sql'
      - 'db/email_approval_form_preset_seed.sql'
      - 'db/stripe_webhook_intake_preset_seed.sql'
      - 'db/external_port_result_context_mapping_seed.sql'
      - 'db/runtime_orchestration_tables.sql'
      - 'db/ui_component_registry_preset_catalog_bootstrap.sql'
      - 'db/auth_tables.sql'
      - 'docs/design/db-schema.yaml'
      - 'docs/design/abstract-function-primitive-registry-ssot.yaml'
      - '.agent/tests/check-backend-tests.sh'
      - '.github/workflows/backend-tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topolactor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d topolactor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TOPOLACTOR_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=topolactor_test;Username=postgres;Password=postgres
      TOPOLACTOR_TEST_DB_PSQL_URL: postgresql://postgres:postgres@localhost:5432/topolactor_test
      TOPOLACTOR_CI_REQUIRE_DB_CONTINUITY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          if sudo apt-get update >"$tmp" 2>&1 && sudo apt-get install -y postgresql-client >>"$tmp" 2>&1; then
            echo "PASS apt install=postgresql-client"
            rm -f "$tmp"
          else
            code=$?
            echo "FAIL apt install=postgresql-client exit=$code" >&2
            cat "$tmp" >&2
            rm -f "$tmp"
            exit "$code"
          fi

      - name: Apply DB schema for continuity integration
        run: |
          set -euo pipefail
          for sql in db/schema.sql db/topology_tables.sql db/manifest_tables.sql db/sql_attention_logs_tables.sql db/context_route_tables.sql db/ui_topology_tables.sql db/topology_cross_table_wiring.sql db/mock_preset_tables.sql db/team_markdown_tables.sql db/promotion_tables.sql db/seed_empty.sql db/ui_component_registry_preset_catalog_bootstrap.sql db/external_port_compat_absorption_seed.sql db/audit_approval_form_preset_seed.sql db/email_approval_form_preset_seed.sql db/stripe_webhook_intake_preset_seed.sql db/external_port_result_context_mapping_seed.sql db/runtime_orchestration_tables.sql db/auth_tables.sql; do
            tmp="$(mktemp)"
            if psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f "$sql" >"$tmp" 2>&1; then
              echo "PASS psql file=$sql"
              rm -f "$tmp"
            else
              code=$?
              echo "FAIL psql file=$sql exit=$code" >&2
              cat "$tmp" >&2
              rm -f "$tmp"
              exit "$code"
            fi
          done

      - name: Run backend tests
        run: bash .agent/tests/check-backend-tests.sh
