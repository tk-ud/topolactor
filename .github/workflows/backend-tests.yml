name: backend-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend-related changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed_files.txt
          if rg -q '^(backend/.*\.(cs|csproj|sln)|\.agent/tests/check-backend-tests\.sh|\.github/workflows/backend-tests\.yml)$' changed_files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run backend tests
        if: steps.changes.outputs.run == 'true'
        run: bash .agent/tests/check-backend-tests.sh

      - name: Backend tests not required for this change
        if: steps.changes.outputs.run != 'true'
        run: echo "No backend scope change detected; backend-tests marked success by scope gating."
