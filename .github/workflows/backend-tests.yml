name: backend-tests

on:
  pull_request:
    paths:
      - 'backend/**/*.cs'
      - 'backend/**/*.csproj'
      - 'backend/**/*.sln'
      - 'docs/design/runtime-orchestration-ssot.yaml'
      - 'docs/design/pipeline-continuity-ssot.yaml'
      - 'db/sql_attention_logs_tables.sql'
      - 'db/topology_tables.sql'
      - 'db/manifest_tables.sql'
      - 'db/mock_preset_tables.sql'
      - 'db/team_markdown_tables.sql'
      - '.agent/tests/check-backend-tests.sh'
      - '.github/workflows/backend-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**/*.cs'
      - 'backend/**/*.csproj'
      - 'backend/**/*.sln'
      - 'docs/design/runtime-orchestration-ssot.yaml'
      - 'docs/design/pipeline-continuity-ssot.yaml'
      - 'db/sql_attention_logs_tables.sql'
      - 'db/topology_tables.sql'
      - 'db/manifest_tables.sql'
      - 'db/mock_preset_tables.sql'
      - 'db/team_markdown_tables.sql'
      - '.agent/tests/check-backend-tests.sh'
      - '.github/workflows/backend-tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topolactor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d topolactor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TOPOLACTOR_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=topolactor_test;Username=postgres;Password=postgres
      TOPOLACTOR_TEST_DB_PSQL_URL: postgresql://postgres:postgres@localhost:5432/topolactor_test
      TOPOLACTOR_CI_REQUIRE_DB_CONTINUITY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply DB schema for continuity integration
        run: |
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/topology_tables.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/manifest_tables.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/sql_attention_logs_tables.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/context_route_tables.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/ui_topology_tables.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/topology_cross_table_wiring.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/mock_preset_tables.sql
          psql "${TOPOLACTOR_TEST_DB_PSQL_URL}" -v ON_ERROR_STOP=1 -f db/team_markdown_tables.sql

      - name: Run backend tests
        run: bash .agent/tests/check-backend-tests.sh
