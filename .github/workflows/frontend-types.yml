name: frontend-types

on:
  pull_request:
    paths:
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'deno.json'
      - 'frontend/import_map.json'
      - '.agent/tests/check-frontend-types.sh'
      - '.github/workflows/frontend-types.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'deno.json'
      - 'frontend/import_map.json'
      - '.agent/tests/check-frontend-types.sh'
      - '.github/workflows/frontend-types.yml'

jobs:
  check-frontend-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run frontend type check
        run: bash .agent/tests/check-frontend-types.sh
