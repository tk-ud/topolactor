name: default-entity-search

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  default-entity-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect default-entity-search impact scope
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed_files.txt
          if rg -q '^(backend/|frontend/|db/.*\.sql|\.agent/tests/check-default-entity-search\.sh|\.github/workflows/default-entity-search\.yml)$' changed_files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Deno
        if: steps.changes.outputs.run == 'true'
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run default:entity:search integration test
        if: steps.changes.outputs.run == 'true'
        run: bash .agent/tests/check-default-entity-search.sh

      - name: default-entity-search check not required for this change
        if: steps.changes.outputs.run != 'true'
        run: echo "No default:entity:search impact scope change detected; workflow marked success by scope gating."
