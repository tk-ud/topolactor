name: default-entity-search

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'db/**/*.sql'
      - '.agent/tests/check-default-entity-search.sh'
      - '.github/workflows/default-entity-search.yml'
      - 'docs/design/pipeline-continuity-ssot.yaml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'db/**/*.sql'
      - '.agent/tests/check-default-entity-search.sh'
      - '.github/workflows/default-entity-search.yml'
      - 'docs/design/pipeline-continuity-ssot.yaml'

jobs:
  default-entity-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run default:entity:search integration test
        run: bash .agent/tests/check-default-entity-search.sh
