name: bootstrap-validation

on:
  pull_request:
    paths:
      - 'db/**/*.sql'
      - 'infra/docker-compose.yml'
      - '.agent/tests/check-bootstrap-validation.sh'
      - '.github/workflows/bootstrap-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'db/**/*.sql'
      - 'infra/docker-compose.yml'
      - '.agent/tests/check-bootstrap-validation.sh'
      - '.github/workflows/bootstrap-validation.yml'

jobs:
  bootstrap-sql-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: topolactor_bootstrap
          POSTGRES_USER: topolactor
          POSTGRES_PASSWORD: topolactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topolactor -d topolactor_bootstrap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: topolactor_bootstrap
      POSTGRES_USER: topolactor
      POSTGRES_PASSWORD: topolactor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate docker compose config parse (always for scoped workflow runs)
        run: docker compose -f infra/docker-compose.yml config > /dev/null

      - name: Run bootstrap SQL validation (non-compose execution)
        run: bash .agent/tests/check-bootstrap-validation.sh

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra/docker-compose.yml change
        id: detect-compose-change
        run: |
          set -euo pipefail
          changed_files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          if printf '%s\n' "$changed_files" | grep -Fxq 'infra/docker-compose.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: compose smoke (infra/docker-compose.yml changed only)
        if: steps.detect-compose-change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file infra/.env.example -f infra/docker-compose.yml down -v
          }
          trap cleanup EXIT
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml up -d --wait postgres
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml ps
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml exec -T postgres \
            pg_isready -U topolactor_demo -d topolactor_demo
