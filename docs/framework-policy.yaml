framework_policy:

  topolactor_space_boundary_policy:
    registry: definition_and_configuration
    topology: semantic_space
    hub: relation_node
    attractor: vector_convergence_point
    attention: observation_point_or_operation
    logs: physical_time_axis_observation_space
    separation_rules:
      - registry_is_not_hub_or_attractor_entity_itself
      - hub_relations_can_be_treated_as_tensor_and_vector
      - vectorized_hub_relations_enable_neighborhood_search
      - attention_is_not_attractor
      - sql_attention_is_observation_layer_not_attractor_generator
      - aggregates_are_attention_weight_observation_not_meaning_sot
      - ui_package_layout_wiring_relations_with_physical_table_record_route_can_be_treated_as_hub_vector_surfaces
      - topology_is_semantic_definition_space
      - hubs_are_relation_maps_over_already_defined_ids_and_references
      - do_not_mix_topology_semantic_definitions_into_hubs_relation_maps
      - equal_relation_shape_uses_id_and_related_ids
      - parent_child_relation_shape_uses_id_parent_id_child_ids
      - ui_relation_parent_is_physical_table_id_or_data_type_id
      - ui_relation_children_are_package_ids_as_ui_payload_bundles
      - ui_relation_matrix_body_must_not_mix_role_state_route_context_axes

  registry_tensor_principle:
    role: ssot_mandatory_principle
    registry: semantic_matrix_topology_vocabulary_basis
    registry_table_role: semantic_matrix
    registry_row: registry_id_basis_vocabulary_row
    registry_column: semantic_projection_wiring_axis_column
    registry_value: weight_state_relation_coordinate_connection_cell
    registry_id_combinations: sparse_vector_or_tensor_coordinate_from_semantic_matrix
    tensor_surface_mapping:
      db: tensor_persistence_projection
      ui: tensor_projection_surface
      endpoint: tensor_projection_surface
      runtime: tensor_expansion_surface
      scheduler: tensor_expansion_surface
      function: tensor_expansion_surface
      ci_diagnostic: tensor_projection_surface
    projection_rule: >
      DB/UI/endpoint/runtime/scheduler/function/CI surfaces are not independent
      implementation subjects; they are projection/expansion surfaces of the same
      registry tensor derived from the registry semantic matrix.
    vector_space_rule: registry_table_structure_itself_spans_vector_space
    cross_registry_attention:
      enabled: true
      basis:
        - registry_id
        - semantic_axis
        - relation_axis
      rule: cross_registry_relations_are_attention_capable_topology_edges
    same_table_aggregation_attention_weight:
      aggregates:
        - count
        - sum
        - average
        - recency
        - frequency
        - transition
      rule: aggregates_are_attention_weight_observation_not_meaning_source
    jsonb_columnar_rule:
      jsonb: latent_and_semi_structured_feature_retention
      columnar: observable_semantic_axis_for_auditability
      expansion: execute_abstract_function_with_registry_tensor_on_runtime_surfaces
    sql_attention_policy:
      definition: db_topology_observed_attention_equivalent_score
      not:
        - sql_based_dot_product_attention
        - reproduce_transformer_qk_inner_product_over_all_elements
      decomposition:
        neighborhood_theta:
          role: candidate_narrowing_only
          sources:
            - registry_id_references
            - relation_bindings
            - topology_continuity
            - indexed_db_structure
          note: theta_or_cosine_is_not_meaning_sot
        norm_impedance_weight:
          role: excitation_strength_observation
          sources:
            - aggregation
            - transition
            - recency
            - frequency
            - diff
            - logs
        projection_cache:
          fields:
            - vector_sparse
            - l2_norm
          rule: rebuildable_helper_projection_not_meaning_sot
      axis_assignment_phase_shift:
        rule: attention_weight_rotates_observed_topology_state_not_registry_basis
        basis:
          registry_table: fixed_semantic_basis
          registry_id: topology_axis_label
          attentioned_key: excitation_key
          w: attention_weight_and_rotation_amount
        quaternion_dual_projection:
          role: attention_dual_phase_operator_for_statistical_anti_collapse
          purpose: protect_projection_from_statistical_over_convergence_to_attractor_field
          equation:
            canonical: "q = w + x*i + y*j + z*k"
            rotation: "q(theta,u) = cos(theta/2) + (u_x*i + u_y*j + u_z*k) * sin(theta/2)"
            phase_escape: "theta = policy_bounded_phase_escape(abs(w), collapse_risk)"
          components:
            i_j_k: fixed_registry_basis_axes
            x: observed_projection_component_on_registry_axis_i
            y: observed_projection_component_on_registry_axis_j
            z: observed_projection_component_on_registry_axis_k
            w: attentioned_key_excitation_scalar_and_rotation_amount
            q: projection_and_route_state_phase_operator
          duality:
            attention_side: aggregation_statistics_attractor_weight_observation
            quaternion_side: phase_rotation_projection_operator
            rule: stronger_attention_increases_policy_bounded_phase_escape_not_registry_mutation
          collapse_protection:
            risk: statistics_only_ranking_over_converges_to_high_weight_attractor_field
            rule: quaternion_projection_rotates_route_phase_when_attention_is_strong
            invariant: strong_attention_must_not_mean_stronger_same_candidate_collapse
          invariant:
            - registry_tables_remain_ssot_basis
            - quaternion_is_projection_state_operator_not_meaning_sot
            - observed_matrix_projection_route_state_is_rotated_not_registry_basis
          prohibition:
            - generate_raw_db_command_strings_from_quaternion
            - mutate_registry_basis_from_quaternion
            - use_quaternion_as_direct_persistence_mutation_command
        transform:
          input_state: current_record_tensor_or_route_projection_matrix
          expression: M_next = M_current + lambda_sum_of_w_key_axis_transform_key
          affected_surfaces:
            - relation_binding
            - route_candidate
            - projection_cache
            - hub_attention_current
            - diff_log_observation
            - ui_topology_state
        prohibition:
          - mutate_registry_basis_per_attention_event
          - treat_attention_weight_as_new_meaning_sot
          - generate_raw_db_command_strings_from_attention
          - hide_state_shift_without_append_only_observation
        note: >
          Attentioned keys provide excitation weights for rotating the current
          observed matrix/projection/route state. Registry tables remain the SSOT
          basis; SQL Attention must not become raw DB command generation or direct
          registry-basis mutation.
    record_tensor_state_rule:
      definition: record_referencing_registry_ids_is_tensor_state
      coordinate_derivation:
        - registry_id_references
        - relation_bindings
        - jsonb_features_and_promoted_columns
        - logs_and_observations
      prohibition:
        - record_manual_vector_ownership
        - record_direct_vector_sparse_authoring
      vector_cache: vector_sparse_l2_norm_are_rebuildable_projection_caches

  runtime_route_resolver_policy:
    definitions:
      route: business_mandatory_fixed_path
      attention: recommendation_and_neighborhood_exploration
    resolver_priority:
      - fixed_route
      - topology_enum_or_package_recommend_candidate_only
      - sql_attention_relation_recommend_candidate_only
      - route_missing_fallback_jump
    projection_tabs:
      canonical_route_tab:
        owns:
          - fixed_route
          - current_hub_address
          - current_topology_address
          - route_missing_fallback_jump
      attention_recommendation_tab:
        owns:
          - sql_attention_recommendation
          - topology_package_recommendation_candidates
          - nearby_relation_candidates
        must_not:
          - overwrite_current_address_automatically
          - replace_fixed_route
          - mutate_route_state_without_explicit_user_action
    fixed_route_contract:
      hubs_relation_route: fixed_business_route_between_hubs
      topology_package_route: fixed_state_transition_within_topology
      attention_override: prohibited
    frontend_boundary:
      projection_surface_only: true
      spa_runtime_authoritative_projection: true
      frontend_if_branching_for_business_route: prohibited
    route_missing_jump_event:
      behavior: runtime_jump_event_not_error
      user_fields:
        - currentHubAddress
        - currentTopologyAddress
      jump_fields:
        - scope
        - from
        - to
        - reason
      hub_route_missing_example: jump("hub", currentHubAddress, 0, reason: "route_missing")
      topology_route_missing_example: jump("topology", currentTopologyAddress, 0, reason: "route_missing")
      recommendation_adoption_only: jump(reason: "user_action")


  ui_projection_composition_persistence:
    naming_note: ui_topology_tensor_is_persistence_name_not_semantic_tensor_sot
    semantic_boundary: ui_package_layout_wiring_is_projection_composition_surface

  ui_topology_tensor_persistence:
    components_bucket:
      role: unpackaged_component_staging_surface
      rule: components_in_bucket_are_not_ui_topology_tensor_entities
      prohibition: component_without_component_id_must_not_be_projected
    package_generator:
      role: issue_ids_and_promote_bucket_components
      issues:
        - component_id
        - package_id
        - layout_id
        - wiring_id
      wiring:
        - connect_package_component_layout_wiring_axes
        - persist_to_ui_topology_db
    persistence_tables:
      - ui_component_bucket
      - ui_component_registry
      - ui_component_package
      - ui_package_component_map
      - ui_layout_registry
      - ui_wiring_registry
      - ui_topology_tensor
    frontend_projection_rule: frontend_projects_db_topology_definition_only
    drift_gap:
      - code_only_component_is_not_topology_entity
      - code_only_package_is_not_topology_entity
      - ui_topology_component_catalog_only_interpretation_is_prohibited

  registries:
    master_registry:
      role: table_name_and_id_dictionary
    state_registry:
      role: state_label_dictionary
    relation_registry:
      role: abstract_space_and_ui_projection_registry
    package_registry:
      role: runtime_package_registry
    schema_registry:
      role: runtime_and_ui_schema_registry
    promotion_registry:
      role: schema_evolution_registry

  state_policy:
    hub_state:
      owner: system_side
      examples:
        - provisional
        - active
        - merge_waiting
        - conflict
        - logically_deleted
    entity_state:
      owner: domain_side
      examples:
        - operating
        - stopped
        - maintenance_waiting
        - billed
        - archived
    syslog_state:
      owner: none
      rule: no_state

  search_policy:
    search_node: hub
    display_subject: entity
    natural_language_source:
      - entity_jsonb
      - entity.domain_attributes
      - entity.domain_state
      - relation_ids
    matching:
      initial:
        - regex_over_master_not_null_fields
        - master_candidate_selection
        - relation_registry_resolution
      later:
        - hub_state_statistics
        - relation_cooccurrence
        - entity_state_prediction
    role_weighting:
      examples:
        administrator: broad_search
        office_staff: billing_and_customer_priority
        worker: machine_and_maintenance_priority

  manifest:
    style: manifest_driven
    responsibilities:
      - form_schema
      - detail_schema
      - field_types
      - labels
      - jsonb_shape
      - tree_labels
      - relation_link_candidates
      - ui_order
      - ui_conditions
      - ui_grouping
    resolution:
      - relation_registry_candidates_select_manifest
      - manifest_is_ui_ssot
      - api_schema_is_confirmed_from_manifest

  backend_flow:
    style: vector_runtime_and_dispatcher_based
    request_json:
      keys:
        - target
        - layer
        - action
        - id_or_hub_id
        - payload
        - context
    dispatcher_axes:
      - target
      - layer
      - action
    layer_examples:
      - entity
      - hub
      - relation_registry
      - diff_log
    processing_flow:
      - validate_request
      - resolve_vector
      - resolve_attractor
      - resolve_manifest
      - dispatch_handler
      - update_current_data
      - append_diff_log
      - schedule_or_update_cache
      - return_emission
    runtime_boundary_failure_matrix:
      required_for:
        - endpoint_wiring
        - frontend_api_proxy_wiring
        - repository_write
        - admin_operation
        - persistence_mutation
      verify:
        - success_path
        - authn_authz_failure
        - request_validation_failure
        - malformed_id_or_payload
        - not_found
        - persistence_constraint_failure
        - repository_or_backend_unavailable
        - frontend_proxy_status_propagation
        - ui_visible_error_state
        - post_write_read_consistency

  real_sys_table_basic_shape:
    rule: id_state_jsonb_is_default_shape_for_real_and_system_tables
    identity: id
    current_state: state
    latent_payload: jsonb
    note: real_sys_tables_are_entity_surfaces_observed_from_registry_tensor

  jsonb_key_promotion_policy:
    rule: jsonb_keys_can_be_promoted_to_columns_as_observable_semantic_axes
    promotion_driver:
      - observation_frequency
      - semantic_importance
      - audit_requirement
    note: column_promotion_is_semantic_axis_manifestation_not_schema_drift

  logs_diffs_policy:
    role: physical_time_axis_lifecycle_diff_observation_surface
    basic_shape:
      - id
      - table_id
      - jsonb
      - created
    rule: logs_diffs_are_audit_rebuild_history_not_current_state_sot

  vector_cache_policy:
    vector_sparse_l2_norm: rebuildable_materialized_projection_not_sot
    prohibition:
      - direct_record_vector_authoring
      - direct_seed_ui_api_vector_sparse_authoring_as_normal_path

  data_policy:
    raw_input:
      rule: raw_input_can_be_stored_and_later_normalized_by_regex_and_registry_resolution
      flow:
        - raw
        - regex_candidate_extraction
        - master_selection
        - entity_resolution
        - hub_resolution
        - relation_registration
    normalized_input:
      rule: normalized_ui_can_directly_construct_relation_hub_entity
      flow:
        - relation_ui
        - hub_registration
        - entity_registration
    jsonb:
      use_for:
        - machine_details
        - billing_breakdown
        - variable_inventory_payloads
      rule: variable_details_are_stored_in_jsonb_first
    promotion:
      rule: promote_from_jsonb_to_registry_relation_or_physical_structure_when_statistical_connection_or_operation_value_is_clear
    diff_log:
      rule: inline_edit_changes_are_saved_as_append_only_log_separate_from_current_data

  promotion_policy:
    role: runtime_schema_evolution_policy
    principle: >
      Promotion conditions for tables, columns, indexes, and registries are not fixed in code.
      They are controlled by external manifests and admin UI.
    flow:
      - jsonb_or_registrar_first
      - collect_usage_metrics
      - evaluate_promotion_manifest
      - topology_recommendation_ci_gate
      - show_admin_candidates
      - admin_approval
      - apply_index_or_generated_column_or_registry_or_physical_table
      - keep_rollback_plan
    relation_registry_fk_audit_and_abstract_migration:
      role: relation_registry_authority_driven_reference_audit_and_candidate_generation
      authority: relation_registry
      policy_surface:
        - manifest
        - function_parameters
      audit_targets:
        - hubs.relation_registry_id
        - entities.relation_ids
        - hub_relations.relation_registry_id
        - structure_maps.relation_registry_id
        - relation_registry.master_ids
      flow:
        - periodic_audit_select_relation_registry
        - detect_dangling_or_inactive_or_missing_or_mismatch
        - generate_fk_index_relation_binding_structure_map_candidates
        - topology_recommendation_ci_gate
        - admin_approval
        - apply
      statuses:
        - OK
        - MissingPolicy
        - MalformedPolicy
        - ValidationFailed
        - DanglingReference
        - InactiveReference
        - MissingRelation
        - CandidateMismatch
      db_command_strings: prohibited
      package_runtime_validation_runner: required
      shell_script: optional_allowlisted_adapter_only
      silent_fallback: prohibited
      ssot: docs/design/relation-registry-fk-audit-and-abstract-migration.md
    topology_recommendation_ci_gate:
      role: ci_verification_gate_before_admin_approval
      subject: C# package runtime validation runner
      trigger: cron excitation trigger (context only; no domain-specific logic in trigger)
      package: topology_recommendation_ci
      policy_surface: function_parameters
      candidate_types:
        - registry_addition
        - relation_registry_promotion
        - enum_axis_registration
        - schema_patch
        - manifest_patch
        - package_binding
        - generated_column
        - index
        - physical_table
        - sql_patch
      result:
        ci_pass: eligible for show_admin_candidates
        ci_fail: reject / recommend delete / expire
      db_command_strings: prohibited
      shell_script: optional — allowlisted external check adapter only
      silent_fallback: prohibited
      ssot: docs/design/topology-recommendation-ci-runtime.md
    managed_by_manifest:
      - read_frequency_threshold
      - filter_usage_threshold
      - aggregation_usage_threshold
      - join_usage_threshold
      - jsonb_path_hotspot_threshold
      - promotion_action_priority
    promotion_actions:
      - suggest_index
      - suggest_generated_column
      - suggest_registry_promotion
      - suggest_physical_table_promotion
    admin_ui:
      responsibilities:
        - show_usage_metrics
        - show_promotion_candidates
        - edit_thresholds
        - approve_promotion
        - reject_promotion
        - view_migration_plan
        - view_rollback_plan
        - preserve_backend_status_propagation
        - show_structured_validation_and_constraint_failures
    rule:
      - schema_evolution_is_manifest_driven
      - db_optimization_is_admin_approved
      - jsonb_flexibility_must_not_become_performance_debt

  logs:
    policy:
      description: Logs are partitioned by relation_registry to avoid a single enormous log domain.
      rules:
        - avoid_single_hub_domain_log_table
        - use_relation_registry_id_as_log_partition_key
        - separate_common_logs_and_relation_scoped_logs
        - search_aggregation_and_maintenance_are_relation_registry_scoped
    common:
      - raw
      - diff
      - error
    scoped_by_relation_registry: true
    relation_scoped_examples:
      - invoice_log
      - machine_log
      - maintenance_log
      - asset_log

  open_issues:
    - define_runtime_boundary_failure_matrix_verification_contract
    - define_manifest_schema
    - define_dispatcher_request_contract
    - define_repository_boundaries
    - define_state_transition_rules
    - define_tree_projection_rules
    - define_diff_grouping_rules
    - define_hub_statistics_update_timing
    - define_auth_and_permissions
    - define_master_registry_schema
    - define_manifest_resolution_rules
    - define_relation_registry_partition_strategy
    - define_promotion_manifest_schema
    - define_admin_promotion_ui
    - define_schema_evolution_approval_flow


current_projection_namespace_split:
  role: namespace_design_boundary
  migration_policy:
    - namespace_change_requires_explicit_schema_contract
    - runtime_semantics_must_not_depend_on_pr_context
  direction:
    logs: physical_time_axis_and_evidence
    current: rebuildable_current_relation_projections
