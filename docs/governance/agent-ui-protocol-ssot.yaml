# agent-ui-protocol-ssot.yaml
#
# SSOT contract for routing Agents into the Agent UI tool.
# Details and emitted templates live under docs/governance/reference.

version: 1
status: draft_ssot
scope: repository_agent_governance_agent_ui
canonical_path: docs/governance/agent-ui-protocol-ssot.yaml

agent_protocols:
  purpose:
    - Route Agents from ./AGENTS.md and .agent/rules/rule.md into the Agent UI tool.
    - Issue a usage id when the tool is used.
    - Append datetime, uuid, task_name, and worktype to .agent/tools/logs/tool.log.
    - Require PRs and summaries to include datetime, uuid, task_name, and worktype.

  reference_wiring:
    directory: docs/governance/reference
    tool_output_reference: docs/governance/reference/agent-ui-tool-output-reference.yaml
    senario_tmp_reference: docs/governance/reference/agent-ui-senario-tmp-reference.yaml
    negative_boundary_reference: docs/governance/reference/agent-ui-negative-boundary-reference.yaml
    rule: >-
      This SSOT owns the contract and order. Reference files own detailed output
      fields, templates, and checklist interview wording.

  legacy_surface_policy:
    fallback_only:
      - .agent/prompt/*.md (worktypes other than the one agent-ui-initial-contract start resolved)
      - .agent/protocols/*.md (files not in the resolved worktype's required_protocols/triggered_protocols)
      - .agent/checklists/*.md (listed by agent-ui-local-test checklist as headings only, not inlined)
    tool_first_full_text:
      - the resolved worktype's routed .agent/prompt/<worktype>.md, in full, as start's prompt_content
      - .agent/skills/agent-workflow.md's Execution Order block, as start's workflow_procedure -- this file backs both the tool-first and fallback routes, it is not fallback-only
    tool_first_normalized_obligations:
      - the resolved worktype's required/triggered .agent/protocols/*.md file(s), as start's protocol_obligations[] -- a normalized structured extraction (protocol_path/route_mode/applies/trigger_condition/judgment_scope/foundation_ssot_read_gate/blocking_conditions/pass_conditions/required_fields/classification_vocab/output_boundary/fallback_protocol_ref/tool_first_instruction_note) of that file's own headings, not the full markdown body presented as an execution procedure
      - rule: >-
          protocol_obligations[] replaces the retired shape that previously
          inlined routed protocol full text as start's output.
          flow_order remains the sole execution-order authority; protocol
          obligations supply judgment content (trigger/scope/gates/blocking/
          pass conditions), never sequencing. Each entry's
          fallback_protocol_ref repeats protocol_path so the fallback route
          (or deeper manual review) can still read that file's full text
          directly; a field that is null because the source file has no
          matching heading must not be treated as the field being satisfied.
    rule: >-
      Non-routed .agent prompt/protocol/checklist/skill surfaces remain
      fallback-only, for Agents that cannot use the tool or for worktypes/
      conditions other than the one currently resolved. For the current
      worktype/trigger's routed prompt file, tool output returns full text
      (see tool_first_full_text); for routed protocol file(s), tool output
      returns normalized protocol_obligations[] (see
      tool_first_normalized_obligations), not full text and not an
      indiscriminate dump of every legacy surface -- routing still narrows
      which files are read. Tool output references under
      docs/governance/reference document these output fields; they do not
      themselves relax this contract.

  tool_principles:
    - Keep output minimal to reduce context load.
    - Do not stream raw execution logs into Agent context.
    - Tool output is Agent UI output, not SSOT authority or completion judgment.
    - Tool must not judge implemented / partial / not_started status.
    - Read-only applies to Topolactor application/runtime/product source during ordinary tool use, not to the Agent UI tool implementation itself.

  mutation_boundary:
    ordinary_use_read_only_target:
      - Topolactor application/runtime/product source surfaces observed by the tool
    allowed_when_in_agent_ui_scope:
      - .agent/tools implementation files
      - .agent/tests for tool checks
      - docs/governance agent-tool SSOT files
      - docs/governance/reference tool-output reference files
      - .agent/tools/logs/tool.log compact usage evidence
      - senario-tmp.md local temporary file
    ordinary_use_prohibited:
      - product runtime/source mutation by the tool
      - verbose execution log output into Agent context
      - committing senario-tmp.md

  flow_order:
    initial_contract:
      - task_name_input
      - worktype_id_select
      - emit_worktype_prompt
      - target_ssot_name_input
      - output_section_list
      - select_sections
      - output_selected_section_subtrees
      - return_to_ssot_selection_or_quit
      - require_scenario_contract_on_quit
      - create_senario_tmp_md_and_end
    implementation:
      - agent_implementation_start
      - agent_implementation_end
    local_test:
      - run_worktype_tests
      - checklist_interview
      - run_checks
      - pass_if_all_required_items_pass

  senario_tmp_contract:
    path: senario-tmp.md
    gitignore_required: true
    shape_reference: docs/governance/reference/agent-ui-senario-tmp-reference.yaml
    boundary_reference: docs/governance/reference/agent-ui-negative-boundary-reference.yaml
    generation_authority:
      tool_first: >-
        agent-ui-initial-contract end is the exclusive senario-tmp.md
        generation authority for the tool-first route. It is created at
        initial_contract end from ai_authored target_file/senario_summary/
        ng_boundary fields, read by checklist interview, and must not be
        committed.
      fallback: >-
        Manual scenario-contract creation (.agent/protocols/scenario-contract.md's
        .agent/tmp/tmp.txt, via bash .agent/scripts/create-tmp.sh) is a
        distinct fallback-route artifact, used only when
        agent-ui-initial-contract is unavailable. It is not a second way to
        produce senario-tmp.md, and the tool-first route must not fall back
        to it merely by preference.
    rule: >-
      senario-tmp.md is a local temporary scenario checklist. It is created at
      initial_contract end, read by checklist interview, and must not be committed.

  checklist_interview_contract:
    order:
      - output_senario_tmp_md
      - output_error_if_senario_tmp_cannot_be_checked
      - ask_framework_questions_using_existing_checklists
    reference: docs/governance/reference/agent-ui-senario-tmp-reference.yaml

  log_contract:
    path: .agent/tools/logs/tool.log
    fields:
      - datetime
      - uuid
      - task_name
      - worktype
    rule: compact metadata only

  db_schema_mandatory_ssot_rule:
    ssot: docs/design/db-schema.yaml
    applies_when: >-
      Work touches DB / manifest / seed SQL / UI topology / package / layout /
      design / wiring / tensor persistence / translator adoption targets.
    rule: >-
      docs/design/db-schema.yaml is a mandatory applicable SSOT (alongside top
      SSOT) whenever applies_when is true, in .agent/protocols/*.md
      foundation_ssot_read_gate sections and in target_ssot_name resolution
      during initial_contract. db/*.sql is the canonical DDL/seed surface, but
      table authority, table role, and manifest_reference meaning must be
      cross-checked against docs/design/db-schema.yaml -- a refs-only
      manifest.topology shape alone is not proof; the refs' target table must
      also match this SSOT's documented authority.

  completion_contract:
    required_summary_fields:
      - datetime
      - uuid
      - task_name
      - worktype
      - reference_basis
      - selected_ssot_sections
      - target_file
      - senario_summary
      - ng_boundary
      - senario_tmp_path
      - local_test_result
      - checklist_result
      - check_result
      - missing_evidence_if_any
