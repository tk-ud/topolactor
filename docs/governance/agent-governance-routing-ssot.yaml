# agent-governance-routing-ssot.yaml
#
# SSOT for repository-side agent governance routing.
# This file defines the canonical responsibility split and routing vocabulary.
# .agent files should reference or conform to this SSOT instead of duplicating
# governance-route definitions.

version: 1
status: draft_ssot
scope: repository_agent_governance
canonical_path: docs/governance/agent-governance-routing-ssot.yaml

purpose:
  summary: >-
    Define the canonical route, worktype vocabulary, responsibility split,
    grep-key policy, validation order, and duplication boundaries for agent
    governance files.
  non_goals:
    - application runtime behavior definition
    - product feature specification
    - protocol body duplication
    - checklist answer storage
    - PR-specific audit log storage

canonical_route:
  order:
    - AGENTS.md
    - .agent/rules/rule.md
    - worktype_decision
    - .agent/README.md
    - .agent/prompt/<worktype>.md
    - .agent/protocols/<worktype_or_triggered_protocol>.md
    - checklist_and_tests
  invariant: >-
    Rules decide prohibited behavior and worktype branch. README explains
    directory roles. Prompt files route the selected worktype. Protocol files
    own judgment gates. Checklists record triggered viewpoint answers. Tests
    verify structure and executable invariants.

directory_structure:
  docs/governance:
    role: governance_ssot_surface
    files:
      - docs/governance/agent-governance-routing-ssot.yaml
      - docs/governance/agent-governance-routing-ssot.md
  .agent:
    role: agent_governance_runtime_surface
    children:
      README.md: agent_directory_map
      rules: always_on_rules_and_worktype_branch
      prompt: worktype_router_surface
      protocols: judgment_gate_surface
      checklists: viewpoint_signature_surface
      tests: executable_governance_checks
      tasks: unresolved_work_queue
      reports: persistent_inspection_report_surface
      tmp: temporary_work_artifact_surface
      docs: agent_resume_and_index_surface
      routes: worktype_route_map_surface
      skills: task_procedure_surface
      tools: agent_read_only_repo_observation_surface
      scripts: ci_gate_and_helper_implementation_body_surface

agent_repo_observation_tools_surface:
  canonical_directory: .agent/tools
  role: agent_read_only_repo_observation_surface
  status: governance_contract_defined_without_initial_tool_implementation
  target_user: repository_agent
  purpose:
    - expose stable, agent-facing entrypoints for observing repository governance, structure, SSOT indexes, and proof-surface maps
    - keep observation commands discoverable without making .agent/scripts a convenience-command namespace
  responsibility_boundary:
    tools:
      owns:
        - thin read-only command entrypoints for agent repo observation
        - argument validation that rejects mutation-oriented options
        - human/JSON observation formatting for agent consumption
      must_not_own:
        - CI gate authority
        - proof authority
        - SSOT authority
        - completion judgment
        - semantic implementation-status judgment
        - duplicated structural processing bodies already owned by scripts
    scripts:
      owns:
        - CI and local gate executable bodies
        - reusable helper implementation bodies
        - structured parsing, tree emission, connectivity checks, and delegated subcheck implementation
      may_be_called_by_tools: true
      boundary: tools may wrap scripts as thin read-only entrypoints, but must not fork or duplicate the structural processing body
  immutability_contract:
    read_only: true
    prohibited_mutations:
      - writing repository files
      - editing TODO, roadmap, SSOT, proof manifest, or generated reports
      - creating temp artifacts that persist after command completion
      - exposing --output or equivalent file-write options unless explicitly rejected by the tool
  judgment_boundary:
    tool_output_is_not:
      - SSOT authority
      - proof completion
      - completion judgment
      - semantic audit judgment
      - implemented_or_partial_status_evidence_by_itself
    prohibited_judgments:
      - semantic completion
      - implemented
      - partial
      - not_started
      - proof_passed_from_observation_only
    todo_and_roadmap_status_boundary: todo and roadmap status may be displayed as observed text only and must not be treated as proof or implementation reality
  dependency_policy:
    structured_processing_dependency: python3_stdlib_only
    inherited_from: docs/framework-policy.yaml#repo_governance_tooling_dependency_policy
    prohibited_required_dependencies:
      - jq
      - node
      - ruby
      - pip_install
      - npm_install
      - gem_install
  initial_followup_tool_candidates:
    next_bundle: agent-tools-core-readonly-observation
    in_scope_later:
      - directory-map
      - ssot-map-query
      - proof-surface-map
    out_of_scope_for_this_design_change:
      - tool implementation files
      - initial tool command bodies
      - proof gate implementation
  advanced_followup_tool_candidates:
    future_bundle: agent-tools-advanced-surface-maps
    status: implemented_with_deferred_candidates
    implemented_candidate: yaml-section-query
    implemented_candidate_role: generic_read_only_hierarchical_yaml_section_path_observation
    deferred_candidates:
      - change-impact-map
      - dependency-surface-map
      - orphan-surface-map
    deferred_reason: >-
      impact/dependency/orphan surface maps tended toward a thin grep/rg
      wrapper and require separate schema and judgment-boundary design before
      implementation; they remain out of scope for this bundle.
    boundary: >-
      yaml-section-query is a generic read-only YAML section/path observation
      tool, not impact, dependency, or orphan analysis; it does not replace
      or implement the deferred candidates.

semantic_closure:
  entities:
    - ssot
    - directory_surface
    - rule
    - worktype
    - prompt
    - protocol
    - checklist
    - test
    - report
    - todo
    - output_sink
    - observation_tool
    - completion_state
    - blocking_state
  allowed_edges:
    ssot:
      defines:
        - directory_surface
        - worktype
        - authority_boundary
        - grep_key_policy
        - ci_check_contract
        - observation_surface_boundary
    rule:
      decides:
        - worktype
      branches_to:
        - prompt
      must_not_define:
        - protocol_body
        - directory_map_body
        - token_estimate_table
    worktype:
      routes_to:
        - prompt
      may_require:
        - protocol
        - checklist
        - test
    prompt:
      routes_worktype_to:
        - required_reads
        - optional_reads
        - protocol_triggers
        - output_shape
      must_not_judge:
        - completion_state
        - blocking_state
    protocol:
      judges:
        - completion_state
        - blocking_state
      may_require:
        - checklist
        - test
      must_not_select:
        - worktype
    checklist:
      records:
        - triggered_viewpoint_answers
      must_not_own:
        - final_judgment
    test:
      verifies:
        - structure
        - routing_reference
        - required_vocabulary
        - executable_check
      must_not_judge:
        - semantic_audit
        - product_design_authority
    report:
      stores:
        - routine_inspection
        - scheduled_maintenance
        - periodic_audit
      must_not_store:
        - normal_pr_summary
        - pr_specific_filled_checklist
    todo:
      stores:
        - unresolved_implementation_work
        - unresolved_design_work
        - unresolved_ssot_alignment_work
        - unresolved_test_authoring_work
      must_not_store:
        - ci_waiting_record
        - local_tool_absence_record
        - remote_ci_pass_confirmation_record
        - completed_pr_work_log

closed_world_rules:
  - Every worktype must have exactly one prompt route.
  - Every protocol must be reached by worktype route or explicit trigger.
  - Prompt files route work; protocol files judge work.
  - Tests verify executable invariants; tests do not replace semantic judgment.
  - .agent/README.md is a directory map only.
  - Token estimate tables are prohibited inside .agent/README.md.
  - Structure check must run last in local completion order.
  - NOT_EXECUTED is never PASS.
  - CI waiting, missing tools, and remote confirmation bookkeeping are not TODO items.

authority_boundaries:
  governance_route_authority: docs/governance/agent-governance-routing-ssot.yaml
  worktype_vocabulary_authority: docs/governance/agent-governance-routing-ssot.yaml
  grep_key_policy_authority: docs/governance/agent-governance-routing-ssot.yaml
  agent_directory_map_authority: .agent/README.md
  always_on_rule_authority: .agent/rules/rule.md
  worktype_route_map_executable_reference: .agent/routes/worktype-required-protocols.yaml
  protocol_judgment_authority: .agent/protocols/*
  checklist_template_authority: .agent/checklists/*
  executable_structure_authority: .agent/tests/check-structure.sh
  report_surface_authority: .agent/protocols/report-surfaces.md
  todo_carry_over_authority: .agent/protocols/todo-carry-over.md

responsibility_split:
  AGENTS.md:
    role: repository_entry_contract
    owns:
      - entry handoff
      - agent role summary
      - minimum start instruction
    does_not_own:
      - full routing body
      - protocol body
      - token estimate table

  .agent/rules/rule.md:
    role: always_on_rules_and_worktype_branch
    owns:
      - always_on_prohibitions
      - minimal_workflow_invariant
      - worktype_decision
      - branch_to_prompt
    does_not_own:
      - directory role explanation
      - protocol body details
      - token estimates
      - large read-route explanation
      - duplicated prompt/protocol procedures

  .agent/README.md:
    role: agent_directory_map
    owns:
      - .agent directory purpose
      - subdirectory responsibilities
      - permanent_vs_temporary_surface distinction
    does_not_own:
      - token estimates
      - protocol load comparison
      - worktype procedure body
      - completion judgment rules

  .agent/prompt:
    role: worktype_router_surface
    owns:
      - worktype purpose
      - trigger condition
      - required reads
      - optional reads
      - protocol triggers
      - output shape
      - out_of_scope
    does_not_own:
      - final PASS/FAIL judgment
      - protocol body duplication
      - checklist template answers

  .agent/protocols:
    role: judgment_gate_surface
    owns:
      - triggered gate conditions
      - completion blockers
      - PASS/FAIL/NOT_REQUIRED/OUT_OF_SCOPE semantics
      - protocol-specific judgment rules
    does_not_own:
      - worktype selection
      - directory map
      - executable CI implementation

  .agent/checklists:
    role: viewpoint_signature_surface
    owns:
      - blank checklist templates
      - self-test fixtures
      - answer format expectations
    does_not_own:
      - canonical judgment source
      - permanent PR-specific filled answers

  .agent/tests:
    role: executable_governance_checks
    owns:
      - structure checks
      - routing existence checks
      - vocabulary/reference integrity checks
      - local CI wrapper checks
    does_not_own:
      - semantic PR judgment
      - product design authority

  .agent/tasks/todo.md:
    role: unresolved_work_queue
    owns:
      - unresolved implementation work
      - unresolved design work
      - unresolved SSOT alignment work
      - unresolved test-authoring work
    does_not_own:
      - CI waiting records
      - local tool absence records
      - remote CI pass confirmation records
      - completed PR work logs

  docs/governance:
    role: governance_ssot_surface
    owns:
      - governance routing SSOT
      - governance vocabulary
      - route responsibility model
      - migration target state
      - CI checker meaning and ordering

worktypes:
  audit:
    id: audit
    purpose: PR or diff semantic audit.
    prompt: .agent/prompt/audit.md
    protocol: .agent/protocols/audit.md
    primary_focus:
      - implementation meaning consistency
      - diff-to-intent consistency
      - residual work extraction
      - follow-up prompt output when fixes are needed
    delegated_to_ci:
      - structure consistency
      - build/type/test execution
      - required-path existence
    required_output_fields:
      - problem
      - purpose
      - improvement_policy
      - reference_materials
      - target_files
      - target_functions
      - todo
      - remaining_todo
    prohibited:
      - treating structure check as semantic audit substitute
      - posting GitHub comments when user requested prompt output only

  specific:
    id: specific
    purpose: Targeted file/function/design-point inspection or correction.
    prompt: .agent/prompt/specific.md
    protocol: .agent/protocols/specific.md
    primary_focus:
      - minimal target-surface read
      - local scope fixation
      - trigger only protocols relevant to touched surfaces
    prohibited:
      - reading all docs by default
      - reading all protocols by default
      - expanding beyond requested target without explicit scope reason

  implementation_change:
    id: implementation_change
    purpose: Implementation change against existing SSOT.
    prompt: .agent/prompt/implementation-change.md
    protocol: .agent/protocols/implementation-change.md
    conditional_protocols:
      runtime_persistence_projection_changes:
        - .agent/protocols/scenario-contract.md
      policy_scoring_threshold_changes:
        - .agent/protocols/policy-judgment.md

  design_change:
    id: design_change
    purpose: SSOT, docs/design, or externally observable contract change.
    prompt: .agent/prompt/design-change.md
    protocol: .agent/protocols/design-change.md
    conditional_protocols:
      ssot_change:
        - .agent/protocols/ssot-change-impact.md

  todo_maintenance:
    id: todo_maintenance
    purpose: .agent/tasks/todo.md inspection, cleanup, or reconciliation.
    prompt: .agent/prompt/todo-maintenance.md
    protocol: .agent/protocols/todo-carry-over.md

  existing_pr_update:
    id: existing_pr_update
    purpose: Follow-up work on an already-open PR.
    prompt: .agent/prompt/existing-pr-update.md
    protocol: .agent/protocols/completion-summary.md
    required_sink: PR follow-up comment

prompt_contract:
  required_sections:
    - purpose
    - trigger_condition
    - required_reads
    - optional_reads
    - protocol_triggers
    - output_shape
    - out_of_scope
  rule: >-
    Prompt files are lightweight worktype routers. They must not duplicate
    protocol judgment bodies.

protocol_contract:
  required_sections:
    - workflow_guard
    - trigger_condition
    - judgment_scope
    - blocking_conditions
    - pass_conditions
  rule: >-
    Protocol files own judgment semantics for triggered gates. They must not
    become worktype selection maps or directory maps.

checklist_contract:
  rule: >-
    Checklist templates record triggered viewpoint answers. They are not final
    judgment SSOT and must not store PR-specific filled answers permanently.

test_contract:
  rule: >-
    Shell checks verify routing existence, reference integrity, required
    vocabulary, structure, and executable local checks. They do not replace
    semantic audit judgment.

ci_check_contract:
  order_rule: >-
    Run routing and judgment vocabulary guards before scope-specific executable
    checks. Run scope-specific executable checks before aggregate/local CI gates.
    Run structure check last.
  status_semantics:
    PASS: check executed and succeeded
    FAIL: check executed and failed
    NOT_EXECUTED: check did not execute; not equivalent to PASS
    REQUIRED_NOT_EXECUTED: required check did not execute and needs equivalent remote evidence
    NOT_REQUIRED: check is outside current work scope
    OUT_OF_SCOPE: gate does not apply to current worktype or touched surface
  local_order:
    - id: worktype_routing_check
      command: bash .agent/tests/check-worktype-routing.sh
      meaning: Validate worktype routing existence, reference integrity, and required vocabulary.
      phase: route_guard
      required_for:
        - governance_route_change
        - prompt_route_change
        - protocol_route_change
        - required_path_change
    - id: completion_judgment_check
      command: bash .agent/tests/check-completion-judgment.sh
      meaning: Validate completion-governance vocabulary and workflow invariant references.
      phase: judgment_vocabulary_guard
      required_for:
        - completion_protocol_change
        - output_sink_change
        - todo_closure_rule_change
        - existing_pr_update_rule_change
    - id: backend_tests
      command: bash .agent/tests/check-backend-tests.sh
      meaning: Execute backend dotnet test scope.
      phase: scope_specific_executable_check
      required_for:
        - backend_runtime_change
        - backend_endpoint_change
        - backend_repository_change
        - backend_schema_change
    - id: frontend_type_check
      command: bash .agent/tests/check-frontend-types.sh
      meaning: Execute frontend Deno type-check scope.
      phase: scope_specific_executable_check
      required_for:
        - frontend_route_change
        - frontend_runtime_change
        - frontend_component_change
        - frontend_api_change
    - id: default_entity_search_check
      command: bash .agent/tests/check-default-entity-search.sh
      meaning: Verify default entity search integration and frontend rendering regression path.
      phase: scope_specific_executable_check
      required_for:
        - default_entity_search_change
        - runtime_executor_change
        - emission_projection_change
    - id: pipeline_continuity_check
      command: bash .agent/tests/check-pipeline-continuity.sh
      meaning: Verify API command lane, SSE projection lane, and identity continuity contract.
      phase: scope_specific_executable_check
      required_for:
        - pipeline_continuity_change
        - frontend_api_lane_change
        - sse_projection_lane_change
        - dispatch_endpoint_change
    - id: bootstrap_validation_check
      command: bash .agent/tests/check-bootstrap-validation.sh
      meaning: Validate compose/bootstrap/database initialization contract.
      phase: scope_specific_executable_check
      required_for:
        - infra_compose_change
        - db_init_change
        - bootstrap_validation_change
    - id: sql_attention_ssot_check
      command: bash .agent/tests/check-sql-attention-ssot.sh
      meaning: Verify SQL Attention SSOT vocabulary and table/function continuity.
      phase: scope_specific_executable_check
      required_for:
        - sql_attention_change
        - logs_schema_change
        - context_route_recommendation_change
    - id: unified_test_gate
      command: bash .agent/tests/check-unified-test-gate.sh
      meaning: Aggregate declared function boundary, runtime integration, frontend contract, and uncovered-scope states.
      phase: aggregate_gate
      required_for:
        - batch_implementation_change
        - multi_surface_runtime_change
        - release_readiness_check
    - id: local_ci_check
      command: bash .agent/tests/check-local-ci.sh
      meaning: Local orchestration wrapper for required local CI checks.
      phase: local_ci_orchestration
      required_for:
        - full_local_validation
        - pre_push_validation
    - id: structure_check
      command: bash .agent/tests/check-structure.sh
      meaning: Executable structure SSOT; verifies required directories, files, and architecture-critical terms.
      phase: final_structure_gate
      order_constraint: must_run_last
      required_for:
        - all_completion_paths
  remote_ci_mapping:
    backend_tests:
      workflow: .github/workflows/backend-tests.yml
      local_equivalent: bash .agent/tests/check-backend-tests.sh
    frontend_type_check:
      workflow: .github/workflows/frontend-types.yml
      local_equivalent: bash .agent/tests/check-frontend-types.sh
    default_entity_search_check:
      workflow: .github/workflows/default-entity-search.yml
      local_equivalent: bash .agent/tests/check-default-entity-search.sh
    pipeline_continuity_check:
      workflow: .github/workflows/structure-check.yml
      local_equivalent: bash .agent/tests/check-pipeline-continuity.sh
    bootstrap_validation_check:
      workflow: .github/workflows/bootstrap-validation.yml
      local_equivalent: bash .agent/tests/check-bootstrap-validation.sh
    unified_test_gate:
      workflow: .github/workflows/unified-test-gate.yml
      local_equivalent: bash .agent/tests/check-unified-test-gate.sh
    structure_check:
      workflow: .github/workflows/structure-check.yml
      local_equivalent: bash .agent/tests/check-structure.sh
  prohibited_interpretations:
    - structure_check_as_semantic_judgment
    - queued_remote_ci_as_pass
    - missing_local_tool_as_pass
    - unexecuted_required_check_as_completion
    - verification_bookkeeping_as_todo

grep_key_policy:
  id_language: english
  marker_language: english
  route_key_language: english
  explanation_language: japanese_allowed
  case_style: snake_case
  stable_worktype_ids:
    - audit
    - specific
    - implementation_change
    - design_change
    - todo_maintenance
    - existing_pr_update
  prohibited:
    - mixed_language_route_ids
    - japanese_grep_keys_for_route_selection
    - duplicate_synonym_keys_without_canonical_id

routing_index_policy:
  protocols_index:
    role: section_level_grep_route
    file: .agent/protocols/index.yaml
    rule: >-
      Index files locate target protocol sections after a worktype or trigger
      selects the protocol. Index hits are not PASS/FAIL judgment.
  worktype_required_protocols:
    role: worktype_to_prompt_protocol_check_map
    file: .agent/routes/worktype-required-protocols.yaml
    rule: >-
      This map verifies worktype routing existence and required references.
      It is not semantic design-judgment authority.

token_estimate_policy:
  canonical_surface: README.md
  prohibited_surface: .agent/README.md
  rule: >-
    Repository-side governance overhead estimates belong in root README or
    another repository-level overview. .agent/README.md must remain a directory
    purpose map only.

validation_closure:
  must_be_defined_for_every_worktype:
    - prompt
    - protocol_or_triggered_protocol
    - output_shape
    - required_check_scope
  must_be_defined_for_every_check:
    - command
    - meaning
    - phase
    - required_for
    - pass_fail_semantics
  final_gate:
    - bash .agent/tests/check-structure.sh

prohibited_duplication:
  - duplicate_token_estimates_inside_agent_readme
  - duplicate_protocol_body_inside_rule_md
  - duplicate_directory_map_inside_rule_md
  - duplicate_judgment_rules_inside_prompt_files
  - duplicate_worktype_selection_inside_protocol_files
  - keep_completed_pr_work_logs_inside_todo_md

migration_target_state:
  - add_governance_ssot_under_docs_governance
  - move_agent_readme_token_estimates_to_root_readme
  - reduce_rule_md_to_prohibitions_and_worktype_branch
  - add_audit_worktype_prompt_and_protocol
  - add_specific_worktype_prompt_and_protocol
  - unify_grep_keys_to_english_snake_case
  - update_required_paths_and_check_scripts_to_reference_new_worktypes
  - update_check_scripts_to_reference_ci_check_contract
