data_driven_topology_runtime_framework:
  name: topolactor_data_driven_topology_runtime_framework
  version: 0.4.0
  status: public_design_document

  purpose:
    - freely_saved_data_then_system_normalization
    - topology_based_management
    - manifest_driven_ui_and_dispatcher_backend
    - hub_centered_composite_domain_data
    - relation_registry_driven_ui_projection
    - registrar_driven_extension
    - runtime_schema_evolution_policy

  concept:
    summary: >
      topolactor is a topology-based data-driven runtime framework.
      It does not treat hierarchy, screens, or fixed physical tables as the primary design subject.
      relation_registry defines abstract spaces, hub connects abstract space and concrete data,
      and entity stores domain-specific concrete state.

  philosophy:
    principles:
      - hub_is_connection_layer_between_abstract_and_concrete
      - relation_registry_defines_abstract_space
      - entity_is_concrete_data
      - all_relations_are_registry_driven
      - hub_state_is_system_side
      - entity_state_is_domain_side
      - syslog_has_no_state
      - search_node_is_hub
      - display_subject_is_entity
      - natural_language_source_is_entity
      - tree_view_is_projection_not_storage
      - save_first_normalize_later
      - jsonb_first_promote_when_needed
      - master_ids_are_registry_managed
      - ui_is_registry_projection
      - schema_evolution_is_manifest_driven

    rationale:
      topology_based_management: >
        Management is not fixed as a tree. relation_registry defines abstract condition spaces,
        and hub connects concrete domain data to those spaces.
      freely_saved_data_then_system_normalization: >
        Input does not have to be fully normalized at the time of entry.
        Later system processing normalizes and promotes useful structures.
      relation_registry_driven_ui_projection: >
        UI candidate order, display order, links, and branches are controlled by relation_registry and manifest.
      hub_centered_composite_domain_data: >
        Composite data such as invoices is assembled around hub as a convergence point.

  tech_stack:
    database: PostgreSQL
    backend: C#
    frontend: Fresh
    frontend_runtime: Deno
    frontend_ui: Preact
    batch: cron_or_background_service


  topolactor_space_model:
    registry:
      role: definition_and_configuration
      note: registry_defines_hub_topology_or_ui_axes_depending_on_target
      logical_namespaces:
        - hub_registry
        - topology_registry
        - ui_registry
    topology:
      role: semantic_space
      note: concept_name_is_topology_physical_namespace_names_are_separate
    hub:
      role: relation_node
      definition: relation_established_node
      tensor_vector_property: relation_composition_can_be_treated_as_tensor_and_vector
      neighborhood_rule: vectorized_hub_relations_enable_neighborhood_search
    attractor:
      role: vector_convergence_point
      boundary: not_attention
    attention:
      role: observation_point_or_operation
      boundary: not_attractor
    logs:
      role: physical_time_axis_observation_space
      definition: physical_pressure_diff_candidate_usage_observation_in_time_series
    sql_attention:
      role: observation_layer_over_logs_pressure_and_hub_vector_indicated_attractors
      formula: observe_logs_pressure_then_read_hub_vector_indicated_attractor_evidence
      not:
        - registry_search
        - topology_search
        - attractor_generator
    ui_relation_surfaces:
      role: ui_usage_relation_map
      relation_shape:
        equal_relation:
          fields:
            - id
            - related_ids[]
        parent_child_relation:
          fields:
            - id
            - parent_id
            - child_ids[]
          example:
            parent_id: physical_table_id_or_data_type_id
            child_ids: package_ids
      meaning: which_ui_package_payloads_are_used_by_which_data_type
      vectorization_rule: normalize_columns_for_neighborhood_search
      boundary:
        - package_is_ui_payload_bundle
        - physical_table_to_package_is_not_one_to_one
        - do_not_mix_topology_semantic_definitions_into_hubs_relation_map
    weight_observation_rule:
      weights:
        - count
        - transition
        - recency
        - ema
        - feedback
      rule: weights_are_attention_observation_not_semantic_sot

  actions:
    - Search
    - Create
    - diffUpdate
    - logicalDelete

  ssot_contract_axis:
    static_vocabulary_vs_seed_instance_boundary:
      yaml_static_vocabulary_role:
        - system_side_static_status_kind_type_runtime_vocabulary_source_of_truth
        - allowed_values_for_ci_membership_assertion
        - must_be_updated_before_new_static_discrete_value_is_used
      db_seed_role:
        - concrete_bootstrap_instance_surface
        - user_or_ai_operable_initial_data_surface
        - must_not_be_treated_as_static_vocabulary_source_of_truth
      ci_role:
        - verify_seed_values_are_subset_of_yaml_static_vocabulary
        - fail_on_seed_value_without_yaml_definition
    ssot_role:
      - allowed_vocabulary_source_of_truth
      - allowed_shape_source_of_truth
      - canonical_relation_source_of_truth
    implementation_role:
      - ssot_projection_surface
      - ssot_concrete_instance_surface
    test_role:
      - verifies_implementation_conforms_to_ssot
      - must_not_redefine_expected_vocabulary
    vocabulary_extension_rule:
      - new_discrete_value_requires_ssot_update_first
      - implementation_value_without_ssot_definition_is_non_conformant

  topology_model:
    description: >
      This is not a simple graph in a single flat space.
      relation_registry defines abstract condition spaces, and each hub has a local context space.
      Predictions and recommendations appear as conditional statistics of entity.state inside hub space.
    distinctions:
      - each_hub_has_local_context_space
      - entity_state_distribution_forms_meaning_in_hub_space
      - prediction_is_conditional_statistics_from_hub
      - structure_connection_and_state_statistics_form_effective_vector_space
      - not_a_simple_single_space_graph
    input_flows:
      - raw_to_entity_to_hub_to_relation
      - entity_to_hub_to_relation
      - relation_ui_to_hub_to_entity

  layers:
    relation_registry:
      role: abstract_space_definition
      description: Defines abstract spaces by combining master tables, relation axes, and ordering metadata.
      fields:
        - relation_registry_id
        - name
        - master_ids
        - category
        - type
        - order
        - weight
        - manifest_candidate
        - active
      behavior:
        - defines_abstract_condition_space
        - drives_ui_candidates_and_projection
        - supports_group_by_and_aggregation

    hub:
      role: abstract_concrete_connection_layer
      description: System-side connection point between abstract spaces and concrete entities.
      fields:
        - hub_id
        - relation_registry_id
        - entity_id
        - state_id
      behavior:
        - landing_point_in_abstract_space
        - system_side_search_node
        - convergence_point_for_local_context_space
        - statistical_attractor_for_entity_state

    entity:
      role: concrete_domain_data_layer
      description: Domain-side concrete data body.
      fields:
        - relation_ids
        - entity_jsonb
        - hub_id
        - state_id
      behavior:
        - stores_variable_payload_in_jsonb
        - has_local_context_through_relation_ids
        - connects_to_abstract_space_through_hub


  runtime_route_attention_boundary:
    route_definition: business_mandatory_fixed_path
    attention_definition: recommendation_and_neighborhood_exploration
    invariant:
      - attention_score_must_not_override_fixed_route
      - hubs.relation_route_is_fixed_business_route_between_hubs
      - topology.package_route_is_fixed_state_transition_within_same_topology
      - route_jump_address_shape_is_pastAddress_currentAddress_plannedAddress
      - pastAddress_missing_is_0
      - currentAddress_missing_is_0
      - plannedAddress_missing_is_0
      - SQL_Attention_or_recommendation_must_not_overwrite_route_state_automatically
      - frontend_is_projection_surface_only
      - spa_is_runtime_authoritative_projection
      - runtime_route_resolver_owns_screen_transition_next_task_and_business_branching
      - topology_manifest_must_not_be_navigation_orphan
    projection_tabs:
      canonical_route_tab:
        owns:
          - fixed_route
          - current_hub_address
          - current_topology_address
          - route_missing_fallback_jump
      attention_recommendation_tab:
        owns:
          - sql_attention_recommendation
          - topology_package_recommendation_candidates
          - nearby_relation_candidates
        must_not:
          - overwrite_current_address_automatically
          - replace_fixed_route
          - mutate_route_state_without_explicit_user_action
    resolver_priority:
      - fixed_route
      - topology_enum_or_package_recommend_candidate_only
      - sql_attention_relation_recommend_candidate_only
      - route_missing_fallback_jump
    route_missing_policy:
      - runtime_must_emit_jump_event_not_error
      - attention_candidate_adoption_requires_user_action_jump
      - jump_event_shape_is_past_current_planned
      - past_address_missing_is_zero
      - current_address_missing_is_zero
      - planned_address_missing_is_zero
      - jump_hub_to_zero_planned_only
      - jump_topology_to_zero_planned_only
      - sql_attention_recommendation_must_not_overwrite_route_state_automatically
    route_state_snapshot_vs_jump_event_supplement:
      note: supplemental_clarification_for_existing_ssot_design_intent_no_new_model
      route_state_snapshot:
        fields: [pastAddress, currentAddress, plannedAddress]
        role: route_state_context_carried_by_request_not_jump_event_fields
      runtime_jump_event_projection:
        from: current_address_at_event_time
        to: destination_address
        planned: intended_destination_for_user_action
        note: from_to_planned_are_event_projection_fields_not_route_state_snapshot_fields
      zero_sentinel:
        value: 0
        meaning: top_fallback_unresolved_sentinel
        not: physical_id
      route_missing_event_intent:
        from: currentAddress
        to: 0
        planned: 0
        note: route_missing_is_currentAddress_to_zero_because_next_planned_cannot_be_resolved
    production_projection_connectivity_invariant:
      note: >-
        Owner design decision (2026-08-16, PR #602 round 10, re-aligned round 11 to
        docs/design/db-schema.yaml hub_relations.minimum_cardinality_completion_invariant as the
        top authority -- that field, not this one or the runtime-orchestration-ssot.yaml mirror, is
        the canonical source; both are pointers to avoid independently-drifting copies. Round 13
        re-aligned the enforcement boundary to the existing public.manifest draft -> active ->
        deprecated lifecycle -- see below).
      invariant: topology_manifest_must_not_be_navigation_orphan
      summary: >-
        Every hubs.topology_manifests row with status='active' (not a subset classified by manifest
        kind) must resolve at least one active hubs.hub_relations row (proven via the existing
        navigation_binding_resolution_criterion resolution-chain pattern, not a new mechanism). A
        status='draft' topology_manifest is exempt during authoring and never resolves as a
        navigation/runtime target regardless of its hub_relations count -- hubs.topology_manifests.
        status must always mirror the owning public.manifest row's own draft/active/deprecated
        status for the same Manifest identity (never independently tracked). Not satisfied by a
        dedicated navbar/header/sidebar/Home-button fallback or component/nodeId/manifest-UUID-
        specific hardcoding -- the fix belongs at the authoring/proof layer. Does not authorize
        fabricating hub_relations/hubs/topology_manifests to satisfy connectivity (PR #584 ban
        remains in force). Enforcement boundary: NpgsqlManifestRepository.PromoteAsync (the existing
        draft -> active transition) fails closed with HUB_RELATION_REQUIRED_FOR_PROMOTION on zero,
        deprecated-only, or unresolved-only-target relations before opening its transaction;
        hub_navigation:create remains deliberately unblocked on a draft topology_manifest (hub
        relation authoring is structurally the last step in the existing navigation-binding-
        authoring sequencing, and promotion -- not draft creation -- is the completion gate);
        hub_navigation:deprecate independently fails closed on the last active relation for an
        already-active manifest, guarding regression after activation (see the
        runtime-orchestration-ssot.yaml mirror's enforcement_boundary field for the full reasoning).

  ci_attention_projection_axis:
    ci_role:
      - CI can act as an observation/projection surface for system state.
      - CI projects implementation/runtime/event state into structured status.
    ssot_basis:
      - SSOT defines basis / allowed vocabulary / allowed shape.
      - implementation should be interpreted through SSOT-defined basis.


current_projection_namespace_split:
  role: namespace_design_boundary
  migration_policy:
    - namespace_change_requires_explicit_schema_contract
    - runtime_semantics_must_not_depend_on_pr_context
  direction:
    logs: physical_time_axis_and_evidence
    current: rebuildable_current_relation_projections


ci_attention_runtime_boundary:
  source_ssot: docs/design/ci-contract-ssot.yaml
  definition:
    - user_input_assistance_surface
    - missing_input_valid_candidate_structural_violation_break_boundary_guidance
  objective:
    - prevent_validation_error_handling_expansion_into_hidden_backend_runtime_branching
  not:
    - business_validation_main_body
    - backend_error_handler_main_body
  runtime_backend_invariants:
    - canonical_dispatch
    - explicit_failure
    - boundary_guard
  fragment_and_promotion_split:
    - fragment_is_read_only_guidance_evidence_projection
    - draft_authoring_must_not_be_locked_by_fragment
    - canonical_promotion_gate_may_read_active_blocking_fragment_state
    - apply_fail_close_authority_remains_backend_runtime_guard

sql_attention_runtime_boundary:
  source_ssot: docs/design/sql-attention-logs-ssot.md
  definition:
    - recommendation_behavior_based_on_hub_logs_relation_attractor_evidence
    - grows_hub_construction_hub_connection_hub_candidates_projection_candidates
  boundary:
    - topology_recommendation_current_is_child_projection_consumer
    - do_not_auto_overwrite_fixed_route
    - do_not_auto_mutate_registry_or_topology_from_phase_vector_attention_current
