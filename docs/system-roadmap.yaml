system_roadmap_ssot:
  name: topolactor_system_roadmap
  version: 0.3.0
  status: public_status_ssot
  visibility: public

  purpose:
    - publish_system_direction
    - distinguish_implemented_from_skeleton_or_partial
    - define_milestones_and_completion_conditions
    - provide_ci_readable_implementation_registry
    - prevent_skeleton_stub_dummy_work_from_being_reported_as_complete
    - define_external_integration_as_human_editing_surface_not_system_SSOT
    - expose_non_IT_business_system_authoring_roadmap
    - define_frontend_projection_surface_general_ux_acceptance_gate

  document_role:
    summary: >
      Feature-bundle catalog and public status index for product capabilities.
      Read this file for bundle status, summary, scope, known gaps, and detail_ref;
      do not treat it as an execution evidence ledger or component/runtime surface registry.
    owns:
      - roadmap
      - milestones
      - implementation_registry
      - public_completion_terms
      - ci_status_expectations
      - external_integration_direction
      - frontend_projection_surface_ux_acceptance_gate
    does_not_own:
      - low_level_design_detail
      - temporary_task_queue
      - audit_report_logs
      - agent_operating_rules
      - private_work_notes
      - external_service_operational_credentials

  related_surfaces:
    detailed_design_ssot:
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/pipeline-continuity-ssot.yaml
      - docs/design/sql-attention-logs-ssot.md
      - docs/design/sql-attention-logs-ssot.yaml
      - docs/framework-core.yaml
      - docs/framework-policy.yaml
      - docs/design/css-dictionary-ssot.yaml
      - docs/design/auth-db-session-credential-ssot.yaml
      - docs/design/backend-error-evidence-report-notify-ssot.yaml
    task_queue:
      - .agent/tasks/todo.md
    audit_reports:
      - .agent/reports/

  status_terms:
    planned:
      meaning: roadmap-approved planned lane or contract with implementation not started yet
      production_ready: false
    not_started:
      meaning: required by roadmap or design SSOT, but no implementation surface exists yet
      production_ready: false
    skeleton:
      meaning: boundary or adapter exists, but runtime behavior is pass-through, placeholder, or incomplete
      production_ready: false
    partial:
      meaning: some runtime behavior exists, but completion conditions are not fully satisfied
      production_ready: false
    implemented:
      meaning: completion conditions for the declared scope are satisfied and covered by evidence checks
      production_ready: false
    production_ready:
      meaning: implemented, wired through canonical runtime route, verified by required CI, and no known blocking gap remains
      production_ready: true

  completion_rules:
    - status_implemented_requires_completion_conditions
    - status_implemented_requires_evidence_tests_or_ci
    - production_ready_requires_no_known_blocking_gap
    - skeleton_stub_dummy_marker_must_not_coexist_with_status_implemented
    - known_skeleton_or_partial_work_must_be_listed_in_implementation_registry
    - task_queue_must_not_be_used_as_the_primary_status_source
    - external_service_connection_must_not_be_treated_as_runtime_SSOT
    - external_import_must_have_preview_validate_apply_stages
    - external_sync_failure_must_be_explicit_not_silent_fallback

  ux_acceptance_gates:
    frontend_projection_surface_general_ux:
      title: Frontend projection surface general UX acceptance
      gate_kind: ux_acceptance_milestone
      status: implemented
      production_ready_independent: true
      summary: >
        This acceptance gate evaluates whether the DB-authoritative frontend projection surface is
        understandable and operable by general users. It is intentionally separate from runtime
        component implementation status and production_ready judgment: a runtime lane may be
        production-ready while this UX gate remains partial. Frontend remains an intent authoring,
        preview, validation-result, and projection surface; it must not acquire topology, promotion,
        persistence, SQL Attention, or policy judgment authority.
      authority_boundary:
        db_authority_preserved:
          - design_layout_wiring_authority_remains_in_topology_DB_and_registry_surfaces
          - topology_components_layout_design_and_ui_topology_tensor_remain_canonical_persistence_surfaces
          - topology_components_style_design_and_ui_wiring_registry_remain_DB_authority_surfaces
          - context_tables_remain_recommendation_learning_surfaces_not_frontend_topology_authority
          - topology_namespace_and_hubs_namespace_canonical_schema_contracts_remain_unchanged
        frontend_projection_surface_only:
          - frontend_may_hold_local_draft_interaction_state_and_visual_preview
          - frontend_may_submit_intent_only_through_backend_preview_validate_apply_route
          - frontend_must_not_write_DB_directly
          - frontend_must_not_bypass_backend_validation
          - frontend_must_not_decide_topology_promotion_persistence_or_SQL_attention_policy
      standards_basis:
        - WCAG_2_2_SC_2_1_1_keyboard
        - WCAG_2_2_SC_2_4_3_focus_order
        - WCAG_2_2_SC_2_4_7_focus_visible
        - WCAG_2_2_SC_2_5_7_dragging_movements
        - WCAG_2_2_SC_2_5_8_target_size_minimum
        - WCAG_2_2_SC_3_3_1_error_identification
        - WCAG_2_2_SC_3_3_3_error_suggestion
        - WCAG_2_2_SC_4_1_3_status_messages
      acceptance_criteria:
        lifecycle_state_visibility:
          status: implemented
          acceptance: draft_validated_applied_failed_and_persisted_are_visibly_distinguishable
          evidence_ref:
            - frontend/tests/visualLayoutBuilder.test.ts
        recovery_navigation:
          status: implemented
          acceptance: undo_redo_or_at_minimum_clear_cancel_reset_and_revert_paths_exist
          evidence_ref:
            - frontend/tests/visualLayoutBuilder.test.ts
        actionable_validation_errors:
          status: implemented
          acceptance: validation_errors_show_cause_target_node_and_repair_suggestion_not_internal_code_only
          evidence_ref:
            - frontend/tests/visualLayoutBuilder.test.ts
            - .agent/tests/check-accessibility-manual.md
        progressive_disclosure_vocabulary:
          status: implemented
          acceptance: internal_slot_parent_and_grid_vocabulary_is_translated_for_normal_view_and_raw_terms_are_advanced_only
          evidence_ref:
            - frontend/tests/visualLayoutBuilder.test.ts
        non_pointer_operation:
          status: implemented
          acceptance: drag_move_resize_and_reorder_have_keyboard_or_button_alternatives
          evidence_ref:
            - frontend/tests/visualLayoutBuilder.test.ts
            - .agent/tests/check-accessibility-manual.md
        accessibility_observability:
          status: implemented
          acceptance: focus_order_focus_visible_target_size_and_status_messages_are_testable_and_user_observable
          evidence_ref:
            - .agent/tests/check-accessibility-manual.md
        first_run_guidance:
          status: implemented
          acceptance: empty_state_template_and_example_flow_make_the_first_action_clear
          evidence_ref:
            - frontend/tests/visualLayoutBuilder.test.ts
        css_token_visual_diff:
          status: implemented
          acceptance: css_token_selection_has_visual_preview_and_selection_diff
          evidence_ref:
            - .agent/tests/check-css-dictionary.sh
            - frontend/tests/visualLayoutBuilder.test.ts
      verification_policy:
        executable_now:
          - .agent/tests/check-system-roadmap.sh
          - .agent/tests/check-css-dictionary.sh
          - .agent/tests/check-ui-ux-executable-component-slice.sh
          - frontend/tests/visualLayoutBuilder.test.ts
          - .agent/tests/check-accessibility-manual.md
        required_when_implemented: []

  external_integration_policy:
    summary: >
      External tools are human editing and intake surfaces. They are not the canonical
      runtime source of truth. The canonical source is topolactor DB topology, manifest,
      registry, schema, relation, package, and diff/log surfaces. External tools may
      propose, draft, import, preview, or trigger changes only through explicit runtime
      boundaries.
    canonical_authority:
      - topolactor_db
      - manifest
      - registry
      - schema
      - relation_registry
      - ui_topology_tensor
      - diff_log
      - runtime_event_log
    external_surface_role:
      - human_friendly_business_input
      - draft_authoring
      - intake_queue
      - preview_surface
      - notification_surface
      - approval_surface
      - external_trigger_source
    prohibited:
      - notion_as_system_SSOT
      - spreadsheet_as_runtime_policy_SSOT
      - external_tool_direct_DB_write
      - silent_external_sync_fallback
      - implicit_schema_creation_without_preview
      - frontend_or_external_tool_SQL_attention_judgment
      - webhook_direct_runtime_execution_without_scheduler
    required_flow:
      - external_source
      - connector_adapter
      - intake_snapshot
      - topology_payload_candidate
      - validate
      - preview
      - explicit_apply
      - canonical_runtime_route
      - diff_log_or_runtime_event_log

  milestones:
    M1_runtime_skeleton:
      title: Canonical runtime route foundation
      status: partial
      summary: Frontend command entry, backend dispatch, scheduler, dispatcher, executor, and projection shell foundations exist, but the full runtime route remains governed by bundle-level gaps.
      bundle_refs:
        - product.core_runtime_route
        - product.projection_and_output_lanes
        - product.backend_error_evidence_report_notify_substrate
      detail_ref:
        - docs/design/runtime-orchestration-ssot.yaml
        - docs/design/pipeline-continuity-ssot.yaml

    M2_manifest_runtime:
      title: Manifest-driven runtime routing
      status: partial
      summary: Manifest route resolution exists as a runtime boundary, with remaining manifest-storage and production-route hardening tracked at bundle level.
      bundle_refs:
        - product.core_runtime_route
      detail_ref:
        - docs/design/runtime-orchestration-ssot.yaml

    M3_unified_timeline_and_output_lanes:
      title: Unified trigger timeline and CI lane evidence
      status: partial
      summary: Scheduler/output-lane behavior and SSOT wiring audit lanes are tracked as capability bundles rather than per-component proof ledgers.
      bundle_refs:
        - product.projection_and_output_lanes
        - product.system_ci_contract_audit
      detail_ref:
        - docs/design/pipeline-continuity-ssot.yaml
        - docs/design/ci-contract-ssot.yaml

    M4_projection_runtime:
      title: SSE and projection runtime
      status: partial
      summary: Backend projection events and frontend projection runtime are maintained as projection capability status, not frontend topology authority.
      bundle_refs:
        - product.projection_and_output_lanes
      detail_ref:
        - docs/design/pipeline-continuity-ssot.yaml

    M5_admin_and_ui_topology:
      title: Admin topology authoring and preset ecosystem
      status: partial
      summary: Admin UI, UI topology, visual builder, primitive catalog, mock preset intake, Preset DB seed registration, Markdown authoring/projection, and md_viewer display are tracked as product authoring capabilities.
      bundle_refs:
        - product.admin_topology_authoring
        - product.frontend_projection_surface_ux_acceptance
        - product.preset_db_seed_registration
        - product.component_markdown_authoring_projection
        - product.md_viewer_projection_component
        - product.completed_preset_seed_projection_gate
      detail_ref:
        - docs/design/admin-console-workflow-ssot.yaml
        - docs/design/mock-preset-intake-compiler-ssot.yaml
        - docs/design/team-markdown-dashboard-saved-view-ssot.yaml

    M6_external_integration:
      title: Self-hosted no-code authoring loop and optional external surfaces
      status: implemented
      summary: Self-hosted CSV/JSON/admin authoring loop is implemented for the declared MVP; optional external connector bundles remain not_started until separate connector contracts exist.
      bundle_refs:
        - product.dynamic_support_nocode_loop
        - product.external_optional_surface_bundle_gate
        - product.helper_manual_policy
      detail_ref:
        - docs/design/admin-console-workflow-ssot.yaml
        - docs/design/extended-runtime-bundle-registry-ssot.yaml
        - docs/design/user-facing-helper-manual-ssot.yaml

    M7_sql_attention_observation_runtime:
      title: SQL Attention observation and recommendation feedback
      status: implemented
      summary: SQL Attention observation, evidence persistence, phase vector generation, topology projection, and user feedback UX are implemented; all completion conditions are satisfied by live DB E2E, function contract, projection boundary, and frontend contract tests. CI compatibility entries retained below.
      bundle_refs:
        - product.sql_attention_observation_runtime
      detail_ref:
        - docs/design/sql-attention-logs-ssot.md
        - docs/design/sql-attention-logs-ssot.yaml

    UXA_frontend_projection_surface_general_ux:
      title: Frontend projection surface UX acceptance gate
      status: implemented
      summary: The projection UX gate remains independent from production_ready and is represented as a product UX acceptance bundle.
      bundle_refs:
        - product.frontend_projection_surface_ux_acceptance
      detail_ref:
        - docs/system-roadmap.yaml#ux_acceptance_gates

  implementation_registry:
    product.core_runtime_route:
      bundle_id: product.core_runtime_route
      title: Canonical runtime command route
      status: partial
      production_ready: false
      public_summary: User and admin commands enter through the frontend/API/backend runtime route and preserve scheduler-dispatcher-executor boundaries; remaining gaps are manifest storage and full production route hardening.
      scope:
        - frontend_command_entry
        - backend_dispatch_endpoint
        - runtime_timeline_scheduler
        - manifest_dispatcher
        - runtime_executor_boundary
      detail_ref:
        - docs/design/runtime-orchestration-ssot.yaml
        - docs/design/pipeline-continuity-ssot.yaml
      evidence_ref:
        - backend/tests/Topolactor.Runtime.Tests/RuntimeExecutorTests.cs
        - backend/tests/Topolactor.Integration.Tests/DefaultEntitySearchIntegrationTests.cs
        - frontend/tests/defaultEntitySearch.test.ts
      completion_condition:
        - scheduler_dispatcher_runtime_executor_route_preserves_topology_identity
        - manifest_storage_and_runtime_destination_resolution_are_production_hardened
      known_gap_ref:
        - manifest_storage_remains_skeleton_scope
        - full_manifest_driven_active_routing_not_production_ready
      files:
        - backend/
        - frontend/

    product.backend_error_evidence_report_notify_substrate:
      bundle_id: backend-error-evidence-report-notify-substrate
      title: Backend system error evidence / report / notify substrate
      status: partial
      production_ready: false
      public_summary: Backend-wide append-only system error evidence (logs.error), derived error report aggregation (logs.error_report), durable notify queue with logs.error AFTER INSERT trigger + pg_notify wake-up (logs.error_notify_queue / logs_error_inserted), the IBackendErrorEvidenceAppender / NpgsqlBackendErrorEvidenceAppender boundary, the BackendErrorClassifier, the read-side current.error_report_projection, and the durable post-notify bridge (BackendErrorNotifyBridge LISTEN -> atomic queue claim -> logs.error join -> RuntimeTimelineScheduler hook trigger -> acknowledged / failed_retryable / failed_terminal) are implemented and tested. The AbstractFunctionExecutor aggregate boundary and the RuntimeExecutor / ManifestDispatcher / AdminRuntime / scheduler / DbNotifyListener / external-port boundaries append only classified system errors while preserving compensation / rethrow / fail-close semantics. Remaining same-PR next scope is the admin workflow / admin UI for unresolved error reports plus the error-notify hook_port seed/config surface. DTO validation failures, ordinary auth rejects, business policy rejects, user input mistakes, CI Attention, and topology.runtime_event_log remain outside this backend error evidence authority.
      scope:
        - logs_error_append_only_system_error_evidence
        - error_report_derived_aggregation
        - error_notify_queue_and_pg_notify_wakeup
        - post_notify_bridge_claim_join_hook_dispatch_ack_failure_transitions
        - AbstractFunctionExecutor_error_boundary
        - scheduler_listener_repository_error_boundaries
        - admin_unresolved_error_report_projection
      detail_ref:
        - docs/design/backend-error-evidence-report-notify-ssot.yaml
      evidence_ref:
        - db/backend_error_evidence_tables.sql
        - db/backend_error_notify_hook_port_seed.sql
        - backend/schema/BackendErrorEvidenceContracts.cs
        - backend/runtime/BackendErrorEvidence.cs
        - backend/runtime/AppendErrorEvidencePrimitiveAdapter.cs
        - backend/repository/NpgsqlBackendErrorEvidenceAppender.cs
        - backend/repository/NpgsqlBackendErrorNotifyQueueRepository.cs
        - backend/scheduler/BackendErrorNotifyBridge.cs
        - backend/runtime/AbstractFunctionRuntime.cs
        - backend/tests/Topolactor.Runtime.Tests/BackendErrorClassifierTests.cs
        - backend/tests/Topolactor.Runtime.Tests/BackendErrorEvidenceBoundaryTests.cs
        - backend/tests/Topolactor.Runtime.Tests/AppendErrorEvidencePrimitiveAdapterTests.cs
        - backend/tests/Topolactor.Runtime.Tests/ManifestDispatcherErrorEvidenceTests.cs
        - backend/tests/Topolactor.Runtime.Tests/BackendErrorNotifyBridgeTests.cs
        - backend/tests/Topolactor.Integration.Tests/BackendErrorEvidenceAppenderLiveDbTests.cs
        - backend/tests/Topolactor.Integration.Tests/BackendErrorNotifyQueueRepositoryLiveDbTests.cs
        - backend/tests/Topolactor.Integration.Tests/BackendErrorNotifyBridgeEndToEndLiveDbTests.cs
        - backend/tests/Topolactor.Integration.Tests/BackendErrorNotifyBridgeProductionRouteLiveDbTests.cs
      completion_condition:
        - logs_error_append_only_table_and_indexes_exist
        - error_report_or_equivalent_derived_aggregation_exists
        - error_notify_queue_and_logs_error_after_insert_pg_notify_wakeup_exist
        - backend_error_evidence_appender_and_classifier_exist
        - post_notify_bridge_claims_durable_queue_joins_logs_error_dispatches_via_scheduler_hook_trigger_and_transitions_ack_retryable_terminal
        - DTO_auth_policy_user_input_rejects_do_not_append_logs_error
        - AbstractFunctionExecutor_preserves_compensation_rethrow_fail_close_semantics_while_appending_system_errors
        - runtime_dispatcher_admin_scheduler_listener_repository_boundaries_append_only_system_errors
        - admin_projection_reads_unresolved_error_reports
        - admin_workflow_admin_ui_for_unresolved_error_reports_and_error_notify_hook_port_config_surface_exist
        - CI_Attention_and_topology_runtime_event_log_are_not_repurposed_as_backend_error_log
      known_gap_ref:
        - .agent/tasks/backend-error-evidence-report-notify-todo.md
