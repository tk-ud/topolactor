    backend.runtime_timeline_scheduler:
      status: partial
      production_ready: false
      milestone: M1_runtime_skeleton
      public_summary: >
        BackgroundService with Channel-based queue for cron/hook triggers (fire-and-forget).
        Client trigger dispatches synchronously to ManifestDispatcher (explicit exception: preserves HTTP response contract).
        Unified single-queue alignment for all three trigger kinds is a known gap.
        Queue persistence not implemented.
      files:
        - backend/scheduler/RuntimeTimelineScheduler.cs
      evidence:
        tests:
          - SchedulerDispatcherChainTests
        ci:
          - backend-tests
      completion_condition:
        - cron_hook_client_triggers_are_aligned_in_one_runtime_queue
        - scheduler_owns_ordering_collision_control_and_execution_boundary
        - runtime_executor_does_not_own_trigger_alignment
      known_gap_ref:
        - Gap-2 runtime_timeline_scheduler full implementation
      detail_ssot:
        - docs/design/runtime-orchestration-ssot.yaml

    backend.manifest_dispatcher:
      status: partial
      production_ready: false
      milestone: M1_runtime_skeleton
      public_summary: >
        ManifestDispatcher resolves active manifest from DB by role+target+layer+action axes
        via NpgsqlManifestRepository. runtime_mapping topology entry is read and validated
        against known kinds (topology_transform_runtime, registry_attractor_runtime);
        unknown destination returns RUNTIME_DESTINATION_UNKNOWN. manifestId forwarded to
        RuntimeExecutor for output lane routing. Fallthrough to RuntimeExecutor when no
        manifest registered (dev/demo bypass). Ambiguity returns explicit MANIFEST_AMBIGUOUS
        error. RuntimeExecutor demo/admin target dispatch branches are now explicitly isolated
        in TargetDispatchOverride (Gap-1 completion condition satisfied).
        Remaining gap: target_layer_action_destination_selection not yet fully migrated to
        manifest-driven ManifestDispatcher routing.
      files:
        - backend/runtime/ManifestDispatcher.cs
        - backend/runtime/TargetDispatchOverride.cs
      evidence:
        tests:
          - SchedulerDispatcherChainTests
        ci:
          - backend-tests
          - pipeline-continuity
      completion_condition:
        - active_manifest_is_resolved_from_db_by_role_target_layer_action
        - dispatcher_mapping_and_runtime_mapping_are_used_for_runtime_destination
        - RuntimeExecutor_target_layer_action_dispatch_branches_are_removed_or_explicitly_isolated
        - broken_manifest_or_mapping_reference_returns_explicit_error
      known_gap_ref:
        - Gap-1 target_layer_action_selection pending manifest-driven migration
      detail_ssot:
        - docs/design/runtime-orchestration-ssot.yaml

    backend.runtime_executor:
      status: partial
      production_ready: false
      milestone: M1_runtime_skeleton
      public_summary: >
        RuntimeExecutor executes the canonical pipeline (vector → attractor → structure map →
