          - default-entity-search
          - pipeline-continuity
      completion_condition:
        - runtime_executor_only_executes_resolved_runtime_destination
        - target_layer_action_destination_selection_is_moved_to_manifest_dispatcher
        - no_new_hardcoded_dispatch_branch_is_added
      known_gap_ref:
        - Gap-1 target_layer_action_selection pending manifest-driven migration
      detail_ssot:
        - docs/design/pipeline-continuity-ssot.yaml

    backend.manifest_storage:
