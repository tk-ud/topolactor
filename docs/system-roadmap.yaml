        - SQLA-4 logs.attention basic evidence persistence is implemented; remaining hardening/live verification for hub_current/phase/statistics/scoring is incomplete
        - SQLA-5 phase_vector auxiliary evidence transform is incomplete (hardening/verification remains)
      files:
