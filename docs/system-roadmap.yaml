    backend.pdf_export_snapshot_runtime:
      status: implemented
      production_ready: false
      milestone: M6_external_integration
      public_summary: >
        PdfExportSnapshotRuntime implements the PDF export snapshot boundary.
        Creates an export snapshot record capturing DocumentCanvas state (templateKey,
        backgroundImageUrl, fields with values) at export request time. Links back to
        sourceSnapshotId (admin_import_snapshot) and sourceApplyLogId (admin_import_apply_log)
        for canonical diff/audit evidence. Status is 'snapshot_created'. Does NOT generate
        PDF bytes — production PDF layout engine is explicitly out of scope.
        All failure paths return explicit error codes. No silent fallback.
      files:
        - backend/runtime/PdfExportSnapshotRuntime.cs
        - backend/schema/PdfExportContracts.cs
