    product.registry_attractor_runtime_dispatch_handler:
      bundle_id: registry-attractor-dispatch-handler
      title: registry_attractor_runtime manifest-dispatchable handler
      status: implemented
      production_ready: false
      public_summary: >
        RegistryAttractorDispatchRuntime implements IDispatchableRuntime for the
        registry_attractor_runtime manifest dispatch destination. Registered in
        Program.cs handler dictionary. Manifest dispatch with
        runtime_mapping.runtime_destination="registry_attractor_runtime" routes
        to this handler via ManifestDispatcher. Unknown destinations continue to
        return RUNTIME_DESTINATION_UNKNOWN. Distinct from the SqlAttentionScheduler
        BackgroundService cron route. Covered by dispatch routing and handler
        behavior tests.
      scope:
        - registry_attractor_runtime_handler_class
        - program_cs_handler_dictionary_registration
        - manifest_runtime_mapping_wiring
        - dispatcher_explicit_error_path_coverage
      detail_ref:
        - docs/design/runtime-orchestration-ssot.yaml
      evidence_ref:
        - backend/runtime/RegistryAttractorDispatchRuntime.cs
        - backend/tests/Topolactor.Runtime.Tests/RegistryAttractorDispatchRuntimeTests.cs
      completion_condition:
        - IDispatchableRuntime_handler_for_registry_attractor_runtime_exists
        - handler_registered_in_Program_cs_handler_dictionary
        - manifest_with_runtime_mapping_registry_attractor_runtime_routes_correctly
        - unknown_destination_returns_RUNTIME_DESTINATION_UNKNOWN_not_silent_fallback
        - dispatch_boundary_covered_by_tests
      known_gap_ref:
        - production_ready_requires_live_db_e2e_ci_confirmation

    product.core_runtime_bundle_gate:
      bundle_id: core-runtime-bundles-gate
      title: Core runtime bundle implementation gate
      status: not_started
      production_ready: false
      public_summary: >
        Design SSOT inspection completed for all eight core runtime bundles (email, stripe,
        file_storage, export_sftp, webhook_inbox, job_scheduler, audit_approval,
        secret_credential). All eight design SSOTs confirm: authority_boundary,
        validate-preview-apply flow, scheduler_boundary, audit_log_boundary, and
        failure_policy (no silent fallback) are defined. No implementation contract exists
        for any bundle; backend implementation has not started for any bundle. Each bundle
        requires a separate implementation contract before implementation can begin.
        export_sftp_bundle depends on file_storage_bundle for package artifact generation.
        job_scheduler_bundle extends runtime-orchestration-ssot scheduler contract.
        secret_credential_bundle is a prerequisite for other bundles requiring credential
        injection.
