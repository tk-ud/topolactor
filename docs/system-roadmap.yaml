        - sse_projection_event_flow
        - frontend_projection_runtime
        - projection_shell_refresh_boundary
      detail_ref:
        - docs/design/pipeline-continuity-ssot.yaml
        - docs/design/runtime-orchestration-ssot.yaml
      evidence_ref:
