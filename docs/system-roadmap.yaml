  ci_expectations:
    source_of_truth:
      - docs/system-roadmap.yaml
      - docs/design/pipeline-continuity-ssot.yaml
    rules:
      - roadmap_status_must_not_conflict_with_code_markers
      - implemented_components_must_have_evidence
      - production_ready_components_must_not_have_known_blocking_gaps
      - skeleton_stub_dummy_markers_are_allowed_only_when_registered_as_skeleton_or_partial
      - tests_or_fixtures_may_use_stub_dummy_mock_only_when_isolated_from_production_runtime
      - external_connector_status_must_not_claim_SSOT_authority_for_external_services
      - external_import_entries_must_declare_validate_preview_apply_completion_conditions
    recommended_checks:
      - check_system_roadmap_status_consistency
      - check_skeleton_markers_against_implementation_registry
      - check_implemented_entries_have_evidence
      - check_production_ready_entries_have_no_known_gap_ref
      - check_external_integration_entries_do_not_make_external_tools_canonical

  public_notes:
    - This roadmap is a status SSOT, not a promise of release dates.
    - Implementation status is scoped per component and may differ from overall milestone status.
    - A component can be implemented for a skeleton milestone while still not production_ready.
    - Detailed runtime semantics remain in docs/design/*.
    - External integrations are human editing/intake surfaces; topolactor remains the runtime SSOT.
    - The long-term product direction is non-IT business app authoring through validated topology, manifest, registry, projection, and CI feedback loops.
