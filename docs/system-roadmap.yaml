        - docs/design/sql-attention-logs-ssot.yaml

    backend.sql_attention_scheduler_exploration:
      status: partial
      production_ready: false
      milestone: M7_sql_attention_observation_runtime
      public_summary: scheduler/runtime hub-attractor exploration lane is partially implemented with production DI and DB reads; vector scoring and write boundary remain TODO.
      known_gap_ref:
