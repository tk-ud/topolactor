    product.scheduler_job_manifest_substrate:
      bundle_id: scheduler-job-manifest-substrate-implementation
      title: Admin-authored scheduler job manifest substrate
      status: implemented
      production_ready: false
      public_summary: >-
        DB-backed scheduler job manifest substrate. SchedulerJobRunner reads active
        due manifests from topology.scheduler_jobs, leases manifest-authorized input
        rows (pending -> processing) and runs each through an ordered abstract
        function step chain via AbstractFunctionExecutor, then transitions input row
        and run-ledger status per SSOT on_error policy (fail_run / retry /
        skip_input / mark_input_failed) with retry/retry_wait. result_binding
        performs manifest-authorized output upserts; table/column authority comes
        only from the manifest (payload-derived authority is fail-closed before any
        DB connection). admin.contents can create / edit / disable scheduler job
        manifests through AdminRuntime (scheduler_jobs:create|edit|disable); the
        frontend submits a manifest draft only and holds no SQL / runtime /
        credential authority, and secret material is fail-closed in both authoring
        and read-only projection. The former RetentionScheduler cron is absorbed:
        seed job log_retention_sweep dispatches the system.log_retention abstract
        function (log_retention primitive) — the retention domain body stays in
        LogRetentionRuntime, not in the cron driver.
      scope:
        - scheduler_job_manifest_tables
        - admin_contents_authoring_surface
        - cron_background_driver_domain_independent_tick
        - input_lease_and_run_ledger
        - abstract_function_step_chain_dispatch
        - external_service_reference_boundary
        - representative_existing_cron_absorption
