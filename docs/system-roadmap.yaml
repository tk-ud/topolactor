    backend.runtime_timeline_scheduler:
      status: implemented
      production_ready: false
      milestone: M1_runtime_skeleton
      public_summary: >
        RuntimeTimelineScheduler aligns cron/hook/client triggers through one Channel-based
        queue and routes them to ManifestDispatcher before runtime execution.
        Queue persistence boundary is declared in-memory (no DB persistence).
        Overflow: client triggers return SCHEDULER_QUEUE_FULL; cron/hook return explicit bool false.
        Cancellation: client triggers return CLIENT_TRIGGER_CANCELED; non-client dispatch
        cancellation is logged and swallowed (fire-and-forget, service stopping).
        Gap-14 and Gap-15 runtime boundary verification route are resolved.
      files:
        - backend/scheduler/RuntimeTimelineScheduler.cs
      evidence:
