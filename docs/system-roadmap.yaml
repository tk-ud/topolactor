system_roadmap_ssot:
  name: topolactor_system_roadmap
  version: 0.2.1
  status: public_status_ssot
  visibility: public

  purpose:
    - publish_system_direction
    - distinguish_implemented_from_skeleton_or_partial
    - define_milestones_and_completion_conditions
    - provide_ci_readable_implementation_registry
    - prevent_skeleton_stub_dummy_work_from_being_reported_as_complete
    - define_external_integration_as_human_editing_surface_not_system_SSOT
    - expose_non_IT_business_system_authoring_roadmap

  document_role:
    summary: >
      Public-facing project status SSOT. This file describes the system roadmap,
      milestone state, implementation status, evidence, and completion conditions.
      It is intentionally higher level than docs/design/* and more structured than README.
    owns:
      - roadmap
      - milestones
      - implementation_registry
      - public_completion_terms
      - ci_status_expectations
      - external_integration_direction
    does_not_own:
      - low_level_design_detail
      - temporary_task_queue
      - audit_report_logs
      - agent_operating_rules
      - private_work_notes
      - external_service_operational_credentials

  related_surfaces:
    detailed_design_ssot:
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/pipeline-continuity-ssot.yaml
      - docs/design/sql-attention-logs-ssot.md
      - docs/design/sql-attention-logs-ssot.yaml
      - docs/framework-core.yaml
      - docs/framework-policy.yaml
      - docs/design/css-dictionary-ssot.yaml
    task_queue:
      - .agent/tasks/todo.md
    audit_reports:
      - .agent/reports/

  status_terms:
    planned:
      meaning: roadmap-approved planned lane or contract with implementation not started yet
      production_ready: false
    not_started:
      meaning: required by roadmap or design SSOT, but no implementation surface exists yet
      production_ready: false
    skeleton:
      meaning: boundary or adapter exists, but runtime behavior is pass-through, placeholder, or incomplete
      production_ready: false
    partial:
      meaning: some runtime behavior exists, but completion conditions are not fully satisfied
      production_ready: false
    implemented:
      meaning: completion conditions for the declared scope are satisfied and covered by evidence checks
      production_ready: false
    production_ready:
      meaning: implemented, wired through canonical runtime route, verified by required CI, and no known blocking gap remains
      production_ready: true

  completion_rules:
    - status_implemented_requires_completion_conditions
    - status_implemented_requires_evidence_tests_or_ci
    - production_ready_requires_no_known_blocking_gap
    - skeleton_stub_dummy_marker_must_not_coexist_with_status_implemented
    - known_skeleton_or_partial_work_must_be_listed_in_implementation_registry
    - task_queue_must_not_be_used_as_the_primary_status_source
    - external_service_connection_must_not_be_treated_as_runtime_SSOT
    - external_import_must_have_preview_validate_apply_stages
    - external_sync_failure_must_be_explicit_not_silent_fallback

  external_integration_policy:
    summary: >
      External tools are human editing and intake surfaces. They are not the canonical
      runtime source of truth. The canonical source is topolactor DB topology, manifest,
      registry, schema, relation, package, and diff/log surfaces. External tools may
      propose, draft, import, preview, or trigger changes only through explicit runtime
      boundaries.
    canonical_authority:
      - topolactor_db
      - manifest
      - registry
      - schema
      - relation_registry
      - ui_topology_tensor
      - diff_log
      - runtime_event_log
    external_surface_role:
      - human_friendly_business_input
      - draft_authoring
      - intake_queue
      - preview_surface
      - notification_surface
      - approval_surface
      - external_trigger_source
    prohibited:
      - notion_as_system_SSOT
      - spreadsheet_as_runtime_policy_SSOT
      - external_tool_direct_DB_write
      - silent_external_sync_fallback
      - implicit_schema_creation_without_preview
      - frontend_or_external_tool_SQL_attention_judgment
      - webhook_direct_runtime_execution_without_scheduler
    required_flow:
      - external_source
      - connector_adapter
      - intake_snapshot
      - topology_payload_candidate
      - validate
      - preview
      - explicit_apply
      - canonical_runtime_route
      - diff_log_or_runtime_event_log

  milestones:
    M1_runtime_skeleton:
      title: Canonical runtime route skeleton
      status: partial
      goal: >
        Establish visible frontend/backend runtime route boundaries so future work can move
        behavior into the canonical data-defined route instead of adding direct branches.
      implemented_scope:
        - frontend ui action to dispatch api client path
        - backend dispatch endpoint boundary
        - backend runtime timeline scheduler skeleton
        - backend manifest dispatcher skeleton
        - default entity search vertical slice
        - SSE endpoint and frontend receiver/dispatcher skeletons
      remaining_scope:
        - manifest-driven active routing
        - real SSE projection event flow
        - explicit trigger_kind and role request identity
      detail_ssot:
        - docs/design/runtime-orchestration-ssot.yaml
        - docs/design/pipeline-continuity-ssot.yaml

    M2_manifest_runtime:
      title: Manifest-driven runtime routing
      status: partial
      goal: >
        Move runtime destination selection from hardcoded RuntimeExecutor branches into
        active manifest resolution by role, target, layer, and action.
      unlocks:
        - backend.manifest_dispatcher: implemented
        - backend.runtime_timeline_scheduler: partial
        - backend.runtime_executor_dispatch_scope: narrowed
      blocking_gaps: []

    M3_unified_timeline_and_output_lanes:
      title: Unified trigger timeline and output lanes
      status: partial
      goal: >
        Align cron, hook, and client triggers on the same backend runtime timeline,
        then route effects into response, db_notify, and registry_attractor output lanes.
      unlocks:
        - backend.runtime_timeline_scheduler: implemented (queue_boundary_hardening_complete)
        - backend.output_lane_router: partial
        - backend.db_notify_listener: implemented (live pg_notify -> scheduler -> SSE gate in check-runtime-environment.sh)

    M4_projection_runtime:
      title: SSE and projection runtime
      status: partial
      goal: >
        Connect backend projection events through SSE into frontend scheduler,
        dispatcher, projection runtime, and UI projection without frontend topology judgment.
      unlocks:
        - backend.sse_emitter: partial
        - frontend.sse_receiver: implemented
        - frontend.sse_dispatcher: implemented
        - frontend.projection_constructor: implemented
      blocking_gaps: []

    M5_admin_and_ui_topology:
      title: Admin UI, component topology, and seed runtime
      status: partial
      goal: >
        Provide admin-facing registry, seed, component, layout, and projection management
        surfaces while keeping DB topology and backend runtime as the semantic authority.
      blocking_gaps:
        - Issue #84 seed import/export runtime
        - Issue #86 frontend UI component system
        - Gap-9 admin route skeletons

    M6_external_integration:
      title: Self-hosted admin authoring loop (MVP)
      status: implemented
      goal: >
        Establish a self-hosted admin authoring loop where admins can import CSV/JSON,
        validate-preview-apply candidates, define JSONB label/value manifest and
        user-defined aggregation/display/binding policy, bind DB/JSONB fields into
        document canvas templates, render invoice/estimate/delivery-note style documents,
        and export PDF snapshots with canonical diff/audit linkage.
      primary_entry_surface:
        - admin_csv_import
        - admin_json_import
        - admin_document_canvas
      future_optional_external_surfaces:
        - Notion
        - Google Sheets
        - Slack
        - GitHub Issues
        - generic webhooks
        - external REST API connectors
      intended_non_IT_loop:
        - admin_imports_csv_or_json_as_candidate_payload
        - validate_stage_returns_explicit_mapping_required_field_and_policy_errors
        - preview_stage_shows_manifest_binding_document_and_runtime_effect_candidates
        - explicit_apply_enters_canonical_runtime_route_without_direct_db_write
        - jsonb_label_value_manifest_defines_display_aggregation_and_binding_policy
        - admin_binds_db_jsonb_fields_into_document_canvas_template
        - invoice_estimate_delivery_note_documents_render_from_bound_data
        - pdf_export_persists_export_snapshot_and_applied_diff_audit_linkage
      unlocks:
        - admin_csv_import_validate_preview_apply: implemented
        - admin_json_import_validate_preview_apply: implemented
        - intake_snapshot_and_applied_diff_log: implemented
        - jsonb_label_value_manifest_runtime: implemented
        - user_defined_aggregation_display_binding_policy: implemented
        - DocumentCanvasTemplateEditor_primitive_wiring: implemented
        - document_canvas_runtime_connected_factory_registration: implemented
        - data_binding_to_document_canvas: implemented
        - pdf_export_snapshot_runtime: implemented
        - scheduler_runtime_load_benchmark: implemented
      test_bundle_refs:
        document_canvas_runtime_connected_factory_registration:
          - document_canvas_runtime_factory_registration
          - document_canvas_catalog_seed_ssot_consistency
          - document_canvas_projection_constructor_field_validation
        data_binding_to_document_canvas:
          - projection_runtime_component_props_pipeline
          - document_canvas_projection_constructor_field_validation
          - jsonb_label_value_manifest_runtime
          - user_defined_aggregation_display_binding_policy
          - document_canvas_db_binding_loop
        jsonb_label_value_manifest_runtime:
          - jsonb_label_value_manifest_runtime
        user_defined_aggregation_display_binding_policy:
          - user_defined_aggregation_display_binding_policy
        pdf_export_snapshot_runtime:
          - pdf_export_snapshot_runtime
        scheduler_runtime_load_benchmark:
          - scheduler_runtime_load_benchmark
      blocking_gaps: []
      completion_condition:
        - admin_can_import_csv_json_as_candidate_payload
        - validate_preview_apply_stages_are_separated
        - broken_mapping_or_missing_required_field_returns_explicit_validation_error
        - imported_data_does_not_bypass_canonical_runtime_route
        - jsonb_label_value_manifest_defines_display_aggregation_and_binding_policy
        - user_can_bind_db_jsonb_fields_into_document_canvas_template
        - invoice_like_document_can_render_from_bound_data
        - pdf_export_creates_snapshot_export_record
        - applied_canonical_diff_and_source_intake_snapshot_are_both_recorded
      public_summary: >
        M6 MVP focuses on self-hosted admin authoring, not external connectors. CSV/JSON
        intake, JSONB manifest policy, document canvas binding, and PDF snapshot/diff
        evidence are the completion boundary. External APIs remain future optional
        surfaces and are explicitly outside M6 MVP completion judgment.

    M7_sql_attention_observation_runtime:
      title: SQL Attention observation runtime
      status: production_ready
      goal: >
        Implement SQL Attention as a DB-native hub-attractor observation runtime with
        explicit separation of logs.current, logs.hub_current, and logs.attention planes.
        Completion is defined by logs.attention evidence-row persistence (not exploration
        execution alone). Topology/context-route recommendation remains a child projection
        and consumer surface, not the SQL Attention parent observation body.
      blocking_gaps: []
      test_bundle_refs:
