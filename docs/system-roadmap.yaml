      public_summary: >
        Scheduler/runtime load benchmark test provides performance/load evidence with
        all required production metrics: input_count, processed_count, rejected_count,
        timeout_count, backlog_count, queue_full_count, and latency summary (min, max,
        avg, p50, p95, p99 in ms). Two scenarios: sustained_throughput (all within-capacity
        requests processed, backlog=0) and high_volume_burst (all outcomes accounted for,
        no silent drop). This is performance/load evidence, not a protocol test.
      files:
