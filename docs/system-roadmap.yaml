          - SchedulerDispatcherChainTests
          - RuntimeExecutorTests
          - DefaultEntitySearchIntegrationTests
        ci:
          - backend-tests
          - runtime-semantics
          - default-entity-search
          - unified-test-gate
          - Structure Check
      completion_condition:
        - cron_hook_client_triggers_are_aligned_in_one_runtime_queue
        - scheduler_owns_ordering_collision_control_and_execution_boundary
        - runtime_executor_does_not_own_trigger_alignment
        - queue_overflow_returns_explicit_signal_for_all_trigger_kinds
        - cancellation_boundary_is_explicit_for_client_and_non_client_triggers
        - queue_persistence_boundary_is_declared_in_memory_no_db_persistence
      known_gap_ref: []
      detail_ssot:
        - docs/design/runtime-orchestration-ssot.yaml

    backend.manifest_dispatcher:
      status: implemented
      production_ready: false
      milestone: M1_runtime_skeleton
      public_summary: >
        Gap-1 complete (1a+1b): ManifestDispatcher resolves active manifest from DB by
        role+target+layer+action axes via NpgsqlManifestRepository, then dispatches to the
        registered IDispatchableRuntime handler selected by runtime_destination.
        topology_transform_runtime → RuntimeExecutor (canonical topology pipeline).
        admin_runtime → AdminRuntimeDispatchAdapter → AdminRuntime.ExecuteDataAsync.
        TargetDispatchOverride is isolated in the null-repository (dev/demo bypass) branch only.
        MANIFEST_NOT_FOUND, MANIFEST_AMBIGUOUS, RUNTIME_DESTINATION_UNKNOWN are explicit errors.
        Admin route manifests in seed_empty.sql (IDs 50-5a) use runtime_destination=admin_runtime.
        Test fixture stubs (FakeDispatchableRuntime) verify selection boundary without
        contaminating production DI.
      files:
