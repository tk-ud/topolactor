        AdminRuntime live verification is in check-runtime-environment.sh. db_notify dispatch now resolves source manifest identity via manifest_id and uses db_notify_projection_mapping (not runtime_mapping) to reach sse_projection_runtime. OutputLaneRouter full db_notify/SSE live verification remains TODO.
      files:
