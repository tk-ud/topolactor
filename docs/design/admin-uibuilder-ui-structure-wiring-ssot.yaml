          Each trigger's value: a non-empty string matching
          "manifest:<uuid>:<layer>:<action>" (RUNTIME_INTERACTION_DISPATCH_TARGET_REF_BY_TRIGGER_VALUE_MUST_BE_STRING
          / _TARGET_REF_INVALID on violation) -- fails the whole node closed, never silently
          skipped. Backend mirrors the same regex (NpgsqlUiTopologyRepository.cs
          AdminRuntimeTargetRefRe) so both boundaries agree on the same accept/reject decisions.
          This regex requires the canonical 36-character hyphenated UUID form -- a strict SUBSET
          of what ManifestDispatcher.TryParseManifestTargetRef's own Guid.TryParse would accept
          (which additionally tolerates brace/no-hyphen forms). This is not a NEW inconsistency:
          node.targetRef itself (the layout's own uniform target_ref, in production since
          2026-07-22) has always been validated against this SAME strict regex
          (parseAdminRuntimeLayerAction) despite the more lenient runtime parser -- this field
          deliberately matches that existing precedent rather than independently adopting
