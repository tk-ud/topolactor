admin_uibuilder_ui_structure_wiring_ssot:
  name: admin_uibuilder_ui_structure_wiring
  version: 0.6.0
  status: ssot_design_document
  canonical_path: docs/design/admin-uibuilder-ui-structure-wiring-ssot.yaml
  authority_hierarchy: >-
    This SSOT is the design authority (設計正本) for the surface. The audit
    report (.agent/reports/frontend-ui-audit-bundle-semantic-frame.md) is audit
    evidence and the semantic frame that motivated this SSOT's vocabulary — it
    is a revision basis, not a design or vocabulary authority. Tests are
    SSOT-conformance proof; implementation conforms to SSOT and tests. SSOT /
    test / implementation must keep the same trigger group mapping and setting
    category taxonomy defined here; implementation-derived catch-all categories
    are not SSOT taxonomy.

  purpose:
    summary: >-
      Owning SSOT for the /admin/ui-builder UI structure and wiring surface:
      the layout canvas / wiring canvas boundary, UI event settings,
      runtimeInteractions authoring, and external capability selection from the
      seed-backed registry. This document is the canonical design authority for
      the surface; implementation and tests map to it, never the reverse.
    owns:
      - /admin/ui-builder UI structure (mode boundary, dock composition intent)
      - layout canvas / wiring canvas responsibility boundary
      - UI event settings authoring contract and setting category taxonomy
      - runtimeInteractions authoring persistence authority statement
      - external capability selection from seed registry (typed reference contract)
      - trigger vocabulary and lifecycle / high-frequency / drag-drop / side-effect-cycle policies
      - component runtime state/effect boundary for authored interactions
    does_not_own:
      - canonical_route_registry: docs/design/runtime-orchestration-ssot.yaml frontend_routes
      - canvas_workspace_contract_body: docs/design/admin-console-workflow-ssot.yaml ui_builder_canvas_workspace
      - runtimeInteractions_descriptor_field_contract: docs/design/admin-console-workflow-ssot.yaml layout_node_props_contract
      - external_port_record_and_credential_boundary: docs/design/external-port-substrate-ssot.yaml
      - instance_port_record_and_operation_binding_boundary: docs/design/instance-port-substrate-ssot.yaml
      - frontend_component_event_log_lane_vocabulary: docs/design/pipeline-continuity-ssot.yaml (COMPONENT_EVENT_TYPES / eventType)
      - preset_ecosystem: docs/design/ui-builder-preset-ecosystem-ssot.yaml
      - proof_surface_policy_body: docs/design/pipeline-continuity-ssot.yaml
    ownership_boundary_note: >-
      docs/design/ui-builder-preset-ecosystem-ssot.yaml is NOT the owning SSOT for
      this surface. Preset ecosystem remains a support surface under its own SSOT.

  route_authority:
    route: /admin/ui-builder
    canonical_route_registry: docs/design/runtime-orchestration-ssot.yaml frontend_routes.admin
    workflow_position: docs/design/admin-console-workflow-ssot.yaml (canvas workspace route, not a pipeline step)

  lineage_boundary:
    current_reusable_canvas_lineage: FlowLayoutCanvas
    historical_note: >-
      The historical VisualLayoutCanvas direct-manipulation lineage was replaced
      before the current audit report scope. Restoring it is not required by this
      bundle, and old Figma-like wording must not be treated as current blocking
      authority.

  layout_mode:
    role: primary placement / design authoring mode (current FlowLayoutCanvas lineage)
    owns:
      - placement (flow layout tree, parent/slot/order)
      - css / responsive token refs
      - inlineText / URL link (linkHref / linkTarget)
      - props / propBindings / calculationBindings
    primary_inspector: layout / design settings (配置インスペクタ / デザインインスペクタ)
    canvas_component: frontend/components/FlowLayoutCanvas.tsx
    existing_canvas_reuse_policy:
      - reuse existing FlowLayoutCanvas / drag-drop interaction assets where compatible
      - do not replace the existing layout canvas with a separate authority
      - existing drag/drop connection edit assets are the preferred adaptation path
        before any new interaction implementation
    prohibited:
      - discarding_existing_canvas_or_drag_drop_assets_without_ssot_reason
      - replacing_existing_layout_canvas_with_new_persistence_authority
      - reviving_historical_visual_layout_canvas_restoration_as_current_blocker

  lane_storage_boundary:
    role: >-
      top_ssot_alignment surface. Formalizes the five authoring/runtime lanes this
      surface's authoring model spans, their persistence target, and their idempotency
      applicability, so no lane statement below is written as if lanes were undifferentiated.
      top SSOT (docs/framework-core.yaml topolactor_space_model / docs/framework-policy.yaml
      ui_topology_tensor_persistence, db/manifest_tables.sql) holds that manifest.topology
      is a registry-refs / package-refs / layout-refs / relay-refs / runtime-vector store,
      never a UI-entity payload store; UI package/layout/design/wiring/tensor content lives
      in topology.ui_component_package / topology.components_layout_design /
      topology.components_style_design / topology.components_package_design /
      topology.ui_wiring_registry / topology.ui_topology_tensor (db/ui_topology_tables.sql).
      This section is this surface's binding statement of that split for its own lanes.
    lanes:
      package_internal_api_wiring_lane:
        label_ja: 内部API (package/internal API wiring lane)
        authoring_surface: ManifestStep3EventWiringPreset / PackageConnectionPanel (ui_event_settings.setting_category_taxonomy.backend_side.internal_api)
        persistence_target: >-
          topology.components_package_design (manifest-facing package authority, role
          component_design_bundle_referenced_by_manifest, manifest_reference:
          manifest.topology[ui_projection].packageIds per docs/design/db-schema.yaml) +
          topology.ui_wiring_registry + topology.ui_topology_tensor relation
          (ui_topology:update_package_wiring), never manifest.topology payload directly.
          topology.ui_component_package (role component_group_bundle) is a DIFFERENT,
          narrower identity: it exists only to satisfy topology.ui_topology_tensor.package_id's
          own FK constraint, and this lane must never treat it as interchangeable with
          topology.components_package_design or as a manifest.packageIds target -- see
          docs/design/react-schema-topology-seed-translator-ssot.yaml
          storage_adoption_contract.adoption_candidate_separation_contract.package_authority_boundary,
          which states and enforces the same two-identity split for translator output.
        runtime_path: package/wiring persistence read at projection build time; not a per-event runtimeInteractions dispatch
        idempotency_applicability: known_gap
        idempotency_note: >-
          This lane is a design-time package/wiring persistence operation
          (ui_topology:update_package_wiring), not a runtime dispatch call, so it is not
          currently a runtime_dispatch_idempotency_ledger target. If a future bundle makes
          package/internal API wiring itself a retryable runtime dispatch, it must either
          convert that dispatch into a runtimeInteractions carrier (this lane's own entry
          below) or define its own stable identity carrier under a dedicated design_change
          SSOT amendment here — it must never silently inherit runtime_interactions_lane's
          idempotency_key carrier by proximity. Left as known_gap, not asserted complete.
      runtime_interactions_lane:
        label_ja: 副作用設定 / 外部API連携 / 外部インスタンス連携 (runtimeInteractions lane)
        authoring_surface: wiring_mode (WiringGraphPanel / NodeEventAuthoringPanel)
        persistence_target: topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions[]
        runtime_path: >-
          layout_patch_json.nodes[].runtimeInteractions[] -> ApplyConfirmedLayoutPatchAsync ->
          AssignRuntimeInteractionIds -> renderEmission / uiEventEffectRunner ->
          frontendScheduler payload.idempotency_key
        idempotency_applicability: always_for_dispatchExternalPort_and_dispatchInstanceOperation_actionTypes
        idempotency_note: >-
          Precise scope of retry_safe_dispatch_idempotency.gating below: this lane's
          dispatchExternalPort / dispatchInstanceOperation runtimeInteractions entries always
          compute and forward idempotency_key (lifecycle path uiEventEffectRunner.ts
          emitLifecycle; event-triggered path renderEmission.ts + runtimeComponentFactory.ts
          emitBoundEvent). localStateMutation / routeNavigation entries in this same lane are
          not backend/external dispatch and carry no idempotency_key.
      external_api_lane:
        label_ja: 外部API連携
        authoring_surface: wiring_mode setting_category external_api_integration
        persistence_target: runtime_interactions_lane carrier (dispatchExternalPort runtimeInteractions entry); registry authority in topology.external_access_ports / external_response_ports / external_hook_ports
        runtime_path: same as runtime_interactions_lane; ExternalPortDispatchRuntime.cs ExecuteAsync claims the ledger before ExecutePolicyAsync
        idempotency_applicability: always
      external_instance_lane:
        label_ja: 外部インスタンス連携
        authoring_surface: wiring_mode setting_category external_instance_integration
        persistence_target: runtime_interactions_lane carrier (dispatchInstanceOperation runtimeInteractions entry); registry authority in topology.db_instance_port / runtime_instance_port / instance_operation_authority_binding
        runtime_path: same as runtime_interactions_lane; InstancePortRuntime.cs ExecuteAsync claims the ledger before AbstractFunctionExecutor.ExecuteAsync
        idempotency_applicability: always
      local_ui_state_lane:
        label_ja: UI監視割当 / UI状態更新
        authoring_surface: wiring_mode setting_category ui_watch_binding / ui_state_update
        persistence_target: topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions[] (actionType localStateMutation) for declared mutations; projection-local runtime state store (frontend/runtime/uiEventEffectRunner.ts createRuntimeLocalStateStore) for the live value at runtime -- never manifest.topology, never a separate persistence table
        runtime_path: applyGuardedLocalStateMutation via the shared guarded dispatcher; no backend/external dispatch
        idempotency_applicability: not_applicable
        idempotency_note: local state mutation never calls dispatchExternalPort/dispatchInstanceOperation, so it carries no idempotency_key by design, not by omission.
    known_gaps:
      - gap: admin_runtime_layer_action_dispatch_lane_not_yet_defined
        classification: missing_lane_ssot_gap
        status: resolved_direction_selected_generic_mechanism_implemented
        note: >-
          Confirmed via PR #597 (admin-surface-topology-seed-conversion admin-enum
          subBundle) Gate0 re-audit, 2026-07-22: none of the five lanes above, and none
          of the six setting_category_taxonomy categories below (ui_event_settings),
          was designed to carry a generic manifest-authorized admin_runtime layer:action
          dispatch (the concrete admin_runtime actions already registered and
          dispatcher-mapped in db/seed_empty.sql, e.g. enum_dictionary:*, auth_users:*,
          team_markdown:*, scheduler_jobs:*, content_bundle:*) from a seed-authored
          Action node. topology.ui_wiring_registry.wiring_schema_json (the JSON content
          column, as distinct from its wiring_kind/target_surface/target_ref flat
          columns) still has zero runtime or frontend consumers anywhere in the
          codebase -- it must not be treated as execution-wiring evidence by any future
          bundle. See docs/design/react-schema-topology-seed-translator-ssot.yaml
          wiring_lane_contract for the corresponding cross-reference.
        owner_decision_2026_07_22: >-
          No new dedicated runtime lane (extend_runtime_interactions_lane rejected: NO).
          No single-surface-specific handler (a bespoke enum-only dispatch path
          rejected: NO). Converge into an EXISTING generic substrate instead: connect
          admin_runtime layer:action dispatch through the existing generic
          component_wiring_execution_lane (extend_wiring_kind_vocabulary: YES) --
          abstract_function_substrate_bridge remains a viable backend EXECUTION-side
          option for individual admin_runtime actions (AdminRuntime.cs already
          demonstrates payload-derived abstract function execution via
          DataSqlAttentionListProjectionAsync's
          AbstractFunctionExecutionContext(requestPayload: vector.Payload,
          requiredRuntimeLane: "admin_runtime") for a read case; SchedulerExecutionContext's
          manifest-authorized-only binding does NOT apply to this admin_runtime-lane
          context type, correcting this entry's earlier note) but is independent of and
          does not replace the frontend reachability decision below -- it is a
          per-action backend implementation choice, orthogonal to how the dispatch
          reaches AdminRuntime.ExecuteDataAsync at all.
        concrete_boundary_implemented: >-
          frontend/runtime/renderEmission.ts mapWiringKindToLayer / mapWiringKindToAction
          gained a wiringKind="admin_runtime" case: layer/action are parsed from the
          wiring row's own target_ref content -- CORRECTED 2026-07-23 after a live-DB
          proof caught a real bug in the first pass: targetRef must stay a valid
          ManifestDispatcher manifest reference, "manifest:<manifestUuid>:<layer>:
          <action>" (e.g. "manifest:00000000-0000-0000-0000-0000000ae200:enum_dictionary:
          create_group"), never a bare "<layer>:<action>" string. The same targetRef
          value is forwarded verbatim as the dispatch request's own payload.target_ref
          (enqueueRuntimeComponentCommand), which ManifestDispatcher.
          TryParseManifestTargetRef (backend/runtime/ManifestDispatcher.cs) parses with
          Split(':', 3) -- only the first two segments (the "manifest:" prefix and this
          manifest's own UUID) are validated/consumed for MANIFEST resolution; the third
          segment is free-text there and is what parseAdminRuntimeLayerAction reads as
          "<layer>:<action>". A bare "<layer>:<action>" targetRef (the first pass's
          shape) fails TARGET_REF_INVALID server-side before ever reaching
          AdminRuntime.ExecuteDataAsync -- every unit test written before the live-DB
          proof passed anyway, because they only asserted the OUTGOING request shape,
          never a real round trip through ManifestDispatcher. This is now corrected and
          live-DB proven (see read_circuit_consumed_and_proven below); the fix is
          reusable by any admin_runtime action across any subBundle, no per-operation
          case added (parseAdminRuntimeLayerAction still contains zero surface-specific
          logic). Layer/action are two axes independent of manifest resolution:
          request.Layer/request.Action are separate top-level EndpointRequestDto fields
          AdminRuntime.ExecuteDataAsync's layerAction switch reads directly, never
          re-derived from target_ref. frontend/runtime/frontendScheduler.ts
          RuntimeDispatchSpec gained an optional payload field, forwarded verbatim by
          enqueueRuntimeComponentCommand. frontend/runtime/runtimeComponentFactory.ts
          emitBoundEvent's Lane 2 (component_wiring_execution_lane branch) now merges
          the event-time payload (the same argument other lanes' payload/log merge
          already uses -- e.g. a single triggering control's own event value) into the
          dispatch, giving admin_runtime dispatch a real payload carrier without a new
          payloadFrom concept -- see remaining_write_payload_capture_gap below for the
          real limit of what this carries. idempotency_applicability for this new case
          is not_applicable, same reasoning as local_ui_state_lane: this is a
          synchronous admin CRUD action carrying no dispatchExternalPort/
          dispatchInstanceOperation identity, not a retryable external/instance
          operation -- if a future bundle needs retry-safe admin_runtime dispatch
          idempotency, that is a separate, not-yet-defined extension, not silently
          inherited from runtime_interactions_lane. Proof:
          frontend/tests/adminWiringExecutionLane.test.ts (mapWiringKindToLayer/
          mapWiringKindToAction admin_runtime cases including manifest-prefixed and
          bare-string fail-close cases, buildRuntimeDispatchSpec generic reuse across
          two different admin_runtime actions/manifests, and an end-to-end emitBoundEvent
          test asserting the captured api_command_lane request body carries
          target/layer/action/payload correctly) plus, since the earlier bug could only
          be caught by a real round trip, backend/tests/Topolactor.Integration.Tests/
          AdminEnumHubRelationUiProjectionLiveDbTests.cs
          DispatchAsync_AdminEnumManagementManifest_DispatchesRealListGroups_
          EmissionDataAndTablePropsCarryRealRows (see read_circuit_consumed_and_proven).
          No backend change to the dispatch transport itself was required: ManifestDispatcher /
          AdminRuntimeDispatchAdapter / AdminRuntime.ExecuteDataAsync were already fully
          generic on target/layer/action (confirmed by the pre-existing
          callAdminMasterOp precedent using the same queueAdminClientCommand transport);
          backend/repository/NpgsqlTopologyRepository.cs MapWiringKindToDispatchAction
          was intentionally left unchanged since its own output (RuntimeDispatchAction)
          has no frontend consumer anywhere (verified by grep) and is unrelated to this
          mechanism's actual dispatch path. A genuinely NEW backend addition was needed
          for real render proof, unrelated to dispatch routing itself: see
          read_circuit_consumed_and_proven's LayoutSchemaTensorComposer note.
        read_circuit_consumed_and_proven: >-
          2026-07-23, second consumption pass. admin-enum's manifest
          (00000000-0000-0000-0000-0000000ae200) now dispatches the real, existing
          enum_dictionary:list_groups admin_runtime action for its whole read/search/
          filter screen (wiring_kind=admin_runtime, target_surface=manifest -- "admin"
          is rejected by topology.ui_wiring_registry's own
          ck_ui_wiring_registry_target_surface CHECK constraint, target_surface must be
          one of route/ui/manifest/external_port). This is safe under the
          layout=one-canonical-operation model: read/search/filter genuinely are one
          operation for this screen, so every node's click/change/select/submit/toggle
          trigger safely inheriting the same list_groups dispatch is correct, not a
          granularity violation (idempotent no-payload re-list on every keystroke is
          wasteful, not incorrect -- see remaining_write_payload_capture_gap for why a
          real server-side search/filter parameter is a separate, not-yet-solved
          problem). A second, real backend addition was needed to make this render, not
          only dispatch: backend/repository/LayoutSchemaTensorComposer.cs previously
          merged ONLY RuntimeInteractions from a tensor node onto a schema-composed
          catalog_component leaf by exact NodeId match -- PropsJson/StateJson/
          PropBindingsJson on that SAME tensor node were silently discarded for this
          layout shape (Compose() never read them). BuildNodeLocalDataByNodeId +
          Compose's new optional nodeLocalDataByNodeId parameter close this: additive,
          opt-in per exact NodeId match, zero behavior change for any existing
          schema-composed layout that does not author matching tensor node entries
          (Runtime.Tests: ComposeLayoutSchemaWithTensor_NoNodeLocalDataMapProvided_
          ComposesAsBeforeThisFeature). This is what lets enum_table's static columns
          (propsJson, including "table":null to escape data_display/table's inert
          preview-placeholder default -- frontend/runtime/runtimeComponentFactory.ts
          tableFactory falls back to top-level props only when props.table is not a
          non-null object) and emission.data-bound rows (propBindings, validated
          against backend/runtime/StructureMapResolver.cs
          ComponentArrayPropCapabilities["data_display/table"]) actually reach the
          frontend. Live-DB proof: AdminEnumHubRelationUiProjectionLiveDbTests.cs
          DispatchAsync_AdminEnumManagementManifest_DispatchesRealListGroups_
          EmissionDataAndTablePropsCarryRealRows -- dispatches with Layer="enum_dictionary"
          Action="list_groups" (top-level EndpointRequestDto fields, NOT derived from
          target_ref) plus payload.target_ref="manifest:<ae200 uuid>:enum_dictionary:
          list_groups" (manifest resolution only), asserts emission.Data contains the
          real db/enum_seed.sql "demo_status" group, and asserts enum_table's composed
          PropsJson/PropBindings carry the real columns/rows binding shape.
        remaining_write_payload_capture_gap: >-
          2026-07-23, replaces the prior (2026-07-22) remaining_granularity_constraint
          entry -- that framing was wrong: per-layout scope alone was never the real
          blocker for admin-enum's write side (a single-purpose write layout, exactly
          like the read layout above, is a safe and sufficient composition -- no
          per-node extension needed). The REAL, deeper blocker, found while attempting
          to actually wire a write operation for live-DB proof: no production-proven
          mechanism exists to get a free-typed field value (e.g. a new group's name) or
          an extracted event path into ANY dispatch payload today, admin_runtime or
          otherwise. Two independent, confirmed causes: (1)
          frontend/runtime/uiEventEffectRunner.ts UI_STATE_UPDATE_OPEN_ACTIONS maps
          EVERY ui_state_update actionType -- including localStateMutation -- to a
          fixed boolean (true/false/toggle) by design (see its own inline comment: "a
          localStateMutation trigger writes true to its ui-local: target -- a flag
          write ... never a business-data value the seed record does not carry"); there
          is no seed-authorable actionType that writes an event-derived typed value
          into ui-local state at all. (2)
          frontend/runtime/payloadFromResolver.ts's node:<nodeId>.value resolution
          (used by dispatchExternalPort/dispatchInstanceOperation, e.g. the existing
          credential-management cd004 wiring's own node: payloadFrom entries) depends
          on payloadFromNodeValues, a renderEmission() options field
          frontend/islands/ProjectionShell.tsx -- the actual production projection
          renderer -- never populates (grep-confirmed zero references in that file);
          only UI-Builder canvas authoring (NodeEventAuthoringPanel.tsx/
          UiBuilderAdmin.tsx) populates it. This means node:<id>.value payloadFrom
          references are UNPROVEN in production for ANY surface today, not an
          admin-enum-specific gap -- fixing it (making ProjectionShell track/forward
          live input values, then giving Lane 2 its own payloadFrom resolution against
          that map, mirroring dispatchExternalPort/dispatchInstanceOperation's existing
          pattern) is a real, bounded, but separate, cross-cutting prerequisite, not
          attempted in this pass given its blast radius (a shared, live production
          component) and the amount of independent verification it deserves on its own.
          What a SINGLE trigering event's OWN native payload already carries (e.g. a
          table row-click event's own `{row: {...}}`, whose fields the caller can
          choose to spread if they match the target action's DTO field names) remains
          usable without this fix -- delete-shaped actions taking exactly the row's own
          id field(s) (enum_dictionary:delete_item/delete_group) are the closest
          candidates for the next real write-side proof, not create/update (which need
          genuinely new typed input, not an existing row's own value).
        write_payload_capture_mechanism_implemented: >-
          2026-07-24. Both cross-cutting prerequisites named above are implemented and
          tested; this gap's own diagnosis text above is kept as history and superseded
          by this entry, not rewritten. (1)
          frontend/runtime/liveNodeValueTracker.ts createLiveNodeValueTracker() is a new,
          surface-independent, stable-node-identity register/update/deregister store
          (set/snapshot/reconcile). frontend/islands/ProjectionShell.tsx now owns one
          instance per mount (a ref, never re-created across rerenders/SSE refresh) and
          passes it into every renderEmission() call as
          payloadFromNodeValues:tracker.snapshot() (same object reference every call, so
          a runtimeSpec closure captured at an earlier render still observes later
          writes) and onNodeValueChange:tracker.set. reconcile() runs on initial mount
          and on every SSE refresh against the CURRENT layoutNodes list, so a
          removed/replaced node's stale tracked value cannot leak into a later dispatch
          -- this closes the negative cases stale_node_value / node_reconciliation.
          renderEmission.ts wires onNodeValueChange into a per-node closure on
          ComponentDataHub/RuntimeComponentSpec (mirrors the existing
          payloadFromNodeValues plumbing exactly).
          runtime/runtimeComponentFactory.ts emitBoundEvent gained a node-value-tracking
          lane (fires on change/input/select when payload carries "value", BEFORE the
          previewMode gate, same event-time-extraction pattern as the pre-existing
          calcTriggerCallback lane) -- this is the write side of payloadFromNodeValues,
          proven in production for the first time (frontend/tests/
          liveNodeValueTrackerAndAdminRuntimePayloadFrom.test.ts). (2) Lane 2
          (component_wiring_execution_lane, admin_runtime) reuses the SAME
          resolvePayloadFrom() single resolution authority
          (frontend/runtime/payloadFromResolver.ts) dispatchExternalPort/
          dispatchInstanceOperation already use -- no new resolver, no surface-specific
          payload builder. frontend/runtime/frontendScheduler.ts RuntimeDispatchSpec
          gained an optional payloadFrom field; renderEmission.ts's new
          buildAdminRuntimePayloadFromByTrigger() reads it from a node's OWN
          runtimeInteractions[] entries carrying the new, generic (non-surface-specific,
          reusable by any admin_runtime layer:action) actionType
          "bindRuntimeDispatchPayload" -- deliberately outside the closed
          WIRING_SETTING_CATEGORIES taxonomy (uiBuilderWiringProjection.ts), since that
          taxonomy governs UI-Builder canvas-authoring policy checks, not this
          seed-authored runtime dispatch path; an unrecognized actionType there is
          silently skipped by the existing category builders and never trips
          RUNTIME_INTERACTION_UNATTRIBUTABLE (which only fires when the overall
          eventBinding ends up empty -- an admin_runtime node's wiringKind-derived base
          binding already prevents that). Priority/conflict rule (the canonical contract
          per this gap's own remaining_granularity_constraint discussion above): when a
          payloadFrom map is authored for a trigger, RESOLVING it is the SOLE payload
          authority for that dispatch -- unresolved node value / malformed event path is
          a hard fail-close (PAYLOAD_FROM_NODE_NOT_FOUND / PAYLOAD_FROM_EVENT_PATH_NOT_FOUND
          / PAYLOAD_FROM_UNRESOLVED_REF, never a silent empty/false/null degrade); when no
          payloadFrom is authored for a trigger, the pre-existing PR597 raw event-time
          payload passthrough is unchanged (regression-proven). Live-DB proof (real
          PostgreSQL, not an in-memory echo): backend/tests/Topolactor.Integration.Tests/
          AdminEnumHubRelationUiProjectionLiveDbTests.cs
          DispatchAsync_AdminEnumManagementManifest_CreateGroupThenDeleteGroup_
          PersistsAndReListReflectsDiff dispatches enum_dictionary:create_group then
          enum_dictionary:delete_group directly against the SAME dispatcher chain the
          frontend mechanism above drives, asserts the write persists AND that a
          subsequent enum_dictionary:list_groups re-dispatch reflects the diff (create
          appears, delete is gone -- the write/reread/evidence boundary), and asserts two
          negative cases fail close (malformed groupId, nonexistent groupId) without
          corrupting the row created earlier in the same test. This resolves
          admin-runtime-operation-dispatch-lane-determination's third acceptance
          condition (admin-enum/team-dashboard/scheduler-settings write-dispatch CAN now
          proceed under the single component_wiring_execution_lane contract) -- it does
          NOT itself ship admin-enum's/team-dashboard's/scheduler-settings' own
          production write UI (buttons, forms, seed wiring rows beyond this proof); that
          remains admin-surface-topology-seed-conversion's own subBundle scope, now
          unblocked rather than completed by this entry.
        affected_subbundles: [admin-enum, team-dashboard, scheduler-settings]
        follow_up_ref: .agent/tasks/todo.md admin-runtime-operation-dispatch-lane-determination Bundle
    admin_runtime_payload_binding_contract:
      role: >-
        2026-07-24, formalizes "bindRuntimeDispatchPayload" (introduced in
        write_payload_capture_mechanism_implemented above) as a canonical, validated
        payload-binding extension of component_wiring_execution_lane's admin_runtime
        case -- not an undocumented ad-hoc string recognized by one function. This
        section is that binding's own vocabulary/authority/validation contract, per
        PR #599 review (2026-07-24): a "canonical lane" statement requires more than a
        recognized string constant. 2026-07-25 (PR #599 review round 5) removed the
        remaining dedicated actionType-equality special case
        (ADMIN_RUNTIME_PAYLOAD_BINDING_ACTION_TYPE / isAdminRuntimePayloadBindingAction)
        -- see policy_validator_reconciliation and taxonomy_classification below; the
        actionType string stays the authoring convention, not the classification key.
      actionType: bindRuntimeDispatchPayload
      authority: >-
        Frontend build-time authoring only (frontend/runtime/renderEmission.ts
        buildAdminRuntimePayloadFromByTrigger). Never a backend authority, never a
        second target/layer/action resolution path -- it only supplies DATA (the
        payload) for the target/layer/action the SAME node's wiringKind="admin_runtime"
        + targetRef already resolve (parseAdminRuntimeLayerAction). An entry with this
        actionType on a node that is NOT wiringKind="admin_runtime" is not itself an
        error (buildAdminRuntimePayloadFromByTrigger runs regardless of wiringKind), but
        produces a payloadFrom map with nothing to attach it to -- buildCatalogComponentEventBinding
        only consumes it when a non-null RuntimeDispatchSpec exists for that node.
      applicability: >-
        Any wiring_kind="admin_runtime" node, any layer:action (enum_dictionary:*,
        auth_users:*, team_markdown:*, scheduler_jobs:*, ...) -- reuses the SAME
        actionType, no per-operation/per-subBundle case.
      authored_surface: >-
        A per-node topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions[]
        entry (the SAME per-node authoring column dispatchExternalPort/
        dispatchInstanceOperation/localStateMutation already use) -- never
        topology.ui_wiring_registry.wiring_schema_json (that column remains a zero-consumer
        surface per this file's known_gaps note above; this contract does not adopt it).
      required_fields:
        trigger: >-
          Must classify via the SAME normalizeAuthoredEventType/trigger_vocabulary every
          other runtimeInteractions entry uses (click/change/select/submit/toggle after
          normalization). An unrecognized trigger fails the WHOLE node closed
          (ADMIN_RUNTIME_PAYLOAD_FROM_INVALID_TRIGGER) -- never silently skipped.
        payloadFrom: >-
          Non-empty object, every value a string source recognized by
          payloadFromResolver.ts's existing grammar (node:<nodeId>.value | event.<path> |
          literal:<value>) -- the SAME grammar/resolver dispatchExternalPort/
          dispatchInstanceOperation already use; this contract adds no new source syntax.
          Absent/non-object/empty payloadFrom (ADMIN_RUNTIME_PAYLOAD_FROM_MALFORMED /
          ADMIN_RUNTIME_PAYLOAD_FROM_EMPTY) and a non-string field value
          (ADMIN_RUNTIME_PAYLOAD_FROM_MALFORMED) fail the whole node closed.
      target_ref_shape: >-
        Unchanged from parseAdminRuntimeLayerAction's existing contract --
        "manifest:<manifestUuid>:<layer>:<action>". This binding contract adds no new
        target_ref grammar; targetRef stays exclusively the node's own
        wiringKind="admin_runtime" column, never re-derived from a
        bindRuntimeDispatchPayload entry.
      allowed_payload_sources: >-
        Exactly payloadFromResolver.ts's three source kinds (node_value / event_path /
        literal). No new source kind is introduced by this contract -- doing so would
        require its own SSOT amendment and resolver change, out of this contract's scope.
      validation_and_fail_close: >-
        renderEmission.ts buildAdminRuntimePayloadFromByTrigger returns a result type
        (never a bare map): any invalid trigger, malformed/empty payloadFrom, non-string
        field value, or a duplicate_field_conflict (two entries on the SAME node
        authoring the SAME field for the SAME trigger -- resolved via silent last-wins
        overwrite is explicitly prohibited; the entries disagree, and dispatch must not
        guess which wins) fails the WHOLE node's render closed as an explicit error
        ComponentSpec, mirroring the existing CATALOG_COMPONENT_KIND_REQUIRED-class
        fail-close pattern this file already uses elsewhere in renderEmission.ts. At
        dispatch time (runtimeComponentFactory.ts emitBoundEvent), a payloadFrom map
        (once validated at build time) is resolved via the SAME resolvePayloadFrom()
        single authority dispatchExternalPort/dispatchInstanceOperation use --
        PAYLOAD_FROM_NODE_NOT_FOUND / PAYLOAD_FROM_EVENT_PATH_NOT_FOUND /
        PAYLOAD_FROM_UNRESOLVED_REF fail close and never enqueue a dispatch; no unresolved
        value is ever silently degraded to empty string, null, or false.
      priority_conflict_rule: >-
        When a payloadFrom map is authored for a trigger, the RESOLVED payload is the
        sole payload authority for that dispatch (mirrors dispatchExternalPort/
        dispatchInstanceOperation's own contract exactly -- resolved.payload replaces,
        never merges with, any other payload source). When no payloadFrom is authored
        for a trigger, the pre-existing (PR #597) raw event-time payload passthrough
        (static config payload + Lane 1's merged event payload) is unchanged.
      own_property_identity: >-
        Both the live node value store (frontend/runtime/liveNodeValueTracker.ts,
        Object.create(null) backing) and payloadFromResolver.ts's node_value/event_path
        existence checks (Object.prototype.hasOwnProperty.call, never the `in` operator
        or bracket-index truthiness) treat a nodeId/event-path segment that collides with
        an inherited Object.prototype key (constructor, toString, hasOwnProperty, ...) as
        genuinely missing, never as an inherited function value.
      taxonomy_classification: >-
        2026-07-25 (PR #599 review round 5, supersedes the 2026-07-24 round-3
        out_of_scope_for_this_contract entry below, kept for history). The
        round-3/round-4 shape added a DEDICATED actionType-equality special case
        (ADMIN_RUNTIME_PAYLOAD_BINDING_ACTION_TYPE constant + isAdminRuntimePayloadBindingAction()
        + an explicit skip inside findRuntimeInteractionPolicyErrors) to keep this
        actionType from tripping ACTION_OUTSIDE_VOCABULARY -- reviewed as unnecessary
        new implementation-derived vocabulary, because ui_event_settings.
        setting_category_taxonomy.frontend_side.side_effect_setting.field_boundary
        ALREADY declares the correct classification structurally: "payloadFrom /
        outputProp / targetNode state assignment are effect fields, not the effect
        authority itself" -- i.e. 副作用設定 is a field-boundary category, not an
        actionType allowlist. wiringSettingCategoryOf (uiBuilderWiringProjection.ts)
        now classifies any actionType outside the other three branches as
        side_effect_setting when it carries payloadFrom/outputProp (reusing the
        existing hasSideEffectFields check, unchanged), and returns null only for an
        actionType with neither -- a degenerate/incomplete entry (e.g. the action
        picked but no payloadFrom field authored yet) now correctly fails
        ACTION_OUTSIDE_VOCABULARY instead of silently passing via the old
        actionType-only special case, matching this file's general fail-close-over-
        silent-pass posture. The dedicated constant/predicate and the special-case
        skip in findRuntimeInteractionPolicyErrors are removed; the actionType string
        "bindRuntimeDispatchPayload" remains only the authoring convention seed data
        uses, not a classification key any function branches on.
      out_of_scope_for_this_contract: >-
        [2026-07-24, PR #599 review round 3 framing -- superseded 2026-07-25 by
        taxonomy_classification above; kept verbatim for history, not current
        behavior.] Extending WIRING_SETTING_CATEGORIES (uiBuilderWiringProjection.ts)
        -- the array literal type of the six SSOT ui_event_settings.
        setting_category_taxonomy categories -- to include this actionType. That
        taxonomy classifies UI-Builder canvas-authoring inspector categories for a
        human editing runtimeInteractions in the canvas -- a different concern from
        this seed-authored runtime dispatch payload-binding contract.
        wiringSettingCategoryOf still classifies this actionType as null (honestly
        outside the six categories, never silently rounded into one).
      policy_validator_reconciliation: >-
        2026-07-24 (PR #599 review round 3), mechanism updated 2026-07-25 (round 5).
        Both this contract's payload-binding entries and UI-Builder's own
        authoring/apply/readiness policy validator (frontend/lib/uiBuilderWiringProjection.ts
        findRuntimeInteractionPolicyErrors) share the SAME storage/authoring surface --
        topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions[] --
        so a payloadFrom-bearing entry that a human later opens in the UI Builder
        canvas (for an unrelated edit on the same layout) must not silently trip that
        validator's ACTION_OUTSIDE_VOCABULARY (a blocking error on validate/apply/
        readiness paths, per that function's own contract). As of round 5 this is no
        longer a dedicated actionType-equality special case -- see
        taxonomy_classification above: wiringSettingCategoryOf classifies such an
        entry as side_effect_setting (not null), so it never reaches the
        ACTION_OUTSIDE_VOCABULARY branch in the first place, and (because
        isBackendOrExternalDispatchAction still matches only dispatchExternalPort/
        dispatchInstanceOperation by exact actionType) it does not inherit the
        backend/external-dispatch policy checks below it (debounce /
        lifecycle-confirmation) either. This entry's OWN validation (required
        trigger/payloadFrom shape, duplicate_field_conflict) is not duplicated into
        this validator -- it stays solely renderEmission.ts
        buildAdminRuntimePayloadFromByTrigger's authority, keeping a single validation
        owner per SSOT design_order.
      runtime_parse_boundary_fail_close: >-
        2026-07-24 (PR #599 review round 3). buildAdminRuntimePayloadFromByTrigger's
        build-time validation is a SEPARATE boundary from
        runtimeComponentFactory.ts parseEventBinding(), which re-parses the untyped JSON
        eventBinding[trigger] carried on RuntimeComponentSpec at DISPATCH time -- a
        boundary that could in principle be reached by any construction path, not only
        that builder. parseEventBinding's own payloadFrom handling previously used
        Object.entries(...).filter(...) to silently drop non-string field values and
        degraded a non-object/absent payloadFrom to undefined (falling back to raw
        event-time payload passthrough) -- build-time validation existing elsewhere is
        never a substitute for this boundary's own fail-close. Fixed to mirror
        externalPortDispatch's own pre-existing contract exactly: a present-but-malformed
        payloadFrom (non-object, empty object, or any non-string value) now fails the
        WHOLE binding closed (parseEventBinding returns null,
        RUNTIME_PRIMITIVE_RENDERER_INVALID_EVENT_BINDING at dispatch time) -- never a
        silently filtered subset.
      display_value_vs_dispatch_value_authority: >-
        2026-07-24 (PR #599 review round 4). The production-mount SSE-refresh scenario
        proof (round 3) surfaced a real divergence, since retracted-as-out-of-scope and
        corrected here: renderEmission() rebuilds every catalog_component leaf's default
        props from scratch on each render (buildDefaultCatalogComponentProps), so a
        surviving controlled <input>'s DISPLAYED value reset to its emission-derived
        default on an SSE-refresh-driven rerender while a LATER dispatch would still
        silently resolve and send the live node value tracker's pre-refresh typed value
        -- sending a value the user could no longer see on screen. Introducing dispatch
        reachability for tracked values (this Bundle's whole purpose) is what turned a
        previously-inert display quirk into a real "invisible stale value sent" risk, so
        it is this Bundle's own scope, not a separate concern. Resolved by promoting the
        SAME live node value tracker to the canonical DISPLAY authority too, via
        renderEmission.ts's new applyLiveNodeValueOverride: when the tracker holds an
        entry for a node's exact nodeId (own-property identity, matching the read-side
        contract above) AND that node's already-built default props carry a `data.value`
        key, the tracked value overrides the emission-derived default -- untouched nodes
        (no tracker entry) and value-less component kinds (e.g. action/button,
        form_input/form_field -- no `data.value` key to begin with) are both entirely
        unaffected, so this is surface/operation/component-kind-independent, not an
        admin-enum-specific or per-node patch. Applied BEFORE propBindings resolution, so
        a node whose value is ALSO server-data-bound via propBindings still lets that
        fresher, live server data win over a stale local edit once the projection
        actually carries one -- the tracker is display authority only in the absence of a
        stronger, live data-bound source, never a fallback that shadows one. A node with
        no tracked entry and no propBinding falls through to the pre-existing
        emission-derived default unchanged (no regression for the common case). Removed
        nodes (SSE-refresh reconciliation) are not rendered at all, so there is no display
        to diverge from -- resolvePayloadFrom's existing PAYLOAD_FROM_NODE_NOT_FOUND
        fail-close (not a display-side concern) covers a later dispatch attempt against
        them.
      proof: >-
        frontend/tests/liveNodeValueTrackerAndAdminRuntimePayloadFrom.test.ts (fail-close
        cases: invalid trigger, malformed/empty payloadFrom, non-string field,
        duplicate_field_conflict, own-property identity for both the node value store and
        event-path traversal; the parseEventBinding dispatch-time parse-boundary
        fail-close cases independent of build-time validation; and
        applyLiveNodeValueOverride's display-authority cases -- overrides only when a
        tracked entry exists for the exact nodeId, never invents a `data.value` field for
        a component kind that has none, and own-property-identity-safe against an
        Object.prototype-shaped nodeId),
        frontend/tests/uiBuilderWiringProjection.test.ts (policy_validator_reconciliation:
        bindRuntimeDispatchPayload does not trip ACTION_OUTSIDE_VOCABULARY or inherit
        backend/external-dispatch policy checks, while a genuinely unrecognized actionType
        still fails close), and frontend/tests/
        projectionShellAdminRuntimeWritePayloadCapture.test.ts (production
        frontend/islands/ProjectionShell.tsx mount, real DOM input/click events and a real
        SSE "projection" event fired through the actual sseReceiver/projectionRuntime
        path with a minimal live ProjectionDefinition -- not a test-injected payload
        map/callback or a stubbed refresh -- proving: multi-node value separation, a
        removed node's tracked value failing close on a later dispatch instead of leaking,
        a surviving node's tracked DISPLAY value -- asserted directly against the
        re-rendered DOM <input>.value, not only against the dispatch payload --
        persisting across refresh and matching the value the following dispatch actually
        sends, and a fresh unmount/remount starting with no inherited values).
    manifest_topology_boundary:
      rule: >-
        manifest.topology entries for this surface (ui_projection type per
        db/manifest_tables.sql) carry packageIds / layoutId / wiringId / tensorId references
        only. A manifest.topology array element that embeds field/action/form-level UI
        structure directly (e.g. a flattened topology_ui_seed_record tree) is a top SSOT
        violation for this surface, regardless of which lane authored it.
      packageIds_authority_rule: >-
        packageIds specifically must resolve to topology.components_package_design rows
        (docs/design/db-schema.yaml packages/components_package_design.manifest_reference),
        never topology.ui_component_package rows -- the latter is a distinct
        component_group_bundle identity required only by
        topology.ui_topology_tensor.package_id's FK, not a manifest-facing authority. Refs
        pointing at the wrong table are still a top SSOT violation even though the entry
        itself stays refs-only in shape.
      prohibited:
        - manifest_topology_array_element_embedding_layout_or_wiring_payload_directly
        - treating_any_lane_above_as_manifest_topology_storage_authority
        - packageIds_referencing_topology_ui_component_package_instead_of_topology_components_package_design

  wiring_mode:
    role: UI event graph projection / edit mode over runtimeInteractions
    visual_model: source UI node -> event trigger -> setting category -> target/effect
    primary_inspector: UI event settings (操作イベント)
    mode_boundary:
      - wiring canvas is a switchable projection/edit mode over the same draft nodes
        as layout mode; it is not a separate route, tab hierarchy, or separate draft store
      - new wiring components are allowed only as view/edit projection,
        never as persistence authority
    persistence_authority:
      authority: draftNodes[].runtimeInteractions -> topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions
      rule: >-
        The wiring graph is derived (rehydrated) from runtimeInteractions on every
        render. Edits made in wiring mode are expressed as typed runtimeInteraction
        patches on draft nodes and persist only through the existing layout_patch
        save_tmp / preview / validate / apply lanes.
      prohibited:
        - wiring_graph_or_rendered_projection_as_persistence_source
        - raw_route_or_page_reference_as_event_wiring_authority
        - separate_wiring_draft_store_diverging_from_draft_nodes
    markmap_policy_if_used:
      - projection/view only
      - not semantic authority
      - not persistence source
      - rehydrate from runtimeInteractions

  trigger_vocabulary:
    rule: >-
      Authoring-selectable triggers are limited to this vocabulary. Triggers outside
      the vocabulary are blocking authoring errors (fail-close), not silent passthrough.
      Stored trigger values remain raw identifiers; visible labels use user-facing
      projection vocabulary (adminUxTerms), never raw-first. Report / SSOT / test /
      implementation must keep the same trigger group mapping.
    groups:
      lifecycle: [initial_mount, route_enter, initial_display]
      pointer: [click, mouseon, mouseout, hover_start, hover_end]
      keyboard: [keyon, keydown, keyup, enter, escape]
      form: [input, change, select, submit, focus, blur]
    lifecycle_semantics: >-
      initial_mount is a runtime synthetic lifecycle trigger emitted by the runtime
      component wrapper when a node's projection mounts. It is NOT DOM onLoad, NOT
      resource "loaded", and NOT a click/change alias.
    prohibited_vocabulary:
      - load
      - loaded
      - DOM_onLoad
    high_frequency_triggers: [mouseon, mouseout, hover_start, hover_end, keyon, keydown, keyup, input]
    runtime_execution_scope:
      in_bundle:
        - runtime state/effect runner boundary (frontend/runtime/uiEventEffectRunner.ts) —
          lifecycle emission, state dispatcher routing, loop guard, idempotency guard
        - initial_mount / route_enter / initial_display runtime synthetic emission
          (once per mount; preview inert; no re-dispatch on rerender)
        - UI状態更新 execution through the runtime state dispatcher (local state store)
        - 外部API連携 runtime dispatch lane (enqueueExternalPortDispatchCommand via api_command_lane)
        - 外部インスタンス連携 runtime dispatch lane (enqueueInstanceOperationDispatchCommand via api_command_lane)
      out_of_bundle:
        - backend resolution of external-port / instance-port dispatch targets
          (external_port_runtime / instance_port_runtime lanes own execution;
          unresolved targets fail explicitly on the dispatch lane)
        - DOM-level binding of pointer(non-click) / keyboard trigger vocabulary to
          additional primitive components (added per component as event/value
          surfaces, not as per-component effect semantics)

  ui_event_settings:
    surface: 操作イベント (per selected node; trigger UI and target/effect axes are independent)
    independent_axes_ref: docs/design/admin-console-workflow-ssot.yaml admin_authoring_completion_gate.ui_events_trigger_and_target_configurable
    event_trigger:
      - source UI node emits a trigger from trigger_vocabulary
      - trigger UI specification and target/effect specification are independent concepts
    setting_category_taxonomy:
      note: >-
        These six categories are the wiring inspector classification. Implementation
        categories (e.g. overlay/external_port/instance_operation/legacy) are internal
        identifiers at most and must not round the taxonomy: collapsing UI監視割当 /
        UI状態更新 / 副作用設定 into a "legacy" or generic 状態設定 bucket is prohibited.
      frontend_side:
        ui_watch_binding:
          label_ja: UI監視割当
          meaning: >-
            Declares a state slot / monitored variable / watched dependency source.
            useState-like binding declaration, not a mutation.
          fields_examples: [stateKey, initialValue, valueType, scope, watchedBy, readableFrom]
          proof_boundary: >-
            The mere presence of propsJson/stateJson is not sufficient UI監視割当 proof.
            The declaration model must be a distinct authoring category whose entries
            are declarations, separate from mutations.
        ui_state_update:
          label_ja: UI状態更新
          meaning: >-
            Writes to an already-declared state slot / monitored variable.
            setState-like mutation (set / toggle / clear / open / close / statePath write).
          action_types: [openModal, closeModal, toggleModal, openDrawer, closeDrawer, toggleDrawer, openDialog, closeDialog, toggleDialog, setActiveKey, setState]
        side_effect_setting:
          label_ja: 副作用設定
          meaning: >-
            useEffect-like reaction settings. Trigger source may be a UI event /
            watched state slot / monitored variable / outputProp / targetNode state.
            Write target may be a local state slot / monitored variable / outputProp /
            targetNode state / API result binding.
          field_boundary: >-
            payloadFrom / outputProp / targetNode state assignment are effect fields,
            not the effect authority itself. Explicit no-side-effect must be selectable
            (persisted as sideEffectNone: true).
      backend_side:
        internal_api:
          label_ja: 内部API
          candidates:
            - contents Step 3 API candidates
            - screenReadQueryWiring candidates
            - internal topology/API dispatch candidates
          lane: package wiring lane (ui_topology:update_package_wiring / ManifestStep3EventWiringPreset)
          rule: >-
            内部API is part of the wiring inspector classification. It must not be
            hidden outside the inspector taxonomy while claiming backend-side completion.
        external_api_integration:
          label_ja: 外部API連携
          candidates: external api candidates from seed-backed external port registry
          typed_reference: dispatchExternalPort + portTargetRef "external-port:<portKind>:<portId>[:<routeKey>]"
        external_instance_integration:
          label_ja: 外部インスタンス連携
          candidates: external instance candidates from seed-backed instance operation registry
          typed_reference: dispatchInstanceOperation + instanceTargetRef "instance-port:<portKind>:<instancePortId>:<operationBindingKey>"
      terminology_drift_prohibited:
        - mixing 外部API連携 with 外部連携 / external port / external api as visible taxonomy labels
        - mixing 外部インスタンス連携 with インスタンス操作 / instance operation as visible taxonomy labels
    authority:
      - credential / authority requirement candidate is displayed from the selected
        capability record within port record context (credential_kind / reference_key identifier)
      - credential material is never editable in UI Builder
    topology_movement:
      - hub relation prev
      - hub relation next
      - explicit jump by user-facing topology label/name
      - raw topology ids stay internal

  component_runtime_state_effect_boundary:
    rule: >-
      State/effect authoring must not require ad-hoc useEffect code inside every
      component. The runtime boundary owns effect execution.
    required_runtime_boundary:
      - runtime component wrapper / factory owns the useEffect-like effect runner
      - primitive components expose event/value surfaces and remain mostly pure renderers
      - state slots live in the projection-local state store or an equivalent declared runtime state store
      - UI監視割当 declares state slot / dependency source before mutation or effect selection
      - UI状態更新 writes only through the runtime state dispatcher
      - 副作用設定 resolves the dependency graph before execution and runs through the effect runner
    mutation_authority_unification:
      rule: >-
        There is exactly one guarded write path for UI状態更新: the runtime state
        dispatcher (RuntimeGuardedStateStore). The lifecycle-triggered path
        (uiEventEffectRunner.emitLifecycle) and the event-triggered path
        (runtimeComponentFactory.emitBoundEvent localStateMutation lane) both call
        applyGuardedLocalStateMutation against the SAME dispatcher instance — the
        event path does not write directly to a raw store. There is no
        write-time auto-declare fallback: a slot must be predeclared (via
        UI監視割当 stateJson or a predeclared UI状態更新 target scanned from the
        current node list) before either path may write it; a target absent
        from the current node list (e.g. a stale/deleted-node reference) fails
        close identically on both paths. Predeclaring a UI状態更新 target is
        conditioned on that target's nodeId actually appearing in the node list
        passed to predeclare — an authored interaction whose targetNodeId does
        not resolve to any node in that list is never predeclared, so it fails
        close on write exactly like an entirely undeclared slot, whether the
        dispatcher was built via createProjectionStateDispatcher(nodes) in the
        production mount path or constructed directly in a test.
      fail_close:
        - event_triggered_local_state_mutation_writing_directly_to_a_raw_store
        - event_and_lifecycle_paths_using_separate_dispatcher_instances_for_the_same_projection
        - write_time_auto_declare_fallback_for_undeclared_slots
        - predeclaring_a_ui_state_update_target_absent_from_the_current_node_list
    state_update_projection_rerender_contract:
      rule: >-
        A runtime state store update alone (Map write) is NOT UI状態更新 completion.
        The store carries change notification (subscribe), and the projection mount
        surface re-renders specs from the same store on notification, so UI状態更新
        reflects into rendered runtimeSpec props. Notification fires only on actual
        value change; renderEmission is a pure read of the store, so no
        notification loop forms. The rerender hook must not re-emit lifecycle
        triggers (fired-registry keeps initial_mount dispatch single-shot even if
        emission is re-entered), and preview / loop-guard paths produce no store
        write and therefore no notification.
      fail_close:
        - treating_store_map_update_alone_as_ui_state_update_completion
        - rerender_hook_re_dispatching_initial_mount
        - sse_refresh_recreating_store_runner_or_fired_registry
    lifecycle_runner_node_reconciliation:
      rule: >-
        The runtime effect runner reconciles its known node list on SSE refresh
        instead of staying pinned to the node list it was created with.
        Reconciliation (updateNodes) recomputes predeclared UI状態更新 targets,
        the side-effect loop guard, and the policy guard against the refreshed
        node list, then the mount surface re-emits the synthetic lifecycle
        triggers (initial_mount / route_enter / initial_display). The
        fired-registry is keyed by nodeId + interaction-index (not list
        position or emission-object identity), so an existing node's
        already-fired lifecycle interaction does not re-execute on
        reconciliation, while a newly-appeared node's lifecycle interaction
        executes exactly once on the reconciliation that introduces it.
      fail_close:
        - sse_refresh_ignoring_newly_mounted_lifecycle_interactions
        - reconciliation_re_executing_an_already_fired_lifecycle_interaction
      prohibited:
        - pinning_the_runner_to_its_creation_time_node_list
        - refetching_lifecycle_dispatch_by_recreating_the_runner_store_or_fired_registry
    runtime_boundary_implementation:
      effect_runner: frontend/runtime/uiEventEffectRunner.ts (createUiEventEffectRunner; owns lifecycle emission, loop guard, idempotency registry; updateNodes reconciles the runner to a refreshed node list without recreating the runner/store/fired-registry)
      state_dispatcher: frontend/runtime/uiEventEffectRunner.ts createRuntimeStateDispatcher (declare-then-mutate; undeclared-slot writes fail close; no auto-declare fallback)
      guarded_mutation_shared_entry_point: frontend/runtime/uiEventEffectRunner.ts applyGuardedLocalStateMutation + resolveUiStateUpdateMutation (used by BOTH executeStateUpdate (lifecycle) and runtimeComponentFactory.emitBoundEvent (event-triggered))
      predeclare: frontend/runtime/uiEventEffectRunner.ts predeclareProjectionState / createProjectionStateDispatcher (declares UI監視割当 stateJson slots and every UI状態更新 target whose targetNodeId is present in the current node list, before any interaction can execute; a target absent from that list is never predeclared)
      state_store_notification: frontend/runtime/uiEventEffectRunner.ts createRuntimeLocalStateStore (NotifyingRuntimeLocalStateStore.subscribe -> projection specs re-render)
      event_lanes: frontend/runtime/runtimeComponentFactory.ts emitBoundEvent (event log / internal dispatch / 外部API連携 / 外部インスタンス連携 / route navigation / local state lanes via the shared guarded dispatcher; previewMode inert; high_frequency_policy runtime guard fails close before the external/instance dispatch lane)
      binding_builder: frontend/runtime/renderEmission.ts buildLocalUiStateEventBinding (reuses wiringSettingCategoryOf + resolveUiStateUpdateMutation — the same classification/resolution the lifecycle path uses, so the event binding and the lifecycle mutation agree on shape) / buildExternalPortEventBinding (carries debounceMs on the externalPortDispatch / instanceOperationDispatch binding so the runtime guard can evaluate it at dispatch time)
      mount_integration: frontend/islands/ProjectionShell.tsx (single dispatcher created before the first render; passed into both renderEmission and the runner; runner created once per mount; initial_mount emitted after first projection render; SSE refresh calls runner.updateNodes then re-emits lifecycle triggers so newly-appeared nodes execute while existing fired interactions stay idempotent)
      dispatch_lanes: frontend/runtime/frontendScheduler.ts enqueueExternalPortDispatchCommand / enqueueInstanceOperationDispatchCommand (api_command_lane; typed-ref prefix fail close)
    component_edit_boundary:
      - edit an individual component only when a required event/value surface is missing
      - unsupported component kind must fail-close in proof tests
      - component-specific state/effect implementation is the exception, not the default path
    required_receive_surfaces:
      - current state values
      - mutation dispatcher
      - effect binding metadata
      - dispatch lanes for internal API / external API / external instance
    prohibited:
      - embedding_ad_hoc_useEffect_in_every_component_factory
      - executing_effects_from_rendered_graph_persistence_authority
      - writing_component_state_directly_outside_declared_runtime_state_dispatcher
      - treating_propsJson_stateJson_as_sufficient_ui_watch_binding_proof
      - treating_event_to_localStateMutation_as_sufficient_side_effect_setting_proof

  lifecycle_policy:
    rules:
      - initial_mount / route_enter / initial_display are runtime synthetic lifecycle triggers
      - initial_mount is not DOM onLoad / resource loaded and not a click/change alias
      - preview is inert by default for lifecycle triggers
      - backend/external dispatch bound to a lifecycle trigger requires explicit author
        confirmation persisted as lifecycleDispatchConfirmed=true on the interaction
      - backend/external dispatch bound to a lifecycle trigger requires an explicit
        idempotency policy persisted as idempotencyPolicy on the interaction
      - initial_mount dispatch must not re-dispatch on rerender (idempotencyPolicy once_per_mount)
      - route_enter / refetch dispatch needs an idempotency policy (refetch_on_route_enter or dedupe_key)
    idempotency_policy_values: [once_per_mount, refetch_on_route_enter, dedupe_key]
    fail_close:
      - lifecycle_trigger_with_backend_or_external_dispatch_without_explicit_confirmation
      - lifecycle_trigger_with_backend_or_external_dispatch_without_idempotency_policy
    prohibited:
      - implementing_lifecycle_trigger_runtime_execution_before_this_policy
      - treating_initial_mount_as_dom_onload_or_click_alias
      - policy_warning_display_alone_passing_validate_or_apply
    retry_safe_dispatch_idempotency:
      rule: >-
        idempotencyPolicy is a retry-safe DISPATCH policy, not merely a frontend
        runner duplicate-fire guard. The runner's fired-registry (nodeId +
        interaction-index) only prevents duplicate lifecycle emission WITHIN a
        single runner's lifetime; it provides no guarantee across communication
        loss, retry, reload, reconnect, or runtime-runner recreation — those all
        construct a brand-new runner with a brand-new (empty) fired-registry.
        Retry-safety across that boundary requires a stable idempotency_key
        carried on the dispatch payload plus a backend ledger
        (topology.runtime_dispatch_idempotency_ledger) that gates execution
        BEFORE the external API call / instance operation runs — not merely an
        append-only evidence log recorded after execution.
      idempotency_policy_semantics:
        once_per_mount: >-
          Runner-lifetime duplicate lifecycle emission guard (existing
          fired-registry behavior) PLUS a deterministic idempotency_key so a
          retry of the SAME initial_mount firing (communication loss, reload,
          reconnect, runtime-runner recreation) is recognized by the backend
          ledger as a retry of the same logical dispatch, not a new one.
        refetch_on_route_enter: >-
          Refires on each route_enter emission (existing behavior); each
          route_enter firing gets its own idempotency_key (recomputed per
          firing from the same stable identity) so a retry of one SPECIFIC
          route_enter firing is deduplicated without blocking the next
          legitimate route_enter firing.
        dedupe_key: >-
          The retry-safe dispatch key is the actual enforcement mechanism, not
          merely an enum value that passes authoring validation. An
          author-provided dedupe seed, when authored, is folded into
          idempotency_key generation so it participates in the same backend
          ledger claim/complete/fail contract as the other two policies.
      idempotency_key_generation:
        formula: >-
          layoutId + packageId + nodeId + stable interaction identity (nodeId +
          interactionIndex — the SAME identity the fired-registry uses) +
          trigger + actionType + targetRef (portTargetRef / instanceTargetRef)
          + resolved dispatch payload (canonicalized, order-independent) +
          author-provided dedupe seed when idempotencyPolicy is dedupe_key.
        determinism: >-
          The key is DETERMINISTIC from this identity — not a fresh random
          value per dispatch call. A random key would defeat retry-safety,
          since a retry must present the SAME key as the original attempt for
          the backend ledger to recognize it.
        implementation: frontend/lib/uiBuilderWiringProjection.ts computeDispatchIdempotencyKey (identity-only base, computed at binding-build time for the event-triggered path and inline for the lifecycle path) / appendResolvedPayloadToIdempotencyKey (extends the base with the event-time resolved payload)
      backend_ledger:
        table: topology.runtime_dispatch_idempotency_ledger (db/topology_tables.sql)
        functions:
          - topology.rt_claim_dispatch_idempotency_key (returns claimed / in_flight / already_completed)
          - topology.rt_complete_dispatch_idempotency_key
          - topology.rt_fail_dispatch_idempotency_key (failed keys are retry-safe to reclaim — the underlying effect did not complete, so failure does not permanently poison the key)
        boundary: >-
          Read BEFORE execution (claim) and written AFTER (complete/fail).
          Distinct from topology.runtime_event_log, which is append-only
          effect-OBSERVED evidence, written only after execution, and never
          read to decide whether to execute.
        gating: >-
          The ledger activates only when idempotency_key is present on the
          request payload. Absence is not fail-close at the generic runtime
          dispatch boundary — backward-compatible for pre-existing
          dispatchExternalPort / dispatchInstanceOperation callers outside
          this surface's runtime_interactions_lane (see lane_storage_boundary
          above — this is a runtime_interactions_lane statement, not a
          package_internal_api_wiring_lane one; that lane's idempotency
          applicability is a separate known_gap, not implied here).
          runtime_interactions_lane specifically always supplies one for its
          dispatchExternalPort / dispatchInstanceOperation entries: both the
          lifecycle path (uiEventEffectRunner.ts emitLifecycle) and the
          event-triggered path (renderEmission.ts binding builder +
          runtimeComponentFactory.ts emitBoundEvent) compute and forward
          idempotency_key unconditionally.
        implementation:
          - backend/runtime/RuntimeDispatchIdempotencyLedger.cs (IRuntimeDispatchIdempotencyLedger contract)
          - backend/repository/NpgsqlRuntimeDispatchIdempotencyLedgerRepository.cs
          - backend/runtime/ExternalPortDispatchRuntime.cs ExecuteAsync (claim before ExecutePolicyAsync; complete/fail after)
          - backend/runtime/InstancePortRuntime.cs ExecuteAsync (claim before AbstractFunctionExecutor.ExecuteAsync; complete/fail after)
      fail_close:
        - dispatch_idempotency_key_present_but_ledger_claim_skipped_before_effect_execution
        - already_completed_claim_re_executing_the_effect_instead_of_returning_the_stored_result
        - in_flight_claim_executing_the_effect_concurrently
      prohibited:
        - treating_the_frontend_fired_registry_alone_as_retry_safe_dispatch_idempotency
        - treating_dedupe_key_as_an_enum_value_without_backing_a_real_dedup_key
        - generating_a_fresh_random_idempotency_key_per_dispatch_call
        - conflating_runtime_event_log_append_only_evidence_with_the_idempotency_ledger
      known_gap:
        - author_provided_dedupe_seed_authoring_field_is_not_yet_added_to_NodeEventAuthoringPanel_this_round_deterministic_identity_plus_payload_key_still_provides_full_retry_safety_without_it

    projection_authority_runtime_interaction_identity:
      status: implemented
      origin: >-
        .agent/tasks/todo.md Bundle ui-projection-surface-architecture-reinforcement,
        "runtimeInteraction identity / projection-time idempotency identity" future
        direction. This subsection was authored as a design_change SSOT contract
        first (PR577), then implemented as this same Bundle's remaining scope
        (PR577 follow-up). retry_safe_dispatch_idempotency above (PR574) remains
        the execution-gate authority and is unchanged by this addition — this
        section only replaces the STRUCTURAL-IDENTITY component the ledger key is
        built from; the ledger contract itself is untouched.
      implementation_surfaces:
        assignment: backend/repository/NpgsqlUiTopologyRepository.cs AssignRuntimeInteractionIds (called from ApplyConfirmedLayoutPatchAsync only, after validation and before persistence)
        key_formula: frontend/lib/uiBuilderWiringProjection.ts computeDispatchIdempotencyKey (runtimeInteractionId param; backward-compatible nodeId+interactionIndex fallback when absent)
        event_triggered_binding: frontend/runtime/renderEmission.ts buildExternalPortEventBinding (forwards wiring.runtimeInteractionId)
        lifecycle_binding: frontend/runtime/uiEventEffectRunner.ts emitLifecycle (forwards w.runtimeInteractionId)
        duplication_boundary: frontend/runtime/visualLayoutUtils.ts cloneVisualNode (strips runtimeInteractionId from copied runtimeInteractions)
        type_surfaces:
          - frontend/api/dispatch.ts LayoutNode.runtimeInteractions[].runtimeInteractionId
          - frontend/lib/uiBuilderWiringProjection.ts WiringInteraction.runtimeInteractionId
          - frontend/runtime/visualLayoutUtils.ts VisualNodePayload.runtimeInteractions[].runtimeInteractionId
        tests:
          - backend/tests/Topolactor.Runtime.Tests/NpgsqlUiTopologyRepositoryRuntimeInteractionIdentityTests.cs
          - frontend/tests/uiBuilderWiringProjection.test.ts (computeDispatchIdempotencyKey runtimeInteractionId cases)
          - frontend/tests/uiEventEffectRunner.test.ts (lifecycle path forwarding + reorder/rename survival)
          - frontend/tests/externalPortDispatchRuntime.test.ts (event-triggered binding forwarding)
          - frontend/tests/visualLayoutBuilder.test.ts (cloneVisualNode duplication_rule + JSON round-trip)
      problem: >-
        idempotency_key_generation (retry_safe_dispatch_idempotency above) derives
        stable interaction identity structurally — nodeId + interactionIndex, i.e.
        the interaction's POSITION within topology.ui_topology_tensor.layout_patch_json
        nodes[].runtimeInteractions[] (frontend/runtime/visualLayoutUtils.ts
        VisualNodePayload.runtimeInteractions has no persistent per-entry id).
        Reordering runtimeInteractions on a node, or moving/duplicating a node,
        changes that structural identity even when the authored interaction's
        semantic intent is unchanged, and gives a duplicated interaction the SAME
        identity as its source until the resolved payload happens to differ. This
        is compatibility/current-state per the parent bundle, not final projection
        authority.
      target_contract:
        field: runtimeInteractionId
        field_shape: UUID string, one per authored runtimeInteractions[] entry
        field_shape_enforcement: >-
          A present-but-blank, present-but-non-string, or present-but-non-UUID-format
          value at the persistence boundary is NOT a valid existing id — it is
          treated identically to absent (NpgsqlUiTopologyRepository.HasValidRuntimeInteractionId
          / Guid.TryParse) and REPLACED with a freshly assigned valid UUID, never
          preserved as-is and never forwarded to frontend dispatch identity. The
          replacement rewrite never emits a duplicate runtimeInteractionId JSON key
          alongside the stale invalid one — the invalid property is omitted, not
          copied through, before the single fresh id is written.
        storage: >-
          Inline on the JSONB entry — topology.ui_topology_tensor.layout_patch_json
          nodes[].runtimeInteractions[].runtimeInteractionId. No new relational
          table is required for the initial contract; a normalized child table
          is an allowed future alternative but out of scope here.
        assignment_authority: >-
          Backend layout_patch persistence boundary (the same server-side
          validate/persist path invoked by layout_patch:apply) assigns
          runtimeInteractionId to any runtimeInteractions[] entry that lacks one,
          at persist time. The frontend never generates or mutates this id — it
          only reads the assigned value back through the existing
          layout_patch_json -> emission.layoutNodes[].runtimeInteractions[] path
          and forwards it verbatim. This keeps assignment at the
          projection-authority (DB/backend-persisted) layer, not the UI layer.
        duplication_rule: >-
          A copy/duplicate operation (node copy, interaction copy) that produces
          a NEW authored runtimeInteractions[] entry must not carry over the
          source entry's runtimeInteractionId — the backend assigns a fresh one
          on next persist, same as any other id-less entry. Identity maps 1:1 to
          a distinct authored interaction, never to a cloned definition.
        idempotency_base_key_formula_update: >-
          computeDispatchIdempotencyKey's identity portion becomes
          runtimeInteractionId (when present) INSTEAD OF nodeId + interactionIndex.
          layoutId, packageId, trigger, actionType, targetRef, authorDedupeKey, and
          the resolved-payload extension via appendResolvedPayloadToIdempotencyKey
          are unchanged — only the structural-position identity component is
          replaced by the assigned stable id. When runtimeInteractionId is absent
          (pre-migration entry), the existing nodeId + interactionIndex fallback
          applies unchanged — this is an additive, backward-compatible formula
          change, not a ledger contract change.
        backend_ledger_unchanged: >-
          topology.runtime_dispatch_idempotency_ledger and its
          rt_claim_dispatch_idempotency_key / rt_complete_dispatch_idempotency_key /
          rt_fail_dispatch_idempotency_key functions (retry_safe_dispatch_idempotency
          above) are unaffected — they gate on whatever idempotency_key string they
          receive and do not need to know how that string's identity portion was
          derived.
        migration: >-
          Lazy backfill only: existing layout_patch_json entries without
          runtimeInteractionId keep working via the structural fallback; the
          backend assigns an id the next time that entry is persisted (e.g. next
          layout_patch:apply), not via a big-bang migration pass.
      prohibited:
        - client_side_generation_of_runtimeInteractionId
        - carrying_over_source_runtimeInteractionId_on_node_or_interaction_duplication
        - replacing_the_backend_idempotency_ledger_contract_to_implement_this
        - treating_this_subsection_as_authorization_to_implement_without_a_dedicated_implementation_change_bundle
        - reclassifying_retry_safe_dispatch_idempotency_pr574_evidence_as_missing_because_of_this_future_direction

  high_frequency_policy:
    rules:
      - mouseon / hover / key-repeat class triggers must not dispatch backend/external
        calls by default
      - local UI state / monitored variable update is allowed by default
      - backend/API dispatch or topology movement on a high-frequency trigger requires
        an explicit debounceMs value (positive integer) persisted on the interaction
        plus an explicit authoring warning
      - debounce/throttle is NOT side-effect loop-safety proof; loop checks run independently
      - this requirement is enforced at runtime dispatch time, not only at
        authoring/apply time — runtimeComponentFactory.emitBoundEvent fails close
        before calling enqueueExternalPortDispatchCommand /
        enqueueInstanceOperationDispatchCommand when the bound trigger is
        high-frequency and the binding's debounceMs is missing/invalid —
        authoring/apply policy guard alone does not stop an out-of-band
        persisted interaction from reaching the dispatch lane at runtime
    fail_close:
      - high_frequency_trigger_with_backend_or_external_dispatch_without_debounce_ms
      - runtime_dispatch_of_high_frequency_trigger_without_debounce_ms_at_event_time
    prohibited:
      - implementing_high_frequency_trigger_runtime_execution_before_this_policy
      - silent_default_debounce_injection
      - treating_debounce_or_throttle_as_loop_safety_proof
      - authoring_or_apply_policy_guard_alone_without_a_runtime_dispatch_guard

  side_effect_cycle_policy:
    rule: >-
      Effect write target candidates must be filtered by a dependency not-in rule
      before selection: selectable_write_targets = all_write_targets -
      dependency_closure(trigger_source).
    fail_close:
      - direct_self_loop_is_prohibited (watched A -> writes A)
      - detectable_indirect_loop_fails_close (A -> B and B -> A without explicit cycle break)
    ng_examples:
      - watched A -> set A
      - watched A -> outputProp A
      - watched A -> API result writes A
      - A -> B and B -> A without explicit cycle break
    boundary:
      - debounce/throttle does not satisfy or replace this policy
      - loop detection runs on the authoring dependency graph derivable from
        runtimeInteractions (value-reactive triggers x write targets)

  external_event_candidates:
    sources:
      - registered external api ports from seed/CRUD-backed registry
        (topology.external_access_ports / external_response_ports / external_hook_ports,
        active rows; op: ui_topology:list_external_port_authoring_candidates)
      - registered external instance operations from admin-approved bindings
        (op: ui_topology:list_instance_operation_authoring_candidates)
      - registered credential authority carried by the port record
        (credential_kind / reference_key identifier; plaintext prohibited)
    typed_reference_contract:
      dispatchExternalPort: portTargetRef "external-port:<portKind>:<portId>[:<routeKey>]"
      dispatchInstanceOperation: instanceTargetRef "instance-port:<portKind>:<instancePortId>:<operationBindingKey>"
    prohibited:
      - hardcoded_external_api_or_instance_choices_in_ui_builder
      - provider_or_bundle_fixed_candidate_lists_in_frontend
      - raw_route_or_page_reference_written_as_event_wiring
      - plaintext_credential_material_in_candidates_or_projection

  drag_drop_wiring_edit:
    rules:
      - valid drop produces a typed runtimeInteraction patch on the source draft node
      - invalid drop (unknown node, self-drop, non-wirable target) produces an explicit
        error and NO draft mutation
      - wiring edits are draft-scoped and undoable (draft history) before explicit apply
    fail_close:
      - invalid_drop_must_not_mutate_draft
    prohibited:
      - silent_drop_rejection_without_visible_error
      - drop_edit_writing_active_topology_directly

  authoring_metadata_fields:
    note: >-
      Authoring-only policy fields on RuntimeInteraction entries. Backend layout_patch
      validation reads only known fields; these pass through untouched and carry policy
      evidence for the future runtime execution bundle.
    fields:
      debounceMs:
        type: positive integer (milliseconds)
        required_when: high-frequency trigger bound to backend/external dispatch
      lifecycleDispatchConfirmed:
        type: boolean
        required_when: lifecycle trigger bound to backend/external dispatch (must be true)
      idempotencyPolicy:
        type: enum (once_per_mount | refetch_on_route_enter | dedupe_key)
        required_when: lifecycle trigger bound to backend/external dispatch
      sideEffectNone:
        type: boolean
        meaning: explicit no-side-effect selection for a dispatch interaction

  implementation_surfaces:
    projection_policy_lib: frontend/lib/uiBuilderWiringProjection.ts
    wiring_panel: frontend/components/WiringGraphPanel.tsx
    event_settings_panel: frontend/components/NodeEventAuthoringPanel.tsx
    internal_api_lane_surfaces:
      - frontend/components/ManifestStep3EventWiringPreset.tsx
      - PackageConnectionPanel (frontend/islands/UiBuilderAdmin.tsx)
    island: frontend/islands/UiBuilderAdmin.tsx
    label_vocabulary: frontend/content/adminUxTerms.ts
    pre_save_validation: frontend/runtime/visualLayoutUtils.ts findRuntimeInteractionPatchErrors (+ policy/cycle errors from projection_policy_lib)
    runtime_effect_runner: frontend/runtime/uiEventEffectRunner.ts
    runtime_event_lanes: frontend/runtime/runtimeComponentFactory.ts emitBoundEvent + frontend/runtime/renderEmission.ts dispatch bindings
    runtime_dispatch_lanes: frontend/runtime/frontendScheduler.ts (enqueueExternalPortDispatchCommand / enqueueInstanceOperationDispatchCommand)
    runtime_mount_surface: frontend/islands/ProjectionShell.tsx

  proof_surface:
    executable_structure_check: .agent/tests/check-admin-uibuilder-wiring.sh
    test_files:
      - frontend/tests/uiBuilderWiringProjection.test.ts
      - frontend/tests/uiEventEffectRunner.test.ts
      - frontend/tests/runtimeInteractionAuthoring.test.ts
      - frontend/tests/runtimeUiInteractionScenario.test.ts
      - frontend/tests/visualLayoutBuilder.test.ts
      - frontend/tests/uiBuilderPackageWiring.test.ts
      - frontend/tests/adminWiringExecutionLane.test.ts
    required_proof:
      - runtimeInteractions -> wiring projection round-trip (projection derives from and
        rehydrates to the same runtimeInteractions authority)
      - valid drag-drop wiring edit produces typed runtimeInteraction patch
      - invalid drag-drop wiring edit produces explicit error and no draft mutation
      - lifecycle trigger + backend/external dispatch without confirmation fails close
      - lifecycle trigger + backend/external dispatch without idempotency policy fails close
      - high-frequency trigger + backend/external dispatch without debounceMs fails close
      - trigger outside SSOT vocabulary (including load / loaded) fails close
      - actionType outside SSOT taxonomy fails close (no catch-all)
      - setting category taxonomy is exactly the six report categories
        (UI監視割当 / UI状態更新 / 副作用設定 / 内部API / 外部API連携 / 外部インスタンス連携)
      - direct side-effect self-loop fails close
      - detectable indirect side-effect loop fails close even with debounceMs present
      - selectable write targets exclude dependency closure of trigger source
      - registered external api / external instance selectable; selection writes typed reference
      - runtime runner emits initial_mount once per mount (rerender/refresh does not re-dispatch)
      - runtime runner is inert in preview mode
      - initial_mount UI状態更新 reflects into rendered runtimeSpec props via store
        change notification -> projection specs re-render (store Map value alone is not proof)
      - the notification-driven rerender does not re-execute initial_mount dispatch
      - preview / loop-guard paths produce no store update and no rerender notification
      - SSE-refresh-equivalent re-render preserves store state and the fired-registry
      - UI監視割当 slots are declared to the runtime store before mutation/effect;
        undeclared-slot writes fail close in the state dispatcher
      - runtime loop guard fails close on cyclic graphs (nothing executes; debounce is not proof)
      - unconfirmed / non-idempotent lifecycle dispatch never executes at runtime
      - dispatchInstanceOperation projects a runtime dispatch binding and rides the
        api_command_lane with typed instance-port reference (invalid prefix fails close)
      - event-triggered UI状態更新 (emitBoundEvent localStateMutation) writes through
        the SAME guarded dispatcher instance as the lifecycle path, not a direct
        raw-store write
      - event-triggered mutation targeting an undeclared / stale-node slot fails
        close identically to the lifecycle path (no auto-declare fallback either path)
      - event-triggered mutation on a predeclared slot succeeds through the shared dispatcher
      - event-triggered UI状態更新 -> store notification -> renderEmission re-run ->
        rendered runtimeSpec props reflect the mutation (not store-Map-only proof)
      - high-frequency trigger + external/instance dispatch without debounceMs fails
        close at emitBoundEvent (runtime dispatch time), not only at authoring/apply
        time, and the dispatch lane (enqueueExternalPortDispatchCommand /
        enqueueInstanceOperationDispatchCommand) is not called
      - a UI状態更新 interaction whose targetNodeId is absent from the current node
        list is never predeclared and fails close in the production-equivalent
        dispatcher path (createProjectionStateDispatcher(toWiringNodes(layoutNodes))
        -> renderEmission -> emitBoundEvent), not only a directly-constructed
        empty dispatcher
      - SSE refresh reconciles the runtime effect runner's node list
        (runner.updateNodes): an existing node's already-fired initial_mount does
        not re-execute; a newly-appeared node's initial_mount executes exactly once
      - a retry of a completed dispatchExternalPort / dispatchInstanceOperation
        request (same idempotency_key, response lost before the client received
        it) does not re-execute the external API call / instance operation and
        returns the SAME stored result (topology.rt_claim_dispatch_idempotency_key
        already_completed branch)
      - a concurrent duplicate request with the same idempotency_key while the
        first attempt is still processing does not execute (in_flight branch)
      - the frontend fired-registry alone is proven insufficient for retry-safety:
        a brand-new runner instance (simulating reload/reconnect/runner
        recreation) computes the IDENTICAL idempotency_key for the SAME authored
        interaction, independent of the fired-registry, which starts empty again
      - a failed claim (effect did not complete) is retry-safe to reclaim — a
        subsequent request with the same idempotency_key executes again rather
        than staying permanently blocked
      - idempotency_key is derived deterministically from stable identity plus
        the resolved dispatch payload — two distinct authored interactions, or
        the same interaction with different resolved payload content, never
        collide on the same key
    policy_ref: docs/design/pipeline-continuity-ssot.yaml test_tier_policy

  prohibited:
    - using_implementation_as_ssot_authority
    - treating_audit_report_as_design_or_vocabulary_authority (report is audit evidence / revision basis)
    - authoring_surface_without_the_runtime_runner_boundary_defined_here
    - using_implementation_categories_as_ssot_taxonomy
    - collapsing_ui_watch_binding_ui_state_update_side_effect_setting_into_legacy_or_generic_state_bucket
    - hiding_internal_api_outside_wiring_inspector_taxonomy
    - external_api_terminology_drift (外部API連携 / 外部連携 / external port mixing)
    - external_instance_terminology_drift (外部インスタンス連携 / インスタンス操作 mixing)
    - using_load_loaded_dom_onload_as_lifecycle_trigger_vocabulary
    - ui_builder_preset_ecosystem_ssot_as_owning_ssot_for_this_surface
    - hardcoded_external_api_or_instance_choices_in_ui_builder
    - raw_route_or_page_reference_as_event_wiring_authority
    - markmap_or_rendered_graph_as_persistence_authority
    - lifecycle_or_high_frequency_trigger_implementation_before_policy
    - side_effect_target_candidates_allowing_direct_or_detectable_indirect_loops
    - treating_debounce_or_throttle_as_loop_safety_proof
    - requiring_ad_hoc_useEffect_insertion_in_every_component_as_default_strategy
    - policy_warning_display_alone_passing_validate_or_apply
    - test_only_deletion_as_proof
    - event_triggered_local_state_mutation_writing_directly_to_a_raw_store
    - event_and_lifecycle_paths_using_separate_dispatcher_instances_for_the_same_projection
    - write_time_auto_declare_fallback_for_undeclared_slots
    - predeclaring_a_ui_state_update_target_absent_from_the_current_node_list
    - runtime_dispatch_of_high_frequency_trigger_without_debounce_ms_at_event_time
    - sse_refresh_ignoring_newly_mounted_lifecycle_interactions
    - pinning_the_runtime_effect_runner_to_its_creation_time_node_list
    - treating_the_frontend_fired_registry_alone_as_retry_safe_dispatch_idempotency
    - treating_dedupe_key_as_an_enum_value_without_backing_a_real_dedup_key
    - generating_a_fresh_random_idempotency_key_per_dispatch_call
    - conflating_runtime_event_log_append_only_evidence_with_the_idempotency_ledger
