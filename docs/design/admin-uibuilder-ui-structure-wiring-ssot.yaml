        by parallel checks. Scoped to admin_runtime-destination manifests only: the generic
        screenReadQueryWiring target_ref shape (manifest:<uuid>:<wiringKey>, no layer:action
        suffix) is unaffected. db/seed_empty.sql's manifests 00000000-0000-0000-0000-0000000ae200
        and ae210/ae220/ae230/ae240/ae250/ae260/ae270/ae280 each gained their own
        dispatcher_mapping entry (role=admin, target=manifest, layer=enum_dictionary,
        action=<their own action>) so this new authorization does not reject their existing
        production wiring; target="manifest" (not "admin") deliberately avoids colliding with the
        pre-existing axes-registered manifests (00000000-0000-0000-0000-0000000000a7..ae) that
        declare the SAME layer/action under target="admin" for the hardcoded /admin/enums route --
        both manifests being simultaneously active with identical [role,target,layer,action]
        axes would otherwise make ResolveActiveManifestAsync's axes-based resolution
        MANIFEST_AMBIGUOUS. Proof:
        backend/tests/Topolactor.Runtime.Tests/ManifestDispatcherTargetRefTests.cs (not-active,
        layer/action mismatch, manifest-does-not-authorize-this-action -- the literal
        create_group-manifest-combined-with-delete_group-action scenario --, non-layer:action
        shape rejected, authorized-succeeds, and non-admin_runtime destinations unaffected) and
        ManifestCapabilityGateTests.cs (capability_requirement continues to apply on the
        target_ref path after these new checks, both roles). Not yet proven against a real
        database (this is unit/in-memory proof only) and not yet consumed by an actual
        create_group live dispatch -- see declared_seed_surface_catalog known_gaps.
    manifest_topology_boundary:
      rule: >-
        manifest.topology entries for this surface (ui_projection type per
        db/manifest_tables.sql) carry packageIds / layoutId / wiringId / tensorId references
        only. A manifest.topology array element that embeds field/action/form-level UI
        structure directly (e.g. a flattened topology_ui_seed_record tree) is a top SSOT
        violation for this surface, regardless of which lane authored it.
      packageIds_authority_rule: >-
        packageIds specifically must resolve to topology.components_package_design rows
        (docs/design/db-schema.yaml packages/components_package_design.manifest_reference),
        never topology.ui_component_package rows -- the latter is a distinct
        component_group_bundle identity required only by
        topology.ui_topology_tensor.package_id's FK, not a manifest-facing authority. Refs
        pointing at the wrong table are still a top SSOT violation even though the entry
        itself stays refs-only in shape.
      prohibited:
        - manifest_topology_array_element_embedding_layout_or_wiring_payload_directly
        - treating_any_lane_above_as_manifest_topology_storage_authority
        - packageIds_referencing_topology_ui_component_package_instead_of_topology_components_package_design

  wiring_mode:
    role: UI event graph projection / edit mode over runtimeInteractions
    visual_model: source UI node -> event trigger -> setting category -> target/effect
    primary_inspector: UI event settings (操作イベント)
    mode_boundary:
      - wiring canvas is a switchable projection/edit mode over the same draft nodes
        as layout mode; it is not a separate route, tab hierarchy, or separate draft store
      - new wiring components are allowed only as view/edit projection,
        never as persistence authority
    persistence_authority:
      authority: draftNodes[].runtimeInteractions -> topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions
      rule: >-
        The wiring graph is derived (rehydrated) from runtimeInteractions on every
        render. Edits made in wiring mode are expressed as typed runtimeInteraction
        patches on draft nodes and persist only through the existing layout_patch
        save_tmp / preview / validate / apply lanes.
      prohibited:
        - wiring_graph_or_rendered_projection_as_persistence_source
        - raw_route_or_page_reference_as_event_wiring_authority
        - separate_wiring_draft_store_diverging_from_draft_nodes
    markmap_policy_if_used:
      - projection/view only
      - not semantic authority
      - not persistence source
      - rehydrate from runtimeInteractions

  trigger_vocabulary:
    rule: >-
      Authoring-selectable triggers are limited to this vocabulary. Triggers outside
      the vocabulary are blocking authoring errors (fail-close), not silent passthrough.
      Stored trigger values remain raw identifiers; visible labels use user-facing
      projection vocabulary (adminUxTerms), never raw-first. Report / SSOT / test /
      implementation must keep the same trigger group mapping.
    groups:
      lifecycle: [initial_mount, route_enter, initial_display]
      pointer: [click, mouseon, mouseout, hover_start, hover_end]
      keyboard: [keyon, keydown, keyup, enter, escape]
      form: [input, change, select, submit, focus, blur]
    lifecycle_semantics: >-
      initial_mount is a runtime synthetic lifecycle trigger emitted by the runtime
      component wrapper when a node's projection mounts. It is NOT DOM onLoad, NOT
      resource "loaded", and NOT a click/change alias.
    prohibited_vocabulary:
      - load
      - loaded
      - DOM_onLoad
    high_frequency_triggers: [mouseon, mouseout, hover_start, hover_end, keyon, keydown, keyup, input]
    runtime_execution_scope:
      in_bundle:
        - runtime state/effect runner boundary (frontend/runtime/uiEventEffectRunner.ts) —
          lifecycle emission, state dispatcher routing, loop guard, idempotency guard
        - initial_mount / route_enter / initial_display runtime synthetic emission
          (once per mount; preview inert; no re-dispatch on rerender)
        - UI状態更新 execution through the runtime state dispatcher (local state store)
        - 外部API連携 runtime dispatch lane (enqueueExternalPortDispatchCommand via api_command_lane)
        - 外部インスタンス連携 runtime dispatch lane (enqueueInstanceOperationDispatchCommand via api_command_lane)
      out_of_bundle:
        - backend resolution of external-port / instance-port dispatch targets
          (external_port_runtime / instance_port_runtime lanes own execution;
          unresolved targets fail explicitly on the dispatch lane)
        - DOM-level binding of pointer(non-click) / keyboard trigger vocabulary to
          additional primitive components (added per component as event/value
          surfaces, not as per-component effect semantics)

  ui_event_settings:
    surface: 操作イベント (per selected node; trigger UI and target/effect axes are independent)
    independent_axes_ref: docs/design/admin-console-workflow-ssot.yaml admin_authoring_completion_gate.ui_events_trigger_and_target_configurable
    event_trigger:
      - source UI node emits a trigger from trigger_vocabulary
      - trigger UI specification and target/effect specification are independent concepts
    setting_category_taxonomy:
      note: >-
        These six categories are the wiring inspector classification. Implementation
        categories (e.g. overlay/external_port/instance_operation/legacy) are internal
        identifiers at most and must not round the taxonomy: collapsing UI監視割当 /
        UI状態更新 / 副作用設定 into a "legacy" or generic 状態設定 bucket is prohibited.
      frontend_side:
        ui_watch_binding:
          label_ja: UI監視割当
          meaning: >-
            Declares a state slot / monitored variable / watched dependency source.
            useState-like binding declaration, not a mutation.
          fields_examples: [stateKey, initialValue, valueType, scope, watchedBy, readableFrom]
          proof_boundary: >-
            The mere presence of propsJson/stateJson is not sufficient UI監視割当 proof.
            The declaration model must be a distinct authoring category whose entries
            are declarations, separate from mutations.
        ui_state_update:
          label_ja: UI状態更新
          meaning: >-
            Writes to an already-declared state slot / monitored variable.
            setState-like mutation (set / toggle / clear / open / close / statePath write).
          action_types: [openModal, closeModal, toggleModal, openDrawer, closeDrawer, toggleDrawer, openDialog, closeDialog, toggleDialog, setActiveKey, setState]
        side_effect_setting:
          label_ja: 副作用設定
          meaning: >-
            useEffect-like reaction settings. Trigger source may be a UI event /
            watched state slot / monitored variable / outputProp / targetNode state.
            Write target may be a local state slot / monitored variable / outputProp /
            targetNode state / API result binding.
          field_boundary: >-
            payloadFrom / outputProp / targetNode state assignment are effect fields,
            not the effect authority itself. Explicit no-side-effect must be selectable
            (persisted as sideEffectNone: true).
      backend_side:
        internal_api:
          label_ja: 内部API
          candidates:
            - contents Step 3 API candidates
            - screenReadQueryWiring candidates
            - internal topology/API dispatch candidates
          lane: package wiring lane (ui_topology:update_package_wiring / ManifestStep3EventWiringPreset)
          rule: >-
            内部API is part of the wiring inspector classification. It must not be
            hidden outside the inspector taxonomy while claiming backend-side completion.
        external_api_integration:
          label_ja: 外部API連携
          candidates: external api candidates from seed-backed external port registry
          typed_reference: dispatchExternalPort + portTargetRef "external-port:<portKind>:<portId>[:<routeKey>]"
        external_instance_integration:
          label_ja: 外部インスタンス連携
          candidates: external instance candidates from seed-backed instance operation registry
          typed_reference: dispatchInstanceOperation + instanceTargetRef "instance-port:<portKind>:<instancePortId>:<operationBindingKey>"
      terminology_drift_prohibited:
        - mixing 外部API連携 with 外部連携 / external port / external api as visible taxonomy labels
        - mixing 外部インスタンス連携 with インスタンス操作 / instance operation as visible taxonomy labels
    authority:
      - credential / authority requirement candidate is displayed from the selected
        capability record within port record context (credential_kind / reference_key identifier)
      - credential material is never editable in UI Builder
    topology_movement:
      - hub relation prev
      - hub relation next
      - explicit jump by user-facing topology label/name
      - raw topology ids stay internal

  component_runtime_state_effect_boundary:
    rule: >-
      State/effect authoring must not require ad-hoc useEffect code inside every
      component. The runtime boundary owns effect execution.
    required_runtime_boundary:
      - runtime component wrapper / factory owns the useEffect-like effect runner
      - primitive components expose event/value surfaces and remain mostly pure renderers
      - state slots live in the projection-local state store or an equivalent declared runtime state store
      - UI監視割当 declares state slot / dependency source before mutation or effect selection
      - UI状態更新 writes only through the runtime state dispatcher
      - 副作用設定 resolves the dependency graph before execution and runs through the effect runner
    mutation_authority_unification:
      rule: >-
        There is exactly one guarded write path for UI状態更新: the runtime state
        dispatcher (RuntimeGuardedStateStore). The lifecycle-triggered path
        (uiEventEffectRunner.emitLifecycle) and the event-triggered path
        (runtimeComponentFactory.emitBoundEvent localStateMutation lane) both call
        applyGuardedLocalStateMutation against the SAME dispatcher instance — the
        event path does not write directly to a raw store. There is no
        write-time auto-declare fallback: a slot must be predeclared (via
        UI監視割当 stateJson or a predeclared UI状態更新 target scanned from the
        current node list) before either path may write it; a target absent
        from the current node list (e.g. a stale/deleted-node reference) fails
        close identically on both paths. Predeclaring a UI状態更新 target is
        conditioned on that target's nodeId actually appearing in the node list
        passed to predeclare — an authored interaction whose targetNodeId does
        not resolve to any node in that list is never predeclared, so it fails
        close on write exactly like an entirely undeclared slot, whether the
        dispatcher was built via createProjectionStateDispatcher(nodes) in the
        production mount path or constructed directly in a test.
      fail_close:
        - event_triggered_local_state_mutation_writing_directly_to_a_raw_store
        - event_and_lifecycle_paths_using_separate_dispatcher_instances_for_the_same_projection
        - write_time_auto_declare_fallback_for_undeclared_slots
        - predeclaring_a_ui_state_update_target_absent_from_the_current_node_list
    state_update_projection_rerender_contract:
      rule: >-
        A runtime state store update alone (Map write) is NOT UI状態更新 completion.
        The store carries change notification (subscribe), and the projection mount
        surface re-renders specs from the same store on notification, so UI状態更新
        reflects into rendered runtimeSpec props. Notification fires only on actual
        value change; renderEmission is a pure read of the store, so no
        notification loop forms. The rerender hook must not re-emit lifecycle
        triggers (fired-registry keeps initial_mount dispatch single-shot even if
        emission is re-entered), and preview / loop-guard paths produce no store
        write and therefore no notification.
      fail_close:
        - treating_store_map_update_alone_as_ui_state_update_completion
        - rerender_hook_re_dispatching_initial_mount
        - sse_refresh_recreating_store_runner_or_fired_registry
    lifecycle_runner_node_reconciliation:
      rule: >-
        The runtime effect runner reconciles its known node list on SSE refresh
        instead of staying pinned to the node list it was created with.
        Reconciliation (updateNodes) recomputes predeclared UI状態更新 targets,
        the side-effect loop guard, and the policy guard against the refreshed
        node list, then the mount surface re-emits the synthetic lifecycle
        triggers (initial_mount / route_enter / initial_display). The
        fired-registry is keyed by nodeId + interaction-index (not list
        position or emission-object identity), so an existing node's
        already-fired lifecycle interaction does not re-execute on
        reconciliation, while a newly-appeared node's lifecycle interaction
        executes exactly once on the reconciliation that introduces it.
      fail_close:
        - sse_refresh_ignoring_newly_mounted_lifecycle_interactions
        - reconciliation_re_executing_an_already_fired_lifecycle_interaction
      prohibited:
        - pinning_the_runner_to_its_creation_time_node_list
        - refetching_lifecycle_dispatch_by_recreating_the_runner_store_or_fired_registry
    runtime_boundary_implementation:
      effect_runner: frontend/runtime/uiEventEffectRunner.ts (createUiEventEffectRunner; owns lifecycle emission, loop guard, idempotency registry; updateNodes reconciles the runner to a refreshed node list without recreating the runner/store/fired-registry)
      state_dispatcher: frontend/runtime/uiEventEffectRunner.ts createRuntimeStateDispatcher (declare-then-mutate; undeclared-slot writes fail close; no auto-declare fallback)
      guarded_mutation_shared_entry_point: frontend/runtime/uiEventEffectRunner.ts applyGuardedLocalStateMutation + resolveUiStateUpdateMutation (used by BOTH executeStateUpdate (lifecycle) and runtimeComponentFactory.emitBoundEvent (event-triggered))
      predeclare: frontend/runtime/uiEventEffectRunner.ts predeclareProjectionState / createProjectionStateDispatcher (declares UI監視割当 stateJson slots and every UI状態更新 target whose targetNodeId is present in the current node list, before any interaction can execute; a target absent from that list is never predeclared)
      state_store_notification: frontend/runtime/uiEventEffectRunner.ts createRuntimeLocalStateStore (NotifyingRuntimeLocalStateStore.subscribe -> projection specs re-render)
      event_lanes: frontend/runtime/runtimeComponentFactory.ts emitBoundEvent (event log / internal dispatch / 外部API連携 / 外部インスタンス連携 / route navigation / local state lanes via the shared guarded dispatcher; previewMode inert; high_frequency_policy runtime guard fails close before the external/instance dispatch lane)
      binding_builder: frontend/runtime/renderEmission.ts buildLocalUiStateEventBinding (reuses wiringSettingCategoryOf + resolveUiStateUpdateMutation — the same classification/resolution the lifecycle path uses, so the event binding and the lifecycle mutation agree on shape) / buildExternalPortEventBinding (carries debounceMs on the externalPortDispatch / instanceOperationDispatch binding so the runtime guard can evaluate it at dispatch time)
      mount_integration: frontend/islands/ProjectionShell.tsx (single dispatcher created before the first render; passed into both renderEmission and the runner; runner created once per mount; initial_mount emitted after first projection render; SSE refresh calls runner.updateNodes then re-emits lifecycle triggers so newly-appeared nodes execute while existing fired interactions stay idempotent)
      dispatch_lanes: frontend/runtime/frontendScheduler.ts enqueueExternalPortDispatchCommand / enqueueInstanceOperationDispatchCommand (api_command_lane; typed-ref prefix fail close)
    component_edit_boundary:
      - edit an individual component only when a required event/value surface is missing
      - unsupported component kind must fail-close in proof tests
      - component-specific state/effect implementation is the exception, not the default path
    required_receive_surfaces:
      - current state values
      - mutation dispatcher
      - effect binding metadata
      - dispatch lanes for internal API / external API / external instance
    prohibited:
      - embedding_ad_hoc_useEffect_in_every_component_factory
      - executing_effects_from_rendered_graph_persistence_authority
      - writing_component_state_directly_outside_declared_runtime_state_dispatcher
      - treating_propsJson_stateJson_as_sufficient_ui_watch_binding_proof
      - treating_event_to_localStateMutation_as_sufficient_side_effect_setting_proof

  lifecycle_policy:
    rules:
      - initial_mount / route_enter / initial_display are runtime synthetic lifecycle triggers
      - initial_mount is not DOM onLoad / resource loaded and not a click/change alias
      - preview is inert by default for lifecycle triggers
      - backend/external dispatch bound to a lifecycle trigger requires explicit author
        confirmation persisted as lifecycleDispatchConfirmed=true on the interaction
      - backend/external dispatch bound to a lifecycle trigger requires an explicit
        idempotency policy persisted as idempotencyPolicy on the interaction
      - initial_mount dispatch must not re-dispatch on rerender (idempotencyPolicy once_per_mount)
      - route_enter / refetch dispatch needs an idempotency policy (refetch_on_route_enter or dedupe_key)
    idempotency_policy_values: [once_per_mount, refetch_on_route_enter, dedupe_key]
    fail_close:
      - lifecycle_trigger_with_backend_or_external_dispatch_without_explicit_confirmation
      - lifecycle_trigger_with_backend_or_external_dispatch_without_idempotency_policy
    prohibited:
      - implementing_lifecycle_trigger_runtime_execution_before_this_policy
      - treating_initial_mount_as_dom_onload_or_click_alias
      - policy_warning_display_alone_passing_validate_or_apply
    retry_safe_dispatch_idempotency:
      rule: >-
        idempotencyPolicy is a retry-safe DISPATCH policy, not merely a frontend
        runner duplicate-fire guard. The runner's fired-registry (nodeId +
        interaction-index) only prevents duplicate lifecycle emission WITHIN a
        single runner's lifetime; it provides no guarantee across communication
        loss, retry, reload, reconnect, or runtime-runner recreation — those all
        construct a brand-new runner with a brand-new (empty) fired-registry.
        Retry-safety across that boundary requires a stable idempotency_key
        carried on the dispatch payload plus a backend ledger
        (topology.runtime_dispatch_idempotency_ledger) that gates execution
        BEFORE the external API call / instance operation runs — not merely an
        append-only evidence log recorded after execution.
      idempotency_policy_semantics:
        once_per_mount: >-
          Runner-lifetime duplicate lifecycle emission guard (existing
          fired-registry behavior) PLUS a deterministic idempotency_key so a
          retry of the SAME initial_mount firing (communication loss, reload,
          reconnect, runtime-runner recreation) is recognized by the backend
          ledger as a retry of the same logical dispatch, not a new one.
        refetch_on_route_enter: >-
          Refires on each route_enter emission (existing behavior); each
          route_enter firing gets its own idempotency_key (recomputed per
          firing from the same stable identity) so a retry of one SPECIFIC
          route_enter firing is deduplicated without blocking the next
          legitimate route_enter firing.
        dedupe_key: >-
          The retry-safe dispatch key is the actual enforcement mechanism, not
          merely an enum value that passes authoring validation. An
          author-provided dedupe seed, when authored, is folded into
          idempotency_key generation so it participates in the same backend
          ledger claim/complete/fail contract as the other two policies.
      idempotency_key_generation:
        formula: >-
          layoutId + packageId + nodeId + stable interaction identity (nodeId +
          interactionIndex — the SAME identity the fired-registry uses) +
          trigger + actionType + targetRef (portTargetRef / instanceTargetRef)
          + resolved dispatch payload (canonicalized, order-independent) +
          author-provided dedupe seed when idempotencyPolicy is dedupe_key.
        determinism: >-
          The key is DETERMINISTIC from this identity — not a fresh random
          value per dispatch call. A random key would defeat retry-safety,
          since a retry must present the SAME key as the original attempt for
          the backend ledger to recognize it.
        implementation: frontend/lib/uiBuilderWiringProjection.ts computeDispatchIdempotencyKey (identity-only base, computed at binding-build time for the event-triggered path and inline for the lifecycle path) / appendResolvedPayloadToIdempotencyKey (extends the base with the event-time resolved payload)
      backend_ledger:
        table: topology.runtime_dispatch_idempotency_ledger (db/topology_tables.sql)
        functions:
          - topology.rt_claim_dispatch_idempotency_key (returns claimed / in_flight / already_completed)
          - topology.rt_complete_dispatch_idempotency_key
          - topology.rt_fail_dispatch_idempotency_key (failed keys are retry-safe to reclaim — the underlying effect did not complete, so failure does not permanently poison the key)
        boundary: >-
          Read BEFORE execution (claim) and written AFTER (complete/fail).
          Distinct from topology.runtime_event_log, which is append-only
          effect-OBSERVED evidence, written only after execution, and never
          read to decide whether to execute.
        gating: >-
          The ledger activates only when idempotency_key is present on the
          request payload. Absence is not fail-close at the generic runtime
          dispatch boundary — backward-compatible for pre-existing
          dispatchExternalPort / dispatchInstanceOperation callers outside
          this surface's runtime_interactions_lane (see lane_storage_boundary
          above — this is a runtime_interactions_lane statement, not a
          package_internal_api_wiring_lane one; that lane's idempotency
          applicability is a separate known_gap, not implied here).
          runtime_interactions_lane specifically always supplies one for its
          dispatchExternalPort / dispatchInstanceOperation entries: both the
          lifecycle path (uiEventEffectRunner.ts emitLifecycle) and the
          event-triggered path (renderEmission.ts binding builder +
          runtimeComponentFactory.ts emitBoundEvent) compute and forward
          idempotency_key unconditionally.
        implementation:
          - backend/runtime/RuntimeDispatchIdempotencyLedger.cs (IRuntimeDispatchIdempotencyLedger contract)
          - backend/repository/NpgsqlRuntimeDispatchIdempotencyLedgerRepository.cs
          - backend/runtime/ExternalPortDispatchRuntime.cs ExecuteAsync (claim before ExecutePolicyAsync; complete/fail after)
          - backend/runtime/InstancePortRuntime.cs ExecuteAsync (claim before AbstractFunctionExecutor.ExecuteAsync; complete/fail after)
      fail_close:
        - dispatch_idempotency_key_present_but_ledger_claim_skipped_before_effect_execution
        - already_completed_claim_re_executing_the_effect_instead_of_returning_the_stored_result
        - in_flight_claim_executing_the_effect_concurrently
      prohibited:
        - treating_the_frontend_fired_registry_alone_as_retry_safe_dispatch_idempotency
        - treating_dedupe_key_as_an_enum_value_without_backing_a_real_dedup_key
        - generating_a_fresh_random_idempotency_key_per_dispatch_call
        - conflating_runtime_event_log_append_only_evidence_with_the_idempotency_ledger
      known_gap:
        - author_provided_dedupe_seed_authoring_field_is_not_yet_added_to_NodeEventAuthoringPanel_this_round_deterministic_identity_plus_payload_key_still_provides_full_retry_safety_without_it

    projection_authority_runtime_interaction_identity:
      status: implemented
      origin: >-
        .agent/tasks/todo.md Bundle ui-projection-surface-architecture-reinforcement,
        "runtimeInteraction identity / projection-time idempotency identity" future
        direction. This subsection was authored as a design_change SSOT contract
        first (PR577), then implemented as this same Bundle's remaining scope
        (PR577 follow-up). retry_safe_dispatch_idempotency above (PR574) remains
        the execution-gate authority and is unchanged by this addition — this
        section only replaces the STRUCTURAL-IDENTITY component the ledger key is
        built from; the ledger contract itself is untouched.
      implementation_surfaces:
        assignment: backend/repository/NpgsqlUiTopologyRepository.cs AssignRuntimeInteractionIds (called from ApplyConfirmedLayoutPatchAsync only, after validation and before persistence)
        key_formula: frontend/lib/uiBuilderWiringProjection.ts computeDispatchIdempotencyKey (runtimeInteractionId param; backward-compatible nodeId+interactionIndex fallback when absent)
        event_triggered_binding: frontend/runtime/renderEmission.ts buildExternalPortEventBinding (forwards wiring.runtimeInteractionId)
        lifecycle_binding: frontend/runtime/uiEventEffectRunner.ts emitLifecycle (forwards w.runtimeInteractionId)
        duplication_boundary: frontend/runtime/visualLayoutUtils.ts cloneVisualNode (strips runtimeInteractionId from copied runtimeInteractions)
        type_surfaces:
          - frontend/api/dispatch.ts LayoutNode.runtimeInteractions[].runtimeInteractionId
          - frontend/lib/uiBuilderWiringProjection.ts WiringInteraction.runtimeInteractionId
          - frontend/runtime/visualLayoutUtils.ts VisualNodePayload.runtimeInteractions[].runtimeInteractionId
        tests:
          - backend/tests/Topolactor.Runtime.Tests/NpgsqlUiTopologyRepositoryRuntimeInteractionIdentityTests.cs
          - frontend/tests/uiBuilderWiringProjection.test.ts (computeDispatchIdempotencyKey runtimeInteractionId cases)
          - frontend/tests/uiEventEffectRunner.test.ts (lifecycle path forwarding + reorder/rename survival)
          - frontend/tests/externalPortDispatchRuntime.test.ts (event-triggered binding forwarding)
          - frontend/tests/visualLayoutBuilder.test.ts (cloneVisualNode duplication_rule + JSON round-trip)
      problem: >-
        idempotency_key_generation (retry_safe_dispatch_idempotency above) derives
        stable interaction identity structurally — nodeId + interactionIndex, i.e.
        the interaction's POSITION within topology.ui_topology_tensor.layout_patch_json
        nodes[].runtimeInteractions[] (frontend/runtime/visualLayoutUtils.ts
        VisualNodePayload.runtimeInteractions has no persistent per-entry id).
        Reordering runtimeInteractions on a node, or moving/duplicating a node,
        changes that structural identity even when the authored interaction's
        semantic intent is unchanged, and gives a duplicated interaction the SAME
        identity as its source until the resolved payload happens to differ. This
        is compatibility/current-state per the parent bundle, not final projection
        authority.
      target_contract:
        field: runtimeInteractionId
        field_shape: UUID string, one per authored runtimeInteractions[] entry
        field_shape_enforcement: >-
          A present-but-blank, present-but-non-string, or present-but-non-UUID-format
          value at the persistence boundary is NOT a valid existing id — it is
          treated identically to absent (NpgsqlUiTopologyRepository.HasValidRuntimeInteractionId
          / Guid.TryParse) and REPLACED with a freshly assigned valid UUID, never
          preserved as-is and never forwarded to frontend dispatch identity. The
          replacement rewrite never emits a duplicate runtimeInteractionId JSON key
          alongside the stale invalid one — the invalid property is omitted, not
          copied through, before the single fresh id is written.
        storage: >-
          Inline on the JSONB entry — topology.ui_topology_tensor.layout_patch_json
          nodes[].runtimeInteractions[].runtimeInteractionId. No new relational
          table is required for the initial contract; a normalized child table
          is an allowed future alternative but out of scope here.
        assignment_authority: >-
          Backend layout_patch persistence boundary (the same server-side
          validate/persist path invoked by layout_patch:apply) assigns
          runtimeInteractionId to any runtimeInteractions[] entry that lacks one,
          at persist time. The frontend never generates or mutates this id — it
          only reads the assigned value back through the existing
          layout_patch_json -> emission.layoutNodes[].runtimeInteractions[] path
          and forwards it verbatim. This keeps assignment at the
          projection-authority (DB/backend-persisted) layer, not the UI layer.
        duplication_rule: >-
          A copy/duplicate operation (node copy, interaction copy) that produces
          a NEW authored runtimeInteractions[] entry must not carry over the
          source entry's runtimeInteractionId — the backend assigns a fresh one
          on next persist, same as any other id-less entry. Identity maps 1:1 to
          a distinct authored interaction, never to a cloned definition.
        idempotency_base_key_formula_update: >-
          computeDispatchIdempotencyKey's identity portion becomes
          runtimeInteractionId (when present) INSTEAD OF nodeId + interactionIndex.
          layoutId, packageId, trigger, actionType, targetRef, authorDedupeKey, and
          the resolved-payload extension via appendResolvedPayloadToIdempotencyKey
          are unchanged — only the structural-position identity component is
          replaced by the assigned stable id. When runtimeInteractionId is absent
          (pre-migration entry), the existing nodeId + interactionIndex fallback
          applies unchanged — this is an additive, backward-compatible formula
          change, not a ledger contract change.
        backend_ledger_unchanged: >-
          topology.runtime_dispatch_idempotency_ledger and its
          rt_claim_dispatch_idempotency_key / rt_complete_dispatch_idempotency_key /
          rt_fail_dispatch_idempotency_key functions (retry_safe_dispatch_idempotency
          above) are unaffected — they gate on whatever idempotency_key string they
          receive and do not need to know how that string's identity portion was
          derived.
        migration: >-
          Lazy backfill only: existing layout_patch_json entries without
          runtimeInteractionId keep working via the structural fallback; the
          backend assigns an id the next time that entry is persisted (e.g. next
          layout_patch:apply), not via a big-bang migration pass.
      prohibited:
        - client_side_generation_of_runtimeInteractionId
        - carrying_over_source_runtimeInteractionId_on_node_or_interaction_duplication
        - replacing_the_backend_idempotency_ledger_contract_to_implement_this
        - treating_this_subsection_as_authorization_to_implement_without_a_dedicated_implementation_change_bundle
        - reclassifying_retry_safe_dispatch_idempotency_pr574_evidence_as_missing_because_of_this_future_direction

  high_frequency_policy:
    rules:
      - mouseon / hover / key-repeat class triggers must not dispatch backend/external
        calls by default
      - local UI state / monitored variable update is allowed by default
      - backend/API dispatch or topology movement on a high-frequency trigger requires
        an explicit debounceMs value (positive integer) persisted on the interaction
        plus an explicit authoring warning
      - debounce/throttle is NOT side-effect loop-safety proof; loop checks run independently
      - this requirement is enforced at runtime dispatch time, not only at
        authoring/apply time — runtimeComponentFactory.emitBoundEvent fails close
        before calling enqueueExternalPortDispatchCommand /
        enqueueInstanceOperationDispatchCommand when the bound trigger is
        high-frequency and the binding's debounceMs is missing/invalid —
        authoring/apply policy guard alone does not stop an out-of-band
        persisted interaction from reaching the dispatch lane at runtime
    fail_close:
      - high_frequency_trigger_with_backend_or_external_dispatch_without_debounce_ms
      - runtime_dispatch_of_high_frequency_trigger_without_debounce_ms_at_event_time
    prohibited:
      - implementing_high_frequency_trigger_runtime_execution_before_this_policy
      - silent_default_debounce_injection
      - treating_debounce_or_throttle_as_loop_safety_proof
      - authoring_or_apply_policy_guard_alone_without_a_runtime_dispatch_guard

  side_effect_cycle_policy:
    rule: >-
      Effect write target candidates must be filtered by a dependency not-in rule
      before selection: selectable_write_targets = all_write_targets -
      dependency_closure(trigger_source).
    fail_close:
      - direct_self_loop_is_prohibited (watched A -> writes A)
      - detectable_indirect_loop_fails_close (A -> B and B -> A without explicit cycle break)
    ng_examples:
      - watched A -> set A
      - watched A -> outputProp A
      - watched A -> API result writes A
      - A -> B and B -> A without explicit cycle break
    boundary:
      - debounce/throttle does not satisfy or replace this policy
      - loop detection runs on the authoring dependency graph derivable from
        runtimeInteractions (value-reactive triggers x write targets)

  external_event_candidates:
    sources:
      - registered external api ports from seed/CRUD-backed registry
        (topology.external_access_ports / external_response_ports / external_hook_ports,
        active rows; op: ui_topology:list_external_port_authoring_candidates)
      - registered external instance operations from admin-approved bindings
        (op: ui_topology:list_instance_operation_authoring_candidates)
      - registered credential authority carried by the port record
        (credential_kind / reference_key identifier; plaintext prohibited)
    typed_reference_contract:
      dispatchExternalPort: portTargetRef "external-port:<portKind>:<portId>[:<routeKey>]"
      dispatchInstanceOperation: instanceTargetRef "instance-port:<portKind>:<instancePortId>:<operationBindingKey>"
    prohibited:
      - hardcoded_external_api_or_instance_choices_in_ui_builder
      - provider_or_bundle_fixed_candidate_lists_in_frontend
      - raw_route_or_page_reference_written_as_event_wiring
      - plaintext_credential_material_in_candidates_or_projection

  drag_drop_wiring_edit:
    rules:
      - valid drop produces a typed runtimeInteraction patch on the source draft node
      - invalid drop (unknown node, self-drop, non-wirable target) produces an explicit
        error and NO draft mutation
      - wiring edits are draft-scoped and undoable (draft history) before explicit apply
    fail_close:
      - invalid_drop_must_not_mutate_draft
    prohibited:
      - silent_drop_rejection_without_visible_error
      - drop_edit_writing_active_topology_directly

  authoring_metadata_fields:
    note: >-
      Authoring-only policy fields on RuntimeInteraction entries. Backend layout_patch
      validation reads only known fields; these pass through untouched and carry policy
      evidence for the future runtime execution bundle.
    fields:
      debounceMs:
        type: positive integer (milliseconds)
        required_when: high-frequency trigger bound to backend/external dispatch
      lifecycleDispatchConfirmed:
        type: boolean
        required_when: lifecycle trigger bound to backend/external dispatch (must be true)
      idempotencyPolicy:
        type: enum (once_per_mount | refetch_on_route_enter | dedupe_key)
        required_when: lifecycle trigger bound to backend/external dispatch
      sideEffectNone:
        type: boolean
        meaning: explicit no-side-effect selection for a dispatch interaction

  implementation_surfaces:
    projection_policy_lib: frontend/lib/uiBuilderWiringProjection.ts
    wiring_panel: frontend/components/WiringGraphPanel.tsx
    event_settings_panel: frontend/components/NodeEventAuthoringPanel.tsx
    internal_api_lane_surfaces:
      - frontend/components/ManifestStep3EventWiringPreset.tsx
      - PackageConnectionPanel (frontend/islands/UiBuilderAdmin.tsx)
    island: frontend/islands/UiBuilderAdmin.tsx
    label_vocabulary: frontend/content/adminUxTerms.ts
    pre_save_validation: frontend/runtime/visualLayoutUtils.ts findRuntimeInteractionPatchErrors (+ policy/cycle errors from projection_policy_lib)
    runtime_effect_runner: frontend/runtime/uiEventEffectRunner.ts
    runtime_event_lanes: frontend/runtime/runtimeComponentFactory.ts emitBoundEvent + frontend/runtime/renderEmission.ts dispatch bindings
    runtime_dispatch_lanes: frontend/runtime/frontendScheduler.ts (enqueueExternalPortDispatchCommand / enqueueInstanceOperationDispatchCommand)
    runtime_mount_surface: frontend/islands/ProjectionShell.tsx

  proof_surface:
    executable_structure_check: .agent/tests/check-admin-uibuilder-wiring.sh
    test_files:
      - frontend/tests/uiBuilderWiringProjection.test.ts
      - frontend/tests/uiEventEffectRunner.test.ts
      - frontend/tests/runtimeInteractionAuthoring.test.ts
      - frontend/tests/runtimeUiInteractionScenario.test.ts
      - frontend/tests/visualLayoutBuilder.test.ts
      - frontend/tests/uiBuilderPackageWiring.test.ts
      - frontend/tests/adminWiringExecutionLane.test.ts
    required_proof:
      - runtimeInteractions -> wiring projection round-trip (projection derives from and
        rehydrates to the same runtimeInteractions authority)
      - valid drag-drop wiring edit produces typed runtimeInteraction patch
      - invalid drag-drop wiring edit produces explicit error and no draft mutation
      - lifecycle trigger + backend/external dispatch without confirmation fails close
      - lifecycle trigger + backend/external dispatch without idempotency policy fails close
      - high-frequency trigger + backend/external dispatch without debounceMs fails close
      - trigger outside SSOT vocabulary (including load / loaded) fails close
      - actionType outside SSOT taxonomy fails close (no catch-all)
      - setting category taxonomy is exactly the six report categories
        (UI監視割当 / UI状態更新 / 副作用設定 / 内部API / 外部API連携 / 外部インスタンス連携)
      - direct side-effect self-loop fails close
      - detectable indirect side-effect loop fails close even with debounceMs present
      - selectable write targets exclude dependency closure of trigger source
      - registered external api / external instance selectable; selection writes typed reference
      - runtime runner emits initial_mount once per mount (rerender/refresh does not re-dispatch)
      - runtime runner is inert in preview mode
      - initial_mount UI状態更新 reflects into rendered runtimeSpec props via store
        change notification -> projection specs re-render (store Map value alone is not proof)
      - the notification-driven rerender does not re-execute initial_mount dispatch
      - preview / loop-guard paths produce no store update and no rerender notification
      - SSE-refresh-equivalent re-render preserves store state and the fired-registry
      - UI監視割当 slots are declared to the runtime store before mutation/effect;
        undeclared-slot writes fail close in the state dispatcher
      - runtime loop guard fails close on cyclic graphs (nothing executes; debounce is not proof)
      - unconfirmed / non-idempotent lifecycle dispatch never executes at runtime
      - dispatchInstanceOperation projects a runtime dispatch binding and rides the
        api_command_lane with typed instance-port reference (invalid prefix fails close)
      - event-triggered UI状態更新 (emitBoundEvent localStateMutation) writes through
        the SAME guarded dispatcher instance as the lifecycle path, not a direct
        raw-store write
      - event-triggered mutation targeting an undeclared / stale-node slot fails
        close identically to the lifecycle path (no auto-declare fallback either path)
      - event-triggered mutation on a predeclared slot succeeds through the shared dispatcher
      - event-triggered UI状態更新 -> store notification -> renderEmission re-run ->
        rendered runtimeSpec props reflect the mutation (not store-Map-only proof)
      - high-frequency trigger + external/instance dispatch without debounceMs fails
        close at emitBoundEvent (runtime dispatch time), not only at authoring/apply
        time, and the dispatch lane (enqueueExternalPortDispatchCommand /
        enqueueInstanceOperationDispatchCommand) is not called
      - a UI状態更新 interaction whose targetNodeId is absent from the current node
        list is never predeclared and fails close in the production-equivalent
        dispatcher path (createProjectionStateDispatcher(toWiringNodes(layoutNodes))
        -> renderEmission -> emitBoundEvent), not only a directly-constructed
        empty dispatcher
      - SSE refresh reconciles the runtime effect runner's node list
        (runner.updateNodes): an existing node's already-fired initial_mount does
        not re-execute; a newly-appeared node's initial_mount executes exactly once
      - a retry of a completed dispatchExternalPort / dispatchInstanceOperation
        request (same idempotency_key, response lost before the client received
        it) does not re-execute the external API call / instance operation and
        returns the SAME stored result (topology.rt_claim_dispatch_idempotency_key
        already_completed branch)
      - a concurrent duplicate request with the same idempotency_key while the
        first attempt is still processing does not execute (in_flight branch)
      - the frontend fired-registry alone is proven insufficient for retry-safety:
        a brand-new runner instance (simulating reload/reconnect/runner
        recreation) computes the IDENTICAL idempotency_key for the SAME authored
        interaction, independent of the fired-registry, which starts empty again
      - a failed claim (effect did not complete) is retry-safe to reclaim — a
        subsequent request with the same idempotency_key executes again rather
        than staying permanently blocked
      - idempotency_key is derived deterministically from stable identity plus
        the resolved dispatch payload — two distinct authored interactions, or
        the same interaction with different resolved payload content, never
        collide on the same key
    policy_ref: docs/design/pipeline-continuity-ssot.yaml test_tier_policy

  prohibited:
    - using_implementation_as_ssot_authority
    - treating_audit_report_as_design_or_vocabulary_authority (report is audit evidence / revision basis)
    - authoring_surface_without_the_runtime_runner_boundary_defined_here
    - using_implementation_categories_as_ssot_taxonomy
    - collapsing_ui_watch_binding_ui_state_update_side_effect_setting_into_legacy_or_generic_state_bucket
    - hiding_internal_api_outside_wiring_inspector_taxonomy
    - external_api_terminology_drift (外部API連携 / 外部連携 / external port mixing)
    - external_instance_terminology_drift (外部インスタンス連携 / インスタンス操作 mixing)
    - using_load_loaded_dom_onload_as_lifecycle_trigger_vocabulary
    - ui_builder_preset_ecosystem_ssot_as_owning_ssot_for_this_surface
    - hardcoded_external_api_or_instance_choices_in_ui_builder
    - raw_route_or_page_reference_as_event_wiring_authority
    - markmap_or_rendered_graph_as_persistence_authority
    - lifecycle_or_high_frequency_trigger_implementation_before_policy
    - side_effect_target_candidates_allowing_direct_or_detectable_indirect_loops
    - treating_debounce_or_throttle_as_loop_safety_proof
    - requiring_ad_hoc_useEffect_insertion_in_every_component_as_default_strategy
    - policy_warning_display_alone_passing_validate_or_apply
    - test_only_deletion_as_proof
    - event_triggered_local_state_mutation_writing_directly_to_a_raw_store
    - event_and_lifecycle_paths_using_separate_dispatcher_instances_for_the_same_projection
    - write_time_auto_declare_fallback_for_undeclared_slots
    - predeclaring_a_ui_state_update_target_absent_from_the_current_node_list
    - runtime_dispatch_of_high_frequency_trigger_without_debounce_ms_at_event_time
    - sse_refresh_ignoring_newly_mounted_lifecycle_interactions
    - pinning_the_runtime_effect_runner_to_its_creation_time_node_list
    - treating_the_frontend_fired_registry_alone_as_retry_safe_dispatch_idempotency
    - treating_dedupe_key_as_an_enum_value_without_backing_a_real_dedup_key
    - generating_a_fresh_random_idempotency_key_per_dispatch_call
    - conflating_runtime_event_log_append_only_evidence_with_the_idempotency_ledger
