          uniform ValidateCapabilityRequirement, which already runs after every manifest
          resolution path (axes/target_ref/db_notify) equally, target_ref included. wiringKey/
          wiringId are intentionally OMITTED from an override
          spec (they identify the layout's OWN wiring row, not this override's different target;
