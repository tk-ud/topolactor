      proof: >-
        frontend/tests/renderEmissionPropBindings.test.ts (buildCatalogComponentEventBinding
        override-replaces-only-the-matching-trigger, override-still-merges-payloadFrom;
        renderEmission fail-close cases -- unrecognized trigger, lane-unsupported trigger,
        alias collision, non-string value, malformed target_ref shape, non-admin_runtime
        wiringKind; unrelated triggers on the SAME node keep the layout's own uniform target
        including wiringKey/wiringId; absent field renders unchanged),
        frontend/tests/visualLayoutBuilder.test.ts (UI Builder round-trip fidelity for both
        dispatchPayloadFromByTrigger and dispatchTargetRefByTrigger, cloneVisualNode
        preservation, omitted when absent),
        backend/tests/Topolactor.Runtime.Tests/NpgsqlUiTopologyRepositoryLayoutPatchValidationTests.cs
        (persistence-boundary shape validation, admin_runtime-only wiring_kind gate including the
        ambiguous-tensor-row case, and the manifest existence/active/runtime_destination
        authorization triad) and LayoutSchemaStructuralCompositionTests.cs
        (NodeLocalData/Compose merge-by-exact-nodeId for the dispatchTargetRefByTriggerJson
        field). Not yet proven: a live-DB round trip actually wiring this override into an
        admin-enum manifest's seed (see docs/design/react-schema-topology-seed-translator-ssot.yaml
        declared_seed_surface_catalog admin.enum.management.projection known_gaps for the
        current honestly-open state) -- round 16 closes every authoring/authority boundary this
        mechanism itself has, it does not by itself constitute a single per-screen manifest.
      round_17_hardening: >-
        2026-07-29. Closed the remaining dispatch-time gap round 16 explicitly deferred:
        backend/runtime/ManifestDispatcher.cs's target_ref branch previously only checked manifest
        existence (LoadByIdAsync performs no status filter, unlike ResolveActiveManifestAsync) and
        never cross-checked the target_ref's own embedded layer:action against either the
        request's declared Layer/Action or the resolved manifest's own dispatcher_mapping entries
        -- meaning an authored (or uniform-layout) admin_runtime target_ref could in principle
        combine one manifest's identity (e.g. a create_group-only manifest) with an unrelated
        Layer/Action pair (e.g. delete_group), since AdminRuntime.ExecuteDataAsync dispatches
        purely on Layer/Action, independent of which manifest_id resolved it. Now, whenever a
        target_ref-resolved manifest's runtime_destination is admin_runtime: (1)
        TARGET_REF_MANIFEST_NOT_ACTIVE re-verifies manifest.Status=="active" at dispatch time
        (closes the TOCTOU vs. the save-time-only check above), (2)
        TARGET_REF_LAYER_ACTION_MISMATCH requires the target_ref's own "manifest:<uuid>:<layer>:
        <action>" suffix to equal the request's Layer/Action, and (3)
        TARGET_REF_LAYER_ACTION_UNAUTHORIZED requires the resolved manifest's OWN
        dispatcher_mapping to declare that exact layer/action (via the new shared
        DispatcherMappingAxisAuthority.MatchesAxes, also now reused by
        NpgsqlManifestRepository's axes-resolution path instead of a parallel duplicate) --
        role/target axes are intentionally wildcarded in this specific check (request.Target for
        these dispatches is the node's targetSurface="manifest", not the dispatcher_mapping
        "target" value used by the pre-existing axes-registered manifests for the same admin
        action; checking target here would force a collision between the two registration
        styles). This validation lives in ManifestDispatcher.DispatchAsync's single target_ref
        branch, which the uniform per-layout target_ref (NpgsqlTopologyRepository.
        LoadLayoutNodesAsync's tensor-row default) and a per-node dispatchTargetRefByTrigger
        override both funnel through identically by the time they reach this backend boundary --
