admin_uibuilder_ui_structure_wiring_ssot:
  name: admin_uibuilder_ui_structure_wiring
  version: 0.6.0
  status: ssot_design_document
  canonical_path: docs/design/admin-uibuilder-ui-structure-wiring-ssot.yaml
  authority_hierarchy: >-
    This SSOT is the design authority (設計正本) for the surface. The audit
    report (.agent/reports/frontend-ui-audit-bundle-semantic-frame.md) is audit
    evidence and the semantic frame that motivated this SSOT's vocabulary — it
    is a revision basis, not a design or vocabulary authority. Tests are
    SSOT-conformance proof; implementation conforms to SSOT and tests. SSOT /
    test / implementation must keep the same trigger group mapping and setting
    category taxonomy defined here; implementation-derived catch-all categories
    are not SSOT taxonomy.

  purpose:
    summary: >-
      Owning SSOT for the /admin/ui-builder UI structure and wiring surface:
      the layout canvas / wiring canvas boundary, UI event settings,
      runtimeInteractions authoring, and external capability selection from the
      seed-backed registry. This document is the canonical design authority for
      the surface; implementation and tests map to it, never the reverse.
    owns:
      - /admin/ui-builder UI structure (mode boundary, dock composition intent)
      - layout canvas / wiring canvas responsibility boundary
      - UI event settings authoring contract and setting category taxonomy
      - runtimeInteractions authoring persistence authority statement
      - external capability selection from seed registry (typed reference contract)
      - trigger vocabulary and lifecycle / high-frequency / drag-drop / side-effect-cycle policies
      - component runtime state/effect boundary for authored interactions
    does_not_own:
      - canonical_route_registry: docs/design/runtime-orchestration-ssot.yaml frontend_routes
      - canvas_workspace_contract_body: docs/design/admin-console-workflow-ssot.yaml ui_builder_canvas_workspace
      - runtimeInteractions_descriptor_field_contract: docs/design/admin-console-workflow-ssot.yaml layout_node_props_contract
      - external_port_record_and_credential_boundary: docs/design/external-port-substrate-ssot.yaml
      - instance_port_record_and_operation_binding_boundary: docs/design/instance-port-substrate-ssot.yaml
      - frontend_component_event_log_lane_vocabulary: docs/design/pipeline-continuity-ssot.yaml (COMPONENT_EVENT_TYPES / eventType)
      - preset_ecosystem: docs/design/ui-builder-preset-ecosystem-ssot.yaml
      - proof_surface_policy_body: docs/design/pipeline-continuity-ssot.yaml
    ownership_boundary_note: >-
      docs/design/ui-builder-preset-ecosystem-ssot.yaml is NOT the owning SSOT for
      this surface. Preset ecosystem remains a support surface under its own SSOT.

  route_authority:
    route: /admin/ui-builder
    canonical_route_registry: docs/design/runtime-orchestration-ssot.yaml frontend_routes.admin
    workflow_position: docs/design/admin-console-workflow-ssot.yaml (canvas workspace route, not a pipeline step)

  lineage_boundary:
    current_reusable_canvas_lineage: FlowLayoutCanvas
    historical_note: >-
      The historical VisualLayoutCanvas direct-manipulation lineage was replaced
      before the current audit report scope. Restoring it is not required by this
      bundle, and old Figma-like wording must not be treated as current blocking
      authority.

  layout_mode:
    role: primary placement / design authoring mode (current FlowLayoutCanvas lineage)
    owns:
      - placement (flow layout tree, parent/slot/order)
      - css / responsive token refs
      - inlineText / URL link (linkHref / linkTarget)
      - props / propBindings / calculationBindings
    primary_inspector: layout / design settings (配置インスペクタ / デザインインスペクタ)
    canvas_component: frontend/components/FlowLayoutCanvas.tsx
    existing_canvas_reuse_policy:
      - reuse existing FlowLayoutCanvas / drag-drop interaction assets where compatible
      - do not replace the existing layout canvas with a separate authority
      - existing drag/drop connection edit assets are the preferred adaptation path
        before any new interaction implementation
    prohibited:
      - discarding_existing_canvas_or_drag_drop_assets_without_ssot_reason
      - replacing_existing_layout_canvas_with_new_persistence_authority
      - reviving_historical_visual_layout_canvas_restoration_as_current_blocker

  lane_storage_boundary:
    role: >-
      top_ssot_alignment surface. Formalizes the five authoring/runtime lanes this
      surface's authoring model spans, their persistence target, and their idempotency
      applicability, so no lane statement below is written as if lanes were undifferentiated.
      top SSOT (docs/framework-core.yaml topolactor_space_model / docs/framework-policy.yaml
      ui_topology_tensor_persistence, db/manifest_tables.sql) holds that manifest.topology
      is a registry-refs / package-refs / layout-refs / relay-refs / runtime-vector store,
      never a UI-entity payload store; UI package/layout/design/wiring/tensor content lives
      in topology.ui_component_package / topology.components_layout_design /
      topology.components_style_design / topology.components_package_design /
      topology.ui_wiring_registry / topology.ui_topology_tensor (db/ui_topology_tables.sql).
      This section is this surface's binding statement of that split for its own lanes.
    lanes:
      package_internal_api_wiring_lane:
        label_ja: 内部API (package/internal API wiring lane)
        authoring_surface: ManifestStep3EventWiringPreset / PackageConnectionPanel (ui_event_settings.setting_category_taxonomy.backend_side.internal_api)
        persistence_target: >-
          topology.components_package_design (manifest-facing package authority, role
          component_design_bundle_referenced_by_manifest, manifest_reference:
          manifest.topology[ui_projection].packageIds per docs/design/db-schema.yaml) +
          topology.ui_wiring_registry + topology.ui_topology_tensor relation
          (ui_topology:update_package_wiring), never manifest.topology payload directly.
          topology.ui_component_package (role component_group_bundle) is a DIFFERENT,
          narrower identity: it exists only to satisfy topology.ui_topology_tensor.package_id's
          own FK constraint, and this lane must never treat it as interchangeable with
          topology.components_package_design or as a manifest.packageIds target -- see
          docs/design/react-schema-topology-seed-translator-ssot.yaml
          storage_adoption_contract.adoption_candidate_separation_contract.package_authority_boundary,
          which states and enforces the same two-identity split for translator output.
        runtime_path: package/wiring persistence read at projection build time; not a per-event runtimeInteractions dispatch
        idempotency_applicability: known_gap
        idempotency_note: >-
          This lane is a design-time package/wiring persistence operation
          (ui_topology:update_package_wiring), not a runtime dispatch call, so it is not
          currently a runtime_dispatch_idempotency_ledger target. If a future bundle makes
          package/internal API wiring itself a retryable runtime dispatch, it must either
          convert that dispatch into a runtimeInteractions carrier (this lane's own entry
          below) or define its own stable identity carrier under a dedicated design_change
          SSOT amendment here — it must never silently inherit runtime_interactions_lane's
          idempotency_key carrier by proximity. Left as known_gap, not asserted complete.
      runtime_interactions_lane:
        label_ja: 副作用設定 / 外部API連携 / 外部インスタンス連携 (runtimeInteractions lane)
        authoring_surface: wiring_mode (WiringGraphPanel / NodeEventAuthoringPanel)
        persistence_target: topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions[]
        runtime_path: >-
          layout_patch_json.nodes[].runtimeInteractions[] -> ApplyConfirmedLayoutPatchAsync ->
          AssignRuntimeInteractionIds -> renderEmission / uiEventEffectRunner ->
          frontendScheduler payload.idempotency_key
        idempotency_applicability: always_for_dispatchExternalPort_and_dispatchInstanceOperation_actionTypes
        idempotency_note: >-
          Precise scope of retry_safe_dispatch_idempotency.gating below: this lane's
          dispatchExternalPort / dispatchInstanceOperation runtimeInteractions entries always
          compute and forward idempotency_key (lifecycle path uiEventEffectRunner.ts
          emitLifecycle; event-triggered path renderEmission.ts + runtimeComponentFactory.ts
          emitBoundEvent). localStateMutation / routeNavigation entries in this same lane are
          not backend/external dispatch and carry no idempotency_key.
      external_api_lane:
        label_ja: 外部API連携
        authoring_surface: wiring_mode setting_category external_api_integration
        persistence_target: runtime_interactions_lane carrier (dispatchExternalPort runtimeInteractions entry); registry authority in topology.external_access_ports / external_response_ports / external_hook_ports
        runtime_path: same as runtime_interactions_lane; ExternalPortDispatchRuntime.cs ExecuteAsync claims the ledger before ExecutePolicyAsync
        idempotency_applicability: always
      external_instance_lane:
        label_ja: 外部インスタンス連携
        authoring_surface: wiring_mode setting_category external_instance_integration
        persistence_target: runtime_interactions_lane carrier (dispatchInstanceOperation runtimeInteractions entry); registry authority in topology.db_instance_port / runtime_instance_port / instance_operation_authority_binding
        runtime_path: same as runtime_interactions_lane; InstancePortRuntime.cs ExecuteAsync claims the ledger before AbstractFunctionExecutor.ExecuteAsync
        idempotency_applicability: always
      local_ui_state_lane:
        label_ja: UI監視割当 / UI状態更新
        authoring_surface: wiring_mode setting_category ui_watch_binding / ui_state_update
        persistence_target: topology.ui_topology_tensor.layout_patch_json.nodes[].runtimeInteractions[] (actionType localStateMutation) for declared mutations; projection-local runtime state store (frontend/runtime/uiEventEffectRunner.ts createRuntimeLocalStateStore) for the live value at runtime -- never manifest.topology, never a separate persistence table
        runtime_path: applyGuardedLocalStateMutation via the shared guarded dispatcher; no backend/external dispatch
        idempotency_applicability: not_applicable
        idempotency_note: local state mutation never calls dispatchExternalPort/dispatchInstanceOperation, so it carries no idempotency_key by design, not by omission.
    known_gaps:
      - gap: admin_runtime_layer_action_dispatch_lane_not_yet_defined
        classification: missing_lane_ssot_gap
        status: resolved_direction_selected_generic_mechanism_implemented
        note: >-
          Confirmed via PR #597 (admin-surface-topology-seed-conversion admin-enum
          subBundle) Gate0 re-audit, 2026-07-22: none of the five lanes above, and none
          of the six setting_category_taxonomy categories below (ui_event_settings),
          was designed to carry a generic manifest-authorized admin_runtime layer:action
          dispatch (the concrete admin_runtime actions already registered and
          dispatcher-mapped in db/seed_empty.sql, e.g. enum_dictionary:*, auth_users:*,
          team_markdown:*, scheduler_jobs:*, content_bundle:*) from a seed-authored
          Action node. topology.ui_wiring_registry.wiring_schema_json (the JSON content
          column, as distinct from its wiring_kind/target_surface/target_ref flat
          columns) still has zero runtime or frontend consumers anywhere in the
          codebase -- it must not be treated as execution-wiring evidence by any future
          bundle. See docs/design/react-schema-topology-seed-translator-ssot.yaml
          wiring_lane_contract for the corresponding cross-reference.
        owner_decision_2026_07_22: >-
          No new dedicated runtime lane (extend_runtime_interactions_lane rejected: NO).
          No single-surface-specific handler (a bespoke enum-only dispatch path
          rejected: NO). Converge into an EXISTING generic substrate instead: connect
          admin_runtime layer:action dispatch through the existing generic
          component_wiring_execution_lane (extend_wiring_kind_vocabulary: YES) --
          abstract_function_substrate_bridge remains a viable backend EXECUTION-side
          option for individual admin_runtime actions (AdminRuntime.cs already
          demonstrates payload-derived abstract function execution via
          DataSqlAttentionListProjectionAsync's
          AbstractFunctionExecutionContext(requestPayload: vector.Payload,
          requiredRuntimeLane: "admin_runtime") for a read case; SchedulerExecutionContext's
          manifest-authorized-only binding does NOT apply to this admin_runtime-lane
          context type, correcting this entry's earlier note) but is independent of and
          does not replace the frontend reachability decision below -- it is a
          per-action backend implementation choice, orthogonal to how the dispatch
          reaches AdminRuntime.ExecuteDataAsync at all.
        concrete_boundary_implemented: >-
          frontend/runtime/renderEmission.ts mapWiringKindToLayer / mapWiringKindToAction
          gained a wiringKind="admin_runtime" case: layer/action are parsed from the
          wiring row's own target_ref content -- CORRECTED 2026-07-23 after a live-DB
          proof caught a real bug in the first pass: targetRef must stay a valid
          ManifestDispatcher manifest reference, "manifest:<manifestUuid>:<layer>:
          <action>" (e.g. "manifest:00000000-0000-0000-0000-0000000ae200:enum_dictionary:
          create_group"), never a bare "<layer>:<action>" string. The same targetRef
          value is forwarded verbatim as the dispatch request's own payload.target_ref
          (enqueueRuntimeComponentCommand), which ManifestDispatcher.
          TryParseManifestTargetRef (backend/runtime/ManifestDispatcher.cs) parses with
          Split(':', 3) -- only the first two segments (the "manifest:" prefix and this
          manifest's own UUID) are validated/consumed for MANIFEST resolution; the third
          segment is free-text there and is what parseAdminRuntimeLayerAction reads as
          "<layer>:<action>". A bare "<layer>:<action>" targetRef (the first pass's
          shape) fails TARGET_REF_INVALID server-side before ever reaching
          AdminRuntime.ExecuteDataAsync -- every unit test written before the live-DB
          proof passed anyway, because they only asserted the OUTGOING request shape,
          never a real round trip through ManifestDispatcher. This is now corrected and
          live-DB proven (see read_circuit_consumed_and_proven below); the fix is
          reusable by any admin_runtime action across any subBundle, no per-operation
          case added (parseAdminRuntimeLayerAction still contains zero surface-specific
          logic). Layer/action are two axes independent of manifest resolution:
          request.Layer/request.Action are separate top-level EndpointRequestDto fields
          AdminRuntime.ExecuteDataAsync's layerAction switch reads directly, never
          re-derived from target_ref. frontend/runtime/frontendScheduler.ts
          RuntimeDispatchSpec gained an optional payload field, forwarded verbatim by
          enqueueRuntimeComponentCommand. frontend/runtime/runtimeComponentFactory.ts
          emitBoundEvent's Lane 2 (component_wiring_execution_lane branch) now merges
          the event-time payload (the same argument other lanes' payload/log merge
          already uses -- e.g. a single triggering control's own event value) into the
          dispatch, giving admin_runtime dispatch a real payload carrier without a new
          payloadFrom concept -- see remaining_write_payload_capture_gap below for the
          real limit of what this carries. idempotency_applicability for this new case
          is not_applicable, same reasoning as local_ui_state_lane: this is a
          synchronous admin CRUD action carrying no dispatchExternalPort/
          dispatchInstanceOperation identity, not a retryable external/instance
          operation -- if a future bundle needs retry-safe admin_runtime dispatch
          idempotency, that is a separate, not-yet-defined extension, not silently
          inherited from runtime_interactions_lane. Proof:
          frontend/tests/adminWiringExecutionLane.test.ts (mapWiringKindToLayer/
          mapWiringKindToAction admin_runtime cases including manifest-prefixed and
          bare-string fail-close cases, buildRuntimeDispatchSpec generic reuse across
          two different admin_runtime actions/manifests, and an end-to-end emitBoundEvent
          test asserting the captured api_command_lane request body carries
          target/layer/action/payload correctly) plus, since the earlier bug could only
          be caught by a real round trip, backend/tests/Topolactor.Integration.Tests/
          AdminEnumHubRelationUiProjectionLiveDbTests.cs
          DispatchAsync_AdminEnumManagementManifest_DispatchesRealListGroups_
          EmissionDataAndTablePropsCarryRealRows (see read_circuit_consumed_and_proven).
          No backend change to the dispatch transport itself was required: ManifestDispatcher /
          AdminRuntimeDispatchAdapter / AdminRuntime.ExecuteDataAsync were already fully
          generic on target/layer/action (confirmed by the pre-existing
          callAdminMasterOp precedent using the same queueAdminClientCommand transport);
          backend/repository/NpgsqlTopologyRepository.cs MapWiringKindToDispatchAction
          was intentionally left unchanged since its own output (RuntimeDispatchAction)
          has no frontend consumer anywhere (verified by grep) and is unrelated to this
          mechanism's actual dispatch path. A genuinely NEW backend addition was needed
          for real render proof, unrelated to dispatch routing itself: see
          read_circuit_consumed_and_proven's LayoutSchemaTensorComposer note.
        read_circuit_consumed_and_proven: >-
          2026-07-23, second consumption pass. admin-enum's manifest
          (00000000-0000-0000-0000-0000000ae200) now dispatches the real, existing
          enum_dictionary:list_groups admin_runtime action for its whole read/search/
          filter screen (wiring_kind=admin_runtime, target_surface=manifest -- "admin"
          is rejected by topology.ui_wiring_registry's own
          ck_ui_wiring_registry_target_surface CHECK constraint, target_surface must be
          one of route/ui/manifest/external_port). This is safe under the
          layout=one-canonical-operation model: read/search/filter genuinely are one
          operation for this screen, so every node's click/change/select/submit/toggle
          trigger safely inheriting the same list_groups dispatch is correct, not a
          granularity violation (idempotent no-payload re-list on every keystroke is
          wasteful, not incorrect -- see remaining_write_payload_capture_gap for why a
          real server-side search/filter parameter is a separate, not-yet-solved
          problem). A second, real backend addition was needed to make this render, not
          only dispatch: backend/repository/LayoutSchemaTensorComposer.cs previously
          merged ONLY RuntimeInteractions from a tensor node onto a schema-composed
          catalog_component leaf by exact NodeId match -- PropsJson/StateJson/
          PropBindingsJson on that SAME tensor node were silently discarded for this
          layout shape (Compose() never read them). BuildNodeLocalDataByNodeId +
          Compose's new optional nodeLocalDataByNodeId parameter close this: additive,
          opt-in per exact NodeId match, zero behavior change for any existing
          schema-composed layout that does not author matching tensor node entries
          (Runtime.Tests: ComposeLayoutSchemaWithTensor_NoNodeLocalDataMapProvided_
          ComposesAsBeforeThisFeature). This is what lets enum_table's static columns
          (propsJson, including "table":null to escape data_display/table's inert
          preview-placeholder default -- frontend/runtime/runtimeComponentFactory.ts
          tableFactory falls back to top-level props only when props.table is not a
          non-null object) and emission.data-bound rows (propBindings, validated
          against backend/runtime/StructureMapResolver.cs
          ComponentArrayPropCapabilities["data_display/table"]) actually reach the
          frontend. Live-DB proof: AdminEnumHubRelationUiProjectionLiveDbTests.cs
          DispatchAsync_AdminEnumManagementManifest_DispatchesRealListGroups_
          EmissionDataAndTablePropsCarryRealRows -- dispatches with Layer="enum_dictionary"
          Action="list_groups" (top-level EndpointRequestDto fields, NOT derived from
          target_ref) plus payload.target_ref="manifest:<ae200 uuid>:enum_dictionary:
          list_groups" (manifest resolution only), asserts emission.Data contains the
          real db/enum_seed.sql "demo_status" group, and asserts enum_table's composed
          PropsJson/PropBindings carry the real columns/rows binding shape.
        remaining_write_payload_capture_gap: >-
          2026-07-23, replaces the prior (2026-07-22) remaining_granularity_constraint
          entry -- that framing was wrong: per-layout scope alone was never the real
          blocker for admin-enum's write side (a single-purpose write layout, exactly
          like the read layout above, is a safe and sufficient composition -- no
          per-node extension needed). The REAL, deeper blocker, found while attempting
          to actually wire a write operation for live-DB proof: no production-proven
          mechanism exists to get a free-typed field value (e.g. a new group's name) or
          an extracted event path into ANY dispatch payload today, admin_runtime or
          otherwise. Two independent, confirmed causes: (1)
          frontend/runtime/uiEventEffectRunner.ts UI_STATE_UPDATE_OPEN_ACTIONS maps
          EVERY ui_state_update actionType -- including localStateMutation -- to a
          fixed boolean (true/false/toggle) by design (see its own inline comment: "a
          localStateMutation trigger writes true to its ui-local: target -- a flag
          write ... never a business-data value the seed record does not carry"); there
          is no seed-authorable actionType that writes an event-derived typed value
          into ui-local state at all. (2)
          frontend/runtime/payloadFromResolver.ts's node:<nodeId>.value resolution
          (used by dispatchExternalPort/dispatchInstanceOperation, e.g. the existing
          credential-management cd004 wiring's own node: payloadFrom entries) depends
          on payloadFromNodeValues, a renderEmission() options field
          frontend/islands/ProjectionShell.tsx -- the actual production projection
          renderer -- never populates (grep-confirmed zero references in that file);
          only UI-Builder canvas authoring (NodeEventAuthoringPanel.tsx/
          UiBuilderAdmin.tsx) populates it. This means node:<id>.value payloadFrom
          references are UNPROVEN in production for ANY surface today, not an
          admin-enum-specific gap -- fixing it (making ProjectionShell track/forward
          live input values, then giving Lane 2 its own payloadFrom resolution against
          that map, mirroring dispatchExternalPort/dispatchInstanceOperation's existing
          pattern) is a real, bounded, but separate, cross-cutting prerequisite, not
          attempted in this pass given its blast radius (a shared, live production
          component) and the amount of independent verification it deserves on its own.
          What a SINGLE trigering event's OWN native payload already carries (e.g. a
          table row-click event's own `{row: {...}}`, whose fields the caller can
          choose to spread if they match the target action's DTO field names) remains
          usable without this fix -- delete-shaped actions taking exactly the row's own
          id field(s) (enum_dictionary:delete_item/delete_group) are the closest
          candidates for the next real write-side proof, not create/update (which need
          genuinely new typed input, not an existing row's own value).
        write_payload_capture_mechanism_implemented: >-
          2026-07-24. Both cross-cutting prerequisites named above are implemented and
          tested; this gap's own diagnosis text above is kept as history and superseded
          by this entry, not rewritten. (1)
          frontend/runtime/liveNodeValueTracker.ts createLiveNodeValueTracker() is a new,
          surface-independent, stable-node-identity register/update/deregister store
          (set/snapshot/reconcile). frontend/islands/ProjectionShell.tsx now owns one
          instance per mount (a ref, never re-created across rerenders/SSE refresh) and
          passes it into every renderEmission() call as
          payloadFromNodeValues:tracker.snapshot() (same object reference every call, so
          a runtimeSpec closure captured at an earlier render still observes later
          writes) and onNodeValueChange:tracker.set. reconcile() runs on initial mount
          and on every SSE refresh against the CURRENT layoutNodes list, so a
          removed/replaced node's stale tracked value cannot leak into a later dispatch
          -- this closes the negative cases stale_node_value / node_reconciliation.
          renderEmission.ts wires onNodeValueChange into a per-node closure on
          ComponentDataHub/RuntimeComponentSpec (mirrors the existing
          payloadFromNodeValues plumbing exactly).
          runtime/runtimeComponentFactory.ts emitBoundEvent gained a node-value-tracking
          lane (fires on change/input/select when payload carries "value", BEFORE the
          previewMode gate, same event-time-extraction pattern as the pre-existing
          calcTriggerCallback lane) -- this is the write side of payloadFromNodeValues,
          proven in production for the first time (frontend/tests/
          liveNodeValueTrackerAndAdminRuntimePayloadFrom.test.ts). (2) Lane 2
          (component_wiring_execution_lane, admin_runtime) reuses the SAME
          resolvePayloadFrom() single resolution authority
          (frontend/runtime/payloadFromResolver.ts) dispatchExternalPort/
          dispatchInstanceOperation already use -- no new resolver, no surface-specific
          payload builder. frontend/runtime/frontendScheduler.ts RuntimeDispatchSpec
          gained an optional payloadFrom field; renderEmission.ts's new
          buildAdminRuntimePayloadFromByTrigger() reads it from a node's OWN
          runtimeInteractions[] entries carrying the new, generic (non-surface-specific,
          reusable by any admin_runtime layer:action) actionType
          "bindRuntimeDispatchPayload" -- deliberately outside the closed
          WIRING_SETTING_CATEGORIES taxonomy (uiBuilderWiringProjection.ts), since that
          taxonomy governs UI-Builder canvas-authoring policy checks, not this
          seed-authored runtime dispatch path; an unrecognized actionType there is
          silently skipped by the existing category builders and never trips
          RUNTIME_INTERACTION_UNATTRIBUTABLE (which only fires when the overall
          eventBinding ends up empty -- an admin_runtime node's wiringKind-derived base
          binding already prevents that). Priority/conflict rule (the canonical contract
          per this gap's own remaining_granularity_constraint discussion above): when a
          payloadFrom map is authored for a trigger, RESOLVING it is the SOLE payload
          authority for that dispatch -- unresolved node value / malformed event path is
          a hard fail-close (PAYLOAD_FROM_NODE_NOT_FOUND / PAYLOAD_FROM_EVENT_PATH_NOT_FOUND
          / PAYLOAD_FROM_UNRESOLVED_REF, never a silent empty/false/null degrade); when no
          payloadFrom is authored for a trigger, the pre-existing PR597 raw event-time
          payload passthrough is unchanged (regression-proven). Live-DB proof (real
          PostgreSQL, not an in-memory echo): backend/tests/Topolactor.Integration.Tests/
          AdminEnumHubRelationUiProjectionLiveDbTests.cs
          DispatchAsync_AdminEnumManagementManifest_CreateGroupThenDeleteGroup_
          PersistsAndReListReflectsDiff dispatches enum_dictionary:create_group then
          enum_dictionary:delete_group directly against the SAME dispatcher chain the
          frontend mechanism above drives, asserts the write persists AND that a
          subsequent enum_dictionary:list_groups re-dispatch reflects the diff (create
          appears, delete is gone -- the write/reread/evidence boundary), and asserts two
          negative cases fail close (malformed groupId, nonexistent groupId) without
          corrupting the row created earlier in the same test. This resolves
          admin-runtime-operation-dispatch-lane-determination's third acceptance
          condition (admin-enum/team-dashboard/scheduler-settings write-dispatch CAN now
          proceed under the single component_wiring_execution_lane contract) -- it does
          NOT itself ship admin-enum's/team-dashboard's/scheduler-settings' own
          production write UI (buttons, forms, seed wiring rows beyond this proof); that
          remains admin-surface-topology-seed-conversion's own subBundle scope, now
          unblocked rather than completed by this entry.
        affected_subbundles: [admin-enum, team-dashboard, scheduler-settings]
        follow_up_ref: .agent/tasks/todo.md admin-runtime-operation-dispatch-lane-determination Bundle
        admin_enum_write_side_consumption: >-
          2026-07-27 (admin-surface-topology-seed-conversion admin-enum subBundle, PR #600 review
          round 2 correction). All 7 enum_dictionary write actions now consume this mechanism via
          dedicated single-purpose write manifests (db/seed_empty.sql
          00000000-0000-0000-0000-0000000ae210/ae220/ae230/ae240/ae250/ae260/ae270), exactly the
          "single-purpose write layout" resolution already recorded above -- no per-node
          wiringKind/target_ref extension was added; each write manifest reuses ae200's own
          proven per-wiring-row admin_runtime binding, just scoped to its own manifest instead of
          ae200's. Each has its own hub (not shared -- see remaining_write_payload_capture_gap's
          own text above; hubs.topology_manifests.LoadHubNavigationSequenceAsync only resolves a
          target manifest when exactly one ACTIVE manifest exists per hub_id). Backend gained the
          matching payload.dryRun/payload.confirmed contract
          (backend/runtime/AdminRuntimeMasterRoster.cs, mirrors team_markdown:saved_view:update).
          Proof: backend/tests/Topolactor.Integration.Tests/
          AdminEnumHubRelationUiProjectionLiveDbTests.cs. See
          docs/design/react-schema-topology-seed-translator-ssot.yaml
          declared_seed_surface_catalog admin.enum.management.projection known_gaps
          resolution_note for the full record, including the honestly-open remaining item
          (hardcoded /admin/enums retirement still pending a genuine UX-parity replacement).
    admin_runtime_payload_binding_contract:
      role: >-
        2026-07-24, formalizes a canonical, validated payload-binding extension of
        component_wiring_execution_lane's admin_runtime case. 2026-07-25 (PR #599
        review round 6, current shape) separates action AUTHORITY from effect DATA:
        this binding carries no action authority of its own, so it is NOT authored as
        a runtimeInteractions[]/actionType entry at all (the round 1-5 shape, which used
        the actionType string "bindRuntimeDispatchPayload" and progressively tried to
        reconcile it with the closed actionType vocabulary, is retired -- see
        superseded_history below). It is a dedicated per-node field --
        dispatchPayloadFromByTrigger -- independent of runtimeInteractions entirely.
      authority: >-
        Frontend build-time authoring only (frontend/runtime/renderEmission.ts
        buildAdminRuntimePayloadFromByTrigger). Never a backend authority, never a
        second target/layer/action resolution path -- it only supplies DATA (the
        payload) for the target/layer/action the SAME node's wiringKind="admin_runtime"
        + targetRef already resolve (parseAdminRuntimeLayerAction). Backend-side, the
        SAME field is validated at the layout_patch persistence boundary
        (NpgsqlUiTopologyRepository.cs ValidateDispatchPayloadFromByTrigger) and threaded
        node-locally through LayoutNodeRecord/LayoutSchemaTensorComposer.NodeLocalData/
        StructureMapResolver.ToLayoutNode/Contracts.cs LayoutNode -- the SAME per-node
        plumbing propsJson/stateJson/propBindings already use -- so it reaches the
        production Emission response, not only test fixtures.
      applicability: >-
        Any wiring_kind="admin_runtime" node, any layer:action (enum_dictionary:*,
        auth_users:*, team_markdown:*, scheduler_jobs:*, ...) -- reuses the SAME field,
        no per-operation/per-subBundle case.
      authored_surface: >-
        A per-node topology.ui_topology_tensor.layout_patch_json.nodes[].dispatchPayloadFromByTrigger
        field -- { trigger: { field: source } } -- the SAME per-node authoring column
        family propsJson/stateJson/propBindings/runtimeInteractions already use, but its
        OWN top-level key, structurally separate from runtimeInteractions -- never
        topology.ui_wiring_registry.wiring_schema_json (that column remains a
        zero-consumer surface per this file's known_gaps note above; this contract does
        not adopt it).
      required_fields:
        trigger: >-
          2026-07-25 correction (PR #599 review round 7 -- corrects the round-6 text below,
          which described this restriction without the implementation actually enforcing
          it). A dispatchPayloadFromByTrigger object key is validated in two stages, not
          one: (1) the SAME global normalizeAuthoredEventType() every runtimeInteractions
          entry uses -- an 8-canonical-trigger alias map (click/change/input/submit/
          toggle/focus/blur/select) shared unmodified with every other consumer of that
          normalizer, never narrowed; a key this stage does not recognize at all fails the
          WHOLE node closed (RUNTIME_INTERACTION_TRIGGER_REQUIRED); then (2) membership in
          COMPONENT_WIRING_EXECUTION_LANE_TRIGGERS (frontend/runtime/renderEmission.ts) --
          the exact 5-trigger subset (click/change/select/submit/toggle)
          buildCatalogComponentEventBinding actually creates an eventBinding entry for, the
          SAME single authority both that function and this validation share. A trigger
          stage (1) recognizes but stage (2) does not contain -- input/focus/blur, valid
          triggers for OTHER lanes but never bound by this one -- fails the WHOLE node
          closed too (RUNTIME_INTERACTION_TRIGGER_UNSUPPORTED), never silently validated
          into a payloadFrom map with nothing to attach to (the round-6 gap: the
          implementation validated only via stage (1), so a normalizer-recognized but
          lane-unsupported trigger passed validation and then silently produced no
          binding). Two raw keys normalizing (stage 1) to the SAME canonical trigger (e.g.
          "click" and "onClick") fail the WHOLE node closed too
          (RUNTIME_INTERACTION_TRIGGER_CONFLICT_AFTER_NORMALIZATION), never silently
          letting the later key win. 2026-07-25 addition (PR #599 review round 8): stage
          (1) trims the raw key before alias lookup (normalizeAuthoredEventType's own
          value.trim()) -- so " click " and "click" are the SAME canonical trigger, and a
          whitespace-only key trims to "" (not in the alias map) and fails
          RUNTIME_INTERACTION_TRIGGER_REQUIRED, the same code an absent/unrecognized key
          produces. The backend persistence boundary (NpgsqlUiTopologyRepository.cs
          ValidateDispatchPayloadFromByTrigger) mirrors this trim-then-lookup order exactly
          (round 7 introduced the mirrored alias map but validated the untrimmed raw key,
          so a whitespace-padded key was accepted by the frontend build boundary but
          rejected by backend persistence -- round 8 closes that gap).
        payloadFrom: >-
          Each trigger's value: an object whose entries are string sources recognized by
          payloadFromResolver.ts's existing grammar (node:<nodeId>.value | event.<path> |
          literal:<value>) -- the SAME grammar/resolver dispatchExternalPort/
          dispatchInstanceOperation already use; this contract adds no new source syntax.
          A non-object per-trigger value (RUNTIME_INTERACTION_PAYLOAD_FROM_MUST_BE_OBJECT),
          an empty per-trigger object ({}, RUNTIME_INTERACTION_PAYLOAD_FROM_EMPTY), or a
          non-string field value (RUNTIME_INTERACTION_PAYLOAD_FROM_VALUE_MUST_BE_STRING)
          fails the whole node closed -- the SAME error-code vocabulary (and, backend-side,
          the SAME ValidatePayloadFromShape helper, called with rejectEmpty:true only for
          this field) dispatchExternalPort/dispatchInstanceOperation's own payloadFrom
          validation uses, not an admin-specific vocabulary. 2026-07-25 correction (PR #599
          review round 8, supersedes the round-7 empty-object leniency claim immediately
          below, kept for history): an empty per-trigger object was previously described as
          "intentionally NOT rejected, matching [dispatchExternalPort/dispatchInstanceOperation's]
          own leniency for the identical shape" -- accurate for those two actionTypes'
          persistence-time check, but this field's OWN dispatch-time boundary
          (runtimeComponentFactory.ts parseEventBinding's runtimeDispatch.payloadFrom
          branch) already rejected {} before round 8, so build time and persistence time
          silently accepting what dispatch time would later reject was a genuine
          three-boundary mismatch for this field specifically -- not a deliberate leniency
          match. All three boundaries (build/persistence/dispatch) now reject {} for
          dispatchPayloadFromByTrigger; dispatchExternalPort/dispatchInstanceOperation's own
          payloadFrom keeps its separate, unchanged leniency (its own dispatch-time boundary
          tolerates {} too, so there is no mismatch to fix there, and it is out of this
          Bundle's scope regardless). 2026-07-25 correction (PR #599 review round 7): round 6
          claimed the round 1-5 duplicate_field_conflict case became "structurally
          impossible" because this is a single object keyed by trigger, not an array of
          independently-authored entries -- true only for identical RAW keys (an object
          cannot repeat a literal key), false once alias normalization is considered:
          distinct raw keys (e.g. "click" and "onClick", or "click" and " click " after
          round 8's trim fix) can still normalize to the SAME canonical trigger. See the
          trigger field above -- this collision is validated and fails closed
          (RUNTIME_INTERACTION_TRIGGER_CONFLICT_AFTER_NORMALIZATION), it is not structurally
          impossible.
      target_ref_shape: >-
        Unchanged from parseAdminRuntimeLayerAction's existing contract --
        "manifest:<manifestUuid>:<layer>:<action>". This binding contract adds no new
        target_ref grammar; targetRef stays exclusively the node's own
        wiringKind="admin_runtime" column, never re-derived from dispatchPayloadFromByTrigger.
      allowed_payload_sources: >-
        Exactly payloadFromResolver.ts's three source kinds (node_value / event_path /
        literal). No new source kind is introduced by this contract -- doing so would
        require its own SSOT amendment and resolver change, out of this contract's scope.
      validation_and_fail_close: >-
        renderEmission.ts buildAdminRuntimePayloadFromByTrigger returns a result type
        (never a bare map): any invalid trigger key, non-object per-trigger value, or
        non-string field value fails the WHOLE node's render closed as an explicit error
        ComponentSpec, mirroring the existing CATALOG_COMPONENT_KIND_REQUIRED-class
        fail-close pattern this file already uses elsewhere in renderEmission.ts. The SAME
        shape is independently validated at the backend persistence boundary
        (NpgsqlUiTopologyRepository.cs ValidateDispatchPayloadFromByTrigger, called
        alongside ValidateRuntimeInteractions from the SAME layout_patch validation path) --
        two independent fail-close boundaries, not one relying on the other. At dispatch
        time (runtimeComponentFactory.ts emitBoundEvent), a payloadFrom map (once
        validated at build time) is resolved via the SAME resolvePayloadFrom() single
        authority dispatchExternalPort/dispatchInstanceOperation use --
        PAYLOAD_FROM_NODE_NOT_FOUND / PAYLOAD_FROM_EVENT_PATH_NOT_FOUND /
        PAYLOAD_FROM_UNRESOLVED_REF fail close and never enqueue a dispatch; no unresolved
        value is ever silently degraded to empty string, null, or false.
      priority_conflict_rule: >-
        When a payloadFrom map is authored for a trigger, the RESOLVED payload is the
        sole payload authority for that dispatch (mirrors dispatchExternalPort/
        dispatchInstanceOperation's own contract exactly -- resolved.payload replaces,
        never merges with, any other payload source). When no payloadFrom is authored
        for a trigger, the pre-existing (PR #597) raw event-time payload passthrough
        (static config payload + Lane 1's merged event payload) is unchanged.
      own_property_identity: >-
        Both the live node value store (frontend/runtime/liveNodeValueTracker.ts,
        Object.create(null) backing) and payloadFromResolver.ts's node_value/event_path
        existence checks (Object.prototype.hasOwnProperty.call, never the `in` operator
        or bracket-index truthiness) treat a nodeId/event-path segment that collides with
        an inherited Object.prototype key (constructor, toString, hasOwnProperty, ...) as
        genuinely missing, never as an inherited function value.
      action_authority_vs_effect_data_separation: >-
        2026-07-25 (PR #599 review round 6). actionType (on runtimeInteractions[]
        entries) is action AUTHORITY -- a closed vocabulary matched by exact identity
        only (wiringSettingCategoryOf: dispatchExternalPort / dispatchInstanceOperation /
        the fixed UI_STATE_UPDATE_ACTIONS set); payloadFrom/outputProp are effect DATA
        and must never promote an unrecognized actionType past ACTION_OUTSIDE_VOCABULARY.
        Round 5 (superseded, see superseded_history) added a field-presence fallback
        that classified ANY actionType carrying payloadFrom/outputProp as
        side_effect_setting -- reviewed as conflating the two concepts (effect fields
        used as an authority substitute). Retired by removing this binding from
        runtimeInteractions entirely: dispatchPayloadFromByTrigger is a node-level field
        with no actionType at all, so the question "does an unrecognized actionType with
        payloadFrom pass policy" no longer arises for this contract.
        ui_event_settings.setting_category_taxonomy.frontend_side.side_effect_setting
        remains a declared-but-orphaned taxonomy category (no actionType membership
        defined in this codebase yet) rather than being back-filled by a
        field-presence rule.
      superseded_history: >-
        Rounds 1-5 (2026-07-24 -- 2026-07-25) used a runtimeInteractions[] entry with
        actionType "bindRuntimeDispatchPayload" for this binding, then progressively
        tried to reconcile that actionType with findRuntimeInteractionPolicyErrors'
        closed-vocabulary fail-close: round 3 added a dedicated
        ADMIN_RUNTIME_PAYLOAD_BINDING_ACTION_TYPE constant + isAdminRuntimePayloadBindingAction()
        special-case skip; round 5 replaced that with a wiringSettingCategoryOf
        field-presence fallback (side_effect_setting for any actionType carrying
        payloadFrom/outputProp). Round 6 (PR #599 review) identified BOTH as
        unnecessary implementation-derived special-casing of a concern that was never
        really an "action" to begin with, and retired the runtimeInteractions-based
        shape for the node-level dispatchPayloadFromByTrigger field described above --
        removing ADMIN_RUNTIME_PAYLOAD_BINDING_ACTION_TYPE / isAdminRuntimePayloadBindingAction
        and the wiringSettingCategoryOf fallback entirely, and with them the
        ADMIN_RUNTIME_PAYLOAD_FROM_* error-code family (replaced by the SAME generic
        RUNTIME_INTERACTION_PAYLOAD_FROM_*/RUNTIME_INTERACTION_TRIGGER_REQUIRED codes
        dispatchExternalPort/dispatchInstanceOperation's own payloadFrom validation
        already used). Kept for history only -- not current behavior; see
        action_authority_vs_effect_data_separation and required_fields above for the
        current contract.
      trigger_authority_unification: >-
        2026-07-25 (PR #599 review round 7). Round 6 introduced dispatchPayloadFromByTrigger
        with a trigger-key check that only called normalizeAuthoredEventType() (the SAME
        global 8-canonical-trigger alias normalizer every runtimeInteractions entry uses)
        -- but frontend/runtime/renderEmission.ts buildCatalogComponentEventBinding, the
        function that actually consumes a validated payloadFrom map to build an
        eventBinding, only ever creates bindings for 5 of those 8 triggers
        (click/change/select/submit/toggle), as a SEPARATE literal array embedded directly
        in that function. Two gaps followed from this duplication: (1) "input"/"focus"/
        "blur" -- valid triggers globally, never bound by this lane -- passed
        buildAdminRuntimePayloadFromByTrigger's validation and then silently produced no
        binding to attach to; (2) that validation wrote byTrigger[trigger] = payloadFrom
        with a plain assignment, so two raw keys normalizing to the SAME canonical trigger
        (e.g. "click" and "onClick") silently let the later one win instead of failing
        closed. Fixed by extracting the single 5-trigger set into one shared constant
        (COMPONENT_WIRING_EXECUTION_LANE_TRIGGERS, frontend/runtime/renderEmission.ts) used
        by BOTH buildCatalogComponentEventBinding and
        buildAdminRuntimePayloadFromByTrigger's trigger validation, adding an explicit
        membership check after normalization (RUNTIME_INTERACTION_TRIGGER_UNSUPPORTED for a
        normalizer-recognized-but-lane-unsupported trigger) and an own-property collision
        check before writing to the result map (RUNTIME_INTERACTION_TRIGGER_CONFLICT_AFTER_NORMALIZATION
        for two raw keys colliding after normalization). The backend persistence boundary
        (NpgsqlUiTopologyRepository.cs ValidateDispatchPayloadFromByTrigger) gained its own
        mirrored alias map (AuthoredEventTypeAliasMap) and the SAME two checks -- no shared
        code with the frontend (different language), but the same accept/reject decision
        for the same input. normalizeAuthoredEventType() itself, and every OTHER
        runtimeInteractions consumer of it (setState/openModal/etc. triggers, which
        legitimately use input/focus/blur), are unchanged -- this correction narrows only
        dispatchPayloadFromByTrigger's own additional membership check, never the shared
        global normalizer.
      trim_and_empty_boundary_unification: >-
        2026-07-25 (PR #599 review round 8). A further audit of round 7's fix found two
        remaining boundary mismatches, both now closed:
        (1) frontend normalizeAuthoredEventType() trims the raw trigger key before alias
        lookup (value.trim()), but backend ValidateDispatchPayloadFromByTrigger's
        AuthoredEventTypeAliasMap.TryGetValue call used the untrimmed JSON property name
        directly -- so a whitespace-padded raw key (e.g. " click ") was accepted at the
        frontend build boundary but rejected as unrecognized at backend persistence.
        Fixed by trimming the raw key before the backend lookup too (see required_fields.
        trigger above); collision detection (RUNTIME_INTERACTION_TRIGGER_CONFLICT_AFTER_NORMALIZATION)
        now operates on the post-trim canonical trigger on both boundaries, so "click" and
        " click " collide identically to "click" and "onClick".
        (2) dispatchPayloadFromByTrigger.<trigger>'s empty payloadFrom ({}) passed both the
        frontend build boundary and the backend persistence boundary, but the SAME field's
        dispatch-time parse boundary (runtimeComponentFactory.ts parseEventBinding's
        runtimeDispatch.payloadFrom branch) already rejected {} -- a genuine three-boundary
        mismatch (see required_fields.payloadFrom above for the full correction). Fixed by
        adding an explicit empty check (RUNTIME_INTERACTION_PAYLOAD_FROM_EMPTY) to both the
        frontend build boundary and, via an opt-in rejectEmpty parameter on the SHARED
        backend ValidatePayloadFromShape helper (default false, so the existing
        dispatchExternalPort/dispatchInstanceOperation callers keep their own unchanged,
        separately-scoped leniency for {} -- that pairing's own dispatch-time boundary
        tolerates {} too, so there is no mismatch to fix there and doing so would be
        out-of-Bundle scope creep), the backend persistence boundary.
        Also corrected in this round: the backend AuthoredEventTypeAliasMap comment and
        this file's earlier text both said "16 keys" for the alias map; the actual count
        (onClick/click, onChange/change, onInput/input, onSubmit/submit, onOpen/onClose/
        toggle, onFocus/focus, onBlur/blur, onSelect/select) is 17.
      runtime_parse_boundary_fail_close: >-
        2026-07-24 (PR #599 review round 3), still current in round 6's shape.
        buildAdminRuntimePayloadFromByTrigger's build-time validation is a SEPARATE
        boundary from runtimeComponentFactory.ts parseEventBinding(), which re-parses
        the untyped JSON eventBinding[trigger] carried on RuntimeComponentSpec at
        DISPATCH time -- a boundary that could in principle be reached by any
        construction path, not only that builder. parseEventBinding's own payloadFrom
        handling mirrors externalPortDispatch's own pre-existing contract exactly: a
        present-but-malformed payloadFrom (non-object, empty object, or any non-string
        value) fails the WHOLE binding closed (parseEventBinding returns null,
        RUNTIME_PRIMITIVE_RENDERER_INVALID_EVENT_BINDING at dispatch time) -- never a
        silently filtered subset. This boundary is unaffected by round 6's move from
        runtimeInteractions to a node-level field, since it operates on the ALREADY-BUILT
        eventBinding[trigger].runtimeDispatch.payloadFrom RuntimeDispatchSpec shape either
        way.
      display_value_vs_dispatch_value_authority: >-
        2026-07-24 (PR #599 review round 4). The production-mount SSE-refresh scenario
        proof (round 3) surfaced a real divergence, since retracted-as-out-of-scope and
        corrected here: renderEmission() rebuilds every catalog_component leaf's default
        props from scratch on each render (buildDefaultCatalogComponentProps), so a
        surviving controlled <input>'s DISPLAYED value reset to its emission-derived
        default on an SSE-refresh-driven rerender while a LATER dispatch would still
        silently resolve and send the live node value tracker's pre-refresh typed value
        -- sending a value the user could no longer see on screen. Introducing dispatch
        reachability for tracked values (this Bundle's whole purpose) is what turned a
        previously-inert display quirk into a real "invisible stale value sent" risk, so
        it is this Bundle's own scope, not a separate concern. Resolved by promoting the
        SAME live node value tracker to the canonical DISPLAY authority too, via
        renderEmission.ts's new applyLiveNodeValueOverride: when the tracker holds an
        entry for a node's exact nodeId (own-property identity, matching the read-side
        contract above) AND that node's already-built default props carry a `data.value`
        key, the tracked value overrides the emission-derived default -- untouched nodes
        (no tracker entry) and value-less component kinds (e.g. action/button,
        form_input/form_field -- no `data.value` key to begin with) are both entirely
        unaffected, so this is surface/operation/component-kind-independent, not an
        admin-enum-specific or per-node patch. Applied BEFORE propBindings resolution, so
        a node whose value is ALSO server-data-bound via propBindings still lets that
        fresher, live server data win over a stale local edit once the projection
        actually carries one -- the tracker is display authority only in the absence of a
        stronger, live data-bound source, never a fallback that shadows one. A node with
        no tracked entry and no propBinding falls through to the pre-existing
        emission-derived default unchanged (no regression for the common case). Removed
        nodes (SSE-refresh reconciliation) are not rendered at all, so there is no display
        to diverge from -- resolvePayloadFrom's existing PAYLOAD_FROM_NODE_NOT_FOUND
        fail-close (not a display-side concern) covers a later dispatch attempt against
        them.
      proof: >-
        2026-07-25 (round 6): dedicated-file assertions were migrated by responsibility
        into their owning existing test files, per PR #599 review round 6 (professional
        precedent: extend existing test surfaces over standalone dedicated files).
        frontend/tests/payloadFromResolver.test.ts (own-property identity for both the
        node value store and event-path traversal), frontend/tests/
        runtimeComponentFactory.test.ts (onNodeValueChange node-value-tracking lane;
        admin_runtime Lane 2 payloadFrom resolution success/fail-close cases; the
        parseEventBinding dispatch-time parse-boundary fail-close cases independent of
        build-time validation), frontend/tests/renderEmissionPropBindings.test.ts
        (onNodeValueChange option wiring; applyLiveNodeValueOverride's display-authority
        cases -- overrides only when a tracked entry exists for the exact nodeId, never
        invents a `data.value` field for a component kind that has none, and
        own-property-identity-safe against an Object.prototype-shaped nodeId;
        buildCatalogComponentEventBinding trigger-scoping; dispatchPayloadFromByTrigger
        build-time fail-close cases -- invalid trigger key, non-object per-trigger value,
        non-string field value; 2026-07-25 round 7 additions: each of the 5 canonical
        triggers attaches payloadFrom to its own binding, an alias key (onClick) normalizes
        onto its canonical binding, a normalizer-recognized-but-lane-unsupported trigger
        (input/onInput/focus/blur) fails RUNTIME_INTERACTION_TRIGGER_UNSUPPORTED, and each
        alias-collision pair (click+onClick, change+onChange, submit+onSubmit,
        select+onSelect, toggle+onOpen, toggle+onClose, onOpen+onClose) fails
        RUNTIME_INTERACTION_TRIGGER_CONFLICT_AFTER_NORMALIZATION rather than letting either
        key silently win; 2026-07-25 round 8 additions: whitespace-padded canonical/alias
        keys (" click ", " onClick ") trim and normalize correctly, a whitespace-only key
        fails RUNTIME_INTERACTION_TRIGGER_REQUIRED, a canonical/whitespace-padded pair
        ("click"+" click ", "onClick"+" onClick ") fails
        RUNTIME_INTERACTION_TRIGGER_CONFLICT_AFTER_NORMALIZATION, and an empty per-trigger
        payloadFrom ({}) fails RUNTIME_INTERACTION_PAYLOAD_FROM_EMPTY), frontend/tests/
        uiEventEffectRunner.test.ts
        (createLiveNodeValueTracker register/update/reconcile/own-property-identity),
        frontend/tests/uiBuilderWiringProjection.test.ts (action_authority_vs_effect_data_separation:
        an unknown actionType carrying payloadFrom/outputProp still fails
        ACTION_OUTSIDE_VOCABULARY), backend/tests/Topolactor.Runtime.Tests/
        NpgsqlUiTopologyRepositoryLayoutPatchValidationTests.cs (backend persistence-boundary
        validation, including round 7's mirrored trigger normalization/membership/collision
        cases and round 8's trim/whitespace-collision/empty-payloadFrom cases, plus a
        regression case proving dispatchExternalPort's own empty-payloadFrom leniency stays
        unchanged) and LayoutSchemaStructuralCompositionTests.cs (NodeLocalData/Compose
        merge-by-exact-nodeId for the dispatchPayloadFromByTriggerJson field), and frontend/tests/
        projectionShellAdminRuntimeWritePayloadCapture.test.ts (production
        frontend/islands/ProjectionShell.tsx mount, real DOM input/click events and a real
        SSE "projection" event fired through the actual sseReceiver/projectionRuntime
        path with a minimal live ProjectionDefinition -- not a test-injected payload
        map/callback or a stubbed refresh -- proving: multi-node value separation, a
        removed node's tracked value failing close on a later dispatch instead of leaking,
        a surviving node's tracked DISPLAY value -- asserted directly against the
        re-rendered DOM <input>.value, not only against the dispatch payload --
        persisting across refresh and matching the value the following dispatch actually
        sends, and a fresh unmount/remount starting with no inherited values -- kept as a
        focused dedicated scenario file, ProjectionShell-specific proof only).
      round_16_hardening: >-
        2026-07-29. Two gaps closed, shared with admin_runtime_target_ref_override_contract
        below (see its applicability/authored_surface for full detail): (1) this field was never
        represented in frontend/runtime/visualLayoutUtils.ts's VisualNodePayload/readPatchNode/
        buildVisualLayoutPatchJson -- opening an existing layout with it authored and saving
        without touching the affected node would have silently dropped it; now round-tripped
        byte-for-byte (frontend/tests/visualLayoutBuilder.test.ts) and preserved through
        cloneVisualNode. (2) neither this field's own persistence-boundary validation
        (ValidateDispatchPayloadFromByTrigger) nor its frontend build-time counterpart previously
        confirmed the authoring node's layout is actually wiring_kind="admin_runtime" -- now
        fail-closed on both boundaries the same way as its target-ref-override sibling
        (RUNTIME_INTERACTION_DISPATCH_PAYLOAD_FROM_BY_TRIGGER_REQUIRES_ADMIN_RUNTIME_WIRING).
    admin_runtime_target_ref_override_contract:
      role: >-
        2026-07-29 (PR #600, admin-write-surface-selection-context-and-mode-composition-gap
        Bundle round 14/15). Resolves the "operation selector" gap round 14 identified:
        NpgsqlTopologyRepository.LoadLayoutNodesAsync applies ONE layout's ONE
        ui_wiring_registry row's WiringKind/TargetRef uniformly to every non-structural node
        in that layout (confirmed unchanged after 2026-07-22/24/25's admin_runtime work), and
        AdminRuntime.ExecuteDataAsync/ManifestDispatcher resolve layer:action statically per
        request with zero precedent of payload-driven branching -- so, before this contract,
        no admin_runtime node could dispatch to any layer:action other than its own layout's
        single canonical one. This is NOT a new mechanism category: dispatchExternalPort and
        dispatchInstanceOperation already let a node's OWN runtimeInteractions[] entry carry
        its OWN target (portTargetRef / instanceTargetRef respectively), independent of the
        layout's shared wiring row -- this contract applies that SAME existing "per-trigger
        authored target, independent of the shared layout wiring row" precedent to
        admin_runtime, as a sibling of admin_runtime_payload_binding_contract above (payload
        override) rather than a new lane.
      authority: >-
        Frontend build-time authoring (frontend/runtime/renderEmission.ts
        buildAdminRuntimeTargetRefOverrideByTrigger), backend persistence-boundary validation
        (NpgsqlUiTopologyRepository.cs ValidateDispatchTargetRefByTrigger) and node-local
        plumbing (LayoutNodeRecord.DispatchTargetRefByTriggerJson /
        LayoutSchemaTensorComposer.NodeLocalData / StructureMapResolver.ToLayoutNode /
        Contracts.cs LayoutNode.DispatchTargetRefByTrigger) -- the SAME per-node authoring
        column family and plumbing chain dispatchPayloadFromByTrigger already uses, its own
        top-level key. Backend routing itself is unchanged: AdminRuntime.ExecuteDataAsync
        still executes whichever layer:action the resolved target_ref names, exactly as it
        already does for the layout's own uniform target_ref -- this contract only lets a
        node choose ITS OWN target_ref value at authoring time, per trigger, instead of
        always inheriting the layout's one.
      applicability: >-
        wiring_kind="admin_runtime" nodes ONLY -- fail-closed (round 16, 2026-07-29) at both
        frontend build time (renderEmission.ts: RUNTIME_INTERACTION_DISPATCH_TARGET_REF_BY_TRIGGER_REQUIRES_ADMIN_RUNTIME_WIRING
        when node.wiringKind !== "admin_runtime") and backend persistence time
        (NpgsqlUiTopologyRepository.cs ValidateDispatchTargetRefByTrigger:
        RUNTIME_INTERACTION_DISPATCH_TARGET_REF_BY_TRIGGER_REQUIRES_ADMIN_RUNTIME_WIRING when the
        layout's own wiring_kind, loaded via LoadWiringKindForLayoutAsync, is not "admin_runtime" --
        a layout's wiring_kind is uniform for every node in it, so one DB lookup per patch save
        suffices, and it is only performed when the patch actually authors
        dispatchPayloadFromByTrigger/dispatchTargetRefByTrigger). Any layer:action, any manifest_id
        (including the SAME manifest_id the node's own layout already belongs to) -- reuses the
        SAME field, no per-operation/per-subBundle case. Lets a single per-screen manifest host
        nodes for MULTIPLE admin_runtime operations (e.g. a create-modal's own submit button
        dispatching enum_dictionary:create_group while the rest of the SAME layout keeps
        dispatching enum_dictionary:list_groups) without a per-node wiringKind/target_ref
        extension at the ui_topology_tensor/ui_wiring_registry row level -- the layout's own
        tensor row and its uniform WiringKind/TargetRef are unchanged and remain every other
        node's default/fallback.
      authored_surface: >-
        A per-node topology.ui_topology_tensor.layout_patch_json.nodes[].dispatchTargetRefByTrigger
        field -- { trigger: "manifest:<uuid>:<layer>:<action>" } -- the SAME
        ManifestDispatcher-resolvable target_ref shape node.targetRef itself already requires
        (parseAdminRuntimeLayerAction / ADMIN_RUNTIME_TARGET_REF_RE), never a bare
        "<layer>:<action>". Round 16 (2026-07-29) closed a UI Builder authoring gap: neither this
        field NOR its dispatchPayloadFromByTrigger sibling was represented in
        frontend/runtime/visualLayoutUtils.ts's VisualNodePayload/readPatchNode/
        buildVisualLayoutPatchJson (nor UiBuilderAdmin.tsx's structurally-parallel DraftNode type)
