admin_topology_clone_draft_lifecycle_temp:
  name: admin_topology_clone_draft_lifecycle_temporary_material
  status: temporary_work_material_not_ssot
  target_repo: github.com/tk-ud/topolactor

  role:
    summary: >
      Temporary design material for auditing admin topology clone/draft lifecycle before integration
      into the canonical SSOT. This file is not a product SSOT and must not remain as final
      authority. The canonical target is docs/design/admin-console-workflow-ssot.yaml.
    canonical_target: docs/design/admin-console-workflow-ssot.yaml
    final_diff_policy:
      - integrate_usable_atoms_into_existing_admin_console_workflow_ssot
      - do_not_add_parallel_admin_lifecycle_ssot
      - remove_this_temp_file_before_final_review
      - roadmap_status_not_promoted
      - no_frontend_backend_db_implementation_in_design_change

  user_intent_axis:
    purpose:
      - id: admin_contents_clone_entry_modes
        statement: >
          From /admin/contents, allow authors to start Step 1 by creating a new topology,
          cloning an active canonical topology as a replacement draft, or cloning an active
          canonical topology as a separate new topology draft.
      - id: replacement_clone_merge
        statement: >
          When the author chooses clone draft for canonical replacement, the draft merges back
          into the existing active topology. New topology and clone-as-new-topology continue to
          use the conventional registration/promote path.
      - id: admin_manifests_active_to_draft
        statement: >
          From /admin/manifests, allow changing an active canonical manifest/topology state back
          to draft or reopening it as a draft lifecycle operation, with explicit runtime dispatch
          impact and audit evidence.
    concerns:
      - id: diff_log_transaction
        statement: >
          Existing diff/log evidence and pipeline transaction boundaries should be reused where
          possible. The design should not invent a parallel transaction plane if the pipeline
          already provides sufficient audit and atomicity.
      - id: sql_attention_draft_candidate_interference
        statement: >
          SQL Attention draft candidate generation may interfere with human-authored clone drafts.
          Candidate drafts must be isolated from replacement clone authority and must not silently
          become canonical replacement targets.

  required_design_axes:
    admin_contents_step1_entry_mode:
      owner_surface: /admin/contents
      canonical_location: docs/design/admin-console-workflow-ssot.yaml canonical_sequential_authoring_pipeline
      modes:
        create_new_topology:
          meaning: conventional new manifest/topology draft creation
          source_active_manifest_id: prohibited
          topology_identity: new topologySystemName / routeKey
          completion_path: conventional validate/promote/register path
        clone_active_as_replacement_draft:
          meaning: edit draft cloned from an existing active canonical topology for replacing that active
          source_active_manifest_id: required
          source_evidence: required
          topology_identity: same canonical identity as source active unless explicit backend rule says otherwise
          completion_path: validate then merge into existing active via backend authority
        clone_active_as_new_topology_draft:
          meaning: copy an active topology as a template for a separate topology
          source_active_manifest_id: lineage_only
          source_evidence: lineage/audit evidence, not replacement authority
          topology_identity: new topologySystemName / routeKey required
          completion_path: conventional validate/promote/register path
      prohibited:
        - treating_all_clones_as_replacement_drafts
        - clone_as_new_topology_reusing_source_routeKey_or_topologySystemName_without_explicit_rename
        - frontend_decides_merge_target
        - frontend_writes_active_topology

    replacement_clone_merge_lifecycle:
      owner_boundary: backend AdminRuntime / ManifestRepository transaction
      frontend_role:
        - choose clone replacement mode
        - display source active read-only evidence
        - submit draft authoring intent through existing /admin/contents and /admin/ui-builder surfaces
        - display validation / diff / merge blockers
        - submit merge request intent
      backend_role:
        - create clone replacement draft with source evidence
        - validate replacement draft through existing pipeline/backend validation
        - check stale source and active identity conflict
        - merge replacement draft into existing active transactionally
        - preserve prior active state as audit evidence when required
      evidence_required:
        - source_active_manifest_id
        - source_active_topologySystemName
        - source_active_routeKey
        - source_active_dispatcher_axes
        - source_active_updated_at_or_version
        - source_active_topology_hash_or_equivalent_diff_base
        - clone_mode
        - draft_origin
      fail_close:
        - stale_source_active
        - active_identity_conflict
        - missing_source_evidence
        - replacement_clone_without_validation
        - frontend_merge_judgment_detected
      prohibited:
        - layout_patch_apply_as_manifest_replacement_merge
        - direct_active_mutation_from_admin_ui
        - silent_reuse_of_stale_active_source
        - replacement_merge_without_diff_or_log_evidence

    conventional_paths_preserved:
      create_new_topology:
        rule: no replacement merge; use existing registration/promote path
      clone_active_as_new_topology_draft:
        rule: lineage from source active is evidence only; use existing registration/promote path after new identity assignment
      prohibited:
        - forcing_new_topology_clone_into_existing_active_merge
        - source_active_manifest_id_granting_replacement_authority_without_clone_mode_replacement

    admin_manifests_active_to_draft:
      owner_surface: /admin/manifests
      design_gap: >
        Active-to-draft or reopen-as-draft must define runtime dispatch impact before implementation.
        Directly changing active status to draft may leave no dispatch-resolvable canonical topology.
      options_to_resolve_in_ssot:
        - active_to_draft_disables_runtime_dispatch_and_requires_visible_warning
        - active_to_draft_allowed_only_when_replacement_active_exists
        - active_to_draft_creates_new_draft_copy_while_active_remains_dispatchable
        - active_to_draft_enters_maintenance_non_dispatchable_state
      required_policy:
        - explicit runtime dispatch impact
        - diff/log evidence
        - transaction boundary reuse where existing pipeline supports it
        - no silent fallback to stale active runtime state
      prohibited:
        - hidden_active_status_mutation_without_runtime_policy
        - frontend_direct_status_change
        - active_to_draft_without_audit_log

    sql_attention_candidate_isolation:
      draft_origin_values:
        - manual_new
        - manual_clone_replacement
        - manual_clone_new_topology
        - sql_attention_candidate
      rules:
        - sql_attention_candidate may propose draft candidates but must not acquire replacement merge authority automatically
        - replacement merge requires explicit human clone replacement mode and source evidence
        - SQL Attention candidate lists must be distinguishable from human clone drafts in admin projection
        - candidate_source and draft_origin must be persisted or derivable as audit evidence before merge gates consume them
      prohibited:
        - sql_attention_candidate_auto_merge_to_active
        - treating_source_active_lineage_as_replacement_authority
        - mixing_candidate_drafts_and_human_clone_replacement_drafts_without_visible_origin

  integration_targets:
    primary_ssot:
      - docs/design/admin-console-workflow-ssot.yaml
    supporting_ssot_to_check:
      - docs/registrar-admin-ui-specification.md
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/pipeline-continuity-ssot.yaml
      - docs/design/ci-contract-ssot.yaml
      - docs/system-roadmap.yaml
    likely_sections:
      - canonical_sequential_authoring_pipeline
      - page_responsibility.admin_contents
      - page_responsibility.admin_manifests
      - page_responsibility.admin_ui_builder
      - shared_authoring_boundary
      - contents_promote_guard
      - admin_authoring_completion_gate

  audit_verdict:
    current_status: design_material_only
    not_ready_for_prompt_issue_until:
      - admin_contents_step1_entry_modes_are_confirmed_in_existing_ssot_context
      - clone_replacement_vs_clone_new_topology_are_separated
      - admin_manifests_active_to_draft_runtime_policy_is_selected
      - sql_attention_candidate_interference_boundary_is_checked_against_existing_ssot

  diff_ref: |
    This is an intended integration diff reference, not a literal git-apply patch.
    Codex/Agent must read AGENTS.md and the existing SSOT before applying it.

    Target canonical SSOT:
      docs/design/admin-console-workflow-ssot.yaml

    Add to purpose:
      - define admin contents topology start modes: new topology, clone active as replacement draft, and clone active as new topology draft
      - define canonical replacement clone merge as backend-owned merge into the existing active topology
      - define /admin/manifests active-to-draft or reopen-as-draft policy with explicit runtime dispatch impact
      - isolate SQL Attention draft candidates from human-authored replacement clone drafts

    Add under canonical_sequential_authoring_pipeline:
      admin_contents_step1_entry_modes:
        owner_surface: /admin/contents
        modes:
          create_new_topology:
            source_active_manifest_id: prohibited
            completion_path: conventional_register_promote
          clone_active_as_replacement_draft:
            source_active_manifest_id: required
            source_evidence: required
            draft_origin: manual_clone_replacement
            completion_path: backend_validate_then_merge_to_existing_active
          clone_active_as_new_topology_draft:
            source_active_manifest_id: lineage_only
            source_evidence: lineage/audit_evidence_only
            draft_origin: manual_clone_new_topology
            completion_path: conventional_register_promote_after_new_identity
        prohibited:
          - frontend_decides_merge_target
          - clone_new_topology_reuses_source_identity_without_explicit_rename
          - treating_source_lineage_as_replacement_authority

      replacement_clone_merge_lifecycle:
        lifecycle:
          - select_active_as_read_only_source
          - create_clone_replacement_draft_with_source_evidence
          - author_draft_through_existing_contents_pipeline_and_ui_builder_draft_namespace
          - validate_replacement_draft
          - show_diff_log_and_merge_blockers
          - backend_merge_draft_to_existing_active_transactionally
        backend_authority:
          - AdminRuntime
          - ManifestRepository
        required_evidence:
          - source_active_manifest_id
          - source_active_topologySystemName
          - source_active_routeKey
          - source_active_dispatcher_axes
          - source_active_updated_at_or_version
          - source_active_topology_hash_or_equivalent_diff_base
          - clone_mode
          - draft_origin
        fail_close:
          - stale_source_active
          - active_identity_conflict
          - missing_source_evidence
          - replacement_clone_without_validation
        prohibited:
          - layout_patch_apply_as_manifest_replacement_merge
          - direct_active_mutation_from_admin_ui
          - frontend_merge_judgment
          - replacement_merge_without_diff_or_log_evidence

      conventional_clone_paths_preserved:
        create_new_topology: conventional registration/promote path unchanged
        clone_active_as_new_topology_draft: lineage only; must assign new identity and use conventional registration/promote path

    Amend page_responsibility.admin_contents:
      add:
        - step1 entry mode selector for create_new_topology / clone_active_as_replacement_draft / clone_active_as_new_topology_draft
        - source active read-only selection for clone modes
        - visible draft_origin / clone_mode / source evidence
        - merge blocker display for replacement clone drafts
      prohibit:
        - direct active topology edit
        - frontend merge target decision
        - replacement merge from local UI state only

    Amend page_responsibility.admin_manifests:
      add:
        - active-to-draft or reopen-as-draft operation must be explicitly modeled before implementation
        - runtime dispatch impact must be visible and fail-close
        - diff/log evidence and transaction boundary reuse required
      unresolved_policy_options:
        - copy active to new draft while active remains dispatchable
        - change active to non-dispatchable draft/maintenance state with explicit warning
        - allow only when replacement active already exists
      prohibit:
        - hidden active status mutation
        - active-to-draft without audit log
        - no-active runtime state without explicit runtime policy

    Amend page_responsibility.admin_ui_builder:
      add:
        - distinguish active source, replacement draft, clone-as-new draft, and SQL Attention candidate draft
        - keep layout/package authoring inside draft namespace until canonical pipeline/merge boundary
      prohibit:
        - layout_patch:apply as production manifest replacement merge
        - active package/layout mutation before replacement merge

    Amend shared_authoring_boundary:
      prohibit:
        - active_manifest_direct_mutation_from_admin_ui
        - frontend_production_merge_judgment
        - sql_attention_candidate_auto_merge_to_active
        - treating_source_active_lineage_as_replacement_authority
        - mixing_candidate_drafts_and_human_clone_replacement_drafts_without_visible_origin

    Amend contents_promote_guard:
      add:
        - conventional draft promote remains for new topology and clone-as-new topology
        - replacement clone uses backend replacement merge guard with source evidence and conflict check
        - CI/SQL Attention evidence may be backend guard input but never frontend authority

    Amend admin_authoring_completion_gate:
      require:
        - step1 entry modes are configurable and visibly separated
        - replacement clone merge requires source evidence, validation, diff/log evidence, and backend conflict check
        - clone-as-new topology cannot replace the source active
        - SQL Attention candidate drafts are isolated from manual replacement clone drafts
        - admin/manifests active-to-draft policy has explicit runtime dispatch semantics

    Expected final design-change diff:
      keep:
        - docs/design/admin-console-workflow-ssot.yaml
        - .agent/tasks/todo.md
      remove:
        - docs/design/admin-topology-clone-draft-lifecycle-temp.yaml
      do_not_touch:
        - frontend/*
        - backend/*
        - db/*
        - docs/system-roadmap.yaml status values
