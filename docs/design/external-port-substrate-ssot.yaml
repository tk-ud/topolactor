external_port_substrate_ssot:
  name: external_port_substrate
  version: 0.1.0
  status: ssot_design_document
  canonical_path: docs/design/external-port-substrate-ssot.yaml

  purpose:
    summary: >-
      外部連携 Bundle 共通基盤 SSOT。
      access_port / response_port / hook_port / credential_requirement を
      物理テーブル + seed projection + admin role write policy で定義する。
      6 active consumer bundles (file_storage / email / stripe / webhook_inbox / audit_approval / export_sftp) + credential_requirement substrate の共通基盤として機能し、
      credential は独立した管理 plane にしない。
      credential 管理は行うが、admin 権限の projection 側管理画面で
      port record context 内に統合し、provider 別・bundle 別の
      hardcoded 管理 UI / runtime / handler は作らない。
      secret_credential_bundle は独立実装 Bundle ではなく、
      本 substrate の credential_requirement 境界定義として統合する。
    non_goals:
      - dedicated_credential_runtime
      - dedicated_credential_admin_ui
      - dedicated_credential_audit_log
      - credential_rotation_service
      - credential_startup_validation_service
      - secret_store_adapter_as_standalone_runtime
      - secret_credential_bundle_as_standalone_runtime
      - external_service_as_runtime_ssot

  port_kinds:
    access_port:
      role: outbound_access_to_external_service
      note: runtime は設定済み URL / env reference を使って外部へアクセスする
      configuration:
        - url_or_env_reference
        - provider_kind
        - credential_kind
        - required_by_bundle
    response_port:
      role: outbound_response_to_external_service
      note: runtime は設定済み URL / env reference を使って外部へ返す
      configuration:
        - url_or_env_reference
        - provider_kind
        - credential_kind
        - required_by_bundle
    hook_port:
      role: inbound_hook_reception_from_external_service
      note: >-
        hook を受け取り、hook_path / provider / header / route key などから
        該当 port record を特定する。secret credential runtime は不要。
      configuration:
        - hook_path
        - provider_kind
        - header_key
        - route_key
        - credential_kind
        - required_by_bundle

  sibling_substrate_boundary:
    instance_port_substrate_ref: docs/design/instance-port-substrate-ssot.yaml
    decision: instance_port_substrate_is_a_sibling_not_an_external_port_extension
    rationale: >-
      external_port_substrate owns HTTP/service access_port, response_port, hook_port,
      and their credential_requirement attachments. Credential-backed DB/runtime instance
      connections need instance authority bindings, instance connection policy, and
      manifest-authorized function allowlists, so they are defined in the sibling
      instance_port_substrate SSOT instead of growing external_port_substrate.
    lane_distinction:
      secure_consumer_dispatch_lane: external_port_runtime for HTTP/hook/access/response port policy steps.
      instance_dispatch_lane: instance_port_runtime for db_instance_port/runtime_instance_port credential-backed function calls.
    non_mix_rule: Do not add db_instance_port, runtime_instance_port, or call_instance_postgres_function as external_port_substrate port kinds or core policy operations.

  credential_kind:
    allowed_values:
      - auth
      - external
      - none
    semantics:
      auth:
        meaning: auth_boundary_credential_special_form
        owner: docs/design/auth-db-session-credential-ssot.yaml
        rule: >-
          auth credential は既存 auth.credentials の最奥 boundary の特殊形として扱う。
          external secret を auth.credentials に混ぜない。
      external:
        meaning: port_record_level_credential_requirement
        rule: >-
          実 secret 値を持たない。
          provider_kind / reference_key / required_by_bundle を持つ requirement。
          consumer bundle が実際に使う時点で fail-close する。
          consumer bundle 未接続の状態で rotation / startup validation /
          standalone admin credential UI を作らない。
      none:
        meaning: no_credential_required
        rule: "credential が不要な port は credential_kind: none として明示する。"
    constraint:
      - external_credential_is_port_record_attachment_not_standalone_entity
      - secret_plaintext_never_stored_in_db_ui_ssot_or_audit_log
      - consumer_bundle_unconnected_does_not_trigger_standalone_credential_service


  db_guarded_credential_vault_refresher:
    bundle: external-port-substrate-db-credential-vault-refresher
    problem:
      - secret_value_never_stored_in_db_ui_ssot_or_audit_log fits API-key references and hash-verification tokens, but is insufficient for OAuth refresh tokens that must be re-presented to a provider.
      - Hash-only storage cannot reissue access tokens when the Topolactor backend/refresher must present the refresh_token again.
      - Moving these secrets to an external public API TokenStore or standalone secret-store adapter runtime weakens the Topolactor DB/pipeline boundary and expands the attack surface.
    policy:
      authority_boundary: Topolactor DB + pipeline + validate_preview_apply + canonical runtime route
      auth_hash_token_model:
        reference: docs/design/auth-db-session-credential-ssot.yaml#auth.refresh_tokens
        rule: Topolactor auth refresh tokens remain token_hash-only; plaintext refresh tokens are never stored in DB/topology/manifest/log.
      external_oauth_representation_model:
        rule: Provider re-presentation tokens may store encrypted_payload in topology.external_credential_vault when hash-only storage cannot satisfy refresh semantics.
        constraints:
          - token_hash is retained for audit, comparison, duplicate detection, and continuity with auth token-hash thinking.
          - encrypted_payload is limited to runtime-decryptable provider re-presentation payloads.
          - access_token, refresh_token, client_secret, and equivalent plaintext values must not appear in UI, projection, SSOT, seed SQL, audit log, runtime_event_log, or manifest.
      storage_surface:
        schema: topology
        tables:
          - topology.external_credential_vault
          - topology.external_credential_refresh_attempt
        forbidden_schema: auth.credentials
      refresher_boundary:
        kind: generic_primitive
        canonical_runtime_route: seed_manifest_to_dispatch_to_execute_abstract_function_to_generic_credential_primitives_to_manifest_authorized_repository_adapter
        required_primitives:
          - credential_acquire_lease
          - credential_http_request
          - credential_compute_token_hash
          - credential_parse_expires_at
          - credential_write_vault
          - credential_release_lease
          - credential_fail_lease
        legacy_vocabulary_disposition:
          acquire_refresh_lease: absorbed_by_credential_acquire_lease
          release_refresh_lease: absorbed_by_credential_release_lease
          load_encrypted_credential_payload: remains_policy_step_before_execute_abstract_function_not_refresh_manifest_primitive
          decrypt_for_runtime_use: remains_policy_step_before_execute_abstract_function_not_refresh_manifest_primitive
          request_token_by_config: absorbed_by_credential_http_request
          write_encrypted_credential_payload: absorbed_by_credential_write_vault
          update_token_hash: absorbed_by_credential_compute_token_hash_then_credential_write_vault
          update_expires_at_and_version: absorbed_by_credential_parse_expires_at_then_credential_write_vault
          fail_close_on_missing_or_invalid_credential: absorbed_by_credential_fail_lease_and_abstract_function_fail_close_status
        runtime_branching_policy:
          provider_kind_branching: prohibited
          required_by_bundle_branching: prohibited
          rule: provider_kind and required_by_bundle are data carried by port/vault/policy records only; they must not select dedicated credential runtimes, provider-specific handlers, or bundle-specific C# branches.
        credential_requirement_boundary: port_record_attachment_not_standalone_credential_plane
        prohibited_planes:
          - dedicated_credential_runtime
          - dedicated_credential_executor_defined_grammar
          - dedicated_credential_admin_ui
          - standalone_credential_rotation_service
        secret_projection_boundary:
          prohibited_outputs:
            - decrypted_payload
            - decrypted_credential_payload
            - token_response
            - token_body
            - access_token
            - refresh_token
            - client_secret
          rule: decrypted payload and provider token bodies are runtime-only values and must not appear in projection, log, seed SQL literal payloads, public SSOT examples, or frontend responses.
        config_defaulting_policy:
          http_method_default: prohibited
          lease_duration_default: prohibited
          expiry_response_key_default: prohibited
          rule: method, lease duration, and expires_at response key must be supplied by manifest step_config; C# runtime defaults are forbidden.
        db_guards:
          - refresh lease
          - version check
          - expires_at
          - last_refreshed_at_or_attempt_timestamp
        rotation_rule: When a provider returns a rotated refresh payload, encrypted_payload and token_hash are updated atomically with expires_at/version.
    prohibitions:
      - external_public_api_token_store
      - standalone_secret_store_adapter_runtime
      - provider_specific_refresher_class
      - provider_kind_switch_or_if_runtime_handler
      - dedicated_credential_admin_route_or_panel
      - credential_plaintext_in_seed_ssot_projection_or_log
      - pipeline_outside_credential_mutation

  credential_requirement:
    role: port_record_level_requirement_not_standalone_entity
    fields:
      - port_id
      - credential_kind
      - provider_kind
      - reference_key
      - required_by_bundle
    constraint:
      - secret_plaintext_not_exposed_in_ui_projection_ssot_seed_log_with_db_guarded_encrypted_payload_exception
      - credential_requirement_travels_through_projection_and_port_record
      - consumer_bundle_not_connected_triggers_fail_close_not_standalone_service

  seed_projection_resolution:
    purpose: projection 側管理画面と DB seed / record による port 接続解決境界
    owns:
      - credential_kind_seed (auth | external | none)
      - port_kind_seed (access_port | response_port | hook_port)
      - provider_kind_seed
      - port_setting_projection_seed
      - consumer_bundle_binding_seed
      - credential_requirement_seed
    rule: >-
      接続管理は provider 固有の backend hardcode ではなく、seed / DB record / projection
      により解決する。projection 側は credential_kind / provider_kind / reference_key /
      required_by_bundle / consumer_bundle_binding を port record context 内で管理する。
    prohibited:
      - provider_specific_projection_hardcode
      - bundle_specific_projection_hardcode
      - backend_side_credential_management_plane

  admin_setting_projection:
    purpose: admin role による port 設定の projection 側 write / management 境界
    rule: >-
      admin 画面は projection を作る surface であり、credential 専用管理アプリではない。
      credential 管理は fixed-form operational projection として admin 権限の projection 側管理画面で、
      port record context 内に統合して行う。これは manifest / runtime / pipeline / capability
      boundary を通る operational metadata 管理面であり、dedicated admin credential route / panel
      ではない。projection 側に provider 別・bundle 別の hardcode は置かない。
    pipeline_contract_reason: >-
      Credential management metadata belongs on the projection side because the pipeline contract
      preserves manifest identity, runtime route identity, capability enforcement, and projection
      refresh boundaries. A standalone admin credential panel or UI Builder preset would bypass
      that contract and expand authority outside the port record context.
    owns:
      - port_setting_projection (access_port / response_port / hook_port)
      - credential_kind_switch (auth | external | none)
      - provider_kind_setting
      - reference_key_setting
      - required_by_bundle_setting
      - hook_path_url_env_reference_setting
      - admin_role_write_policy
      - consumer_bundle_binding
    prohibited:
      - dedicated_admin_credentials_route
      - dedicated_credential_panel_outside_port_context
      - standalone_credential_ui_without_port_record
      - provider_specific_admin_projection_hardcode
      - bundle_specific_admin_projection_hardcode

  physical_tables:
    purpose: port / hook / credential_requirement の設定行を保持する surface
    not_purpose: credential_management_plane
    schema: topology
    tables:
      external_access_ports:
        columns:
          - access_port_id
          - required_by_bundle
          - provider_kind
          - url_or_env_reference
          - credential_kind
          - reference_key
          - active
          - created_at
          - updated_at
        note: reference_key は runtime 環境変数、DB guarded vault、または provider 再提示不要の外部参照を指す識別子のみ。plaintext 実値不可。
      external_response_ports:
        columns:
          - response_port_id
          - required_by_bundle
          - provider_kind
          - url_or_env_reference
          - credential_kind
          - reference_key
          - active
          - created_at
          - updated_at
      external_hook_ports:
        columns:
          - hook_port_id
          - required_by_bundle
          - provider_kind
          - hook_path
          - header_key
          - route_key
          - credential_kind
          - reference_key
          - active
          - created_at
          - updated_at


  policy_step_surface:
    purpose: DB seed-driven ordered primitive execution for external port records.
    port_kind_allowed_values:
      - access_port
      - response_port
      - hook_port
    operation_key_allowed_values:
      - resolve_port_record
      - resolve_credential_reference
      - load_encrypted_credential_payload
      - decrypt_for_runtime_use
      - build_http_request
      - inject_authorization_header
      - send_http
      - capture_response
      - execute_db_function
      - execute_abstract_function
      - verify_signature_by_config
      - enqueue_scheduler_event
      - append_runtime_event_log
      - fail_close
      - credential_acquire_lease
      - credential_http_request
      - credential_compute_token_hash
      - credential_parse_expires_at
      - credential_write_vault
      - credential_release_lease
      - credential_fail_lease
      - compute_checksum
      - record_transfer_lifecycle_evidence
    abstract_function_key_surface:
      purpose: >-
        topology.external_port_policy_steps.abstract_function_key is a TEXT column
        referencing topology.abstract_function_manifests(function_key). When
        operation_key = 'execute_abstract_function', the executor resolves the manifest
        by this key and dispatches generic primitive steps. frontend payload, seed payload,
        and operation payload do not supply table/column/join/output authority; that
        authority comes from topology.abstract_function_authority_bindings.
      authority_rules:
      - abstract_function_key_must_reference_an_active_manifest_row
      - missing_manifest_is_missing_authority_fail_close
      - inactive_manifest_is_invalid_authority_fail_close
      - payload_provides_values_only_not_table_column_join_output_authority
    operation_key_definitions:
      execute_abstract_function:
        meaning: >-
          Resolves abstract_function_key to a topology.abstract_function_manifests row
          and dispatches generic primitive steps (validate_authority, bind_input,
          db_query, db_mutation, call_postgres_function, http_request, event_log,
          projection, fail_close, etc.) through the backend abstract function executor.
          This is the manifest-driven successor path for consumer bundle domain mutations
          that were previously expressed as execute_db_function steps.
        boundary: >-
          abstract_function_key must reference an active manifest row.
          Table/column/join/output authority comes from topology.abstract_function_authority_bindings,
          not from frontend payload or operation payload.
          Executor fail-closes on missing authority bindings, missing policy binding,
          missing input, invalid projection, and unsupported primitive.
        step_config: no additional step_config required; manifest row carries authority, steps, and bindings
        fail_close_statuses:
          - missing_authority
          - invalid_authority
          - missing_input
          - invalid_input_binding
          - invalid_projection
          - secret_projection_denied
          - unsupported_primitive
        prohibited:
          - frontend_payload_or_seed_payload_as_table_column_join_output_authority
          - raw_sql_in_payload_or_step_config
          - provider_specific_or_bundle_specific_primitive_branching
          - silent_fallback_to_execute_db_function_path
        ssot_ref: docs/design/abstract-function-primitive-registry-ssot.yaml#backend_abstract_function_runtime_substrate
      execute_db_function:
        meaning: >-
          Compatibility placeholder operation_key. All file-storage consumer bundle domain
          mutations (record_export_job / record_file_artifact / write_manifest_record /
          authorize_signed_download / bind / list / unbind attachment) have been migrated
          to execute_abstract_function manifests af01-af07 via call_postgres_function primitive.
          NpgsqlExternalPortDbFunctionRepository is a stub that throws for any function name.
          No new file-storage or other consumer-bundle operations should be added to this path.
        boundary: >-
          operation_key remains valid in the CHECK constraint for backwards schema compatibility
          but no active seed rows use it for file-storage domain mutations post-PR#481.
          IExternalPortDbFunctionRepository throws EXTERNAL_PORT_DB_FUNCTION_UNKNOWN for all inputs.
        abstract_function_relation: IExternalPortDbFunctionRepository (compatibility stub only)
        migration_note: >-
          New consumer-bundle domain mutations must use execute_abstract_function with a manifest
          row, input bindings, and authority bindings. execute_db_function must not grow.
        prohibited:
          - direct_sql_outside_postgresql_function
          - plaintext_credential_or_bucket_or_endpoint_in_function_params
          - provider_kind_or_bundle_branching_in_function_selection
          - function_name_without_topology_prefix
          - adding_bundle_specific_concrete_mutation_to_FileStorageBundleStepHandler
          - new_file_storage_or_consumer_bundle_operations_on_execute_db_function_path
    execution_rule: >-
      Runtime reads topology.external_port_policy_steps ordered by step_order and dispatches
      operation_key through a generic registry/dictionary. provider_kind and
      required_by_bundle are data constraints only and must not select provider-specific
      runtime handlers. hook_port policies enqueue scheduler events instead of direct
      runtime execution.
    physical_tables:
      - topology.external_port_policies
      - topology.external_port_policy_steps

  consumer_bundle_step_handler_surface:
    purpose: >-
      Consumer bundle-specific operation_key handlers are NOT added to the generic executor class.
      Each bundle registers a dedicated IExternalPortBundleStepHandler implementation.
      The generic executor accepts an extensible collection of bundle handlers via constructor injection.
      This keeps ExternalPortPolicyStepExecutor free of bundle-specific dependencies.
    rule: >-
      Bundle-specific operation_keys must be defined in the bundle's own SSOT, not in
      external_port_substrate core operation_key_allowed_values.
      Bundle handlers fail-close (throw) when required repository or context prerequisites
      are missing; silent fallback is prohibited.
    extension_contract:
      interface: IExternalPortBundleStepHandler
      required_members:
        - SupportedOperationKeys (IReadOnlySet<string>)
        - ExecuteAsync (ExternalPortPolicyStep, ExternalPortExecutionContext, CancellationToken)
    consumer_bundle_handlers:
      file_storage_bundle:
        handler_class: FileStorageBundleStepHandler
        operation_keys:
          - compute_checksum
        note: >-
          record_export_job / record_file_artifact / write_manifest_record / authorize_signed_download
          / bind_record_file_attachment / list_record_file_attachments / unbind_record_file_attachment
          are all dispatched via execute_abstract_function → abstract function manifests af01-af07
          → call_postgres_function primitive → topology.fs_* PostgreSQL functions (PR#481).
          FileStorageBundleStepHandler retains only compute_checksum (hard-runtime SHA-256 computation).
          NpgsqlExternalPortDbFunctionRepository is a compatibility placeholder stub (all concrete
          fs_* methods deleted); execute_db_function route is a shell with no active file-storage use.
        detail_ref: docs/design/runtime-bundle-file-storage-ssot.yaml#operation_key_surface
      export_sftp_bundle:
        handler_class: ExportSftpBundleStepHandler
        operation_keys:
          - record_transfer_lifecycle_evidence
        note: >-
          record_transfer_lifecycle_evidence owns the Export/SFTP transfer lifecycle
          (transfer_initiated / transfer_completed / checksum_mismatch / transfer_failed /
          retry_attempted) plus the retry scheduler enqueue. It was evacuated from the generic
          ExternalPortPolicyStepExecutor into this dedicated bundle handler so bundle lifecycle
          meaning does not accrue in the generic executor. Event types, evidence/projection table
          refs, and the retry trigger target are data-defined via policy step_config; evidence and
          runtime_event_log writes go through the seed-directed, manifest-binding-validated
          IExternalPortConsumerEvidenceRepository / IExternalPortRuntimeEventLogRepository
          boundaries (no raw tableRef dynamic SQL, no provider-specific SFTP client). The residual
          C# is the irreducible runtime branching (success / checksum_mismatch / failed / retry plus
          scheduler enqueue), which an abstract function manifest cannot express (no conditionals;
          scheduler enqueue is not a PostgreSQL function) and which therefore stays scoped to this
          per-bundle handler rather than the generic executor.
        detail_ref: docs/design/runtime-bundle-export-sftp-ssot.yaml#secure_consumer_dispatch_lane_ref
    prohibited:
      - adding_bundle_specific_repository_or_handler_directly_to_generic_executor
      - bundle_specific_constructor_parameter_on_ExternalPortPolicyStepExecutor
      - provider_specific_operation_key_in_core_allowed_values

  backend_boundary:
    owns:
      - generic_access_port_connect_function
      - generic_response_port_connect_function
      - generic_hook_port_receive_function
      - db_seed_resolved_port_record_resolution_for_consumer_runtime
      - physical_table_row_validate_preview_apply_boundary
    rule: >-
      backend は projection / seed / DB record で解決された port record を使い、
      access_port / response_port / hook_port の汎用接続・受信関数だけを持つ。
      provider 別・bundle 別の credential 管理 handler / 管理 UI / standalone runtime は持たない。
    not_owns:
      - credential_plaintext_storage_outside_db_guarded_vault
      - standalone_external_secret_store_runtime
      - external_public_api_token_store
      - credential_rotation_service
      - credential_startup_validation_service
      - standalone_credential_management
      - provider_specific_credential_management_handler
      - bundle_specific_external_service_handler

  runtime_boundary:
    behavior:
      access_port: DB seed / port record で解決された URL / env reference を使って外部へアクセスする
      response_port: DB seed / port record で解決された URL / env reference を使って外部へ返す
      hook_port: >-
        hook を受け取り、hook_path / provider / header / route key から
        seed / DB record 解決済みの該当 port record を特定する
      credential_requirement: port record に紐づく reference として解決する
      db_guarded_vault_payload: provider 再提示が必要な credential に限り topology.external_credential_vault.encrypted_payload を runtime-only に復号する
    not_behavior:
      - secret_plaintext_stored_in_ui_projection_ssot_seed_audit_log_or_runtime_event_log
      - hash_only_provider_re_presentation_token_refresh
      - encrypted_payload_export_to_projection_or_log
      - credential_rotation_management
      - startup_validation_management
      - standalone_credential_runtime_execution
      - provider_specific_runtime_execution

  consumer_bundle_relation:
    file_storage_bundle:
      port_consumer: [access_port, response_port]
      detail_ref: docs/design/runtime-bundle-file-storage-ssot.yaml
    email_bundle:
      port_consumer: [response_port]
      provider_kind: smtp
      detail_ref: docs/design/runtime-bundle-email-ssot.yaml
    stripe_bundle:
      port_consumer: [hook_port]
      provider_kind: stripe
      detail_ref: docs/design/runtime-bundle-stripe-ssot.yaml
    webhook_inbox_bundle:
      port_consumer: [hook_port]
      detail_ref: docs/design/runtime-bundle-webhook-inbox-ssot.yaml
    audit_approval_bundle:
      port_consumer: [response_port]
      detail_ref: docs/design/runtime-bundle-audit-approval-ssot.yaml
    export_sftp_bundle:
      port_consumer: [response_port]
      provider_kind: sftp
      detail_ref: docs/design/runtime-bundle-export-sftp-ssot.yaml
    secret_credential_bundle:
      classification: reclassified_as_credential_requirement_substrate
      note: >-
        secret_credential_bundle は独立した実装 Bundle ではない。
        credential_requirement は本 substrate の port record 付属要件として扱う。
        credential 管理は projection 側管理画面で port context 内に統合する。
        dedicated credential runtime / admin UI / audit log / rotation service は作らない。
      detail_ref: docs/design/runtime-bundle-secret-credential-ssot.yaml

  secure_consumer_dispatch_lane:
    summary: >-
      PR#460 以後の consumer bundle 実装が必ず通す既存レーンの named invariant。
      新設計ではなく、本 SSOT の security_boundary / dispatch_lane / credential_boundary の明確化。
      consumer bundle 実装者が誤読せずに参照できるよう、既存 SSOT の制約を named invariant として整理したもの。
    trigger_entry:
      note: >-
        trigger_kind は runtime-orchestration SSOT の cron / hook / client に対応。
        UI/client trigger が代表経路だが、hook trigger (stripe / webhook_inbox) や
        scheduler/cron trigger (job_scheduler) も external_port_runtime 以降の共通レーンを通す。
      kinds:
        client_or_ui_trigger:
          path: UI_Builder_portTargetRef_action_wiring → api_command_lane → ManifestDispatcher
          applies_to: [file_storage, email, audit_approval]
        hook_trigger:
          path: hook_port_receive → scheduler_enqueue_event → external_port_runtime
          applies_to: [stripe, webhook_inbox]
        scheduler_or_cron_trigger:
          path: built_in_or_external_scheduler → hook_or_access_port_receive → external_port_runtime
          applies_to: [job_scheduler]
    lane:
      - trigger_entry
      - api_or_scheduler_or_dispatcher_lane
      - external_port_runtime
      - DB_port_record_resolution
      - credential_requirement_and_reference_key_resolution
      - runtime_only_credential_materialization
      - generic_operation_key_policy_steps
      - response_and_evidence_and_runtime_event_log
      - UI_projection
    invariants:
      port_connection_management:
        rule: >-
          seed / DB record / projection で port 接続を管理する。
          provider 固有 backend hardcode で管理しない。
      credential_management:
        rule: >-
          credential は port record context の credential_requirement / reference_key で扱う。
          consumer bundle が credential 実値を直接読まない。
      ui_credential_exclusion:
        rule: >-
          UI は credential plaintext / token / secret / endpoint 実値を持たない。
          projection 側には credential 実値を流さない。
      credential_materialization_boundary:
        rule: >-
          runtime 境界でのみ credential material を解決する。
          consumer bundle / dispatcher / frontend は credential を materialization しない。
      generic_operation_key_dispatch:
        rule: >-
          通信は provider_kind 分岐ではなく generic operation_key policy steps で行う。
          provider_kind は DB data constraint であり、C# 制御フローの selector にしない。
      provider_kind_is_data_only:
        rule: >-
          provider_kind / required_by_bundle は data constraint であり runtime handler selector ではない。
          provider_kind で if/switch/case する C# コードを追加しない。
      response_boundary:
        rule: >-
          response は evidence / runtime_event_log / projection boundary を通して UI に返す。
          runtime から直接 credential や raw provider レスポンスを UI に流さない。
    prohibited_at_consumer_bundle:
      - provider_specific_runtime_implementation
      - bundle_specific_runtime_implementation
      - direct_credential_read_from_consumer
      - portTargetRef_bypass_via_new_payload_lane
      - frontend_credential_exposure
      - dispatch_payload_containing_credential_or_vault_value
      - new_runtime_or_client_class_for_provider

  prohibited:
    - SecretCredentialBundleRuntime
    - dedicated_credential_runtime
    - dedicated_credential_admin_ui
    - dedicated_credential_repository
    - dedicated_credential_audit_log
    - credential_rotation_service
    - credential_startup_validation_service
    - secret_store_adapter_runtime
    - secret_credential_bundle_implemented_claim
    - external_service_as_runtime_ssot
    - webhook_direct_runtime_execution_without_scheduler
    - external_tool_direct_db_write
    - frontend_direct_db_write
    - ssot_entry_to_ratify_implementation_first_shape
    - provider_specific_projection_hardcode
    - bundle_specific_projection_hardcode
    - provider_specific_runtime_execution

  related_ssot:
    - docs/design/extended-runtime-bundle-registry-ssot.yaml
    - docs/design/runtime-orchestration-ssot.yaml
    - docs/design/auth-db-session-credential-ssot.yaml
    - docs/design/runtime-bundle-secret-credential-ssot.yaml
    - docs/design/runtime-bundle-file-storage-ssot.yaml
    - docs/design/runtime-bundle-email-ssot.yaml
    - docs/design/runtime-bundle-stripe-ssot.yaml
    - docs/design/runtime-bundle-webhook-inbox-ssot.yaml
    - docs/design/runtime-bundle-job-scheduler-ssot.yaml
    - docs/design/runtime-bundle-audit-approval-ssot.yaml
    - docs/design/runtime-bundle-export-sftp-ssot.yaml

  external_integration_completion_gate:
    note: >-
      外部連携 Bundle の PR が merge 可能になるための完了ゲート。
      data_driven_projection_completion_gate (docs/design/runtime-orchestration-ssot.yaml) の
      全軸を継承しつつ credential_resolution_base 軸を追加したものである。
      外部連携 Bundle では両 gate (super-gate + 本 gate) の全軸を満たす必要がある。
      4 軸 + credential resolution 基盤 の全てを満たす必要がある。
      監査コメント上の後付け基準ではなく、SSOT として全外部連携 Bundle の completion gate とする。
    super_gate_ref:
      gate: data_driven_projection_completion_gate
      ssot: docs/design/runtime-orchestration-ssot.yaml
      note: >-
        外部連携 Bundle の UI_db_projection / dispatch_resolution / response_queue /
        abstract_function_boundary / seed_or_data_defined_surface 各軸は
        super-gate の同名軸と同義。credential_resolution_base は外部連携固有の追加軸。
    required:
      UI_db_projection:
        rule: >-
          UI は DB / seed / topology manifest から投影すること。
          test-local 手書き emission を DB projection 接続済みとして扱わない。
        check: DB seed / topology_manifest / physical_table_manifest_binding / projection repository 由来で UI emission を生成し、dispatchExternalPort runtimeInteraction が投影結果として出ること
      dispatch_resolution:
        rule: >-
          dispatchExternalPort は port record / credential requirement を解決すること。
          port record / credential vault / dispatch policy steps を通らない外部通信は Bundle 実装として成立しない。
        check: port_target_ref → port record resolution → credential requirement / reference_key resolution → credential vault record → load / decrypt / inject → send_http / capture_response の通貫
      credential_resolution_base:
        rule: >-
          credential resolution は外部連携の基盤。
          credential_kind != none の場合、send_http 前に credential vault payload の load / decrypt / authorization injection を通すこと。
        check: load_encrypted_credential_payload → decrypt_for_runtime_use → inject_authorization_header が policy steps に存在し、executor が実行すること
      response_queue:
        rule: >-
          response / SSE は queue / projection response lane に乗ること。
          capture_response の MarkOnly を response queued 扱いしない。
          inline EndpointResponseDto を SSE / projection response 扱いしない。
        check: dispatch response が既存 queue / SSE lane に積まれ、consumer 側が SSE / queued response として受け取れること
      abstract_function_boundary:
        rule: >-
          backend の domain mutation は abstract function / DB-driven operation boundary を使うこと。
          file_storage 専用 concrete mutation を追加しない。
          例外は SQL Attention / CI Attention のみ。
        check: record_export_job / record_file_artifact / write_manifest_record / authorize_signed_download が data-defined / abstract function path で処理されること
    exceptions:
      - SQL_Attention
      - CI_Attention
    prohibited:
      - test_local_handwritten_UI_emission_treated_as_DB_projection
      - direct_backend_concrete_mutation_for_bundle_specific_records
      - external_communication_without_credential_resolution
      - capture_response_as_MarkOnly_treated_as_response_queued
      - inline_EndpointResponseDto_treated_as_SSE_or_projection_response
    applies_to_all_external_bundles:
      - file_storage_bundle
      - email_bundle
      - stripe_bundle
      - webhook_inbox_bundle
      - audit_approval_bundle
      - export_sftp_bundle
