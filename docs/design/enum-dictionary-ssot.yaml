enum_dictionary_ssot:
  name: topolactor_enum_dictionary_ssot
  version: 0.2.0
  status: ssot_design_document

  purpose:
    - canonical_enum_item_and_enum_group_dictionary_for_admin_authoring
    - column_enum_group_reference_for_select_candidates_and_vector_search_coordinates
    - fail_close_when_enum_group_unresolved

  source_files:
    - db/enum_tables.sql
    - db/enum_seed.sql
    - backend/repository/EnumDictionaryRepository.cs
    - backend/repository/NpgsqlEnumDictionaryRepository.cs
    - backend/schema/EnumDictionaryContracts.cs
    - backend/runtime/AdminRuntime.cs
    - frontend/lib/manifestScreenDesign.ts
    - frontend/lib/manifestTopologyExtensions.ts
    - frontend/api/adminApi.ts

  prohibited_in_topology_and_manifest:
    - enum_item_definitions_in_topology_jsonb
    - enum_item_definitions_in_manifest_except_enumGroupId_column_reference
    - hardcoded_select_option_lists_for_enum_backed_columns
    - silent_fallback_to_free_text_when_enumGroupId_is_set
    - enum_label_or_index_num_authority_in_screen_data_shape_without_db_group

  canonical_tables:
    enum.items:
      role: enum_item_canonical_store
      columns: [enum_id, index_num, name]
      note: enum_id is persistent UUID; index_num is vector coordinate in enum space
    enum.groups:
      role: enum_group_canonical_store
      columns: [group_id, index_num, group_name]
      note: group_id is referenced by screen_data_shape columns as enumGroupId
    enum.group_items:
      role: ordered_enum_index_num_vector_per_group
      columns: [group_id, position, enum_index_num]
      note: position orders items[enum index num] for search and near-neighbor exploration

  column_reference_contract:
    field: enumGroupId
    type: uuid_string
    optional: true
    resolves_to: enum.groups.group_id
    prohibited_when_set:
      - manual_initial_data_text_for_backed_column
      - inline_candidate_value_arrays_in_topology

  fail_close:
    error_codes:
      - ENUM_DICTIONARY_NOT_AVAILABLE
      - ENUM_GROUP_NOT_FOUND
      - ENUM_GROUP_ITEMS_EMPTY
      - ENUM_GROUP_ID_MALFORMED
      - ENUM_GROUP_WRITE_NOT_CONFIRMED
      - ENUM_ITEM_WRITE_NOT_CONFIRMED
      - ENUM_GROUP_INDEX_CONFLICT
      - ENUM_ITEM_INDEX_CONFLICT
      - ENUM_ITEM_IN_USE
      - ENUM_GROUP_ITEMS_DUPLICATE_MEMBERSHIP
    rule: unresolved_enum_group_reference_must_blocking_error_not_silent_fallback
    validation_parity_rule: >-
      2026-07-27 (PR #600 review round 2): dryRun (preview) and confirmed (write) must run the
      identical validation gate set for every action -- existence (GetGroupDetailAsync/
      GetItemAsync), conflict (index_num uniqueness), and in-use (IsGroupReferencedInManifestsAsync/
      IsItemReferencedInGroupsAsync) checks all run BEFORE the dryRun/confirmed branch, never only
      on the write path. ENUM_ITEM_IN_USE mirrors ENUM_GROUP_IN_USE's existing role for
      delete_item (enum.group_items.enum_index_num REFERENCES enum.items(index_num), db/
      enum_tables.sql). ENUM_GROUP_ITEMS_DUPLICATE_MEMBERSHIP catches duplicate values within a
      single set_group_items enumIndexNums array before persistence.
    mutation_confirmation_contract_gate: >-
      admin_runtime_actions.enum_dictionary_write group ops (create_group/update_group/
      delete_group/update_group_members->set_group_items) and item ops
      (create_item/update_item/delete_item) require payload.confirmed=true before the actual
      mutation runs -- mirrors the existing team_markdown:saved_view:update payload.dryRun/
      payload.confirmed contract (backend/runtime/AdminRuntime.TeamMarkdown.cs), not a new
      confirmation mechanism. payload.dryRun=true runs the identical validation gates and returns
      a non-mutating preview (preview_dictionary_delta/validate_against_enum_authority); the write
      step re-runs the same validation every time and never trusts a prior dryRun call. Both flags
      accept either the JSON boolean literal or the JSON string "true" (own-property, ordinal
      case-insensitive) because docs/design/ui-builder-preset-ecosystem-ssot.yaml
      payloadFrom_resolver_contract's literal: source always resolves to a JS string.

  projection_read_model:
    initial_strategy: join_enum_groups_and_group_items_at_read_time
    vector_field: items_index_nums_ordered_by_position
    future_extensions:
      - materialized_enum_group_vector_snapshot_on_promote
    note: screen_data_shape stores enumGroupId only; index_num vector is resolved from DB

  context_route_reconciliation:
    registry_discrete_values: observation_and_recommendation_coordinates_only
    admin_select_authority: enum_dictionary_ssot_and_enum_schema_tables
    rule: context_route_registry_enum_is_not_admin_column_select_ssot

  enum_group_linear_space_coordinate_contract:
    role: state_pressure_recommendation_coordinate_basis
    consumers:
      - docs/design/context-route-recommendation.yaml
    cross_reference_from:
      - hub_local_recommendation_pressure_lanes.lanes.state_pressure
    coordinate_model:
      enum_group: enum.groups.group_id
      selected_item_index: enum.group_items.position_ordered_index_num
      linear_coordinate_formula: >
        When group item count > 1: position_index / (group_item_count - 1).
        When group item count <= 1: 0.
      vector_field_authority: enum.group_items_ordered_by_position
    prohibited:
      - using_operation_transition_stats_for_enum_linear_neighborhood
      - treating_context_token_registry_value_as_enum_index_coordinate
      - mixing_context_transition_stats_with_enum_item_transition_inference

  admin_runtime_actions:
    list_groups: enum_dictionary:list_groups
    get_group: enum_dictionary:get_group
    roster_write_actions_ref: docs/design/admin-master-roster-management-ssot.yaml

  admin_hub_relation_navigation:
    ref: docs/design/admin-console-workflow-ssot.yaml admin_hub_relation_navigation_contract
    status: blocked_pending_seed_catalog
    note: >-
      admin-surface-topology-seed-conversion Bundle. enum_dictionary has no target manifest an
      admin hub relation could resolve to yet: hub relation resolution requires a real per-screen
      ui_projection manifest for enum_dictionary (React-like Schema -> translator -> topology UI
      seed -> seed registration), which does not exist yet — only per-action dispatcher_mapping
      manifests exist today (all 9 enum_dictionary:* actions, already production-mapped and
      unaffected by this Bundle). Authoring the relation itself (source manifest selection,
      sequence position) is not the blocker — that mechanism already exists via /admin/manifests
      (docs/design/admin-console-workflow-ssot.yaml admin_hub_relation_navigation_contract) — the
      blocker is purely the absence of a target. The route itself is unaffected and is not retired
      by this precondition; only hub-reachability is deferred.
