admin_console_workflow_ssot:
  name: topolactor_admin_console_workflow_ssot
  version: 0.3.0
  status: ssot_design_document

  purpose:
    - define admin console page responsibility split and canonical domain ownership
    - define canonical authoring workflow (contents first, hub grouping later)
    - clarify admin/manifests vs admin/hub-navigation boundaries
    - serve as SSOT for admin UI structural decisions affecting routes, islands, and content guides

  owns:
    - admin_page_route_registry and domain_responsibility_split
    - canonical_workflow_step_order
    - hub_navigation_ordering_component_route_contract
    - manifest_single_screen_vs_hub_grouping_boundary

  does_not_own:
    - component_implementation: frontend/islands/*Admin.tsx
    - db_schema: docs/design/db-schema.yaml
    - runtime_orchestration_semantics: docs/design/runtime-orchestration-ssot.yaml
    - css_vocabulary: docs/design/css-dictionary-ssot.yaml
    - ui_ux_primitive_catalog: docs/design/ui-ux-primitive-catalog-ssot.yaml

  manifest_authority_boundary:
    public_manifest_table:
      role: compatibility_and_admin_edit_flow_only
      note: >
        public.manifest is NOT canonical wiring authority. Canonical surfaces are
        topology.wiring_physical_to_package, hubs.topology_manifests,
        topology.physical_tables, topology.schema_registry, and UI topology tables.
    dispatcher_and_projection:
      note: >
        Dispatcher axes and projection_constructor_mapping are backend-derived from
        contents / ui-builder / hub grouping intent — not primary user-edited fields
        in the default authoring path.

# =============================================================================
# Page Responsibility Split
# admin/contents   → manifest単体の内容設定
# admin/import     → contents の data shape への CSV/JSON 投入
# admin/ui-builder → manifest単体の表示・操作 UI
# admin/manifests  → hub / topology_manifest 群の設計（単体内容は置かない）
# admin/hub-navigation → manifest スコープの遷移順序（sequence_position）操作面
# =============================================================================

  page_responsibility:

    admin_contents:
      route: /admin/contents
      island: frontend/islands/ContentsAdmin.tsx
      ux_label: コンテンツ設定
      domain_ownership:
        manifest_single_screen:
          - what one screen (manifest) handles: purpose, data binding, operational intent
          - manual input for entity / relation / hub content when not using file import
        db_design:
          - DB table name, column names, column types
          - relation and join conditions
          - aggregation viewing keys and display columns for aggregated views
          - search target configuration
        import_schema:
          - data shape / schema definition used as prerequisite for admin/import
          - field mapping intent for CSV/JSON rows
        content_bundle_lifecycle:
          - entity / relation / hub browse and draft → validate → preview → promote
      note: >
        Per-manifest content and DB design live here — NOT in admin/manifests.
        hub_relation sequence ordering is NOT owned here (see admin/hub-navigation).

    admin_import:
      route: /admin/import
      island: frontend/islands/AdminImport.tsx
      domain_ownership:
        import_system:
          - CSV / JSON file ingestion against schema/data shape from admin/contents
          - preview (dry-run) → apply (DB write) lifecycle
      prerequisite:
        - manifest single-screen content and data shape defined in admin/contents
      note: >
        Does not define schema; consumes contents-side data shape / schema selection.

    admin_ui_builder:
      route: /admin/ui-builder
      island: frontend/islands/UiBuilderAdmin.tsx
      domain_ownership:
        ui_layout_system:
          - component catalog reference (read-only)
          - bucket: catalog → register → generate → promote
          - layout canvas: drag / drop / resize / snap-to-grid
          - CSS style token selection
          - layout patch: preview → validate → apply
          - form / table / search result view / style for one manifest screen
      prerequisite:
        - contents defines data shape; data available via import or manual input

    admin_manifests:
      route: /admin/manifests
      island: frontend/islands/ManifestsAdmin.tsx
      ux_label: ハブ・画面群
      domain_ownership:
        hub_design:
          - hub assignment and topology_manifest grouping under hubs.hub
          - how multiple manifests are bundled into a hub / navigation graph
          - manifest-to-manifest relation at hub topology level (not per-row DB schema)
        topology_manifest_registry:
          - topology_manifest identity under hubs.topology_manifests
          - manifest_key / hub_id binding completeness
        manifest_grouping:
          - manifest group structure and high-level navigation intent between screens
      explicitly_out_of_scope:
        - per-manifest DB table / column / type editing
        - per-manifest search target / aggregation viewing configuration
        - per-manifest dispatcher axes as primary user input
        - raw manifest JSON / constructorKey / packageIds editing in default path
        - CSV/JSON import schema definition
      note: >
        Hub and manifest-group design only. Single-screen content → admin/contents.
        Sequence position mutations → admin/hub-navigation (operational ordering surface).

    admin_hub_navigation:
      route: /admin/hub-navigation
      island: frontend/islands/HubNavigationAdmin.tsx
      domain_ownership:
        hub_relation_ordering:
          - manifest-scoped hubs.hub_relations sequence_position CRUD and reorder
          - page navigation transition order between topology_manifests sharing hub context
      relationship_to_admin_manifests:
        admin_manifests_owns: hub grouping intent, topology_manifest registry, which manifests belong to which hub
        hub_navigation_owns: ordered hub_relations rows (sequence_position) for runtime NavigationSequence
      note: >
        Not a duplicate of admin/manifests — manifests plans the group; hub-navigation
        executes ordered relation rows. Both reference hubs.topology_manifests.

    admin_runtime:
      route: /admin/runtime
      island: frontend/islands/OperationPanel.tsx
      domain_ownership:
        runtime_verification:
          - dispatch execution verification via operation presets
          - emission projection display
          - SQL Attention projection panel
      note: final verification step; all prior registration must be complete

# =============================================================================
# Canonical Workflow Sequence
# =============================================================================

  canonical_workflow:

    - step: 1
      label: manifest_content_and_db_design
      route: /admin/contents
      domains: [manifest_single_screen, db_design, import_schema]
      description: >
        Define what one manifest screen handles: DB tables/columns/types, relations/joins,
        search targets, aggregation viewing, manual input, and import data shape / schema.

    - step: 2a
      label: import_csv_json
      route: /admin/import
      domains: [import_system]
      description: >
        Upload CSV/JSON using data shape from contents; preview → validate → apply.
      condition: when file ingestion is required
      prerequisite: step 1

    - step: 2b
      label: manual_content_input
      route: /admin/contents
      domains: [manifest_single_screen, content_bundle_lifecycle]
      description: >
        Register or update content bundles by hand when not using file import.
      condition: when manual registration is needed instead of file import
      prerequisite: step 1

    - step: 3
      label: ui_builder_layout
      route: /admin/ui-builder
      domains: [ui_layout_system]
      description: >
        Build display and operation UI (components, layout, form, table, search views, styles).
        Package wiring and projection mapping are backend-generated/validated.
      prerequisite: step 2a or 2b

    - step: 4
      label: hub_and_manifest_grouping
      route: /admin/manifests
      domains: [hub_design, topology_manifest_registry, manifest_grouping]
      description: >
        Group manifests under hubs via topology_manifest; define manifest-group relations
        and navigation intent. Does not edit per-manifest DB schema or raw manifest JSON.

    - step: 4b
      label: hub_navigation_sequence
      route: /admin/hub-navigation
      domains: [hub_relation_ordering]
      description: >
        Set ordered hub_relations (sequence_position) for multi-screen navigation transitions.
      condition: when ordered page transitions are required
      prerequisite: step 4

    - step: 5
      label: registration_and_verification
      route: /admin/runtime
      domains: [runtime_verification]
      description: >
        Verify registered configuration via dispatch execution.
      prerequisite: all required prior steps

# =============================================================================
# Hub Navigation Ordering Component Specification
# =============================================================================

  hub_navigation_ordering_component:
    route: /admin/hub-navigation
    island: frontend/islands/HubNavigationAdmin.tsx
    route_file: frontend/routes/admin/hub-navigation.tsx
    purpose: >
      Operational surface for ordered hub_relations rows (sequence_position) under a
      selected topology_manifest. Grouping intent is authored in admin/manifests first.
    lifecycle:
      - select_topology_manifest
      - view_hub_relations_for_manifest
      - create_hub_relation
      - update_hub_relation
      - deprecate_hub_relation
      - reorder_hub_relations
    responsibility_split:
      in_scope:
        - sequence_position mutations on hubs.hub_relations
        - runtime NavigationSequence consumer wiring (HubNavigationResolver)
      out_of_scope:
        - per-manifest DB/schema/content: admin/contents
        - hub grouping / topology_manifest registry design: admin/manifests
        - component layout: admin/ui-builder
    db_binding:
      primary_table: hubs.hub_relations
      supporting_tables:
        - hubs.hub
        - hubs.topology_manifests
    admin_guide_key: ADMIN_HUB_NAVIGATION_GUIDE
    flow_step_key: ADMIN_MAIN_FLOW_STEPS

# =============================================================================
# Wiring / Projection Boundary
# =============================================================================

  wiring_placement:
    canonical_location: topology.wiring_physical_to_package
    intent_sources:
      - admin/contents (data and operation intent for one screen)
      - admin/ui-builder (layout and component intent)
      - admin/manifests (hub grouping and cross-manifest navigation intent)
    compatibility_mirror: public.manifest
    prohibited:
      - treating public.manifest as canonical authority
      - primary user input of dispatcher axes in admin/manifests
      - per-manifest DB design in admin/manifests
    advanced_debug_only:
      - raw dispatcher axis override (legacy compat paths only)
      - projection_constructor_mapping JSON (constructorKey, packageIds, fieldDefs, etc.)

# =============================================================================
# AdminMainFlowStepper Contract
# =============================================================================

  admin_main_flow_stepper:
    source_file: frontend/islands/AdminMainFlowStepper.tsx
    data_source: frontend/content/adminGuides.ts ADMIN_MAIN_FLOW_STEPS
    current_steps:
      - step: 1
        label: ログイン
        href: /auth
      - step: 2
        label: コンテンツ設定
        href: /admin/contents
      - step: 3
        label: データ取り込み
        href: /admin/import
        sub_steps:
          - label: CSV/JSONインポート
            href: /admin/import
          - label: 手動登録
            href: /admin/contents
      - step: 4
        label: 画面づくり
        href: /admin/ui-builder
      - step: 5
        label: ハブ・画面群
        href: /admin/manifests
        sub_steps:
          - label: ハブ設計
            href: /admin/manifests
          - label: 遷移順序
            href: /admin/hub-navigation
      - step: 6
        label: 動作確認
        href: /admin/runtime
    note: >
      ADMIN_MAIN_FLOW_STEPS in adminGuides.ts must match this contract.
