admin_console_workflow_ssot:
  name: topolactor_admin_console_workflow_ssot
  version: 0.9.0
  status: subordinate_design_document

  authority:
    canonical_admin_route_registry: docs/design/runtime-orchestration-ssot.yaml frontend_routes.admin
    note: >
      This document is subordinate to runtime orchestration. It describes the admin UI
      responsibility split but MUST NOT add canonical admin routes outside that registry.
    canonical_routes:
      - /admin
      - /admin/manifests
      - /admin/contents
      - /admin/ui-builder
      - /admin/team-dashboard

  purpose:
    - keep the admin authoring routes aligned with runtime-orchestration route authority
    - define the canonical sequential authoring pipeline (single submit per numbered step, sequential DB persistence) for /admin/contents steps 1–3
    - define /admin/contents as steps 1–3 of that pipeline (manifest shell through physical page binding)
    - define /admin/ui-builder as a canvas workspace route (NOT a pipeline step): full-width canvas with docked panels; no separate surfaces, no sequential step framing
    - define canvas_workspace_contract: panel layout, flow layout projection, tree-centric layout authoring, live design preview, _tmp auto-save, layer_inspector, design_inspector, html_tag allowlist
    - define /admin/manifests as post-contents hub / relation / navigation management
    - record removed legacy or debug wrapper routes so implementation can converge on canonical surfaces

  does_not_own:
    - runtime_orchestration_semantics: docs/design/runtime-orchestration-ssot.yaml
    - component_implementation: frontend/islands/*Admin.tsx
    - db_schema: docs/design/db-schema.yaml
    - css_vocabulary: docs/design/css-dictionary-ssot.yaml
    - ui_ux_primitive_catalog: docs/design/ui-ux-primitive-catalog-ssot.yaml
    - ui_topology_bucket_package_tensor_persistence: docs/framework-policy.yaml ui_topology_tensor_persistence

  # ---------------------------------------------------------------------------
  # Canonical sequential pipeline (owner authority for admin authoring order)
  # ---------------------------------------------------------------------------

  canonical_sequential_authoring_pipeline:
    name: admin_no_code_sequential_authoring
    persistence_model: single_submit_per_numbered_step_sequential_db_update
    rule: >
      Each numbered step exposes one primary submit. Submit sends intent to backend admin_runtime;
      backend performs the DB updates for that step only, in order. Frontend does not write DB
      directly and does not merge unrelated steps into one submit. Later steps assume earlier
      step persistence succeeded; failures are explicit (no silent fallback).
    optional_within_step_readiness:
      note: >
        Read-only validate or preview may exist inside a step before submit, but they do not
        replace the single submit that persists the step. Legacy validate→preview→promote as three
        separate persistence gates across steps 1–3 is superseded by this pipeline for new work.
    steps:
      - step: 1
        label: manifest_empty_register
        route: /admin/contents
        user_facing_goal: マニフェストを空登録し、わかりやすいトポロジー名を最低限登録する
        submit_persists:
          - empty manifest draft shell
          - user_facing_topology_label_minimum
        backend_targets:
          - manifest row with draft lifecycle
          - topology naming fields sufficient for later steps to reference the manifest
        prohibited:
          - requiring full screen_data_shape before first submit
          - silent_skip_when_topology_label_missing

      - step: 2
        label: logical_table_definitions
        route: /admin/contents
        user_facing_goal: テーブル定義（jsonb 内カラム名と型）を登録する。複数テーブル登録可
        submit_persists:
          - one_or_more logical table definitions
          - per_table column definitions inside jsonb shape intent
          - column types from normal-view candidates (text, integer, bigint, boolean, numeric, timestamp with time zone, date, jsonb, uuid, varchar, enum)
          - optional enumGroupId per column when dataType is enum, referencing enum.groups.group_id canonical dictionary
        enum_group_column_UI:
          visible_when: column_dataType_is_enum
          normal_view: select_from_enum_dictionary_list_groups
          reference_ssot: docs/design/enum-dictionary-ssot.yaml
          prohibited: hardcoded_select_option_lists_in_frontend
        column_type_UI:
          normal_view: select
          advanced_or_other: isolate_free_text_input
        multi_table_policy: multiple_tables_per_submit_allowed
        prohibited:
          - collapsing step 1 and step 2 into one submit unless backend explicitly implements an atomic bundle action registered in manifest dispatcher

      - step: 2.5
        label: relationship_configuration
        route: /admin/contents
        user_facing_goal: テーブル間の relationship を設定する
        submit_persists:
          - structured relation or join intent between logical tables authored in step 2
          - minimum relation_config needed for screen_data_shape and later physical binding
        boundary:
          manifest_to_manifest_hub_navigation: remains_on_admin_manifests_not_step_2_5
          relationship_local_side:
            scope: editing_draft_manifest_only
            fields: [local_table_ref, local_key]
            prohibited: [active_manifest_table_as_local_side]
          relationship_remote_side:
            scope: draft_logical_tables_or_active_manifest_tables
            draft_remote: join_table_ref plus remote_key on same editing draft logical tables
            active_remote: remote_manifest_id plus join_table_ref plus remote_key on status_active manifest screen_data_shape
            admin_action_list_targets: manifest:list_relationship_remote_targets
          fail_close:
            - unresolved_remote_manifest_table_or_column_must_blocking_error
            - silent_fallback_to_draft_only_remote_targets_prohibited

      - step: 3
        label: physical_table_and_page_binding
        route: /admin/contents
        user_facing_goal: 物理テーブル割り当て・ページ名・操作種別（複数選択可）
        submit_persists:
          - physical_tables assignment (table_ref derived from step 2 primary logical table name against topology.physical_tables; no separate normal-view manual table_ref or import_schema_name inputs)
          - page display name / screen label
        normal_view_ui_excludes:
          - manual_text_input_for_table_ref
          - manual_text_input_for_import_schema_name
          - duplicate_csv_import_schema_picker_above_data_input_subfeature
          - screen_operation_kinds as multi_select (not radio single-select)
          - separate_display_columns_checkbox_block_duplicating_operation_entity_bindings
        form_submit_semantics:
          default_entity_mutation: add_only
          note: >
            Form submit in the default no-code path is semantically add (create entity) only.
            update/delete/edit flows require explicit separate operations or advanced surfaces;
            they must not be implied by the default single-page authoring submit.
        enum_backed_initial_data:
          rule: columns_with_enumGroupId_use_select_not_free_text
          unresolved_enum_group: blocking_error_no_silent_fallback
          admin_actions: [enum_dictionary:list_groups, enum_dictionary:get_group]
        search_aggregation_display:
          column_roles_contract:
            summary: >
              Step 3 authors three distinct column roles. Do not conflate UI projection, aggregation
              grouping, and search targets. Normal view must not expose duplicate checkbox UIs for the
              same column pool.
            operation_entity_bindings:
              user_label_ja: 操作ごとの対象項目
              topology_field: screen_data_shape.operationEntityBindings[].entityTargetColumns
              meaning: >
                Per screen_operation_kind (list, create, search, …), which qualified columns are in
                scope when that operation runs and which columns the author expects on the end-user UI.
              authoring_surface: matrix_checkboxes_columns_by_operation_kind
              sample_preview: projects_union_of_entityTargetColumns_for_selected_operationKinds
              save_derivation: >
                On toggle and Step 3 save, derive displayColumns as the union of checked columns
                (stable order from step3_field_source) and set displayColumnMode=selected when non-empty.
              distinct_from: [aggregation_key, search_key_columns]
            aggregation_key:
              user_label_ja: 集計キー
              topology_field: screen_data_shape.aggregationKey
              meaning: >
                Optional single column used as the GROUP BY axis for aggregation sample preview and
                grouped measure evaluation. Not the same as “which columns appear on the page”.
              authoring_surface: single_select_dropdown
              UX_label_must_not_use: group by
            aggregation_measures:
              user_label_ja: 集計式
              topology_field: screen_data_shape.aggregationMeasures
              meaning: column plus function pairs (e.g. salary sum, salary max) evaluated per aggregation_key group or globally
            display_columns:
              user_label_ja: 表示列（保存用・ランタイム投影）
              topology_field: screen_data_shape.displayColumns
              meaning: >
                Persisted projection list for read/search runtime and screenReadQueryWiring. Not
                separately authored in Step 3 normal view; derived from operation_entity_bindings.
              authoring_surface: none_in_step3_normal_view
              runtime_consumers: [ScreenDataShapeQueryEvaluator, screenReadQueryWiring, ui_builder_binding_candidates]
            displayColumnMode:
              topology_field: screen_data_shape.displayColumnMode
              meaning: >
                Runtime mode for row-column projection when evaluating read/search shape. Step 3 UI
                does not expose mode radios; save sets selected when derived displayColumns non-empty,
                none only when legacy aggregate-only shape already stored.
              authoring_surface: none_in_step3_normal_view
            search_key_columns:
              topology_field: screen_data_shape.searchKeyColumns
              meaning: columns eligible as search operation targets (separate from list/create projection)
          may_be_same_submit_or_follow_up_submit:
            - operation_entity_bindings matrix (per operation kind)
            - aggregation_key optional single column (grouping axis)
            - aggregation_measures multi_row column plus function pairs
            - sample_viewing preview driven by operation_entity_bindings projection
            - search_key_columns when search operation kind selected
          progressive_disclosure_ui:
            basic_first: [operation_entity_bindings, aggregation_key, aggregation_measures, sample_viewing]
            advanced_disclosed: [searchConditions_editor, havingConditions_editor]
            pro_disclosed: [logicalConnector_and_or_not, raw_searchTargets, raw_aggregationSpec]
            searchConditions_zero_state: show_add_search_condition_call_to_action_only_no_operator_or_value_inputs
            logicalConnector_visibility: show_only_from_second_condition_onward
            havingConditions_visibility: show_only_when_aggregation_measures_exist
          UX_vocabulary:
            normal_view_prohibited: [group by, 表示列の範囲 as duplicate checkbox block, second column picker for same role as 操作ごとの対象項目]
            normal_view_preferred: [操作ごとの対象項目, 集計キー, 集計式, サンプル表示, 検索キー]
          legacy_migration:
            displayColumns_without_bindings: >
              When loading a draft with displayColumns but empty operationEntityBindings, hydrate the
              primary operation kind (usually list) entityTargetColumns from displayColumns once so
              authors do not re-check columns manually.
          search_conditions:
            searchConditions: >
              Array of condition objects: { column, operator, value?, valueTo?, values?, logicalConnector? }.
              Operators: =, !=, <>, like, ilike, not like, >, >=, <, <=, between, in, not in, is null, is not null.
              logicalConnector: and | or | not (joins to the next condition).
              between uses value and valueTo. in/not in use values array. is null/is not null use no value fields.
            havingConditions: >
              Array of HAVING conditions on aggregation measure results: { column, function, operator, value }.
              operator: =, !=, <>, >, >=, <, <=.
            displayColumnMode_runtime_values:
              note: persisted for read/search evaluator; not authored via Step 3 normal-view radios
              selected: row projection uses displayColumns (derived from operation_entity_bindings on save)
              all: all columns from filtered rows (legacy shapes only unless explicitly set by advanced tooling)
              none: aggregate-only preview — no row columns in sample table
            searchOperators:
              - "="
              - "!="
              - "<>"
              - "like"
              - "ilike"
              - "not like"
              - ">"
              - ">="
              - "<"
              - "<="
              - "between"
              - "in"
              - "not in"
              - "is null"
              - "is not null"
            logicalOperators: [and, or, not]
          displayColumnMode_ambiguity_resolution:
            prior_behavior: empty displayColumns was ambiguous (could mean all or none); authors also picked display columns separately from operation targets
            current_authoring_behavior: >
              operation_entity_bindings is the single normal-view source of truth for which columns
              appear in sample tables; displayColumns mirrors that union on save.
            runtime_behavior: >
              displayColumnMode=selected plus non-empty displayColumns limits row projection.
              displayColumnMode=all shows all row keys. displayColumnMode=none hides row columns in sample.
            migration: legacy entries without displayColumnMode default to selected when displayColumns is non-empty, all when empty; hydrate bindings from displayColumns when bindings missing
          relation_intent_step_2_5:
            local_side: local_table_ref plus local_key column select (editing draft logical tables only)
            remote_side_draft: join_table_ref plus remote_key on editing draft logical tables
            remote_side_active: remote_manifest_id plus join_table_ref plus remote_key on active manifest logical tables
            example: user table id column links to employee table user_id column on another active manifest
          step3_field_source:
            rule: >
              Qualified column keys for Step 3 (operation_entity_bindings matrix, aggregation_key
              dropdown, aggregation_measures column picks, initial data grid, search_key_columns)
              come from editing-draft logicalTables plus columns resolved from step 2.5
              relationIntents (draft-remote join_table_ref on same draft tables, active-remote via
              manifest:list_relationship_remote_targets). Sample table columns are the union of
              entityTargetColumns for selected operation kinds — not a second display-column picker.
              Draft-only column list when relations point at active manifests is prohibited (no silent fallback).
            implementation_refs:
              - frontend/lib/screenSampleProjection.ts
              - frontend/islands/ContentsScreenDesignPanel.tsx
            active_remote_key_collision: >
              When a local qualified key would collide with an active-remote column, disambiguate
              tableRef with manifest id suffix (e.g. employees@00000000.name) so local and remote
              homonyms remain distinct.
            unresolved_relation: blocking_error_on_step_3_submit_and_visible_warning_in_ui
            active_remote_manifest_infer:
              when: join_table_ref not on editing draft and remote_manifest_id omitted
              rule: infer remote_manifest_id when exactly one active list_relationship_remote_targets manifest defines join_table_ref and remote_key; ambiguous matches remain blocking
        fail_close:
          - unresolved topology.physical_tables table_ref mismatch must not silent_no_op
        handoff_after_success: /admin/ui-builder

  # ---------------------------------------------------------------------------
  # UI Builder canvas workspace (/admin/ui-builder)
  # NOT a pipeline step — a standalone canvas workspace route entered after
  # contents pipeline (steps 1–3) produces a manifest with physical binding.
  # ---------------------------------------------------------------------------

  ui_builder_canvas_workspace:
    route: /admin/ui-builder
    entered_after: canonical_sequential_authoring_pipeline steps 1–3
    user_facing_goal: >
      ルートを選ぶと canvas workspace がすぐ使え、左パネルの部品カードを canvas にドロップして
      配置・デザインを統合編集する。パッケージ化は暗黙（route_key 確定時の自動生成 + drop 時の自動追加）。
      canvas が主対象であり、画面遷移・タブ切り替えなしで操作が完結する。
    design_rationale: >
      Canvas renders actual catalog component previews in a flow-based layout tree — not wireframe
      rectangles or abstract boxes. Layout structure is authored primarily via layer_inspector
      (tree reparent/reorder + container layoutClassRefs). Design properties (inlineText, tokens,
      spacing, responsive overrides) apply live on the selected node so the canvas stays as close
      to production rendering as the component registry allows.
      Because the canvas IS the live preview, a separate read-only preview surface is unnecessary.
      Because design is applied to the selected canvas object via a docked inspector panel,
      a separate design editor surface is unnecessary.
      Implementation MUST NOT introduce tabs, separate routes, or pipeline-step framing
      for placement vs design vs preview within this workspace.
    layout_projection_model:
      status: adopted
      adopted_policy: flow_layout_default
      default_placement: flow
      placement_authority:
        primary_fields:
          - parentNodeId
          - orderIndex
          - layoutClassRefs
          - slotKey
        container_semantics_ref: docs/design/topology-layout-class-ssot.yaml
        note: >
          Sibling order and parent nesting define DOM structure. Container nodes use layoutClassRefs
          (stack, flex row, grid) to arrange children in normal document flow.
      spacing_authority:
        - cssTokenRefs spacing vocabulary (margin, padding, gap) per css-dictionary-ssot
        - responsiveTokenRefs per breakpoint for spacing and presentation tokens
        note: x/y are NOT padding. Spacing is edited via design_inspector tokens only.
      sizing_authority:
        fields: [width, height]
        allowed_units: [px, percent, auto]
        projection: flow_css_width_height
        note: width/height apply as normal CSS box sizing within the parent flow container.
      deprecated_absolute_geometry:
        fields: [x, y]
        former_semantics: position_absolute_left_top_px
        migration_rule: >
          Legacy layout_patch_json rows that only carry x/y absolute coordinates MUST be migrated
          to flow tree placement explicitly. Silent reinterpretation of x/y as padding or flow offset
          is prohibited.
      prohibited_dom_projection:
        - position_absolute_as_default_for_layout_patch_nodes
        - mapping_x_y_to_left_top_px_in_flow_mode
        - canvas_drag_as_primary_layout_authoring_for_coordinates
      layout_vs_design_split:
        layout_authoring_surface: layer_inspector
        layout_responsibilities:
          - parentNodeId nesting
          - orderIndex sibling order
          - layoutClassRefs on container nodes
          - slotKey assignment
        design_authoring_surface: design_inspector
        design_responsibilities:
          - inlineText and link fields with live canvas reflection
          - cssTokenRefs and responsiveTokenRefs
          - typography and spacing tokens
          - reactionIntent presentation
        canvas_role: >
          Live flow-layout preview plus selection target. Layout structure changes are driven from
          layer_inspector tree operations, not free-floating coordinate drag on the canvas.
      optional_future:
        overlay_placement_mode:
          status: deferred
          note: >
            Explicit placementMode overlay (position absolute for modals, badges, tooltips only)
            may be added later. It is not the default and must not restore absolute canvas authoring.
    edit_target_contract:
      sole_authoring_target: package
      rule: >
        The canvas workspace selects and mutates packages only.
        Bucket rows, bare component catalog entries, and unpackaged component ids are not
        parallel edit targets. Placement and design are both scoped to the selected package.
    authoring_flow:
      label: canvas_workspace_edit
      user_facing_label: canvas workspace で配置・デザインを編集
      note: >
        Single unified flow. No separate packaging phase, checkbox selection submit, or explicit
        「パッケージ化」button. route_key is the entry gate; package is implicit infrastructure.
      responsibilities:
        - user selects or enters route_key; canvas workspace unlocks immediately for that route
        - package_auto_generation:
            trigger: route_key committed (select or blur on manual input)
            rule: if no package exists for route_key, call package_generator:promote_package with empty bucketItemIds[]
            effect: yields package_id, layout_id, wiring_id (shell package, idempotent when already exists)
            fail_close: errors must surface explicitly; no silent fallback
        - component_auto_registration:
            trigger: catalog component card dropped onto canvas (or keyboard add equivalent)
            backend: ui_component_bucket:create (if absent) then package_generator:promote_package with new bucketItemId
            rule: skip when component already in package (idempotent)
            effect: component bound to route package, then catalog_component node placed on canvas
        - component_auto_removal:
            trigger: canvas node deleted and no remaining canvas nodes share the same componentKey
            backend: package_generator:detach_package_components for route_key + componentKey
            effect: component removed from package membership; canvas/layout draft already updated locally
        - layout_patch backend actions: preview → validate → apply for placement persistence
        - component_style_design:upsert for design token persistence (separate backend action from layout_patch)
        - optional per-component wiring under package scope; raw dispatcher fields in advanced disclosure only
        - preset_ecosystem:
            role: ui_builder_authoring_support
            status: planned_parent_surface
            rule: >
              Presets are reusable draft/seed/view structures under the UIBuilder ecosystem.
              They are not active topology until explicitly bound to a selected route package
              and applied through the existing preview / validate / apply boundary.
            workspace_boundary:
              - UIBuilder remains a package-only canvas workspace.
              - preset load binds into the selected route package tmp canvas draft before human adjustment.
              - human author adjusts layout / wiring / binding before preview / validate / apply.
              - preview / validate / apply boundary is not skipped by preset save or preset load.
              - preset seed completeness determines UX quality for rehydrate / refresh / clone / rebind.
              - completed_preset_seed_json is the hard gate for saved view / md viewer surfaces.
            capabilities:
              preset_mock_save:
                role: save external SVG/XML/Figma-like mock or current canvas state as a reusable preset
                reference_ssot: docs/design/mock-preset-intake-compiler-ssot.yaml
              preset_load_into_selected_package_tmp_canvas_draft:
                role: bind a selected saved preset to the selected route package tmp canvas draft
                active_topology_write: prohibited_until_explicit_preview_validate_apply
              preset_seed_rehydrate_refresh_clone_and_rebind:
                role: preserve completed seed data for saved view UX and md viewer continuity
                hard_gate: completed_preset_seed_json
            provisional_presets:
              aggregate_dashboard:
                role: aggregation / grouped measure / dashboard card surface
              hub_search:
                role: hub relation / manifest relation / topology search surface
              physical_search_crud_aggregate:
                role: physical table / jsonb record search, CRUD, aggregation surface
              physical_details_inline_editor_md_generator:
                role: physical record detail view, inline edit, Markdown saved view generation surface
              md_viewer:
                role: saved Markdown view search card / click expand drawer_or_panel
                child_surface: team-markdown-dashboard-saved-view
                hard_gate: completed_preset_seed_json
                reference_ssot: docs/design/team-markdown-dashboard-saved-view-ssot.yaml
            child_ssots:
              mock_preset_intake_compiler:
                ref: docs/design/mock-preset-intake-compiler-ssot.yaml
                role: external_mock_or_canvas_to_reusable_preset
              team_markdown_dashboard_saved_view:
                ref: docs/design/team-markdown-dashboard-saved-view-ssot.yaml
                role: preset_child_saved_markdown_view_seed_and_md_viewer
                hard_gate: completed_preset_seed_json
            implementation_status:
              current: planned_parent_surface
              scope: >-
                preset_ecosystem parent surface is planned for UIBuilder authoring support for reusable
                draft/seed/view children. md_viewer is now a dashboard/read-work component candidate
                placed on /admin/team-dashboard; the permanent UIBuilder child surface placement of
                Team Markdown Dashboard has been removed to resolve responsibility mixing.
                md_viewer.projection is shown in DashboardCandidatePalette in UIBuilder canvas
                (dashboard_placement_candidate tag; registrationRequired:false; DB bucket registration
                not required). Provisional preset surfaces (aggregate_dashboard, hub_search,
                physical_search_crud_aggregate, physical_details_inline_editor_md_generator) remain
                planned until each has its own SSOT and implementation.
      prohibited:
        - explicit packaging button, confirm-then-package dialog, or checkbox multi-select submit as primary path
        - two-step select-then-package phase framing
        - text-only list presentation for bucket components in the primary left panel
        - authoring layout or design against bucket rows, catalog-only entries, or non-package roots
        - treating promoted_palette component list as the edit root instead of package
        - separate tab, route, or surface for placement vs design vs preview
      canvas_workspace_contract:
          overview: >
            The canvas workspace is the primary UI of /admin/ui-builder.
            It occupies the full remaining width of the viewport after docked panels are reserved.
            All placement, design, and preview happens inside the canvas workspace — no tab switching,
            no surface transitions, no separate read-only preview route.
          screen_layout:
            left_panel:
              position: fixed left, docked
              panels:
                component_bucket_panel:
                  content: catalog components as icon-style small cards
                  interaction: drag card onto canvas to place a catalog_component node
                html_tag_panel:
                  content: structural HTML tags from the allowlist as palette items
                  interaction: drag tag onto canvas to place a structural_html node
            center_canvas:
              position: "full remaining width (width: 100% of viewport minus docked panels)"
              rendering: >
                Renders the package layout as a flow-based DOM tree with actual catalog component
                previews and structural HTML nodes. NOT wireframe rectangles or placeholder boxes.
                design_inspector edits (inlineText, tokens, spacing, responsive overrides) MUST
                reflect on the canvas immediately with production-faithful rendering where the
                component registry and css-dictionary allow. Canvas state always reflects the
                current draft (including _tmp auto-saved state).
              layout_authoring_surface: layer_inspector
              node_interaction:
                - click to select; selection drives both inspector panels
                - layout structure via layer_inspector tree drag (reparent, reorder) — primary layout UX
                - design_inspector edits apply live to the selected node preview (WYSIWYG)
                - delete key or panel button to remove node
              prohibited_as_primary_layout_affordance:
                - free-drag x/y coordinate placement on canvas
                - resize handles that persist absolute geometry as the sole layout model
              design_rationale_for_no_separate_preview: >
                Canvas renders actual components in flow layout, so the canvas itself IS the live
                preview. A separate visual_view tab or route adds no information and is prohibited.
            right_panel:
              position: fixed right, docked
              panels:
                layer_inspector:
                  purpose: primary layout authoring — tree structure, container layout class, slot assignment
                  responsibilities:
                    - display full node tree (parentNodeId hierarchy) for the selected package
                    - click any tree node to select it (drives center canvas + design_inspector)
                    - drag tree nodes to reparent (change parentNodeId) or reorder (change orderIndex)
                    - assign layoutClassRefs on container nodes (stack / flex / grid per topology-layout-class-ssot)
                    - show slotKey and orderIndex per node; allow inline edit
                    - no free-floating move-up/down arrow buttons; tree drag IS the reorder affordance
                    - flow layout is the default; this panel IS the normal layout editing surface
                  required_fields_shown: [nodeId, nodeKind, componentKey or htmlTag, parentNodeId, slotKey, orderIndex, layoutClassRefs]
                design_inspector:
                  purpose: edit presentation properties of the selected canvas node with live canvas preview
                  responsibilities:
                    - cssTokenRefs: color, background, border, radius, shadow via css-dictionary-ssot vocabulary
                    - responsiveTokenRefs: responsive breakpoint token overrides
                    - typography tokens: font family, size, weight, line-height from css-dictionary-ssot
                    - spacing tokens: margin, padding, gap from css-dictionary-ssot
                    - inlineText: editable text content — MUST reflect on center canvas immediately
                    - linkHref and linkTarget: for anchor (a) nodes — MUST reflect on center canvas immediately
                    - reactionIntent: interaction presentation intent (hover, active, focus behaviors)
                    - live_preview_contract: >
                        design _tmp auto-save and center canvas rendering MUST stay in sync so authors
                        see production-faithful output while typing or toggling tokens (within registry limits).
                    - layoutClassRefs on containers: may be surfaced here as read-only or delegated to layer_inspector; container layout class assignment authority is layer_inspector
                    - no-selection state: shows placeholder "ノードを選択してください" — no empty panel
                  style_vocabulary_authority_ref: docs/design/css-dictionary-ssot.yaml
                  layout_class_authority_ref: docs/design/topology-layout-class-ssot.yaml
                  prohibited:
                    - raw tailwind strings or raw className as the normal authoring path
                    - freeform CSS input in the default view (advanced disclosure only)
            status_bar:
              position: bottom, fixed
              content:
                - current _tmp draft state indicator (unsaved / auto-saved / applied)
                - layout_patch action buttons: preview / validate / apply
                - apply clears _tmp and promotes draft to persisted state
          draft_persistence_model:
            rationale: >
              Web sessions can be interrupted. Canvas auto-saves all operations to _tmp so
              authors can resume without data loss. Explicit apply is required to promote to
              persisted state and remove _tmp.
            auto_save:
              trigger: any canvas placement, move, resize, delete, or design token change
              storage: _tmp attribute on the layout/design record
            promote:
              trigger: explicit layout_patch:apply call
              effect: removes _tmp marker; draft becomes persisted state
            backend_actions:
              placement_pipeline:
                - layout_patch:preview
                - layout_patch:validate
                - layout_patch:apply
              design_persistence:
                - component_style_design:upsert
            persists_under:
              - topology.components_layout_design
              - topology.ui_topology_tensor layout_patch_json
              - topology.components_style_design
          node_kind_contract:
            catalog_component:
              description: promoted palette or component registry entry bound inside the package
              required_fields: [nodeId, componentKey, parentNodeId, slotKey, orderIndex]
              canvas_rendering: renders actual component preview (LayoutPreviewNodeFrame)
            structural_html:
              description: Preact-renderable HTML scaffold node; first-class canvas node same as catalog_component
              required_fields: [nodeId, nodeKind, htmlTag, parentNodeId, slotKey, orderIndex]
              canvas_rendering: renders actual HTML element preview with inlineText / linkHref if set
              html_tag_allowlist:
                block: [div, section, article, aside, header, footer, main, nav]
                heading: [h1, h2, h3, h4, h5, h6]
                text: [p, span, strong, em, blockquote, pre, code]
                link: [a]
                form: [form, fieldset, legend, label, button, input, textarea, select, option]
                media: [img, picture, figure, figcaption, video, audio]
                list: [ul, ol, li, dl, dt, dd]
                table: [table, thead, tbody, tfoot, tr, th, td, caption]
              extension_policy: allowlist changes require SSOT amendment only; no unilateral implementation additions
          accessibility_ref: docs/system-roadmap.yaml admin_visual_layout_builder keyboard_or_button_alternatives_for_drag_move_resize_and_reorder
          prohibited:
            - separate tab, route, or modal for layout editing vs design editing vs preview
            - wireframe rectangles or abstract placeholder boxes as the canvas rendering primitive
            - visual_view as a separate surface (canvas IS the preview)
            - component_design_editor as a separate surface (design_inspector IS the design surface)
            - position_absolute_as_default_dom_projection_for_layout_patch_nodes
            - canvas_free_drag_coordinate_placement_as_primary_layout_authoring
            - treating_x_y_as_padding_or_flow_offset
            - raw className, raw tailwind, or inline style as the normal authoring path
            - frontend direct DB write
            - non-package roots for layout or design authoring
            - implementation_convenience_shortcuts_that_add_surfaces_not_in_this_contract
    prohibited:
      - non_package_roots_for_layout_or_design_authoring
      - ui_topology_component_catalog_only_interpretation_without_db_persistence
      - direct_DB_write_from_frontend
      - tab_based_or_step_based_surface_separation_for_layout_vs_design_vs_preview
      - framing_ui_builder_as_a_pipeline_step_or_workflow_step

  # ---------------------------------------------------------------------------
  # Other admin routes (post-contents, master rosters)
  # ---------------------------------------------------------------------------

  other_admin_routes:
    post_contents_surfaces:
      - route: /admin/manifests
        label: created_manifest_hub_relation_navigation
        note: >
          Hub membership, manifest-to-manifest relations, and navigation ordering for already-created
          manifests are not part of sequential steps 1–4. They remain on /admin/manifests.

    master_roster_routes:
      - route: /admin/enums
        label: enum_dictionary_roster
        island: frontend/islands/AdminEnumsRoster.tsx
        note: >
          Pipeline-external master data. Enum group/item CRUD via admin_runtime enum_dictionary write
          actions. Text search, show-all, modal create, row-click inline update, confirm delete.
      - route: /admin/users
        label: auth_users_roster
        island: frontend/islands/AdminUsersRoster.tsx
        note: >
          Pipeline-external master data. User roster and state (approve, status select from user_status
          seed, suspension window, state_note). last_login_at is readonly projection.

  shared_authoring_boundary:
    contents_pipeline_persistence_model_ref: canonical_sequential_authoring_pipeline.persistence_model
    prohibited:
      - direct_DB_write_from_admin_UI
      - silent_fallback_or_silent_write
      - adding_noncanonical_admin_or_dev_admin_helper_routes
      - treating_frontend_projection_as_runtime_judgment_owner
      - merging contents pipeline steps 1, 2, 2.5, 3 into one frontend submit unless backend exposes one registered bundle action for that atomicity
      - framing_ui_builder_as_a_pipeline_step

  page_responsibility:
    admin_index:
      route: /admin
      responsibility: canonical admin authoring entry; presents contents pipeline (steps 1→3) → /admin/ui-builder canvas workspace → optional /admin/manifests

    admin_contents:
      route: /admin/contents
      island: frontend/islands/ContentsAdmin.tsx
      ux_label: マニフェスト登録・テーブル定義・物理テーブル割当（パイプライン step 1–3）
      pipeline_steps: [1, 2, 2.5, 3]
      domain_ownership:
        - step 1 manifest empty register with user-facing topology label minimum
        - step 2 logical table definitions (jsonb columns and types, multiple tables)
        - step 2.5 relationship configuration between logical tables
        - step 3 physical table assignment, page name, multi-select operation kinds, event-time entity binding, add-only default form submit semantics
        - optional search key, aggregation, display group (same step 3 submit or explicit follow-up submit documented in UI)
        - step 3 data input subfeature: manual initial-data rows and CSV/JSON import (preview → explicit apply via admin_csv_json_import; not a canonical /admin/import route)
        - hand off to /admin/ui-builder after step 3 success
      data_input_subfeature:
        route: /admin/contents
        modes:
          - manual_initial_data_rows
          - csv_json_import_preview_then_apply
          - unified_contents_data_editor_grid
          - content_data_conformance_warnings_nonblocking
          - import_snapshot_lineage_reload_via_list_snapshot_records
        backend_layer: admin_csv_json_import
        prohibited:
          - canonical_admin_route_/admin/import
          - frontend_db_direct_write
      explicitly_out_of_scope:
        - component bucket, package_generator, layout_patch (/admin/ui-builder canvas workspace only)
        - created manifest hub membership and inter-manifest navigation (post-pipeline — /admin/manifests)
        - actual initial-data business-row insertion (content_bundle explicit route, not default form submit)
        - presenting file import as a canonical admin route
      implementation_convergence_note: >
        Current multi-panel draft/promotion UX is legacy projection. Converge on one submit per
        pipeline step 1, 2, 2.5, 3 with sequential backend persistence.

    admin_ui_builder:
      route: /admin/ui-builder
      island: frontend/islands/UiBuilderAdmin.tsx
      ux_label: ルート選択 → canvas workspace で配置・デザインを統合編集（暗黙パッケージ）
      entered_after: /admin/contents contents pipeline completion
      domain_ownership:
        - route_key gate + implicit package auto-generation (package_generator:promote_package shell)
        - canvas drop auto-registration (ui_component_bucket:create + promote_package additive)
        - package-only canvas workspace (配置・色・形・リアクション等 in docked inspector panels)
        - canvas_workspace_contract: full-width canvas + docked panels (ref ui_builder_canvas_workspace.canvas_workspace_contract)
        - component-level wiring from registry references
        - default_route_navigation_wiring: normal-view preset allowing authors to configure
            "click → navigate to route" via RouteNavigationWiringPreset without exposing raw
            dispatcher fields; saved as targetSurface:route / targetRef:route:<routeKey> /
            wiringKind:navigation via ui_topology:update_package_wiring; raw wiring fields
            remain in advanced details disclosure only
        - post-apply CI / guard handoff (does not change runtime semantics)
        - preset_ecosystem parent surface: planned UIBuilder authoring support for reusable draft / seed / saved view children; presets bind to selected package tmp canvas draft and never bypass preview / validate / apply
      edit_target_contract_ref: ui_builder_canvas_workspace.edit_target_contract
      canvas_workspace_contract_ref: ui_builder_canvas_workspace.canvas_workspace_contract
      preset_ecosystem_ref: ui_builder_canvas_workspace.authoring_flow.responsibilities.preset_ecosystem
      default_wiring_presets:
        route_navigation:
          normal_view_label: "クリック時に指定ルートへ移動"
          target_ref_format: "route:<routeKey>"
          target_surface: route
          wiring_kind: navigation
          route_candidates_source: ui_topology:layout_candidates uniqueRouteKeys
          prohibited:
            - raw wiring_kind / target_surface / wiring_id in normal view
            - frontend direct DB write
            - free text route entry (candidates only from layout_candidates)
          encode_helper: frontend/lib/packageWiringPicker.ts encodeRouteNavigationTargetRef
          parse_helper: frontend/lib/packageWiringPicker.ts parseRouteNavigationTargetRef
          runtime_execution:
            lane: frontend_local_only
            execution: globalThis.location.href from routeNavigation.targetRef
            backend_dispatch: none
            guard: >
              buildRuntimeDispatchSpec returns null for navigation wiringKind;
              route:<routeKey> does not reach ManifestDispatcher.
              Defensive: if route: prefix reaches ManifestDispatcher (misconfiguration),
              TryParseManifestTargetRef returns false → TARGET_REF_INVALID.
            implementation_ref: >
              frontend/runtime/renderEmission.ts isNavigationWiringKind / buildRouteNavigationEventBinding;
              frontend/runtime/runtimeComponentFactory.ts emitBoundEvent routeNavigation lane
      explicitly_out_of_scope:
        - manifest empty register and logical/physical table authoring (contents pipeline steps 1–3 — /admin/contents)
        - runtime judgment ownership
        - direct_DB_write_from_frontend
        - raw dispatcher fields as the normal-view authoring path
      authoring_flow_ref: ui_builder_canvas_workspace.authoring_flow

    admin_manifests:
      route: /admin/manifests
      island: frontend/islands/ManifestsAdmin.tsx
      ux_label: 作成済みページ群の hub / relation / navigation 管理
      pipeline_role: post_pipeline_only
      domain_ownership:
        - created topology_manifest registry display
        - created manifest hub membership management
        - manifest-to-manifest relation management
        - navigation ordering and hub_navigation_ordering
        - page-group continuity management across created manifests
      explicitly_out_of_scope:
        - contents pipeline steps 1–3 and /admin/ui-builder canvas workspace (manifest shell, tables, relationships, physical bind, ui bucket/package/layout)
        - raw manifest JSON editing in the default path

  canonical_authoring_order:
    note: >
      Primary authoring order: /admin/contents (sequential pipeline steps 1–3) →
      /admin/ui-builder (canvas workspace, entered after step 3 success) →
      /admin/manifests (optional post-contents hub/relation/navigation management).
      /admin/ui-builder is NOT a pipeline step; it is a separate canvas workspace route.
    contents_pipeline:
      - step: 1
        label: manifest_empty_register
        route: /admin/contents
        submit: single_submit_sequential_db_update
      - step: 2
        label: logical_table_definitions
        route: /admin/contents
        submit: single_submit_sequential_db_update
      - step: 2.5
        label: relationship_configuration
        route: /admin/contents
        submit: single_submit_sequential_db_update
        relationship_remote_targets:
          list_action: manifest:list_relationship_remote_targets
          status_filter: active
      - step: 3
        label: physical_table_and_page_binding
        route: /admin/contents
        submit: single_submit_sequential_db_update
    canvas_workspace_entry:
      label: ui_topology_package_then_canvas_workspace_edit
      route: /admin/ui-builder
      entered_after: step 3 physical_table_and_page_binding success
      authoring_model: canvas_workspace (ref ui_builder_canvas_workspace)
      panel_layout: full_width_canvas_with_fixed_peripheral_panels
      auto_save: _tmp_draft_on_canvas_ops_apply_promotes_and_removes_tmp
    post_contents_entry:
      label: hub_relation_navigation
      route: /admin/manifests
      note: optional after contents pipeline; not part of canvas workspace scope

  removed_legacy_wrapper_routes:
    policy: deleted
    note: >
      Legacy/debug/helper wrapper routes were deleted. Implementations that remain useful must
      converge on one of the canonical admin surfaces rather than reintroducing /dev/admin/* routes.
    routes:
      - /dev/admin/import
      - /dev/admin/hub-navigation
      - /dev/admin/runtime
      - /dev/admin/seed
      - /dev/admin/context-token-registry
      - /dev/admin/registry-vector-validate

  runtime_execution_contract:
    owner: topology_transform_runtime
    handler_ref: backend/runtime/RuntimeExecutor.cs
    evaluator_ref:
      - backend/runtime/ScreenDataShapeQueryEvaluator.cs
      - backend/runtime/ScreenDataShapeQueryRuntime.cs
    applies_when:
      - manifest topology contains screen_data_shape
      - dispatcher axes action is Read or Search
      - layer is screen_list, screen_aggregation, screen_entity, or screen_detail
    prohibited:
      - raw_sql_in_search_or_having_evaluation
      - silent_fallback_on_unknown_operator
    searchConditions:
      interpretation: abstract_operator_vocabulary_over_initialDataRows
      operators_ref: canonical_sequential_authoring_pipeline.steps[2 logical_table_definitions].search_aggregation_display.search_conditions.searchConditions
      logicalConnector: joins condition[i] to condition[i+1] via conditions[i].logicalConnector (and|or|not)
    havingConditions:
      interpretation: filter_aggregation_groups_by_measure_result
      operators: ["=", "!=", "<>", ">", ">=", "<", "<="]
    displayColumnMode:
      none: aggregate_results_only_no_row_columns
      selected: displayColumns_only
      all: all_columns_from_filtered_rows
    displayColumns_derivation:
      authoring_source: operationEntityBindings.entityTargetColumns union per selected screen_operation_kinds
      persisted_for: [ScreenDataShapeQueryEvaluator row projection, screenReadQueryWiring]
      step3_normal_view: not separately authored; synced on binding toggle and save
    value_sources:
      kinds: [literal, runtimeParam, operationInput, routeQuery, authClaim, formValue]
      rule: >
        literal.sampleValue is preview-only. Runtime execution resolves non-literal kinds from
        operation payload and __context map. Assign persists valueSource on each condition binding
        inside screen_data_shape.screenReadQueryWiring.
    screen_read_query_wiring:
      persisted_under: screen_data_shape.screenReadQueryWiring
      ui_builder_binding:
        target_surface: manifest
        admin_action: manifest:list_screen_read_query_wiring
        candidates: wiringKey per searchConditions, havingConditions, aggregationMeasures, displayColumns, displayColumnMode

  # Legacy guard — applies only where promotion-manifest editor path remains until converged to step 3 submit
  contents_promote_guard:
    status: legacy_until_step_3_single_submit_convergence
    required_before_promote:
      - draft exists
      - draft status is draft
      - validation has executed
      - validation has no blocking issue
      - preview is possible
      - preview, when present, allows promote
    prohibited:
      - enabling promote before validation execution
      - treating unresolved topology.physical_tables table_ref mismatch as a silent no-op
