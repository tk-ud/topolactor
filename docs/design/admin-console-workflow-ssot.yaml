admin_console_workflow_ssot:
  name: topolactor_admin_console_workflow_ssot
  version: 0.4.0
  status: subordinate_design_document

  authority:
    canonical_admin_route_registry: docs/design/runtime-orchestration-ssot.yaml frontend_routes.admin
    note: >
      This document is subordinate to runtime orchestration. It describes the admin UI
      responsibility split but MUST NOT add canonical admin routes outside that registry.
    canonical_routes:
      - /admin
      - /admin/manifests
      - /admin/contents
      - /admin/ui-builder

  purpose:
    - keep the admin authoring workflow aligned with runtime-orchestration route authority
    - define /admin/contents as the new manifest creation surface
    - define /admin/manifests as the existing manifest relation / hub operation surface
    - isolate retained legacy or debug implementations from the canonical admin workflow

  does_not_own:
    - runtime_orchestration_semantics: docs/design/runtime-orchestration-ssot.yaml
    - component_implementation: frontend/islands/*Admin.tsx
    - db_schema: docs/design/db-schema.yaml
    - css_vocabulary: docs/design/css-dictionary-ssot.yaml
    - ui_ux_primitive_catalog: docs/design/ui-ux-primitive-catalog-ssot.yaml

  page_responsibility:
    admin_index:
      route: /admin
      responsibility: canonical admin workflow entry

    admin_contents:
      route: /admin/contents
      island: frontend/islands/ContentsAdmin.tsx
      ux_label: 新規 manifest 作成
      domain_ownership:
        - create one new manifest draft
        - define the new manifest content and data shape intent
        - validate and preview before explicit promote
      explicitly_out_of_scope:
        - existing manifest relation ordering
        - existing manifest hub grouping operations
        - presenting file import as a canonical admin route
      note: >
        This surface creates a new manifest. Existing manifest relation / hub operations
        belong to /admin/manifests.

    admin_ui_builder:
      route: /admin/ui-builder
      island: frontend/islands/UiBuilderAdmin.tsx
      domain_ownership:
        - component catalog reference
        - component registration and promotion
        - layout preview, validation, and explicit apply

    admin_manifests:
      route: /admin/manifests
      island: frontend/islands/ManifestsAdmin.tsx
      domain_ownership:
        - existing topology_manifest registry display
        - existing manifest hub assignment
        - existing manifest relation CRUD and ordering
        - hub_navigation_ordering inside the canonical manifests page
      explicitly_out_of_scope:
        - new manifest content draft creation
        - per-manifest DB table, column, and type editing
        - raw manifest JSON editing in the default path
      note: >
        Relation / hub operations are part of this canonical page. They MUST NOT require a
        separate canonical /admin/hub-navigation route.

  canonical_workflow:
    - step: 1
      label: create_new_manifest
      route: /admin/contents
      description: Create a new manifest draft, validate it, preview it, and explicitly promote it.
    - step: 2
      label: build_manifest_ui
      route: /admin/ui-builder
      description: Register UI components and apply a validated layout for the manifest.
    - step: 3
      label: operate_existing_manifest_relations_and_hubs
      route: /admin/manifests
      description: Review existing manifests and operate their relation / hub assignments and ordering.

  retained_noncanonical_routes:
    policy: legacy_debug_only
    visibility_rule: >
      Retained implementations MUST NOT appear in canonical admin cards, steppers, acceptance flow,
      or user-facing canonical workflow explanations.
    routes:
      - legacy_route: /admin/import
        isolated_route: /dev/admin/import
        island: frontend/islands/AdminImport.tsx
        reason: retained CSV/JSON debug and migration aid; not in runtime-orchestration admin registry
      - legacy_route: /admin/hub-navigation
        isolated_route: /dev/admin/hub-navigation
        island: frontend/islands/HubNavigationAdmin.tsx
        reason: retained direct debug wrapper; canonical relation / hub operations render inside /admin/manifests
      - legacy_route: /admin/runtime
        isolated_route: /dev/admin/runtime
        island: frontend/islands/OperationPanel.tsx
        reason: retained dispatch debug wrapper; runtime verification is not a canonical admin authoring route

  contents_promote_guard:
    required_before_promote:
      - draft exists
      - draft status is draft
      - validation has executed
      - validation has no blocking issue
      - preview, when present, allows promote
    prohibited:
      - enabling promote before validation execution
