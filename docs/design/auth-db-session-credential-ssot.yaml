auth_db_session_credential_ssot:
  name: topolactor_auth_db_session_credential_ssot
  version: 0.1.0
  status: ssot_design_document

  purpose:
    - auth_credential_session_refresh_canonical_store
    - login_ui_manifest_vs_auth_runtime_boundary
    - admin_user_realm_audience_separation
    - projection_login_surface_authority_capability_orthogonality
    - dispatch_claim_authority_jwt_as_authoritative_role_source

  source_files:
    - db/auth_tables.sql
    - db/auth_seed.sql
    - backend/service/AuthService.cs
    - backend/runtime/AuthRuntime.cs

  prohibited_in_topology_and_manifest:
    - password_hash
    - jwt_secret
    - refresh_token_plaintext
    - credential_db_direct_write_from_manifest
    - admin_authorization_logic_in_manifest_topology

  topology_credential_boundary:
    note: >-
      Login credentials live only in auth.credentials.
      topology.function_parameters must not contain password_hash.

  canonical_tables:
    auth.users:
      role: user_identity
      columns:
        - user_id
        - username
        - active
        - approve
        - status
        - suspended_from
        - suspended_until
        - state_note
        - created_at
        - updated_at
      master_roster_ssot_ref: docs/design/admin-master-roster-management-ssot.yaml
      status_column: stores enum item name from user_status group (seed)
      last_login_at: readonly projection from auth.login_events where success=true
    auth.credentials:
      role: password_hash_canonical_store
      columns: [credential_id, user_id, password_hash, created_at]
    auth.sessions:
      role: logical_session
      columns: [session_id, user_id, realm, audience, expires_at, revoked_at, created_at]
    auth.refresh_tokens:
      role: refresh_token_hash_store
      columns: [refresh_token_id, session_id, token_hash, expires_at, revoked_at, created_at]
      note: store SHA-256 hash of refresh token; never store plaintext in DB or topology
    auth.login_events:
      role: audit_trail
      columns: [login_event_id, user_id, realm, success, failure_code, created_at]
    auth.roles:
      role: named_role_catalog
    auth.scopes:
      role: named_scope_catalog
    auth.grants:
      role: user_role_binding
      columns: [grant_id, user_id, role_name, realm]

  jwt_claims_contract:
    required: [sub, role, realm, aud, iss, iat, exp]
    user_login:
      realm: user
      aud: user_app
      role: user
    admin_login:
      realm: admin/system
      aud: admin_console
      role: admin

  signing_key:
    source: environment_only
    env_var: DEMO_JWT_SECRET
    required_env_vars:
      DEMO_JWT_SECRET: JWT signing secret; mandatory; no default
      DEMO_JWT_EXPIRY_HOURS: >-
        JWT access token lifetime in hours; mandatory; must be a positive integer.
        Absent or non-integer value causes AUTH_JWT_EXPIRY_NOT_CONFIGURED and makes login impossible.
    prohibited_sources: [topology, hubs, manifest, function_parameters]

  access_jwt_session_cookie_policy:
    note: >-
      Frontend JWT session cookie Max-Age (DEFAULT_MAX_AGE_SEC = 86400) is set independently
      of the access JWT expiry controlled by DEMO_JWT_EXPIRY_HOURS.
      LoginResponseDto and RefreshResponseDto do not return expiry; the frontend does not derive
      Max-Age from the JWT exp claim.
      Validity is enforced fail-close: SSR /admin middleware and client probe call
      GET /api/auth/session (Bearer) on each gate entry; an invalid, expired, or unverifiable
      token clears the session cookie and redirects to /super_auth.
      This policy is intentional for the demo scope and must not be changed without a
      design_change worktype covering both backend contract extension and frontend cookie derivation.

  refresh_token_cookie:
    name: topolactor_refresh_token
    path: /
    http_only: true
    same_site: Lax
    secure:
      production_https: required
      local_demo_http: omitted
      control: >-
        COOKIE_SECURE environment variable.
        Set to "true" for HTTPS/production deployments — Secure attribute is added to both
        AppendRefreshCookie and ClearRefreshCookie.
        Absent or not "true" means local/demo HTTP mode — Secure attribute is explicitly omitted.
        No silent fallback: omitting COOKIE_SECURE is an explicit local/demo HTTP exception,
        not an unspecified policy gap. AppendRefreshCookie and ClearRefreshCookie must apply
        the same Secure policy so cookie attributes never drift between set and clear operations.

  login_denial_when:
    - active_is_false
    - approve_is_false
    - status_is_suspended_or_suspension_window_active
  login_denial_codes:
    AUTH_USER_INACTIVE: user.active is false
    AUTH_USER_NOT_APPROVED: user.approve is false
    AUTH_USER_SUSPENDED: status suspended or within suspended_from/suspended_until window

  auth_runtime_actions:
    login: issues access_jwt and refresh_token
    refresh: rotates refresh_token and issues new access_jwt
    logout: revokes refresh_token and session

  self_credential_and_session_lifecycle:
    status: added_role_based_surface_impl_bundle_2026_07_14
    resolution_record: >
      Prior to this bundle, no self-service password-change or session-list/revoke operation existed
      anywhere (confirmed by admin-master-roster-management-ssot.yaml admin_runtime_actions.auth_users
      having no such action, and by grep across backend/ finding no password-change endpoint). This
      section is the design authority for the operations added to close that gap. Thin HTTP boundary
      pattern (auth_runtime, not manifest-dispatched — same shape as login/refresh/logout above), not
      an admin_runtime dispatch action family, so it carries no dependency on topology seed / manifest /
      dispatcher_mapping content, which stays owner-paused per admin-console-workflow-ssot.yaml.
    self_service_endpoints:
      target_account_resolution: server_side_only_from_validated_jwt_subject — no request ever carries a userId/username field on this family.
      GET /auth/me: current account (username/role/realm/active/approve/status), backend/service/AuthService.cs GetCurrentAccountAsync.
      POST /auth/me/password: >-
        self password change. Request: {currentPassword, newPassword}. Policy: newPassword length >= 8
        (AuthService.MinimumPasswordLength) and must differ from currentPassword. On success: revokes
        every active session for the account in the same transaction as the hash update (forces
        re-login everywhere, including the caller's own session), and appends non-secret evidence
        (session count only, no password material) into logs.diff. Because access JWTs now carry a
        session-id claim (see session_revocation_identity below), this revocation is not merely
        eventual (via refresh-token rotation) — the caller's own already-issued access JWT is rejected
        by JwtGuard on its very next request, before any refresh happens. Frontend (PersonalPage.tsx)
        additionally clears its own client-side token/cookie carriers and redirects to /auth on
        success, rather than continuing to operate with a token it knows the backend just revoked.
        backend/repository/NpgsqlAuthRepository.cs ChangeOwnPasswordAsync.
      GET /auth/me/sessions: list caller's own active sessions, with isCurrent resolved from the refresh-token cookie via FindActiveSessionIdByRefreshTokenHashAsync (never from a client-supplied session id).
      POST /auth/me/sessions/revoke: revoke one of the caller's own sessions by sessionId — ownership-checked server-side (RevokeOwnedSessionAsync rejects a sessionId that does not belong to the caller's own userId).
      POST /auth/me/sessions/revoke-others: revoke every session except the caller's current one (identified via the refresh-token cookie, same mechanism as above).
    admin_driven_endpoints:
      target_account_resolution: explicit_route_parameter_userId — independent of the admin caller's own identity, requires admin JWT (ValidateForContext against AdminRealm/AdminAudience/AdminRole).
      GET /admin/auth/users/{userId}/sessions: list a target account's active sessions.
      POST /admin/auth/users/{userId}/sessions/revoke: revoke one (body.sessionId) or all (omit body.sessionId) active sessions for a target account.
      POST /admin/auth/users/{userId}/credential/revoke: >-
        kill-switch — deletes the target account's auth.credentials row and revokes all its sessions in
        one transaction. Never accepts, stores, or returns a replacement password value; there is no
        endpoint anywhere in this surface family that lets an admin set or view another account's
        password. backend/repository/NpgsqlAuthRepository.cs RevokeCredentialAsync.
    non_spoofable_actor_identity: >-
      OperationVector gained AuthenticatedUserId/AuthenticatedRole fields (backend/schema/Contracts.cs),
      populated only from DispatchAuthContext's reserved, JWT-verified context keys
      (backend/runtime/OperationVectorResolver.cs) — never from client-supplied context. This closes a
      pre-existing gap where AdminRuntimeMasterRoster.ResolveAuditActor read the client-suppliable
      ContextUserId as the audit actor; it now prefers AuthenticatedUserId. AdminRuntime.TeamMarkdown's
      ExecuteTeamMarkdownAsync additionally uses AuthenticatedRole as an explicit, non-spoofable
      admin-role gate on every team_markdown mutation action, independent of manifest capability
      inference.

  session_revocation_identity:
    status: added_role_based_surface_impl_bundle_2026_07_14
    resolution_record: >
      Prior to this addition, JwtGuard.Validate/ValidateForContext verified only signature and exp —
      a session revoke (self or admin), password change, credential revoke, account deactivation, or
      role change never invalidated an already-issued access JWT; it kept working until its exp
      elapsed (up to DEMO_JWT_EXPIRY_HOURS later) regardless. This section is the design authority for
      closing that gap by giving every access JWT a revocation identity checked against the same
      auth.sessions/auth.users tables the login/refresh path already authorizes against — not a new,
      parallel revocation authority.
    claim: >-
      Every access JWT issued by JwtTokenIssuer.IssueAccessToken (login, projection-login, refresh —
      all realms/roles) now carries a sid claim: the auth.sessions.session_id row created for that
      login (unchanged across refreshes of the same session — only the refresh token itself rotates).
    guard_boundary: >-
      backend/repository/AuthRepository.cs AuthRepository.IsSessionActiveAsync(sessionId) is the single
      DB-side authority consulted: the session must exist, be non-revoked, non-expired, and the owning
      auth.users row must be active=true, approve=true, and outside any suspension window — the exact
      same account-state predicate AuthService.EvaluateLoginState already enforces at login/refresh,
      reused rather than reimplemented. backend/guard/JwtGuard.cs
      ValidateActiveSessionAsync/ValidateForContextActiveSessionAsync run this DB check after the
      existing signature/exp validation and are what every JWT-authenticated endpoint in
      backend/Program.cs now calls (/dispatch, /component-events/append, /intake/legacy-change,
      /auth/session, /auth/me*, /admin/auth/users/{userId}/*, /team-markdown/*, /draft-preview/*,
      /sql-attention/topology-projection, /sse) — the signature/exp-only Validate/ValidateForContext is
      no longer called directly by any endpoint. A token missing the sid claim fails closed
      (AUTH_TOKEN_SID_MISSING) without ever consulting the repository.
    role_change_completion_boundary: >-
      backend/repository/NpgsqlAuthMasterRepository.cs UpdateUserAsync compares the admin grant's
      presence before and after an auth_users:update roleName change, inside the same transaction as
      the grant INSERT/DELETE; if the role actually changed, every active session for that user is
      revoked in that same transaction. A no-op roleName (matching the existing grant) does not revoke
      sessions. This is what makes a stale-role JWT (issued before the change) get rejected by
      ValidateForContextActiveSessionAsync on its next request, rather than remaining usable with its
      pre-change role claim until exp.
    account_deactivation: >-
      Deactivation (auth.users.active=false) needs no separate explicit session-revoke call — the
      guard_boundary's join to auth.users already rejects any session belonging to a
      no-longer-active/approved/non-suspended account, so this takes effect immediately even if a
      caller forgets to also revoke sessions explicitly.
    proof: >-
      backend/tests/Topolactor.Integration.Tests/JwtGuardSessionRevocationLiveDbTests.cs and
      AuthSessionRevocationLiveDbTests.cs (real JwtTokenIssuer/JwtGuard/NpgsqlAuthRepository/
      NpgsqlAuthMasterRepository classes against a real Postgres instance, TOPOLACTOR_TEST_DB_CONNECTION-
      gated) cover: active session passes; owned/admin-bulk session revoke fails it; password change
      fails it; credential revoke fails it; account deactivation fails it even without an explicit
      session revoke; role change fails it; a no-op role update does not revoke sessions; a token
      without sid fails closed without a repository call.

  projection_login_surface_contract:
    frontend_route: /auth
    backend_endpoint: POST /auth/projection-login
    authority: auth_runtime.login_projection
    policy:
      - Try admin realm login first (auth.grants where realm='admin/system').
      - On AUTH_REALM_DENIED only: fall through to user realm login.
      - Any other failure (bad credentials, account state, config error): surface verbatim, no fallthrough.
      - Admin users entering /auth retain admin JWT (realm=admin/system, aud=admin_console, role=admin).
      - User-only users entering /auth receive user JWT (realm=user, aud=user_app, role=user).
    capability_authority_orthogonality:
      invariant: Login surface does not determine authority or capability.
      rule: Backend issues JWT based on auth.grants, not on which surface the user entered.
      prohibited: Adding user grant to admin user to allow /auth login is a role downgrade and is forbidden.
    note: >-
      /super_auth (POST /super_auth/login) is the admin console login surface and remains separate.
      It calls LoginAdminAsync directly without fallthrough.

  refresh_session_carrier_policy:
    projection_surface:
      realm_detection: Frontend reads realm claim from JWT payload (client-side decode, no signature check).
      routing:
        admin_realm: Call /api/super_auth/refresh (admin refresh endpoint).
        user_realm_or_unknown: Call /api/auth/refresh (user refresh endpoint).
      clear_conditions:
        - AUTH_REFRESH_TOKEN_INVALID (refresh token revoked or expired — token invalidity)
        - AUTH_REFRESH_USER_NOT_FOUND (user account deleted — token invalidity)
        - AUTH_USER_INACTIVE (account deactivated — token invalidity)
        - AUTH_USER_NOT_APPROVED (account not approved — token invalidity)
        - AUTH_USER_SUSPENDED (account suspended — token invalidity)
      no_clear_conditions:
        - AUTH_REALM_MISMATCH (carrier state mismatch — access JWT is still valid; surface error, not carrier clear)
        - AUTH_BACKEND_NOT_CONFIGURED (environment issue — not token invalidity)
        - AUTH_BACKEND_UNREACHABLE (network issue — not token invalidity)
      note: >-
        Probe failure (probeSessionToken returns false) always clears the carrier regardless of error code,
        because the probe validates JWT signature and expiry directly.

  dispatch_claim_authority_contract:
    rule: JWT claim is the authoritative source for role in all dispatch paths.
    prohibited: Trusting request body role field for authorization decisions.
    enforcement:
      - Backend /dispatch extracts role from JWT via JwtGuard.TryGetRole.
      - authoritativeRequest = request with { Role = jwtRole } overrides any role in request body.
      - ManifestDispatcher uses request.Role (JWT-derived) for manifest axes resolution.
      - capability_requirement topology entry enforces required_role against request.Role (JWT-derived).
    target_ref_gate:
      note: >-
        target_ref path bypasses role-axis filtering in ResolveActiveManifestAsync.
        ManifestDispatcher.ValidateCapabilityRequirement is applied after all manifest resolution paths
        (axes, target_ref, db_notify) to enforce required_role — explicit or inferred.
      error_code: AUTH_CAPABILITY_DENIED
    manifest_capability_requirement:
      topology_entry_type: capability_requirement
      field: required_role
      semantics: >-
        When present in manifest topology, the requesting role (from JWT claim) must match required_role.
        When absent, required_role is inferred from runtime_mapping.runtime_destination:
        runtime_destination="admin_runtime" → inferred required_role=admin.
        Explicit capability_requirement overrides any inferred value.
        If neither explicit nor inferred, the manifest is accessible to any authenticated role.

  login_manifest_contract:
    seed_manifest_id: "00000000-0000-0000-0000-000000000090"
    mapping_types:
      - auth_action_binding
      - ui_projection_mapping
    submit_delegation: auth_runtime.login
    frontend_route: /auth
    admin_login_route: /super_auth

  relationship_boundary_manifest:
    seed_manifest_id: "00000000-0000-0000-0000-000000000091"
    status: active
    manifest_key: auth.user.boundary
    logical_tables:
      auth.user:
        note: >-
          Logical name for admin Step 2.5 remote joins (maps to auth.users.user_id at physical bind time).
        columns: [id, username]
    admin_list_action: manifest:list_relationship_remote_targets
