auth_db_session_credential_ssot:
  name: topolactor_auth_db_session_credential_ssot
  version: 0.1.0
  status: ssot_design_document

  purpose:
    - auth_credential_session_refresh_canonical_store
    - login_ui_manifest_vs_auth_runtime_boundary
    - admin_user_realm_audience_separation

  source_files:
    - db/auth_tables.sql
    - db/auth_seed.sql
    - backend/service/AuthService.cs
    - backend/runtime/AuthRuntime.cs

  prohibited_in_topology_and_manifest:
    - password_hash
    - jwt_secret
    - refresh_token_plaintext
    - credential_db_direct_write_from_manifest
    - admin_authorization_logic_in_manifest_topology

  demo_only_topology_credential:
    status: deprecated_for_login
    note: >-
      topology.function_parameters(demo_auth/demo_users) must not contain password_hash.
      Login credentials live only in auth.credentials.

  canonical_tables:
    auth.users:
      role: user_identity
      columns:
        - user_id
        - username
        - active
        - approve
        - status
        - suspended_from
        - suspended_until
        - state_note
        - created_at
        - updated_at
      master_roster_ssot_ref: docs/design/admin-master-roster-management-ssot.yaml
      status_column: stores enum item name from user_status group (seed)
      last_login_at: readonly projection from auth.login_events where success=true
    auth.credentials:
      role: password_hash_canonical_store
      columns: [credential_id, user_id, password_hash, created_at]
    auth.sessions:
      role: logical_session
      columns: [session_id, user_id, realm, audience, expires_at, revoked_at, created_at]
    auth.refresh_tokens:
      role: refresh_token_hash_store
      columns: [refresh_token_id, session_id, token_hash, expires_at, revoked_at, created_at]
      note: store SHA-256 hash of refresh token; never store plaintext in DB or topology
    auth.login_events:
      role: audit_trail
      columns: [login_event_id, user_id, realm, success, failure_code, created_at]
    auth.roles:
      role: named_role_catalog
    auth.scopes:
      role: named_scope_catalog
    auth.grants:
      role: user_role_binding
      columns: [grant_id, user_id, role_name, realm]

  jwt_claims_contract:
    required: [sub, role, realm, aud, iss, iat, exp]
    user_login:
      realm: user
      aud: user_app
      role: user
    admin_login:
      realm: admin/system
      aud: admin_console
      role: admin

  signing_key:
    source: environment_only
    env_var: DEMO_JWT_SECRET
    prohibited_sources: [topology, hubs, manifest, function_parameters]

  refresh_token_cookie:
    name: topolactor_refresh_token
    path: /
    http_only: true
    same_site: Lax

  login_denial_when:
    - active_is_false
    - approve_is_false
    - status_is_suspended_or_suspension_window_active
  login_denial_codes:
    AUTH_USER_INACTIVE: user.active is false
    AUTH_USER_NOT_APPROVED: user.approve is false
    AUTH_USER_SUSPENDED: status suspended or within suspended_from/suspended_until window

  auth_runtime_actions:
    login: issues access_jwt and refresh_token
    refresh: rotates refresh_token and issues new access_jwt
    logout: revokes refresh_token and session

  login_manifest_contract:
    seed_manifest_id: "00000000-0000-0000-0000-000000000090"
    mapping_types:
      - auth_action_binding
      - ui_projection_mapping
    submit_delegation: auth_runtime.login
    frontend_route: /auth
    admin_login_route: /super_auth

  relationship_boundary_manifest:
    seed_manifest_id: "00000000-0000-0000-0000-000000000091"
    status: active
    manifest_key: auth.user.boundary
    logical_tables:
      auth.user:
        note: >-
          Logical name for admin Step 2.5 remote joins (maps to auth.users.user_id at physical bind time).
        columns: [id, username]
    admin_list_action: manifest:list_relationship_remote_targets
