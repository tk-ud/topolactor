version: 1
ssot: abstract_function_primitive_registry
purpose: >
  Define the abstract function primitive vocabulary, input/output contracts,
  and mutation boundary for functions invoked by UI/UX primitives.

  This SSOT is the upper-level vocabulary definition for:
  - function names referenced by UI primitives in ui-ux-primitive-catalog-ssot.yaml
  - function contract boundaries (mutation / candidate / preview / readonly)
  - function categories that map to UI primitive categories
  - Issue #89 layout builder function vocabulary
  - no-code / DB-driven UI topology operation builder
  - backend-wide execute_abstract_function primitive taxonomy and manifest/runtime boundary vocabulary

  This SSOT owns:
  - abstract function primitive names and categories
  - execute_abstract_function as the backend-wide function substrate contract
  - authority/input/output/projection/fail-close vocabulary for primitive manifests
  - the rule that backend function bodies should be expressed as abstract function primitives when possible

  This SSOT does NOT own:
  - execution engine implementation
  - backend runtime dispatch configuration
  - DB schema for function persistence
  - SQL Attention ranking / promotion implementation
  - external provider connection details

  Function vocabulary design rules:
  - All functions that produce candidates declare output as candidate surface
  - All functions that write to DB declare explicit mutation_boundary
  - SQL Attention functions are observation-only and do not mutate registry
  - Calculation functions produce preview results; apply requires explicit confirm
  - External lookup functions produce candidates; canonical write requires confirm
  - Backend abstract function steps must fail closed when authority, input binding, projection, or secret policy is missing

# =============================================================================
# Mutation boundary types (referenced by function entries)
# =============================================================================

mutation_boundary_types:
  readonly:
    description: Function only reads; no DB write at all
  candidate_surface:
    description: Function produces candidates; no write side effect
  preview_only:
    description: Function produces a preview result without writing
  preview_validate_explicit_apply:
    description: >
      Function produces a preview or patch; DB write requires
      validate_candidate then apply_confirmed_update then append_diff_log
  explicit_confirm_required:
    description: Write only after explicit user/admin confirmation
  append_only:
    description: Function appends an audit or log entry; no mutation of existing rows
  sql_attention_observation_only:
    description: SQL Attention observation; does not mutate registry or route state

# =============================================================================
# Category A: Search / Suggest Functions
# =============================================================================

category_a_search_suggest:
  label: Search / Suggest Functions
  boundary: candidate_surface
  note: All functions produce candidate results. No direct DB write.
  functions:
    search_hub_candidates:
      signature: "search_hub_candidates(query, context) -> candidates[]"
      description: Search hubs matching query with context-aware ranking
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - AutoCompleteInput
        - SearchCombobox
        - RelationCandidatePicker

    search_entity_candidates:
      signature: "search_entity_candidates(query, context) -> candidates[]"
      description: Search entities matching query with context filters
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - AutoCompleteInput
        - SuggestInput
        - SearchCombobox

    suggest_relation_candidates:
      signature: "suggest_relation_candidates(hub_id, context) -> candidates[]"
      description: Suggest related hub candidates based on hub_id and topology context
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - RelationCandidatePicker
        - RelationPathPreview

    autocomplete_field_value:
      signature: "autocomplete_field_value(target, field, query, context) -> suggestions[]"
      description: Autocomplete a field value from registered candidates for the given target
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - AutoCompleteInput
        - SuggestInput

    rank_candidate_results:
      signature: "rank_candidate_results(candidates, policy) -> ranked_candidates[]"
      description: Rank a candidate list using the given policy (SQL Attention score, recency, etc.)
      output_kind: candidate_surface
      mutation_boundary: candidate_surface
      sql_attention_boundary: observation_and_ranking_only
      note: SQL Attention ranking is candidate surface only; ranked list does not auto-write registry
      ui_primitive_consumers:
        - CandidateConfidenceBadge
        - RankScorePreview

    explain_candidate_match:
      signature: "explain_candidate_match(candidate, context) -> explanation"
      description: Explain why a candidate was matched (field overlap, topology distance, score)
      output_kind: readonly
      mutation_boundary: readonly
      ui_primitive_consumers:
        - CandidateConfidenceBadge
        - FieldResolverInspector

    detect_duplicate_candidates:
      signature: "detect_duplicate_candidates(candidates, policy) -> duplicate_groups[]"
      description: Detect near-duplicate candidates using cosine similarity and policy thresholds
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - DuplicateMergeCandidatePanel

    resolve_recent_inputs:
      signature: "resolve_recent_inputs(target, field, context) -> recents[]"
      description: Return recently used input values for a field based on observation logs
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - RecentInputSuggest

    suggest_schema_promotion_candidates:
      signature: "suggest_schema_promotion_candidates(context) -> candidates[]"
      description: Suggest jsonb paths or fields ready for schema promotion
      output_kind: candidate_surface
      mutation_boundary: candidate_surface
      note: Promotion requires explicit confirm through schema promotion flow
      ui_primitive_consumers:
        - SchemaPromotionCandidatePanel

# =============================================================================
# Category B: Normalize / Lookup / Import Functions
# =============================================================================

category_b_normalize_lookup_import:
  label: Normalize / Lookup / Import Functions
  boundary: candidate_surface
  note: External lookup functions produce candidates only. Canonical write requires confirm.
  functions:
    normalize_text:
      signature: "normalize_text(value, rule) -> normalized_value"
      description: Normalize text by rule (trim, kana, full-width, etc.)
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - NormalizeAddressCandidate
        - KanaAssistInput

    extract_kana:
      signature: "extract_kana(value) -> kana_candidate"
      description: Extract kana reading from CJK text
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - KanaAssistInput

    resolve_postal_address:
      signature: "resolve_postal_address(postal_code) -> address_candidate"
      description: Resolve postal code to address candidate via allowed postal provider or master
      output_kind: candidate_surface
      mutation_boundary: readonly
      external_lookup: postal_address
      canonical_authority: candidate_surface_not_SSOT
      ui_primitive_consumers:
        - PostalAddressLookup
        - LookupCandidateConfirmPanel

    resolve_address_postal:
      signature: "resolve_address_postal(address) -> postal_candidate"
      description: Resolve address to postal code candidate
      output_kind: candidate_surface
      mutation_boundary: readonly
      external_lookup: address_postal
      canonical_authority: candidate_surface_not_SSOT
      ui_primitive_consumers:
        - AddressPostalLookup
        - LookupCandidateConfirmPanel

    resolve_tel_candidate:
      signature: "resolve_tel_candidate(tel_or_address) -> candidates[]"
      description: Resolve tel number or address against internal master / registered data only
      output_kind: candidate_surface
      mutation_boundary: readonly
      external_lookup: tel_address
      restriction: internal_master_and_registered_data_only
      canonical_authority: candidate_surface_not_SSOT
      ui_primitive_consumers:
        - TelAddressCandidateLookup
        - LookupCandidateConfirmPanel

    import_rows_to_candidates:
      signature: "import_rows_to_candidates(source, mapping) -> import_candidates[]"
      description: Map source rows to topology payload candidates using the given column mapping
      output_kind: candidate_surface
      mutation_boundary: candidate_surface
      note: Import result is candidate only; apply requires validate_candidate + explicit confirm
      ui_primitive_consumers:
        - SelectImportDialog
        - BulkImportCandidatePanel

    deduplicate_import_candidates:
      signature: "deduplicate_import_candidates(candidates, policy) -> dedup_candidates[]"
      description: Remove or flag near-duplicate candidates from an import batch
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - DuplicateMergeCandidatePanel
        - BulkImportCandidatePanel

# =============================================================================
# Category C: Candidate Update / Audit Functions
# =============================================================================

category_c_candidate_update_audit:
  label: Candidate Update / Audit Functions
  boundary: preview_validate_explicit_apply
  note: >
    All write operations follow: preview_update_patch → validate_candidate →
    apply_confirmed_update → append_diff_log.
    No shortcut path bypasses validate_candidate.
  functions:
    validate_candidate:
      signature: "validate_candidate(candidate, manifest) -> validation_result"
      description: Validate a candidate against the manifest schema and required field constraints
      output_kind: validation_result
      mutation_boundary: readonly
      ui_primitive_consumers:
        - OptimisticUpdateBoundary
        - ApplyConfirmDialog
        - BulkActionPanel

    preview_update_patch:
      signature: "preview_update_patch(target, payload) -> patch_preview"
      description: Produce a before/after patch preview without writing to DB
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - PatchPreviewPanel
        - InlineEditableField
        - InlineEditableJsonbField

    apply_confirmed_update:
      signature: "apply_confirmed_update(target, payload) -> apply_result"
      description: Write confirmed patch to DB after validate_candidate pass and explicit confirm
      output_kind: mutation_result
      mutation_boundary: explicit_confirm_required
      prerequisite:
        - validate_candidate must pass
        - explicit user/admin confirmation must precede call
      ui_primitive_consumers:
        - ConfirmedUpdateButton
        - ApplyConfirmDialog
        - BulkActionPanel

    append_diff_log:
      signature: "append_diff_log(target, before, after, editor) -> diff_log_entry"
      description: Append an immutable diff log entry after apply_confirmed_update succeeds
      output_kind: append_only
      mutation_boundary: append_only
      note: Must be called after apply_confirmed_update, never before
      ui_primitive_consumers:
        - AuditDiffDrawer
        - UndoTimeline

    build_rollback_candidate:
      signature: "build_rollback_candidate(diff_id) -> rollback_candidate"
      description: Build a rollback candidate from a diff_log entry
      output_kind: candidate_surface
      mutation_boundary: candidate_surface
      note: Rollback requires apply_confirmed_update + append_diff_log
      ui_primitive_consumers:
        - RollbackCandidatePanel
        - UndoTimeline

    compare_candidate_with_current_state:
      signature: "compare_candidate_with_current_state(candidate, target) -> comparison_result"
      description: Compare a candidate with the current DB state before apply
      output_kind: readonly
      mutation_boundary: readonly
      ui_primitive_consumers:
        - ConflictResolutionPanel
        - PatchPreviewPanel

    resolve_conflict_candidate:
      signature: "resolve_conflict_candidate(conflict, resolution_policy) -> resolved_candidate"
      description: Produce a resolved candidate from a conflict using the given resolution policy
      output_kind: candidate_surface
      mutation_boundary: candidate_surface
      note: Resolved candidate still requires apply_confirmed_update
      ui_primitive_consumers:
        - ConflictResolutionPanel

# =============================================================================
# Category D: Calculation / Topology Functions
# =============================================================================

category_d_calculation_topology:
  label: Calculation / Topology Functions
  boundary: preview_candidate_surface_only
  note: >
    All calculation functions produce preview or candidate results.
    Calculation results do not directly mutate DB state.
    SQL Attention functions are observation-only.
  functions:
    calculate_entity_field_value:
      signature: "calculate_entity_field_value(entity_id, formula, context) -> computed_value"
      description: Calculate a computed field value using the given formula and entity context
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - ComputedFieldPreview
        - CalculationPreviewPanel

    calculate_relation_score:
      signature: "calculate_relation_score(from_id, to_id, context) -> score"
      description: Calculate relation score between two entities using topology distance and co-occurrence
      output_kind: candidate_surface
      mutation_boundary: readonly
      sql_attention_boundary: observation_based_scoring_only
      ui_primitive_consumers:
        - RelationScorePreview
        - RankScorePreview

    calculate_relation_cooccurrence:
      signature: "calculate_relation_cooccurrence(source, target, window) -> cooccurrence_matrix"
      description: Calculate co-occurrence frequency between source and target within time window
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - CooccurrenceMatrixPreview
        - RelationScorePreview

    calculate_hub_statistics:
      signature: "calculate_hub_statistics(hub_id, filters) -> statistics"
      description: Calculate aggregated statistics for a hub (count, state distribution, etc.)
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - HubStatisticsPanel

    calculate_group_statistics:
      signature: "calculate_group_statistics(target, group_by, filters) -> grouped_stats"
      description: Calculate grouped aggregate statistics over a target result set
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - AggregationPreviewTable
        - CrossEntityCalculationPanel

    calculate_topology_distance:
      signature: "calculate_topology_distance(from_hub, to_hub, context) -> distance_result"
      description: Calculate the topology distance (hop count, cosine similarity) between two hubs
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - TopologyDistancePreview
        - RelationPathPreview

    calculate_route_cost:
      signature: "calculate_route_cost(route, context) -> cost_result"
      description: Calculate traversal cost for a candidate route
      output_kind: candidate_surface
      mutation_boundary: readonly
      ui_primitive_consumers:
        - RouteCostPreview

    calculate_attention_weight:
      signature: "calculate_attention_weight(target, evidence) -> attention_weight"
      description: >
        Calculate attention weight from SQL Attention observation evidence.
        This is an observation function. Result is preview/candidate; does not mutate registry.
      output_kind: candidate_surface
      mutation_boundary: sql_attention_observation_only
      sql_attention_boundary: observation_surface_only
      note: SQL Attention is observation layer; attention_weight result does not auto-promote
      ui_primitive_consumers:
        - AttentionWeightPreview

    calculate_rank_score:
      signature: "calculate_rank_score(candidates, policy) -> ranked_candidates[]"
      description: Rank candidates by policy-defined score (attention_score, recency, trend)
      output_kind: candidate_surface
      mutation_boundary: sql_attention_observation_only
      sql_attention_boundary: recommendation_candidate_surface_only
      note: Ranked list is candidate surface only; no auto-mutation of registry or route
      ui_primitive_consumers:
        - RankScorePreview
        - CandidateConfidenceBadge

    preview_computed_field:
      signature: "preview_computed_field(target, formula, context) -> preview_result"
      description: Dry-run preview of a computed field formula result without DB write
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - ComputedFieldPreview
        - FormulaBuilder

    validate_formula_contract:
      signature: "validate_formula_contract(formula, manifest) -> validation_result"
      description: Validate a formula against the manifest schema before apply
      output_kind: validation_result
      mutation_boundary: readonly
      ui_primitive_consumers:
        - FormulaBuilder

    promote_computation_candidate:
      signature: "promote_computation_candidate(path, evidence) -> promotion_candidate"
      description: Promote a computed field or aggregation result to a schema candidate
      output_kind: candidate_surface
      mutation_boundary: candidate_surface
      note: Promotion candidate requires explicit confirm through schema promotion flow
      ui_primitive_consumers:
        - SchemaPromotionCandidatePanel
        - ComputedFieldPreview

# =============================================================================
# Category E: Layout / Design Token Functions
# =============================================================================

category_e_layout_design_token:
  label: Layout / Design Token Functions
  boundary: preview_validate_explicit_apply
  note: "#89 admin visual layout builder function vocabulary"
  functions:
    preview_layout_patch:
      signature: "preview_layout_patch(layout_id, patch, context) -> layout_preview"
      description: Preview a layout patch without writing to ui_layout_registry
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - ThemePreviewPanel
        - LayoutGridEditor

    validate_layout_constraint:
      signature: "validate_layout_constraint(layout_id, patch, rules) -> validation_result"
      description: Validate a layout patch against responsive rules and placement constraints
      output_kind: validation_result
      mutation_boundary: readonly
      ui_primitive_consumers:
        - ApplyConfirmDialog
        - ResponsiveRuleEditor

    apply_confirmed_layout_patch:
      signature: "apply_confirmed_layout_patch(layout_id, patch) -> apply_result"
      description: Write confirmed layout patch to ui_layout_registry after validation and confirm
      output_kind: mutation_result
      mutation_boundary: explicit_confirm_required
      prerequisite:
        - validate_layout_constraint must pass
        - explicit admin confirmation required
      ui_primitive_consumers:
        - ApplyConfirmDialog
        - LayoutGridEditor

    resolve_style_token:
      signature: "resolve_style_token(token_id, context) -> resolved_value"
      description: Resolve a style token to its actual CSS value using registry and context
      output_kind: readonly
      mutation_boundary: readonly
      ui_primitive_consumers:
        - CssVariablePreview
        - StyleTokenPicker
        - ThemePreviewPanel

    preview_responsive_rule:
      signature: "preview_responsive_rule(rule, viewport) -> preview_result"
      description: Preview how a responsive rule applies to a given viewport size
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - ResponsiveRuleEditor

    validate_component_placement:
      signature: "validate_component_placement(component, layout, constraints) -> validation_result"
      description: Validate a component placement against layout constraints
      output_kind: validation_result
      mutation_boundary: readonly
      ui_primitive_consumers:
        - LayoutDropZone
        - SnapGridOverlay

    resolve_design_token_cascade:
      signature: "resolve_design_token_cascade(token_ids, context) -> cascade_result"
      description: Resolve token cascade order (component → package → global → default)
      output_kind: readonly
      mutation_boundary: readonly
      ui_primitive_consumers:
        - StyleTokenPicker
        - ThemePreviewPanel
        - CssVariablePreview

# =============================================================================
# Category F: Operation Safety Functions
# =============================================================================

category_f_operation_safety:
  label: Operation Safety Functions
  boundary: preview_validate_explicit_apply
  note: All destructive operations must pass dry_run and explicit confirm before execute
  functions:
    dry_run_operation:
      signature: "dry_run_operation(operation, context) -> dry_run_result"
      description: Simulate an operation without executing it; returns expected mutations and risks
      output_kind: preview_only
      mutation_boundary: readonly
      ui_primitive_consumers:
        - DryRunResultPanel
        - CommandPalette

    validate_mutation_boundary:
      signature: "validate_mutation_boundary(operation, policy) -> boundary_result"
      description: Check whether an operation crosses mutation boundaries defined in policy
      output_kind: validation_result
      mutation_boundary: readonly
      ui_primitive_consumers:
        - MutationBoundaryInspector
        - OperationGuardBanner

    explain_operation_risk:
      signature: "explain_operation_risk(operation, context) -> risk_explanation"
      description: Explain operation risks before confirmation
      output_kind: readonly
      mutation_boundary: readonly
      ui_primitive_consumers:
        - OperationGuardBanner
        - ApplyConfirmDialog

    check_permission_for_operation:
      signature: "check_permission_for_operation(actor, operation, target) -> permission_result"
      description: Check whether the actor has permission for the given operation on target
      output_kind: readonly
      mutation_boundary: readonly
      ui_primitive_consumers:
        - PermissionHintPanel
        - CommandPalette

    build_confirmable_operation:
      signature: "build_confirmable_operation(operation, context) -> confirmable_op"
      description: Wrap an operation in a confirmable contract with dry_run result and risk summary
      output_kind: candidate_surface
      mutation_boundary: candidate_surface
      note: confirmable_op requires explicit confirm before apply_confirmed_update
      ui_primitive_consumers:
        - ApplyConfirmDialog
        - CommandPalette

    append_operation_audit_log:
      signature: "append_operation_audit_log(operation, result, actor) -> audit_log_entry"
      description: Append an operation audit log entry after operation completes
      output_kind: append_only
      mutation_boundary: append_only
      note: Must be called after operation completes; never before
      ui_primitive_consumers:
        - OperationAuditLogPanel
        - AuditDiffDrawer

    validate_rollback_eligibility:
      signature: "validate_rollback_eligibility(diff_id, context) -> eligibility_result"
      description: Check whether a diff_log entry is eligible for rollback
      output_kind: validation_result
      mutation_boundary: readonly
      ui_primitive_consumers:
        - RollbackCandidatePanel


# =============================================================================
# Category G: Basic Calculation Operators
# =============================================================================

category_g_basic_calculation_operators:
  label: Basic Calculation Operators
  boundary: preview_candidate_surface_only
  note: >
    Minimal operator vocabulary for formula execution surfaces
    (calculate_entity_field_value / preview_computed_field / validate_formula_contract).
    No free-form eval or implicit expression execution is allowed.
    Operator outputs are preview/candidate only and never mutate DB directly.
  functions:
    add:
      signature: "add(a, b) -> number"
      description: Add two numeric values
      output_kind: preview_only
      mutation_boundary: readonly

    subtract:
      signature: "subtract(a, b) -> number"
      description: Subtract b from a
      output_kind: preview_only
      mutation_boundary: readonly

    multiply:
      signature: "multiply(a, b) -> number"
      description: Multiply two numeric values
      output_kind: preview_only
      mutation_boundary: readonly

    divide:
      signature: "divide(a, b, zero_division_policy) -> number | validation_error"
      description: Divide a by b with explicit zero-division behavior
      output_kind: preview_only
      mutation_boundary: readonly
      zero_division_policy:
        required: true
        allowed:
          - return_validation_error
          - return_zero
          - return_null

    percentage:
      signature: "percentage(numerator, denominator, zero_division_policy) -> number | validation_error"
      description: Compute percentage with explicit zero-division behavior
      output_kind: preview_only
      mutation_boundary: readonly
      zero_division_policy:
        required: true
        allowed:
          - return_validation_error
          - return_zero
          - return_null

    round:
      signature: "round(value, digits) -> number"
      description: Round value to the specified decimal digits
      output_kind: preview_only
      mutation_boundary: readonly

    floor:
      signature: "floor(value) -> number"
      description: Return the largest integer less than or equal to value
      output_kind: preview_only
      mutation_boundary: readonly

    ceil:
      signature: "ceil(value) -> number"
      description: Return the smallest integer greater than or equal to value
      output_kind: preview_only
      mutation_boundary: readonly

    min:
      signature: "min(values[]) -> number"
      description: Return the minimum value from a numeric array
      output_kind: preview_only
      mutation_boundary: readonly

    max:
      signature: "max(values[]) -> number"
      description: Return the maximum value from a numeric array
      output_kind: preview_only
      mutation_boundary: readonly

    clamp:
      signature: "clamp(value, min, max) -> number"
      description: Clamp value within the inclusive [min, max] range
      output_kind: preview_only
      mutation_boundary: readonly

# =============================================================================
# Backend Abstract Function Runtime Substrate Vocabulary
# =============================================================================

backend_abstract_function_runtime_substrate:
  execute_abstract_function:
    role: backend_wide_function_substrate_contract
    purpose: >
      Express backend function bodies as manifest-defined primitive steps when possible,
      while keeping the execution engine, DB schema, and runtime dispatch implementation
      in their owning SSOT or implementation surfaces.
    migration_rule:
      - existing_concrete_functions_remain_until_seeded_abstract_function_paths_are_tested
      - concrete_function_bodies_are_deleted_or_marked_compatibility_fallback_only_after_seed_tests_pass
    not:
      - provider_specific_runtime_handler
      - bundle_specific_backend_handler
      - frontend_authored_operation_body
      - raw_sql_surface
      - secret_projection_surface
    step_execution:
      is_compensation_step:
        definition: >
          A boolean column on abstract_function_steps. When true, the step is a compensation
          step whose purpose is to undo or mitigate side effects of previously executed normal
          steps. Compensation steps are separated from normal steps before execution begins.
          The executor runs normal steps in step_order; if any normal step throws, it catches
          the exception, runs all compensation steps best-effort (in step_order), then
          re-throws the original exception. Compensation step failures are silently swallowed.
        boundary:
          - Compensation steps run only after at least one normal step throws an exception.
          - Compensation steps may only access result_context values written before the failure
            (partial result_context). They must not assume that all normal steps completed.
          - Compensation steps must not produce side effects that depend on the operation
            completing successfully (e.g. writing new state, emitting events).
          - Compensation step results are discarded; the result_context is not updated.
          - If no exception is thrown by any normal step, compensation steps are never executed.
        application_conditions:
          - Use only for cleanup or rollback semantics (e.g. releasing a lease on failure).
          - Do NOT use for post-processing that must always run (use a normal step instead).
          - Do NOT use to branch on intermediate results; use result_context binding instead.
          - A single manifest may have multiple compensation steps; all run best-effort on failure.
          - Compensation step input bindings use required=false for context values that may
            be absent if the step that would have written them had not yet executed.
        prohibited:
          - Using is_compensation_step=true as a shortcut for conditional execution in normal flow.
          - Adding compensation steps for required post-processing (e.g. audit log, event emit).
          - Relying on compensation steps to always run; compensation is exception-path only.
  primitive_categories:
    authority:
      primitives:
        - validate_authority
      owns:
        - table_authority_check
        - column_authority_check
        - output_shape_authority_check
        - policy_binding_check
      fail_close_status:
        - missing_authority
        - invalid_authority
    input_binding:
      primitives:
        - bind_input
      owns:
        - payload_value_binding
        - context_value_binding
        - prior_step_result_binding
        - step_config_value_binding
        - constant_value_binding
      binding_sources:
        - payload
        - result_context
        - constant
        - external_context
        - step_config
        - manifest_authority
        - physical_table_binding
        - route_context
      binding_source_notes:
        step_config: >-
          Reads from the step's own step_config dictionary (manifest-seeded, not request payload).
          Used when the binding must come from manifest authority rather than payload
          (e.g. record_table_ref for attachment operations where payload-derived table authority is prohibited).
      fail_close_status:
        - missing_input
        - invalid_input_binding
    db_operation:
      primitives:
        - db_query
        - db_mutation
        - call_postgres_function
      owns:
        - manifest_authorized_read
        - manifest_authorized_write
        - opaque_postgres_function_adapter_when_justified
      prohibited:
        - frontend_raw_sql
        - payload_derived_table_authority
        - csharp_function_name_switch_as_growth_surface
    attention_and_recommendation:
      primitives:
        - sql_attention
        - recommendation_attention
        - recommendation_candidate_source
        - recommendation_eligibility
        - recommendation_score_rank
        - recommendation_projection
        - phase_attention_adapter
      owns:
        - candidate_source
        - evidence_append
        - score
        - rank
        - projection
        - lane_mixing_prevention
      prohibited:
        - route_state_auto_mutation
        - canonical_topology_auto_mutation
        - phase_attention_internals_inside_manifest_steps
        - sql_attention_projection_lane_in_hub_local_result
      sql_attention_runtime_lane_extension:
        note: >
          sql_attention projection manifests route through admin_runtime (read-only, not external_port_runtime).
          AbstractFunctionExecutionContext.RequiredRuntimeLane extends the default lane check for this lane.
          function_name and parameter_key are resolved from step_config (manifest-authority).
          source_set_id is bound from the request payload binding; it is never payload-derived authority.
        valid_runtime_lanes:
          - admin_runtime
        step_config_required_keys:
          - function_name
          - parameter_key
        payload_bound_inputs:
          - source_set_id
        table_authority_required: logs.attention
        fail_close_on_missing_policy: MissingPolicy_status_in_result_not_fail_close_exception
        fail_close_on_missing_source_set_id: missing_input_fail_close
      recommendation_attention_lane_extension:
        status: COMPATIBILITY_FALLBACK
        note: >
          COMPATIBILITY FALLBACK — recommendation_attention is the single-adapter legacy primitive.
          The canonical af09 path uses the 4-step decomposed chain
          (recommendation_candidate_source → recommendation_eligibility →
          recommendation_score_rank → recommendation_projection).
          recommendation_attention remains registered for backward compatibility;
          af09 manifest no longer routes through it.
          ContextRouteRecommendationResolver.ResolveAsync is also marked COMPATIBILITY FALLBACK
          and delegates to the same 4 sub-methods used by the decomposed primitives.
        valid_runtime_lanes:
          - runtime_executor
        step_config_required_keys:
          - function_name
          - parameter_key
        runtime_context_bound_inputs:
          - working_shape
        table_authority_required: context_route.context_hub_recommendation_current
        policy_authority_required: context_route_recommendation_resolve
        fail_close_on_missing_authority: invalid_authority_fail_close
        fail_close_on_missing_working_shape: missing_input_fail_close
        no_route_topology_overwrite: true
        phase_attention_adapter_boundary: SystemOperationCiRuntime_opaque
      recommendation_decomposed_primitive_lane_extension:
        note: >
          Canonical 4-step decomposed primitive chain for af09 (context_route.recommendation_resolve).
          Each primitive is a discrete step in the manifest (bf11–bf14); intermediate results flow
          between steps via result_context binding. This is the canonical path; recommendation_attention
          is the COMPATIBILITY FALLBACK single-adapter predecessor.
          Phase Attention internals (SystemOperationCiRuntime) remain opaque inside the resolver;
          they do not appear as manifest steps.
          route/canonical_topology auto-overwrite is prohibited; context event evidence append
          runs inside recommendation_eligibility as append-only evidence accumulation.
        valid_runtime_lanes:
          - runtime_executor
        table_authority_required: context_route.context_hub_recommendation_current
        policy_authority_required: context_route_recommendation_resolve
        primitives:
          recommendation_candidate_source:
            step_order: 1
            seed_id: bf11
            result_context_key: recommendation_source
            purpose: >
              Load policy from function_parameters (manifest-authorized SQL via step_config
              function_name + parameter_key). Check vector presence and session identity.
              Load prefix candidates (before event append — ordering invariant for the LATERAL JOIN).
              Returns RecommendationCandidateSourceResult; InsufficientHistory when session is absent.
            step_config_required_keys:
              - function_name
              - parameter_key
            inputs:
              working_shape: runtime_context
            fail_close_on_missing_function_name: invalid_authority_fail_close (FUNCTION_NAME_MISSING)
            fail_close_on_missing_working_shape: missing_input_fail_close
            fail_close_on_missing_table_authority: invalid_authority_fail_close
          recommendation_eligibility:
            step_order: 2
            seed_id: bf12
            result_context_key: recommendation_eligibility
            purpose: >
              Run neighbor cosine-similarity search. Load transition stats. Append context event
              (always runs when source status is Ok — append-only evidence accumulation, not overwrite).
              Run TVR extension after event append. Apply eligibility post-check
              (InsufficientHistory for NO_CONTEXT_HISTORY / INSUFFICIENT_CONTEXT_HISTORY).
              Propagates source status early without event append when source is not Ok.
            inputs:
              working_shape: runtime_context
              recommendation_source: result_context
          recommendation_score_rank:
            step_order: 3
            seed_id: bf13
            result_context_key: recommendation_score_rank
            purpose: >
              Load attention blend map. Rank operations, context tokens, and enum items per
              ui_pressure and state_pressure lanes. Skips computation and propagates eligibility
              status when eligibility is not Ok.
            inputs:
              working_shape: runtime_context
              recommendation_source: result_context
              recommendation_eligibility: result_context
          recommendation_projection:
            step_order: 4
            seed_id: bf14
            result_context_key: recommendation_result
            purpose: >
              Assemble final ContextRouteRecommendationResult from all 3 intermediate results.
              Propagates InsufficientHistory or ExplicitError from whichever phase failed first.
              Enforces lane mixing prevention: any candidate with lane=sql_attention_projection
              in the hub-local result (NextOperations / NextTokens / NextEnumItems) is fail-closed
              with InvalidProjection status.
              sql_attention_projection candidates must come only from the dedicated SQL Attention
              primitive (af08) and must not appear in hub-local recommendation output.
            inputs:
              recommendation_source: result_context
              recommendation_eligibility: result_context
              recommendation_score_rank: result_context
            lane_enforcement:
              prohibited_in_hub_local_result: sql_attention_projection
              fail_close_status: invalid_projection
              error_token: RECOMMENDATION_HUB_LOCAL_LANE_MIXING_PREVENTED
    credential:
      primitives:
        - credential_reference_resolve
        - credential_materialize
        - credential_acquire_lease
        - credential_http_request
        - credential_compute_token_hash
        - credential_parse_expires_at
        - credential_write_vault
        - credential_release_lease
        - credential_fail_lease
      owns:
        - runtime_only_secret_resolution
        - encrypted_payload_materialization_boundary
        - external_credential_vault_refresh_primitive_chain
      universal_rules:
        provider_kind_branching: prohibited
        required_by_bundle_branching: prohibited
        csharp_default_http_method: prohibited
        csharp_default_lease_duration: prohibited
        csharp_default_expiry_response_key: prohibited
        secret_projection: prohibited
        rule: >
          credential_* primitives are generic abstract-function adapters. provider_kind and
          required_by_bundle are record/config data only and must not select provider-specific
          or bundle-specific runtime branches. HTTP method, lease duration, and expiry key
          must come from manifest step_config; C# default supplementation is fail-close invalid.
      refresh_token_manifest_vocabulary:
        credential_acquire_lease:
          role: refresh lease acquisition guard
          purpose: Acquire a DB refresh lease before any provider token request.
          required_step_config: [lease_owner, lease_duration_minutes]
          input_binding_source: external_context.credential_vault_id
          result_context_key: credential_lease
          secret_handling: no plaintext secret input or output
          fail_close_condition: missing credential_vault_id, missing lease_owner, missing/invalid lease_duration_minutes, unavailable lease
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, default_lease_duration, direct_vault_mutation_without_lease]
        credential_http_request:
          role: generic provider token request
          purpose: Send the manifest-configured token refresh HTTP request with runtime-only decrypted payload.
          required_step_config: [method]
          optional_step_config: [endpoint]
          input_binding_source: external_context.decrypted_credential_payload secret=true
          result_context_key: token_response
          secret_handling: token_response and request body are runtime-only secret material and projection/log/seed/public SSOT/front output is prohibited
          fail_close_condition: missing method, missing endpoint from step_config or port record, missing decrypted payload, non-2xx response
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, default_http_method, env_prefix_special_case_branching, logging_token_body]
        credential_compute_token_hash:
          role: token response hash derivation
          purpose: Compute the persisted token_hash through the credential crypto adapter.
          required_step_config: []
          input_binding_source: result_context.token_response secret=true
          result_context_key: token_hash
          secret_handling: reads token_response body as secret and emits only hash material
          fail_close_condition: missing token_response or unavailable crypto adapter
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, response_length_placeholder_hash, hardcoded_hash_key]
        credential_parse_expires_at:
          role: expiry extraction
          purpose: Parse the provider response expiry from a manifest-declared response key.
          required_step_config: [expires_at_response_key]
          input_binding_source: result_context.token_response secret=true
          result_context_key: token_expires_at
          secret_handling: reads token_response only inside runtime and emits DateTimeOffset only
          fail_close_condition: missing token_response, missing expires_at_response_key, invalid JSON, missing key, unsupported expiry format
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, default_expiry_key, AddHours_expiry_fallback]
        credential_write_vault:
          role: atomic encrypted vault update
          purpose: Encrypt the provider token response and atomically persist encrypted_payload, token_hash, expires_at, and version under lease/version guard.
          required_step_config: []
          input_binding_source: result_context.credential_lease, result_context.token_hash, result_context.token_expires_at, result_context.token_response, external_context credential vault record
          result_context_key: null
          secret_handling: encrypts token_response body before storage; plaintext never enters projection/log/result output
          fail_close_condition: missing vault record, missing encryption_key_reference, missing lease/hash/expiry/token_response, version conflict/write failure
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, plaintext_vault_write, write_without_lease_version_guard, expiry_fallback]
        credential_release_lease:
          role: terminal lease release
          purpose: Release the acquired refresh lease after successful vault write.
          required_step_config: []
          input_binding_source: result_context.credential_lease
          result_context_key: null
          secret_handling: no plaintext secret input or output
          fail_close_condition: missing credential_lease or repository release failure
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, synthetic_lease_creation]
        credential_fail_lease:
          role: compensation failure marker
          purpose: Mark an acquired lease failed when a prior normal credential step fails.
          required_step_config: [failure_code]
          input_binding_source: result_context.credential_lease required=false
          result_context_key: null
          secret_handling: no plaintext secret input or output; failure code must not include secret material
          fail_close_condition: compensation itself is best-effort after primary fail-close; missing lease is a no-op because acquisition may have failed before a lease existed
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, swallowing_primary_failure, logging_token_body]
      prohibited:
        - plaintext_seed
        - plaintext_projection
        - plaintext_runtime_event_log
        - provider_kind_runtime_branching
        - required_by_bundle_runtime_branching
        - csharp_default_http_method_or_lease_duration_or_expiry_key
    external_and_event:
      primitives:
        - http_request
        - scheduler_enqueue
        - event_log
      owns:
        - generic_http_adapter_call
        - queue_enqueue
        - append_only_event_record
      universal_rules:
        provider_kind_branching: prohibited
        required_by_bundle_branching: prohibited
        hidden_retry_or_silent_fallback: prohibited
        rule: >
          external_and_event primitives are generic abstract-function adapters.
          provider_kind and required_by_bundle are record/config data only and must
          not select provider-specific or bundle-specific runtime branches.
          ExternalPortPolicyStep operations (build_http_request, send_http,
          enqueue_scheduler_event, append_runtime_event_log) are compatibility
          entry adapters; the canonical path is through AbstractFunctionExecutor.
      manifest_vocabulary:
        http_request:
          role: generic outbound HTTP call
          purpose: Send a manifest-configured HTTP request to an external endpoint; no provider-specific branching.
          required_step_config: [url, method]
          optional_step_config: []
          input_binding_source: result_context.request_body (optional)
          result_context_key: http_response
          fail_close_condition: missing url, missing method, non-2xx response status
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, hidden_retry, default_http_method, silent_fallback_on_error]
        scheduler_enqueue:
          role: scheduler event marker
          purpose: Mark that a scheduler event has been enqueued for the current external port context.
          required_step_config: []
          optional_step_config: []
          input_binding_source: external_context (ExternalPortContext.SchedulerEventEnqueued flag)
          result_context_key: null
          fail_close_condition: missing ExternalPortContext
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, direct_scheduler_client_call_without_manifest_authority]
        event_log:
          role: append-only runtime event log entry
          purpose: Append a typed event log entry for the current bundle; entity ref is optional and resolved from external_context.
          required_step_config: [event_type]
          optional_step_config: [entity_ref_key]
          input_binding_source: step_config.event_type, step_config.entity_ref_key → resolved from external_context (ExportJobId, FileArtifactId, ChecksumValue, AuthorizationKey)
          result_context_key: null
          fail_close_condition: missing event_type, entity_ref_key present but unresolvable
          prohibited_behavior: [provider_kind_branching, required_by_bundle_branching, plaintext_secret_in_event_log, mutable_event_overwrite]
      compatibility_fallback_adapters:
        build_http_request: ExternalPortPolicyStep compatibility entry (not canonical)
        send_http: ExternalPortPolicyStep compatibility entry (not canonical)
        enqueue_scheduler_event: ExternalPortPolicyStep compatibility entry (not canonical)
        append_runtime_event_log: ExternalPortPolicyStep compatibility entry (not canonical)
      prohibited:
        - provider_specific_runtime_branch
        - hidden_retry_or_silent_fallback
    projection_and_failure:
      primitives:
        - projection
        - fail_close
      owns:
        - output_shape_projection
        - secret_deny_projection
        - explicit_failure_status
      fail_close_status:
        - invalid_projection
        - secret_projection_denied
        - unsupported_primitive

