version: 2
ssot_id: test-proof-manifest
status: draft

purpose:
  - Define what each test proof bundle proves and does not prove across DB, backend, runtime, external intake, instance substrate, and frontend.
  - Define chronological proof order for bundle scopes.
  - Treat tests as a system-wide proof graph, not as an unordered file list.
  - Prevent seed-only, JSON-only, UI-surface-only, backend-unit-only, or CI-runner-only evidence from being overclaimed as E2E proof.

authority_boundary:
  ssot: docs/design/test-proof-manifest-ssot.yaml
  reverse_lookup_index: .agent/docs/test-bundles.yaml
  notes:
    - This file is the design SSOT for test proof meaning and proof order.
    - .agent/docs/test-bundles.yaml remains an agent-facing reverse lookup and MUST NOT override this SSOT.
    - Test existence alone is not proof.
    - Frontend projection proof is only one downstream branch of the system proof graph.

proof_model:
  required_fields:
    - proof_id
    - proof_order
    - scope_phase
    - domain
    - source_contract
    - target_contract
    - test_files
    - proves
    - does_not_prove
    - depends_on
    - unblocks
  prohibited_claims:
    - DB seed presence alone proves runtime behavior.
    - Backend unit success alone proves scheduler/external/frontend route behavior.
    - Scheduler enqueue alone proves manifest dispatch or runtime execution.
    - Webhook/external intake alone proves canonical runtime apply.
    - Instance setting presence alone proves execution authority.
    - Seed fixture arrival alone proves admin registration or update.
    - componentIds display alone proves runtime component rendering.
    - projection JSON display alone proves user-facing UI expression.
    - admin screen render alone proves projection registration or readback.
    - fallback, error, or empty DOM alone proves successful UI expression.

chronological_scope_index:
  - proof_order: 10
    scope_phase: ssot_structure_and_policy_gate
    domain: governance
    proof_id: ssot_structure_policy_contract
    source_contract: AGENTS.md + .agent rules + framework policy
    target_contract: repository structure and SSOT routing contract
    test_files:
      - .agent/tests/check-structure.sh
      - .agent/tests/check-ssot-vocabulary-contract.sh
    depends_on: []
    unblocks:
      - db_schema_seed_contract
      - backend_runtime_function_contract
      - runtime_trigger_scheduler_contract
      - external_intake_surface_contract
      - instance_substrate_contract_gap
      - frontend_projection_expression_contract
    proves:
      - required governance and structure checks can run explicitly
      - vocabulary and SSOT routing drift can be detected at repository boundary
    does_not_prove:
      - DB schema behavior
      - backend runtime behavior
      - external or instance behavior
      - frontend UI expression

  - proof_order: 20
    scope_phase: db_schema_seed_authority
    domain: db
    proof_id: db_schema_seed_contract
    source_contract: DB schema/seed SSOT and migration contract
    target_contract: canonical DB tables, seed rows, and registration records
    test_files:
      - db/schema.sql
      - db/seed_empty.sql
      - db/demo_seed.sql
      - frontend/tests/componentCatalogSeedRegistration.test.ts
      - frontend/tests/adminDispatchManifestSeed.test.ts
      - backend/tests/Topolactor.Runtime.Tests/SsotWiringAuditComponentRegistrationTests.cs
    depends_on:
      - ssot_structure_policy_contract
    unblocks:
      - backend_runtime_function_contract
      - backend_runtime_integration_contract
      - admin_registration_promotion_contract
      - frontend_projection_expression_contract
    proves:
      - seed/catalog evidence exists where tests assert it
      - registrationRequired/catalog alignment can be checked against DB seed surfaces
      - schema/seed files are available as proof inputs
    does_not_prove:
      - live DB migration was applied
      - runtime executed against a real database
      - external source wrote through preview/apply
      - frontend rendered DB-derived records

  - proof_order: 30
    scope_phase: backend_function_boundary
    domain: backend
    proof_id: backend_runtime_function_contract
    source_contract: backend runtime function/interface contract
    target_contract: explicit function outputs and failure codes
    test_files:
      - backend/tests/Topolactor.Runtime.Tests/Topolactor.Runtime.Tests.csproj
      - .agent/tests/check-backend-tests.sh
      - .agent/tests/check-runtime-semantics.sh
    depends_on:
      - ssot_structure_policy_contract
      - db_schema_seed_contract
    unblocks:
      - backend_runtime_integration_contract
      - runtime_trigger_scheduler_contract
      - admin_registration_promotion_contract
    proves:
      - backend function boundaries can be verified by runtime unit tests
      - explicit failure behavior is testable at backend boundary
    does_not_prove:
      - integration route through scheduler/dispatcher
      - cron/hook/client trigger alignment
      - external API or instance behavior
      - frontend behavior

  - proof_order: 40
    scope_phase: backend_runtime_integration
    domain: backend
    proof_id: backend_runtime_integration_contract
    source_contract: backend function outputs
    target_contract: dispatcher/executor/integration route outputs
    test_files:
      - backend/tests/Topolactor.Integration.Tests/Topolactor.Integration.Tests.csproj
      - .agent/tests/check-unified-test-gate.sh
    depends_on:
      - backend_runtime_function_contract
    unblocks:
      - runtime_trigger_scheduler_contract
      - admin_projection_readback_contract
    proves:
      - backend integration boundary can validate dispatch/executor route behavior where covered
    does_not_prove:
      - live DB/docker-compose environment
      - external webhook or REST intake
      - real frontend projection/rendering

  - proof_order: 50
    scope_phase: runtime_trigger_scheduler
    domain: runtime
    proof_id: runtime_trigger_scheduler_contract
    source_contract: cron/hook/client trigger contract
    target_contract: scheduler-aligned runtime event contract
    ssot_refs:
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/runtime-bundle-job-scheduler-ssot.yaml
    test_files:
      - backend/tests/Topolactor.Runtime.Tests/SchedulerLoadBenchmarkTests.cs
      - backend/scheduler/RuntimeTimelineScheduler.cs
      - .agent/tests/check-unified-test-gate.sh
    depends_on:
      - backend_runtime_function_contract
      - backend_runtime_integration_contract
    unblocks:
      - manifest_dispatch_runtime_route_contract
      - external_intake_surface_contract
      - instance_substrate_contract_gap
    proves:
      - scheduler-related tests can prove trigger alignment and queue behavior where implemented
      - cron/hook/client belong before runtime route, not after it
    does_not_prove:
      - manifest dispatcher selected the correct runtime destination
      - external webhook/API intake was validated and applied
      - instance execution authority was enforced

  - proof_order: 60
    scope_phase: manifest_dispatch_runtime_route
    domain: runtime
    proof_id: manifest_dispatch_runtime_route_contract
    source_contract: scheduler-aligned runtime event contract
    target_contract: manifest dispatcher/runtime route contract
    ssot_refs:
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/pipeline-continuity-ssot.yaml
    test_files:
      - backend/tests/Topolactor.Runtime.Tests/Topolactor.Runtime.Tests.csproj
      - backend/tests/Topolactor.Integration.Tests/Topolactor.Integration.Tests.csproj
      - frontend/tests/pipelineContinuity.test.ts
    depends_on:
      - runtime_trigger_scheduler_contract
    unblocks:
      - admin_projection_readback_contract
      - frontend_projection_expression_contract
    proves:
      - dispatcher/runtime lane evidence can be connected to pipeline continuity where tests assert it
    does_not_prove:
      - external source validation/preview/apply
      - instance authority
      - rendered frontend DOM

  - proof_order: 70
    scope_phase: external_intake_and_api_surface
    domain: external
    proof_id: external_intake_surface_contract
    source_contract: external source / webhook / REST API / connector adapter contract
    target_contract: intake snapshot -> validate -> preview -> explicit apply -> canonical runtime route contract
    ssot_refs:
      - docs/design/extended-runtime-bundle-registry-ssot.yaml
    test_files:
      - docs/design/extended-runtime-bundle-registry-ssot.yaml
      - .agent/tasks/todo.md
    depends_on:
      - runtime_trigger_scheduler_contract
      - manifest_dispatch_runtime_route_contract
    unblocks:
      - external_bundle_specific_proofs_gap
    proves:
      - external surfaces require separate SSOT before implementation
      - direct DB write and direct runtime execution are prohibited by design boundary
      - webhook/REST/external intake must route through scheduler/validate/preview/apply where designed
    does_not_prove:
      - Notion/Sheets/Slack/GitHub/Webhook/REST connector implementation exists
      - connector authentication or credential handling works
      - external intake produces valid topology payload candidates
      - runtime event log/diff log evidence is produced by real external events

  - proof_order: 80
    scope_phase: external_bundle_specific_proofs
    domain: external
    proof_id: external_bundle_specific_proofs_gap
    source_contract: bundle-specific external SSOTs
    target_contract: implemented external connector proof bundles
    ssot_refs:
      - docs/design/runtime-bundle-email-ssot.yaml
      - docs/design/runtime-bundle-stripe-ssot.yaml
      - docs/design/runtime-bundle-file-storage-ssot.yaml
      - docs/design/runtime-bundle-export-sftp-ssot.yaml
      - docs/design/runtime-bundle-webhook-inbox-ssot.yaml
      - docs/design/runtime-bundle-secret-credential-ssot.yaml
    test_files: []
    depends_on:
      - external_intake_surface_contract
    unblocks: []
    proves:
      - not_yet_implemented
    does_not_prove:
      - Any specific external connector behavior until its separate SSOT and tests exist

  - proof_order: 90
    scope_phase: instance_substrate
    domain: instance
    proof_id: instance_substrate_contract_gap
    source_contract: instance settings / primitive / runtime / execution authority contract
    target_contract: instance runtime authority proof bundle
    ssot_refs:
      - docs/design/instance-port-substrate-ssot.yaml
      - docs/design/admin-console-workflow-ssot.yaml
      - docs/design/runtime-orchestration-ssot.yaml
    test_files: []
    depends_on:
      - ssot_structure_policy_contract
      - runtime_trigger_scheduler_contract
      - manifest_dispatch_runtime_route_contract
    unblocks:
      - admin_projection_readback_contract
      - frontend_projection_expression_contract
    proves:
      - not_yet_implemented
    does_not_prove:
      - instance settings topology
      - primitive registry authority
      - runtime instance selection
      - execution authority enforcement
      - credential/secret boundary behavior

  - proof_order: 100
    scope_phase: admin_surface_and_registration
    domain: admin
    proof_id: admin_registration_promotion_contract
    source_contract: admin operation + DB/catalog registration contract
    target_contract: registered topology/projection record contract
    test_files:
      - frontend/tests/adminApi.test.ts
      - frontend/tests/adminImport.test.ts
      - frontend/tests/adminUxGuard.test.ts
      - frontend/tests/uiRenderedInteraction.test.ts
      - backend/tests/Topolactor.Runtime.Tests/SsotWiringAuditComponentRegistrationTests.cs
    depends_on:
      - db_schema_seed_contract
      - backend_runtime_function_contract
      - instance_substrate_contract_gap
    unblocks:
      - admin_projection_readback_contract
    proves:
      - admin surface and backend registration/promotion boundaries are partially testable by existing tests
      - registrationRequired entries are not equivalent to registered runtime entities
    does_not_prove:
      - frontend admin operation reached backend registration boundary in one proof edge
      - projection readback consumed the promoted record
      - UI rendered the promoted record

  - proof_order: 110
    scope_phase: projection_readback_and_lane
    domain: frontend_runtime
    proof_id: admin_projection_readback_contract
    source_contract: registered topology/projection record contract
    target_contract: projection event/emission contract
    test_files:
      - frontend/tests/projectionLaneSeedHarness.test.ts
      - frontend/tests/sseLane.test.ts
      - frontend/tests/pipelineContinuity.test.ts
    depends_on:
      - admin_registration_promotion_contract
      - manifest_dispatch_runtime_route_contract
    unblocks:
      - frontend_projection_expression_contract
    proves:
      - projection lane preserves identity fields required by frontend projection constructor
      - seed/test data may be used as input fixture for lane assertions
    does_not_prove:
      - seed fixture alone proves admin registration or update
      - projection JSON display proves user-facing component rendering
      - live SSE/backend push is covered

  - proof_order: 120
    scope_phase: frontend_projection_expression
    domain: frontend
    proof_id: frontend_projection_expression_contract
    source_contract: projection event/emission contract
    target_contract: rendered component / layout / visual guard DOM contract
    test_files:
      - frontend/tests/projectionConstructor.test.ts
      - frontend/tests/projectionRuntime.test.ts
      - frontend/tests/runtimePrimitiveRenderer.test.ts
      - frontend/tests/runtimeComponentFactory.test.ts
      - frontend/tests/visualLayoutBuilder.test.ts
      - frontend/tests/adminUxGuard.test.ts
    depends_on:
      - admin_projection_readback_contract
    unblocks:
      - frontend_admin_projection_expression_completion_gap
    proves:
      - projection constructor, runtime renderer, and layout/visual guard edges are partially covered by existing tests
    does_not_prove:
      - componentKey catalog membership unless asserted by a catalog edge test
      - unknown props global policy
      - LayoutVisualAuditCanvas direct render unless dedicated test exists
      - admin-created projection reached user-facing DOM

  - proof_order: 130
    scope_phase: frontend_admin_projection_expression_completion
    domain: cross_domain
    proof_id: frontend_admin_projection_expression_completion_gap
    source_contract: admin registration/update command contract
    target_contract: visual guard DOM contract
    test_files:
      - frontend/tests/projectionLaneSeedHarness.test.ts
      - frontend/tests/uiRenderedInteraction.test.ts
      - frontend/tests/adminUxGuard.test.ts
      - frontend/tests/visualLayoutBuilder.test.ts
      - frontend/tests/runtimeComponentFactory.test.ts
      - frontend/tests/projectionConstructor.test.ts
    depends_on:
      - db_schema_seed_contract
      - backend_runtime_function_contract
      - manifest_dispatch_runtime_route_contract
      - instance_substrate_contract_gap
      - admin_registration_promotion_contract
      - admin_projection_readback_contract
      - frontend_projection_expression_contract
    unblocks:
      - frontend-admin-projection-expression-e2e-completion
    proves:
      - not_yet_implemented
    does_not_prove:
      - This proof is currently the known gap. Downstream work must add missing edge tests or cite existing proof edges by proof_id.

maintenance_rules:
  - When adding a test file, add or update a proof_id here before claiming a new proof boundary.
  - When moving a test between proof scopes, update proof_order and depends_on/unblocks in the same change.
  - DB/backend/runtime/external/instance/frontend proof gaps must remain explicit.
  - The selected CI gate should eventually consume proof_id semantics rather than raw file lists only.
