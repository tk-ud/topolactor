runtime_bundle_file_storage_ssot:
  name: runtime_bundle_file_storage
  version: 0.1.0
  status: ssot_design_document
  canonical_path: docs/design/runtime-bundle-file-storage-ssot.yaml

  purpose:
    summary: >-
      File/Storage BundleのSSOT。
      PDF / CSV / JSON / ZIP / receipt image / manifest などの保存・取得境界を定義する。
      signed download / checksum / manifest / export_job との関係を定義する。
      CLI/MCP file streamはpermitted export_job経由のみ許可する。
      object storage provider のcredential実体はこのSSOTに含めない。
    non_goals:
      - object_storage_provider_credential_specification
      - bucket_name_specification
      - direct_file_stream_outside_export_job
      - public_url_specification
      - cdn_configuration_detail

  authority_boundary:
    file_read_authority: export_job_or_authorized_api
    file_write_authority: export_job_or_authorized_backend_dispatch
    prohibited_authorities:
      - cli_mcp_direct_file_stream_outside_export_job
      - ai_autonomous_file_write
      - unauthenticated_download

  trigger_kind:
    allowed:
      - export_job_trigger
      - authorized_api_trigger
      - signed_download_request
    prohibited:
      - cli_mcp_direct_stream_outside_export_job
      - unauthenticated_file_access

  allowed_side_effects:
    - file_write_via_export_job
    - signed_url_generation_for_download
    - checksum_record_write
    - manifest_write_for_export_package
    - runtime_event_log_write

  prohibited_operations:
    - direct_file_stream_from_cli_mcp_outside_export_job
    - unauthenticated_file_access
    - file_write_without_checksum
    - silent_fallback_on_storage_failure
    - object_storage_credential_in_public_ssot
    - bucket_name_in_public_ssot
    - storage_endpoint_in_public_ssot

  public_safe_config_policy:
    allowed_in_public_ssot:
      - file_type_boundary_definition
      - export_job_relationship_definition
      - checksum_policy_definition
      - signed_download_policy_definition
      - failure_policy_definition
    prohibited_in_public_ssot:
      - storage_provider_access_key
      - storage_provider_secret_key
      - bucket_name
      - storage_endpoint_url
      - cdn_url
      - rate_limit_values

  secret_credential_boundary:
    location: runtime_secret_store_not_in_public_ssot
    policy: >-
      object storage provider credential (access key / secret key / bucket name / endpoint) は
      公開SSOTに記載しない。runtime環境変数またはsecret store経由で注入する。

  port_substrate_relation:
    substrate_ssot: docs/design/external-port-substrate-ssot.yaml
    classification: port_consumer_bundle
    port_consumer:
      - access_port
      - response_port
    credential_kind: external
    note: >-
      object storage credential は external_port_substrate の
      access_port / response_port に付属する credential_requirement として管理する。
      credential の standalone 管理 plane は作らない。

  supported_file_types:
    document_export:
      - pdf
      - csv
      - json
    archive:
      - zip
    receipt_and_manifest:
      - receipt_image
      - manifest_json

  file_flow_boundary:
    export_job:
      description: >-
        export_jobによるファイル生成。manifestとchecksumが必須。
      requires:
        - export_job_authorized
        - manifest_defined
      outputs:
        - file_artifact
        - checksum_record
        - manifest_record
    signed_download:
      description: >-
        signed URLによる一時ダウンロード。認証済みユーザーのみ。
        URLは有効期限付きで発行する。URL実値はruntime secret管理。
      requires: authenticated_user_or_authorized_export_job
      prohibited: public_unsigned_download
    checksum:
      description: >-
        ファイル整合性検証。export_job生成・取得時に検証する。
      required: true
      failure_behavior: explicit_rejection
    manifest:
      description: >-
        export packageのmanifestファイル。export_jobに紐付けて管理する。
      required_for: export_package

  cli_mcp_file_stream_policy:
    allowed: export_job_authorized_stream_only
    prohibited:
      - direct_stream_outside_export_job
      - unauthenticated_stream
    reference: docs/design/cli-model-context-protocols-port-ssot.yaml

  approval_boundary:
    policy: >-
      export_jobはapproval済みoperationの副作用として実行する。
      未承認operationからのfile writeは禁止。

  scheduler_boundary:
    policy: >-
      大容量exportなどの非同期処理はscheduler経由で行う。
      direct_runtime_execution_without_schedulerは禁止。

  audit_log_boundary:
    required: runtime_event_log
    scope:
      - export_job_initiated
      - file_write_completed
      - checksum_verified
      - signed_url_generated
      - download_completed

  failure_policy:
    on_storage_failure:
      - expose_failure_explicitly
      - record_to_runtime_event_log
      - do_not_silently_fallback
    on_checksum_failure:
      - reject_file_explicitly
      - record_to_runtime_event_log

  idempotency_policy:
    policy: >-
      同一export_job_idに対するfile writeは冪等に扱う。
      実装詳細は後段実装SSOTで定義する。

  relation_to_extended_runtime_bundle_registry:
    registry_entry: file_storage_bundle
    registry_path: docs/design/extended-runtime-bundle-registry-ssot.yaml

  relation_to_cli_mcp_port:
    ssot_path: docs/design/cli-model-context-protocols-port-ssot.yaml
    boundary: cli_mcp_file_stream_requires_authorized_export_job
    policy: >-
      CLI/MCP read/export portはexport_job経由のfile streamを許可している。
      このBundleはその許可経路を担うsurface。
      export_job外のdirect file streamは許可しない。

  operation_key_surface:
    bundle_handler: FileStorageBundleStepHandler
    note: >-
      These operation_keys are file_storage_bundle-specific and are NOT part of the generic
      external_port_substrate core operation_key_allowed_values. They are registered via
      IExternalPortBundleStepHandler extension contract defined in external-port-substrate-ssot.yaml.
    operation_keys:
      record_export_job:
        meaning: Records export job initiation metadata into topology.export_jobs using idempotency_key from payload.
        boundary: Writes job metadata only; must not write file content, credential, bucket name, or plaintext URL.
        prohibited:
          - file_content_write
          - plaintext_credential_in_payload
          - provider_specific_runtime_call
      compute_checksum:
        meaning: Computes SHA-256 hash from HTTP response body or export job reference. Stores result in execution context only.
        boundary: Computation only; must not write to DB before file_artifact record exists.
        prohibited:
          - db_write_before_artifact_exists
          - plaintext_storage_path_in_checksum
          - provider_specific_hash_algorithm
      record_file_artifact:
        meaning: Atomically writes file_artifact metadata and checksum_record into DB. Requires ChecksumValue present in context.
        boundary: Writes artifact metadata and checksum record in a single transaction; storage_ref is env-var reference identifier only.
        prohibited:
          - write_without_checksum
          - plaintext_storage_url_in_storage_ref
          - provider_specific_storage_client
      write_manifest_record:
        meaning: Writes export package manifest record into topology.export_manifests linking export_job_id and file_artifact_ids.
        boundary: Requires export_job_id and at least one file_artifact_id from execution context.
        prohibited:
          - manifest_write_without_export_job_id
          - plaintext_credential_in_manifest
          - provider_specific_format_branching
      authorize_signed_download:
        meaning: Creates a non-guessable authorization_key reference in topology.signed_download_authorizations. Does not generate or store actual signed URL.
        boundary: authorization_key is opaque reference identifier; actual signed URL resolution is runtime secret store concern.
        prohibited:
          - storing_actual_signed_url
          - plaintext_storage_credential_in_key
          - signed_url_in_output_prop

  secure_consumer_dispatch_lane_ref:
    lane_definition: docs/design/external-port-substrate-ssot.yaml#secure_consumer_dispatch_lane
    note: >-
      このバンドルの本体は checksum / manifest / artifact / signed download authorization であり、
      object storage provider-specific client ではない。
      seed binding (access_port / response_port / credential_requirement / policy_steps) は PR#460 で完了済み。
      consumer 実装は external_port_runtime → DB port record 解決 → generic operation_key policy steps
      の既存レーンを使用する。provider 固有 runtime class / client を追加しない。
    seed_binding_completion: pr460
    remaining_scope:
      physical_table:
        - export_job schema
        - file_artifact schema
        - checksum_record schema
        - manifest schema
      physical_table_manifest_binding:
        - file_storage manifest / screen_data_shape binding
      ui_builder:
        - form preset for export_job initiation
        - action wiring for portTargetRef dispatch
      portTargetRef_action_wiring:
        - export_job trigger → port record resolution → generic access/response port connect
      checksum_and_manifest:
        - checksum generation and verification
        - manifest generation for export package
      evidence_and_runtime_event_log:
        - export_job_initiated / file_write_completed / checksum_verified / signed_url_generated
      projection_response:
        - signed download authorization projection
        - file artifact projection

  explicitly_out_of_scope:
    - object_storage_provider_selection
    - storage_provider_credential_specification
    - cdn_configuration
    - file_format_transformation_logic
    - compression_algorithm_selection
    - media_file_management

  implementation_boundary_requirements:
    items:
      - export_job_schema_design
      - file_artifact_storage_schema_design
      - checksum_record_schema_design
      - signed_url_generation_service_design
      - manifest_schema_design
      - storage_provider_adapter_design
    policy: >-
      実装はこのSSOTの境界定義に基づいて別途実装SSOTを作成してから行う。
      credential / bucket実体はこのSSOTに含めない。

  external_integration_completion_gate:
    gate_ssot_ref: docs/design/external-port-substrate-ssot.yaml#external_integration_completion_gate
    note: >-
      file_storage_bundle PR が merge 可能になるための完了ゲート。
      external_port_substrate SSOT の共通 gate 4 軸 + credential resolution 基盤を全て満たすこと。
    required:
      UI_db_projection:
        status: required
        check: >-
          DB seed (topology_manifest 093) / physical_table_manifest_binding / projection 由来で
          dispatchExternalPort runtimeInteraction を生成し、frontend test が
          draftPreviewResultToEmission / renderEmission 経由で検証すること。
          手書き Emission を DB projection 接続済みとして扱わない。
      dispatch_resolution:
        status: required
        check: >-
          port_target_ref → LoadPortRecordByIdAsync → reference_key →
          LoadByReferenceKeyAsync → credential vault →
          load_encrypted_credential_payload → decrypt_for_runtime_use →
          inject_authorization_header → send_http → capture_response の通貫。
      credential_resolution_base:
        status: required
        check: >-
          file_storage access_port / response_port policy_steps に
          load_encrypted_credential_payload (step 3) /
          decrypt_for_runtime_use (step 4) /
          inject_authorization_header (step 6) が存在し executor が実行すること。
          resolve_credential_reference は reference_key 経由で
          LoadByReferenceKeyAsync を使うこと (provider_kind + required_by_bundle は不可)。
      response_queue:
        status: required
        check: >-
          ExternalPortDispatchRuntime が policy 完了後に SseEventBroadcaster.Broadcast を呼び、
          dispatch 結果が SSE lane に載ること。
          capture_response は MarkOnly ではなく HttpResponse.Body を context.OutputProp に格納すること。
      abstract_function_boundary:
        status: required
        check: >-
          record_export_job / record_file_artifact / write_manifest_record / authorize_signed_download
          および attachment bind / list / unbind は execute_abstract_function operation_key 経由で
          topology.abstract_function_manifests (af01-af07) を通じて topology.fs_* PostgreSQL functions を呼ぶこと。
          FileStorageBundleStepHandler は compute_checksum のみ保持する。
          NpgsqlExternalPortDbFunctionRepository は compatibility placeholder stub として縮退済み
          (全具体 fs_* メソッド削除済み)。
          attachment 操作の record_table_ref は step_config binding source 経由の manifest authority であり
          request payload 由来ではないこと。
    prohibited:
      - test_local_handwritten_UI_emission_treated_as_DB_projection
      - direct_FileStorageBundleStepHandler_concrete_mutation_for_non_checksum_steps
      - external_communication_without_credential_resolution_via_reference_key
      - capture_response_as_MarkOnly_treated_as_response_queued
      - inline_EndpointResponseDto_treated_as_SSE_or_projection_response
      - LoadByProviderAndBundleAsync_as_primary_credential_resolver
