version: 1
ssot: component_catalog_classification
purpose: >
  Define catalog-side component classification metadata for UI Builder, catalog search,
  registration support, and authoring support, without changing runtime route or topology judgment.

runtime_connected:
  definition: runtime adapter/renderer supported (code/runtime connection)
  note: does_not_mean_db_registered_topology_entity

runtime_reachability:
  status: added_role_based_surface_impl_bundle_2026_07_14_corrected_2026_07_15_gate0_audit
  resolution_record: >
    runtime_connected strictly means factory/constructor reachable via RUNTIME_COMPONENT_FACTORIES
    (SsotWiringAuditComponentRegistrationTests.ComponentRegistrationLane_RuntimeConnectedKinds_MustBeSupportedByFactoryRegistryBoundary)
    and this field does not redefine that. A component can be reachable at runtime because a Fresh
    route (or a parent component already reachable from one) mounts it directly —
    "existing_route_composition" records that fact as a structured, test-verified field (routeCompositionFile
    is checked against real file contents) rather than free-text catalog notes prose. 2026-07-15 gate0
    audit correction: this field is a factual reachability record only, NOT a Gate-0 hardcode exception
    grant — the prior wording ("already authorized by ... route_composition_alternative") was circular
    (admin-normal-surface-projection-seed-ssot.yaml's route_composition_alternative cited this file's
    authority, and this file cited that one back). Whether a runtimeReachability:existing_route_composition
    entry constitutes a legitimate hardcode-allowed surface or an unresolved seed-required violation is a
    Gate 0 judgment made per-entry against docs/design/runtime-orchestration-ssot.yaml, not settled by the
    presence of this field.
  values: [existing_route_composition]
  entry_fields:
    - runtimeReachability — optional; one of the values above.
    - routeCompositionFile — required when runtimeReachability is set; the file that actually
        imports/mounts the component. Verified against real file contents (not just asserted) by
        backend SsotWiringAuditComponentRegistrationTests.ComponentRegistrationLane_ExistingRouteCompositionEntries_MustBeMountedInClaimedFile
        and frontend runtimeComponentCatalogFullConnection.test.ts's route-composition reachability tests.
  helper: frontend/components/catalog.ts isRuntimeReachable(entry) returns runtimeConnected ||
    runtimeReachability === "existing_route_composition" — the single place callers needing
    "is this reachable at all" (rather than "is this factory-registered") should read from.
  prohibited:
    - redefining_runtime_connected_to_include_route_composition
    - treating_a_routeCompositionFile_claim_as_true_without_the_paired_test_verifying_it

registration_required:
  definition: requires DB registration/promotion before topology entity treatment
  rule:
    - catalog_definition_only primitive/template candidates are registrationRequired:true by default
    - registrationRequired:false is allowed only for runtime aliases that reuse an existing registered primitive path
    - exception reason must be recorded in entry notes and matched by SSOT boundary text

component_kind:
  role:
    - runtime projection key
    - runtime adapter selection key
  non_goals:
    - using component_kind as the only catalog classification axis

component_family: [primitive, template, composite, packaged, alias]
semantic_role: [input, action, display, feedback, validation, diagnostic, layout_shell, navigation, data_viewer, admin_operation]
visual_role: [field, button, badge, alert, panel, table, card, modal, tabs, tree, page_shell, json_viewer, canvas, box]
lifecycle_status: [code_only_drift, alias_maintained, bucketed, packaging, promoted, registered, deprecated]
capability_tags: [accepts_children, accepts_actions, emits_event, requires_event_binding, accepts_design, accepts_layout, displays_backend_result, displays_json, admin_only, recursive, selectable, controlled_value, error_display, loading_display, field_binding, preview_surface, export_snapshot, dashboard_placement_candidate]

catalog_vocabulary_contract:
  source_of_truth: this_ssot_defines_component_catalog_classification_values
  implementation_surface:
    file: frontend/components/catalog.ts
    fields:
      - componentFamily
      - semanticRole
      - visualRole
      - lifecycleStatus
      - capabilityTags
  test_contract:
    - tests_must_read_this_ssot
    - implementation_values_must_be_subset_of_ssot_allowed_values
    - catalog_length_or_handwritten_expected_keys_is_not_coverage_evidence

persistence:
  initial_persistence_surface: ui_component_bucket.metadata_json.classification
  promoted_registry_surface: ui_component_registry.props_schema_json
  future_promotion_candidate:
    - ui_component_registry.classification_json jsonb
    - ui_component_registry.semantic_role text
    - ui_component_registry.visual_role text
    - ui_component_registry.capability_tags text[]

placement_visibility_rule:
  dashboard_placement_candidate:
    definition: >
      Components tagged dashboard_placement_candidate can be placed on dashboard
      layouts from a dedicated DashboardCandidatePalette in UIBuilder without going
      through the DB bucket registration flow. This is independent of registrationRequired.
    rule:
      - dashboard_placement_candidate components have registrationRequired:false
      - they appear in DashboardCandidatePalette, NOT in the bucket registration catalog
      - they are NOT UIBuilder preset_ecosystem permanent child surfaces
      - their primary placement surface is /admin/team-dashboard or dashboard layouts
      - simple all-registrationRequired:false to palette expansion is prohibited

prohibitions:
  - using_component_kind_as_only_catalog_classification
  - treating_code_only_template_as_topology_entity
  - treating_alias_maintained_kind_as_new_template_registration
  - frontend_deriving_topology_judgment_from_tags
  - classification_tags_mutating_runtime_route
  - classification_tags_mutating_sql_attention
  - classification_tags_bypassing_component_registration
  - showing_all_registrationRequired_false_in_palette_without_tag_filter

seed_boundary:
  db_seed_surface:
    - ui_component_bucket bootstrap rows are concrete bucket instances
    - AI/user may add component bucket rows later
    - db seed is not classification vocabulary authority
  yaml_authority:
    - component_family
    - semantic_role
    - visual_role
    - lifecycle_status
    - capability_tags
  ci_membership_rule:
    - seed metadata_json.classification values must be subset of this SSOT
