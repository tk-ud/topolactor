runtime_bundle_secret_credential_ssot:
  name: runtime_bundle_secret_credential
  version: 0.1.0
  status: ssot_design_document
  canonical_path: docs/design/runtime-bundle-secret-credential-ssot.yaml

  purpose:
    summary: >-
      Secret/Credential BundleのSSOT。
      外部連携に必要な認証情報の管理境界を定義する。
      公開SSOTに実credential・endpoint・secret値を記載しない。
      admin_config / api triggerによるcredential管理境界を本SSOTで定義する。
    non_goals:
      - real_credential_specification_in_public_ssot
      - credential_plaintext_storage
      - credential_logging_of_secret_values
      - secret_store_vendor_specification
      - credential_sharing_policy_for_external_parties

  authority_boundary:
    credential_management_authority: admin_config_and_runtime_secret_store
    prohibited_authorities:
      - plaintext_credential_in_public_ssot
      - credential_in_runtime_event_log
      - cli_mcp_credential_read
      - ai_autonomous_credential_rotation

  trigger_kind:
    allowed:
      - admin_config_credential_registration
      - api_credential_rotation
      - system_credential_validation
    prohibited:
      - cli_mcp_credential_read_trigger
      - ai_autonomous_credential_mutation
      - plaintext_credential_api_exposure

  allowed_side_effects:
    - credential_reference_registration_in_runtime_config
    - credential_validation_result_write
    - credential_rotation_audit_log_write_reference_only

  prohibited_operations:
    - real_credential_in_public_ssot
    - credential_in_runtime_event_log
    - credential_in_audit_log_plaintext
    - silent_credential_fallback
    - cli_mcp_credential_read
    - ai_autonomous_credential_rotation_without_human_approval

  public_safe_config_policy:
    allowed_in_public_ssot:
      - credential_management_boundary_definition
      - credential_reference_pattern_definition
      - secret_store_injection_pattern
      - failure_policy_definition
    prohibited_in_public_ssot:
      - real_api_key_value
      - real_secret_key_value
      - real_endpoint_url
      - real_credential_hash
      - real_connection_string
      - real_private_key_value

  secret_credential_boundary:
    location: runtime_secret_store_not_in_public_ssot
    policy: >-
      全てのcredential実体（API key / secret key / connection string / private key / endpoint URL等）は
      公開SSOTに記載しない。runtime環境変数またはsecret store経由で注入する。
      このSSOT自体もcredential実体を含まない。

  credential_management_flow:
    registration:
      description: >-
        admin_configによるcredential参照登録。
        実値はsecret store経由で管理する。
      actor: admin_user
      prohibited: plaintext_credential_storage
      validation_lifecycle: >-
        登録後に post-registration validation を実行する。
        secret store が利用不可 (store_unavailable) の場合は fail-close — 登録失敗。
        secret store が利用可能だが credential が未設定 (credential_not_present) の場合は
        登録成功・validation_status=invalid で明示返却 (silent success 禁止)。
        admin は後から credential を secret store に設定し、validate action で確認する。
    rotation:
      description: >-
        credentialのrotation。明示的admin操作による。
        rotation結果はaudit logに参照のみ記録（実値は記録しない）。
      actor: admin_user_or_authorized_system
      logs_to: runtime_event_log_reference_only
      audit_order: >-
        credential_rotated (success) audit は post-rotation validation 成功・ConfirmRotationAsync 完了後に書く。
        validation 失敗時は credential_rotation_failed のみ記録 (credential_rotated: success は書かない)。
      actor_authority: >-
        rotation_actor_id は backend が JWT sub claim から確定する。
        frontend payload から rotation_actor_id を受け取らない。
    validation:
      description: credential参照の有効性検証。
      required_at:
        - registration
        - rotation
        - runtime_startup
      runtime_startup_policy: >-
        runtime_startup validation は全 credential_reference を検証し、結果を DB に記録する。
        validation 失敗はログおよび DB の validation_status に記録するが、runtime 起動はブロックしない。
        fail-close (store_unavailable) は credential 使用時 (runtime injection 時) に適用する。
    runtime_injection:
      description: >-
        runtime起動時のsecret store経由でのcredential注入。
        環境変数またはsecret manager API経由。
      prohibited: plaintext_in_config_file

  scheduler_boundary:
    policy: >-
      credential rotation / validation のバックグラウンド実行はscheduler経由で行う。
      direct_runtime_execution_without_schedulerは禁止。

  approval_boundary:
    policy: >-
      credentialのrotationは明示的admin操作または承認済みautomation jobとして実行する。
      AI単独判断・暗黙的rotationは禁止。

  audit_log_boundary:
    required: runtime_event_log
    policy: >-
      audit logにはcredential参照識別子のみ記録する（実値は絶対に記録しない）。
    scope:
      - credential_registered_reference_only
      - credential_rotated_reference_only
      - credential_validation_success
      - credential_validation_failure
      - credential_rotation_failed

  failure_policy:
    on_credential_validation_failure:
      - expose_failure_explicitly
      - record_validation_failure_to_runtime_event_log_without_credential_value
      - do_not_silently_fallback
    on_secret_store_unavailable:
      - fail_close_with_explicit_error
      - do_not_use_cached_credential_silently
    on_rotation_failure:
      - expose_failure_explicitly
      - record_to_runtime_event_log_reference_only

  idempotency_policy:
    policy: >-
      同一credential参照IDに対するrotation操作は冪等に扱う。
      実装詳細は後段実装SSOTで定義する。

  relation_to_extended_runtime_bundle_registry:
    registry_entry: secret_credential_bundle
    registry_path: docs/design/extended-runtime-bundle-registry-ssot.yaml
    owner_status: implemented
    core_bundle_status: implemented
    implementation_ssot: docs/design/runtime-bundle-secret-credential-implementation-ssot.yaml

  relation_to_cli_mcp_port:
    ssot_path: docs/design/cli-model-context-protocols-port-ssot.yaml
    boundary: credential_read_is_explicitly_prohibited_for_cli_mcp_port
    policy: >-
      CLI/MCP read/export portはcredential readをout_of_scopeとして扱う。
      このBundleはCLI/MCP経由のcredential read/export経路を提供しない。

  explicitly_out_of_scope:
    - real_credential_specification
    - secret_store_vendor_selection
    - credential_encryption_algorithm_selection
    - key_management_service_configuration
    - credential_sharing_policy_for_external_parties
    - cli_mcp_credential_access

  future_implementation_requirements:
    status: implemented
    implementation_ssot: docs/design/runtime-bundle-secret-credential-implementation-ssot.yaml
    implemented_items:
      - credential_reference_schema (topology.credential_references + logs.credential_audit_log)
      - secret_store_adapter (ICredentialStore / EnvironmentVariableCredentialStore)
      - credential_registration_ui (AdminCredentialPanel.tsx via seed-driven dispatch routing)
      - credential_rotation_service (HandleRotateAsync: JWT actor authority / rotation_pending lifecycle / fail-close)
      - credential_validation_service (CredentialValidationService.ValidateAsync)
      - credential_injection_pattern (ICredentialStore.GetAsync / SetAsync)
      - audit_log_schema (logs.credential_audit_log: reference_key + outcome only, no credential values)
      - runtime_startup_validation (CredentialStartupValidationService: IHostedService)
    policy: >-
      実装詳細は runtime-bundle-secret-credential-implementation-ssot.yaml に記載する。
      credential実体はこのSSOTを含む公開SSOTに含めない。
