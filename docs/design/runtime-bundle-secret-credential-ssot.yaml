runtime_bundle_secret_credential_ssot:
  name: runtime_bundle_secret_credential
  version: 0.2.0
  status: ssot_design_document
  canonical_path: docs/design/runtime-bundle-secret-credential-ssot.yaml

  purpose:
    summary: >-
      Secret/Credential Bundle の SSOT。
      本 Bundle は独立実装 Bundle ではなく、
      external_port_substrate の credential_requirement 境界定義として統合する。
      port record (access_port / response_port / hook_port) の付属要件として
      credential_requirement を定義する。
      公開 SSOT に real credential・endpoint・secret 値を記載しない。
      dedicated credential runtime / admin UI / audit log / rotation service は作らない。
    non_goals:
      - real_credential_specification_in_public_ssot
      - credential_plaintext_storage
      - credential_logging_of_secret_values
      - secret_store_vendor_specification
      - credential_sharing_policy_for_external_parties
      - dedicated_credential_runtime
      - dedicated_credential_admin_ui
      - credential_rotation_service
      - credential_startup_validation_service
      - secret_credential_bundle_as_standalone_runtime
      - secret_store_adapter_as_standalone_runtime

  authority_boundary:
    credential_requirement_authority: port_record_attachment_not_standalone_entity
    prohibited_authorities:
      - plaintext_credential_in_public_ssot
      - credential_in_runtime_event_log
      - cli_mcp_credential_read
      - ai_autonomous_credential_rotation
      - dedicated_credential_runtime
      - dedicated_credential_management_plane

  trigger_kind:
    allowed:
      - admin_role_port_record_write_with_credential_requirement
      - validate_preview_apply_for_port_record_with_credential
    prohibited:
      - cli_mcp_credential_read_trigger
      - ai_autonomous_credential_mutation
      - plaintext_credential_api_exposure
      - credential_rotation_trigger
      - credential_startup_validation_trigger
      - standalone_credential_registration_trigger

  allowed_side_effects:
    - port_record_credential_requirement_attachment_via_validate_preview_apply
    - admin_role_port_setting_write

  prohibited_operations:
    - real_credential_in_public_ssot
    - credential_in_runtime_event_log
    - credential_in_audit_log_plaintext
    - silent_credential_fallback
    - cli_mcp_credential_read
    - ai_autonomous_credential_rotation_without_human_approval
    - dedicated_credential_runtime
    - dedicated_credential_admin_ui
    - dedicated_credential_repository
    - dedicated_credential_audit_log
    - credential_rotation_service
    - credential_startup_validation_service
    - secret_store_adapter_runtime

  public_safe_config_policy:
    allowed_in_public_ssot:
      - credential_requirement_boundary_definition
      - port_record_level_credential_kind_definition
      - secret_store_injection_pattern_reference
      - failure_policy_definition
    prohibited_in_public_ssot:
      - real_api_key_value
      - real_secret_key_value
      - real_endpoint_url
      - real_credential_hash
      - real_connection_string
      - real_private_key_value


  db_guarded_external_vault_exception:
    bundle: external-port-substrate-db-credential-vault-refresher
    rule: >
      "secret plaintext never stored" remains mandatory for UI / projection / public SSOT / seed SQL /
      audit log / runtime_event_log. For provider re-presentation credentials such as OAuth refresh payloads,
      topology.external_credential_vault may hold encrypted_payload plus token_hash under the
      external_port_substrate port record attachment boundary.
    not_a_standalone_plane:
      - no dedicated credential runtime
      - no credential admin panel outside port context
      - no standalone rotation service
      - no startup validation service
      - no external public TokenStore
    generic_refresher: >
      Expiry handling is a generic refresher primitive driven by DB policy/config, refresh lease,
      version check, expires_at, and atomic encrypted_payload/token_hash rotation; provider-specific
      refresher classes are prohibited.

  secret_credential_boundary:
    location: runtime_secret_store_not_in_public_ssot
    policy: >-
      全ての credential 実体（API key / secret key / connection string / private key / endpoint URL 等）は
      公開 SSOT に記載しない。runtime 環境変数または secret store 経由で注入する。
      このSSOT自体も credential 実体を含まない。
      credential_requirement は port record 付属要件として reference_key のみ保持し、
      実値は保持しない。

  port_substrate_relation:
    substrate_ssot: docs/design/external-port-substrate-ssot.yaml
    classification: reclassified_as_port_substrate_component
    role: credential_requirement_boundary_definition_for_external_port_substrate
    credential_requirement_fields:
      - port_id
      - credential_kind
      - provider_kind
      - reference_key
      - required_by_bundle
    credential_kind:
      allowed_values: [auth, external, none]
      semantics:
        auth:
          owner: docs/design/auth-db-session-credential-ssot.yaml
          rule: auth.credentials の最奥 boundary の特殊形。external secret は混入しない。
        external:
          meaning: port_record_level_credential_requirement
          rule: 実値不保持。reference_key のみ。consumer bundle 未接続でも standalone service 不起動。
        none:
          meaning: no_credential_required
    constraint:
      - secret_plaintext_never_stored_in_db_ui_ssot_or_audit_log
      - credential_requirement_travels_with_port_record_not_standalone
      - consumer_bundle_unconnected_triggers_fail_close_not_standalone_service

  scheduler_boundary:
    policy: >-
      port record の credential_requirement 付属は validate → preview → apply 経由で行う。
      credential standalone rotation / validation のバックグラウンド実行は禁止。
      direct_runtime_execution_without_scheduler は禁止。

  approval_boundary:
    policy: >-
      port record への credential_requirement 設定は
      validate → preview → explicit apply の境界を維持する。
      AI 単独判断・暗黙的 credential 変更は禁止。

  audit_log_boundary:
    required: runtime_event_log
    policy: >-
      audit log には credential 参照識別子のみ記録する（実値は絶対に記録しない）。
    scope:
      - port_record_credential_requirement_set
      - port_record_credential_requirement_unset
      - port_record_apply_completed
      - port_record_apply_failed

  failure_policy:
    on_credential_missing_at_consumer:
      - fail_close_with_explicit_error
      - do_not_silently_fallback
    on_secret_store_unavailable:
      - fail_close_with_explicit_error
      - do_not_use_cached_credential_silently
    on_port_record_apply_failure:
      - expose_failure_explicitly
      - record_to_runtime_event_log_reference_only

  idempotency_policy:
    policy: >-
      同一 port_id に対する credential_requirement 設定は冪等に扱う。
      validate → preview → apply 境界で重複適用を防ぐ。
      実装詳細は後段実装 SSOT で定義する。

  relation_to_extended_runtime_bundle_registry:
    registry_entry: secret_credential_bundle
    registry_path: docs/design/extended-runtime-bundle-registry-ssot.yaml
    note: >-
      secret_credential_bundle は独立実装 Bundle として登録しない。
      external_port_substrate の credential_requirement 境界定義として統合する。

  relation_to_cli_mcp_port:
    ssot_path: docs/design/cli-model-context-protocols-port-ssot.yaml
    boundary: credential_read_is_explicitly_prohibited_for_cli_mcp_port
    policy: >-
      CLI/MCP read/export port は credential read を out_of_scope として扱う。
      この Bundle は CLI/MCP 経由の credential read/export 経路を提供しない。

  explicitly_out_of_scope:
    - real_credential_specification
    - secret_store_vendor_selection
    - credential_encryption_algorithm_selection
    - key_management_service_configuration
    - credential_sharing_policy_for_external_parties
    - cli_mcp_credential_access
    - dedicated_credential_runtime
    - dedicated_credential_admin_ui
    - credential_rotation_service
    - credential_startup_validation_service
    - standalone_secret_credential_bundle_runtime

  implementation_boundary_requirements:
    items:
      - port_record_credential_requirement_schema_design
      - credential_kind_switch_in_port_admin_ui_design
      - reference_key_resolution_pattern_design
      - fail_close_behavior_for_missing_credential_design
    policy: >-
      実装は external_port_substrate SSOT の境界定義に基づいて
      別途実装 SSOT を作成してから行う。
      credential 実体はこの SSOT を含む公開 SSOT に含めない。
      credential_rotation_service / credential_registration_ui /
      credential_validation_service は作らない。
