runtime_bundle_job_scheduler_ssot:
  name: runtime_bundle_job_scheduler
  version: 0.1.0
  status: ssot_design_document
  canonical_path: docs/design/runtime-bundle-job-scheduler-ssot.yaml

  purpose:
    summary: >-
      Job/Scheduler BundleのSSOT。
      cron / hook / client trigger を統合するJob Scheduler境界を定義する。
      runtime destination selectionはこのBundleが所有しない。
      manifest_dispatcherがruntime destinationを決定する。
      trigger_alignment / causal_order / collision_control の境界を本SSOTで定義する。
    non_goals:
      - runtime_destination_selection_ownership
      - role_semantics_definition
      - topology_meaning_judgment
      - polling_as_primary_behavior
      - scheduler_as_data_polling_owner

  authority_boundary:
    scheduler_authority: trigger_alignment_and_runtime_queue_only
    prohibited_authorities:
      - runtime_destination_selection
      - role_behavior_hardcoding
      - topology_judgment
      - silent_trigger_fallback

  trigger_kind:
    allowed:
      - cron
      - hook
      - client
    prohibited:
      - direct_runtime_execution_bypassing_scheduler
      - silent_trigger_drop

  allowed_side_effects:
    - scheduler_queue_enqueue
    - causal_order_enforcement
    - collision_control_record
    - runtime_event_log_write_on_scheduler_events

  prohibited_operations:
    - runtime_destination_selection_by_scheduler
    - scheduler_bypassing_manifest_dispatcher
    - silent_fallback_on_trigger_failure
    - scheduler_as_polling_primary
    - topology_meaning_judgment_in_scheduler
    - role_behavior_hardcoded_in_scheduler

  public_safe_config_policy:
    allowed_in_public_ssot:
      - trigger_kind_boundary_definition
      - scheduler_queue_contract
      - causal_order_policy
      - collision_control_policy
      - failure_policy_definition
    prohibited_in_public_ssot:
      - cron_schedule_values_for_specific_environments
      - external_scheduler_provider_credentials
      - scheduler_provider_endpoint

  secret_credential_boundary:
    location: runtime_secret_store_not_in_public_ssot
    policy: >-
      外部スケジューラーprovider credential（endpoint / API key等）は
      公開SSOTに記載しない。runtime環境変数またはsecret store経由で注入する。
      topolactor内蔵schedulerの場合はcredentialは不要。

  port_substrate_relation:
    substrate_ssot: docs/design/external-port-substrate-ssot.yaml
    classification: port_consumer_bundle
    port_consumer:
      - access_port
      - hook_port
    credential_kind: external
    note: >-
      外部スケジューラー provider credential は external_port_substrate の
      access_port / hook_port に付属する credential_requirement として管理する。
      topolactor 内蔵 scheduler 利用時は credential_kind: none。
      credential の standalone 管理 plane は作らない。

  scheduler_contract:
    role: trigger_alignment_and_runtime_queue
    input:
      - cron_trigger
      - hook_trigger
      - client_trigger
    output:
      - scheduler_aligned_runtime_event
    owns:
      - trigger_alignment
      - runtime_queue
      - runtime_phase
      - causal_order
      - collision_control
      - execution_boundary
    not_owns:
      - runtime_destination_selection
      - role_semantics
      - topology_meaning_judgment
      - polling_primary_behavior
    reference_ssot: docs/design/runtime-orchestration-ssot.yaml

  scheduler_boundary:
    policy: >-
      全ての trigger (cron / hook / client) は scheduler 経由で
      runtime routeに入力する。
      scheduler を bypass した direct runtime execution は禁止。
    required_flow:
      - trigger_kind
      - scheduler
      - manifest_dispatcher
      - runtime_route

  approval_boundary:
    policy: >-
      job実行前のapprovalが必要な場合、approval確認はscheduler外部のUI/approval境界で行う。
      scheduler自体がapproval判断を持たない。

  audit_log_boundary:
    required: runtime_event_log
    scope:
      - trigger_received
      - scheduler_enqueued
      - execution_started
      - execution_completed
      - execution_failed
      - collision_detected
      - queue_overflow

  failure_policy:
    on_queue_overflow:
      client_triggers: return_explicit_error_signal
      cron_or_hook_triggers: return_explicit_bool_false
      prohibited: silent_trigger_drop
    on_trigger_failure:
      - expose_failure_explicitly
      - record_to_runtime_event_log
    on_cancellation:
      client_triggers: return_explicit_canceled_signal
      non_client_triggers: log_and_swallow_fire_and_forget_service_stopping

  idempotency_policy:
    policy: >-
      同一trigger event IDに対するscheduler enqueueは冪等に扱う。
      実装詳細はruntime_orchestration_ssotおよび後段実装SSOTで定義する。

  relation_to_extended_runtime_bundle_registry:
    registry_entry: job_scheduler_bundle
    registry_path: docs/design/extended-runtime-bundle-registry-ssot.yaml

  relation_to_cli_mcp_port:
    ssot_path: docs/design/cli-model-context-protocols-port-ssot.yaml
    boundary: scheduler_execution_is_internal_runtime_not_cli_mcp_port
    policy: >-
      CLI/MCP read/export portはscheduler executionをout_of_scopeとして扱う。
      このBundleはCLI/MCP portへのexposed interfaceを持たない。

  relation_to_runtime_orchestration:
    ssot_path: docs/design/runtime-orchestration-ssot.yaml
    boundary: job_scheduler_bundle_extends_runtime_timeline_scheduler_contract
    policy: >-
      このBundleはruntime_orchestration_ssotのscheduler_contractを基礎とする。
      cron/hook/client trigger統合境界の詳細設計はこのSSOTが担う。
      runtime destination selection は manifest_dispatcher が所有する（変更なし）。

  explicitly_out_of_scope:
    - runtime_destination_selection
    - manifest_dispatcher_responsibility
    - topology_meaning_definition
    - role_semantics_definition
    - external_scheduler_provider_selection
    - polling_primary_pattern

  implementation_boundary_requirements:
    items:
      - job_queue_schema_design
      - cron_trigger_driver_loop_design
      - hook_trigger_intake_design
      - client_trigger_intake_design
      - collision_control_implementation_design
      - scheduler_overflow_policy_implementation
      - job_execution_log_schema_design
    policy: >-
      実装はこのSSOTの境界定義に基づいて別途実装SSOTを作成してから行う。
      runtime_orchestration_ssotのscheduler_contractとの整合を維持する。
