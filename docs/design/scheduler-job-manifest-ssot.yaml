scheduler_job_manifest_ssot:
  name: scheduler_job_manifest_substrate
  version: 1.0.0
  status: implemented_substrate_design_document
  canonical_path: docs/design/scheduler-job-manifest-ssot.yaml

  purpose:
    summary: >-
      Define the scheduler job manifest substrate that lets seed data or
      admin.contents author scheduler jobs as data. Cron/background drivers read
      manifests, lease authorized input sources, dispatch ordered abstract
      function steps, and record run/status outcomes without embedding domain job
      bodies in scheduler code.
    goals:
      - admin_contents_authorable_scheduler_job_manifest
      - data_defined_schedule_input_credential_steps_output_retry_lease_policy
      - cron_driver_reads_manifest_only
      - input_source_lease_then_abstract_function_step_chain
      - result_upsert_and_status_update_through_manifest_authority
      - future_absorption_path_for_existing_cron_routes
    non_goals:
      - implementation_code_change
      - db_migration_or_seed_change
      - admin_contents_ui_implementation
      - existing_cron_absorption_implementation
      - production_ready_or_implemented_status_claim
      - domain_specific_scheduler_body_definition

  references:
    foundation:
      - docs/framework-core.yaml
      - docs/framework-policy.yaml
    runtime_and_admin:
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/admin-console-workflow-ssot.yaml
    substrates:
      - docs/design/abstract-function-primitive-registry-ssot.yaml
      - docs/design/external-port-substrate-ssot.yaml
      - docs/design/db-schema.yaml

  authoring_surface:
    owner: admin.contents
    role: seed_or_admin_authored_data_defined_surface
    operations:
      create: create_scheduler_job_manifest_draft
      edit: edit_scheduler_job_manifest_draft_or_inactive_manifest
      disable: set_scheduler_job_active_false
    data_defined_fields:
      - job_key
      - trigger_kind
      - schedule_policy_kind
      - cron_expression
      - schedule_interval_seconds
      - timezone
      - manual_run_allowed
      - active
      - input_source_binding
      - input_due_column
      - input_status_pending_value
      - input_status_processing_value
      - input_status_completed_value
      - input_status_failed_value
      - credential_requirement_reference
      - external_port_reference
      - abstract_function_step_chain
      - output_upsert_binding
      - retry_policy
      - lease_policy
      - authority_scope
    seed_data_defined_surfaces:
      ui_schema: scheduler_job_manifest_ui_schema
      action_wiring: scheduler_job_manifest_admin_actions
      projection: scheduler_job_manifest_projection
      runtime_interaction: scheduler_job_manifest_runtime_route_binding
    constraints:
      - admin_ui_authors_manifest_records_not_scheduler_code
      - projection_displays_references_and_status_only_not_secret_material
      - action_wiring_invokes_backend_admin_runtime_authority_not_frontend_runtime_judgment
      - active_manifest_or_seed_manifest_is_authority_surface_for_scheduler_execution
      - disabling_a_job_prevents_new_due_selection_without_deleting_run_ledger

  admin_hub_relation_navigation:
    ref: docs/design/admin-console-workflow-ssot.yaml admin_hub_relation_navigation_contract
    status: blocked_pending_seed_catalog
    canonical_route_registry_status: ratified
    note: >-
      admin-surface-topology-seed-conversion Bundle. /admin/scheduler is now ratified into
      docs/design/runtime-orchestration-ssot.yaml frontend_routes.admin (it was previously
      implemented and fully dispatcher-mapped — list_settings/create/edit/disable all four — but
      absent from that registry). It is not yet reachable via admin hub relation navigation from
      /admin: hub relation resolution requires a real per-screen ui_projection manifest for
      scheduler_jobs, which does not exist yet — only per-action dispatcher_mapping manifests
      exist today. The edit action (scheduler_jobs:edit) has full backend/dispatcher wiring but is
      not yet exposed as a UI control on the current frontend/routes/admin/scheduler.tsx surface
      (see frontend/content/adminGuides.ts ADMIN_ROUTE_CARDS caution text) — closing that UI gap
      remains open scheduler-settings subBundle work, tracked as remaining_gap in
      .agent/reports/admin-surface-topology-seed-conversion-design-resolution.json.

  scheduler_substrate:
    role: generic_runtime_time_axis_queue_for_job_manifests
    allowed_responsibilities:
      - cron_tick
      - due_job_selection
      - schedule_policy_due_evaluation
      - input_source_selection_by_manifest_authority
      - input_lease_acquire_release_fail
      - queue_or_run_creation
      - run_ledger_write
      - ordered_step_dispatch
      - run_step_status_update
      - job_run_status_update
    prohibited_responsibilities:
      - sql_attention_job_body
      - weather_api_job_body
      - retention_job_body
      - domain_specific_if_switch_or_handler_selection
      - trigger_kind_as_domain_job_body_selector
      - csharp_function_name_array_as_canonical_sequence
      - payload_derived_table_or_column_authority
      - credential_plaintext_materialization_outside_runtime_only_boundary
    driver_rule: >-
      Cron/background drivers may only tick, ask for active due manifests from
      topology.scheduler_jobs, and hand manifest/run identifiers to the generic
      scheduler substrate. trigger_kind is limited to the runtime-orchestration
      trigger vocabulary (cron, hook, client); cron expression, interval,
      manual-only, and due-column details belong to schedule_policy_kind and
      due policy fields. Drivers must not know whether a job performs SQL
      Attention, weather ingestion, retention, export, or any other domain
      sequence.
    sequence_rule: >-
      Domain sequence belongs to scheduler_job_steps as an ordered
      abstract_function_key chain. The substrate dispatches each step through the
      AbstractFunctionExecutor and passes manifest-defined input_binding values
      plus accumulated result_context.

  logical_entities:
    topology.scheduler_jobs:
      role: scheduler_job_manifest_header_and_authority_scope
      conceptual_fields:
        scheduler_job_id: stable_manifest_identifier
        job_key: unique_human_readable_job_key
        trigger_kind: runtime_orchestration_trigger_kind_cron_hook_or_client
        schedule_policy_kind: cron_expression_interval_seconds_due_column_or_manual_only
        cron_expression: optional_cron_schedule_expression
        schedule_interval_seconds: optional_interval_schedule
        timezone: optional_schedule_timezone
        manual_run_allowed: explicit_admin_or_client_manual_run_permission
        active: enables_due_selection_when_true
        input_table_ref: manifest_or_registry_bound_input_table_reference
        input_id_column: manifest_or_registry_bound_input_identifier_column
        input_status_column: manifest_or_registry_bound_status_column
        input_status_pending_value: manifest_defined_lifecycle_value_for_due_unprocessed_input
        input_status_processing_value: manifest_defined_lifecycle_value_written_after_processing_lease_acquired
        input_status_completed_value: manifest_defined_lifecycle_value_for_successfully_completed_input
        input_status_failed_value: manifest_defined_lifecycle_value_for_terminal_failed_input
        input_status_skipped_value: optional_manifest_defined_lifecycle_value_for_policy_skipped_input
        input_status_retry_wait_value: optional_manifest_defined_lifecycle_value_for_backoff_wait_input
        input_due_column: manifest_or_registry_bound_due_timestamp_column
        output_table_ref: manifest_or_registry_bound_output_table_reference
        max_batch_size: maximum_inputs_to_lease_per_tick
        lease_seconds: input_or_run_lease_duration
        retry_policy: data_defined_retry_limit_backoff_and_terminal_status
        authority_scope: table_function_credential_and_runtime_lane_scope
        credential_requirement_ref: optional_external_port_credential_requirement_reference
        external_port_ref: optional_external_port_access_or_response_port_reference
        projection_policy: keys_allowed_in_admin_projection_and_run_summary
        created_by: admin_or_seed_author_reference
        updated_at: manifest_update_timestamp
      authority_rules:
        - trigger_kind_must_be_one_of_runtime_orchestration_trigger_kind_enum_cron_hook_client
        - schedule_policy_kind_owns_cron_interval_due_column_and_manual_only_policy
        - trigger_kind_must_not_carry_composite_cron_interval_manual_or_event_due_selector_meaning
        - driver_must_not_infer_domain_job_body_from_trigger_kind
        - input_and_output_table_refs_are_not_payload_values
        - table_column_authority_comes_from_seed_admin_manifest_registry_or_authority_binding
        - status_values_are_manifest_defined_not_runtime_default_or_payload_derived
        - input_lifecycle_uses_explicit_status_values_not_boolean_processed_flag
        - processing_status_must_not_be_written_before_processing_lease_is_acquired
        - completed_failed_status_must_be_consistent_between_scheduler_job_runs_and_input_row
        - authority_scope_must_cover_input_table_output_table_and_step_functions
        - credential_plaintext_is_never_a_field

    topology.scheduler_job_steps:
      role: ordered_abstract_function_step_chain_for_scheduler_job
      conceptual_fields:
        scheduler_job_step_id: stable_step_identifier
        scheduler_job_id: parent_scheduler_job_manifest
        step_order: deterministic_execution_order
        abstract_function_key: reference_to_abstract_function_manifest_or_registry_key
        input_binding: manifest_defined_binding_from_input_row_run_context_constant_or_prior_result_context
        result_context_key: key_under_which_step_result_is_stored
        result_binding: output_mapping_from_step_result_to_result_context_or_upsert_payload
        on_error: fail_run_retry_skip_input_or_mark_input_failed
        authority_scope: optional_step_specific_authority_narrowing
        active: enables_step_when_parent_job_runs
      authority_rules:
        - step_order_input_binding_and_result_binding_are_manifest_defined
        - abstract_function_key_resolves_to_AbstractFunctionExecutor_step_chain
        - processing_function_arrays_or_csharp_switch_growth_are_not_canonical
        - payload_may_supply_values_only_not_function_or_table_authority

    topology.scheduler_job_runs:
      role: run_ledger_and_input_lease_status_for_each_job_execution
      conceptual_fields:
        scheduler_job_run_id: stable_run_identifier
        scheduler_job_id: parent_scheduler_job_manifest
        job_key: denormalized_run_identity_for_audit
        trigger_kind: trigger_kind_used_for_this_run
        schedule_policy_kind: schedule_policy_kind_used_for_due_selection
        run_status: queued_processing_completed_failed_partially_failed_cancelled_or_lease_expired
        input_ref: leased_input_identifier_or_batch_reference
        input_status_before: optional_input_status_snapshot_before_run
        input_status_after: optional_input_status_written_after_run
        attempt_count: run_attempt_count
        lease_until: runtime_lease_expiration_timestamp
        started_at: run_start_timestamp
        completed_at: run_completion_timestamp
        last_error: sanitized_structured_error_without_secret_material
        result_context: sanitized_result_context_allowed_by_projection_policy
      authority_rules:
        - run_log_contains_references_status_and_sanitized_result_context_only
        - run_log_must_not_store_secret_payload_token_response_or_plaintext_credential
        - status_updates_follow_manifest_retry_and_on_error_policy
        - completed_failed_status_must_match_manifest_defined_input_status_values

    topology.scheduler_job_run_steps:
      role: optional_per_step_ledger_for_debuggable_ordered_execution
      optional: true
      conceptual_fields:
        scheduler_job_run_step_id: stable_run_step_identifier
        scheduler_job_run_id: parent_scheduler_job_run
        scheduler_job_step_id: manifest_step_reference
        step_order: copied_execution_order
        abstract_function_key: copied_function_reference
        run_step_status: queued_running_succeeded_failed_skipped
        attempt_count: step_attempt_count
        started_at: step_start_timestamp
        completed_at: step_completion_timestamp
        last_error: sanitized_step_error_without_secret_material
        result_context_key: manifest_result_context_key
        result_context_delta: sanitized_delta_allowed_by_projection_policy

  credential_boundary:
    rules:
      - scheduler_job_manifest_never_contains_credential_plaintext
      - external_api_steps_reference_external_port_credential_requirement_or_credential_requirement_ref
      - secret_materialization_is_runtime_only_inside_authorized_abstract_function_or_external_port_runtime
      - projection_seed_run_log_admin_ui_must_not_show_secret_material_token_body_or_decrypted_payload
      - missing_or_invalid_credential_reference_fails_closed_before_external_request
    allowed_references:
      - external_port_ref
      - credential_requirement_ref
      - required_by_bundle
      - provider_kind
      - reference_key
    prohibited_fields:
      - api_key
      - access_token
      - refresh_token
      - client_secret
      - decrypted_payload
      - token_response

  input_and_table_authority:
    rules:
      - input_table_input_column_status_column_due_column_and_output_table_are_manifest_or_registry_authority
      - runtime_payload_cannot_choose_tables_columns_joins_or_output_targets
      - table_authority_and_function_authority_are_explicit_in_authority_scope_or_authority_binding
      - abstract_function_authority_bindings_remain_the_fail_close_surface_for_table_column_join_output_policy
      - leases_must_target_only_authorized_input_sources
    authority_sources:
      - seed_manifest
      - admin_authored_active_manifest
      - registry_reference
      - abstract_function_authority_binding
      - external_port_credential_requirement_reference

  abstract_function_integration:
    executor: AbstractFunctionExecutor
    dispatch_contract:
      - scheduler_loads_active_scheduler_job_steps_ordered_by_step_order
      - each_step_dispatches_by_abstract_function_key
      - input_binding_reads_authorized_input_row_run_context_constants_or_result_context
      - step_result_is_written_to_result_context_under_result_context_key
      - result_binding_maps_result_context_to_manifest_authorized_upsert_or_status_update
      - on_error_controls_fail_retry_skip_or_status_transition_without_domain_switching
    prohibitions:
      - processing_function_name_array_as_canonical_contract
      - scheduler_domain_switch_for_sql_attention_weather_retention_or_export
      - raw_sql_or_table_name_from_payload
      - silent_fallback_to_legacy_concrete_function

  runtime_execution_flow:
    owner: scheduler_job_manifest_substrate
    steps:
      - cron_background_driver_reads_active_due_job_from_topology_scheduler_jobs
      - scheduler_selects_input_by_manifest_defined_input_table_ref_input_id_column_input_status_column_input_status_values_and_input_due_column
      - scheduler_acquires_processing_lease_then_writes_input_status_processing_value
      - scheduler_loads_topology_scheduler_job_steps_ordered_by_step_order
      - scheduler_dispatches_each_abstract_function_key_through_AbstractFunctionExecutor
      - scheduler_passes_result_context_to_next_step
      - scheduler_persists_authorized_output_upsert_primitive_result
      - scheduler_writes_completed_or_failed_to_scheduler_job_runs_and_input_row
    invariants:
      - active_manifests_only
      - no_domain_job_body_in_cron_or_background_driver
      - trigger_kind_is_cron_hook_or_client_only
      - schedule_policy_kind_selects_cron_expression_interval_seconds_due_column_or_manual_only
      - input_status_pending_value_processing_value_completed_value_failed_value_are_manifest_defined
      - output_upsert_authority_comes_from_manifest_registry_or_authority_binding
      - result_context_is_sanitized_before_run_ledger_projection

  existing_cron_absorption_policy:
    rule: >-
      Existing cron routes should be absorbable by defining their due selector,
      input lease, abstract function step chain, output binding, and status policy
      as scheduler manifests. This SSOT adds no implementation migration, seed,
      admin UI, runtime code, or existing cron absorption in the current change;
      only SSOT, roadmap/todo/map references, and wiring checks are in scope.
    sql_attention_evidence_generation_conceptual_non_implementation_example:
      job_key: sql_attention_evidence_generation
      sequence:
        - watch_candidates_selection_from_manifest_authorized_input_source
        - hub_attractor_exploration_by_abstract_function_step
        - attention_generation_append_or_upsert_by_manifest_output_binding
        - input_and_run_status_update_by_scheduler_ledger_policy
      boundary:
        - scheduler_does_not_know_sql_attention_domain_body
        - sql_attention_tables_columns_and_functions_are_manifest_authorized_not_payload_derived

  conceptual_examples:
    weather_api_24h_ingestion:
      authoring: >-
        admin.contents authors an active job with region input source, 24h
        schedule, external access_port reference, credential_requirement_ref,
        ordered abstract function steps, weather observation output table binding,
        max batch size, lease seconds, and retry policy.
      flow:
        - cron_driver_ticks_and_selects_due_weather_manifest_only
        - scheduler_leases_due_region_inputs_from_manifest_authorized_input_source
        - step_1_external_api_request_primitive_uses_runtime_only_credential_materialization
        - step_2_response_parse_primitive_writes_parsed_observation_to_result_context
        - step_3_weather_observation_upsert_primitive_writes_authorized_output_table
        - scheduler_updates_run_ledger_input_status_attempt_count_and_completion_status
      secret_boundary:
        - admin_projection_shows_credential_reference_only
        - run_ledger_stores_sanitized_status_and_result_context_only
        - API_key_or_token_plaintext_never_appears_in_manifest_projection_seed_or_log

  current_change_boundary:
    note: >-
      The scheduler job manifest substrate is now implemented. This boundary records
      the implemented surface; it replaces the original SSOT-only draft boundary
      (which excluded implementation, seed, admin UI, and cron absorption).
    includes:
      - scheduler_job_manifest_tables_and_run_ledger
      - cron_background_driver_domain_independent_tick
      - manifest_authorized_input_lease_and_input_row_lifecycle
      - ordered_abstract_function_step_chain_dispatch
      - on_error_policy_fail_run_retry_skip_input_mark_input_failed_with_retry_wait
      - result_binding_manifest_authorized_output_upsert
      - admin_contents_create_edit_disable_authoring_surface
      - read_only_projection_reference_and_status_only
      - representative_existing_cron_absorption_log_retention
      - backend_and_frontend_tests
    excludes:
      - production_ready_status_claim
      - per_step_run_steps_ledger_population_optional_surface
      - in_place_edit_of_active_manifests_requires_disable_first
      - additional_existing_cron_absorptions_beyond_log_retention
