system:
  name: context-route-recommendation
  version: "6.5"
  concept: >
    Lightweight, offline-capable topology observation and recommendation engine using
    registry tensor continuity + append-only logs.

    Context Route Recommendation may consume SQL Attention-style evidence, but
    SQL Attention parent semantics are defined by sql-attention-logs-ssot.md/yaml.

    Operational context is represented as tensor state derived from registry_id
    references/relation bindings/jsonb features/log observations. Prediction uses
    neighborhood narrowing + transition/aggregation evidence over session prefixes.

    No neural training, no backprop; learning is pure aggregation.
    Optional: periodic clustering for human-readable naming (external LLM for labeling only).

registry_tensor_principle:
  role: ssot_mandatory_principle
  registry: semantic_matrix_topology_vocabulary_basis
  registry_table_role: semantic_matrix
  registry_row: registry_id_basis_vocabulary_row
  registry_column: semantic_projection_wiring_axis_column
  registry_value: weight_state_relation_coordinate_connection_cell
  registry_id_combinations: sparse_vector_or_tensor_coordinate_from_semantic_matrix
  projection_surfaces:
    db: tensor_persistence_projection
    ui: tensor_projection_surface
    endpoint: tensor_projection_surface
    runtime: tensor_expansion_surface
    scheduler: tensor_expansion_surface
    function: tensor_expansion_surface
    ci_diagnostic: tensor_projection_surface
  mandatory_interpretation: >
    Surfaces above are projections/expansions of the same registry tensor and
    must not be treated as disconnected CRUD implementations. Abstract function
    receives the tensor and executes projection/expansion on each surface.
  vector_space_rule: registry_table_structure_itself_spans_vector_space
  cross_registry_attention: registry_relation_axis_enables_attention_across_registries
  same_table_aggregation_attention_weight: count_sum_average_recency_frequency_transition_are_attention_weights
  sql_attention_not_dot_product: true
  sql_attention_not_qk_all_element_inner_product: true
  sql_attention_relation:
    role: child_projection_consumer
    canonical_reference:
      - docs/design/sql-attention-logs-ssot.md
      - docs/design/sql-attention-logs-ssot.yaml
    boundaries:
      - sql_attention_parent_definition_is_not_redefined_here
      - context_event_is_canonical_logs_ui_operation_signal_source
      - context_hub_recommendation_current_is_child_projection_current
      - context_hub_recommendation_current_is_not_logs_current
      - context_route_recommendation_is_not_main_attention_route
      - sql_attention_projection_recommendation_must_not_inject_into_hub_local_candidate_results
      - hub_local_recommendation_lanes_ui_pressure_and_state_pressure_are_not_sql_attention_parent_definition
      - logs_attention_hit_evidence_is_not_next_operation_or_next_enum_item_within_current_hub
    may_consume:
      - statistics
      - ema
      - usage_history
      - trend
      - feedback
      - attention_evidence

recommendation_semantic_authority:
  role: registry_defined_discrete_values_ssot
  canonical_sources:
    - state_registry
    - relation_registry
    - other_registry_defined_discrete_values
  rules:
    - enum_is_typed_reference_for_registry_defined_discrete_values_not_separate_semantic_ssot
    - context_token_registry_is_projection_ui_candidate_observation_helper_not_semantic_authority
    - registry_defined_state_values_can_be_vectorized_as_equal_interval_discrete_coordinates
  vectorization_example:
    formula: value_index_div_dictionary_record_count
  weight_semantics:
    - count
    - transition
    - recency
    - ema
    - feedback
  note: weights_are_importance_signals_not_semantic_meaning_itself

real_sys_table_principle:
  basic_shape: id_state_jsonb
  id_role: identity
  state_role: current_state
  jsonb_role: latent_semi_structured_payload
  relation_to_registry_tensor: observed_connected_entity_surface

jsonb_key_promotion:
  rule: jsonb_keys_can_be_columnized_into_observable_semantic_axes
  drivers:
    - observation_frequency
    - semantic_importance
    - audit_requirement

sql_attention_logs_boundary:
  canonical_reference:
    - docs/design/sql-attention-logs-ssot.md
    - docs/design/sql-attention-logs-ssot.yaml
  separation_rules:
    - context_event_is_canonical_logs_ui_operation_signal_source
    - context_hub_recommendation_current_is_not_logs_current
    - context_route_recommendation_and_sql_attention_logs_are_distinct_routes
  initial_minimal_signal_basis:
    - table
    - column
    - ui

logs_diffs_principle:
  role: physical_table_record_lifecycle_mutation_pressure_on_physical_time_axis_space
  operation_scope:
    - create
    - update
    - logical_delete
    - restore
    - physical_delete
  note: logs_diffs_is_not_current_state_sot

record_tensor_state:
  definition: record_referencing_registry_ids_is_tensor_state
  manual_vector_ownership: prohibited
  coordinate_derivation:
    - registry_id_references
    - relation_bindings
    - jsonb_features_and_promoted_columns
    - logs_and_observations

vector_cache_authority:
  vector_sparse_l2_norm: rebuildable_projection_only
  source: record_tensor_state
  sot: false
  direct_authoring:
    seed: prohibited_as_normal_path
    ui: prohibited_as_normal_path
    api: prohibited_as_normal_path
    record: prohibited

design_principles:
  offline_first: true
  cpu_only: true
  append_only_logs: true
  statistical_learning: true
  explainability:
    - "show nearest tensor-state prefixes"
    - "show contributing topology observations for neighborhood and attention weight"
  meaning_definition:
    default: >
      Semantic SoT is registry tensor continuity from registry_id references and
      DB topology observations; token.value is not manual semantic SoT.
    note: >
      Theta/cosine can be used for neighborhood filtering, but meaning authority
      remains registry tensor continuity + topology observation surfaces.
  separation_of_concerns:
    write_path:  "append event -> update minimal caches (cheap)"
    read_path:   "fast topology candidate lookup + theta/neighborhood filtering on limited tensor-state candidates"
    learn_path:  "batch/near-realtime aggregation over logs"

ui:
  sections:
    reference_info:
      id: 1
      title: "参考情報（次の情報候補）"
      goal: "この状態ならこの情報が必要"
      output: "token candidates ranked (top K) + strength"
      strength_display:
        - "cosine similarity"
        - "sigmoid strength (relative evidence, not a hard decision)"

    next_action:
      id: 2
      title: "次アクション候補"
      goal: "この作業してるなら次はこれ"
      output: "next_action ranked (top K) + probability"

  view_switch:
    - "GLOBAL"
    - "role"
    - "user (opt-in, access-controlled)"

core_ideas:
  token_context:
    definition: >
      Factual operational flow represented by session-ordered events (created_at).
      token_context is the ordered sequence itself; it is not a separate model.

  meaning_direction:
    definition: >
      Each event contributes topology observations over a record tensor state.
      A session prefix accumulates registry_id continuity, relation/log evidence,
      and DB topology observations as attention evidence (not meaning SoT).
      Theta/cosine may be used only as neighborhood filtering over limited
      candidate tensor states; attention weight is observed from
      aggregation/transition/recency/frequency/diff/logs.

  prediction:
    definition: >
      Given current topology observation context, find neighborhood-matched past
      tensor-state prefixes and infer:
        A: next_action (workflow)
        B: next_info tokens (reference/info)

  discovery:
    definition: >
      "Axis/meaning discovery" is optional and comes from clustering similar sessions.
      Naming is a human/LLM labeling layer, not required for function.

topology_observation_model:
  tensor_state_source:
    - registry_id_references
    - relation_bindings
    - jsonb_features_and_promoted_columns
    - logs_and_observations
  prefix_observation:
    definition: >
      A session prefix accumulates topology observations and attention evidence
      over record tensor states. It does not define meaning by manually authored
      token-value vectors.
  neighborhood_filtering:
    definition: >
      Theta/cosine may be used only as a bounded neighborhood filter over
      limited tensor-state candidates.
    parameters:
      k_nearest_sessions: 50
      min_similarity: 0.05
      tie_breaker: recency_weighted
  attention_weight_observation:
    definition: >
      Attention weight is observed from aggregation, transition, recency,
      frequency, diff, and logs.
    strength_display:
      intent: evidence_strength_display_not_accept_reject
      definition: neighborhood_weight_relative_evidence
  projection_cache:
    fields: [vector_sparse, l2_norm]
    rule: rebuildable_helper_not_meaning_sot

recommendation_targets:
  A_next_action:
    goal: "この作業してるなら次はこれ"
    from:
      - "session transitions (action[i] -> action[i+1])"
      - "neighbor sessions vote on next_action after matching prefix"
    output: "next_action ranked"

  B_next_info:
    goal: "この状態ならこの情報が必要"
    from:
      - "neighbor sessions vote on next_token_ids_hint"
      - "or tokens newly appearing after current prefix (delta tokens)"
    note: >
      State is not a separate entity; state is the current topology observation over the record tensor state.

entities:
  # --- Definitions ---

  context_token_registry:
    description: >
      Projection/UI token dictionary for candidate display and observation support.
      token_id is used in context_event.token_ids.
      This table is not semantic SoT; semantic authority comes from registry-defined discrete values (for example state_registry).
      value is a human-assigned ordering/display/audit reference; it is not used in recommendation computation.
      Recommendation uses multi-hot token ID presence (1.0 per token) as the topology observation signal.
      group is UI grouping only — not used as meaning authority.
    fields:
      token_id:   { type: uuid, pk: true }
      label:      { type: string }
      group:      { type: string, note: "UI grouping tag; not used in computation" }
      value:      { type: float, note: "human-assigned ordering/display/audit reference; not used in recommendation computation" }
      status:     { type: enum, values: [active, deprecated], default: active }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }
    unique_keys: [[label, group]]
    admin_ui: deleted_legacy_helper_wrapper__future_ui_must_converge_on_canonical_surface

  context_token_binding:
    description: >
      Optional domain/table scoping for token candidate filtering.
      Not required for recommendation computation; used for candidate narrowing in UI.
    fields:
      binding_id:   { type: uuid, pk: true }
      table_name:   { type: string }
      domain:       { type: string, nullable: true }
      token_group:  { type: string, note: "binds by context_token_registry.group" }
      enabled:      { type: boolean, default: true }
      created_at:   { type: timestamp }
    indexes:
      - { name: idx_ctb_table,  on: [table_name] }
      - { name: idx_ctb_domain, on: [domain] }

  context_session:
    description: "Implicit session grouping. No explicit end required."
    fields:
      session_id:   { type: uuid, pk: true }
      user_id:      { type: string, nullable: true }
      role:         { type: string, nullable: true }
      class:        { type: string, nullable: true }
      created_at:   { type: timestamp }
      last_seen_at: { type: timestamp }
    indexes:
      - { name: idx_cs_user_time, on: [user_id, last_seen_at] }
      - { name: idx_cs_role_time, on: [role, last_seen_at] }

  context_event:
    description: >
      Append-only operation event log. The only required log table.
      Each event records the active token_ids snapshot at the time of the operation.
      The ordered event sequence within a session defines the token_context.
    fields:
      event_id:              { type: uuid, pk: true }
      session_id:            { type: uuid, fk: context_session.session_id }
      user_id:               { type: string, nullable: true, default: "GLOBAL" }
      role:                  { type: string, nullable: true }
      class:                 { type: string, nullable: true }
      table_name:            { type: string }
      record_id:             { type: string, nullable: true }
      operation:             { type: string, note: "screen/action token" }
      token_ids:             { type: "uuid[]", nullable: false }
      created_at:            { type: timestamp }
      next_operation_hint:   { type: string, nullable: true, note: "supervision signal (optional)" }
      next_token_ids_hint:   { type: "uuid[]", nullable: true, note: "supervision signal (optional)" }
    indexes:
      - { name: idx_ce_session_time,   on: [session_id, created_at] }
      - { name: idx_ce_operation_time, on: [operation, created_at] }
      - { name: idx_ce_table_record,   on: [table_name, record_id] }
      - { name: idx_ce_role_operation, on: [role, operation] }
      - { name: idx_ce_token_ids,      on: [token_ids], type: gin }

  context_record_snapshot_cache:
    description: >
      Cache of current token_ids for a record to avoid expensive joins at display time.
      Rebuilt from context_event on record insert/update or token registry changes.
    fields:
      table_name:  { type: string, pk: true }
      record_id:   { type: string, pk: true }
      token_ids:   { type: "uuid[]", nullable: false }
      updated_at:  { type: timestamp }

  context_event_vector_cache:
    description: >
      Rebuildable projection cache of multi-hot event vector and l2_norm per event.
      Not SoT — source is context_event.token_ids. Rebuilt on demand.
    fields:
      event_id:       { type: uuid, pk: true, fk: context_event.event_id }
      vector_sparse:  { type: json, note: "{token_id: 1.0, ...} (multi-hot: token presence = 1.0; no value weighting)" }
      l2_norm:        { type: float, note: "sqrt(cardinality(token_ids)) for multi-hot vector" }
      updated_at:     { type: timestamp }

  context_prefix_vector_cache:
    description: >
      Rebuildable projection cache of aggregated prefix vector for (session_id, prefix_index).
      Not SoT — source is context_event.token_ids sequence. Rebuilt on demand.
      prefix_vector = SUM(multi-hot event_vectors[0..prefix_index]);
      each token contributes 1.0 per event (multi-hot).
      Used for nearest-prefix cosine neighborhood search (Θ filter, not meaning SoT).
    fields:
      session_id:    { type: uuid, pk: true, fk: context_session.session_id }
      prefix_index:  { type: int, pk: true, note: "event order within session (0..n-1)" }
      last_event_id: { type: uuid, fk: context_event.event_id }
      vector_sparse: { type: json }
      l2_norm:       { type: float }
      created_at:    { type: timestamp }
      updated_at:    { type: timestamp }

  context_transition_stats:
    description: >
      Workflow transition probability: P(next_operation | prev_operation).
      Segmented by role and user_id with GLOBAL fallback.
      prob01 = count_hits / SUM(count_hits) over the same (prev_operation, role, user_id) scope.
      count_events mirrors SUM(count_hits) and is kept in sync atomically with prob01.
      New edges get the correct denominator immediately — no transient prob01=1.0.
    fields:
      id:             { type: uuid, pk: true }
      prev_operation: { type: string }
      next_operation: { type: string }
      role:           { type: string, default: "GLOBAL" }
      user_id:        { type: string, default: "GLOBAL" }
      count_events:   { type: int, default: 0, note: "mirrors SUM(count_hits) across scope; updated atomically" }
      count_hits:     { type: float, default: 0.0 }
      prob01:         { type: float, note: "count_hits / SUM(count_hits across scope); no hardcoded smoothing" }
      updated_at:     { type: timestamp }
    unique_keys: [[prev_operation, next_operation, role, user_id]]
    recommendation_lane: ui_pressure
    transition_kind: operation
    prohibited_use:
      - enum_item_transition_aggregation
      - state_pressure_next_enum_item_inference

  context_enum_transition_stats:
    description: >
      Enum item transition probability within an enum_group: P(next_enum_index | prev_enum_index, enum_group_id).
      Segmented by role and user_id with GLOBAL fallback. Separate from context_transition_stats so
      operation transition stats and enum item transition stats must not be mixed.
      Physical DDL is SSOT-defined here; implementation may follow in db/context_route_tables.sql.
    recommendation_lane: state_pressure
    transition_kind: enum_item
    physical_ddl_status: ddl_present
    fields:
      id:             { type: uuid, pk: true }
      enum_group_id:  { type: uuid, note: "fk enum.groups.group_id" }
      prev_enum_index: { type: int, note: "enum.items.index_num or group_items position-resolved index" }
      next_enum_index: { type: int }
      role:           { type: string, default: "GLOBAL" }
      user_id:        { type: string, default: "GLOBAL" }
      count_events:   { type: int, default: 0 }
      count_hits:     { type: float, default: 0.0 }
      prob01:         { type: float, note: "count_hits / SUM(count_hits) over same (enum_group_id, prev_enum_index, role, user_id) scope" }
      updated_at:     { type: timestamp }
    unique_keys: [[enum_group_id, prev_enum_index, next_enum_index, role, user_id]]
    prohibited_use:
      - operation_transition_aggregation
      - ui_pressure_next_operation_inference
    enum_coordinate_reference:
      canonical_reference:
        - docs/design/enum-dictionary-ssot.yaml

  topology_policy_source:
    description: >
      Recommendation engine tuning parameters are NOT stored in an independent
      config table. They are stored in the existing topology function_parameters
      table as a JSON blob:
        function_name = 'context_route_recommendation_resolve'
        parameter_key = 'default_policy'
      This makes context route recommendation an optional capability of the
      existing topology, not a separate config subsystem.
      Policy-missing → ExplicitError("CONTEXT_ROUTE_POLICY_NOT_FOUND").
      No production default exists in runtime code.
    table: function_parameters
    function_name: context_route_recommendation_resolve
    parameter_key: default_policy
    seed_json: >
      {"min_similarity":0.05,"top_k":50,"min_neighbors":10,"recent_days":90,
       "max_candidates_shown":5,"baseline_weight":0.5,"neighbor_weight":0.5}
    resolver: TopologyRepository.LoadFunctionParameterAsync

  # --- Optional (v1 deferred) ---

  context_cluster:
    description: "Optional: cluster assignment for sessions for interpretability."
    optional: true
    fields:
      session_id:  { type: uuid, pk: true, fk: context_session.session_id }
      cluster_id:  { type: string }
      updated_at:  { type: timestamp }

  context_cluster_label:
    description: "Optional: human/LLM-proposed labels for clusters."
    optional: true
    fields:
      cluster_id:   { type: string, pk: true }
      label:        { type: string }
      description:  { type: string, nullable: true }
      updated_at:   { type: timestamp }

  context_drift_signal:
    description: "Optional: Bollinger-band drift/spike detection output."
    optional: true
    fields:
      signal_id:   { type: uuid, pk: true }
      signal_type: { type: enum, values: [spike, drift] }
      target:      { type: string }
      role:        { type: string, default: "GLOBAL" }
      detected_at: { type: timestamp }
      detail:      { type: json }

pipelines:
  # --- Write path ---

  write_flow:
    steps:
      - "Predict Display (use caches + aggregates + neighbor search)"
      - "User selects -> append context_event"
      - "Update caches for this event/session (cheap)"
    notes:
      - "Session starts when user clicks a search output (issue session_id)."
      - "Session ends implicitly; no explicit termination required."

  update_context_record_snapshot_cache:
    trigger: "record insert/update OR token changes"
    steps:
      - "extract current token_ids for (table, record)"
      - "upsert context_record_snapshot_cache"

  build_context_event_vector_cache:
    trigger: "on context_event insert"
    steps:
      - "for each token_id in context_event.token_ids"
      - "vector_sparse = {token_id: 1.0} (multi-hot: token presence = 1.0; no context_token_registry.value join)"
      - "l2_norm = sqrt(len(token_ids)) (multi-hot cardinality norm)"
      - "upsert context_event_vector_cache"

  build_context_prefix_vector_cache:
    trigger: "on context_event insert"
    steps:
      - "within session_id, order by created_at"
      - "prefix_vector = previous_prefix_vector + current_event_vector (SUM)"
      - "compute l2_norm"
      - "upsert context_prefix_vector_cache (session_id, prefix_index)"

  aggregate_context_transition_stats:
    schedule: "batch or near-realtime"
    personalization_hierarchy: ["user_id", "role", "GLOBAL"]
    global_overlay_rule:
      - "if user_id == 'GLOBAL': increment only GLOBAL bucket"
      - "else: increment (prev, next, role, user_id) and overlay (prev, next, role, 'GLOBAL')"
    steps:
      - "for each session_id, order events by created_at"
      - "for i in 0..n-2: prev=operation[i], next=operation[i+1]"
      - "step 1: upsert (prev, next, role, user_id) edge — count_hits += 1"
      - "step 2: for all rows with same (prev, role, user_id) scope:"
      - "  count_events = SUM(count_hits) across scope"
      - "  prob01 = count_hits / count_events"
    note: >
      Steps 1 and 2 run in a single transaction.
      count_events mirrors SUM(count_hits) across the scope so new edges always get
      the correct denominator on first insertion (no transient prob01=1.0).
      Smoothing parameters, if needed, must come from function_parameters — not hardcoded.

  cluster_sessions_for_labeling:
    schedule: "monthly (optional)"
    method: "kmeans"
    params: { k: 5 }
    vector_source: "context_prefix_vector_cache (full session or fixed prefix)"
    outputs:
      - "context_cluster"
      - "cluster centroids (implementation-specific)"
    notes:
      - "External LLM is used ONLY to propose cluster label names — not for runtime logic."

hub_local_recommendation_pressure_lanes:
  role: hub_internal_next_candidate_recommendation
  canonical_reference:
    - docs/design/sql-attention-logs-ssot.yaml
    - docs/design/sql-attention-logs-ssot.md
  space: current_hub_internal_operation_and_state_pressure
  responsibility_boundary:
    recommendation_engine:
      role: recommend_next_choice_within_current_hub
      targets:
        - operation
        - enum_item
        - component
        - route_action
      output_concept: what_to_select_press_or_navigate_next_within_current_hub
    sql_attention:
      canonical_reference:
        - docs/design/sql-attention-logs-ssot.yaml
        - docs/design/sql-attention-logs-ssot.md
      role: child_projection_consumer_only
      parent_definition_not_redefined_here: true
      targets: next_hub_projection_candidate_in_topology_concept_space
  lanes:
    ui_pressure:
      lane_id: ui_pressure
      description: UI and operation pressure within the current hub
      sources:
        - context_event
        - component_operation_event_log
      outputs:
        - next_operation
        - next_component
        - next_route_action
      aggregates:
        - context_transition_stats
      prohibited_mixing:
        - enum_item_transition_stats
        - sql_attention_projection_direct_injection
    state_pressure:
      lane_id: state_pressure
      description: State and enum transition pressure within the current hub
      sources:
        - logs.diff
        - enum_transition_logs
      outputs:
        - next_enum_item
        - likely_status
        - state_shift_candidate
      enum_linear_space:
        canonical_reference:
          - docs/design/enum-dictionary-ssot.yaml
      aggregates:
        - context_enum_transition_stats
      prohibited_mixing:
        - operation_transition_stats_as_enum_evidence
        - sql_attention_projection_direct_injection
  result_contract:
    hub_local_recommendation_result:
      required_lane: true
      lane_values:
        - ui_pressure
        - state_pressure
      prohibited_lane_values:
        - sql_attention_projection
  transition_stats_separation:
    context_transition_stats:
      transition_kind: operation
      models: prev_operation_to_next_operation
      recommendation_lane: ui_pressure
      physical_table: context_transition_stats
    context_enum_transition_stats:
      transition_kind: enum_item
      models: prev_enum_index_to_next_enum_index_within_enum_group
      recommendation_lane: state_pressure
      physical_table: context_enum_transition_stats
      physical_ddl_status: ddl_present
      ssot_entity_ref: entities.context_enum_transition_stats
    prohibited:
      - using_context_transition_stats_for_enum_item_transitions
      - using_context_enum_transition_stats_for_operation_transitions
      - collapsing_operation_and_enum_stats_without_explicit_transition_kind

routing:
  inputs:
    - current_table_name
    - current_record_id
    - current_operation
    - session_id
    - user_id
    - role

  contextualize:
    steps:
      - "token_ids = context_record_snapshot_cache(table, record); if missing compute once and cache"
      - "current_event_vector = multi-hot vector: {token_id: 1.0 for each token_id in token_ids} (neighborhood filter projection; no context_token_registry.value join)"
      - "current_prefix_vector = context_prefix_vector_cache(session_id, current_prefix_index); if missing, SUM events so far"

  recommend_section_2_next_action:
    ui_section: 2
    method: "blend of (transition stats baseline) + (neighbor session voting)"
    weights:
      baseline_weight: 0.5   # → function_parameters default_policy.baseline_weight
      neighbor_weight: 0.5   # → function_parameters default_policy.neighbor_weight
    steps:
      - "A_baseline: fetch context_transition_stats where prev_operation=current_operation and role=role"
      - "  choose bucket by fallback: (user_id=user_id) -> (user_id='GLOBAL')"
      - "A_neighbor: neighbor search over past prefixes by cosine(current_prefix_vector, past_prefix_vector)"
      - "  neighbors = top K with sim >= min_similarity, tie-break recency"
      - "  vote next_operation from neighbors"
      - "merge baseline + neighbor votes by weights"
    output:
      - "next_operation ranked (top max_candidates_shown)"
      - "prob01 (baseline), cos_sim evidence (neighbor), nearest session ids"

  recommend_section_1_reference_info:
    ui_section: 1
    method: "neighbor session voting on next_info tokens (or delta tokens)"
    steps:
      - "neighbor search over past prefixes by cosine(current_prefix_vector, past_prefix_vector)"
      - "collect candidates:"
      - "  B1: next_token_ids_hint from neighbors (if exists)"
      - "  B2: tokens newly appearing in neighbor session after current step (delta tokens)"
      - "rank by weighted vote = sum(similarity * recency_weight)"
      - "compute strength_sigmoid for UI display using tau_policy"
    output:
      - "token candidates ranked (top max_candidates_shown)"
      - "cos_sim, sigmoid_strength, top contributing tokens"

personalization_and_segmentation:
  strategy:
    hierarchy: ["user_id", "role", "GLOBAL"]
  notes:
    - "UI allows switching view: GLOBAL vs role vs individual."
    - "Individual view is opt-in and access-controlled."

drift_and_spike_detection:
  purpose: "detect changes in recommendation tendency over time"
  target_signal:
    - "distribution of top-k cosine similarities (neighbor evidence)"
    - "context_transition_stats.prob01 time series"
    - "top token candidates frequency"
  method: "bollinger_band"
  bollinger_params:
    window_n: 20
    sigma: 2.0
  segmentation:
    - "track per role and per GLOBAL to avoid population mixing"

limits:
  thresholds:
    min_neighbors: 10           # → function_parameters default_policy.min_neighbors
    min_similarity: 0.05        # → function_parameters default_policy.min_similarity
    min_events_for_stats: 30
    max_candidates_shown: 5     # → function_parameters default_policy.max_candidates_shown
  performance:
    similarity_search_scope:
      default: "recent prefixes within last X_days or same table/domain"
      X_days: 90                # → function_parameters default_policy.recent_days
    compute_budget:
      note: "sparse dot products only; no dense embeddings required"
  data_retention:
    context_event:
      hot_retention_days: 90
      cold_archive: true
    caches:
      rebuildable: true
      ttl_days: 30
  safety:
    privacy:
      - "monitoring is statistical; UI defaults to role/GLOBAL views"
      - "individual view is opt-in and access-controlled"

topology_vector_runtime:
  concept: >
    Extends the context route recommendation runtime by treating registry ID arrays
    as sparse vectors and applying SQL cosine neighbor search to registry validation,
    hub attention recommendation, transition key evidence extraction, topology MLP
    feature crossing, and feedback weight update.

    No external embedding or pgvector required.
    Uses existing PostgreSQL UUID[], JSONB, GIN indexes, relation weight, and
    transition stats.

  sql_attention_relation:
    role: child_projection_consumer
    canonical_reference:
      - docs/design/sql-attention-logs-ssot.md
      - docs/design/sql-attention-logs-ssot.yaml
    boundaries:
      - sql_attention_parent_definition_is_not_redefined_here
      - topology_vector_runtime_may_consume_attention_evidence
      - topology_vector_runtime_is_not_main_attention_route
      - quaternion_semantics_are_owned_by_sql_attention_logs_ssot
      - sql_attention_projection_recommendation_must_not_inject_into_hub_local_candidate_results
      - hub_local_recommendation_lanes_ui_pressure_and_state_pressure_are_not_sql_attention_parent_definition

  design_definitions:
    topology_attention:
      definition: >
        Extract important continuity Keys from the current hub/relation context
        and represent topology continuity in auditable Attention form.
    transition_key_evidence:
      definition: >
        Explain which table / relation / state / entity is the transition Key.
        Stored in evidence_json column of context_hub_recommendation_current.
    topology_mlp:
      definition: >
        Combine extracted Key groups and transform them into next-state / next-candidate scores.
        Initial implementation: feature crossing + weighted score transform.
        NOT a neural network.
    feedback_weight_update:
      definition: >
        Correct statistical weights from the diff between recommendation results
        and actual user selection.
        selected  → positive_delta
        ignored   → negative_delta
        missing candidate → missing_candidate_delta
        Dynamic-variable link logs are retained as inputs for later hub vocabulary
        and Topology Context Vocabulary expansion.

  registry_sparse_vector:
    multi_hot: "UUID[] = multi-hot sparse vector (unweighted)"
    weighted:  "UUID + weight = weighted sparse vector"
    targets:
      - relation_registry.master_ids
      - entities.relation_ids
      - structure_maps.component_ids
      - hub_relations.relation_registry_id + weight
    notes:
      - "registry table itself is the semantic matrix (row=registryId, column=axis, value=weight/state/relation/coordinate)"
      - "rows holding ID arrays are topology nodes that carry vectors"
      - "string label/name is search aid only — not the primary axis for cosine"
      - "existing GIN indexes are used for coarse candidate filtering"

  sql_cosine_neighbor_search:
    multi_hot_formula: "cosine = intersection_count / sqrt(cardinality(a) * cardinality(b))"
    weighted_formula:  "cosine = dot(a, b) / sqrt(norm(a) * norm(b))"
    zero_norm_policy:  "zero norm → explicit result (zero_vector); no silent fallback"
    candidate_strategy: "GIN overlap for coarse filter → cosine score on candidate set"
    policy_source:     "function_parameters (topology_vector_runtime.registry_validation)"
    magic_number_prohibition: true

  registry_vector_validation:
    classes:
      duplicate_vector:
        cosine_range: ">= duplicate_threshold"
        disposition: blocking
      near_duplicate_vector:
        cosine_range: ">= near_duplicate_threshold"
        disposition: blocking_or_confirm_required
      related_existing_registry:
        cosine_range: ">= related_threshold"
        disposition: warning
      pass:
        cosine_range: "< related_threshold"
        disposition: pass
      zero_vector:
        condition: "zero norm (empty ID array)"
        disposition: explicit_validation_result
      explicit_error:
        condition: "DB unavailable or infrastructure error"
        disposition: blocking
        is_blocking: true
        note: "fail-closed — DB unavailable is always blocking, never fail-open"
    result_shape:
      - validation_class
      - is_blocking
      - neighbors: [ { registry_id, name, cosine_score, matched_ids, reason } ]
    ui_responsibility: "projection only — no cosine computation in frontend"
    error_policy:
      broken_refs:    ExplicitError
      malformed_ids:  ExplicitError
      db_unavailable: ExplicitError("REGISTRY_VECTOR_VALIDATION_DB_UNAVAILABLE")

  entities:
    context_hub_recommendation_current:
      description: >
        Rebuildable materialized current for hub attention recommendations.
        NOT a source of truth — source is topology definition + append-only event log.
        Rebuilt from topology data + context_hub_feedback_event on demand.
      fields:
        hub_id:                { type: uuid, note: "hub being recommended for" }
        target_table:          { type: string }
        candidate_kind:        { type: enum, values: [registry, hub, entity, relation, operation, token] }
        candidate_id:          { type: uuid }
        scope_limit:           { type: int, note: "positive int; valid values are policy-defined via function_parameters.hub_attention.scope_limits. Default examples: 1000=UI instant, 3000=normal ops, 10000=wide learning" }
        base_probability:      { type: float, nullable: true }
        cosine_similarity:     { type: float, nullable: true }
        static_relation_weight: { type: float, nullable: true }
        statistical_weight:    { type: float, nullable: true }
        mlp_feature_score:     { type: float, nullable: true }
        feedback_adjustment:   { type: float, nullable: true, default: 0.0 }
        ema_fast_30:           { type: float, nullable: true, note: "EMA with fast alpha from policy" }
        ema_slow_10:           { type: float, nullable: true, note: "EMA with slow alpha from policy" }
        trend:                 { type: float, nullable: true, note: "ema_fast - ema_slow" }
        cross_state:           { type: enum, values: [up, down, none], nullable: true }
        attention_score:       { type: float, nullable: true, note: "child projection display/ranking score; must not back-propagate into SQL Attention parent evidence layer" }
        rank:                  { type: int, nullable: true }
        evidence_json:         { type: jsonb, note: "transition key evidence: relation/cosine/stat/EMA/cross" }
        mlp_feature_json:      { type: jsonb, note: "feature crossing contribution breakdown" }
        updated_at:            { type: timestamp }
      unique_key: [hub_id, target_table, candidate_kind, candidate_id, scope_limit]
      scope_limit_isolation: >
        Rows per scope_limit value are isolated by scope_limit column in the unique key.
        Valid values are policy-defined (function_parameters.hub_attention.scope_limits).
        Scope limits must not be mixed in a single read or upsert operation.

    context_hub_feedback_event:
      description: >
        Append-only event log for feedback weight updates.
        Records selected / ignored / missing candidate differences per hub per target_table.
        target_table must match context_hub_recommendation_current.target_table to scope
        feedback_adjustment update to the exact PK row
        (hub_id, target_table, candidate_kind, candidate_id, scope_limit).
        Used to rebuild feedback_adjustment in context_hub_recommendation_current.
      fields:
        feedback_id:      { type: uuid, pk: true }
        hub_id:           { type: uuid }
        target_table:     { type: string, note: "must match context_hub_recommendation_current.target_table; prevents cross-target_table feedback misapplication" }
        candidate_id:     { type: uuid }
        candidate_kind:   { type: enum, values: [registry, hub, entity, relation, operation, token] }
        scope_limit:      { type: int }
        feedback_kind:    { type: enum, values: [selected, ignored, missing_candidate] }
        delta_applied:    { type: float, note: "actual delta applied from policy at time of event" }
        created_at:       { type: timestamp }
      notes:
        - "append-only — never updated or deleted"
        - "aggregate current (feedback_adjustment) is rebuildable from this log"
        - "target_table scopes feedback to the exact PK row in context_hub_recommendation_current"
        - "without target_table, same candidate_id under different target_tables would receive erroneous cross-table feedback"

  policy_storage:
    table: function_parameters
    function_name: context_route_recommendation_resolve
    parameter_key: default_policy
    sub_key: topology_vector_runtime
    description: >
      topology_vector_runtime policy is stored as a sub-object inside the existing
      default_policy JSON blob. Not a separate config table.
    seed_json_extension: >
      {
        "topology_vector_runtime": {
          "enabled": true,
          "registry_validation": {
            "enabled": true,
            "duplicate_threshold": 1.0,
            "near_duplicate_threshold": 0.85,
            "related_threshold": 0.60,
            "top_k": 10
          },
          "hub_attention": {
            "enabled": true,
            "scope_limits": [1000, 3000, 10000],
            "ema_fast_alpha": 0.30,
            "ema_slow_alpha": 0.10,
            "max_update_candidates_per_event": 10000
          },
          "transition_key_evidence": {
            "enabled": true,
            "operation_contribution": 1.0,
            "relation_contribution": 0.8,
            "state_contribution": 0.7,
            "table_contribution": 0.6,
            "neighbor_top_k": 3
          },
          "topology_mlp": {
            "enabled": true,
            "max_feature_cross_order": 3
          },
          "feedback_weight_update": {
            "enabled": true,
            "positive_delta": 0.05,
            "negative_delta": -0.02,
            "missing_candidate_delta": 0.03
          }
        }
      }
    error_policy:
      missing:  ExplicitError("TOPOLOGY_VECTOR_RUNTIME_POLICY_NOT_FOUND")
      invalid:  ExplicitError("TOPOLOGY_VECTOR_RUNTIME_POLICY_INVALID")
      disabled: explicit_disabled_result

  semantic_boundaries:
    frontend:
      must_not:
        - cosine_computation
        - topology_judgment
        - mlp_feature_crossing
        - feedback_weight_update
      responsibility: "project backend structured result and evidence"
    backend:
      responsibility: "return structured validation result and recommendation evidence"
    database:
      responsibility: >
        store topology definition, context_hub_recommendation_current (rebuildable),
        context_hub_feedback_event (append-only)

  hub_attention_identity:
    requirement: >
      context_hub_recommendation_current writes are hub-entity-scoped.
      A dispatch must supply IdOrHubId for hub attention current to be materialized.
      Dispatches without IdOrHubId skip hub attention current writes entirely.
      sessionId must not be used as a hubId substitute.
    hub_identity_source: EndpointRequestDto.IdOrHubId → OperationVector.IdOrHubId → hubId param
    skip_condition: hubId is null

  prohibited:
    - "magic numbers for threshold/alpha/delta/limit in runtime code"
    - "independent config table for topology_vector_runtime"
    - "silent skip when enabled=false"
    - "production fallback on policy missing or invalid"
    - "cosine/topology/MLP judgment in frontend"
    - "treating context_hub_recommendation_current as source of truth"
    - "using sessionId as hubId substitute in hub attention current writes"

registrar_wide_topology_attention:
  role: child_future_projection_scope
  canonical_parent_reference:
    - docs/design/sql-attention-logs-ssot.md
    - docs/design/sql-attention-logs-ssot.yaml
  boundaries:
    - not_sql_attention_parent_definition
    - not_main_attention_route
    - not_phase_attention_or_quaternion_semantics
    - topology_recommendation_and_registrar_projection_scope_only
    - sql_attention_projection_recommendation_must_not_inject_into_hub_local_candidate_results
    - hub_local_recommendation_lanes_ui_pressure_and_state_pressure_are_not_sql_attention_parent_definition
  concept: >
    Topology Attention is not limited to screen transition or sequential enum recommendation.
    The entire registrar is treated as a topology-wide Key-Value Memory.
    Operational pressure signals in the data (record counts, edit activity, state transitions)
    become Query sources. The runtime attends over the full registrar space.
    Recommendation and UI transition are only one model case in this wider attention scope.
  query_sources:
    - high_record_count_table
    - high_edit_diff_count_table
    - high_recent_diff_rate_table
    - high_state_transition_table
    - high_re_edit_rollback_correction_table
    - current_hub
    - current_operation
    - current_record
    - current_state
    - current_table
  key_space:
    - master_registry
    - relation_registry
    - schema_registry
    - package_registry
    - component_registry
    - state_registry
    - structure_maps
    - hub_relations
  value_space:
    - topology_node
    - registry_candidate
    - relation_candidate
    - schema_candidate
    - component_candidate
    - state_candidate
    - operation_candidate
  meaning_definitions:
    high_pressure_table: >
      A table where record_count or edit_diff_count is high.
      Indicates where the domain is placing semantic load.
      This is a Topology Attention Query candidate.
    registrar: >
      Not a named lookup table.
      Topology-wide Key-Value Memory.
      The Key space for Topology Attention.
    registry_id_arrays: >
      Sparse vector basis for cosine neighbor search.
      UUID[] = multi-hot sparse vector.
  log_separation:
    state_transition_log:
      role: phase_change_observation_source
      note: >
        Records state phase changes. Source of truth for topology phase transitions.
        Must not be mixed with edit diff log.
    edit_diff_log:
      role: value_change_observation_and_query_source
      required_tables:
        - topology_edit_log
        - entity_edit_log
      note: >
        Records value-level edit diffs (before/after). Is a Query generation
        source for Topology Attention when topology_edit_log/entity_edit_log are present
        under the declared schema contract.
        Must not be mixed with state transition log.
  boundary:
    not_limited_to:
      - screen_transition
      - operation_recommendation
      - sequential_enum_attention
    requires_separation:
      state_transition_log: phase_change_observation
      edit_diff_log: value_change_observation_and_query_source
  prohibited:
    - "defining Topology Attention scope as screen_transition or operation_recommendation only"
    - "mixing state_transition_log and edit_diff_log in the same table"
    - "describing edit diff as a query source without topology_edit_log/entity_edit_log schema contract"
    - "treating Registrar as a static lookup table instead of Key-Value Memory"
