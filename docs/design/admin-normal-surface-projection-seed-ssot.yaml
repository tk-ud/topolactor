                tabs-control Field's `propsJson.data.items[].label`) are authored
                in Japanese from the React-like Schema source for this surface, since operators of
                this surface read Japanese. This is a content-authoring choice for THIS surface's
                seed, never a runtime/generic i18n mechanism -- no locale switch, translation table,
                or per-viewer language selection exists or is introduced by this rule, and none of
                LayoutProjectionTree/renderEmission/runtimeComponentFactory/ProjectionShell gain a
