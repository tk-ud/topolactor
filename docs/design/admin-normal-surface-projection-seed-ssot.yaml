      draft_boundary: activeTopology=false, selected_route_package_tmp_canvas_draft, requiresHumanAdjustmentBeforeApply, preview, validate, and apply boundary are reusable as draft-candidate governance shape, not as active topology seed output.
    not_reused_as_authority:
      - SQL UUIDs or row identities
      - preset labels and layout coordinates
      - current seed row status
      - content_bundle_operation_refs_must_not_be_copied
      - content_bundle:* target_ref values
    surface_operation_mapping:
      credentials.users:
        reusable_shape: search/filter/result/form/confirm/action composition plus payloadFrom and payloadResolverRef wiring shape.
        target_authority: auth_users:* account lifecycle authority from docs/design/admin-master-roster-management-ssot.yaml
        operation_mapping: create/search/read/update/delete/credential-revoke/session-revoke map to auth_users:* account lifecycle and auth.credentials transaction boundaries, never to content_bundle:* refs. Admin-driven password replace/rotate (admin setting a value for another account) is a permanent NG, not a mapped operation — see design_blocking.credentials_users_account_transaction_binding resolution_record; self password change is a separate self-service-only surface (POST /auth/me/password), not reachable from this admin surface.
      users(status):
        reusable_shape: search input, status filter, result projection, confirm action shape.
        target_authority: auth_users:* status operation boundary over the same auth.users identity.
        operation_mapping: search/filter/status update only; no second account lifecycle and no credential CRUD.
      enum:
        reusable_shape: search/filter/result/form/confirm composition.
        target_authority: enum_dictionary:* authority from docs/design/enum-dictionary-ssot.yaml
        operation_mapping: enum item/group create/read/update/delete/search over existing enum columns, never content_bundle:* refs.
      scheduler:
        reusable_shape: search/filter/result/confirm composition only (no form_field.template — this surface is list/search/filter/toggle only, never create/edit).
        target_authority: scheduler_jobs:* authority from docs/design/scheduler-job-manifest-ssot.yaml, list_settings/enable/disable actions only.
        operation_mapping: list/search/filter/enable/disable over existing scheduler_jobs columns; create/edit/step-chain map to /admin/contents physical_table_and_page_binding, never to this surface or to content_bundle:* refs.
      normal.dashboard:
        status: superseded_2026_08_16_see_team_dashboard_entry_below
        reusable_shape: preview/validate/apply boundary and payloadFrom/payloadResolverRef event-binding shape may be reused. (historical — see team_dashboard entry below for the current mapping.)
        target_authority: team Markdown authority from docs/design/team-markdown-dashboard-saved-view-ssot.yaml (historical — retired as team-dashboard's authority, see surface_axes.normal.surfaces.dashboard.superseding_authority_note)
        operation_mapping: viewer read remains ungated normal projection; inputer preview/validate/write/diff maps to team Markdown operations plus capability_requirement.required_role=admin. (historical)
      team_dashboard:
        reusable_shape: search/filter/result composition is not needed (single-row surface); the reusable shape here is component composition only — textarea.template + md_viewer.projection, plus payloadFrom node:<id>.value/event-binding shape, as proved end-to-end by physical_details_inline_editor_md_generator_preset (PR #604).
        target_authority: team_dashboard:get/team_dashboard:update authority (backend/runtime/AdminRuntime.TeamDashboard.cs), a thin per-domain action pair over topology.team_dashboard_note — the SAME shape team_markdown/enum_dictionary/credential_management already use, deliberately NOT content_bundle:* (see crud_preset_physical_reference_assessment.not_reused_as_authority.content_bundle_operation_refs_must_not_be_copied above — content_bundle:* target_ref values from the CRUD preset are explicitly not reusable as a real surface's operation authority).
        operation_mapping: admin viewer+editor read/update map to team_dashboard:get (open) / team_dashboard:update (capability_requirement.required_role=admin, enforced in-method); normal viewer-only read maps to the SAME team_dashboard:get, never to content_bundle:* refs.
    insufficiency_rule: If a target surface cannot be expressed with the existing generic CRUD preset shape and the authority-specific operation refs above, the seed task must report the missing substrate for owner decision instead of inventing a new component, action wiring, payload resolver, runtime lane, or route.

  design_blocking:
    - id: target_surface_manifest_readiness
      blocking_condition: Canonical hub relation target resolution already exists; the unresolved design blocker is only whether the target surface has a produced active ui_projection target manifest and whether the navigation binding row has been inserted by the existing /admin/manifests authority.
      required_resolution_before_seed: Produce or identify the active target manifest for each target surface and insert explicit binding data through the canonical authority; do not redesign hub relation resolution.
      sequencing_note: >-
        2026-07-22 clarification (owner-confirmed): hub relation authoring is structurally the LAST
        step of this Bundle's own content-flow order -- physical DB definition -> in-topology
        relation/function definition -> UI definition (component/package/layout/wiring) -> hub
        relation definition -- because /admin/manifests can only author a hub_relations row that
        points at a topology_manifest which already exists. Therefore the
        navigation_binding_authoring_and_verification sub-item below can never be a precondition
        for starting a subBundle's own target manifest build (React-like Schema -> translator ->
        topology UI seed -> seed registration, this Bundle's steps 1-4); it is a precondition only
        for that subBundle reaching full resolution/closure of this design_blocking id, and it can
        only be attempted after the target manifest and its own package/layout/wiring/tensor rows
        already exist. seed_implementation_start_conditions below is scoped accordingly: it does not
        block starting the manifest-build steps for a subBundle whose only unresolved item here is
        navigation_binding_authoring_and_verification.
      navigation_binding_resolution_criterion: >-
        2026-07-22 clarification: resolving navigation_binding_authoring_and_verification for a
        subBundle requires exactly the proof shape already defined by
        docs/design/runtime-orchestration-ssot.yaml
        ui_projection_render_reachability_contract.test_proof_contract
        (test_input_shape/resolution_chain/proof_boundary) -- a single live-DB proof, not two
        partial ones, that (a) creates the hub_relations row through the real hub_navigation:create
        authoring dispatch path (never a raw SQL insert standing in for authoring), targeting that
        subBundle's own target manifest, and (b) exercises the full resolution_chain from that same
        relation_uuid through topology_manifest_id -> hub_ids[]/package_ids[] ->
        topology.components_package_design / components_layout_design / ui_wiring_registry /
        ui_topology_tensor -> ManifestDispatcher.DispatchAsync -> a scalar Emission whose
        NavigationSequence[].RelatedHubId/TargetManifestId and PackageId/LayoutId/LayoutNodes are
        observed resolving into that subBundle's own real seed rows (never a hardcoded id constant
        or a fully synthetic non-target manifest standing in for it). The admin-dashboard subBundle's
        AdminDashboardNavigationUiProjectionLiveDbTests.cs (PR #595) is the existing precedent that
        combines both halves into one proof against its own real seed rows and is the pattern each
        remaining subBundle's own proof should follow. Reuse the shared, manifest-identity-agnostic
        helper backend/tests/Topolactor.Integration.Tests/HubRelationUiProjectionResolutionChainProof.cs
        (BuildRealDispatcherAsync / AssertNavigationSequenceResolvesHubVector) rather than
        re-deriving the resolution-chain assertion per manifest.
      subbundle_status:
        note: >-
          Per-subBundle granularity for this id. subBundle_not_applicable means this id does not gate
          that subBundle at all, not that it is resolved. resolved_existing_substrate/unresolved_before_seed
          distinguish target-manifest existence from navigation-binding-row authoring, per
          docs/design/admin-console-workflow-ssot.yaml subbundle_target_readiness and
          connection_state_authority (binding-row state is runtime/admin data, not a fixed ledger, so it
          stays unresolved_before_seed here rather than being tracked to completion). This does NOT mean
          navigation_binding_authoring_and_verification is exempt from the readiness/completion tracking
          in this file -- see navigation_binding_resolution_criterion above for what closes it, and
          sequencing_note above for why it never blocks starting a subBundle's own manifest-build work.
        admin-dashboard: subBundle_not_applicable
        credential-management:
          target_manifest: resolved_existing_substrate
          evidence_ref: manifest 00000000-0000-0000-0000-000000000092 (auth.external.credential_management.projection) already active with a real ui_projection
          navigation_binding_authoring_and_verification: resolved
          navigation_binding_evidence_ref: >-
            backend/tests/Topolactor.Integration.Tests/CredentialManagementHubRelationUiProjectionLiveDbTests.cs
            DispatchAsync_HubNavigationCreate_AuthorsRelationTargetingManifest092_ResolutionChainReachesScalarEmission
            -- single live-DB test combining the hub_navigation:create real authoring dispatch path
            (never a raw SQL insert) with the full resolution_chain against manifest 092's own real
            hub/seed rows, meeting navigation_binding_resolution_criterion above (the same combined-proof
            pattern AdminEnumHubRelationUiProjectionLiveDbTests.cs established for admin-enum). This
            closes the per-id design_blocking gate for credential-management; it does not by itself mean
            the credential-management subBundle is fully implemented -- see the separate
            external_instance_projection_columns id below for that subBundle's remaining gap.
        admin-enum:
          target_manifest: resolved
          evidence_ref: manifest 00000000-0000-0000-0000-0000000ae200 (admin.enum.management.projection) built 2026-07-22, real ui_projection with component_tree per surface_axes.admin.surfaces.enum.seed_contract
          navigation_binding_authoring_and_verification: resolved
          navigation_binding_evidence_ref: >-
            backend/tests/Topolactor.Integration.Tests/AdminEnumHubRelationUiProjectionLiveDbTests.cs
            DispatchAsync_AdminEnumManagementManifest_HubNavigationCreate_RealAuthoringPath_ThenResolutionChainReflectsIt
            -- single live-DB test combining the hub_navigation:create real authoring dispatch path
            (never a raw SQL insert) with the full resolution_chain against manifest ae200's own real
