                      ProjectionShell's own automatic nav bar already renders
                      (resolveHubNavigationLinks). Never emission.recommendNavigationProjection
                      (SQL Attention / attention_recommendation_tab); that stays unreachable from
                      propBindings so attention/recommendation scoring never blends into this
                      projected fixed-route list.
              - node_key: target_projection_shell
                component_key: panel.alias
            event_bindings:
              - event_key: select_hub_relation_link
                event_kind: select
                trigger: projection_change
                fail_close_on_ambiguous_target: true
                implementation_ref: >-
                  Satisfied by frontend/islands/ProjectionShell.tsx's own automatic hub navigation
                  nav bar (resolveHubNavigationLinks, frontend/runtime/projectionEntry.ts), which
                  every successfully-dispatched manifest already renders as real <a href> links
                  from the same emission.navigationSequence data -- not by an onSelect handler
                  authored on the seeded hub_relation_link_list node itself. The seed's card_list
                  has no runtimeInteractions/eventBinding of its own: it is a read-only projection
