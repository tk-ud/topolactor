                Topolactor.Schema.CredentialManagementCategories.All enum value (users /
                external_api_credential / external_instance_credential) -- a select Field's authored
                option `value` is always one of these three canonical strings; only its sibling
                `label` is Japanese. Ordinary technical tokens that a Japanese-reading operator
                already reads as-is (API, JSON, URL, ID, and the like) are not force-translated into
                an awkward Japanese equivalent inside a label string. This rule governs ONLY this
