            inputer_runtime_adapter_contract:
              adapter_requirement: required_before_topology_seed_generation
              component_runtime_connected_evidence: md_translation_authoring_surface.authoring runtimeConnected=false in frontend/components/catalog.ts physical evidence
              adapter_mounts_component: md_translation_authoring_surface.authoring
              actual_component_props: [onSaved, onCancel, placement]
              actual_component_events: [onSaved(savedViewId), onCancel]
              adapter_owned_events: [preview, validate, explicit_confirm, write, diff_log]
              canonical_role_gate_binding: capability_requirement.required_role=admin required_for_adapter_owned_events_and_onSaved_write_completion
