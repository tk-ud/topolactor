            entry in this table.
          navigation_binding_authoring_and_verification: resolved
          navigation_binding_evidence_ref: >-
            backend/tests/Topolactor.Integration.Tests/SchedulerSettingsHubRelationUiProjectionLiveDbTests.cs
            DispatchAsync_SchedulerSettingsManifest_HubNavigationCreate_RealAuthoringPath_ThenResolutionChainReflectsIt
            -- single live-DB test combining the hub_navigation:create real authoring dispatch path
            (never a raw SQL insert) with the full resolution_chain against manifest 5c100's own
            real hub/seed rows, meeting navigation_binding_resolution_criterion above (the same
