                  db/hub_search_preset_seed.sql); its default rendering (frontend/components/CardList.tsx)
                  is a normal block flow of Card elements, which is not a fixed-column layout even
                  without further styling. There is no separate hub_relation_search node in this
                  component_tree: card_list.primitive only ever distributes the flat top-level
                  navigationSequence array (there is no nested/child data here for a data_display/tree
                  primitive to collapse), and search is its own built-in searchable prop -- see
                  search_delivery above.
                known_gap_css_grid_styling: >-
                  CSS-grid arrangement of the cards themselves is NOT wired by this seed and is not
                  currently possible for a real (non-draft) dispatched emission: CardList's own
                  className/style comes from LayoutNode.componentDesign
                  (frontend/api/dispatch.ts), which frontend/runtime/draftPreviewToEmission.ts only
                  populates for the UI-Builder draft-preview path -- the production ManifestDispatcher
                  response (backend/schema/Contracts.cs LayoutNode) carries no componentDesign field
                  at all, so there is no existing wiring point for this seed to attach a grid class to
                  card_list's internal rendering today. node.layoutClassRefs (which IS populated for
                  real dispatch) only affects each node's own wrapper positioning among its siblings
                  in frontend/components/LayoutProjectionTree.tsx, not the internal arrangement of
                  items within a single card_list node. Actually applying CSS grid to seeded
                  card_list content requires extending real (non-draft) LayoutNode resolution with a
                  design/style source -- out of scope for this seed; tracked as a future substrate
                  gap, not fabricated here.
                prop_bindings:
                  - target_prop: items
                    source: emission.navigationSequence
                    transform: navigationLinksToCardItems
                    source_ref: frontend/runtime/propBindingResolver.ts EMISSION_NAVIGATION_SEQUENCE_SOURCE
                    boundary: >-
