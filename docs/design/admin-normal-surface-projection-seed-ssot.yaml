                translated: node key (e.g. credential_category_filter, instance_settings), recordType
                (e.g. topology_ui_category), componentKind (e.g. disclosure/modal), manifest key/UUID,
                targetRef, payloadFrom source string (e.g. node:<nodeId>.value, literal:true),
