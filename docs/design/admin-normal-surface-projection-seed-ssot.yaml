  seed_implementation_start_conditions:
    - This SSOT is reachable from .agent/docs/ssot-map.yaml and .agent/docs/design-ssot-index.md.
    - Design proof for required vocabulary, boundaries, and referenced catalog/schema surfaces passes.
    - Later seed task reads all authority references listed in foundation_inputs and authority.references.
    - >-
      Per target subBundle (2026-07-18, aligned to design_blocking[*].subbundle_status granularity):
      every design_blocking entry whose subbundle_status for that subBundle is not
      subBundle_not_applicable must be resolved / resolved_existing_substrate / retired_permanent_ng
      -- never left unresolved_before_seed -- before seed generation/registration proceeds for that
      subBundle. subBundle_not_applicable means the entry does not gate that subBundle at all, not
      that it is resolved. This is evaluated per subBundle, not as one Bundle-wide "all 5 ids fully
      closed" requirement: a subBundle with zero applicable design_blocking entries (e.g.
      admin-dashboard) may proceed while other subBundles still carry unresolved_before_seed entries.
      Unresolved design blockers must not be carried into runtime as fail-close negative cases, and
      must never be marked resolved merely because the Bundle-level owner production pause referenced
      in .agent/tasks/todo.md has been lifted -- pause state and design_blocking resolution are
      separate gates.
    - >-
      2026-07-22 clarification (owner-confirmed, reconciling this file with
      docs/design/admin-console-workflow-ssot.yaml subbundle_target_readiness/connection_state_authority,
      which previously read as contradictory): "seed generation/registration proceeds" above has two
      phases per subBundle, and the never-unresolved_before_seed requirement binds them differently.
      Phase A is producing that subBundle's own target manifest and its package/layout/wiring/tensor
      rows (this Bundle's common-process steps 1-4); phase B is design_blocking's
      navigation_binding_authoring_and_verification sub-item (target_surface_manifest_readiness),
      which per its sequencing_note can only be attempted after phase A's rows already exist. A
      subBundle whose only unresolved applicable entry is navigation_binding_authoring_and_verification
      may start and complete phase A; the never-unresolved_before_seed requirement blocks that
      subBundle's own full closure/completion (including any claim that its seed work is finished),
      not the start of phase A. Every other design_blocking entry (including target_manifest
      existence itself) continues to gate phase A start exactly as written above -- this clarification
      narrows only the navigation-binding sub-item's blocking scope, per its own
      navigation_binding_resolution_criterion.
