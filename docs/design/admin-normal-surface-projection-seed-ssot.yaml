admin_normal_surface_projection_seed_ssot:
  name: admin_normal_surface_projection_seed
  version: 0.1.0
  status: owning_ssot_design_contract
  canonical_path: docs/design/admin-normal-surface-projection-seed-ssot.yaml
  purpose:
    - Own the projection-side topology UI seed design for the admin and normal hub surface axes.
    - Define surface membership, projection responsibilities, capability requirements, component bindings, and hub-relation navigation triggers before seed/runtime implementation.
    - Provide enough topology seed contract detail for a later React-like Schema/topology seed task to create manifests without using existing implementation as design authority.
  scope:
    in_scope:
      - admin_normal_projection_axis_design
      - surface_membership_and_projection_responsibility
      - read_search_filter_mutation_capability_contract
      - topology_ui_seed_schema_contract
      - component_catalog_binding_contract
      - hub_relation_navigation_trigger_contract
      - design_blocking_and_seed_start_conditions
    out_of_scope:
      - db_schema_change
      - db_seed_sql_generation_or_update
      - backend_runtime_implementation
      - frontend_route_or_component_implementation
      - topology_seed_generation
      - auth_role_or_rbac_policy_redefinition
      - enum_vocabulary_redefinition
  foundation_inputs:
    framework:
      - docs/framework-core.yaml
      - docs/framework-policy.yaml
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/pipeline-continuity-ssot.yaml
    design_authority_inputs:
      - docs/design/db-schema.yaml
      - docs/design/admin-console-workflow-ssot.yaml
      - docs/design/ui-ux-primitive-catalog-ssot.yaml
      - docs/design/component-catalog-classification-ssot.yaml
      - docs/design/ui-builder-preset-ecosystem-ssot.yaml
      - docs/design/auth-db-session-credential-ssot.yaml
      - docs/design/admin-master-roster-management-ssot.yaml
      - docs/design/enum-dictionary-ssot.yaml
      - docs/design/team-markdown-dashboard-saved-view-ssot.yaml
      - docs/design/react-schema-topology-seed-translator-ssot.yaml
      - docs/design/external-port-substrate-ssot.yaml
      - docs/design/instance-port-substrate-ssot.yaml
    physical_schema_and_catalog_inputs:
      - db/auth_tables.sql
      - db/enum_tables.sql
      - db/team_markdown_tables.sql
      - db/topology_tables.sql
      - frontend/components/catalog.ts
    physical_seed_reference_inputs:
      - db/physical_search_crud_aggregate_preset_seed.sql
  authority:
    owns:
      - hub_surface_axis_admin_normal
      - surface_membership_for_admin_and_normal_axes
      - projection_responsibility_per_surface
      - projection_side_capability_requirements_per_surface
      - topology_ui_seed_schema_contract_for_these_surfaces
      - component_catalog_binding_requirements_for_these_surfaces
      - hub_relation_link_projection_change_trigger_contract
    references:
      runtime_dispatch_authority:
        owner: docs/design/runtime-orchestration-ssot.yaml
        rule: This SSOT names operation binding intent only; dispatcher axes, scheduler path, runtime destination, manifest dispatch, and fail-close runtime behavior remain runtime orchestration authority.
      db_schema_authority:
        owner:
          - docs/design/db-schema.yaml
          - db/auth_tables.sql
          - db/enum_tables.sql
          - db/team_markdown_tables.sql
          - db/topology_tables.sql
        rule: This SSOT may bind only to existing tables/columns; missing values become design_blocking and must not be invented as columns or JSON keys.
      auth_credential_authority:
        owner: docs/design/auth-db-session-credential-ssot.yaml
        rule: User login credentials live under auth.credentials; password_hash and refresh/session/token secrets are never projected.
      external_api_credential_authority:
        owner: docs/design/external-port-substrate-ssot.yaml
        rule: External API credentials bind to topology.external_credential_vault plus external port records by reference_key; plaintext or decrypted payload is runtime-only and never a projection field.
      external_instance_credential_authority:
        owner: docs/design/instance-port-substrate-ssot.yaml
        rule: Instance credential-backed operations must use the existing credential management projection extension and runtime-only credential resolution; this SSOT does not create a new credential plane.
      enum_dictionary_authority:
        owner: docs/design/enum-dictionary-ssot.yaml
        rule: Enum vocabulary and group membership are owned by enum dictionary surfaces; this SSOT only describes projection seed bindings for enum CRUD/search.
      team_markdown_persistence_authority:
        owner: docs/design/team-markdown-dashboard-saved-view-ssot.yaml
        rule: Markdown templates, saved views, rendered_markdown, completed_preset_seed_json, events, refresh/rebind semantics, and persistence semantics remain owned there.
      ui_primitive_catalog_authority:
        owner:
          - docs/design/component-catalog-classification-ssot.yaml
          - docs/design/ui-ux-primitive-catalog-ssot.yaml
        physical_evidence_refs:
          - frontend/components/catalog.ts
        rule: Component classification, primitive vocabulary, and catalog binding policy are owned by the two catalog SSOTs. frontend/components/catalog.ts is implementation evidence only and must not be promoted to SSOT authority owner.
      ui_builder_preset_authority:
        owner: docs/design/ui-builder-preset-ecosystem-ssot.yaml
        physical_seed_reference:
          file: db/physical_search_crud_aggregate_preset_seed.sql
          role: physical_seed_reference_only_not_design_authority
        rule: The CRUD preset SQL may be used to prevent reinvention of generic composition and wiring shapes, but UUIDs, rows, layout coordinates, labels, and content_bundle:* operation refs are not design authority for this SSOT.
      hub_relation_resolution_authority:
        owner:
          - docs/design/admin-console-workflow-ssot.yaml
          - db/topology_tables.sql
        rule: hubs.hub_relations is a manifest-scoped navigation sequence surface, not RBAC, authentication, credential, audience, or canonical data authority.
    does_not_own:
      - auth_role_taxonomy_or_rbac_decision
      - credential_secret_storage_or_secret_materialization
      - canonical_table_column_or_schema_definition
      - enum_item_or_group_vocabulary_definition
      - team_markdown_saved_view_persistence_rules
      - runtime_dispatcher_resolution_algorithm
      - frontend_component_source_implementation
      - backend_action_body_or_repository_implementation
      - seed_sql_identity_values
  seed_physical_hierarchy_and_definition:
    note: >-
      Added to remove read ambiguity observed in prior audits of this Bundle: "topology UI seed"
      is not an abstract schema-design artifact separate from runtime persistence, and the
      translator is not an independent production track. This section grounds both terms in
      concrete physical tables and existing authoring surfaces so a later seed task cannot misread
      "topology UI seed generation" as translator R&D work.
    physical_hierarchy:
      layer_order: [hub_relation, topology, hub_and_package]
      hub_relation:
        table: hubs.hub_relations
        role: navigation_edge
        meaning: an outbound navigation row from a source topology_manifest (topology_manifest_id) to a target hub (related_hub_id).
      topology:
        table: hubs.topology_manifests (projected from manifest.topology jsonb[])
        role: semantic_space_db_calculation_and_definition
        equivalence: the same artifact class docs/design/admin-console-workflow-ssot.yaml canonical_sequential_authoring_pipeline (/admin/contents Step 1-3, manifest shell through physical page binding) produces.
        ref: docs/framework-core.yaml topolactor_space_model.topology (role -- semantic_space)
      hub:
        table: hubs.hub
        role: physical_db_relation_node
        meaning: a system-side relation-established node (hub_id + relation jsonb); carries no semantic/business content by itself -- topology_manifests.hub_id merely anchors a topology to it.
        ref: docs/framework-core.yaml topolactor_space_model.hub (role -- relation_node)
      package:
        tables: [topology.ui_component_package, topology.components_package_design, topology.components_layout_design, topology.ui_wiring_registry, topology.ui_topology_tensor]
        role: frontend_design
        equivalence: the same artifact class /admin/ui-builder (layout_patch:preview/validate/apply, package_generator:promote) produces, referenced from a topology's manifest.topology[ui_projection] packageIds/layoutId/wiringId/tensorId.
        ref: >-
          docs/framework-policy.yaml ui_topology_tensor_persistence; docs/design/pipeline-continuity-ssot.yaml
          layout_projection_dom_lane node backend.tensor_row -- "layout_patch_json stores the full
          canvas JSON authored via layout_patch:apply"
    seed_definition:
      rule: >-
        "seed" throughout this SSOT and the admin-surface-topology-seed-conversion Bundle
        (.agent/tasks/todo.md) means the physical DB rows across hub_relation / topology
        (topology_manifests) / hub / package (physical_hierarchy above) for a given surface. It is
        pre-built initial sample data, equivalent in shape to what an admin would obtain by
        actually using /admin/contents + /admin/ui-builder + /admin/manifests -- not an
        independently-designed artifact class with a separate authoring lifecycle of its own.
      translator_role: >-
        docs/design/react-schema-topology-seed-translator-ssot.yaml (the translator) is a
        conversion convenience tool: it turns a React-like Schema description into the topology
        jsonb shape the rows above require, so an implementing agent does not have to hand-author
        raw jsonb (it exists to remove that authoring/translation cost from the agent, not to add a
        design phase). It owns SEED EMISSION SHAPE only -- what fields a record carries -- per
        docs/design/runtime-orchestration-ssot.yaml
        layout_schema_structural_render_contract.authority_boundary_with_translator_ssot; it never
        owns seed adoption authority and is never a second, independent seed-production track
        alongside admin/contents-ui-builder-manifests. This Bundle's deliverable is the physical
        rows themselves (the projection side's initial implementation) -- never translator
        maintenance or extension.
    prohibited:
      - describing_topology_ui_seed_generation_as_a_design_phase_disconnected_from_the_physical_rows_above
      - treating_translator_tool_usage_as_this_bundles_deliverable_rather_than_a_means_to_produce_the_rows
      - treating_the_translator_as_an_independent_seed_authority_separate_from_admin_contents_ui_builder_manifests
      - scoping_this_bundles_work_as_translator_modification_or_extension
  global_invariants:
    projection_axis_is_not_auth_role:
      rule: admin and normal are projection surface axes only; they must not be converted into auth role, RBAC, audience, credential, or authorization authority.
    hub_relation_is_navigation_trigger_only:
      rule: Hub relation links may trigger projection target changes; they do not authorize access, certify canonical data, choose an audience, or grant credential authority.
    fail_close_manifest_resolution:
      rule: A hub relation link selection must resolve exactly one active target manifest by explicit binding. Missing, multiple, deprecated, or ambiguous target manifests are blocking fail-close conditions.
    secret_projection_denied:
      rule: Secret-bearing values, hashes, encrypted payloads, tokens, refresh payloads, endpoints requiring secrecy, and decrypted credential material must never appear in lists, search results, detail projections, mutation previews, diffs, or topology seed examples.
    no_silent_fallback:
      rule: No first-match fallback, oldest-row fallback, route fallback, implicit dashboard choice, or default target manifest selection is allowed.
    account_lifecycle_and_status_projection_split:
      rule: credentials.users and users(status) target the same auth.users identity. credentials.users owns composite account lifecycle intent through the existing auth_users authority, while users(status) is a narrower status-management projection and must not become a second user lifecycle or credential plane.
  topology_seed_schema_contract:
    minimum_required_fields:
      topology_manifest_identity:
        required_keys: [manifest_key, manifest_label, manifest_version, declared_by_ssot, lifecycle_status]
        rule: Identity must be deterministic in later seed work, but this SSOT does not allocate UUIDs or SQL rows.
      projection_axis:
        allowed_values: [admin, normal]
        rule: Axis classifies projection surfaces only and has no RBAC meaning.
      surface_key:
        rule: Must equal one of the surface keys declared under surface_axes.
      operation_bindings:
        required_shape: list of operation_key, capability_kind, authority_ref, backend_emission_ref, confirmation_required, forbidden_projection_fields
        optional_fields:
          capability_requirement:
            shape: topology_entry_type, required_role
            schema_mapping: operation_bindings[*].capability_requirement.required_role
            canonical_auth_semantics_ref: docs/design/auth-db-session-credential-ssot.yaml manifest_capability_requirement
            rule: If explicit required_role exists, JWT role must match it. If explicit capability_requirement is omitted and runtime destination does not infer a role requirement, the operation is open to any authenticated role.
        capability_requirement_contract:
          conditional_required_for: mutation_operation_bindings
          inputer_mutation_contract:
            applies_to_surface: normal.dashboard.inputer
            applies_to_operations: [preview, validate, explicit_confirm, write, diff_log]
            topology_entry_type: capability_requirement
            required_role: admin
          viewer_read_search_filter_contract:
            applies_to_surface: normal.dashboard.viewer
            applies_to_operations: [read, search, filter]
            capability_requirement: omitted
            required_role_field: omitted
            explicit_admin_role_gate: absent
            inferred_admin_requirement: absent
            runtime_binding_requirement: Must use a runtime binding that neither declares explicit capability_requirement.required_role nor infers admin from runtime_destination.
            rule: Viewer read/search/filter operation bindings must generate no required_role field, no required_role none sentinel, and no admin role gate.
          prohibited_substitutes: [capability_kind_as_role_gate_replacement, required_capability, required_role_none_sentinel]
      component_bindings:
        required_shape: list of node_key, component_key, component_role, catalog_authority_ref, responsibility_boundary
      prop_bindings:
        required_shape: list of node_key, prop_name, source, source_ref, required, secret_denied
      event_bindings:
        required_shape: list of event_key, source_node, event_kind, operation_key_or_navigation_key, payload_contract, fail_close_conditions
      backend_emission_bindings:
        required_shape: list of emission_key, runtime_route_intent, expected_response_projection, error_projection, diff_log_requirement
      search_filter_input_contract:
        required_shape: list of input_key, component_key, target_fields_or_authority_ref, debounce_policy, empty_query_policy, secret_denied
      mutation_confirmation_contract:
        required_shape: preview, validate, explicit_confirm, write, diff_log, cancel
      state_projection_contract:
        required_states: [loading, empty, error]
      hub_relation_navigation_binding:
        required_shape: list of source_surface, relation_source, selected_link_payload, target_manifest_resolution, fail_close_conditions
    prohibited_seed_content:
      - executable_code_examples
      - completed_seed_sql
      - invented_db_columns_or_json_keys
      - plaintext_secret_or_hash_examples
      - runtime_dispatcher_algorithm_redefinition
  component_catalog_binding:
    design_authority_refs:
      - docs/design/component-catalog-classification-ssot.yaml
      - docs/design/ui-ux-primitive-catalog-ssot.yaml
    physical_evidence_refs:
      - frontend/components/catalog.ts
    required_existing_components:
      md_viewer.projection:
        role: Markdown read projection candidate.
        catalog_authority_refs:
          - docs/design/component-catalog-classification-ssot.yaml
          - docs/design/ui-ux-primitive-catalog-ssot.yaml
        physical_evidence_refs:
          - frontend/components/catalog.ts
      md_translation_authoring_surface.authoring:
        role: Existing Markdown translation/authoring surface for binding Markdown source fields and authoring seed intent.
        runtime_binding_mode: runtime_adapter_required_before_seed_generation
        runtime_connected_status: false_in_current_catalog_physical_evidence
        seed_rule: Topology seed must not treat this component key as a directly runtimeConnected component. A seed may target it only through an explicit runtime adapter that mounts the existing component with the props/events declared in normal.dashboard.inputer_runtime_adapter_contract, or through an existing route composition that already owns the component lifecycle.
        catalog_authority_refs:
          - docs/design/component-catalog-classification-ssot.yaml
          - docs/design/ui-ux-primitive-catalog-ssot.yaml
        physical_evidence_refs:
          - frontend/components/catalog.ts
      textarea.template:
        role: Text/Markdown input body primitive when an authoring surface needs an editable text area.
      search_input.alias:
        role: Search input primitive for searchable surfaces.
      form_field.template:
        role: Generic labeled form field wrapper.
      select.template:
        role: Filter/select primitive for enum/status/category filters.
      button.primitive:
        role: Explicit action/confirmation trigger primitive.
    rule: A later seed task must fail-close if any referenced component key is absent from the design catalog authority plus physical evidence cross-check, or if a new component is proposed for a surface expressible by these existing components.
  surface_axes:
    admin:
      axis_kind: projection_surface_axis
      not_role_or_rbac: true
      surfaces:
        credentials:
          categories:
            users:
              category_role: composite_account_lifecycle_for_same_auth_user
              data_authority_ref:
                - auth.users
                - auth.credentials
              existing_schema_fields_allowed_for_projection:
                auth.users: [user_id, username, active, approve, status, suspended_from, suspended_until, state_note, created_at, updated_at]
                auth.credentials: [credential_id, user_id, created_at]
              forbidden_projection_fields: [password_hash, token_hash, refresh_token, plaintext_secret, secret_value]
              operations: [create_account_with_initial_credential, read, search, update_account_metadata, update_role, revoke_credential, revoke_sessions, delete_account_with_credentials]
              operations_correction_2026_07_14: >
                replace_password/rotate_password were retired from this operations list — see design_blocking.credentials_users_account_transaction_binding resolution_record.
                Admin never sets, replaces, rotates, or reads another account's password value; revoke_credential (kill-switch: deletes the credential row and revokes all sessions,
                backend/service/AuthService.cs AdminRevokeCredentialAsync) is the only admin-driven credential mutation. Self password change is a separate,
                self-service-only surface (POST /auth/me/password) not reachable from this admin surface. update_role and revoke_sessions were added as concrete,
                implemented operations (role via auth_users:update roleName field over auth.grants; revoke_sessions via POST /admin/auth/users/{userId}/sessions/revoke).
              transaction_contract:
                create_account_with_initial_credential: auth.users insert and auth.credentials insert are one account lifecycle transaction; no user row without required initial credential may be projected as created by this surface.
                delete_account_with_credentials: account deletion must preserve auth.users -> auth.credentials consistency through the existing FK/cascade or an equivalent backend transaction; no orphan credential lifecycle is defined here.
                revoke_credential: deletes the auth.credentials row and revokes every active session for the account in one transaction, with non-secret evidence appended in the same transaction; never accepts or stores a replacement password value.
                revoke_sessions: revokes one (by sessionId) or all active auth.sessions rows for the account in one transaction, with non-secret evidence appended in the same transaction.
                update_role: grants or revokes the admin/system auth.grants row for the account (auth_users:update roleName field); never affects auth.credentials.
              admin_users_authority_relationship:
                existing_authority_ref: docs/design/admin-master-roster-management-ssot.yaml admin_runtime_actions.auth_users_read/auth_users_write
                relationship: continuation_refinement_not_duplicate_authority
                rule: /admin/users remains the existing account CRUD authority surface for auth_users:* actions. credentials.users is the topology seed projection design for that same account lifecycle capability; it must bind to the same authority and must not introduce a parallel account CRUD authority.
            external_api_credential:
              data_authority_ref:
                - topology.external_credential_vault
                - topology.external_access_ports
                - topology.external_response_ports
                - topology.external_hook_ports
              existing_schema_fields_allowed_for_projection: [credential_vault_id, provider_kind, required_by_bundle, token_kind, expires_at, refresh_before_seconds, version, active, reference_key, created_at, updated_at]
              forbidden_projection_fields: [token_hash, encrypted_payload, encryption_key_reference, plaintext_secret, decrypted_payload, token_response]
              operations: [create, read, update, delete, search]
              mutation_boundary: replace or rotate by reference_key and provider/bundle metadata; decrypted material is runtime-only.
              consumer_reference_binding:
                status: added_2026_07_22_design_change_owner_confirmed_split
                role: >-
                  Lets an admin configure, from this credential-management screen, which consumer
                  entity references a given credential/port row — starting with scheduler jobs,
                  because calling an external API or external instance function from a scheduler job
                  is more usable when configured alongside the credential/port itself rather than on a
                  separate scheduler screen.
                target_authority: docs/design/scheduler-job-manifest-ssot.yaml topology.scheduler_jobs.credential_requirement_ref / topology.scheduler_jobs.external_port_ref
                operations: [configure_scheduler_job_credential_or_port_binding]
                mutation_boundary: >-
                  Writes only topology.scheduler_jobs.credential_requirement_ref /
                  topology.scheduler_jobs.external_port_ref, identified by scheduler_job_id plus this
                  credential/port row's reference_key. Never writes topology.external_credential_vault /
                  topology.external_access_ports / topology.external_response_ports /
                  topology.external_hook_ports rows through this path (those remain this category's
                  existing create/read/update/delete/search operations above). Never authors
                  scheduler_jobs.job_key / trigger_kind / schedule_policy_kind / cron_expression /
                  abstract_function_step_chain or any other /admin/contents-authored field — see
                  surface_axes.admin.surfaces.scheduler.scope_boundary.
                other_consumer_bundles_note: >-
                  The 6 established consumer bundles (file_storage/email/stripe/webhook_inbox/
                  audit_approval/export_sftp) already have credential_requirement/policy_steps seed
                  binding via PR#460's consumer bundle work — unaffected by this addition.
                  job_scheduler was not among them and is added here as new, additive scope; it does
                  not change or duplicate the existing 6 bundles' binding mechanism.
            external_instance_credential:
              data_authority_ref: docs/design/instance-port-substrate-ssot.yaml existing_credential_management_projection_extension
              existing_schema_fields_allowed_for_projection: [reference_key, provider_kind, required_by_bundle, active, expires_at, version]
              forbidden_projection_fields: [token_hash, encrypted_payload, encryption_key_reference, plaintext_secret, decrypted_payload, connection_secret]
              operations: [create, read, update, delete, search]
              mutation_boundary: instance credential settings may be selected/updated only through existing credential-management projection extension; no new credential table or plane is defined here.
          projection_responsibility:
            - account_and_credential_record_inventory_without_secrets
            - category_filter_and_search_without_secret_material
            - composite_account_create_delete_transaction_intent
            - explicit_credential_revoke_and_session_revoke_intent_collection
            - diff_log_of_account_metadata_and_secret_lifecycle_event_without_secret_value
          capability_requirements:
            read: required
            search: [auth.users.username, auth.users.status, auth.users.state_note, topology.external_credential_vault.provider_kind, topology.external_credential_vault.required_by_bundle, topology.external_credential_vault.reference_key]
            filter: [category, auth.users.active, auth.users.approve, auth.users.status, provider_kind, required_by_bundle, active, expires_at]
            mutation: [create_account_with_initial_credential, update_account_metadata, update_role, revoke_credential, revoke_sessions, delete_account_with_credentials, external_credential_metadata_update, deactivate_or_delete_reference, configure_scheduler_job_credential_or_port_binding]
          seed_contract:
            component_tree:
              - node_key: credential_search
                component_key: search_input.alias
                responsibility: query non-secret metadata only
              - node_key: credential_category_filter
                component_key: tabs.template
                responsibility: filter users external_api_credential external_instance_credential
                presentation_history: >-
                  Owner-directed presentation change (structural-subtree-conditional-visibility-
                  implementation round, tabs-presentation closure). Was component_key: select.template
                  through this contract's first several implementation rounds; docs/design/
                  runtime-orchestration-ssot.yaml ui_projection_render_reachability_contract.
                  structural_subtree_conditional_visibility_contract's own
                  presentation_component_independence text already named this exact transition as a
                  legal, zero-generic-contract-change future consumer move ("a future consumer is
                  free to drive the exact same source slot from a tabs.template node instead, with
                  zero change to this contract") -- this is that anticipated move actually happening,
                  not a new design. docs/design/component-catalog-classification-ssot.yaml's
                  tabs.template catalog entry (frontend/components/Tabs.tsx,
                  frontend/runtime/runtimeComponentFactory.ts tabsFactory) is the existing,
                  already-registered (topology.ui_component_registry, componentId
                  00000000-0000-0000-0001-000000000016) catalog authority this presentation is
                  grounded in -- never a new component, never a hidden select behind a tabs facade.
                conditional_visibility_note: >-
                  design_change (category-collapse audit) addition: "filter" here means this
                  node's selection actually gates which of the three categories' structural
                  subtrees (their own field/action/confirm nodes) mount, not merely which rows a
                  result list shows. The mechanism (visibilityBinding, state store, mount/unmount
                  semantics, fail-close behavior) is owned entirely by docs/design/runtime-
                  orchestration-ssot.yaml ui_projection_render_reachability_contract.
                  structural_subtree_conditional_visibility_contract -- this surface is that
                  contract's CONSUMER/evidence, never its authority owner, and this
                  component_key: tabs.template declaration is itself unchanged and non-exclusive: a
                  future consumer of the same generic contract may drive an equivalent selection
                  from yet another presentation component without this SSOT needing to change.
                state_and_event_shape: >-
                  Grounded in docs/design/runtime-orchestration-ssot.yaml
                  structural_subtree_conditional_visibility_contract.write_read_separation /
                  write_side_dynamic_value -- never invented ad hoc for this consumer.
                  tabs.template's onSelect drives the SAME "ui-local:credential_category_filter.
                  selectedCategory" UI状態更新 (setState) slot select.template's onChange
                  previously drove, through the SAME payloadFrom.value = "event.<path>" dynamic-value
                  grammar, unchanged. The Field's own propsJson shape moves from
                  {data:{value,options[{label,value}],label,placeholder}} (select.template's shape)
                  to {data:{items[{key,label}],activeKey}} (tabs.template's own TabItem/TabsProps
                  shape, frontend/components/Tabs.tsx) -- items[].key IS the canonical
                  Topolactor.Schema.CredentialManagementCategories.All value (unchanged, unrenamed,
                  unrenumbered: users / external_api_credential / external_instance_credential),
                  activeKey IS the current selectedCategory, mirroring select.template's own
                  value/options[].value convention exactly, one-to-one, under tabs' own field names.
                  No hidden select.template node coexists behind or beneath this tabs.template node
                  -- component_key above is this Field's ONLY authored control, not an additional
