version: 1
id: sql_attention_logs_ssot
title: SQL Attention Logs SSOT
status: structural_ssot
semantic_markdown: docs/design/sql-attention-logs-ssot.md
ssot_roles:
  markdown: semantic_formula_and_route_ssot
  yaml: structural_policy_schema_runtime_contract_ssot
postgresql_namespace: logs
sql_attention_target:
  target_schema: hubs
  target_semantics:
    - tensor
    - attractor
    - collapse_point
  not_target:
    - topologys
    - registry
projection_boundary:
  attention_hit: hubs
  projected_meaning_space: topologys
  topology_recommendation_basis:
    - statistics
    - ema
    - usage_history
    - trend
deprecated_or_rejected:
  - legacy registry exploration wording as SQL Attention target
physical_schema_status:
  physical_tables:
    - logs.current
    - logs.hub_current
    - logs.attention
  non_adopted_table_names:
    - logs.table_current
    - logs.table_attention
  initial_implementation: hub_attractor_target_aware_generic_schema
  neighbor_score_policy_range:
    min: 0.85
    max: 1.00
    strong_hit_threshold: 0.95
    normal_hit_threshold: 0.90
    exploratory_hit_threshold: 0.85
  score_band_contract:
    strong: "1.00-0.95"
    normal: "0.95-0.90"
    exploratory: "0.90-0.85"
    evidence_only_below: 0.85
  exploration_budget_policy_keys:
    - max_hub_kinds_per_current
    - max_hub_tables_per_kind
    - topK_per_hub_kind
    - phase_expansion_limit
    - max_attention_rows_saved
  out_of_scope_not_implemented:
    - refresh_function_bodies
    - norm_watch_function_bodies
    - db_triggers
    - scheduler_runtime_hub_attractor_exploration
    - phase_vector_generation_runtime_logic
public_article: false
canonical_markdown: docs/design/sql-attention-logs-ssot.md

purpose:
  summary: >-
    Define SQL Attention logs, current calculation basis, norm-level trigger,
    hub-attractor exploration, phase vector evidence, and attention evidence
    persistence.
  non_goal:
    - public_marketing_copy
    - sql_side_transformer_qk_reproduction
    - every_log_append_registry_search
    - direct_registry_mutation_from_trigger
    - evidence_layer_single_score_collapse

core_definition:
  one_sentence: >-
    SQL Attention converts physical-side logs.* signals into a logs.current
    calculation basis, watches l2 norm-level changes, and only when the level
    changes observes hub/vector-indicated attractor evidence from hubs.* and
    records statistics, l2_norm, vector, phase_vector, and hit evidence into
    logs.attention without collapsing statistics, Attention, and Phase Attention
    into one score.
  flow:
    - logs_signal_sources
    - logs_current_calculation_basis
    - l2_norm_level_watch
    - scheduler_runtime_hub_attractor_exploration
    - logs_attention_evidence

philosophy_and_structure:
  separation_required: true
  layers:
    statistics:
      meaning: convergence_confidence_stability_continuity
      examples:
        - count
        - recordcount
        - EMA
        - trend
        - feedback
    attention:
      meaning: current_excitation_neighbor_hit_strength
      examples:
        - l2_norm
        - neighbor_score
        - vector_json
    phase_attention:
      meaning: exploratory_variance_shifted_candidate_vector
      examples:
        - phase_vector_json
  evidence_layer_rule: >-
    Statistics, Attention, and Phase Attention must be preserved as separate
    evidence meanings and must not be collapsed into a single score at the
    evidence layer.
  duality:
    vector_json: convergent_neighbor_hit
    phase_vector_json: divergent_exploratory_candidate_direction
  visualization_targets:
    - statistics_trend
    - attention_norm_trend
    - phase_vector_trend

layers:
  logs_signal_sources:
    role: aggregation_sources
    description: >-
      logs.* tables are signal sources. They observe physical-side usage,
      mutation, candidates, or other runtime signals. They are not final
      attention results and are not registry grammar tables.
    initial_sources:
      logs.diff:
        pressure: physical_table_record_lifecycle_mutation_pressure_source
        lifecycle_operations:
          - create
          - update
          - logical_delete
          - restore
          - physical_delete
        retention: archive_required
        delete_policy: no_destructive_delete
        tableid_semantics: physical_table_identity
        required_identity_fields:
          - physical_table_id
          - physical_table_name
          - record_id
          - operation_kind
          - before_state_or_diff_json
          - after_state_or_diff_json
          - observed_at
          - actor_or_source
          - archive_policy
        boundary:
          - not_hub_tensor_topology_edit_audit_log
          - not_direct_reuse_of_topology_edit_log
      logs.candidate:
        pressure: columnization_candidate_pressure_on_physical_time_axis_space
        canonical_alignment:
          - logs.usage_metrics_as_observed_access_usage_pressure
          - logs.promotion_candidates_as_columnization_index_registry_or_physical_table_promotion_candidates
        candidate_lifecycle:
          - pending
          - approved
          - rejected
        approval_projection_note: approved_candidates_can_be_extracted_as_adopted_state
        retention: archive_required
        delete_policy: no_destructive_delete
        tableid_semantics: physical_table_identity
        required_state_semantics:
          - pending
          - adopted
          - rejected
      logs.ui_operation:
        pressure: ui_operation_component_usage_pressure_on_physical_time_axis_space
        canonical_source_table: context_event
        sequence_semantics: append_only_session_sequence_event_log
        retention: manifest_or_policy_driven
        tableid_semantics: physical_table_identity
        note: >-
          Retention policy must be decided by manifest/policy. Component usage
          matters; package-level usage alone is insufficient.
    extensibility: >-
      The initial sources are examples. Other logs source combinations may use
      the same structure when source semantics are explicit.
    logical_source_name_contract:
      note: logs.diff_logs.candidate_logs.ui_operation_are_logical_signal_source_names_not_immediate_physical_table_names
    required_fields:
      - source_name
      - source_kind
      - physical_table_id
      - source_axis_ref
      - count_source
      - recordcount_source
      - created_at
      - archive_policy
      - retention_policy
    schema_contract:
      abstract_fields:
        - source_id
        - source_name
        - source_kind
        - physical_table_id
        - physical_table_name
        - source_axis_kind
        - source_axis_ref
        - count_value
        - recordcount_value
        - weight_value
        - recency_window
        - observed_at
        - archive_policy
        - retention_policy
        - evidence_json
      extension_condition:
        - source_kind_is_explicit
        - pressure_semantics_are_explicit
        - physical_table_id_identity_semantics_preserved

  logs_current:
    role: calculation_basis_memo
    description: >-
      logs.current stores compressed current pressure state derived from logs.*
      so runtime does not repeatedly scan raw logs. It is a calculation basis,
      not the SQL Attention conclusion.
    must_support:
      - pressure_matrix_construction
      - l2_norm_calculation
      - top_norm_level_snapshot_comparison
      - exploration_candidate_creation
    suggested_fields:
      - current_id
      - source_set_id
      - basis_window
      - basis_rows
      - basis_columns
      - count
      - recordcount
      - weight
      - l2_norm
      - level_snapshot
      - evaluated_at
    matrix_semantics:
      rows: physical_table_or_physical_table_combination
      columns: signal_source_pressure_axes
      cells: count_recordcount_weight_recency
    probability_policy: >-
      Pressure values are observations. They do not need to be rounded into
      probabilities.
    schema_contract:
      role:
        - calculation_basis_memo
        - pressure_matrix_basis
        - l2_norm_calculation_basis
        - top_n_norm_level_snapshot_comparison_basis
      suggested_fields:
        - current_id
        - source_set_id
        - basis_window
        - physical_table_id
        - physical_table_name
        - basis_vector_json
        - pressure_matrix_json
        - count_total
        - recordcount_total
        - l2_norm
        - norm_rank
        - norm_level
        - previous_norm_level
        - level_changed
        - evaluated_at
        - updated_at
      persistence_semantics: regenerable_projection_cache_not_archive_required_append_log

  norm_trigger:
    role: exploration_gate
    description: >-
      Monitoring may run every time current is updated, but hub-attractor
      exploration only starts when norm level changes.
    initial_policy:
      watch_top_n: 3
      trigger_conditions:
        - top_n_membership_changed
        - top_n_order_changed
        - norm_delta_exceeds_policy_threshold
      no_change_action: return
      change_action: mark_exploration_candidate
    flow:
      - logs_append
      - current_basis_update
      - l2_norm_update
      - top3_norm_level_snapshot_compare
      - no_level_change_return
      - level_change_enqueue_or_expose_exploration_candidate
    schema_contract:
      watch_target: top3_norm_level_records_initial_policy
      watch_timing: every_logs_current_refresh
      no_change_action: return
      change_action: mark_exploration_candidate
      trigger_conditions:
        - top3_membership_changed
        - top3_order_changed
        - norm_delta_exceeds_policy_threshold
        - norm_level_changed
      policy_source: manifest_or_function_parameters_or_policy_table_future_resolved_no_fixed_literals

  exploration:
    role: scheduler_runtime_responsibility
    description: >-
      Registry-neighbor exploration is performed by scheduler/runtime, not by
      an every-write DB trigger.
    inputs:
      - logs.current
      - norm_trigger_candidate
      - logs_hub_current_and_hubs
    behavior:
      - explore_hub_attractor_neighbors
      - vary_vector_order_or_permutation
      - keep_best_neighbor_hits
    required_caps:
      - current_top_level_watch_count
      - norm_delta_threshold
      - permutation_limit
      - hub_attractor_topK
      - attention_evidence_save_limit
      - archive_policy

  logs_attention:
    role: neighbor_hit_phase_evidence_log
    description: >-
      logs.attention stores hub/vector-observed attractor evidence, stable statistics, and phase-shifted candidate vectors. It links physical current (logs.current) to hub relation planes via hub_id/attractor_key/hub_relation_id/relation_registry_id.
    retention: archive_required
    suggested_fields:
      - attention_id
      - current_id
      - source_set_id
      - statistics_json
      - ema_score
      - l2_norm
      - vector_json
      - phase_vector_json
      - permutation_key
      - hub_id
      - attractor_key
      - hub_relation_id
      - relation_registry_id
      - neighbor_score
      - hit_rank
      - evidence_json
      - created_at
      - archive_policy
    schema_contract:
      role: hub_vector_indicated_attractor_observation_and_phase_vector_evidence_log
      suggested_fields:
        - attention_id
        - current_id
        - hub_current_id
        - source_set_id
        - statistics_json
        - ema_score
        - l2_norm
        - vector_json
        - phase_vector_json
        - permutation_key
        - hub_id
        - attractor_key
        - hub_relation_id
        - relation_registry_id
        - neighbor_score
        - hit_rank
        - evidence_json
        - created_at
        - archive_policy
      persistence_semantics:
        - append_only
        - archive_required
        - must_reference_logs_current_current_id
        - statistics_json_and_ema_score_store_stable_confidence_layer
        - vector_json_stores_convergent_neighbor_hit_vector
        - phase_vector_json_stores_exploratory_phase_shifted_candidate_vector

  phase_attention:
    role: post_main_auxiliary_evidence_transform
    description: >-
      Phase Attention is a downstream auxiliary transformation that starts from
      logs.attention.vector_json after main neighbor exploration has already
      produced evidence. It is not the primary SQL Attention exploration path.
    route:
      - logs.attention.vector_json
      - quaternion_transform
      - logs.attention.phase_vector_json
    quaternion_semantics:
      equation: q_equals_w_plus_xi_plus_yj_plus_zk
      q_role: phase_rotation_or_projection_state_operator
      attractor_relation: q_can_represent_projection_phase_toward_vector_convergence_point
      boundary: q_is_not_attention_and_not_the_attractor_itself
      w: real_scalar_from_l2_norm
      x_y_z: hub_side_record_count_bases
      i_j_k: movement_amounts_per_axis
    invariants:
      - phase_attention_is_post_main_auxiliary_route
      - phase_vector_is_candidate_evidence_not_adopted_topology_state
      - no_direct_registry_mutation
      - no_automatic_migration_execution
      - no_automatic_column_promotion
      - phase_movement_is_not_manifest_or_policy_cap_derived

physical_table_pressure:
  tableid_semantics: physical_table_identity
  aggregation_target: physical_side
  not_target: topologys_or_registry_direct_search
  observes:
    - physical_table_mutation_pressure
    - physical_column_candidate_pressure
    - physical_operation_component_usage_pressure

registry_semantics:
  role: composition_grammar_tables
  description: >-
    Registry tables are composition tables. They are closer to grammar tables
    than vocabulary rows.
  core_examples:
    - registrar_entries
    - master_registry
    - state_registry
    - relation_registry
    - package_registry
    - schema_registry
    - component_registry
    - function_parameters
    - structure_maps
    - hub_relations
  ui_examples:
    - ui_component_bucket
    - ui_component_registry
    - ui_component_package
    - ui_package_component_map
    - ui_layout_registry
    - ui_wiring_registry
    - ui_topology_tensor
    - components
    - design
    - packages

completion_boundary:
  aggregation_completed: attention_query_basis_ready
  attention_observation_completed: hub_attractor_hit_and_evidence_saved
  phase_candidate_visible: phase_vector_generated_on_logs_attention
  adoption_or_migration: separate_implementation_path
  dangerous_misunderstanding:
    - logs_aggregation_completed_equals_sql_attention_completed
    - phase_vector_generated_equals_adopted_topology_state

existing_repository_mismatch_notes:
  topology_edit_log:
    caution: >-
      topology_edit_log is an abstract-space definition edit audit log and
      is not a physical table/record lifecycle diff source.
    direct_reuse_as_logs_diff: prohibited
    adapter_mapping_requirement: explicit_physical_table_identity_contract
  promotion_candidates:
    can_align_with: logs.candidate
    condition: >-
      Candidate lifecycle and column/axis pressure semantics must be preserved.
    lifecycle_expected:
      - pending
      - approved
      - rejected
    future_expansion_todo:
      - record_count_at_candidate
      - record_count_at_approval
      - threshold_snapshot_for_candidate_and_approval
  context_event:
    can_align_with: logs.ui_operation
    condition: >-
      context_event is a canonical UI/operation/component usage pressure source
      with append-only session sequence semantics.
    boundary:
      - context_event_is_not_logs_current
      - context_event_is_not_logs_attention
  context_hub_recommendation_current:
    caution: not_same_as_logs_current_pressure_basis


function_contract:
  note: concrete_function_names_may_change_but_responsibility_boundary_is_fixed
  functions:
    refresh_logs_current:
      signature: refresh_logs_current(source_set_id, basis_window)
      role:
        - aggregate_logs_sources_into_logs_current_basis
        - refresh_basis_vector_and_pressure_matrix
        - update_count_total_and_recordcount_total
      prohibited_side_effects:
        - hub_attractor_exploration_execution
        - phase_vector_distortion_execution
    calculate_l2_norm:
      signature: calculate_l2_norm(current_id_or_basis_vector)
      role:
        - compute_l2_norm_from_basis_vector
        - expose_norm_for_watch_comparison
      prohibited_side_effects:
        - hub_attractor_exploration_execution
    compare_norm_level_snapshot:
      signature: compare_norm_level_snapshot(top_n)
      role:
        - compare_top_n_membership_order_level_and_norm_delta
      no_change_action: return
      change_action: emit_level_changed_signal
    mark_attention_exploration_candidate:
      signature: mark_attention_exploration_candidate(current_id)
      role:
        - mark_scheduler_runtime_exploration_candidate
      prohibited_side_effects:
        - exploration_execution
    write_logs_attention:
      signature: write_logs_attention(...)
      role:
        - append_attention_evidence_row
        - require_current_id_linkage
        - persist_statistics_attention_phase_evidence_fields
      required_fields:
        - statistics_json
        - ema_score
        - l2_norm
        - vector_json
        - phase_vector_json
        - neighbor_score
        - evidence_json
    generate_phase_vector:
      signature: generate_phase_vector(...)
      ownership: scheduler_runtime
      role:
        - generate_phase_vector_candidate_evidence
      prohibited_side_effects:
        - direct_registry_mutation
        - automatic_migration_execution
        - automatic_column_promotion

trigger_contract:
  source_append_monitoring: allowed_every_append
  flow:
    - source_append_or_aggregation_event
    - refresh_logs_current
    - calculate_l2_norm
    - compare_norm_level_snapshot
  no_change_action: return
  change_action:
    - mark_attention_exploration_candidate
  prohibited_on_trigger:
    - hub_attractor_exploration_execution
    - phase_vector_distortion_execution
    - direct_registry_mutation
    - automatic_migration_execution
    - automatic_column_promotion

db_trigger_boundary:
  allowed:
    - logs_current_lightweight_refresh
    - dirty_flag_marking
    - norm_level_change_detection
    - exploration_candidate_marking
    - no_change_early_return
  prohibited:
    - hub_attractor_exploration_execution
    - phase_vector_generation
    - registry_mutation
    - migration_execution
    - column_promotion_execution

scheduler_runtime_boundary:
  owns:
    - registry_neighbor_exploration
    - bounded_permutation_search
    - phase_vector_generation
    - write_logs_attention_evidence
  notes:
    - exploration_runs_only_after_candidate_marking_or_equivalent_runtime_gate
    - phase_vector_is_candidate_evidence_not_adoption_state

phase_attention_function_contract:
  input:
    - logs_attention_vector_json
    - l2_norm
    - hub_side_record_count_bases_xyz
    - axis_movement_amounts_i_j_k
  calculation:
    quaternion_equation: q_equals_w_plus_xi_plus_yj_plus_zk
    q_role: phase_rotation_or_projection_state_operator
    attractor_relation: q_can_represent_projection_phase_toward_vector_convergence_point
    boundary: q_is_not_attention_and_not_the_attractor_itself
    w: real_scalar_from_l2_norm
    x_y_z: hub_side_record_count_bases
    i_j_k: movement_amounts_on_each_axis
  output:
    - logs_attention_phase_vector_json
  invariants:
    - phase_attention_is_post_main_auxiliary_route
    - phase_vector_is_candidate_evidence
    - phase_vector_does_not_auto_mutate_registry
    - phase_vector_does_not_auto_execute_migration
    - phase_vector_does_not_auto_execute_column_promotion
    - phase_movement_is_not_manifest_or_policy_cap_derived

evidence_layer_separation:
  statistics_layer:
    fields: [statistics_json, ema_score]
    meaning: convergence_confidence_stability_continuity
  attention_layer:
    fields: [l2_norm, vector_json, neighbor_score]
    meaning: current_excitation_neighbor_hit
  phase_attention_layer:
    fields: [phase_vector_json]
    meaning: exploratory_variance_candidate_direction
  invariant: no_single_score_collapse

policy_sources:
  allowed:
    - manifest
    - function_parameters
    - policy_table
  rule: policy_values_are_resolved_from_data_defined_sources_no_hidden_magic_numbers

implementation_order:
  - create_markdown_and_yaml_ssot
  - wire_ssot_into_repository_maps_required_paths_and_structure_checks
  - align_internal_readme_and_design_docs_without_changing_public_article_intent
  - define_schema_function_trigger_contracts
  - implement_logs_current_basis_update_and_norm_level_monitoring
  - implement_logs_attention_evidence_persistence_with_statistics_vector_and_phase_vector
  - implement_scheduler_runtime_hub_attractor_exploration
  - implement_phase_attention_vector_distortion_after_attention_strength_hub_record_count_z_score_clamp_semantics_are_fixed

initial_minimal_basis:
  table_pressure: logs.diff
  column_axis_pressure: logs.candidate
  ui_component_operation_pressure: logs.ui_operation

existing_table_alignment:
  topology_edit_log:
    classification: mismatch
    reason: hub_tensor_or_topology_definition_edit_audit_log_not_physical_table_record_lifecycle_diff
    direct_reuse: prohibited
    alignment_requirement: explicit_physical_table_identity_contract_via_adapter_mapping
  promotion_candidates:
    classification: conditional_logs_candidate
    condition:
      - status_lifecycle_preserved
      - column_axis_pressure_semantics_traceable
      - archive_audit_possible
  context_event:
    classification: conditional_logs_ui_operation
    condition:
      - component_or_operation_usage_signal_source_semantics
      - retention_manifest_or_policy_driven
  context_hub_recommendation_current:
    classification: mismatch
    reason: recommendation_current_projection_not_logs_current_calculation_basis

non_goals:
  - function_implementation
  - db_trigger_implementation
  - scheduler_runtime_hub_attractor_exploration_implementation
  - destructive_existing_table_change
  - large_scale_existing_sql_replacement
  - automatic_registry_mutation_from_phase_vector
  - automatic_migration_or_column_promotion_from_phase_vector
  - evidence_layer_single_score_collapse
