version: 1.1
id: sql_attention_logs_ssot
title: SQL Attention Logs SSOT
status: structural_ssot
semantic_markdown: docs/design/sql-attention-logs-ssot.md
ssot_roles:
  markdown: semantic_formula_and_route_ssot
  yaml: structural_policy_schema_runtime_contract_ssot
postgresql_namespace: logs
sql_attention_target:
  target_schema: hubs
  hubs_space_hierarchy:
    tree: |
      hubs.hub
        └─ hubs.topology_manifests
             └─ hubs.hub_relations
  target_semantics:
    - tensor
    - attractor
    - collapse_point
    - hubs_hub_relations_exploration_field
    - topology_manifest_scoped_relation_hit_evidence
    - derived_hub_identity_evidence
  not_target:
    - topology
    - registry
projection_boundary:
  attention_hit: hubs
  projected_meaning_space: topology
  topology_recommendation_basis:
    - statistics
    - ema
    - usage_history
    - trend
deprecated_or_rejected:
  - legacy registry exploration wording as SQL Attention target
  - x/y/z count scalar interpretation as canonical Phase Attention axes

deprecated_interpretations:
  logs.hub_current: treating_support_cache_as_SQL_Attention_exploration_body
physical_schema_contract:
  namespace_boundary:
    logs_namespace_role:
      - physical_time_axis_logs_pressure
      - append_only_evidence
    current_namespace_role:
      - rebuildable_current_relation_projection_surfaces
    canonical_mapping:
      logs.current: current_basis_projection_relation
      logs.hub_current: hub_attractor_projection_relation
      logs.attention: append_only_attention_evidence_relation
  physical_tables:
    - logs.current
    - logs.hub_current
    - logs.attention
  non_adopted_table_names:
    - logs.table_current
    - logs.table_attention
  schema_profile: hub_attractor_target_aware_generic_schema
  neighbor_score_policy:
    source: data_defined_policy_source
    keys:
      - neighbor_score_min
      - strong_hit_threshold
      - normal_hit_threshold
      - exploratory_hit_threshold
    rule: resolve_thresholds_from_policy_source_without_hidden_literals
  exploration_budget_policy_keys:
    - norm_level_high
    - norm_level_medium
    - exploration_budget_tiers.weak.topK_per_hub_kind
    - exploration_budget_tiers.weak.max_hub_tables_per_kind
    - exploration_budget_tiers.weak.phase_expansion_limit
    - exploration_budget_tiers.weak.search_mode
    - exploration_budget_tiers.mid.topK_per_hub_kind
    - exploration_budget_tiers.mid.max_hub_tables_per_kind
    - exploration_budget_tiers.mid.phase_expansion_limit
    - exploration_budget_tiers.mid.search_mode
    - exploration_budget_tiers.high.topK_per_hub_kind
    - exploration_budget_tiers.high.max_hub_tables_per_kind
    - exploration_budget_tiers.high.phase_expansion_limit
    - exploration_budget_tiers.high.search_mode
    - max_hub_kinds_per_current
    - max_attention_rows_saved
  exploration_budget_gate:
    gate: w_l2_norm
    rule: Phase Attention does not perform full-space repeated search
    tier_classification:
      weak:
        norm_level: low
        l2_norm: below norm_level_medium
        search_mode: near_neighbor_narrow_topK
      mid:
        norm_level: medium
        l2_norm: norm_level_medium through norm_level_high
        search_mode: normal_topK
      high:
        norm_level: high
        l2_norm: at or above norm_level_high
        search_mode: expanded_distance_band_or_permutation
    bounded_by:
      - topN_physical_heat
      - topK_hub_candidates
      - policy_defined_expansion_limits
    prohibited:
      - full_space_repeated_search
      - automatic_topology_registry_mutation
  runtime_boundary:
    refresh_current:
      role: current_basis_recalculation
      side_effect_scope:
        - updates_logs_current
        - returns_change_candidates
      prohibited:
        - writes_logs_attention
        - generates_phase_vector
        - mutates_registry
    norm_watch:
      role: l2_norm_level_change_detection
      side_effect_scope:
        - reads_logs_current
        - emits_level_change_signal
      prohibited:
        - writes_logs_attention
        - mutates_hubs
        - mutates_topology
    exploration_runtime:
      role: manifest_scoped_hub_relation_observation
      side_effect_scope:
        - reads_logs_current_trigger
        - resolves_related_topology_manifest_ids
        - explores_hubs_hub_relations
        - derives_hub_id_through_topology_manifests
        - may_read_logs_hub_current_support_cache
        - appends_logs_attention_sqlAT_evidence
      prohibited:
        - treats_logs_hub_current_as_exploration_body
        - mutates_registry
        - mutates_topology
        - mutates_manifests
        - mutates_hub_relations
    phase_vector_transform:
      role: ID_space_phaseAT_evidence_generation
      side_effect_scope:
        - reads_logs_attention_sqlAT_hit_evidence
        - explores_farther_hub_relation_topology_manifest_and_hub_ID_spaces
        - appends_logs_attention_phaseAT_evidence_generation
      prohibited:
        - auto_migration
        - auto_Draft_promotion
        - auto_adopted_reflection
        - registry_topology_manifest_or_hub_relation_mutation
public_article: false
canonical_markdown: docs/design/sql-attention-logs-ssot.md

recommendation_pressure_lane_boundary:
  role: concept_projection_recommendation_lane
  lane: sql_attention_projection
  space:
    - inter_hub
    - inter_projection
    - topology_concept_space
  recommendation_target: next_hub_projection_candidate
  output_concept: which_hub_projection_or_topology_to_examine_next
  canonical_reference:
    - docs/design/context-route-recommendation.yaml
    - docs/design/context-route-recommendation.md
  result_contract:
    sql_attention_recommendation_result:
      required_lane: true
      lane: sql_attention_projection
  boundaries:
    parent_definition_not_in_context_route_recommendation: true
    prohibited:
      - direct_injection_into_hub_local_ui_pressure_or_state_pressure_results
      - treating_logs_attention_hit_as_next_operation_or_next_enum_item_within_hub
      - collapsing_sql_attention_projection_with_hub_local_recommendation_lane
  context_route_recommendation_relation:
    role: sibling_lane_not_parent
    hub_local_lanes:
      - ui_pressure
      - state_pressure
  child_island_projection_contract:
    parent_island: main_projection_island
    child_island: recommend_navigation_child_island
    block: sql_attention_projection_block
    receives: admin_dispatch_pipeline_response_via_sql_attention:list_projection
    frontend_responsibility: render_only
    source_resolution:
      source_set_id_required_for_fetch: true
      unresolved_source_set_id_status: explicit_unavailable
      fixed_frontend_fallback_source_set_id: prohibited
    fetch_route_constraint:
      frontend_originated_projection_request: admin_dispatch_pipeline
      canonical_dispatch_layer: sql_attention
      canonical_dispatch_action: list_projection
      prohibited: direct_get_bypass_route_for_frontend_originated_projection
    prohibited_mixing:
      - injecting_next_hub_projection_candidate_into_ui_pressure
      - injecting_next_hub_projection_candidate_into_state_pressure
      - treating_sql_attention_candidate_as_next_operation
      - treating_sql_attention_candidate_as_next_enum_item
    executable_candidate_policy:
      frontend_fixed_dispatch: prohibited
      required_route: backend_resolved_runtime_dispatch_spec_or_wiring
    canonical_reference:
      - docs/design/context-route-recommendation.yaml
      - docs/design/context-route-recommendation.md

purpose:
  summary: >-
    Define SQL Attention logs, current calculation basis, norm-level trigger,
    hub-attractor exploration, phase vector evidence, and attention evidence
    persistence.
  non_goal:
    - public_marketing_copy
    - sql_side_transformer_qk_reproduction
    - every_log_append_registry_search
    - direct_registry_mutation_from_trigger
    - evidence_layer_single_score_collapse

core_definition:
  one_sentence: >-
    SQL Attention converts logs.diff physical mutation pressure into logs.current,
    watches policy-qualified topN rank and norm-level changes, resolves related
    topology_manifest_id arrays for triggered physical tables, explores
    hubs.hub_relations, and appends traceable SQLAT evidence into logs.attention.
    Phase Attention starts from those hits, explores farther ID spaces, and appends
    phaseAT evidence without automatically authoring canonical state.
  flow:
    - logs_diff_physical_mutation_pressure
    - logs_current_calculation_basis
    - topN_rank_norm_level_watch
    - related_topology_manifest_id_array_resolution
    - hubs_hub_relations_exploration
    - logs_attention_sqlAT_hit_evidence_append
    - logs_attention_phaseAT_generation_append

philosophy_and_structure:
  separation_required: true
  layers:
    statistics:
      meaning: convergence_confidence_stability_continuity
      examples:
        - count
        - recordcount
        - EMA
        - trend
        - feedback
    attention:
      meaning: current_excitation_neighbor_hit_strength
      examples:
        - l2_norm
        - neighbor_score
        - vector_json
    phase_attention:
      meaning: exploratory_variance_shifted_candidate_vector
      examples:
        - phase_vector_json
  evidence_layer_rule: >-
    Statistics, Attention, and Phase Attention must be preserved as separate
    evidence meanings and must not be collapsed into a single score at the
    evidence layer.
  duality:
    vector_json: convergent_neighbor_hit
    phase_vector_json: divergent_exploratory_candidate_direction
  visualization_targets:
    - statistics_trend
    - attention_norm_trend
    - phase_vector_trend

layers:
  logs_signal_sources:
    role: aggregation_sources
    description: >-
      logs.* tables are signal sources. They observe physical-side usage,
      mutation, candidates, or other runtime signals. They are not final
      attention results and are not registry grammar tables.
    initial_sources:
      logs.diff:
        pressure: physical_table_record_lifecycle_mutation_pressure_source
        lifecycle_operations:
          - create
          - update
          - logical_delete
          - restore
          - physical_delete
        retention: archive_required
        delete_policy: no_destructive_delete
        tableid_semantics: physical_table_identity
        required_identity_fields:
          - physical_table_id
          - physical_table_name
          - record_id
          - operation_kind
          - before_state_or_diff_json
          - after_state_or_diff_json
          - observed_at
          - actor_or_source
          - archive_policy
        read_boundary:
          repository_method: LoadPhysicalRecordHistoryAsync(tableId, recordId, ct)
          admin_runtime_action: physical_record:list_history
          filter_identity: [physical_table_id, record_id]
          no_history_status: explicit empty_history with []
        boundary:
          - not_hub_tensor_topology_edit_audit_log
          - not_direct_reuse_of_topology_edit_log
          - no_silent_fallback_to_topology_edit_log
      logs.candidate:
        pressure: columnization_candidate_pressure_on_physical_time_axis_space
        canonical_alignment:
          - logs.usage_metrics_as_observed_access_usage_pressure
          - logs.promotion_candidates_as_columnization_index_registry_or_physical_table_promotion_candidates
        candidate_lifecycle:
          - candidate_open
          - approved
          - rejected
        approval_projection_note: approved_candidates_can_be_extracted_as_adopted_state
        retention: archive_required
        delete_policy: no_destructive_delete
        tableid_semantics: physical_table_identity
        required_state_semantics:
          - candidate_open
          - adopted
          - rejected
      logs.ui_operation:
        pressure: ui_operation_component_usage_pressure_on_physical_time_axis_space
        canonical_source_table: context_event
        sequence_semantics: append_only_session_sequence_event_log
        retention: manifest_or_policy_driven
        tableid_semantics: physical_table_identity
        note: >-
          Retention policy must be decided by manifest/policy. Component usage
          matters; package-level usage alone is insufficient.
    extensibility: >-
      The initial sources are examples. Other logs source combinations may use
      the same structure when source semantics are explicit.
    logical_source_name_contract:
      note: logs.diff_logs.candidate_logs.ui_operation_are_logical_signal_source_names_not_immediate_physical_table_names
    required_fields:
      - source_name
      - source_kind
      - physical_table_id
      - source_axis_ref
      - count_source
      - recordcount_source
      - created_at
      - archive_policy
      - retention_policy
    schema_contract:
      abstract_fields:
        - source_id
        - source_name
        - source_kind
        - physical_table_id
        - physical_table_name
        - source_axis_kind
        - source_axis_ref
        - count_value
        - recordcount_value
        - weight_value
        - recency_window
        - observed_at
        - archive_policy
        - retention_policy
        - evidence_json
      extension_condition:
        - source_kind_is_explicit
        - pressure_semantics_are_explicit
        - physical_table_id_identity_semantics_preserved

  logs_current:
    role: calculation_basis_memo
    description: >-
      current basis surface (physical name: logs.current) stores compressed pressure state derived from logs.*
      so runtime does not repeatedly scan raw logs. It is a calculation basis,
      not the SQL Attention conclusion.
    must_support:
      - pressure_matrix_construction
      - l2_norm_calculation
      - top_norm_level_snapshot_comparison
      - exploration_candidate_creation
    suggested_fields:
      - current_id
      - source_set_id
      - basis_window
      - basis_rows
      - basis_columns
      - count
      - recordcount
      - weight
      - l2_norm
      - level_snapshot
      - evaluated_at
    matrix_semantics:
      rows: physical_table_or_physical_table_combination
      columns: signal_source_pressure_axes
      cells: count_recordcount_weight_recency
    probability_policy: >-
      Pressure values are observations. They do not need to be rounded into
      probabilities.
    schema_contract:
      role:
        - calculation_basis_memo
        - pressure_matrix_basis
        - l2_norm_calculation_basis
        - top_n_norm_level_snapshot_comparison_basis
      suggested_fields:
        - current_id
        - source_set_id
        - basis_window
        - physical_table_id
        - physical_table_name
        - basis_vector_json
        - pressure_matrix_json
        - count_total
        - recordcount_total
        - l2_norm
        - norm_rank
        - norm_level
        - previous_norm_level
        - level_changed
        - evaluated_at
        - updated_at
      persistence_semantics: regenerable_projection_cache_not_archive_required_append_log

  norm_trigger:
    role: logs_current_topN_rank_norm_level_exploration_gate
    description: >-
      Monitoring may run whenever logs.current is refreshed. SQL Attention
      exploration begins only when the policy-qualified topN membership, rank
      order, norm delta, or norm level changes.
    trigger_conditions:
      - topN_membership_changed
      - topN_rank_order_changed
      - norm_delta_exceeds_policy_threshold
      - norm_level_changed
    no_change_action: return
    change_action: mark_exploration_candidate
    policy_source: data_defined_policy_source_no_fixed_literals

  exploration:
    role: hubs_hub_relations_exploration
    description: >-
      For triggered physical_table_id / physical_table_name subjects, resolve
      related topology_manifest_id arrays and explore hubs.hub_relations from
      those manifest IDs. Derive hub_id through hubs.topology_manifests and append
      hit evidence. logs.hub_current is an optional support cache, not the
      exploration body.
    inputs:
      - logs.current_triggered_physical_table_id_and_name
      - related_topology_manifest_id_array_via_topology.physical_table_manifest_bindings
      - hubs.hub_relations
      - optional_logs.hub_current_support_cache
    hit_identity:
      - hub_relation_id
      - topology_manifest_id
      - hub_id_derived_through_hubs.topology_manifests
    required_caps:
      - watched_topN_size
      - norm_delta_threshold
      - neighbor_score_thresholds
      - relation_exploration_topK
      - phase_expansion_limit
      - attention_evidence_save_limit
      - archive_policy
    policy_rule: resolve_caps_from_data_defined_policy_source

  logs_attention:
    role: append_only_SQLAT_phaseAT_generation_log
    description: >-
      logs.attention appends SQLAT hub-relation hit evidence and phaseAT farther
      ID-space exploration evidence. Each row belongs to an evidence generation
      line. Evidence is not a Draft or adopted canonical topology object.
    retention: archive_required
    generation_line:
      stages:
        - logs_current_trigger
        - SQLAT_hit_evidence_row
        - phaseAT_evidence_row
        - explicit_Draft_promotion_command_or_user_operation
        - explicit_adopted_operation
        - explicit_rejected_operation
        - canonical_reflection
      append_only_evidence_stages:
        - SQLAT_hit_evidence_row
        - phaseAT_evidence_row
        - Draft_adoption_rejection_lifecycle_evidence_rows
      explicit_only_stages:
        - Draft_promotion
        - adopted_reflection
        - rejected_recording
    SQLAT_hit_identity:
      - physical_table_id
      - physical_table_name
      - topology_manifest_id
      - hub_relation_id
      - hub_id
    schema_contract:
      role: append_only_SQLAT_phaseAT_generation_evidence_log
      suggested_fields:
        - attention_id
        - current_id
        - hub_current_id
        - source_set_id
        - evidence_kind
        - generation_line_id
        - source_attention_id
        - source_current_id
        - source_topology_manifest_ids
        - hit_hub_relation_ids
        - expanded_hub_relation_ids
        - expanded_topology_manifest_ids
        - expanded_hub_ids
        - phase_status
        - promotion_status
        - actor_or_source
        - command_id
        - physical_table_id
        - physical_table_name
        - topology_manifest_id
        - statistics_json
        - ema_score
        - l2_norm
        - vector_json
        - phase_vector_json
        - permutation_key
        - hub_id
        - attractor_key
        - hub_relation_id
        - relation_registry_id
        - neighbor_score
        - hit_rank
        - evidence_json
        - created_at
        - archive_policy
      persistence_semantics:
        - append_only
        - archive_required
        - must_reference_logs_current_current_id
        - statistics_json_and_ema_score_store_stable_confidence_layer
        - vector_json_stores_convergent_neighbor_hit_vector
        - phase_vector_json_stores_exploratory_phase_shifted_candidate_vector
        - SQLAT_and_phaseAT_rows_preserve_generation_lineage
    lineage_semantics:
      - trace_trigger_current
      - trace_parent_SQLAT_hit_for_phaseAT
      - trace_policy_source
      - preserve_generation_identity
    prohibited:
      - evidence_row_equals_Draft
      - automatic_topology_mutation
      - automatic_registry_mutation
      - automatic_manifest_mutation
      - automatic_hub_relation_mutation

  phase_attention:
    role: SQLAT_hit_seeded_farther_ID_space_evidence_generation
    description: >-
      Phase Attention starts from SQLAT hit evidence, explores farther relation,
      manifest, and hub ID spaces under the w l2_norm budget, and appends q as a
      phaseAT evidence row in logs.attention.
    quaternion_semantics:
      equation: q_equals_w_plus_xi_plus_yj_plus_zk
      q: logs.attention_phaseAT_evidence_row
      w: l2_norm
      x: hubs_hub_relations_SQLAT_near_neighbor_hit_hub_relation_id
      y: topology_manifest_id_present_on_x_in_hubs_topology_manifests_not_hubs_hub_axis
      z: hub_id_registered_by_y_through_hubs_topology_manifests
      i: farther_hub_relation_id_array_from_x_ID_vector_bounded_by_w
      j: i_plus_farther_topology_manifest_id_array_from_y_ID_vector
      k: j_plus_farther_hub_id_array_from_z_ID_vector
    deprecated_count_scalar_interpretation:
      canonical: false
      legacy_only:
        - x_equals_hub_relations_count
        - y_equals_hub_count
        - z_equals_topology_manifests_count
      allowed_use: statistics_or_support_cache_observation_only
    invariants:
      - phase_attention_is_post_main_auxiliary_route
      - phase_vector_is_candidate_evidence_not_adopted_topology_state
      - q_is_phaseAT_evidence_row_not_Draft
      - Draft_promotion_requires_explicit_command_or_user_operation
      - adopted_reflection_requires_explicit_operation
      - no_direct_registry_mutation
      - no_automatic_migration_execution
      - no_automatic_column_promotion
      - no_automatic_topology_registry_manifest_or_hub_relation_mutation
      - phase_movement_is_not_manifest_or_policy_cap_derived
      - policy_values_resolve_from_data_defined_sources

physical_table_pressure:
  tableid_semantics: physical_table_identity
  aggregation_target: physical_side
  not_target: topology_or_registry_direct_search
  observes:
    - physical_table_mutation_pressure
    - physical_column_candidate_pressure
    - physical_operation_component_usage_pressure

registry_semantics:
  role: composition_grammar_tables
  description: >-
    Registry tables are composition tables. They are closer to grammar tables
    than vocabulary rows.
  core_examples:
    - registrar_entries
    - master_registry
    - state_registry
    - relation_registry
    - package_registry
    - schema_registry
    - component_registry
    - function_parameters
    - structure_maps
    - hub_relations
  ui_examples:
    - ui_component_bucket
    - ui_component_registry
    - ui_component_package
    - ui_package_component_map
    - ui_layout_registry
    - ui_wiring_registry
    - ui_topology_tensor
    - components
    - design
    - packages

completion_boundary:
  sqlAT_observation_completed: append_only_SQLAT_hit_evidence_saved
  phaseAT_observation_completed: append_only_phaseAT_evidence_saved
  Draft_promotion: explicit_command_or_user_operation_only
  adopted_reflection: explicit_adopted_operation_only
  dangerous_misunderstanding:
    - SQLAT_or_phaseAT_evidence_equals_Draft
    - phaseAT_evidence_equals_adopted_topology_state
    - evidence_generation_auto_mutates_canonical_state

existing_repository_mismatch_notes:
  topology_edit_log:
    caution: >-
      topology_edit_log is an abstract-space definition edit audit log and
      is not a physical table/record lifecycle diff source.
    direct_reuse_as_logs_diff: prohibited
    adapter_mapping_requirement: explicit_physical_table_identity_contract
  promotion_candidates:
    can_align_with: logs.candidate
    condition: >-
      Candidate lifecycle and column/axis pressure semantics must be preserved.
    lifecycle_expected:
      - candidate_open
      - approved
      - rejected
    future_expansion_todo:
      - record_count_at_candidate
      - record_count_at_approval
      - threshold_snapshot_for_candidate_and_approval
  context_event:
    can_align_with: logs.ui_operation
    condition: >-
      context_event is a canonical UI/operation/component usage pressure source
      with append-only session sequence semantics.
    boundary:
      - context_event_is_not_logs_current
      - context_event_is_not_logs_attention
  context_hub_recommendation_current:
    caution: not_same_as_logs_current_pressure_basis


function_contract:
  note: concrete_function_names_may_change_but_responsibility_boundary_is_fixed
  functions:
    refresh_logs_current:
      signature: refresh_logs_current(source_set_id, basis_window)
      role:
        - aggregate_logs_sources_into_logs_current_basis
        - refresh_basis_vector_and_pressure_matrix
        - update_count_total_and_recordcount_total
      prohibited_side_effects:
        - hub_attractor_exploration_execution
        - phase_vector_distortion_execution
    calculate_l2_norm:
      signature: calculate_l2_norm(current_id_or_basis_vector)
      role:
        - compute_l2_norm_from_basis_vector
        - expose_norm_for_watch_comparison
      prohibited_side_effects:
        - hub_attractor_exploration_execution
    compare_norm_level_snapshot:
      signature: compare_norm_level_snapshot(top_n)
      role:
        - compare_top_n_membership_order_level_and_norm_delta
      no_change_action: return
      change_action: emit_level_changed_signal
    mark_attention_exploration_candidate:
      signature: mark_attention_exploration_candidate(current_id)
      role:
        - mark_scheduler_runtime_exploration_candidate
      prohibited_side_effects:
        - exploration_execution
    write_logs_attention:
      signature: write_logs_attention(...)
      role:
        - append_attention_evidence_row
        - require_current_id_linkage
        - persist_statistics_attention_phase_evidence_fields
      required_fields:
        - statistics_json
        - ema_score
        - l2_norm
        - vector_json
        - phase_vector_json
        - neighbor_score
        - evidence_json
    generate_phase_vector:
      signature: generate_phase_vector(...)
      ownership: scheduler_runtime
      role:
        - generate_phase_vector_candidate_evidence
      prohibited_side_effects:
        - direct_registry_mutation
        - automatic_migration_execution
        - automatic_column_promotion

trigger_contract:
  source_append_monitoring: allowed_every_append
  flow:
    - source_append_or_aggregation_event
    - refresh_logs_current
    - calculate_l2_norm
    - compare_norm_level_snapshot
  no_change_action: return
  change_action:
    - mark_attention_exploration_candidate
  prohibited_on_trigger:
    - hub_attractor_exploration_execution
    - phase_vector_distortion_execution
    - direct_registry_mutation
    - automatic_migration_execution
    - automatic_column_promotion

db_trigger_boundary:
  allowed:
    - logs_current_lightweight_refresh
    - dirty_flag_marking
    - norm_level_change_detection
    - exploration_candidate_marking
    - no_change_early_return
  prohibited:
    - hub_attractor_exploration_execution
    - phase_vector_generation
    - registry_mutation
    - migration_execution
    - column_promotion_execution

scheduler_runtime_boundary:
  owns:
    - hubs_hub_relations_exploration
    - bounded_permutation_search
    - phase_vector_generation
    - write_logs_attention_evidence
  notes:
    - exploration_runs_only_after_candidate_marking_or_equivalent_runtime_gate
    - phase_vector_is_candidate_evidence_not_adoption_state

phase_attention_function_contract:
  input:
    - logs_attention_SQLAT_hit_evidence
    - w_l2_norm
    - x_SQLAT_hit_hub_relation_id
    - y_topology_manifest_id_present_on_x
    - z_hub_id_registered_by_y
  calculation:
    quaternion_equation: q_equals_w_plus_xi_plus_yj_plus_zk
    q_role: logs_attention_phaseAT_evidence_row
    x: hubs_hub_relations_SQLAT_near_neighbor_hit_hub_relation_id
    y: topology_manifest_id_present_on_x_in_hubs_topology_manifests_not_hubs_hub_axis
    z: hub_id_registered_by_y_through_hubs_topology_manifests
    i: farther_hub_relation_id_array_from_x_ID_vector_bounded_by_w
    j: i_plus_farther_topology_manifest_id_array_from_y_ID_vector
    k: j_plus_farther_hub_id_array_from_z_ID_vector
  output:
    - append_logs_attention_phaseAT_evidence_row
  invariants:
    - phaseAT_evidence_row_is_not_Draft
    - Draft_promotion_requires_explicit_command_or_user_operation
    - adopted_reflection_requires_explicit_operation
    - no_automatic_topology_registry_manifest_or_hub_relation_mutation

evidence_layer_separation:
  statistics_layer:
    fields: [statistics_json, ema_score]
    meaning: convergence_confidence_stability_continuity
  attention_layer:
    fields: [l2_norm, vector_json, neighbor_score]
    meaning: current_excitation_neighbor_hit
  phase_attention_layer:
    fields: [phase_vector_json]
    meaning: exploratory_variance_candidate_direction
  invariant: no_single_score_collapse

policy_sources:
  allowed:
    - manifest_policy_binding
    - topology.function_parameters
    - policy_table
  applies_to:
    - thresholds
    - watched_topN_size
    - rank_and_norm_change_policy
    - neighbor_score_policy
    - topK_selection
    - expansion_limits
    - evidence_save_limits
  rule: policy_values_are_resolved_from_data_defined_sources_no_hidden_magic_numbers

implementation_order:
  - refresh_SQL_Attention_and_Phase_Attention_SSOT_semantics
  - wire_SSOT_vocabulary_and_checks_to_ID_space_and_generation_line_contracts
  - align_schema_and_persistence_contracts_for_SQLAT_phaseAT_lineage_and_topology_manifest_id_evidence
  - align_SQL_functions_to_resolve_manifest_IDs_and_explore_hubs_hub_relations
  - retain_logs_hub_current_only_as_optional_support_cache
  - align_backend_exploration_and_repository_writes_with_ID_space_phaseAT_evidence
  - align_explicit_Draft_promotion_and_adopted_reflection_commands_without_automatic_mutation

initial_minimal_basis:
  table_pressure: logs.diff
  column_axis_pressure: logs.candidate
  ui_component_operation_pressure: logs.ui_operation

existing_table_alignment:
  topology_edit_log:
    classification: mismatch
    reason: hub_tensor_or_topology_definition_edit_audit_log_not_physical_table_record_lifecycle_diff
    direct_reuse: prohibited
    alignment_requirement: explicit_physical_table_identity_contract_via_adapter_mapping
  promotion_candidates:
    classification: conditional_logs_candidate
    condition:
      - status_lifecycle_preserved
      - column_axis_pressure_semantics_traceable
      - archive_audit_possible
  context_event:
    classification: conditional_logs_ui_operation
    condition:
      - component_or_operation_usage_signal_source_semantics
      - retention_manifest_or_policy_driven
  context_hub_recommendation_current:
    classification: mismatch
    reason: recommendation_current_projection_not_logs_current_calculation_basis

non_goals:
  - function_implementation
  - db_trigger_implementation
  - scheduler_runtime_hub_attractor_exploration_implementation
  - destructive_existing_table_change
  - large_scale_existing_sql_replacement
  - automatic_registry_mutation_from_phase_vector
  - automatic_migration_or_column_promotion_from_phase_vector
  - evidence_layer_single_score_collapse

manifest_topology_key_expansion_draft_lane:
  name: manifest_topology_key_expansion_draft_lane
  role: sql_attention_evidence_consumer
  execution_model: sql_only

  source:
    required_source: logs.attention_sql_attention_evidence
    source_tag_required: true
    source_tag: sql_attention
    evidence_refs_required: true

  key_discovery_space:
    source: sql_attention_explored_hub_relation_neighborhood
    rule: hub_relation_neighborhood_is_key_extraction_space_not_candidate_completion_space
    discrete_key_examples:
      - enum_value
      - status
      - category
      - type
      - kind
      - state
      - boolean
      - low_cardinality_value

  expansion_space:
    target: all_registered_manifest_topology_space
    rule: expand_high_pressure_discrete_keys_across_full_registered_manifest_topology_space
    not_limited_to:
      - sql_attention_neighbor_hub_relations
    search_basis:
      - topology_manifest_jsonb
      - screen_data_shape_jsonb
      - logical_tables
      - logical_columns
      - enum_group_or_discrete_value_metadata
      - physical_table_manifest_bindings_when_available

  candidate_compilation:
    model: sql_query_or_sql_function
    csharp_role: trigger_orchestration_only
    from_key_hit_set:
      - same_name_column_axis
      - same_type_column_axis
      - same_name_and_same_type_common_axis
      - enum_group_match
      - value_overlap_when_available
      - logs_diff_pressure
      - logs_attention_pressure
      - table_ref_reuse
      - manifest_reuse
    candidate_types:
      - relationship_axis_candidate
      - meaning_projection_candidate
      - aggregate_projection_candidate

  draft_output:
    write_mode: insert_only
    write_target: draft_candidate_db
    payload_format: jsonb
    required_payload_values:
      source: sql_attention
      candidate_lane: manifest_topology_key_expansion_draft_lane
      status: draft

  markdown_projection:
    mode: saved_markdown_projection
    markdown_body_generated_by: sql
    markdown_is_authority: false
    authority_record: draft_candidate_jsonb
    recommended_surface:
      - md_viewer_preset
      - team_markdown_dashboard_saved_view
    prohibited_markdown_content:
      - raw_html
      - island_markup
      - css_class_authority
      - executable_script
      - promotion_instruction_as_authority

  notification:
    mode: db_notify_on_insert
    trigger: after_draft_candidate_or_markdown_projection_insert
    notify_payload_format: structured_json
    notify_payload_required_values:
      event_type: sql_attention_draft_candidate_created
      source: sql_attention
      candidate_lane: manifest_topology_key_expansion_draft_lane
    sse_behavior:
      - notify_projection_if_available
      - ui_decides_display_surface
      - no_ui_placement_authority_in_sql

  prohibited:
    - hub_relation_neighborhood_only_candidate_completion
    - full_space_schema_mining_without_sql_attention_evidence
    - csharp_candidate_inference_required
    - direct_manifest_active_mutation
    - direct_topology_registry_mutation
    - direct_hub_relation_mutation
    - direct_runtime_route_mutation
    - auto_apply
    - auto_promote
    - treating_markdown_as_runtime_ssot
    - sql_generated_html
    - sql_generated_island_markup
    - sql_generated_ui_placement