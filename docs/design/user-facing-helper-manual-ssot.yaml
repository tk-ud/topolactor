user_facing_helper_manual_ssot:
  name: user_facing_helper_manual
  version: 0.1.0
  status: ssot_design_document
  canonical_path: docs/design/user-facing-helper-manual-ssot.yaml

  purpose:
    summary: >-
      Topolactor のユーザー向け説明、ヘルパー、マニュアル、サイト内ガイドの
      UX-facing policy を定義する。
      canonical runtime SSOT の外向き projection として機能し、
      Desktop AI / CLI / MCP / 月次処理 / 分析自動化 / 出力 / 承認境界を
      非技術ユーザー向けに説明可能にする。
    goals:
      - non_technical_user_can_understand_what_topolactor_does
      - user_can_understand_what_ai_cli_mcp_can_and_cannot_do
      - user_can_understand_where_human_approval_is_required
      - helper_manual_precedes_implementation_to_prevent_ux_safety_boundary_drift
    non_goals:
      - replace_internal_runtime_ssot
      - replace_db_manifest_registry_permission_authority
      - create_site_pages_or_ui_components
      - create_help_components_or_mcp_tools
      - rewrite_readme

  authority_boundary:
    description: >-
      user-facing helper / manual は runtime authority を持たない。
      DB / Manifest / Runtime / Bundle / Permission / Audit の正本ではない。
      ユーザーに約束する操作範囲・安全境界・導線説明の SSOT である。
    owns:
      - user_promise
      - onboarding_policy
      - safe_operation_boundary_description
      - helper_manual_category_structure
      - ux_facing_message_policy
    does_not_own:
      - runtime_dispatch_authority
      - db_schema_authority
      - permission_enforcement_authority
      - audit_log_authority
      - email_send_runtime
      - payment_runtime
      - bundle_implementation
    runtime_authority_source:
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/admin-console-workflow-ssot.yaml
      - docs/design/cli-model-context-protocols-port-ssot.yaml
      - docs/design/extended-runtime-bundle-registry-ssot.yaml
      - docs/framework-policy.yaml

  user_facing_message_policy:
    description: >-
      ユーザーに向けてどのような表現・約束をするかの方針。
      実際の文言ライティングは各マニュアル/ヘルプ実装時に行う。
      ここでは「何を伝えるか」の方針を定義する。
    core_messages:
      what_topolactor_can_do:
        - simple_business_app_creation_without_code
        - form_list_pdf_csv_as_basic_surface
        - monthly_processing_automation_extension
        - analysis_and_aggregation_extension
        - external_output_extension
        - desktop_ai_assisted_data_search_and_aggregation
      what_ai_cli_mcp_can_do:
        - search_business_data_within_permitted_scope
        - aggregate_and_summarize
        - analyze_and_find_patterns
        - export_csv_pdf_zip
        - read_monthly_context
        - validate_before_export
      what_ai_cli_mcp_cannot_do:
        - send_email_without_human_approval
        - confirm_payment_without_human_approval
        - delete_records
        - execute_final_register_without_human_approval
        - operate_db_directly
        - bypass_permission_scope
    language_policy:
      principle: use_plain_business_language_not_internal_system_terms
      avoid:
        - topology
        - manifest
        - runtime_orchestration
        - ssot
        - attractor
      use_instead:
        topology: 業務アプリの構造
        manifest: 業務コンテンツ設定
        runtime: 処理の実行
        export_job: 搬出処理
        cli_reader_port: AI/CLIへのデータ読み取り窓口

  helper_manual_category_candidates:
    description: >-
      将来作成するヘルパー・マニュアルのカテゴリ候補。
      実装しない。方針として整理する。
      各カテゴリには policy_focus を付与して user_promise / safety_boundary / onboarding_policy の
      どの方針として位置づけるかを明記する。
    policy_focus_definitions:
      onboarding_policy: >-
        ユーザーが Topolactor を使い始めるための導線・機能説明。
        「できること」の説明が中心。
      safety_boundary: >-
        AI/CLI/MCP がしないこと・人間承認が必要な操作の説明。
        「してはいけないこと」「境界」の説明が中心。
      user_promise: >-
        Topolactor がユーザーに約束する操作範囲の説明。
        「安心して使える根拠」の説明が中心。
    categories:
      getting_started:
        id: getting_started
        title: はじめての業務アプリ作成
        audience: non_technical_business_user
        classification: planned
        policy_focus:
          - onboarding_policy
        policy_note: >-
          ユーザーが最初に何ができるかを理解するための入口。
          技術用語なしで「業務アプリを作る」体験を説明する。

      basic_surfaces:
        id: basic_surfaces
        title: フォーム・一覧・PDF・CSVの基本
        audience: non_technical_business_user
        classification: planned
        policy_focus:
          - onboarding_policy
        policy_note: >-
          基本操作面（フォーム/一覧/PDF/CSV）の説明。
          「何が使えるか」の onboarding_policy カテゴリ。

      monthly_automation:
        id: monthly_automation
        title: 月次処理を自動化する
        audience: business_user_or_admin
        classification: planned
        policy_focus:
          - onboarding_policy
          - user_promise
        policy_note: >-
          月次処理の自動化が「できること」の説明（onboarding）。
          同時に「AI が自律的に処理するのではなく、ユーザーが設定した範囲で動く」という
          user_promise を含む。

      desktop_ai_analysis:
        id: desktop_ai_analysis
        title: Desktop AIで業務データを分析する
        audience: business_user_or_power_user
        classification: planned
        policy_focus:
          - user_promise
          - safety_boundary
        policy_note: >-
          AI で何ができるか（user_promise）と何をしないか（safety_boundary）を
          セットで説明する必要があるカテゴリ。
          Desktop AI が「データを読む・集計する」範囲に留まり、
          「変更・削除・送信」を自律実行しないことを plain business language で説明する。
        related_ssot:
          - docs/design/cli-model-context-protocols-port-ssot.yaml

      cli_mcp_reader:
        id: cli_mcp_reader
        title: CLI / MCP Reader Port を使う
        audience: technical_user_or_integrator
        classification: planned
        policy_focus:
          - user_promise
          - safety_boundary
        policy_note: >-
          CLI/MCP Reader Port が「読む・集計する・搬出する」に限定されていることの説明。
          DB 直接操作・commit・delete・email send・payment approval の禁止境界を
          technical user 向けに明示する。
        related_ssot:
          - docs/design/cli-model-context-protocols-port-ssot.yaml

      csv_pdf_zip_export:
        id: csv_pdf_zip_export
        title: CSV / PDF / ZIP を出力する
        audience: business_user_or_admin
        classification: planned
        policy_focus:
          - user_promise
        policy_note: >-
          「搬出処理」が何を出力できて何を出力できないかの user_promise。
          認可されたスコープのみ搬出できること・credential 実値は含まれないことを説明する。
        related_ssot:
          - docs/design/cli-model-context-protocols-port-ssot.yaml

      email_approval_guide:
        id: email_approval_guide
        title: Email送信はUIで承認する
        audience: business_user
        classification: planned
        policy_focus:
          - safety_boundary
          - user_promise
        policy_note: >-
          AI/CLI/MCP が自律的に email を送信しないことの safety_boundary。
          UI 上の人間承認後にのみ送信される user_promise。
          「自動送信されることはない」という安心感の説明が中心。
        safety_note: >-
          Email send は UI 上の人間承認に閉じる。
          AI/CLI/MCP から自動送信しない。
        related_ssot:
          - docs/design/extended-runtime-bundle-registry-ssot.yaml

      stripe_payment_guide:
        id: stripe_payment_guide
        title: Stripe決済はWebhookで確定する
        audience: admin_or_integrator
        classification: planned
        policy_focus:
          - safety_boundary
          - user_promise
        policy_note: >-
          Stripe paid state が webhook 検証後にのみ確定するという safety_boundary。
          AI/CLI/MCP・UI callback 単体では支払い確定しないという user_promise。
          「自動確定されることはない」という安心感の説明が中心。
        safety_note: >-
          Stripe paid state は webhook 検証後に確定する。
          AI/CLI/MCP から直接確定しない。
        related_ssot:
          - docs/design/extended-runtime-bundle-registry-ssot.yaml

      admin_permission_export_audit:
        id: admin_permission_export_audit
        title: "管理者向け: 権限・搬出・監査設定"
        audience: admin
        classification: planned
        policy_focus:
          - onboarding_policy
          - safety_boundary
        policy_note: >-
          管理者が権限・搬出スコープ・監査ログを設定する onboarding_policy。
          同時に「設定済みスコープ外には出力されない」という safety_boundary を含む。
        related_ssot:
          - docs/design/cli-model-context-protocols-port-ssot.yaml
          - docs/design/admin-console-workflow-ssot.yaml

      external_bundle_guide:
        id: external_bundle_guide
        title: 外部Bundle連携の考え方
        audience: admin_or_integrator
        classification: planned
        policy_focus:
          - safety_boundary
          - user_promise
        policy_note: >-
          外部サービス（Notion/Sheets/Slack 等）が Topolactor の runtime SSOT ではなく、
          intake/preview/apply 境界を通じてのみ扱われるという safety_boundary。
          外部サービスの設定が自動的に Topolactor の正本データになることはないという user_promise。
        note: >-
          Notion / Sheets / Slack 等は人間編集・intake surface として扱う。
          Topolactorのruntime SSOTではない。
        related_ssot:
          - docs/design/extended-runtime-bundle-registry-ssot.yaml

  desktop_ai_cli_mcp_writing_guideline:
    description: >-
      Desktop AI / CLI / MCP Reader 向けの説明文を書く際の方針。
      plain business language と approval boundary の説明に特化したライティングルール。
    audience_profiles:
      desktop_ai_user:
        description: Desktop AI（Claude Desktop 等）を業務で使うビジネスユーザー
        language_level: non_technical
        key_concern: "AI に何をさせてよいか / AI が勝手に何かしないか"
      cli_user:
        description: CLI ツールで業務データを取得・分析するテクニカルユーザー
        language_level: technical
        key_concern: "何のデータが読めるか / 何が書き換わるか"
      mcp_reader_user:
        description: MCP プロトコル経由でデータを読む連携担当者・開発者
        language_level: technical
        key_concern: "認可スコープ / read/export の範囲 / 書き込み禁止範囲"
    writing_rules:
      use_plain_business_language:
        rule: >-
          内部システム用語（topology / manifest / attractor / ssot / runtime 等）を
          ユーザー向け説明に使わない。
        examples:
          ng: "topology を参照して manifest_dispatcher が処理します"
          ok: "業務アプリの設定にしたがって処理されます"
      lead_with_what_ai_can_do:
        rule: >-
          できることを先に説明し、できないことは「〜はしません」と明確に添える。
          「できません」「禁止」という語より「〜はしません」「〜は人間が確認します」を使う。
        examples:
          ng: "AI は email send を実行することが禁止されています"
          ok: "メール送信は、UIで人間が確認してから行います。AIが自動で送信することはありません"
      approval_boundary_explanation:
        rule: >-
          「人間の確認が必要な操作」を明示するときは、以下のフォーマットで説明する:
          「〈操作〉は、UI上で〈誰が〉確認してから実行されます。AI/CLIが自動実行することはありません。」
        template: "{action}は、UI上で{approver}が確認してから実行されます。AI/CLIが自動実行することはありません。"
        applies_to:
          - email_send
          - payment_approval
          - record_delete
          - final_register
          - bulk_export_beyond_approved_scope
      scope_boundary_explanation:
        rule: >-
          「読める範囲・出力できる範囲」を説明するときは、
          「設定された許可範囲内で読み取ります」「スコープ外には出力されません」を使う。
          credential 実値・secret・internal system path は含まれないことも明記する。
        examples:
          ng: "CLI reader port が permission scope を解決して Data Reader を呼び出します"
          ok: "許可された業務データの範囲内で読み取り・集計を行います。認証情報や内部システムの設定値は含まれません"
      avoid_technical_jargon_in_non_technical_docs:
        rule: >-
          non_technical ユーザー向けカテゴリ（getting_started / basic_surfaces / monthly_automation /
          email_approval_guide / desktop_ai_analysis）ではシステム専門用語を避ける。
          technical ユーザー向けカテゴリ（cli_mcp_reader / admin_permission_export_audit /
          stripe_payment_guide / external_bundle_guide）では port / scope / credential_kind 等を
          使用可能だが、必ず plain business language での補足を添える。
      safety_first_for_approval_categories:
        rule: >-
          safety_boundary 分類カテゴリでは「何をしないか」を最初に伝えた後、
          「どうすれば実行できるか（UI 承認フロー）」を説明する。
          「禁止されている」ではなく「人間が確認する設計」と表現する。
        examples:
          ng: "AI からのメール送信は禁止です"
          ok: "メール送信は人間が UI 上で確認する設計になっています。AI が自動でメールを送ることはありません"

  safety_boundary:
    description: >-
      ユーザー向け説明にも必ず反映すべき安全境界の方針。
      実装ではなく「ユーザーへの約束」として定義する。
    user_promises:
      - ai_does_not_send_email_without_approval
      - ai_does_not_confirm_payment_without_approval
      - ai_does_not_delete_records
      - cli_mcp_does_not_operate_db_directly
      - stripe_paid_state_requires_webhook_verification
      - external_service_is_not_topolactor_runtime_ssot
    approval_required_operations:
      - email_send
      - payment_approval
      - final_register
      - record_delete
      - bulk_export_beyond_approved_scope
    approval_surface:
      - ui_approval_dialog
      - admin_approval_flow
      - requires_ui_approval_port_config

  relation_to_other_ssot:
    cli_model_context_protocols_port:
      path: docs/design/cli-model-context-protocols-port-ssot.yaml
      role: >-
        CLI/MCP read/export port の runtime 設計正本。
        本SSOTはその user-facing 説明方針を定義する。
    extended_runtime_bundle_registry:
      path: docs/design/extended-runtime-bundle-registry-ssot.yaml
      role: >-
        Email / Stripe / 外部Bundle の分類正本。
        本SSOTはそれらのユーザー向け説明方針を定義する。
    email_bundle_ssot:
      path: docs/design/runtime-bundle-email-ssot.yaml
      status: design_ssot_exists
      role: Email Bundle の runtime 設計正本。UI/Human approval 経由の email send 境界を定義する。
    stripe_bundle_ssot:
      path: docs/design/runtime-bundle-stripe-ssot.yaml
      status: design_ssot_exists
      role: Stripe Bundle の runtime 設計正本。webhook verification 後の paid state 確定境界を定義する。
    runtime_orchestration_ssot:
      path: docs/design/runtime-orchestration-ssot.yaml
      role: canonical runtime route の正本
    admin_console_workflow_ssot:
      path: docs/design/admin-console-workflow-ssot.yaml
      role: admin UI surface の正本
    system_roadmap:
      path: docs/system-roadmap.yaml
      role: 実装状態・マイルストーン参照点
    todo:
      path: .agent/tasks/todo.md
      role: 未実装作業キュー

  explicitly_out_of_scope:
    - site_page_implementation
    - ui_component_implementation
    - help_screen_component_implementation
    - mcp_tool_implementation
    - cli_implementation
    - email_runtime_implementation
    - stripe_runtime_implementation
    - large_scale_copywriting
    - readme_full_rewrite

  change_surface:
    - user_facing_helper_manual
    - ux_facing_policy_ssot
    - helper_manual_category
    - safety_boundary_user_promise
