user_facing_helper_manual_ssot:
  name: user_facing_helper_manual
  version: 0.3.0
  status: ssot_design_document
  canonical_path: docs/design/user-facing-helper-manual-ssot.yaml

  purpose:
    summary: >-
      Topolactor のユーザー向け説明、ヘルパー、マニュアル、サイト内ガイドの
      UX-facing policy と、人間 / AI / MCP / Local LLM / admin UI が共通参照する
      data-defined helper reference の境界を定義する。
      canonical runtime SSOT の外向き projection として機能し、
      Desktop AI / CLI / MCP / 月次処理 / 分析自動化 / 出力 / 承認境界 / admin authoring guidance を
      非技術ユーザーと Agent の双方に説明可能にする。
    goals:
      - non_technical_user_can_understand_what_topolactor_does
      - user_can_understand_what_ai_cli_mcp_can_and_cannot_do
      - user_can_understand_where_human_approval_is_required
      - agent_can_reference_helper_artifact_when_building_topology_authoring_draft
      - admin_helper_projection_can_render_the_same_reference_for_human_users
      - ai_mcp_candidate_origin_is_not_confused_with_human_manual_admin_draft
      - helper_manual_precedes_implementation_to_prevent_ux_safety_boundary_drift
    non_goals:
      - replace_internal_runtime_ssot
      - replace_db_manifest_registry_permission_authority
      - define_new_mcp_tool_surface
      - define_admin_submit_apply_promote_authority
      - implement_site_pages_or_components_in_this_ssot
      - rewrite_readme

  authority_boundary:
    description: >-
      user-facing helper / manual は runtime authority を持たない。
      DB / Manifest / Runtime / Bundle / Permission / Audit の正本ではない。
      ユーザーに約束する操作範囲・安全境界・導線説明と、Agent / MCP / Local LLM が
      authoring draft を構成する時の参照語彙・payload guidance の SSOT である。
      admin helper component は projection viewer であり、admin submit / apply / promote /
      approval を実行しない。
    owns:
      - user_promise
      - onboarding_policy
      - safe_operation_boundary_description
      - helper_manual_category_structure
      - ux_facing_message_policy
      - helper_reference_artifact_contract
      - internal_to_user_facing_vocabulary_mapping
      - mcp_authoring_draft_payload_guidance
      - admin_helper_projection_boundary
    does_not_own:
      - runtime_dispatch_authority
      - db_schema_authority
      - permission_enforcement_authority
      - audit_log_authority
      - admin_submit_authority
      - admin_apply_authority
      - admin_promote_authority
      - approval_authority
      - mcp_tool_implementation
      - email_send_runtime
      - payment_runtime
      - bundle_implementation
    runtime_authority_source:
      - docs/design/runtime-orchestration-ssot.yaml
      - docs/design/admin-console-workflow-ssot.yaml
      - docs/design/cli-model-context-protocols-port-ssot.yaml
      - docs/design/ci-contract-ssot.yaml
      - docs/design/runtime-bundle-audit-approval-ssot.yaml
      - docs/design/extended-runtime-bundle-registry-ssot.yaml
      - docs/framework-policy.yaml

  helper_reference_artifact:
    description: >-
      helper reference artifact は、Agent / External AI / Local LLM / admin UI が同じ参照点を読むための
      data-defined helper body である。AI向けには internal vocabulary を保持し、人間向けには
      user-facing vocabulary projection を提供する。
    planned_paths:
      schema: docs/helper/helper-manual.schema.json
      seed: docs/helper/helper-manual.seed.json
    authority: reference_only_not_runtime_authority
    required_top_level_fields:
      - id
      - title
      - category
      - audience
      - admin_surface
      - origin_kind
      - origin_evidence
      - review_state
      - internal_terms
      - user_facing_terms
      - mcp_draft_payload_hints
      - unresolved_fields_policy
      - approval_boundary
      - prohibited_actions
      - related_ssot
      - examples
      - authoring_lifecycle
      - entry_mode
      - draft_origin
      - clone_mode
      - source_active_manifest_id
      - source_active_evidence
      - lineage_evidence_only
      - replacement_authority
      - replacement_merge_intent
      - replacement_merge_allowed
      - replacement_merge_blockers
      - backend_merge_authority
      - frontend_authority_boundary
      - required_validation_result
      - required_diff_or_log_evidence
      - merge_physical_effect
      - layout_patch_draft_boundary
      - sql_attention_candidate_boundary
    audience_values:
      - human
      - agent
      - integrator
      - admin
    origin_kind_values:
      - human_admin_manual
      - mcp_import_candidate
      - external_ai_structured_output
      - local_llm_structured_output
    review_state_values:
      - not_required
      - review_required
      - reviewed
      - rejected
    category_values:
      - getting_started
      - admin_authoring_flow
      - mcp_topology_authoring_draft
      - cli_mcp_reader
      - external_bundle_guide
      - approval_boundary
      - export_and_file_stream
      - ui_builder_authoring
      - ci_attention_guidance
      - admin_topology_clone_lifecycle
      - replacement_merge_boundary
    entry_mode_values:
      - create_new_topology
      - clone_active_as_replacement_draft
      - clone_active_as_new_topology_draft
    draft_origin_values:
      - manual_new
      - manual_clone_replacement
      - manual_clone_new_topology
      - sql_attention_candidate
    clone_mode_values:
      - none
      - replacement
      - new_topology
    invariant:
      - helper_artifact_is_data_defined_reference_not_authority
      - helper_artifact_must_not_contain_secret_endpoint_credential_or_raw_sql
      - helper_artifact_must_reference_canonical_ssot_for_runtime_semantics
      - helper_artifact_must_distinguish_ai_mcp_candidate_origin_from_human_admin_manual_draft
      - clone_semantics_are_metadata_attribute_or_operation_context_not_status_enum
      - source_lineage_evidence_is_not_replacement_authority
      - replacement_merge_authority_belongs_only_to_backend_adminruntime_manifestrepository_transaction
      - helper_artifact_must_not_convert_sql_attention_candidate_to_draft_or_merge_authority

  admin_topology_clone_lifecycle_reference_contract:
    description: >-
      /admin/contents Step 1 の create / clone lifecycle を helper reference artifact 上で
      Agent / MCP / admin helper が混同せず参照するための JSON contract。
      ユーザーマニュアル本文ではなく、schema / seed / viewer 実装前の artifact vocabulary である。
    canonical_source: docs/design/admin-console-workflow-ssot.yaml
    state_model:
      physical_state: draft_active_toggle
      clone_semantics_location:
        - JSONB_metadata
        - attribute
        - operation_context
      prohibited:
        - clone_status_enum
        - active_and_draft_same_row
        - frontend_decides_merge_target
        - helper_viewer_decides_merge_target
    entry_modes:
      create_new_topology:
        draft_origin: manual_new
        clone_mode: none
        source_active_manifest_id: prohibited
        source_evidence_role: none
        completion_path: conventional_register_promote
      clone_active_as_replacement_draft:
        draft_origin: manual_clone_replacement
        clone_mode: replacement
        source_active_manifest_id: required_uuid
        source_evidence_role: required_evidence_not_authority
        completion_path: backend_validate_then_merge_to_existing_active
      clone_active_as_new_topology_draft:
        draft_origin: manual_clone_new_topology
        clone_mode: new_topology
        source_active_manifest_id: lineage_only
        source_evidence_role: lineage_evidence_only_not_replacement_authority
        completion_path: conventional_register_promote_after_new_identity
    required_reference_fields_for_replacement_clone:
      - source_active_manifest_id
      - source_active_topologySystemName
      - source_active_routeKey
      - source_active_dispatcher_axes
      - source_active_updated_at_or_version
      - source_active_topology_hash_or_equivalent_diff_base
      - draft_origin
      - clone_mode
      - replacement_merge_intent
      - required_validation_result
      - required_diff_or_log_evidence
      - stale_source_blocker
      - active_identity_conflict_blocker
      - merge_target_active_uuid_mismatch_blocker
      - backend_merge_authority
    reference_invariants:
      - create_new_topology_has_no_source_active_manifest_id
      - clone_as_new_topology_is_lineage_only_and_requires_new_identity
      - replacement_clone_requires_backend_validation_before_existing_active_update
      - source_evidence_and_lineage_evidence_never_grant_replacement_authority_by_themselves

  replacement_merge_authority_boundary:
    owner: backend AdminRuntime / ManifestRepository transaction
    helper_reference_role: describe_required_evidence_and_blockers_only
    authority_grant_rule: >-
      Replacement authority is not obtained from source evidence, lineage evidence, helper artifact fields,
      frontend state, MCP candidate payload, or admin helper projection. It is accepted only inside the
      backend AdminRuntime / ManifestRepository transaction after source evidence, validation result,
      diff/log evidence, stale source check, and active identity conflict check pass.
    required_evidence:
      - source_active_manifest_id
      - source_active_topologySystemName
      - source_active_routeKey
      - source_active_dispatcher_axes
      - source_active_updated_at_or_version
      - source_active_topology_hash_or_equivalent_diff_base
      - validation_result
      - diff_or_log_evidence
      - stale_source_check
      - active_identity_conflict_check
    physical_effect:
      - update_existing_active_row_inside_backend_transaction
      - delete_working_draft_row_after_successful_merge
    prohibited:
      - source_evidence_as_replacement_authority
      - lineage_evidence_as_replacement_authority
      - frontend_merge_judgment
      - helper_viewer_merge_judgment
      - promoting_draft_row_to_active_for_replacement_merge
      - preserving_working_draft_row_as_audit_evidence

  sql_attention_candidate_reference_boundary:
    description: >-
      SQL Attention candidate is a candidate/evidence surface until explicit human/admin adoption.
      Helper reference artifact may display or describe the candidate evidence, but must not treat it
      as a draft row, production merge authority, or replacement authority.
    draft_origin: sql_attention_candidate
    storage_policy: candidate_or_evidence_surface_until_explicit_adoption
    candidate_to_draft_policy: explicit_human_admin_adoption_only
    prohibited:
      - mass_persisting_sql_attention_candidates_as_draft_rows
      - candidate_source_as_replacement_authority
      - source_evidence_as_replacement_authority
      - sql_attention_candidate_auto_merge_to_active
      - sql_attention_candidate_logged_as_manual_clone_replacement

  layout_patch_draft_vs_manifest_replacement_boundary:
    description: >-
      layoutPatchDraft / layout_patch:apply は UI Builder の layout draft / layout persistence 境界であり、
      production manifest replacement merge ではない。helper reference artifact は両者を別の lifecycle として表示する。
    layout_patch_scope:
      - ui_builder_layout_draft
      - layout_persistence
    not_scope:
      - production_manifest_replacement_merge
      - replacement_merge_authority
      - active_topology_mutation_authority
    prohibited:
      - layoutPatchDraft_as_replacement_merge_intent
      - layout_patch_apply_as_manifest_replacement_merge
      - helper_viewer_apply_layout_patch

  mcp_topology_authoring_draft_reference:
    description: >-
      現行 CLI/MCP import-candidate lane に、topology authoring draft を candidate evidence として載せるための
      payload convention を定義する。これは新規MCP tool surfaceではない。
      MCP tool は authority ではなく、External AI / Local LLM の構造化出力を draft/candidate evidence として
      記録する operation surface である。
    existing_mcp_operations:
      - import_structured_output
      - assign_business_object_candidate
      - create_draft_operation
      - create_commit_candidate
      - get_preview_diff
    payload_mapping:
      structured_output_payload:
        purpose: topology authoring draft body
        expected_keys:
          - topologySystemName
          - userFacingTopologyLabel
          - logicalTables
          - columns
          - relationIntents
          - screen_data_shape
          - operationEntityBindings
          - adminActionWiring
          - physicalBindingDraft
          - layoutPatchDraft
          - ciAttentionTargetMetadata
          - authoring_lifecycle
          - entry_mode
          - draft_origin
          - clone_mode
          - source_active_manifest_id
          - source_active_evidence
          - lineage_evidence_only
          - replacement_merge_intent
          - replacement_merge_blockers
          - backend_merge_authority
          - layout_patch_draft_boundary
          - sql_attention_candidate_boundary
      authoring_lifecycle_contract:
        required_disambiguation:
          - create_new_topology_must_use_draft_origin_manual_new_and_clone_mode_none
          - replacement_clone_must_use_draft_origin_manual_clone_replacement_and_clone_mode_replacement
          - clone_as_new_topology_must_use_draft_origin_manual_clone_new_topology_and_clone_mode_new_topology
          - sql_attention_candidate_must_remain_candidate_until_explicit_human_admin_adoption
        authority_boundary:
          - mcp_payload_may_carry_evidence_only
          - mcp_payload_must_not_decide_replacement_merge_target
          - mcp_payload_must_not_apply_or_promote_active_topology
      assigned_business_object_candidate:
        purpose: classify draft target as topology authoring candidate
        example_values:
          - topology_authoring
          - admin_contents_authoring
          - ui_builder_authoring
          - helper_manual_reference
      assignment_target_scope:
        purpose: identify authoring surface or admin step without executing that step
        example_values:
          - admin_contents_step_1
          - admin_contents_step_2
          - admin_contents_step_2_5
          - admin_contents_step_3
          - admin_ui_builder_layout_draft
          - mcp_import_candidate_topology_authoring
      preview_diff:
        required_contents:
          - proposed_business_app_structure
          - proposed_tables_and_columns
          - proposed_relations
          - proposed_screen_items
          - proposed_operation_bindings
          - proposed_action_wiring
          - unresolved_questions
          - approval_required_before_reflection
      unresolved_fields:
        required_policy:
          - must_preserve_missing_topology_system_name
          - must_preserve_ambiguous_table_or_column
          - must_preserve_ambiguous_relation
          - must_preserve_ambiguous_operation_binding
          - must_preserve_secret_endpoint_credential_or_raw_sql_request_as_denied_or_question
          - must_not_force_unresolved_fields_into_confirmed_values
      evidence_refs:
        purpose: preserve source transcript, user request, external AI output, and helper reference IDs
    prohibited:
      - creating_new_mcp_tool_surface_in_this_ssot
      - treating_external_ai_structured_output_as_ssot
      - treating_helper_artifact_as_runtime_authority
      - admin_submit_via_mcp_without_distinct_ai_mcp_origin
      - apply_or_promote_via_mcp_helper_reference
      - approval_execution_by_ai_mcp_cli
      - ai_mcp_draft_origin_logged_as_human_manual_admin_draft
      - storing_secret_endpoint_credential_or_raw_sql_in_payload
      - treating_clone_as_status_enum
      - treating_lineage_evidence_as_replacement_authority
      - treating_layoutPatchDraft_as_manifest_replacement_merge
      - treating_sql_attention_candidate_as_draft_row_or_merge_authority

  admin_helper_projection:
    description: >-
      admin helper projection は helper reference artifact を人間向けに検索・選択・閲覧する viewer である。
      admin authoring action を代行せず、runtime/admin authority を持たない。
    canonical_entry_surface: admin_common_header
    ui_flow:
      - common_header_helper_button
      - helper_drawer_open
      - search_box
      - category_or_surface_selector
      - tree_viewer
      - selected_helper_summary
      - detail_helper_modal_mount
    viewer_inputs:
      - helper_reference_artifact
      - current_admin_surface
      - selected_category
      - search_keyword
    allowed_behaviors:
      - filter_helper_items
      - render_user_facing_terms
      - render_internal_terms_for_admin_or_integrator_when_explicitly_needed
      - render_related_ssot_links
      - render_mcp_draft_payload_hints
      - render_approval_boundary_warning
      - render_unresolved_fields_examples
      - render_origin_badge
      - render_review_state
      - render_preview_diff_summary
      - render_source_evidence_summary
      - render_clone_lifecycle_badge
      - render_replacement_vs_lineage_only_badge
      - render_backend_merge_authority_notice
      - render_stale_source_and_active_conflict_blockers
      - render_sql_attention_candidate_boundary_notice
      - render_layout_patch_not_replacement_merge_notice
    prohibited_behaviors:
      - admin_step_submit
      - layout_patch_apply
      - manifest_promote
      - approval_action
      - active_topology_reflection
      - mcp_operation_invocation
      - candidate_origin_loss
      - merge_target_decision
      - active_mutation_authority
      - replacement_merge_approval_or_apply
    projection_only_invariant:
      - helper_component_must_not_own_authoring_convergence
      - helper_component_must_not_bypass_admin_runtime
      - helper_component_must_not_bypass_mcp_import_candidate_audit
      - helper_component_must_not_treat_dismissed_ci_attention_as_unlock
      - helper_component_must_not_convert_source_evidence_to_replacement_authority
      - helper_component_must_not_convert_sql_attention_candidate_to_draft_row

  provenance_boundary:
    description: >-
      AI / MCP / External AI / Local LLM 由来の candidate evidence と、
      人間が admin 画面で手作業作成した draft を監査上混同しないための境界。
      helper artifact / admin helper projection / MCP draft guidance は origin evidence を保持し、
      candidate を active topology や human manual admin draft として扱わない。
    origin_kinds:
      human_admin_manual:
        description: 人間が admin UI 上で明示的に作成・編集した draft。
        admin_draft_origin_mapping:
          - manual_new
          - manual_clone_replacement
          - manual_clone_new_topology
        required_evidence:
          - actor_user_ref
          - admin_surface
          - submitted_step_or_view_context
      mcp_import_candidate:
        description: MCP import-candidate lane から保存された candidate / draft evidence。
        required_evidence:
          - source_transcript_ref
          - root_utterance
          - confidence
          - unresolved_fields
          - evidence_refs
          - client_or_tool_origin
      external_ai_structured_output:
        description: External AI が生成した構造化出力を source とする candidate evidence。
        required_evidence:
          - source_transcript_ref
          - structured_output_payload
          - confidence
          - unresolved_fields
          - evidence_refs
          - client_or_tool_origin
      local_llm_structured_output:
        description: Local LLM / External instance が生成した構造化出力を source とする candidate evidence。
        required_evidence:
          - source_transcript_ref
          - structured_output_payload
          - confidence
          - unresolved_fields
          - evidence_refs
          - client_or_tool_origin
    display_policy:
      - admin_helper_projection_must_show_origin_badge
      - admin_helper_projection_must_show_review_state
      - admin_helper_projection_must_show_unresolved_fields_when_present
      - admin_helper_projection_must_show_preview_diff_summary_when_present
      - admin_helper_projection_must_show_source_evidence_summary_when_available
      - admin_helper_projection_must_show_draft_origin_and_clone_mode_when_available
      - admin_helper_projection_must_show_lineage_only_vs_replacement_boundary
    transition_policy:
      candidate_to_admin_draft:
        requires:
          - explicit_human_review
          - preview_diff_visible
          - unresolved_fields_resolved_or_explicitly_accepted
          - origin_evidence_preserved
        draft_origin_after_explicit_adoption_only: sql_attention_candidate
        must_not_be_logged_as:
          - manual_clone_replacement
          - manual_clone_new_topology
      candidate_to_active_topology:
        policy: >-
          helper/manual は active topology reflection authority を持たない。
          active topology reflection は canonical runtime/admin authority のみが扱う。
      replacement_clone_merge:
        policy: >-
          source evidence / lineage evidence / origin evidence are not authority. Replacement merge requires
          backend AdminRuntime / ManifestRepository transaction checks described in admin-console-workflow SSOT.
    prohibited:
      - losing_candidate_origin
      - showing_ai_mcp_candidate_as_human_manual_admin_draft
      - reflecting_candidate_without_explicit_human_review
      - hiding_unresolved_fields_before_review
      - treating_helper_artifact_as_runtime_authority
      - treating_source_evidence_as_replacement_authority
      - treating_lineage_evidence_as_replacement_authority
      - treating_sql_attention_candidate_as_replacement_authority

  user_facing_message_policy:
    description: >-
      ユーザーに向けてどのような表現・約束をするかの方針。
      実際の文言ライティングは各マニュアル/ヘルプ実装時に行う。
      ここでは「何を伝えるか」の方針を定義する。
    core_messages:
      what_topolactor_can_do:
        - simple_business_app_creation_without_code
        - form_list_pdf_csv_as_basic_surface
        - monthly_processing_automation_extension
        - analysis_and_aggregation_extension
        - external_output_extension
        - desktop_ai_assisted_data_search_and_aggregation
        - ai_assisted_authoring_draft_creation
      what_ai_cli_mcp_can_do:
        - search_business_data_within_permitted_scope
        - aggregate_and_summarize
        - analyze_and_find_patterns
        - export_csv_pdf_zip
        - read_monthly_context
        - validate_before_export
        - create_candidate_or_draft_evidence_for_author_review
        - provide_topology_authoring_draft_hints_without_authority
      what_ai_cli_mcp_cannot_do:
        - send_email_without_human_approval
        - confirm_payment_without_human_approval
        - delete_records
        - execute_final_register_without_human_approval
        - operate_db_directly
        - bypass_permission_scope
        - apply_or_promote_topology_without_runtime_admin_authority
        - convert_ai_candidate_to_human_manual_draft_without_origin_evidence
        - decide_replacement_merge_from_source_or_lineage_evidence
        - turn_sql_attention_candidate_into_draft_or_active_without_human_adoption
        - treat_layout_patch_apply_as_business_content_replacement
      admin_clone_lifecycle_messages:
        - new_creation_clone_for_replacement_and_clone_for_separate_new_app_are_distinct_start_modes
        - source_active_information_is_reference_evidence_not_replacement_permission
        - replacement_reflection_is_checked_by_backend_after_validation_diff_and_stale_source_checks
        - clone_as_new_keeps_lineage_only_and_must_use_a_new_identity_before_registration
        - sql_attention_candidates_are_suggestions_until_admin_adopts_them
        - layout_changes_are_screen_layout_drafts_not_production_content_replacement_merges
    language_policy:
      principle: use_plain_business_language_not_internal_system_terms
      avoid:
        - topology
        - manifest
        - runtime_orchestration
        - ssot
        - attractor
        - operationEntityBindings
        - relationIntents
        - screen_data_shape
        - CI Attention
      use_instead:
        topology: 業務アプリの構造
        manifest: 業務コンテンツ設定
        seed: 初期設定データ
        runtime: 処理の実行
        screen_data_shape: 画面に出す項目の形
        relationIntents: データ同士のつながり候補
        operationEntityBindings: 操作ごとの対象項目
        adminActionWiring: 操作ボタンと処理のつながり
        layout_patch: 画面配置の下書き
        export_job: 搬出処理
        cli_reader_port: AI/CLIへのデータ読み取り窓口
        CI Attention: 反映前の確認結果・修正案
        blocking_fragment: 反映前に直す必要がある問題
        apply_or_promote: 反映
        entry_mode: 作り始め方
        draft_origin: 下書きの由来
        clone_mode: 複製の目的
        source_active_manifest_id: 複製元の正本ID
        source_active_evidence: 複製元の確認情報
        replacement_merge: 既存の業務コンテンツ設定への反映
        stale_source_blocker: 複製元が更新されているため反映前に確認が必要な状態
        active_identity_conflict: 反映先の業務コンテンツ設定が一致しない状態
        clone_active_as_replacement_draft: 既存設定を置き換えるための下書き作成
