runtime_orchestration_ssot:
  name: topolactor_runtime_orchestration_ssot
  version: 0.1.0
  status: ssot_design_document

  purpose:
    - hardcoded_runtime_wiring_boundary
    - manifest_db_variable_control_surface
    - runtime_timeline_scheduler
    - manifest_dispatcher
    - frontend_api_trigger_and_sse_projection
    - backend_topology_transform_and_attractor

  verification_reference:
    scope_statement: This SSOT defines runtime flow, ownership, and boundary invariants.
    pipeline_continuity_reference:
      source: docs/design/pipeline-continuity-ssot.yaml
      owns:
        - pipeline_and_lane_verification
        - required_identity_contracts
        - completion_condition_contracts
        - pipeline_body_test_contracts
        - csharp_dotnet_application_side_ci
    ci_contract_reference:
      source: docs/design/ci-contract-ssot.yaml
      owns:
        - orchestration_vocabulary_audit_contract
        - pipeline_lane_contract_loader_and_audit
        - minimal_gate_vs_dotnet_semantic_assertion_responsibility_split
    system_ci_admin_runtime_callable_surface_reference:
      source: docs/design/system-ci-admin-runtime-callable-surface.yaml
      owns:
        - AdminRuntime_ExecuteDataAsync_to_system_ci_diagnostic_interface_route_contract
        - admin_runtime_diagnostic_read_surface_boundary
        - SystemOperationCiRuntime_is_the_existing_diagnostic_implementation_source_for_the_callable_surface
      note:
        - this_reference_declares_route_design_only
        - implementation_wiring_is_follow_up_and_not_claimed_here
    orchestration_change_rule: Runtime orchestration changes that affect a lane must update or validate the corresponding pipeline-continuity lane contract.
    non_duplication_rule: Do not duplicate detailed lane test conditions in this SSOT; keep fine-grained verification in pipeline-continuity SSOT.

  naming:
    system: runtime_orchestration_os
    scheduler: runtime_timeline_scheduler
    scheduler_alias: runtime_queue_scheduler
    dispatcher: manifest_dispatcher
    dispatcher_legacy_alias: dispatchar
    frontend_api_lane: client_command_lane
    frontend_sse_lane: projection_event_lane
    frontend_projection_runtime: projection_runtime
    frontend_constructor: projection_constructor
    backend_runtime: topology_transform_runtime
    backend_attractor: registry_attractor
    topology_payload: topology_payload
    topology_function_interface: topology_function_interface
    topology_function_binder: topology_function_binder

  boundaries:
    hardcoded:
      - wiring_routes
      - abstract_function_shapes
      - runtime_skeleton
      - scheduler_skeleton
      - dispatcher_skeleton
      - endpoint_shape
    data_defined:
      - manifest_db_records
      - role_definition
      - route_projection_definition
      - ui_projection_definition
      - dispatcher_mapping
      - runtime_mapping
      - topology_function_binding_mapping
      - projection_constructor_mapping
      - function_parameters
      - registry_attractor_policy
    prohibited:
      - runtime_policy_hidden_in_constants
      - frontend_sql_attention_judgment
      - scheduler_as_data_polling_owner
      - dispatcher_as_execution_order_owner
      - direct_vector_authoring_from_client
      - silent_fallback_for_broken_topology_refs
      - backend_entity_constructor_factory
      - treating_test_runner_or_shell_ci_as_admin_runtime_diagnostic_lane

  endpoints:
    frontend:
      count: 1
      role: application_projection_entry
    backend:
      count: 1
      role: runtime_command_entry
      request_subject: topology_payload_or_manifest_operation

  frontend_routes:
    public:
      - /
      - /auth
    admin:
      - /admin
      - /admin/manifests
      - /admin/contents
      - /admin/ui-builder

  trigger_contract:
    kind_enum:
      - cron
      - hook
      - client
    kinds:
      cron:
        source: schedule
        examples:
          - retention_cleanup
          - registry_attractor_rebuild
          - delayed_runtime_execution
      hook:
        source: event
        examples:
          - db_notify_listen
          - external_webhook
          - internal_runtime_event
          - topology_changed
      client:
        source: ui_operation
        examples:
          - button_action
          - form_submit
          - route_action
          - admin_operation
    invariants:
      - trigger_kind_is_not_runtime_destination
      - trigger_enters_scheduler_before_runtime
      - allowed_trigger_kinds_are_cron_hook_client

  scheduler_contract:
    name: runtime_timeline_scheduler
    alias: runtime_queue_scheduler
    role: runtime_time_axis_queue
    input:
      - cron_trigger
      - hook_trigger
      - client_trigger
    output:
      - scheduler_aligned_runtime_event
    allowed_driver_loops:
      - cron_trigger_time_driver_loop
      - delayed_runtime_time_driver_loop
      - background_service_as_trigger_driver
    owns:
      - trigger_alignment
      - runtime_queue
      - runtime_phase
      - runtime_context
      - runtime_state_window
      - causal_order
      - execution_boundary
      - collision_control
    not_owns:
      - target_runtime_selection_policy
      - role_semantics
      - topology_meaning_judgment
      - polling_primary_behavior
    frontend_scope:
      role: ui_time_axis_controller
      manages:
        - client_command_order
        - sse_projection_order
        - projection_batch_boundary
        - optimistic_update_boundary
        - rollback_boundary
    backend_scope:
      role: topology_time_axis_controller
      manages:
        - topology_payload_processing_order
        - vector_conversion_order
        - topology_json_linking_order
        - registry_attractor_update_boundary
        - response_boundary
        - db_notify_boundary

  dispatcher_contract:
    name: manifest_dispatcher
    input:
      - scheduler_aligned_runtime_event
      - manifest_mapping
    output:
      - runtime_destination
      - manifest_projection_response
    manifest_query_output:
      input:
        - manifest_id
      output:
        - manifest_projection_response
    axes:
      - trigger_kind
      - role
      - target
      - layer
      - action
      - manifest_id
    manifest_authority:
      - role_definition
      - dispatcher_mapping
      - runtime_mapping
      - ui_projection_mapping
      - topology_function_binding_mapping
      - projection_constructor_mapping
    manifest_resolution:
      api:
        key: [role, target, layer, action]
        strategy: resolve_active_manifest_by_axes
        role_source: jwt_token_claim
      sse:
        key: manifest_id
        source: db_notify_payload
    prohibited:
      - role_behavior_hardcoded_in_dispatcher
      - dispatcher_silent_fallback
      - dispatcher_bypassing_scheduler_alignment

  runtime_contract:
    scope: shared_runtime_taxonomy
    not_scope: backend_dispatch_destination_only
    input:
      - runtime_destination
      - runtime_event
    output:
      - runtime_effect
    kinds:
      frontend:
        projection_runtime:
          output: ui_projection
      backend:
        topology_transform_runtime:
          output: topology_output_lanes
        registry_attractor_runtime:
          output: sql_attention_observation
    backend_dispatchable_kinds:
      - topology_transform_runtime
      - registry_attractor_runtime
      - admin_runtime
    backend_to_frontend_bridge:
      lanes:
        - response
        - db_notify
        - sse_projection_event
    invariants:
      - runtime_executes_after_scheduler_alignment
      - backend_runtime_destination_is_resolved_by_manifest_dispatcher
      - runtime_policy_values_are_data_defined
      - hubs.relation_route_is_fixed_business_route_between_hubs
      - topology.package_route_is_fixed_state_transition_within_same_topology
      - runtime_route_jump_address_shape_is_pastAddress_currentAddress_plannedAddress
      - pastAddress_missing_is_0
      - currentAddress_missing_is_0
      - plannedAddress_missing_is_0
      - sql_attention_or_recommendation_must_not_overwrite_route_state_automatically
    route_missing_and_user_action_jump_contract:
      route_missing:
        behavior: explicit_runtime_jump_event_not_silent_fallback
        address_shape:
          - pastAddress
          - currentAddress
          - plannedAddress
        defaults:
          pastAddress_missing: 0
          currentAddress_missing: 0
          plannedAddress: 0
      user_action_adoption:
        behavior: explicit_runtime_jump_event
        address_shape:
          - pastAddress
          - currentAddress
          - plannedAddress
        defaults:
          pastAddress_missing: 0
          currentAddress_missing: 0
          plannedAddress_missing: 0

  frontend_contract:
    phase: projection
    roles:
      - projection_surface
      - client_trigger_surface
    manifest_access:
      direct_db_access: false
      path:
        - api_client
        - backend_single_endpoint
        - manifest_dispatcher
        - manifest_projection_response
      output:
        - projection_definition
        - projection_constructor_mapping
    lanes:
      client_command_lane:
        path:
          - ui_action
          - client_trigger
          - frontend_scheduler
          - api_client
          - backend_endpoint
      projection_event_lane:
        path:
          - sse_receiver
          - frontend_scheduler
          - sse_dispatcher
          - projection_runtime
          - ui_projection
    projection_constructor:
      input:
        - json_key_value
        - projection_definition
      output:
        - form_inputs
        - component_projection
        - ui_projection
    abstract_functions:
      source: hardcoded_shapes
      input:
        - projection_definition
        - json_key_value
      output: ui_projection_args
    owns:
      - route
      - api_client
      - sse_receiver
      - sse_dispatcher
      - frontend_scheduler
      - projection_runtime
      - projection_constructor
      - abstract_functions
      - components
      - component_wrappers
    not_owns:
      - topology_vector_conversion
      - topology_json_linking
      - registry_attractor_update
      - sql_attention_judgment

  backend_contract:
    phase: topology_transform
    roles:
      - abstract_runtime_surface
      - topology_transform_surface
      - registry_attractor_surface
    entry:
      program: Program.cs
      client: single_endpoint
      cron: backend_scheduler
      hook:
        - db_listen
        - webhook_endpoint_if_applicable
    flows:
      dispatch_note: >
        manifest_dispatcher resolves runtime_destination from the manifest topology entry and selects
        the registered dispatchable_runtime handler. topology_transform_runtime is one dispatchable kind;
        see runtime_contract.backend_dispatchable_kinds for the full list.
      client:
        path:
          - endpoint
          - backend_scheduler
          - manifest_dispatcher
          - dispatchable_runtime
          - topology_output_lanes
      cron:
        path:
          - cron_trigger
          - backend_scheduler
          - manifest_dispatcher
          - dispatchable_runtime
          - topology_output_lanes
      hook:
        path:
          - hook_event
          - backend_scheduler
          - manifest_dispatcher
          - dispatchable_runtime
          - topology_output_lanes
    topology_transform_runtime:
      input:
        - topology_payload
      processing:
        - vector_projection_conversion
        - topology_json_linking
        - topology_data_organization
        - topology_function_selection
        - topology_function_interface_binding
    topology_function_binder:
      input:
        - topology_data_function_name
        - where_condition
        - jsonb_array
      output:
        - topology_function_interface_args
      prohibited:
        - entity_constructor
        - csharp_factory
        - domain_invariant_constructor
    output_lanes:
      response_emission:
        output: response
      db_notify_emission:
        output: db_notify
      registry_attractor_update:
        output: registry_attractor
    owns:
      - scheduler
      - dispatcher
      - runtime
      - endpoint
      - dto
      - entity
      - topology_function_interface
      - topology_function_binder
      - db_notify_listen
      - topology_payload_handler
      - vector_converter
      - topology_json_linker
      - registry_attractor

  manifest_contract:
    storage: db
    owns:
      - role_definition
      - route_definition
      - ui_projection_definition
      - dispatcher_mapping
      - runtime_mapping
      - topology_function_binding_mapping
      - projection_constructor_mapping
      - api_action_definition
      - sse_projection_definition
    invariants:
      - manifest_is_not_frontend_local_config
      - manifest_is_not_compile_time_constant_surface
      - manifest_drives_projection_and_dispatcher_mapping

  abstract_function_contract:
    source: hardcoded_shapes
    phases:
      frontend:
        input:
          - projection_definition
          - json_key_value
        output:
          - ui_projection_args
          - api_trigger_args
      backend:
        input:
          - topology_payload
          - topology_function_interface_args
        output:
          - topology_output_lanes
    prohibited:
      - runtime_policy_hidden_in_abstract_function
      - abstract_function_direct_db_authoring
      - frontend_topology_meaning_judgment

  function_binding_and_constructor_contract:
    dto:
      role: endpoint_contract_only
    entity:
      role: concrete_or_system_data_surface
    topology_function_interface:
      phase: backend
      role: function_parameter_surface
    topology_function_binder:
      phase: backend
      input:
        - function_name
        - where_condition
        - jsonb_array
      output:
        - interface_args
    projection_constructor:
      phase: frontend
      input:
        - json_key_value
        - projection_definition
      output:
        - ui_structure
    prohibited:
      - dto_as_architecture_subject
      - primitive_crud_as_architecture_subject
      - direct_record_vector_authoring
      - backend_constructor_ownership
      - one_by_one_manual_input_construction_as_runtime_policy

  registry_attractor_contract:
    role: sql_attention_observation_surface
    input_sources:
      - registry_id_references
      - relation_bindings
      - topology_json_links
      - promoted_columns
      - logs_and_diffs
      - aggregation_observations
    output:
      - continuity_evidence
      - attention_weight_observation
      - projection_or_ci_input
    invariants:
      - registry_tables_remain_semantic_basis
      - aggregates_are_attention_weights_not_meaning_source
      - vector_caches_are_rebuildable_projection_not_sot
      - sql_attention_is_not_transformer_qk_reimplementation

  notify_listen_contract:
    db_notify:
      output_lane: backend
      payload:
        - table_id
        - table_registry_id
        - manifest_id
    db_listen:
      trigger_kind: hook
      backend:
        holder: background_service
        feeds: backend_scheduler_queue_as_hook_trigger
      frontend:
        holder: sse_receiver
        feeds: frontend_scheduler_queue_as_hook_trigger
    symmetry:
      description: frontend_and_backend_scheduler_are_isomorphic_queue_structures
      pattern: external_event_listener_feeds_hook_trigger_into_scheduler_queue
    invariants:
      - notify_payload_preserves_runtime_identity
      - listen_event_enters_scheduler_before_projection_runtime
      - db_notify_dispatch_requires_manifest_id_resolution_and_db_notify_projection_mapping
      - client_or_request_trigger_cannot_directly_enter_db_notify_projection_runtime

  minimal_event_shape:
    fields:
      - trigger_kind
      - role
      - target
      - layer
      - action
      - payload
    identity_fields:
      - trigger_kind
      - role
      - target
      - layer
      - action
    payload_examples:
      - manifest_id
      - runtime_id
      - trace_id

  test_runtime_fixture_policy:
    summary: >
      Production runtime path must not contain temporary test-only handler substitutes.
      Pipeline boundary verification is performed by test-only stub handlers (test fixtures)
      injected at ManifestDispatcher construction time in tests. Test stubs prove selection
      boundary, not production behavior. Production handler implementations must not carry
      placeholder fallback handlers — move them to test fixtures or remove them.
    rules:
      - production_runtime_path_must_not_contain_temporary_test_only_handler_substitutes
      - pipeline_verification_stubs_are_test_fixture_only
      - runtime_destination_selection_boundary_is_proven_by_test_fixture_sentinel
      - test_stub_is_not_a_substitute_for_production_handler_behavior
      - placeholder_or_fallback_in_production_handler_must_be_removed_not_preserved
    temporary_handler_lifecycle:
      summary: >
        Creating temporary test handlers during development is allowed.
        The prohibition is against leaving them permanently on the production runtime path
        as fake-success handlers or silent fallbacks. Once a production handler is ready,
        the temporary handler must be removed from production DI. If the handler can be
        reused as a test fixture to prove pipeline or runtime_destination selection
        boundary, move it to the test project rather than deleting it outright. Recycled
        test fixtures must be limited to boundary proof; they are not a substitute for
        production handler behavior.
      rules:
        - temporary_test_handler_creation_during_development_is_allowed
        - temporary_handler_must_not_remain_on_production_runtime_path_after_production_handler_is_ready
        - temporary_handler_reused_as_test_fixture_is_limited_to_boundary_proof_not_production_substitute
        - prefer_reusing_temporary_handler_as_test_fixture_when_boundary_proof_is_useful
    handler_registry:
      topology_transform_runtime: RuntimeExecutor
      admin_runtime: AdminRuntimeDispatchAdapter
      registry_attractor_runtime: not_yet_implemented
    test_stub_scope:
      allowed:
        - FakeDispatchableRuntime injected in test handler dictionary
        - test-only IDispatchableRuntime implementations in test project
        - temporary handler moved into test fixtures as boundary-proof stub
      prohibited:
        - FakeDispatchableRuntime in Program.cs or production DI
        - temporary handler registered in production handler dictionary
        - test-only destinations added to backend_dispatchable_kinds
        - recycled stub used as production behavior substitute


  route_attention_contract:
    definitions:
      route: business_mandatory_fixed_path
      attention: recommendation_and_neighborhood_exploration
    projection_tabs:
      canonical_route_tab:
        owns:
          - fixed_route
          - current_hub_address
          - current_topology_address
          - route_missing_fallback_jump
      attention_recommendation_tab:
        owns:
          - sql_attention_recommendation
          - topology_package_recommendation_candidates
          - nearby_relation_candidates
        must_not:
          - overwrite_current_address_automatically
          - replace_fixed_route
          - mutate_route_state_without_explicit_user_action
    invariants:
      - attention_score_must_not_override_fixed_route
      - recommendation_must_not_auto_transition_main_route
      - runtime_route_resolver_owns_screen_transition_and_next_task_decision
      - frontend_is_projection_surface_only
      - spa_is_runtime_authoritative_projection
      - frontend_if_branching_must_not_decide_business_route
    schema_surfaces:
      hubs_relation_route:
        field: hubs.relation_route
        role: fixed_business_route_between_hubs
      topology_package_route:
        field: topology.package_route
        role: fixed_state_transition_within_same_topology
    resolver_priority:
      - fixed_route
      - topology_enum_or_package_recommend_candidate_only
      - sql_attention_relation_recommend_candidate_only
      - route_missing_fallback_jump

  runtime_jump_event_contract:
    user:
      - currentHubAddress
      - currentTopologyAddress
    jump_event:
      fields:
        - scope
        - from
        - to
        - reason
      scope_enum:
        - hub
        - topology
      reason_enum:
        - fixed_route
        - route_missing
        - user_action
    attention_candidate_adoption_behavior:
      policy: runtime_accepts_jump_only_on_explicit_user_selection
      reason: user_action
    route_missing_behavior:
      policy: runtime_emits_jump_event_instead_of_error
      hub_jump:
        scope: hub
        from: currentHubAddress
        to: 0
        reason: route_missing
      topology_jump:
        scope: topology
        from: currentTopologyAddress
        to: 0
        reason: route_missing

  canonical_flow_summary:
    frontend_client_command:
      - ui_action
      - client_trigger
      - frontend_scheduler
      - api_client
      - backend_endpoint
    frontend_sse_projection:
      - sse_receiver
      - frontend_scheduler
      - sse_dispatcher
      - projection_runtime
      - ui_projection
    backend_topology_runtime:
      - cron_or_hook_or_client
      - backend_scheduler
      - manifest_dispatcher
      - topology_transform_runtime
      - topology_function_binder
      - response_or_db_notify_or_registry_attractor
