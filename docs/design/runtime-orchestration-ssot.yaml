    backend_topology_runtime:
      - cron_or_hook_or_client
      - backend_scheduler
      - manifest_dispatcher
      - topology_transform_runtime
      - topology_function_binder
      - response_or_db_notify_or_registry_attractor

  data_driven_projection_completion_gate:
    note: >-
      topolactor 全体の projection / runtime / dispatch / backend mutation に対する completion gate。
      external_integration_completion_gate (docs/design/external-port-substrate-ssot.yaml) の
      super-gate として機能し、projection / admin / runtime / pipeline 実装全体の
      監査・実装前チェック・点検の判定軸とする。
      「UIがある」「APIを叩ける」「EndpointResponseDtoを返す」「backendに専用処理を追加した」
      「手書きUIを追加した」だけでは pass にならない。各軸の意味定義を厳密に維持すること。
    required:
      ui_db_projection:
        rule: >-
          UI は DB / seed / topology manifest / projection repository 由来で投影されること。
          test-local 手書き emission を DB projection 済みとして扱わない。
        pass_condition: >-
          DB seed / topology_manifest / physical_table_manifest_binding / projection repository 由来で
          UI emission が生成され、frontend が projection surface として消費すること。
        fail_if: >-
          test-local 手書き emission / hardcoded component list / frontend-only mock data を
          DB projection 接続済みとして扱う。
      dispatch_resolution:
        rule: >-
          通信は dispatch 解決を通ること。
          direct API / direct backend handler / dedicated frontend wrapper による迂回を pass 扱いしない。
        pass_condition: >-
          client_trigger → frontend_scheduler → api_client → backend_endpoint → backend_scheduler →
          manifest_dispatcher (axes: role / target / layer / action) → dispatchable_runtime の
          通貫が確認できること。
        fail_if: >-
          ManifestDispatcher を迂回する dedicated route / island / frontend API wrapper /
          direct backend handler 呼び出しで通信を解決している。
      response_or_sse_queue_projection:
        rule: >-
          response / SSE は queue / projection response lane に乗ること。
          inline response を queue / SSE / projection response と扱わない。
        pass_condition: >-
          dispatch response が既存 queue / SSE lane に積まれ、
          frontend が projection_event_lane / client_command_lane response として受け取ること。
        fail_if: >-
          capture_response を MarkOnly として queue 扱いする。
          inline EndpointResponseDto を SSE / projection response 扱いする。
      abstract_function_or_db_driven_operation_boundary:
        rule: >-
          backend mutation は execute_abstract_function / DB-driven operation boundary /
          reusable substrate を使うこと。execute_abstract_function は backend-wide substrate
          であり、runtime boundary / dispatcher lane / manifest authority を backend が検証する。
          既存抽象で表現できる処理を専用 concrete implementation として追加しない。
        pass_condition: >-
          mutation が external_port_runtime lane 上の execute_abstract_function manifest、
          topology_function_binder / call_postgres_function primitive / 既存 reusable substrate を通ること。
          table / column / join / output authority は abstract function manifest、physical table binding、
          または seed authority 由来であり、frontend payload / operation payload / seed payload の raw SQL は authority にならない。
        fail_if: >-
          既存 abstract function / DB-driven operation boundary で表現できる処理に対して、
          bundle 固有 / operation 固有の concrete implementation を backend に追加する。
          execute_abstract_function 用 dedicated route、frontend wrapper、frontend SQL judgment、
          recommendation judgment、payload-derived table authority、silent fallback を追加する。
        fail_close_invariant:
          statuses:
            - missing_authority
            - invalid_authority
            - missing_input
            - invalid_input_binding
            - invalid_projection
            - secret_projection_denied
            - unsupported_primitive
          projection_deny:
            - credential
            - signed_url
            - bucket
            - endpoint
            - storage_path
            - raw_storage_ref
            - plaintext_payload
          frontend_boundary: request_render_candidate_preview_only_not_authority
      seed_or_data_defined_surface:
        rule: >-
          UI schema / form-table projection / action buttons / action wiring /
          dispatch payload mapping / admin surface registration / entity operation binding /
          projection constructor mapping / function parameters / runtime mapping は
          seed / data-defined を優先すること。
        pass_condition: >-
          manifest DB record / seed SQL / topology manifest / DB-driven mapping として表現されており、
          frontend は projection surface として消費していること。
        fail_if: >-
          seed / data-defined surface で表現すべき UI schema / action / wiring / mapping を
          frontend または backend に hardcode する。
    exceptions:
      rule: >-
        以下の例外は明示承認される。ただし例外名・理由・SSOT根拠・なぜ抽象関数化できないかを
        明示することが必須。例外の後付け正当化（implementation-first shape の ratification）は禁止。
      allowed:
        - SQL_Attention
        - CI_Attention
      exception_declaration_required:
        - exception_name
        - reason
        - ssot_basis
        - why_abstract_function_impossible
      exception_scope:
        SQL_Attention:
          exception_name: SQL_Attention
          reason: >-
            SqlAttentionScheduler is a BackgroundService cron route that triggers
            HubAttractorExplorationRuntime directly. It does not originate from a client
            or frontend request and cannot route through ManifestDispatcher.
          ssot_basis: docs/design/runtime-orchestration-ssot.yaml handler_registry_scope_note
          why_abstract_function_impossible: >-
            Cron-triggered background evidence generation has no client-side dispatch vector
            or manifest resolution axis; it is initiated by the runtime scheduler itself.
          applies_to: SqlAttentionScheduler_BackgroundService_cron_route_only
          not_applies_to: >-
            frontend_originated_sql_attention_projection_requests.
            Those must route through admin_dispatch_pipeline (sql_attention:list_projection).
        CI_Attention:
          exception_name: CI_Attention
          reason: >-
            SystemOperationCiScheduler is a BackgroundService that triggers
            SystemOperationCiRuntime diagnostic checks via two backend-internal
            routes: (1) a cron loop and (2) a signal consumer
            (RunAttractorSignalConsumerAsync) that receives registry_attractor_update
            signals from OutputLaneRouter.RebuildSignalChannel. Neither route
            originates from a client request and neither can route through
            ManifestDispatcher.
          ssot_basis: docs/design/runtime-orchestration-ssot.yaml handler_registry_scope_note
          why_abstract_function_impossible: >-
            Cron-triggered CI diagnostic inspection has no client-side dispatch vector;
            it is initiated by the runtime scheduler itself.
            Signal-consumer-triggered inspection is driven by internal attractor rebuild
            signals, not by a client or frontend request.
          applies_to:
            - SystemOperationCiScheduler_BackgroundService_cron_trigger
            - SystemOperationCiScheduler_BackgroundService_signal_consumer_trigger_via_registry_attractor_update
          not_applies_to: >-
            ci_attention:refresh_fragments and system_ci:inspect which route through
            AdminRuntime dispatch pipeline as canonical admin operations.
    prohibited:
      - test_local_handwritten_UI_emission_treated_as_DB_projection
      - direct_backend_concrete_mutation_bypassing_abstract_function
      - dispatch_bypass_via_dedicated_route_or_island_or_frontend_api_wrapper
      - inline_EndpointResponseDto_treated_as_queue_or_sse_or_projection_response
      - seed_or_data_defined_surface_hardcoded_in_frontend_or_backend
      - exception_without_explicit_declaration
      - implementation_first_shape_ssot_ratification
    super_gate_for:
      - external_integration_completion_gate
      - admin_authoring_completion_gate
    references:
      external_integration_completion_gate: docs/design/external-port-substrate-ssot.yaml
      admin_authoring_completion_gate: docs/design/admin-console-workflow-ssot.yaml

aggregate_trigger_substrate_contract:
  status: design_contract_confirmed_for_future_implementation
  role: public_runtime_substrate
  application_specific_names_policy:
    rule: aggregate trigger substrate contract must use public substrate vocabulary only and must not encode application-specific domain names, use-case names, or bundle-local names as canonical terms.
  authority_boundary:
    event_role: input_evidence_only_not_scope_owner
    scope_owner: processing_function_or_operation_definition
    frontend_role: structured_authoring_projection_only
    backend_runtime_role: validate_execute_and_persist_authority
    repository_role: fixed_template_parameterized_persistence_authority
  aggregate_trigger_definition:
    required_fields:
      - trigger_definition_id
      - trigger_source
      - processing_function_scope
      - execution_scope
      - transaction_boundary
      - aggregate_target_binding
      - conflict_key_fields
      - delta_map
      - threshold_policy
      - materialization_target_binding
      - materialization_payload_map
      - approval_policy
      - evidence_policy
    prohibited_fields:
      - raw_sql
      - raw_case_expression
      - raw_where_clause
      - arbitrary_table_name
  runtime_membership:
    runtime_destination: aggregate_trigger_runtime
    dispatchable_kind: aggregate_trigger_runtime
    registration_surface: runtime_contract.backend_dispatchable_kinds
    execution_route: trigger enters scheduler as cron/hook/client, manifest dispatcher resolves aggregate_trigger_runtime after scheduler alignment, and AggregateTriggerRuntime executes the structured definition.
    not_admin_runtime_action: AdminRuntime authors and validates aggregate trigger definitions but does not own threshold evaluation, aggregate current upsert, or materialization execution.
  trigger_source:
    canonical_trigger_kind:
      allowed_kinds:
        - cron
        - hook
        - client
      source_ref: runtime_orchestration_ssot.trigger_contract.kind_enum
    trigger_source_detail_kind:
      role: source detail after canonical trigger kind is known; not a runtime destination and not scheduler ownership
      mapping:
        client_operation_event:
          canonical_trigger_kind: client
          detail_source: ui_operation_or_admin_operation
        hook_event:
          canonical_trigger_kind: hook
          detail_source: db_notify_external_webhook_or_internal_runtime_event
        scheduled_cron_event:
          canonical_trigger_kind: cron
          detail_source: schedule_aligned_by_runtime_timeline_scheduler
        runtime_function_event:
          canonical_trigger_kind: hook
          detail_source: internal_runtime_event
    prohibited_detail_kinds:
      - scheduler_event
    rule: trigger_source supplies event payload and source metadata only; canonical trigger kind remains cron/hook/client and never owns execution scope, transaction boundary, aggregate target, threshold policy, materialization target, or approval policy.
  processing_function_scope:
    owner: processing_function_or_operation_definition
    required_fields:
      - function_id
      - operation_definition_id
      - accepted_event_schema_ref
      - allowed_source_kinds
      - materialization_policy_ref
    rule: scope is resolved from registered processing function / operation definition, not from event origin.
    function_id_authority_binding:
      registry: topology.abstract_function_manifests
      match_fields:
        function_key: function_id
        runtime_lane: aggregate_trigger_runtime
        authority_scope: operation_definition_id
      fail_close_on:
        - function_key_not_found
        - manifest_inactive
        - runtime_lane_not_aggregate_trigger_runtime
        - authority_scope_not_equal_operation_definition_id
      frontend_role: structured_input_only_backend_is_sole_authority
    operation_definition_id_authority_binding:
      source: admin_contents_step1_topologysystemname
      rule: backend derives operation_definition_id from the manifest topologySystemName at assign_screen_data_shape time and overrides any client-submitted value; frontend input is never authority.
  execution_scope:
    owner: processing_function_or_operation_definition
    allowed_values:
      - single_event
      - aggregate_key_partition
      - operation_instance
      - tenant_or_workspace_partition
    rule: event may select an instance within the declared scope but cannot broaden or redefine it.
  transaction_boundary:
    owner: processing_function_or_operation_definition
    allowed_values:
      - event_append_only
      - event_append_and_aggregate_upsert
      - event_append_aggregate_upsert_and_materialization
    atomicity_rule: aggregate upsert and materialization evidence append are executed in one backend transaction when materialization is attempted.
  aggregate_target_binding:
    allowed_target_sources:
      - step2_logical_entity_definition
      - step2_5_relation_definition
    target_selection_rule: admin Step3 may select only targets already defined in Step2 logical entity definitions or Step2.5 relation definitions.
    prohibited:
      - undefined_entity_or_relation_target
      - arbitrary_table_name
  conflict_key_fields:
    source: selected_aggregate_target_binding_fields
    required: true
    rule: fields form stable aggregate current row identity and duplicate materialization guard identity.
  delta_map:
    role: event_to_aggregate_delta_definition
    allowed_operations:
      - increment_count
      - increment_success_count
      - increment_failure_count
      - set_latest_value
      - set_latest_timestamp
    prohibited:
      - raw_sql_expression
      - raw_case_expression
      - raw_where_clause
  threshold_policy:
    initial_shape:
      minimum_trial_count:
        type: integer
        minimum: 1
      ratio_numerator_field:
        source: aggregate_current_row
      ratio_denominator_field:
        source: aggregate_current_row
      comparison_operator:
        allowed: [">", ">=", "<", "<=", "=", "!="]
      target_ratio:
        type: decimal
        range: "0.0_to_1.0_unless_explicitly_extended_by_ssot"
    evaluation_owner: backend_runtime
    frontend_role: author_structured_policy_only
  materialization_target_binding:
    allowed_target_sources:
      - step2_logical_entity_definition
      - step2_5_relation_definition
    prohibited:
      - undefined_target
      - arbitrary_table_name
  materialization_payload_map:
    status: confirmed_initial_contract
    allowed_sources:
      function_input_event:
        allowed: true
        rule: referenced by declared event schema path only
      aggregate_current_row:
        allowed: true
        rule: referenced by declared aggregate field only
      selected_step2_entity_fields:
        allowed: true
        rule: selected from Step2 logical entity definition already bound to the operation
      selected_step2_5_relation_fields:
        allowed: true
        rule: selected from Step2.5 relation definition already bound to the operation
      constant:
        allowed: true
        rule: typed scalar or typed json literal validated by target field type
      generated_value:
        allowed: true
        allowed_generators:
          - uuid
          - current_timestamp
          - monotonic_sequence_within_scope
      runtime_actor_source_metadata:
        allowed: true
        allowed_fields:
          - actor_id
          - actor_role
          - source_kind
          - source_id
          - correlation_id
    prohibited:
      - raw_sql_expression
      - raw_case_expression
      - raw_where_clause
      - arbitrary_json_path_not_declared_by_schema
  approval_policy:
    allowed_values:
      - auto_materialize_when_threshold_passes
      - require_backend_approval_before_materialization
      - require_human_approval_before_materialization
    owner: processing_function_or_operation_definition
    frontend_role: request_or_display_only_not_final_judgment
  evidence_contracts:
    event_evidence:
      persistence: append_only_idempotent_event_log
      identity: source_kind_source_id_correlation_id_event_fingerprint
    aggregate_current:
      persistence: current_row_by_conflict_key
      mutation_rule: atomic_upsert_only
    materialization_evidence:
      persistence: append_only_materialization_log
      duplicate_guard: materialization_target_binding_plus_conflict_key_fields_plus_payload_fingerprint
  repository_contract:
    required:
      - fixed_sql_template_only
      - parameterized_sql_only
      - idempotent_event_append
      - atomic_aggregate_current_upsert
      - duplicate_materialization_guard
    prohibited:
      - app_side_read_count_update_race
      - raw_sql_from_ui_or_event
