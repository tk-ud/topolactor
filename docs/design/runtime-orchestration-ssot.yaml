          - a_non_active_categorys_lifecycle_triggered_runtimeInteraction_initial_mount_or_route_enter_or_initial_display_does_not_execute_via_emitLifecycle
          - an_undeclared_visibilityBinding_source_fails_close_as_an_explicit_error_node_never_silently_visible_or_hidden
