runtime_orchestration_ssot:
  name: topolactor_runtime_orchestration_ssot
  version: 0.1.0
  status: ssot_design_document

  purpose:
    - hardcoded_runtime_wiring_boundary
    - manifest_db_variable_control_surface
    - runtime_timeline_scheduler
    - manifest_dispatcher
    - frontend_api_trigger_and_sse_projection
    - backend_topology_transform_and_attractor

  verification_reference:
    scope_statement: This SSOT defines runtime flow, ownership, and boundary invariants.
    pipeline_continuity_reference:
      source: docs/design/pipeline-continuity-ssot.yaml
      owns:
        - pipeline_and_lane_verification
        - required_identity_contracts
        - completion_condition_contracts
        - pipeline_body_test_contracts
        - csharp_dotnet_application_side_ci
    ci_contract_reference:
      source: docs/design/ci-contract-ssot.yaml
      owns:
        - orchestration_vocabulary_audit_contract
        - pipeline_lane_contract_loader_and_audit
        - minimal_gate_vs_dotnet_semantic_assertion_responsibility_split
    system_ci_admin_runtime_callable_surface_reference:
      source: docs/design/system-ci-admin-runtime-callable-surface.yaml
      owns:
        - AdminRuntime_ExecuteDataAsync_to_system_ci_diagnostic_interface_route_contract
        - admin_runtime_diagnostic_read_surface_boundary
        - SystemOperationCiRuntime_is_the_existing_diagnostic_implementation_source_for_the_callable_surface
      note:
        - callable_interface_wiring_is_implemented_for_AdminRuntime_ExecuteDataAsync_system_ci_list_targets_and_system_ci_inspect
        - production_dispatch_route_reachability_requires_manifest_and_structure_map_registration_for_admin_system_ci_actions
        - future_scope_is_frontend_diagnostic_panel_surface_not_backend_callable_interface_wiring
    orchestration_change_rule: Runtime orchestration changes that affect a lane must update or validate the corresponding pipeline-continuity lane contract.
    non_duplication_rule: Do not duplicate detailed lane test conditions in this SSOT; keep fine-grained verification in pipeline-continuity SSOT.

  naming:
    system: runtime_orchestration_os
    scheduler: runtime_timeline_scheduler
    scheduler_alias: runtime_queue_scheduler
    dispatcher: manifest_dispatcher
    frontend_api_lane: client_command_lane
    frontend_sse_lane: projection_event_lane
    frontend_projection_runtime: projection_runtime
    frontend_constructor: projection_constructor
    backend_runtime: topology_transform_runtime
    backend_attractor: registry_attractor
    topology_payload: topology_payload
    topology_function_interface: topology_function_interface
    topology_function_binder: topology_function_binder

  boundaries:
    hardcoded:
      - wiring_routes
      - abstract_function_shapes
      - runtime_skeleton
      - scheduler_skeleton
      - dispatcher_skeleton
      - endpoint_shape
    data_defined:
      - manifest_db_records
      - role_definition
      - route_projection_definition
      - ui_projection_definition
      - dispatcher_mapping
      - runtime_mapping
      - topology_function_binding_mapping
      - projection_constructor_mapping
      - function_parameters
      - registry_attractor_policy
    prohibited:
      - runtime_policy_hidden_in_constants
      - frontend_sql_attention_judgment
      - scheduler_as_data_polling_owner
      - dispatcher_as_execution_order_owner
      - direct_vector_authoring_from_client
      - silent_fallback_for_broken_topology_refs
      - backend_entity_constructor_factory
      - treating_test_runner_or_shell_ci_as_admin_runtime_diagnostic_lane

  endpoints:
    frontend:
      count: 1
      role: application_projection_entry
    backend:
      count: 1
      role: runtime_command_entry
      request_subject: topology_payload_or_manifest_operation

  frontend_routes:
    public:
      - /
      - /auth
      - /super_auth
    admin:
      - /admin
      - /admin/manifests
      - /admin/contents
      - /admin/ui-builder
      - /admin/team-dashboard
      - /admin/team-markdown
      - /admin/enums
      - /admin/users
      - /admin/scheduler
    admin_route_retirement_matrix:
      note: >-
        admin-surface-topology-seed-conversion Bundle. Each retiring route is explicitly assigned
        one of retirement_kind's four values below; retirement never happens implicitly, and route
        deletion or route absence is never itself completion proof (see
        docs/design/admin-console-workflow-ssot.yaml admin_hub_relation_navigation_contract for the
        full negative-proof gate). "canonical" entries above stay listed until their own row here
        reaches status=retired.
      retirement_kind:
        url_deletion: the route file and its URL are removed; no path continues to serve it.
        redirect: the URL continues to resolve but issues a redirect to the replacement canonical URL.
        thin_projection_wrapper: the URL and route file remain, but the route body is replaced by a
          thin wrapper that renders the seed-backed ProjectionShell projection instead of the
          former hardcoded island.
        hub_navigation_only: no URL/route change; the route's target manifest becomes reachable via
          an admin-authored hubs.hub_relations outbound navigation entry (authored through the
          existing /admin/manifests surface — see docs/design/admin-console-workflow-ssot.yaml
          admin_hub_relation_navigation_contract.authoring; the relation source is whichever
          manifest an admin selects there, never required to be /admin's own landing page) in
          addition to the route's existing direct URL.
      routes:
        - route: /admin/enums
          retirement_kind: thin_projection_wrapper
          replacement: same_url_seed_backed
          status: done
          precondition: >-
            DONE (admin-enum subBundle closure round): the manifest existence and UX-parity
            blockers both closed. Selected-group-detail field-prefill
            (enum_update_group_name_input's propBindings.value.source=
            "node:enum_table.value.groupName", resolved reactively via
            cascadeNodeValueReferences/applyLiveNodeValueOverride) and a functional enum_search
            filter (a data-defined optional payload.search field on the SAME existing list_groups
            action, no new action/lane) now match the hardcoded island's own UX.
            frontend/routes/admin/enums.tsx replaces the retired AdminEnumsRoster island with a
            same-URL ProjectionShell thin wrapper (a new optional manifestId prop, applied only
            when the URL carries no explicit selection) pinned to ae200. UPDATED (round 36):
            AdminEnumsRoster.tsx is deleted (see docs/design/admin-uibuilder-ui-structure-wiring-
            ssot.yaml lane_storage_boundary's own open-item record for the full retirement-to-
            deletion proof reference).
        - route: /admin/team-dashboard
          retirement_kind: hub_navigation_only
          replacement: same_url_plus_hub_entry
          status: superseded_by_owner_directed_alternate
          precondition: >-
            STALE (pre-team-dashboard-seed-conversion round): "requires a real per-screen
            ui_projection manifest for the team markdown dashboard surface, which does not exist
            yet" is no longer true — team_dashboard.admin.projection (dd010) and
            team_dashboard.normal.projection (dd020) are both real, seeded, live-dispatchable
            ui_projection manifests (see admin-normal-surface-projection-seed-ssot.yaml
            surface_axes.admin.surfaces.team_dashboard / surface_axes.normal.surfaces.dashboard).
            CURRENT: an exhaustive audit (admin-normal-surface-projection-seed-ssot.yaml
            design_blocking.target_surface_manifest_readiness's own team-dashboard closure record)
            found no existing, real, Normal-reachable production topology_manifest besides
            team-dashboard's own two manifests to author a genuine hub_navigation:create relation
            FROM — fabricating a synthetic/demo source manifest solely to close this literal
            retirement_kind was explicitly rejected, the same "no fake hub_relations source"
            discipline the /admin-own-outbound-relation note elsewhere in this Bundle already
            establishes. Presented with this finding, the Owner redirected the underlying intent
            (an end user must always be able to navigate back to the dashboard from anywhere) to a
            route/manifest-agnostic fix instead of literal hub_navigation authoring:
            frontend/islands/ProjectionShell.tsx now renders a fixed data-projection-home-link
            ("ホーム" → /dashboard) in its own nav bar unconditionally on every mount, independent
            of any manifest's own hub_relations/navigationSequence state. This is not a
            hub_navigation_only retirement in the literal sense this matrix defines above (no
            hubs.hub_relations row was authored for dd010/dd020), so status is not "done"; it is
            not "pending" either, since the reachability problem this retirement_kind exists to
            solve is already closed by a different, Owner-approved mechanism — hence
            status=superseded_by_owner_directed_alternate. Left open for a future genuine
            hub_navigation:create authoring round if/when a real Normal-reachable source manifest
            is introduced elsewhere in the system; not a blocking precondition for the rest of
            team-dashboard's own completion state.
        - route: /admin/scheduler
          retirement_kind: hub_navigation_only
          replacement: same_url_plus_hub_entry
          status: done
          precondition: >-
            STALE (pre-scheduler-settings-seed-conversion round): "requires a real per-screen
            ui_projection manifest for scheduler_jobs, which does not exist yet" is no longer true —
            scheduler.settings.projection (manifest 00000000-0000-0000-0000-00000005c100) is now a
            real, seeded, live-dispatchable ui_projection manifest (see admin-normal-surface-
            projection-seed-ssot.yaml surface_axes.admin.surfaces.scheduler). CURRENT (2026-08-17
            scheduler-settings seed-conversion round, scheduler-settings 3分割設計の確定,
            Owner-confirmed 2026-07-22 authority): retirement_kind stays literally
            hub_navigation_only as defined above — NOT thin_projection_wrapper — because the route
            body is not being replaced: frontend/routes/admin/scheduler.tsx keeps mounting the
            existing (scope-reduced, not deleted) frontend/islands/SchedulerJobSettingsPanel.tsx.
            The target manifest's reachability via an admin-authored hubs.hub_relations outbound
            navigation entry (through the existing /admin/manifests surface) is proven live against
            real PostgreSQL — hub_navigation:create real authoring dispatch plus the full resolution
            chain reaching this manifest's own Emission — by backend/tests/Topolactor.Integration.
            Tests/SchedulerSettingsHubRelationUiProjectionLiveDbTests.cs
            DispatchAsync_SchedulerSettingsManifest_HubNavigationCreate_RealAuthoringPath_
            ThenResolutionChainReflectsIt, the same convention admin-enum/credential-management/
            team-dashboard use (no static hubs.hub_relations seed row is ever shipped; live
            connection state is runtime/admin data per admin-console-workflow-ssot.yaml
            connection_state_authority, not a fixed SSOT ledger). Ratified into the canonical
            registry above (route file and dispatcher_mapping already existed but the registry
            entry was absent) independent of this retirement item. Not retired by this change: the
            route itself, its URL, and SchedulerJobSettingsPanel.tsx are all unchanged — only the
            hub-navigation reachability addition this retirement_kind describes is now proven.

  trigger_contract:
    kind_enum:
      - cron
      - hook
      - client
    kinds:
      cron:
        source: schedule
        examples:
          - retention_cleanup
          - registry_attractor_rebuild
          - delayed_runtime_execution
      hook:
        source: event
        examples:
          - db_notify_listen
          - external_webhook
          - internal_runtime_event
          - topology_changed
      client:
        source: ui_operation
        examples:
          - button_action
          - form_submit
          - route_action
          - admin_operation
    invariants:
      - trigger_kind_is_not_runtime_destination
      - trigger_enters_scheduler_before_runtime
      - allowed_trigger_kinds_are_cron_hook_client

  scheduler_contract:
    name: runtime_timeline_scheduler
    alias: runtime_queue_scheduler
    role: runtime_time_axis_queue
    input:
      - cron_trigger
      - hook_trigger
      - client_trigger
    output:
      - scheduler_aligned_runtime_event
    allowed_driver_loops:
      - cron_trigger_time_driver_loop
      - delayed_runtime_time_driver_loop
      - background_service_as_trigger_driver
    owns:
      - trigger_alignment
      - runtime_queue
      - runtime_phase
      - runtime_context
      - runtime_state_window
      - causal_order
      - execution_boundary
      - collision_control
    not_owns:
      - target_runtime_selection_policy
      - role_semantics
      - topology_meaning_judgment
      - polling_primary_behavior
    frontend_scope:
      role: ui_time_axis_controller
      manages:
        - client_command_order
        - sse_projection_order
        - projection_batch_boundary
        - optimistic_update_boundary
        - rollback_boundary
    backend_scope:
      role: topology_time_axis_controller
      manages:
        - topology_payload_processing_order
        - vector_conversion_order
        - topology_json_linking_order
        - registry_attractor_update_boundary
        - response_boundary
        - db_notify_boundary

  dispatcher_contract:
    name: manifest_dispatcher
    input:
      - scheduler_aligned_runtime_event
      - manifest_mapping
    output:
      - runtime_destination
      - manifest_projection_response
    manifest_query_output:
      input:
        - manifest_id
      output:
        - manifest_projection_response
    axes:
      - trigger_kind
      - role
      - target
      - layer
      - action
      - manifest_id
    manifest_authority:
      - role_definition
      - dispatcher_mapping
      - runtime_mapping
      - db_notify_projection_mapping
      - ui_projection_mapping
      - ui_projection
      - topology_function_binding_mapping
      - projection_constructor_mapping
    manifest_resolution:
      api:
        key: [role, target, layer, action]
        strategy: resolve_active_manifest_by_axes
        role_source: jwt_token_claim
      sse:
        key: manifest_id
        source: db_notify_payload
    prohibited:
      - role_behavior_hardcoded_in_dispatcher
      - dispatcher_silent_fallback
      - dispatcher_bypassing_scheduler_alignment

  ui_projection_render_reachability_contract:
    note: >-
      Minimal design addendum (credential-management hub relation / navigation / ui_projection
      bundle) closing a description gap between db-schema.yaml's ui_projection refs-only shape
      (packages.manifest_reference: manifest.topology[ui_projection].packageIds) and this
      dispatcher_contract, which did not previously name ui_projection in manifest_authority.
      Scope is limited to connecting an existing topology manifest's ui_projection /
      hubs.hub_relations to the projection entry that manifest_dispatcher already resolves — it
      does not authorize a new dedicated route/panel or a new runtime_destination.
    disambiguation:
      ui_projection_mapping: auth_login_form_field_mapping_topology_entry_type_unrelated_to_ui_projection
      ui_projection: refs_only_packageIds_layoutId_wiringId_tensorId_topology_entry_type_per_db_schema_yaml_packages_manifest_reference
    ui_projection_resolution:
      owner: manifest_dispatcher
      applies_to: any_resolved_manifest_regardless_of_runtime_destination
      rule: >-
        After manifest resolution (any axes/target_ref/db_notify path) and before returning the
        response, manifest_dispatcher resolves manifest.topology[ui_projection].layoutId (when
        present and Emission.LayoutId is not already set by the structure-map-driven
        topology_transform_runtime pipeline) into Emission.LayoutId / Emission.LayoutNodes /
        Emission.PackageId, reusing the same topology.ui_topology_tensor /
        topology.ui_wiring_registry load and node-validation path as the structure-map pipeline
        (TopologyRepository.LoadLayoutNodesAsync, StructureMapResolver.ValidateLayoutNodes).
      fail_close: >-
        A ui_projection.layoutId that resolves to zero tensor nodes, or fails structural node
        validation, is an explicit Emission.Errors entry (LAYOUT_NODES_NOT_FOUND or the
        structure-map validation error code) — never a silent empty render.
    hub_navigation_resolution:
      owner: manifest_dispatcher
      applies_to: any_resolved_manifest_regardless_of_runtime_destination
      rule: >-
        manifest_dispatcher attaches the manifest-scoped hubs.hub_relations navigation sequence
        (Emission.NavigationSequence, "current hub relation" candidates) and the resolved
        manifest identity (Emission.ManifestId, "current topology phase") for any
        runtime_destination via HubNavigationResolver, not only topology_transform_runtime
        (RuntimeExecutor already performed this for its own path prior to this addendum).
      target_manifest_resolution: >-
        HubNavigationSequenceItemDto.TargetManifestId is resolved only when exactly one active
        hubs.topology_manifests row exists for NavigationSequence[].RelatedHubId — no implicit
        oldest/first-match fallback (mirrors topology.physical_table_manifest_bindings'
        no_implicit_join_nullable_fallback_or_oldest_manifest_fallback invariant in
        db-schema.yaml). Null/absent means the frontend must treat the related hub as not
        directly callable, never guess a target.
    admin_runtime_structural_read_fallback:
      owner: manifest_dispatcher
      trigger: >-
        A manifest with a declared ui_projection entry and runtime_destination=admin_runtime
        receives a screen-read axes combination (layer/action recognized by
        ScreenDataShapeTopologyReader.IsScreenReadAction) that has no matching admin action
        registered in AdminRuntime.ExecuteDataAsync (ADMIN_OPERATION_NOT_FOUND).
      rule: >-
        manifest_dispatcher treats this combination as a structural render-only entry rather
        than a hard dispatch failure — it synthesizes an empty-success Emission so the
        ui_projection resolution above can still reach LayoutNodes. This does not fabricate
        business data: row/data population for this class of manifest is owned by whatever
        separately-tracked authoring surface the manifest's own projection design declares
        (e.g. instance_settings_admin_authoring_ui_pending for
        auth.external.credential_management.projection — see
        docs/projection_design/credential-management-projection-design.md).
      boundary: >-
        Only ADMIN_OPERATION_NOT_FOUND on a screen-read axes combination is eligible for this
        fallback. Any other admin_runtime error (including ADMIN_OPERATION_NOT_FOUND on a
        non-screen-read axes combination) is returned unchanged as a real failure.
    default_screen_read_override:
      added: 2026-08-17
      owner: manifest_dispatcher
      trigger: >-
        The admin_runtime_structural_read_fallback above is about to fire (ADMIN_OPERATION_NOT_FOUND
        on a screen-read axes combination for an admin_runtime manifest with a declared ui_projection
        entry) and the manifest's own topology declares a dispatcher_mapping entry with
        "default_screen_read": true.
      rule: >-
        Instead of synthesizing an empty-Data success Emission, ManifestDispatcher re-dispatches to the
        SAME admin_runtime destination using the declared entry's own (layer, action) in place of the
        request's screen-read axes, and returns THAT dispatch's real result (Data included) as the
        response. The declared (layer, action)'s own capability_requirement (scoped or unscoped/inferred
        — see auth-db-session-credential-ssot.yaml manifest_capability_requirement) is independently
        re-validated against request.Role before the re-dispatch — reaching this fallback via the
        request's OWN screen-read axes never implicitly authorizes the declared action; each must clear
        its own gate. This closes the gap where a manifest's propBindings source real content from
        emission.data.* (e.g. a single-row live viewer) but the manifest declares no screen_data_shape
        entry (screen_data_shape/ScreenDataShapeQueryRuntime is a topology_transform_runtime-only
        mechanism — admin_runtime manifests never reach it) and has no user-interactive trigger (search/
        filter/select) that would otherwise populate it — the initial render would stay permanently
        empty without this override.
      opt_in: >-
        Author-declared per manifest (db/seed_empty.sql), never inferred from action name or manifest
        shape — mirrors identity_selector_read's own idiom
        (admin-uibuilder-ui-structure-wiring-ssot.yaml). A manifest that declares no
        default_screen_read=true entry keeps today's synthesized-empty-Data fallback exactly
        (backward compatible) — e.g. admin.enum.management.projection (ae200) declares none and is
        unaffected; its own initial render stays structural-only, matching its already-accepted
        search/filter-driven UX.
      first_adopter: >-
        team_dashboard.admin.projection (dd010) and team_dashboard.normal.projection (dd020) — both
        declare default_screen_read=true on their team_dashboard:get dispatcher_mapping entry, so
        their md_viewer.projection node's emission.data.bodyMarkdown propBinding resolves to the real
        topology.team_dashboard_note row content on initial mount, not merely after a user-triggered
        dispatch.
      resolution_owner: >-
        backend/repository/ManifestRepository.cs DispatcherMappingAxisAuthority.
        FindDeclaredDefaultScreenRead / backend/runtime/ManifestDispatcher.cs DispatchAsync
    test_proof_contract:
      note: >-
        Minimal design addendum defining what a completion proof for this reachability contract
        must observe, so a future seed/topology-manifest reachability task is audited by
        "does a seed UUID resolve all the way to a scalar Emission field" rather than "does a
        seed/refs-only shape exist". This constrains proof surfaces such as
        backend/tests/Topolactor.Integration.Tests/CredentialManagementHubRelationUiProjectionLiveDbTests.cs
        and their frontend counterpart in frontend/tests/projectionEntry.test.ts. It introduces
        no new runtime_destination, route, or panel authority — see the
        ui_projection_render_reachability_contract note above. The relation_uuid / hub_ids[] /
        NavigationSequence resolution assertion below (test_input_shape / resolution_chain) is
        expressed as a manifest-identity-agnostic shared helper,
        backend/tests/Topolactor.Integration.Tests/HubRelationUiProjectionResolutionChainProof.cs
        (BuildRealDispatcherAsync / AssertNavigationSequenceResolvesHubVector) — not duplicated
        per source manifest. CredentialManagementHubRelationUiProjectionLiveDbTests.cs is its
        current caller for credential-management/manifest 092 (plus one fully synthetic,
        non-092 source manifest exercised in the hub_navigation:create authoring-path test); a
        future target manifest's own live-DB proof (e.g. for enum-dictionary / team-dashboard /
        scheduler-settings, once each has its own ui_projection seed content) reuses the same
        helper rather than re-deriving this resolution-chain assertion against a new manifest
        constant. Content-specific assertions (e.g. credential-management's own LayoutNodes
        shape) remain out of the shared helper's scope and stay in that manifest's own test.
      test_input_shape:
        relation_uuid: hubs.hub_relations.hub_relation_id under proof
        hub_ids: >-
          array of hubs.hub_relations.related_hub_id values reachable from relation_uuid's
          source topology_manifest, ordered by sequence_position (the manifest-scoped relation
          vector / route vector — see db-schema.yaml hubs_hub_relations_sequence, not a global
          hub-to-hub graph)
        package_ids: >-
          array of package identifiers a proof expects Emission.PackageId to be a member of,
          sourced from manifest.topology[ui_projection].packageIds
      resolution_chain:
        - hub_relation(relation_uuid) resolves its source topology_manifest via topology_manifest_id
        - the source topology_manifest resolves hub_ids[] through its active hubs.hub_relations
            rows ordered by sequence_position
        - the source topology_manifest resolves package_ids[] through manifest.topology[ui_projection].packageIds
        - package_ids[] connect to topology.components_package_design (the manifest-facing
            package authority — db-schema.yaml packages.manifest_reference — not
            topology.ui_component_package)
        - manifest.topology[ui_projection].layoutId connects to topology.components_layout_design
            / topology.ui_wiring_registry / topology.ui_topology_tensor
        - backend dispatch (ManifestDispatcher.DispatchAsync) resolves the topology_manifest and
            reaches a scalar Emission — not a repository method called directly with a hardcoded
            id constant
        - the scalar Emission carries ManifestId / NavigationSequence / PackageId / LayoutId /
            LayoutNodes, and NavigationSequence[].RelatedHubId observably corresponds to hub_ids[]
        - frontend round-trip: NavigationSequence[].TargetManifestId -> resolveHubNavigationLinks
            -> ?manifest=<uuid> href -> parseProjectionEntrySelection -> resolveProjectionEntryAxes
            -> payload.target_ref = manifest:<uuid>:projection_entry (the same target manifest,
            not merely a rendered label)
      proof_boundary:
        - a completion proof must dispatch through ManifestDispatcher.DispatchAsync, not call a
            layout/tensor repository method directly with a hardcoded layoutId/packageId constant
        - seed / refs-only-shape existence alone is not proof; the refs must be observed
            resolving into scalar Emission fields
        - hubs.hub_relations must be observed as a manifest-scoped relation vector (array-verified
            hub_ids[] ordered by sequence_position), not only as a CRUD/list surface
        - TargetManifestId must be observed resolving only when exactly one ACTIVE
            hubs.topology_manifests row exists for a related hub (zero, deprecated-only, or
            multiple-active must all resolve to no target — never an oldest/first/MIN implicit
            fallback)
        - this contract does not authorize a dedicated credential-management route, dedicated
            panel, or new runtime_destination

    production_projection_connectivity_invariant:
      note: >-
        Owner design decision (2026-08-16, PR #602 round 10, re-aligned round 11 to
        docs/design/db-schema.yaml hub_relations.minimum_cardinality_completion_invariant as the
        top authority; re-aligned round 13 to the existing public.manifest draft -> active ->
        deprecated lifecycle as the canonical completion boundary -- see enforcement_boundary
        below). Generalizes the per-subBundle navigation_binding_authoring_and_verification /
        navigation_binding_resolution_criterion gate already proven in
        docs/design/admin-normal-surface-projection-seed-ssot.yaml design_blocking.subbundle_status
        (and this contract's own test_proof_contract above) from a one-time seed-conversion
        completion checklist item into a standing architectural invariant for every
        hubs.topology_manifests row, present or future -- not scoped to the five named
        admin-surface-topology-seed-conversion subBundles only. Round 10 first stated this
        invariant scoped to "production projection manifests" as distinct from a
        "standalone/internal/system-utility manifest" exception class; round 11 removed that
        distinction as inconsistent with db-schema.yaml's hub_relations.role
        (manifest_scoped_topology_sequence_chain, parent_table hubs.topology_manifests) top
        authority, which draws no such manifest-kind boundary -- every hubs.topology_manifests row
        is subject to the same cardinality requirement, not a subset classified by manifest kind.
        Round 12 audited whether any production authority represented "this manifest's build is
        finished" distinct from status='active' (set at manifest creation, before round 13, which
        made status='active' meaningless as a completion signal since it was set unconditionally on
        every authoring upsert) and found none, recording navigation_binding_resolution_criterion
        (design_blocking.subbundle_status) as a manually-tracked 5-subBundle documentation
        convention only, not a general runtime boundary -- that framing is now corrected by round
        13: the boundary was never missing, hubs.topology_manifests.status was simply wired wrong
        (see enforcement_boundary).
      invariant: >-
        Every hubs.topology_manifests row with status='active' must resolve at least one active
        hubs.hub_relations row through the exact same resolution_chain this contract's
        test_proof_contract already defines -- HubNavigationResolver -> Emission.NavigationSequence
        -> resolveHubNavigationLinks -> ProjectionShell's own nav bar / target-manifest round trip.
        An active topology_manifest with zero active hub_relations, with only deprecated-status
        hub_relations, or whose only active hub_relations row's target does not resolve to exactly
        one active topology_manifest, is not a valid completion state ("navigation orphan"). A
        status='draft' topology_manifest is exempt while authoring is in progress and is never
        itself resolved as a navigation/runtime target -- see
        docs/design/db-schema.yaml hub_relations.minimum_cardinality_completion_invariant
        (draft_transient_state_carve_out), the top authority this addendum mirrors.
      not_the_solution: >-
        This invariant is about topology/authoring completeness, not frontend UI. It must not be
        satisfied by adding a dedicated navbar/header/sidebar/Home-button fallback component, nor
        by component-specific/nodeId-specific/manifest-UUID-specific hardcoding, nor by any
        frontend fallback rendered when the underlying hub_relations authoring gap is real.
        ProjectionShell's existing conditional nav bar (renders only when NavigationSequence is
        non-empty -- frontend/islands/ProjectionShell.tsx) is unchanged by this invariant; the fix
        belongs at the authoring/proof layer, never as a frontend paper-over.
      not_a_fabrication_license: >-
        Does not authorize fabricating hub_relations, hubs, or topology_manifests rows that would
        not otherwise exist merely to satisfy this cardinality -- PR #584's ban on "an empty/fake
        manifest just to give something a hub relation source" (agent task tracking surface)
        remains in force, mirrored in db-schema.yaml's does_not_authorize field on the same
        invariant.
      proof_shape: >-
        Authoring-side: reuses this contract's own test_proof_contract resolution_chain/proof_boundary
        above unchanged (real hub_navigation:create authoring dispatch, never a raw SQL insert
        standing in for authoring; full resolution_chain to a scalar Emission) -- no new proof
        mechanism invented. Promotion-boundary-side (round 13):
        backend/tests/Topolactor.Integration.Tests/ManifestDraftActivePromotionLifecycleLiveDbTests.cs
        proves, against a real database and NpgsqlManifestRepository.PromoteAsync: draft create
        projects a draft topology_manifest with legitimate N=0 hub_relations; a resolvable active
        relation authored on the draft (via real hub_navigation:create dispatch) lets promotion
        succeed and both public.manifest and hubs.topology_manifests become active; zero,
        deprecated-only, and unresolved-only-target relations each fail promotion closed with
        HUB_RELATION_REQUIRED_FOR_PROMOTION and leave both tables in their prior draft state; and
        NpgsqlManifestRepository.DeprecateAsync mirrors 'deprecated' onto hubs.topology_manifests,
        making the manifest stop resolving as a navigation target. Deprecate-regression-side
        (round 11, unmodified by round 13): backend/tests/Topolactor.Integration.Tests/
        HubRelationOrphanInvariantLiveDbTests.cs proves the hub_navigation:deprecate guard below
        through the real dispatch path, in both the blocked (last active relation) and successful
        (one of several) cases, and backend/tests/Topolactor.Runtime.Tests/
        HubNavigationDeprecateOrphanGuardTests.cs proves the same guard at unit level, including
        that it is scoped per topology_manifest_id. Frontend-side: a real DOM-render assertion
        (ProjectionShell mounted for real, asserting actual rendered <a>/<span> hub-navigation
        elements from a real NavigationSequence, not source-string grep) -- see
        frontend/tests/projectionShellHubNavigationRenderProof.test.ts.
      enforcement_boundary: >-
        The canonical completion boundary (round 13) is NpgsqlManifestRepository.PromoteAsync --
        the existing public.manifest draft -> active transition, not a new concept. Before opening
        its transaction, PromoteAsync queries
        ContentBundleRepository.HasResolvableActiveHubRelationAsync (reusing
        LoadHubNavigationSequenceAsync's own resolution semantics; not a duplicated COUNT-only
        query) and fails closed with HUB_RELATION_REQUIRED_FOR_PROMOTION on zero, deprecated-only,
        or unresolved-only-target relations, leaving both tables untouched. hub_relations authoring
        (hub_navigation:create) remains deliberately unblocked on a draft topology_manifest --
        docs/design/admin-normal-surface-projection-seed-ssot.yaml design_blocking's own
        sequencing_note establishes that hub relation authoring is structurally the LAST step after
        a topology_manifest's own content is built, and "can never be a precondition for starting a
        subBundle's own target manifest build"; that sequencing is unaffected because the new check
        is a promotion-time gate, not an authoring-time or draft-creation-time one -- a draft may
        have zero hub_relations for as long as authoring takes, and only promotion (an explicit,
        author-initiated action taken once the manifest's own content is believed complete) is
        gated. Round 10-12 described this as two independently-scoped boundaries sharing
        responsibility "by design, not by omission," with navigation_binding_resolution_criterion
        (design_blocking.subbundle_status) standing in as the completion-judgment boundary; round 13
        supersedes that framing -- navigation_binding_resolution_criterion was a manually-tracked
        5-subBundle documentation convention, not a runtime path, and the actual gap it was
        approximating (hubs.topology_manifests going active before public.manifest's own promotion,
        because ManifestCanonicalProjection hardcoded status='active' on every authoring upsert) is
        now closed at the real production boundary. hub_navigation:deprecate
        (NpgsqlContentBundleRepository.DeprecateHubRelationAsync) remains a second, independent
        fail-close boundary -- unmodified by round 13 -- guarding regression after activation: it
        fails closed with HUB_RELATION_LAST_ACTIVE_FOR_MANIFEST when deprecating a row would leave
        its topology_manifest_id with zero active relations, regardless of that manifest's own
        draft/active status (hub_navigation:update replaces related_hub_id in place;
        hub_navigation:reorder never changes status, so deprecate is the only other mutation able to
        reduce the active count).
      scope: >-
        Applies to every hubs.topology_manifests row per db-schema.yaml
        hub_relations.minimum_cardinality_completion_invariant.applies_to -- not limited to
        admin-surface-topology-seed-conversion's five subBundles, though those remain the existing
        concrete proof precedent (admin-dashboard/admin-enum/credential-management already resolved
        per navigation_binding_resolution_criterion; team-dashboard/scheduler-settings remain
        unresolved_before_seed).

    canonical_default_entry_contract:
      note: >-
        Minimal design addendum defining the means by which a bare/no-selection projection entry
        (frontend/runtime/projectionEntry.ts resolveProjectionEntryAxes({}) -- no route, no
        explicit manifest, no pre-injected payload.target_ref) resolves an initial manifest.
        Distinct from hub_navigation_resolution above, which resolves OUTBOUND navigation links
        from an ALREADY-resolved manifest -- this contract is consulted BEFORE any manifest is
        resolved, as the initial-resolution fallback itself.
      owner: hubs.hub_relations
      marker:
        field: relation_config.transition
        value: canonical_default_entry
      singularity: >-
        Exactly one active hubs.hub_relations row may carry this marker at a time. Zero rows
        means no canonical default entry is configured. Two or more rows is a configuration
        error, never a first-match silent pick.
      resolution_priority: >-
        Consulted by manifest_dispatcher only as a fallback for the exact axes combination
        target=default, layer=screen_list, action=Search, and only when both normal
        manifest_resolution.api (role/target/layer/action) axes matching AND payload.target_ref
        are absent/unmatched. This is not a general MANIFEST_NOT_FOUND rescue for arbitrary axes,
        and it never overrides an explicit ?route=/?manifest=/payload.target_ref selection.
      active_status_requirement: >-
        Resolves only when BOTH the marked hubs.hub_relations row itself has status=active AND
        the manifest row it names (via hubs.hub_relations.topology_manifest_id) has status=active.
        A marked relation naming a draft/deprecated manifest resolves to no manifest (fail-close),
        never a stale/inactive projection.
      role_boundary: >-
        No role-axis filtering is applied to this fallback (mirrors the default/screen_list/Search
        axes' own public-entry semantics) -- any authenticated session may reach the canonical
        default entry manifest this way, same as an explicit ?manifest= selection would.
      failure_semantics:
        missing: >-
          No row carries the marker, or the named manifest is not active -> MANIFEST_NOT_FOUND,
          identical to the pre-existing no-fallback-configured error -- never a guessed manifest.
        ambiguous: >-
          More than one active row carries the marker -> CANONICAL_DEFAULT_ENTRY_AMBIGUOUS, an
          explicit configuration-error response -- never a silent first-match pick.
      prohibited:
        - unscoped_sequence_position_1_global_scan
        - resolving_a_draft_or_deprecated_manifest_as_default_entry
        - treating_this_marker_as_a_substitute_for_hub_navigation_resolution_navigation_sequence
        - dedicated_route_panel_or_runtime_destination_for_this_fallback
      test_proof_contract:
        note: >-
          A completion proof for this contract must dispatch the EXACT bare-entry axes
          combination through ManifestDispatcher.DispatchAsync (never a hardcoded manifest id
          constant fed directly into a repository method), against canonical (non-demo) seed
          data, and observe Emission.ManifestId / Emission.LayoutNodes resolving -- not merely
          that the marker row exists in seed SQL.
        negative_cases:
          - draft_or_deprecated_manifest_named_by_the_marked_relation_resolves_to_no_manifest
          - two_active_rows_carrying_the_marker_resolves_to_canonical_default_entry_ambiguous
          - no_row_carrying_the_marker_resolves_to_manifest_not_found

    manifest_key_target_ref_resolution_contract:
      note: >-
        Generic route/projection-entry identity resolution (2026-08-17, cross-cutting closure
        round): lets a frontend entry point identify its target manifest by
        hubs.topology_manifests.manifest_key -- the same stable, already-existing,
        human-readable identity string every manifest in the system already carries -- instead of
        a raw manifest_id UUID constant embedded in route source. Distinct from
        canonical_default_entry_contract above (which resolves the SINGLE, explicitly-marked
        site-root fallback for the bare/no-selection axes combination): this contract is a
        general-purpose, unlimited-cardinality resolver any route/entry point may invoke by
        naming its own manifest_key, not scoped to one singleton relation marker.
      target_ref_shape: >-
        payload.target_ref = "manifest_key:<manifest_key>:<wiring_key>" -- a sibling grammar to
        the pre-existing "manifest:<uuid>:<wiring_key>" shape (ManifestDispatcher.cs
        TryParseManifestTargetRef), recognized alongside it in the SAME target_ref dispatch
        branch. Resolution to a manifest_id happens FIRST (this contract's own scope); every
        downstream step (LoadByIdAsync, active-status check, admin_runtime layer/action
        authorization, capability_requirement validation) is the IDENTICAL, unmodified pipeline
        the UUID-based shape already uses -- this contract only ever changes HOW a manifest_id is
        arrived at, never what happens once one is resolved.
      owner: hubs.topology_manifests.manifest_key
      resolution_rule: >-
        Exactly one ACTIVE hubs.topology_manifests row may carry a given manifest_key at a time
        (the same no_implicit_join_nullable_fallback_or_oldest_manifest_fallback discipline
        db-schema.yaml already requires for hub_relations target resolution, applied here to
        manifest_key lookup instead -- ContentBundleRepository.
        ResolveActiveManifestIdByManifestKeyAsync, "SELECT ... WHERE status='active' AND
        manifest_key=@key LIMIT 2"). manifest_key itself carries no UNIQUE DB constraint (deferred
        deprecated/draft rows may freely reuse a key), so this resolver filters on status='active'
        rather than relying on a schema-level guarantee.
      failure_semantics:
        missing: >-
          Zero active rows share the manifest_key -> MANIFEST_NOT_FOUND, identical in shape to the
          pre-existing UUID-not-found error -- never a guessed manifest.
        ambiguous: >-
          More than one active row shares the manifest_key -> MANIFEST_KEY_AMBIGUOUS, an explicit
          configuration-error response -- never a silent first-match/oldest/MIN pick.
        malformed: >-
          Empty manifest_key segment ("manifest_key::wiring_key") -> TARGET_REF_INVALID, the same
          code the UUID shape already returns for its own malformed cases.
      prohibited:
        - first_match_oldest_or_min_fallback_when_multiple_active_rows_share_a_key
        - inventing_a_new_per_route_identity_vocabulary_distinct_from_manifest_key
        - a_dedicated_per_route_or_per_surface_resolver_bypassing_this_shared_generic_method
        - treating_manifest_key_resolution_as_a_separate_authorization_surface_from_the_uuid_path
      test_proof_contract:
        note: >-
          A completion proof for this contract must dispatch a REAL manifest_key-shaped
          target_ref through ManifestDispatcher.DispatchAsync against canonical (non-demo) seed
          data and observe Emission.ManifestId resolving to the SAME manifest the equivalent
          UUID-shaped target_ref would reach -- not merely that the resolver method returns the
          expected UUID in isolation.
        negative_cases:
          - manifest_key_with_zero_active_rows_resolves_to_manifest_not_found
          - manifest_key_shared_by_two_active_rows_resolves_to_manifest_key_ambiguous
          - empty_manifest_key_segment_resolves_to_target_ref_invalid
        production_consumers: >-
          frontend/routes/dashboard/index.tsx (team_dashboard.normal.projection) and
          frontend/routes/admin/team-dashboard/index.tsx (team_dashboard.admin.projection) --
          ProjectionShell manifestKey prop, replacing the prior hardcoded manifestId UUID
          constant on both routes.

    layout_schema_structural_render_contract:
      note: >-
        Minimal design addendum defining render-completion semantics for
        topology.components_layout_design.layout_schema_json.records[] -- the structural
        authority tree, distinct from topology.ui_topology_tensor.layout_patch_json.nodes[] (the
        flat runtimeInteractions carrier). Render completion is defined as zero
        componentType==="error" specs after frontend renderEmission() over the composed
        LayoutNodes -- tensor-node presence alone is not render completion.
      authority_boundary_with_translator_ssot: >-
        docs/design/react-schema-topology-seed-translator-ssot.yaml owns the SEED EMISSION shape
        for these record types (react_schema_contract.allowed_node_kinds,
        topology_ui_seed_contract.record_types, exchange_mapping.schema_to_seed_record_mapping)
        -- what fields a record carries and how react_schema authoring produces it. This contract
        owns the RUNTIME PROJECTION/RENDER shape for the same record types once they reach
        components_layout_design.layout_schema_json.records[] -- whether a recordType becomes a
        structural_node, a catalog_component (and by which resolution convention), or an explicit
        unresolved_gap failure. Neither SSOT restates the other's authority; a record's runtime
        classification below must cover every recordType the translator's
        layoutAdoptionCandidates.source_record_types enumerates, and the translator's
        projection_render_exchange_contract cross-references this section rather than
        re-deriving the classification.
      structural_record_vocabulary:
        structural_node_record_types:
          - topology_ui_category
          - topology_ui_section
          - topology_ui_form
          - topology_ui_workflow
          - topology_ui_validation
        catalog_component_record_types:
          - topology_ui_field
          - topology_ui_action
          - topology_ui_table
          - topology_ui_workflow_step
          - topology_ui_modal
        unresolved_gap_record_types:
          - topology_ui_unresolved
        rule: >-
          Category/Section/Form/Workflow/Validation compose into LayoutNode.NodeKind=
          "structural_node" entries -- never a componentId/componentKind, resolved via no
          registry lookup. Field/Action/Table/WorkflowStep compose into NodeKind=
          "catalog_component" entries whose componentId/componentKind are resolved from the
          existing topology.ui_component_registry preset catalog (see field_control_resolution
          and table_display_resolution below) -- never invented, never a structural-node-shaped
          catalog entry. Modal also composes into NodeKind="catalog_component" (it renders a
          real, built-in runtime primitive, backend/repository/LayoutSchemaTensorComposer.cs
          round 24/25) but resolves differently from every other catalog leaf: its componentKind
          is the record's own authored literal value (validated as exactly "disclosure/modal",
          never a control/display convention lookup) and its componentId is its own resolved
          NodeId (a built-in runtime primitive, not a topology.ui_component_registry-backed
          preset) -- never a componentKeyToId registry resolution. Uniquely among catalog leaves,
          a Modal record may itself be the parent of further catalog leaves (its authored
          Confirm/Cancel Action children); catalog_component_record_types membership governs
          leaf-vs-container RESOLUTION convention, not containment eligibility -- the generic
          ParentNodeId/lastResolvedNodeIdByKey walk already supports any record type acting as a
          parent regardless of which of the three vocabulary buckets it belongs to. Unresolved
          (topology_ui_unresolved) is neither: it composes into NodeKind="unresolved_gap" and
          always renders as an explicit error carrying its knownGapRefs (see
          unresolved_gap_resolution below) -- it is a terminal known-gap marker, not a resolvable
          leaf and not a container.
        field_control_resolution: >-
          A Field record's authored control value (e.g. form_input/select) maps to an existing
          ui_component_registry.component_key by fixed convention
          (LayoutSchemaTensorComposer.FieldControlToComponentKey); an Action or WorkflowStep
          record maps to the shared button.primitive/action-button entry (WorkflowStep shares
          Action's exact required-field shape -- actionRef/eventBinding/authorityMarker -- and the
          translator's own storage_adoption_contract.adoption_candidate_separation_contract
          already treats the two identically across wiringAdoptionCandidates/
          tensorAdoptionCandidates; runtime resolution follows the same pairing). An unresolvable
          control leaves componentId/componentKind null -> CATALOG_COMPONENT_KIND_REQUIRED at
          render time, never a silent guess. FieldControlToComponentKey's own convention pairs
          must stay identical to the Field-facing subset of react-schema-topology-seed-
          translator-ssot.yaml's COMPONENT_KIND_TO_COMPONENT_KEY (the translator's own
          tensor-emission-path mirror of this SAME convention for every control a Field may
          actually author -- never its two non-Field entries "action/button"/"disclosure/modal",
          which Action/Modal resolve through their own separate mechanisms and which
          FieldControlToComponentKey correctly never carries; per that SSOT's
          field_control_component_identity_contract) -- including data_display/md_viewer ->
          md_viewer.projection and form_input/
          textarea_template -> textarea.template, both already real, active
          ui_component_registry rows (db/ui_component_registry_preset_catalog_bootstrap.sql)
          the translator's own path already resolves; a control value the translator resolves
          but this table does not is a defect in this table, never evidence the control needs a
          new registry row or is unsupported for schema-composed Fields.
        table_display_resolution: >-
          A Table record's authored display value (e.g. card_list, data_grid, list) maps to an
          existing ui_component_registry.component_key by fixed convention
          (LayoutSchemaTensorComposer.TableDisplayToComponentKey), reusing the same registry rows
          ui-builder-preset-ecosystem-ssot.yaml presets already declare for table-shaped surfaces
          (card_list.primitive, data_grid.alias, list.alias) -- never a new registry row invented
          for this contract. An unresolvable display value leaves componentId/componentKind null
          -> CATALOG_COMPONENT_KIND_REQUIRED at render time, identical treatment to an
          unresolvable Field control.
        unresolved_gap_resolution: >-
          A topology_ui_unresolved record composes into a NodeKind="unresolved_gap" LayoutNode
          carrying its knownGapRefs. frontend renderEmission() always renders an unresolved_gap
          node as componentType="error" (code TOPOLOGY_UI_UNRESOLVED_GAP_REF), surfacing knownGapRefs in the
          error def -- never resolved to a componentId, never silently dropped, never treated as
          a resolvable catalog_component or a structural_node. A layout containing an
          unresolved_gap node cannot reach render completion (zero error specs) until the
          authored gap is actually resolved and the record is replaced -- this is correct
          behavior, not a defect in this contract: render completion must not paper over a real
          unresolved authoring gap the translator itself flagged.
        tensor_runtime_interactions_merge: >-
          topology.ui_topology_tensor nodes key their runtimeInteractions array at the OWNING
          STRUCTURAL PARENT's own tensor NodeId (corrected 2026-09-06, follow-up audit: this
          section previously said "the FORM level" / "the form's key, a structural node" --
          BuildInteractionsBySourceActionKey itself has no Form-type check anywhere; it groups
          purely by each raw tensor node's own NodeId, whatever record type that node's schema
          counterpart actually is, so "FORM" was a descriptive label for the historically common
          case, never an enforced restriction -- see react-schema-topology-seed-translator-
          ssot.yaml storage_adoption_contract.structural_authority_precedence_contract.
          interaction_ownership_and_addressing_contract for the full real-precedent proof, a
          documentation correction only, no code changed); each entry carries its own
          sourceActionKey identifying the specific Field/Action/Modal leaf it belongs to.
          Composition groups entries by "{parentTensorNodeId}::{sourceActionKey}" (never
          sourceActionKey alone) and merges each leaf's own matching entries by
          "{parentKey}::{key}" -- never a naive tensor-nodeId==record-key match (the tensor
          nodeId belongs to whichever record is the OWNING STRUCTURAL PARENT -- a Form/Section/
          Category structural_node in the common case, but a Modal catalog_component exactly as
          validly when a Modal is itself the owning parent of its own Confirm/Cancel Action
          children, per catalog_component_record_types' rule above) and never a bare-
          sourceActionKey match, which would cross-contaminate two different parents that happen
          to author the same leaf key (Action/Field/Modal keys are only guaranteed unique within
          their own owning parent, the same way record keys are only guaranteed unique within
          their own branch -- see node_id_collision_handling). A canonical react_schema with NO
          Form anywhere (e.g. a Category > Section > Field/Action/Modal tree) is not exempt from
          or unsupported by this mechanism: its Section is the owning structural parent for its
          own direct children exactly as a Form would be. A malformed tensor runtimeInteractions
          shape (invalid JSON, a non-array value, a non-object entry, or an entry missing a
          non-empty sourceActionKey) is a real authoring defect ->
          LAYOUT_SCHEMA_RUNTIME_INTERACTIONS_INVALID, never silently skipped
          (LayoutSchemaTensorComposer.BuildInteractionsBySourceActionKey).
        runtime_interaction_attributability: >-
          A catalog_component leaf's authored runtimeInteractions may still be well-formed JSON
          yet carry an actionType outside the recognized runtime taxonomy (dispatchExternalPort,
          dispatchInstanceOperation, or a classified UI-state-update actionType) -- e.g. a real
          seed authoring an actionType the frontend event-binding pipeline does not implement.
          Such an entry resolves to zero recognized event bindings; frontend renderEmission()
          detects this (authored runtimeInteractions present, zero resulting bindings) and fails
          explicit as componentType="error" (code RUNTIME_INTERACTION_UNATTRIBUTABLE) at the same
          layer CATALOG_COMPONENT_KIND_REQUIRED already lives -- never silently rendered as a
          normal, unbound component that would only fail later, cryptically, deep inside the
          runtime factory (a RUNTIME_PRIMITIVE_RENDERER_MISSING_EVENT_BINDING crash renderEmission
          itself never sees). This is an authoring/wiring-completeness gap in the seed content,
          never a structural-render or projection-identity defect -- a layout containing such a
          leaf cannot claim render completion for that leaf until the interaction actually gains
          a recognized runtime handler or is removed, the same posture unresolved_gap already
          takes.
        localStateMutation_taxonomy: >-
          react-schema-topology-seed-translator-ssot.yaml
          wiring_lane_contract.lanes.internal_instance_wiring already declares localStateMutation
          as a canonical example (alongside modal_open_close/drawer_open_close/selected_row/
          tab_state) with targetRef_shape "ui-local:<nodeId>.<stateKey>" and no backend dispatch
          -- it is a UI-state-update actionType, not an unattributable one. Frontend
          wiringSettingCategoryOf classifies it as ui_state_update;
          resolveUiStateUpdateMutation resolves targetNodeId/statePath by parsing this targetRef
          when no separate targetNodeId/statePath field is present, and writes true (a flag
          write, the same "set true" semantic as openModal/openDrawer/openDialog -- never an
          invented business-data value the seed record does not carry). A catalog_component leaf
          whose runtimeInteractions consist entirely of correctly-shaped localStateMutation
          entries is therefore attributable and must not hit RUNTIME_INTERACTION_UNATTRIBUTABLE.
        runtime_record_common_required_fields_validation: >-
          react-schema-topology-seed-translator-ssot.yaml topology_ui_seed_contract.
          record_common_required_fields (recordType, key, label, sourceYamlRefs, sourceReactPath,
          knownGapRefs) is validated at GENERATION time by the translator
          (validate_seed_record_tree); the runtime parser (LayoutSchemaTensorComposer.ParseRecords)
          validates the SAME common fields a second time, at READ time, over whatever
          layout_schema_json is actually persisted -- a persisted row can drift from the
          translator-validated shape (hand-edited, corrupted, or authored by a future producer
          that bypasses the translator), and this runtime check is the only thing that would catch
          it. label, sourceReactPath, and sourceYamlRefs must be non-empty (the translator's own
          validate_seed_record_tree SEED_RECORD_EMPTY_SOURCE_YAML_REFS check rejects an empty
          sourceYamlRefs the same way it rejects a missing one, so the runtime check matches that
          exactly); knownGapRefs must be present as an array (an empty list is not itself invalid
          for knownGapRefs -- only a missing or wrong-shaped one is). Any violation is
          LAYOUT_SCHEMA_RECORDS_INVALID for the WHOLE records[] array, the same fail-close posture
          as a missing recordType/key or an unrecognized recordType -- never a per-record fallback
          (e.g. falling back to the raw NodeId or an empty string as a substitute label), and never
          a NEW required field or failure condition beyond what the translator's own contract
          already declares.
        select_field_binding_contract: >-
          form_input/select projects to the existing ui_component_registry select.template entry
          (field_control_resolution above) -- never a new component kind, DTO field, or registry
          row. runtimeComponentFactory's selectFactory requires a validly-shaped authored "change"
          binding when one is authored (requireBinding, unchanged fail-close for a malformed
          binding); when NO "change" binding is authored at all, selectFactory renders within the
          existing runtime adapter contract without requiring one -- the SAME no-binding-required
          posture formFieldFactory already has for form_input/form_field. This is not a Field-level
          read-only/editable authority: no new SSOT concept, seed attribute, or DTO field is
          introduced to distinguish "should be editable but isn't wired" from "genuinely never
          wired" -- both render the same way, exactly as an unwired form_input/form_field already
          does.
        action_component_kind_trigger_alignment: >-
          Action/WorkflowStep records resolve uniformly to the button.primitive catalog component
          (field_control_resolution above), and buttonFactory unconditionally requires
          a "click" trigger -- so an authored Action whose real UI behavior is not a click (e.g. a
          file-input-shaped "change" trigger) is a genuine componentKind/trigger authoring mismatch
          in the SOURCE schema, not a runtime factory defect. The fix belongs in the source schema
          (correcting the authored trigger/actionRef to a real click-triggered button, mirroring a
          sibling Action's convention in the same Form), regenerated through the real
          generate-react-schema -> generate-topology-seed pipeline -- never a broad,
          app-wide relaxation of buttonFactory's trigger requirement, and never a new bespoke
          component/factory/registry-row invented to route around a single Action's authoring gap.
        authored_label_and_production_props: >-
          Every schema record carries an authored label (record_common_required_fields); a
          catalog_component leaf's LayoutNode.Label carries it through composition exactly like a
          structural_node's does -- never discarded. Frontend production (non-preview) rendering
          must build default props from this authored label and never inject the UI-Builder
          canvas-preview placeholder's inert content (a hardcoded caption, a fabricated sample
          option list, or action/button's forced disabled:true) -- a schema-composed leaf never
          carries node-local propsJson/design to override that placeholder, so reusing it
          unconditionally for production would make every schema-composed action permanently
          un-clickable in the real DOM.
        node_id_collision_handling: >-
          A record's authored key is only guaranteed unique within its own branch -- the seed
          schema permits the same key in two branches (a real, observed case: manifest 092's
          "approval_status" field appears under both user_auth_section and
          instance_operation_approval_form). Composition namespaces a colliding key as
          "{parentKey}::{key}" instead of colliding or silently dropping one occurrence.
        parent_scoped_identity_reconstruction: >-
          A colliding container key (e.g. two Sections both authored as "shared_section" under
          different Categories) is not merely a NodeId-string concern -- every child nested under
          EITHER duplicate must still resolve ParentNodeId to the SAME physical instance it was
          actually nested under, never to whichever duplicate happens to match by raw key.
          Composition resolves ParentNodeId by walking records in authored document order
          (already parent-before-child) and tracking each key's MOST RECENTLY composed NodeId so
          far, rather than a static whole-tree key lookup -- a child's parentKey is matched
          against this running map, so it attaches to the instance immediately preceding it in
          document order (the one it was genuinely nested under), not a static, order-independent
          lookup that cannot distinguish between duplicate instances at all. This resolved parent
          identity (never the raw authored parentKey string) is also what a duplicated CHILD key's
          OWN NodeId is namespaced by, and what the tensor runtimeInteractions merge key is scoped
          by -- otherwise, when the PARENT key is ALSO duplicated across the same branches (e.g.
          two Forms both keyed "shared_form", each with its own Action keyed "shared_action"), a
          namespace built from the raw parentKey string alone collides to the identical
          "{rawParentKey}::{key}" string in every branch, silently merging two genuinely distinct
          instances. The translator's own parallel duplicate-key namespacing
          (split_flat_records_into_adoption_candidates.resolve_and_track_identity) uses the SAME
          resolved-parent-identity rule, so a duplicate parent key and a duplicate child key
          present at the same time still resolve consistently across the translator, the runtime
          composer, and the tensor interaction merge.
        implicit_root_parent_handling: >-
          A record's authored parentKey referencing the translator's implicit/virtual tree root
          (never itself a record in records[]) resolves to a null (top-level) ParentNodeId, not a
          dangling LAYOUT_PATCH_MISSING_PARENT reference.
      absent_vs_invalid_records:
        absent_or_empty: >-
          layout_schema_json has no "records" key, or records is an empty array -> no
          schema-driven composition available; the existing tensor-only LayoutNode path applies
          unchanged (the common case for UI-Builder-authored layouts, where componentId/
          componentKind already live directly on tensor nodes).
        invalid_nonempty: >-
          layout_schema_json has a "records" key that is present and non-empty but malformed
          (not an array; or contains an entry missing a required recordType/key; or an
          unrecognized recordType) is an explicit LAYOUT_SCHEMA_RECORDS_INVALID failure -- never
          silently dropped to the tensor-only path and never a subset tree built by skipping the
          invalid entries.
        rule: >-
          Absence and invalidity are never conflated. A parser must distinguish "no records[] to
          compose from" (fallback is correct) from "records[] exists and is broken" (fallback
          would hide a real authoring defect) -- the same distinction db-schema.yaml's
          no_implicit_join_nullable_fallback_or_oldest_manifest_fallback invariant embodies for
          hub-relation target resolution.
      prohibited:
        - structural_node_receiving_a_componentId_or_componentKind
        - inventing_a_componentId_for_an_unresolvable_control_or_display_value
        - skipping_invalid_records_entries_to_synthesize_a_partial_tree
        - treating_a_malformed_nonempty_records_shape_as_equivalent_to_absent_records
        - judging_render_completion_by_tensor_node_presence_alone
        - rejecting_topology_ui_table_or_topology_ui_workflow_step_or_topology_ui_unresolved_as_an_unrecognized_recordType
        - silently_converting_topology_ui_unresolved_into_a_normal_catalog_component_or_structural_node
        - inventing_a_new_ui_component_registry_row_for_table_display_resolution_instead_of_reusing_declared_preset_rows
        - skipping_a_malformed_tensor_runtimeInteractions_entry_instead_of_LAYOUT_SCHEMA_RUNTIME_INTERACTIONS_INVALID
        - silently_rendering_a_catalog_component_leaf_whose_runtimeInteractions_resolved_to_zero_event_bindings_as_a_normal_component
        - discarding_a_catalog_component_leafs_authored_label_during_composition_or_production_default_props
        - reusing_the_ui_builder_canvas_preview_placeholder_for_production_default_props_of_a_schema_composed_leaf
        - a_schema_composed_action_button_reaching_the_real_dom_with_a_forced_disabled_true_it_never_authored
        - judging_render_completion_by_renderEmission_error_count_alone_without_connecting_layoutProjectionTree_runtimeComponentFactory_and_the_final_dom
        - merging_runtimeInteractions_by_bare_sourceActionKey_across_two_different_forms_that_share_a_leaf_key
        - resolving_a_childs_ParentNodeId_by_a_static_whole_tree_key_lookup_that_cannot_distinguish_between_duplicate_container_instances
        - namespacing_a_duplicated_child_keys_NodeId_or_its_tensor_interaction_merge_key_by_the_raw_authored_parentKey_instead_of_the_resolved_parent_identity
        - a_runtime_parser_accepting_a_record_missing_label_or_sourceReactPath_or_nonempty_sourceYamlRefs_or_knownGapRefs_by_falling_back_to_the_raw_key_or_NodeId_or_an_empty_string
        - inventing_a_Field_level_read_only_or_editable_authority_seed_attribute_or_DTO_field_to_distinguish_an_unwired_select_from_a_genuinely_never_wired_one
        - normalizing_an_Actions_componentKind_trigger_mismatch_by_broadly_changing_buttonFactorys_trigger_requirement_app_wide_instead_of_correcting_the_source_schema
      test_proof_contract:
        note: >-
          A completion proof for this contract must observe the composed LayoutNode[] for a real
          representative manifest (manifest 092, resolved through the SAME dispatch path as the
          canonical_default_entry_contract test above) passed through frontend renderEmission()
          with defaultComponentRegistry, and assert zero componentType==="error" specs in that
          single representative scenario -- a backend-only unresolved-leaf count and a separately
          hand-authored frontend fixture are each necessary but neither is sufficient alone. The
          proof must also connect renderEmission() output through LayoutProjectionTree ->
          runtimeComponentFactory (renderRuntimeComponent) for every leaf, all the way to the real
          DOM, and assert zero visible error boxes there too -- not stop at renderEmission()'s own
          error count. A plain select field with no authored "change" binding renders within the
          existing runtime adapter contract (select_field_binding_contract above) rather than
          being carved out of the proof's assertion scope -- a "known gap" label is never a
          substitute for the representative scenario's literal zero-error count at either layer.
        positive_cases:
          - topology_ui_table_record_resolves_to_a_catalog_component_via_table_display_resolution
          - topology_ui_workflow_step_record_resolves_to_a_catalog_component_via_the_same_convention_as_topology_ui_action
          - a_catalog_component_leafs_authored_label_reaches_the_runtime_component_props_in_production_rendering
          - a_schema_composed_action_button_with_a_recognized_dispatchInstanceOperation_interaction_renders_enabled_disabled_false_through_the_real_runtime_factory
          - a_select_field_with_no_authored_change_binding_renders_in_the_real_DOM_without_requiring_one_matching_form_input_form_fields_existing_no_binding_required_posture
          - a_duplicate_parent_key_and_a_duplicate_child_key_present_simultaneously_still_resolve_to_distinct_NodeIds_with_correctly_attributed_non_cross_contaminated_runtimeInteractions
        negative_cases:
          - topology_ui_unresolved_record_composes_to_an_explicit_render_time_error_carrying_knownGapRefs_never_a_normal_component
          - a_recordType_outside_structural_node_record_types_plus_catalog_component_record_types_plus_unresolved_gap_record_types_is_LAYOUT_SCHEMA_RECORDS_INVALID_not_silently_skipped
          - a_malformed_or_sourceActionKey_missing_tensor_runtimeInteractions_entry_is_LAYOUT_SCHEMA_RUNTIME_INTERACTIONS_INVALID_not_silently_skipped
          - two_different_forms_authoring_the_same_leaf_key_with_different_runtimeInteractions_never_cross_contaminate_each_others_merge
          - a_duplicate_container_keys_children_attach_to_the_same_instance_they_were_nested_under_not_whichever_duplicate_matches_by_key
          - a_catalog_component_leaf_whose_authored_runtimeInteractions_resolve_to_zero_event_bindings_is_RUNTIME_INTERACTION_UNATTRIBUTABLE_not_a_silent_pass_through_to_the_factory
          - a_record_missing_label_or_sourceReactPath_or_sourceYamlRefs_or_knownGapRefs_is_LAYOUT_SCHEMA_RECORDS_INVALID_not_silently_accepted_with_a_fallback_value

    structural_subtree_conditional_visibility_contract:
      note: >-
        design_change (credential-management manifest 092 category-collapse audit) closing a
        real gap layout_schema_structural_render_contract above never addressed: that contract
        defines only WHETHER a schema record composes (structural_node / catalog_component /
        unresolved_gap) and whether composition is error-free -- it has no concept of a
        structural subtree being conditionally mounted based on a projection-local selection
        (e.g. a category/tab select choosing which of several sibling Category/Section subtrees
        is the current one). Before this contract, every composed LayoutNode is unconditionally,
        permanently rendered -- the credential-management manifest 092 audit found this is
        exactly why users / external_api_credential / external_instance_credential's CRUD/action/
        confirm structures all render simultaneously regardless of credential_category_filter's
        selection. This contract is additive: it does not change layout_schema_structural_render_
        contract's composition rules, and adopting it changes NOTHING about any existing
        manifest's rendered output until a record/node actually authors a visibilityBinding (see
        default_visible_when_unbound below) -- credential-management is this contract's FIRST
        CONSUMER, never its authority owner; ownership of this contract lives here and in the
        cross-referenced translator/wiring SSOTs below, never in
        docs/design/admin-normal-surface-projection-seed-ssot.yaml.
      static_topology_authority_boundary: >-
        The composed LayoutNode tree (topology.components_layout_design.layout_schema_json.
        records[] via LayoutSchemaTensorComposer.Compose, and topology.ui_topology_tensor.
        layout_patch_json.nodes[] via NpgsqlTopologyRepository.LoadLayoutNodesAsync) remains
        static, DB-authoritative, and composed with zero regard to any frontend-submitted
        selection or runtime-local state -- this is unchanged and non-negotiable. Compose() and
        LoadLayoutNodesAsync MUST NOT accept or consult a request-scoped selection/category/
        activeKey parameter to dynamically include, exclude, or reorder LayoutNodeRecords; a
        visibilityBinding (defined below) rides along a composed node exactly like its sibling
        RuntimeInteractionsJson/PropsJson/StateJson/PropBindingsJson carriers -- copied through
        verbatim, never evaluated, never used as an inclusion/exclusion predicate, backend-side.
        Conditional visibility is exclusively a frontend/runtime-side concern, evaluated only
        after the complete, unconditional LayoutNode[]/ComponentSpec[] already exists. This is
        the direct answer to the credential-management audit's blocking finding: the static tree
        stays whole; only its DOM mount decision becomes conditional, one layer downstream of
        backend composition.
      state_owner: >-
        No new state store is introduced. The read side of this contract consumes the SAME
        projection-local runtime state store docs/design/admin-uibuilder-ui-structure-wiring-
        ssot.yaml lane_storage_boundary.lanes.local_ui_state_lane already defines (
        RuntimeGuardedStateStore / frontend/runtime/uiEventEffectRunner.ts createRuntimeLocalStateStore),
        the same store UI監視割当 (ui_watch_binding) declares slots into and UI状態更新
        (ui_state_update; action_types including setActiveKey/setState/openModal family) already
        writes through via the single guarded write path (mutation_authority_unification). This
        contract adds a NEW READ CONSUMER of that existing store -- structural mount/unmount --
        alongside its existing prop-injection consumer (state_update_projection_rerender_contract:
        "UI状態更新 reflects into rendered runtimeSpec props"); it does not add a second consumer
        with independent semantics, and it does not promote UI-local state to any new authority
        (see authority_non_promotion below).
      write_read_separation: >-
        Write side reuses the existing UI状態更新 lane's addressing/declaration/guarded-dispatcher
        mechanics unchanged: any existing or future presentation component (select.template's
        onChange, tabs.template's onSelect, or a not-yet-existing accordion/segmented-control
        primitive) drives a UI状態更新 (setActiveKey / setState / localStateMutation) against a
        predeclared UI監視割当 slot, exactly the existing internal_instance_wiring /
        disclosure_state_wiring lane mechanics (docs/design/react-schema-topology-seed-translator-
        ssot.yaml wiring_lane_contract.lanes). The one write-side extension this contract requires
        is narrow and reuses existing vocabulary rather than inventing new: a UI状態更新 mutation
        MAY resolve its value dynamically from the triggering event via payloadFrom.value =
        "event.<path>" (see write_side_dynamic_value below) instead of only a static pre-authored
        literal -- necessary because a select offering N categories cannot express "whichever one
        the user picked" as one fixed literal. Read side is the primary new thing this contract
        defines: a topology_ui_category or topology_ui_section node (see
        authored_record_type_scope -- never a catalog_component leaf) MAY declare a
        visibilityBinding naming the SAME "ui-local:<nodeId>.<stateKey>" target already established
        as this store's addressing shape, plus a comparison value; a single generic,
        componentKind-agnostic frontend evaluator decides whether that node (and its whole
        subtree) mounts, consulted identically from DOM rendering and from lifecycle-interaction
        reachability (see operation_reachability below). The evaluator cares only about the
        resolved store value, never which presentation component produced the write -- see
        presentation_component_independence below.
      authored_record_type_scope: >-
        visibilityBinding may be authored ONLY on topology_ui_category and topology_ui_section
        records on the components_layout_design.layout_schema_json.records[] structural authority
        tree -- never on a catalog_component leaf (topology_ui_field / topology_ui_action /
        topology_ui_table / topology_ui_workflow_step), never on
        topology_ui_form/topology_ui_workflow/topology_ui_validation, and never directly on a
        topology.ui_topology_tensor.layout_patch_json.nodes[] entry at all (see
        record_carrier_tensor_only -- that surface has no Category/Section concept for any node it
        can ever carry, tensor-only layout or a schema-composed layout's own override lane alike).
        This is a deliberate scope
        restriction, not an evaluator limitation: the credential-management category-collapse
        consumer needs Category/Section-level subtree switching only, and leaf-level conditional
        visibility has no real consumer today -- generalizing the AUTHORING surface beyond what a
        real consumer needs would be exactly the over-generalization this contract's own prohibited
        list rejects elsewhere. resolveNodeVisibility (render_side_evaluation below) walks a node's
        full ancestor chain regardless of node type -- so a Field/Action leaf's effective visibility
        is already governed by its Category/Section ancestors' bindings without the leaf ever
        authoring one itself; this scope restriction is enforced by translator/ParseRecords
        validation, not by omitting ancestor-chain support from the evaluator.
      visibility_binding_shape:
        field: visibilityBinding
        carrier: >-
          A single object, not an array (one condition per node). Present only on a
          topology_ui_category or topology_ui_section node that needs conditional mounting --
          absent is the default and remains the overwhelmingly common case (see
          default_visible_when_unbound).
        fields:
          source:
            shape: 'ui-local:<nodeId>.<stateKey>'
            rule: >-
              Identical targetRef_shape to internal_instance_wiring / disclosure_state_wiring
              (react-schema-topology-seed-translator-ssot.yaml wiring_lane_contract.lanes) --
              no new addressing grammar invented. <nodeId> is the DRIVING node whose UI監視割当
              declared this slot (e.g. the select/tabs node), never the visibility-bound node
              itself.
          matchValue:
            type: scalar
            rule: >-
              Strict-equality (===) comparison against the source slot's live resolved value,
              whatever type that value actually is at evaluation time -- this contract does not
              introduce or require a separate declared value-type carrier (no production
              declaration surface for one exists; see docs/design/admin-uibuilder-ui-structure-
              wiring-ssot.yaml ui_watch_binding.fields_examples, which lists valueType only as an
              example field, never backed by an actual carrier or validator). Kept to a single
              scalar equality (no in:[...] set-membership, no negation, no boolean expression
              grammar) deliberately -- this is the minimal vocabulary the credential-management
              category-collapse use case needs (N mutually-exclusive subtrees, each gated by its
              own single-value visibilityBinding against the SAME source); a richer condition
              grammar is a deliberate non-goal of this contract and must instead be proposed as its
              own separate design_change if a real consumer needs it (see prohibited below).
        record_carrier_schema_composed: >-
          On components_layout_design.layout_schema_json.records[] entries, a topology_ui_category
          or topology_ui_section record (see authored_record_type_scope above -- never any other
          record type) MAY carry visibilityBinding as an additional record field, validated by
          LayoutSchemaTensorComposer.ParseRecords with the SAME fail-close posture
          record_common_required_fields already uses: a present-but-malformed visibilityBinding
          (source not matching the ui-local:<nodeId>.<stateKey> shape, a missing/non-scalar
          matchValue, or visibilityBinding authored on a record type outside
          authored_record_type_scope) is LAYOUT_SCHEMA_RECORDS_INVALID for the WHOLE records[]
          array -- never silently dropped, never silently treated as "no binding" (see
          invalid_binding_fail_close below).
        record_carrier_tensor_only: >-
          Corrected (this contract's own audit round): visibilityBinding is NEVER authored on
          topology.ui_topology_tensor.layout_patch_json.nodes[] directly, on any layout shape,
          schema-composed or tensor-only. An earlier draft of this contract claimed a tensor-only
          node "may appear directly" and would converge via the SAME NodeLocalData /
          BuildNodeLocalDataByNodeId pattern runtimeInteractions/propsJson/stateJson already use --
          that claim was never implementable and is retracted here, for two independent reasons,
          either one alone sufficient: (1) authored_record_type_scope requires the node to BE a
          topology_ui_category or topology_ui_section record -- a recordType that exists only on
          the components_layout_design.layout_schema_json.records[] structural authority tree
          (LayoutSchemaTensorComposer.ParseRecords owns it); a tensor-only layout (no records[]
          tree at all) has no such concept for any of its nodes, which are always catalog_component
          or structural_html. (2) Even for a schema-composed layout's OWN tensor override lane
          (a layout_patch_json entry sharing a nodeId with an existing records[] entry),
          BuildNodeLocalDataByNodeId's merge is catalog-leaf-only and never applies to a structural
          Category/Section node -- so even a tensor override
          entry naming a real Category/Section nodeId is never merged onto it, by a rule that
          predates and is unrelated to this contract. NpgsqlUiTopologyRepository.
          ValidateLayoutPatchAsync (ValidateLayoutPatchNodes) fails a layout_patch_json save closed
          with LAYOUT_PATCH_VISIBILITY_BINDING_NOT_ALLOWED if ANY node authors a visibilityBinding
          key at all -- well-formed or malformed, since neither is ever eligible on this surface --
          mirroring, but never substituting for, ParseRecords' own independent fail-close on the
          records[] surface (see invalid_binding_fail_close): the two authoring surfaces are
          validated, and proof-tested, separately.
      render_side_evaluation: >-
        frontend/runtime/renderEmission.ts carries visibilityBinding onto ComponentSpec verbatim,
        unevaluated (evaluating it once at ComponentSpec-build time would freeze a value that must
        react to live store changes over the projection's lifetime -- exactly why
        applyLocalStateOverrides already defers "open" resolution to render time rather than
        baking it into a static default). The actual mount/unmount decision is made by
        frontend/components/LayoutProjectionTree.tsx's ProjectionTreeNode calling
        frontend/runtime/structuralVisibility.ts resolveNodeVisibility, reading the SAME
        projection-local state store already threaded through the mount surface
        (component_runtime_state_effect_boundary.required_receive_surfaces "current state
        values"). frontend/runtime/uiEventEffectRunner.ts's emitLifecycle calls the SAME
        resolveNodeVisibility over its own node list before firing any lifecycle interaction (see
        operation_reachability) -- one resolver, two call sites, never two independently-maintained
        checks. Both are generic, for ANY node carrying a visibilityBinding, keyed by nothing but
        the binding's own source/matchValue, never by nodeId, componentKind, manifest UUID, or any
        credential-management-specific literal added to LayoutProjectionTree/renderEmission/
        ProjectionShell/uiEventEffectRunner.
      unmount_not_css: >-
        A node evaluated invisible is not rendered into the tree AT ALL -- no wrapping element
        with CSS display:none/visibility:hidden/[hidden], no aria-hidden-only suppression. This
        mirrors the existing modalFactory/Modal.tsx precedent (Modal returns null entirely when
        closed, taking its whole subtree -- footer included -- out of the DOM with it). CSS-only
        hiding never satisfies this contract at any layer; a production render that keeps a
        non-active category's DOM nodes present (even visually hidden) has not adopted this
        contract, regardless of what visibilityBinding metadata it carries.
      child_visibility_inheritance: >-
        An invisible node's entire descendant subtree unmounts with it -- a descendant never
        authors its own visibilityBinding (see authored_record_type_scope: only Category/Section
        may) and never needs to merely to inherit its ancestor's non-visibility. resolveNodeVisibility
        walks the full ancestor chain (self plus every parent up to the root) and collects every
        binding it finds; when a Category is itself nested inside another visibility-bound Category
        (or, more commonly, a Section inside its own Category), multiple bindings on that single
        root-to-leaf path compose as a logical AND (every one must resolve true for the node to
        mount), never an OR and never a later binding silently overriding an earlier one.
      operation_reachability: >-
        A hidden subtree's actions must be unreachable from BOTH surfaces that can execute a
        runtimeInteraction, not DOM unmount alone: (1) DOM-triggered interactions (click/change/...)
        -- because an invisible subtree never mounts, its Field/Action leaves' eventBinding never
        attaches to a real DOM element and can never emit a trigger, so dispatch reachability for a
        non-active category's create/update/delete/revoke/confirm actions is void by construction;
        (2) lifecycle-triggered interactions (initial_mount/route_enter/initial_display) -- these
        are synthetic triggers the runtime effect runner (frontend/runtime/uiEventEffectRunner.ts
        emitLifecycle) fires from its OWN flat node list, entirely independent of what
        LayoutProjectionTree actually mounted into the DOM, so DOM unmount alone does NOT make a
        hidden node's lifecycle interactions unreachable -- emitLifecycle must independently call
        the SAME resolveNodeVisibility (frontend/runtime/structuralVisibility.ts) over its own
        current node list before firing any interaction for a node, skipping (never firing, never
        marking it as fired) a node that resolves invisible or errors. Both surfaces sharing the
        identical resolver over the identical live state is what keeps them from disagreeing about
        which nodes are active -- this is not a separate authorization check bolted onto either
        surface, it is the same generic evaluator consulted from two call sites.
      default_visible_when_unbound: >-
        A node with no visibilityBinding is unconditionally visible, exactly as every node
        renders today. This is the explicit backward-compatibility invariant: adopting this
        contract changes NOTHING about any existing manifest's rendered output, because no
        existing record/node authors visibilityBinding -- the gap this contract closes only
        manifests once a subsequent implementation_change actually authors the field (e.g. onto
        manifest 092's category/section records).
      declare_before_evaluate: >-
        The source slot MUST be predeclared (via UI監視割当 stateJson on the DRIVING node) before
        ANY visibility-bound sibling can be evaluated -- this is the SAME "declare before mutate"
        invariant admin-uibuilder-ui-structure-wiring-ssot.yaml mutation_authority_unification
        already enforces for writes, extended here to "declare before READ" for this new consumer.
        stateJson's actual persisted shape (frontend/lib/uiBuilderWiringProjection.ts
        deriveUiWatchBindings) is a flat {"<stateKey>": <initialValue>} map -- the JSON property
        NAME is the stateKey and its VALUE is the initialValue directly, never a
        {"stateKey":..,"initialValue":..} wrapper object (that shape does not exist anywhere in
        the real declaration carrier; ui_watch_binding.fields_examples names stateKey/initialValue
        as concepts, not literal JSON keys). credential_category_filter's own stateJson is
        therefore {"selectedCategory": "<default category key>"} -- one property per declared
        slot, so a node may predeclare more than one slot in a single stateJson object.
        initialValue is what grounds a manifest's default-visible category -- e.g. manifest 092's
        fixed_form_projection metadata default_category value is authored as this exact
        initialValue on credential_category_filter's own stateJson declaration, the canonical
        declaration carrier, instead of an informal metadata field with no runtime consumer.
      write_side_dynamic_value: >-
        The driving node's UI状態更新 write MUST carry the value the user actually picked (e.g.
        credential_category_filter's newly selected option), never a single fixed literal --
        otherwise a select offering N categories could only ever write one of them. This is NOT a
        new write lane: it is the EXISTING setState/localStateMutation actionType's payloadFrom
        field (already generic on every runtimeInteraction) declaring payloadFrom.value =
        "event.<path>" (e.g. "event.value") -- the SAME event.<path> grammar
        dispatchExternalPort/dispatchInstanceOperation/admin_runtime payloadFrom resolution already
        use (docs/design/ui-builder-preset-ecosystem-ssot.yaml payloadFrom_resolver_contract), now
        also consumed by resolveUiStateUpdateMutationValue (frontend/runtime/uiEventEffectRunner.ts)
        at the moment a UI状態更新 mutation actually applies -- never resolved earlier, since the
        real event does not exist yet at renderEmission()'s build time. A lifecycle-triggered
        UI状態更新 (initial_mount/route_enter/initial_display) that names an event.<path> source has
        no real event to resolve against and fails close explicit
        (RUNTIME_STATE_UPDATE_VALUE_FROM_REQUIRES_EVENT) rather than writing undefined -- dynamic
        value resolution is meaningful only for a genuinely user-triggered UI状態更新.
      invalid_binding_fail_close: >-
        A visibilityBinding whose source resolves to an UNDECLARED slot at evaluation time is a
        real authoring defect even though ParseRecords' own schema-level shape check already
        passed it (source shape and matchValue scalar-ness are the only things knowable at
        records[]-parse time; whether that exact <nodeId>.<stateKey> slot is ever actually
        declared by a real UI監視割当/predeclareProjectionState call is knowable only at render
        time, against the live node list): it renders as an explicit error node
        (STRUCTURAL_VISIBILITY_BINDING_SOURCE_UNDECLARED / STRUCTURAL_VISIBILITY_BINDING_INVALID),
        mirroring CATALOG_COMPONENT_KIND_REQUIRED and RUNTIME_INTERACTION_UNATTRIBUTABLE's existing
        fail-close posture at the same layer -- never silently treated as "no binding" (always
        visible) and never as "binding present, condition false" (always hidden); both would
        paper over a real authoring defect exactly as absent_vs_invalid_records already refuses
        to do for records[] itself. A tensor-only-authored node never reaches this render-time
        check carrying a visibilityBinding at all -- see record_carrier_tensor_only: that authoring
        surface fails an entire layout_patch_json save closed (LAYOUT_PATCH_VISIBILITY_BINDING_
        NOT_ALLOWED) the moment the key is present, well-formed or not.
      authority_non_promotion: >-
        visibilityBinding's resolved boolean is a PRESENTATION decision only. It MUST NOT be
        forwarded as dispatch payload authority, MUST NOT be persisted as canonical/business data,
        and MUST NOT be read by backend composition (see static_topology_authority_boundary) or
        by any server-side authority/search-filter decision -- hiding a subtree is not a security
        or authorization boundary, and this contract creates none. Category-scoped SEARCH RESULT
        filtering (which rows a category's search dispatch response contains) remains the
        SEPARATE, already-existing mechanism of a dispatch payload carrying the selected category
        server-side; this contract governs STRUCTURAL SUBTREE MOUNTING only, never row-level data
        filtering, and the two are not required to share an implementation, only permitted to
        share the SAME selection state as their common input.
      presentation_component_independence: >-
        visibilityBinding.source is only a ui-local:<nodeId>.<stateKey> reference -- it does not
        name, and this contract does not define, which componentKind produced the write.
        select.template's onChange, tabs.template's onSelect, or any future primitive's own event,
        are equally legal drivers through the SAME existing UI状態更新 lane. docs/design/admin-
        normal-surface-projection-seed-ssot.yaml surface_axes.admin.surfaces.credentials.
        seed_contract's existing credential_category_filter: select.template declaration is
        UNCHANGED by this contract and remains its FIRST CONSUMER/evidence, never its authority
        owner or its presentation-shape mandate -- a future consumer is free to drive the exact
        same source slot from a tabs.template node instead, with zero change to this contract.
      relationship_to_disclosure_state_wiring: >-
        disclosure_state_wiring (react-schema-topology-seed-translator-ssot.yaml
        wiring_lane_contract.lanes.disclosure_state_wiring) remains the boolean open/close/toggle
        family scoped to OVERLAY_OPENABLE_COMPONENT_KINDS (modal/drawer/dialog) -- unaffected, not
        superseded, not merged into this contract. visibilityBinding is a general single-value-
        equality condition over ANY ui-local:<nodeId>.<stateKey> slot, consumed by structural
        mount/unmount rather than an "open" prop, and is not restricted to overlay component
        kinds. The two lanes may compose on the same node without conflict (e.g. a Modal nested
        inside a category subtree also gated by visibilityBinding) because they answer different
        questions -- is this node in the tree at all, versus whether this specific overlay's own
        open state is true -- never the same question asked twice.
      prohibited:
        - backend_composition_reading_frontend_selection_or_local_state_to_include_exclude_or_reorder_layoutnoderecords
        - a_second_parallel_state_store_independent_of_the_existing_projection_local_runtime_state_store
        - css_display_or_visibility_or_hidden_attribute_used_as_a_substitute_for_actual_unmount
        - credential_management_manifest_092_or_any_specific_uuid_or_category_literal_hardcoded_into_layoutprojectiontree_renderemission_projectionshell_or_uieventeffectrunner
        - a_dedicated_route_island_or_runtime_destination_introduced_for_conditional_visibility
        - fixing_the_presentation_component_to_tabs_or_select_as_part_of_this_contract
        - a_set_membership_or_negation_or_boolean_expression_condition_grammar_beyond_single_value_equality_without_its_own_design_change
        - treating_an_undeclared_or_malformed_visibilityBinding_source_as_always_visible_or_always_hidden_instead_of_an_explicit_fail_close_error
        - visibilityBinding_resolved_value_forwarded_as_dispatch_payload_authority_or_persisted_as_canonical_data
        - adopting_this_contract_changing_any_existing_manifests_rendered_output_absent_an_authored_visibilityBinding
        - authoring_visibilityBinding_on_a_catalog_component_leaf_or_any_record_type_outside_authored_record_type_scope
        - declaring_a_separate_valueType_carrier_or_field_for_matchValue_that_no_production_path_actually_backs
        - a_hidden_nodes_lifecycle_interaction_firing_because_only_DOM_mount_was_checked_and_the_effect_runners_own_node_list_was_not
        - authoring_visibilityBinding_directly_on_a_layout_patch_json_tensor_only_node_on_any_layout_shape_well_formed_or_malformed_alike_see_record_carrier_tensor_only
        - a_categorys_visibilityBinding_matchValue_assumed_equal_to_its_own_physical_topology_ui_category_node_key_without_checking_the_actual_live_state_value_vocabulary_the_driving_control_produces
        - an_empty_or_unauthored_options_list_on_the_driving_selector_control_treated_as_a_completed_category_selector
