runtime_orchestration_ssot:
  name: topolactor_runtime_orchestration_ssot
  version: 0.1.0
  status: ssot_design_document

  purpose:
    - hardcoded_runtime_wiring_boundary
    - manifest_db_variable_control_surface
    - runtime_timeline_scheduler
    - manifest_dispatcher
    - frontend_api_trigger_and_sse_projection
    - backend_topology_transform_and_attractor

  verification_reference:
    scope_statement: This SSOT defines runtime flow, ownership, and boundary invariants.
    pipeline_continuity_reference:
      source: docs/design/pipeline-continuity-ssot.yaml
      owns:
        - pipeline_and_lane_verification
        - required_identity_contracts
        - completion_condition_contracts
        - pipeline_body_test_contracts
        - csharp_dotnet_application_side_ci
    ci_contract_reference:
      source: docs/design/ci-contract-ssot.yaml
      owns:
        - orchestration_vocabulary_audit_contract
        - pipeline_lane_contract_loader_and_audit
        - minimal_gate_vs_dotnet_semantic_assertion_responsibility_split
    system_ci_admin_runtime_callable_surface_reference:
      source: docs/design/system-ci-admin-runtime-callable-surface.yaml
      owns:
        - AdminRuntime_ExecuteDataAsync_to_system_ci_diagnostic_interface_route_contract
        - admin_runtime_diagnostic_read_surface_boundary
        - SystemOperationCiRuntime_is_the_existing_diagnostic_implementation_source_for_the_callable_surface
      note:
        - callable_interface_wiring_is_implemented_for_AdminRuntime_ExecuteDataAsync_system_ci_list_targets_and_system_ci_inspect
        - production_dispatch_route_reachability_requires_manifest_and_structure_map_registration_for_admin_system_ci_actions
        - future_scope_is_frontend_diagnostic_panel_surface_not_backend_callable_interface_wiring
    orchestration_change_rule: Runtime orchestration changes that affect a lane must update or validate the corresponding pipeline-continuity lane contract.
    non_duplication_rule: Do not duplicate detailed lane test conditions in this SSOT; keep fine-grained verification in pipeline-continuity SSOT.

  naming:
    system: runtime_orchestration_os
    scheduler: runtime_timeline_scheduler
    scheduler_alias: runtime_queue_scheduler
    dispatcher: manifest_dispatcher
    frontend_api_lane: client_command_lane
    frontend_sse_lane: projection_event_lane
    frontend_projection_runtime: projection_runtime
    frontend_constructor: projection_constructor
    backend_runtime: topology_transform_runtime
    backend_attractor: registry_attractor
    topology_payload: topology_payload
    topology_function_interface: topology_function_interface
    topology_function_binder: topology_function_binder

  boundaries:
    hardcoded:
      - wiring_routes
      - abstract_function_shapes
      - runtime_skeleton
      - scheduler_skeleton
      - dispatcher_skeleton
      - endpoint_shape
    data_defined:
      - manifest_db_records
      - role_definition
      - route_projection_definition
      - ui_projection_definition
      - dispatcher_mapping
      - runtime_mapping
      - topology_function_binding_mapping
      - projection_constructor_mapping
      - function_parameters
      - registry_attractor_policy
    prohibited:
      - runtime_policy_hidden_in_constants
      - frontend_sql_attention_judgment
      - scheduler_as_data_polling_owner
      - dispatcher_as_execution_order_owner
      - direct_vector_authoring_from_client
      - silent_fallback_for_broken_topology_refs
      - backend_entity_constructor_factory
      - treating_test_runner_or_shell_ci_as_admin_runtime_diagnostic_lane

  endpoints:
    frontend:
      count: 1
      role: application_projection_entry
    backend:
      count: 1
      role: runtime_command_entry
      request_subject: topology_payload_or_manifest_operation

  frontend_routes:
    public:
      - /
      - /auth
      - /super_auth
    admin:
      - /admin
      - /admin/manifests
      - /admin/contents
      - /admin/ui-builder
      - /admin/team-dashboard
      - /admin/enums
      - /admin/users

  trigger_contract:
    kind_enum:
      - cron
      - hook
      - client
    kinds:
      cron:
        source: schedule
        examples:
          - retention_cleanup
          - registry_attractor_rebuild
          - delayed_runtime_execution
      hook:
        source: event
        examples:
          - db_notify_listen
          - external_webhook
          - internal_runtime_event
          - topology_changed
      client:
        source: ui_operation
        examples:
          - button_action
          - form_submit
          - route_action
          - admin_operation
    invariants:
      - trigger_kind_is_not_runtime_destination
      - trigger_enters_scheduler_before_runtime
      - allowed_trigger_kinds_are_cron_hook_client

  scheduler_contract:
    name: runtime_timeline_scheduler
    alias: runtime_queue_scheduler
    role: runtime_time_axis_queue
    input:
      - cron_trigger
      - hook_trigger
      - client_trigger
    output:
      - scheduler_aligned_runtime_event
    allowed_driver_loops:
      - cron_trigger_time_driver_loop
      - delayed_runtime_time_driver_loop
      - background_service_as_trigger_driver
    owns:
      - trigger_alignment
      - runtime_queue
      - runtime_phase
      - runtime_context
      - runtime_state_window
      - causal_order
      - execution_boundary
      - collision_control
    not_owns:
      - target_runtime_selection_policy
      - role_semantics
      - topology_meaning_judgment
      - polling_primary_behavior
    frontend_scope:
      role: ui_time_axis_controller
      manages:
        - client_command_order
        - sse_projection_order
        - projection_batch_boundary
        - optimistic_update_boundary
        - rollback_boundary
    backend_scope:
      role: topology_time_axis_controller
      manages:
        - topology_payload_processing_order
        - vector_conversion_order
        - topology_json_linking_order
        - registry_attractor_update_boundary
        - response_boundary
        - db_notify_boundary

  dispatcher_contract:
    name: manifest_dispatcher
    input:
      - scheduler_aligned_runtime_event
      - manifest_mapping
    output:
      - runtime_destination
      - manifest_projection_response
    manifest_query_output:
      input:
        - manifest_id
      output:
        - manifest_projection_response
    axes:
      - trigger_kind
      - role
      - target
      - layer
      - action
      - manifest_id
    manifest_authority:
      - role_definition
      - dispatcher_mapping
      - runtime_mapping
      - db_notify_projection_mapping
      - ui_projection_mapping
      - ui_projection
      - topology_function_binding_mapping
      - projection_constructor_mapping
    manifest_resolution:
      api:
        key: [role, target, layer, action]
        strategy: resolve_active_manifest_by_axes
        role_source: jwt_token_claim
      sse:
        key: manifest_id
        source: db_notify_payload
    prohibited:
      - role_behavior_hardcoded_in_dispatcher
      - dispatcher_silent_fallback
      - dispatcher_bypassing_scheduler_alignment

  ui_projection_render_reachability_contract:
    note: >-
      Minimal design addendum (credential-management hub relation / navigation / ui_projection
      bundle) closing a description gap between db-schema.yaml's ui_projection refs-only shape
      (packages.manifest_reference: manifest.topology[ui_projection].packageIds) and this
      dispatcher_contract, which did not previously name ui_projection in manifest_authority.
      Scope is limited to connecting an existing topology manifest's ui_projection /
      hubs.hub_relations to the projection entry that manifest_dispatcher already resolves — it
      does not authorize a new dedicated route/panel or a new runtime_destination.
    disambiguation:
      ui_projection_mapping: auth_login_form_field_mapping_topology_entry_type_unrelated_to_ui_projection
      ui_projection: refs_only_packageIds_layoutId_wiringId_tensorId_topology_entry_type_per_db_schema_yaml_packages_manifest_reference
    ui_projection_resolution:
      owner: manifest_dispatcher
      applies_to: any_resolved_manifest_regardless_of_runtime_destination
      rule: >-
        After manifest resolution (any axes/target_ref/db_notify path) and before returning the
        response, manifest_dispatcher resolves manifest.topology[ui_projection].layoutId (when
        present and Emission.LayoutId is not already set by the structure-map-driven
        topology_transform_runtime pipeline) into Emission.LayoutId / Emission.LayoutNodes /
        Emission.PackageId, reusing the same topology.ui_topology_tensor /
        topology.ui_wiring_registry load and node-validation path as the structure-map pipeline
        (TopologyRepository.LoadLayoutNodesAsync, StructureMapResolver.ValidateLayoutNodes).
      fail_close: >-
        A ui_projection.layoutId that resolves to zero tensor nodes, or fails structural node
        validation, is an explicit Emission.Errors entry (LAYOUT_NODES_NOT_FOUND or the
        structure-map validation error code) — never a silent empty render.
    hub_navigation_resolution:
      owner: manifest_dispatcher
      applies_to: any_resolved_manifest_regardless_of_runtime_destination
      rule: >-
        manifest_dispatcher attaches the manifest-scoped hubs.hub_relations navigation sequence
        (Emission.NavigationSequence, "current hub relation" candidates) and the resolved
        manifest identity (Emission.ManifestId, "current topology phase") for any
        runtime_destination via HubNavigationResolver, not only topology_transform_runtime
        (RuntimeExecutor already performed this for its own path prior to this addendum).
      target_manifest_resolution: >-
        HubNavigationSequenceItemDto.TargetManifestId is resolved only when exactly one active
        hubs.topology_manifests row exists for NavigationSequence[].RelatedHubId — no implicit
        oldest/first-match fallback (mirrors topology.physical_table_manifest_bindings'
        no_implicit_join_nullable_fallback_or_oldest_manifest_fallback invariant in
        db-schema.yaml). Null/absent means the frontend must treat the related hub as not
        directly callable, never guess a target.
    admin_runtime_structural_read_fallback:
      owner: manifest_dispatcher
      trigger: >-
        A manifest with a declared ui_projection entry and runtime_destination=admin_runtime
        receives a screen-read axes combination (layer/action recognized by
        ScreenDataShapeTopologyReader.IsScreenReadAction) that has no matching admin action
        registered in AdminRuntime.ExecuteDataAsync (ADMIN_OPERATION_NOT_FOUND).
      rule: >-
        manifest_dispatcher treats this combination as a structural render-only entry rather
        than a hard dispatch failure — it synthesizes an empty-success Emission so the
        ui_projection resolution above can still reach LayoutNodes. This does not fabricate
        business data: row/data population for this class of manifest is owned by whatever
        separately-tracked authoring surface the manifest's own projection design declares
        (e.g. instance_settings_admin_authoring_ui_pending for
        auth.external.credential_management.projection — see
        docs/projection_design/credential-management-projection-design.md).
      boundary: >-
        Only ADMIN_OPERATION_NOT_FOUND on a screen-read axes combination is eligible for this
        fallback. Any other admin_runtime error (including ADMIN_OPERATION_NOT_FOUND on a
        non-screen-read axes combination) is returned unchanged as a real failure.
    test_proof_contract:
      note: >-
        Minimal design addendum defining what a completion proof for this reachability contract
        must observe, so a future seed/topology-manifest reachability task is audited by
        "does a seed UUID resolve all the way to a scalar Emission field" rather than "does a
        seed/refs-only shape exist". This constrains proof surfaces such as
        backend/tests/Topolactor.Integration.Tests/CredentialManagementHubRelationUiProjectionLiveDbTests.cs
        and their frontend counterpart in frontend/tests/projectionEntry.test.ts. It introduces
        no new runtime_destination, route, or panel authority — see the
        ui_projection_render_reachability_contract note above.
      test_input_shape:
        relation_uuid: hubs.hub_relations.hub_relation_id under proof
        hub_ids: >-
          array of hubs.hub_relations.related_hub_id values reachable from relation_uuid's
          source topology_manifest, ordered by sequence_position (the manifest-scoped relation
          vector / route vector — see db-schema.yaml hubs_hub_relations_sequence, not a global
          hub-to-hub graph)
        package_ids: >-
          array of package identifiers a proof expects Emission.PackageId to be a member of,
          sourced from manifest.topology[ui_projection].packageIds
      resolution_chain:
        - hub_relation(relation_uuid) resolves its source topology_manifest via topology_manifest_id
        - the source topology_manifest resolves hub_ids[] through its active hubs.hub_relations
            rows ordered by sequence_position
        - the source topology_manifest resolves package_ids[] through manifest.topology[ui_projection].packageIds
        - package_ids[] connect to topology.components_package_design (the manifest-facing
            package authority — db-schema.yaml packages.manifest_reference — not
            topology.ui_component_package)
        - manifest.topology[ui_projection].layoutId connects to topology.components_layout_design
            / topology.ui_wiring_registry / topology.ui_topology_tensor
        - backend dispatch (ManifestDispatcher.DispatchAsync) resolves the topology_manifest and
            reaches a scalar Emission — not a repository method called directly with a hardcoded
            id constant
        - the scalar Emission carries ManifestId / NavigationSequence / PackageId / LayoutId /
            LayoutNodes, and NavigationSequence[].RelatedHubId observably corresponds to hub_ids[]
        - frontend round-trip: NavigationSequence[].TargetManifestId -> resolveHubNavigationLinks
            -> ?manifest=<uuid> href -> parseProjectionEntrySelection -> resolveProjectionEntryAxes
            -> payload.target_ref = manifest:<uuid>:projection_entry (the same target manifest,
            not merely a rendered label)
      proof_boundary:
        - a completion proof must dispatch through ManifestDispatcher.DispatchAsync, not call a
            layout/tensor repository method directly with a hardcoded layoutId/packageId constant
        - seed / refs-only-shape existence alone is not proof; the refs must be observed
            resolving into scalar Emission fields
        - hubs.hub_relations must be observed as a manifest-scoped relation vector (array-verified
            hub_ids[] ordered by sequence_position), not only as a CRUD/list surface
        - TargetManifestId must be observed resolving only when exactly one ACTIVE
            hubs.topology_manifests row exists for a related hub (zero, deprecated-only, or
            multiple-active must all resolve to no target — never an oldest/first/MIN implicit
            fallback)
        - this contract does not authorize a dedicated credential-management route, dedicated
            panel, or new runtime_destination

    canonical_default_entry_contract:
      note: >-
        Minimal design addendum defining the means by which a bare/no-selection projection entry
        (frontend/runtime/projectionEntry.ts resolveProjectionEntryAxes({}) -- no route, no
        explicit manifest, no pre-injected payload.target_ref) resolves an initial manifest.
        Distinct from hub_navigation_resolution above, which resolves OUTBOUND navigation links
        from an ALREADY-resolved manifest -- this contract is consulted BEFORE any manifest is
        resolved, as the initial-resolution fallback itself.
      owner: hubs.hub_relations
      marker:
        field: relation_config.transition
        value: canonical_default_entry
      singularity: >-
        Exactly one active hubs.hub_relations row may carry this marker at a time. Zero rows
        means no canonical default entry is configured. Two or more rows is a configuration
        error, never a first-match silent pick.
      resolution_priority: >-
        Consulted by manifest_dispatcher only as a fallback for the exact axes combination
        target=default, layer=screen_list, action=Search, and only when both normal
        manifest_resolution.api (role/target/layer/action) axes matching AND payload.target_ref
        are absent/unmatched. This is not a general MANIFEST_NOT_FOUND rescue for arbitrary axes,
        and it never overrides an explicit ?route=/?manifest=/payload.target_ref selection.
      active_status_requirement: >-
        Resolves only when BOTH the marked hubs.hub_relations row itself has status=active AND
        the manifest row it names (via hubs.hub_relations.topology_manifest_id) has status=active.
        A marked relation naming a draft/deprecated manifest resolves to no manifest (fail-close),
        never a stale/inactive projection.
      role_boundary: >-
        No role-axis filtering is applied to this fallback (mirrors the default/screen_list/Search
        axes' own public-entry semantics) -- any authenticated session may reach the canonical
        default entry manifest this way, same as an explicit ?manifest= selection would.
      failure_semantics:
        missing: >-
          No row carries the marker, or the named manifest is not active -> MANIFEST_NOT_FOUND,
          identical to the pre-existing no-fallback-configured error -- never a guessed manifest.
        ambiguous: >-
          More than one active row carries the marker -> CANONICAL_DEFAULT_ENTRY_AMBIGUOUS, an
          explicit configuration-error response -- never a silent first-match pick.
      prohibited:
        - unscoped_sequence_position_1_global_scan
        - resolving_a_draft_or_deprecated_manifest_as_default_entry
        - treating_this_marker_as_a_substitute_for_hub_navigation_resolution_navigation_sequence
        - dedicated_route_panel_or_runtime_destination_for_this_fallback
      test_proof_contract:
        note: >-
          A completion proof for this contract must dispatch the EXACT bare-entry axes
          combination through ManifestDispatcher.DispatchAsync (never a hardcoded manifest id
          constant fed directly into a repository method), against canonical (non-demo) seed
          data, and observe Emission.ManifestId / Emission.LayoutNodes resolving -- not merely
          that the marker row exists in seed SQL.
        negative_cases:
          - draft_or_deprecated_manifest_named_by_the_marked_relation_resolves_to_no_manifest
          - two_active_rows_carrying_the_marker_resolves_to_canonical_default_entry_ambiguous
          - no_row_carrying_the_marker_resolves_to_manifest_not_found

    layout_schema_structural_render_contract:
      note: >-
        Minimal design addendum defining render-completion semantics for
        topology.components_layout_design.layout_schema_json.records[] -- the structural
        authority tree, distinct from topology.ui_topology_tensor.layout_patch_json.nodes[] (the
        flat runtimeInteractions carrier). Render completion is defined as zero
        componentType==="error" specs after frontend renderEmission() over the composed
        LayoutNodes -- tensor-node presence alone is not render completion.
      authority_boundary_with_translator_ssot: >-
        docs/design/react-schema-topology-seed-translator-ssot.yaml owns the SEED EMISSION shape
        for these record types (react_schema_contract.allowed_node_kinds,
        topology_ui_seed_contract.record_types, exchange_mapping.schema_to_seed_record_mapping)
        -- what fields a record carries and how react_schema authoring produces it. This contract
        owns the RUNTIME PROJECTION/RENDER shape for the same record types once they reach
        components_layout_design.layout_schema_json.records[] -- whether a recordType becomes a
        structural_node, a catalog_component (and by which resolution convention), or an explicit
        unresolved_gap failure. Neither SSOT restates the other's authority; a record's runtime
        classification below must cover every recordType the translator's
        layoutAdoptionCandidates.source_record_types enumerates, and the translator's
        projection_render_exchange_contract cross-references this section rather than
        re-deriving the classification.
      structural_record_vocabulary:
        structural_node_record_types:
          - topology_ui_category
          - topology_ui_section
          - topology_ui_form
          - topology_ui_workflow
          - topology_ui_validation
        catalog_component_record_types:
          - topology_ui_field
          - topology_ui_action
          - topology_ui_table
          - topology_ui_workflow_step
        unresolved_gap_record_types:
          - topology_ui_unresolved
        rule: >-
          Category/Section/Form/Workflow/Validation compose into LayoutNode.NodeKind=
          "structural_node" entries -- never a componentId/componentKind, resolved via no
          registry lookup. Field/Action/Table/WorkflowStep compose into NodeKind=
          "catalog_component" entries whose componentId/componentKind are resolved from the
          existing topology.ui_component_registry preset catalog (see field_control_resolution
          and table_display_resolution below) -- never invented, never a structural-node-shaped
          catalog entry. Unresolved (topology_ui_unresolved) is neither: it composes into
          NodeKind="unresolved_gap" and always renders as an explicit error carrying its
          knownGapRefs (see unresolved_gap_resolution below) -- it is a terminal known-gap marker,
          not a resolvable leaf and not a container.
        field_control_resolution: >-
          A Field record's authored control value (e.g. form_input/select) maps to an existing
          ui_component_registry.component_key by fixed convention
          (LayoutSchemaTensorComposer.FieldControlToComponentKey); an Action or WorkflowStep
          record maps to the shared button.primitive/action-button entry (WorkflowStep shares
          Action's exact required-field shape -- actionRef/eventBinding/authorityMarker -- and the
          translator's own storage_adoption_contract.adoption_candidate_separation_contract
          already treats the two identically across wiringAdoptionCandidates/
          tensorAdoptionCandidates; runtime resolution follows the same pairing). An unresolvable
          control leaves componentId/componentKind null -> CATALOG_COMPONENT_KIND_REQUIRED at
          render time, never a silent guess.
        table_display_resolution: >-
          A Table record's authored display value (e.g. card_list, data_grid, list) maps to an
          existing ui_component_registry.component_key by fixed convention
          (LayoutSchemaTensorComposer.TableDisplayToComponentKey), reusing the same registry rows
          ui-builder-preset-ecosystem-ssot.yaml presets already declare for table-shaped surfaces
          (card_list.primitive, data_grid.alias, list.alias) -- never a new registry row invented
          for this contract. An unresolvable display value leaves componentId/componentKind null
          -> CATALOG_COMPONENT_KIND_REQUIRED at render time, identical treatment to an
          unresolvable Field control.
        unresolved_gap_resolution: >-
          A topology_ui_unresolved record composes into a NodeKind="unresolved_gap" LayoutNode
          carrying its knownGapRefs. frontend renderEmission() always renders an unresolved_gap
          node as componentType="error" (code TOPOLOGY_UI_UNRESOLVED_GAP_REF), surfacing knownGapRefs in the
          error def -- never resolved to a componentId, never silently dropped, never treated as
          a resolvable catalog_component or a structural_node. A layout containing an
          unresolved_gap node cannot reach render completion (zero error specs) until the
          authored gap is actually resolved and the record is replaced -- this is correct
          behavior, not a defect in this contract: render completion must not paper over a real
          unresolved authoring gap the translator itself flagged.
        tensor_runtime_interactions_merge: >-
          topology.ui_topology_tensor nodes key their runtimeInteractions array at the FORM
          level; each entry carries its own sourceActionKey identifying the specific Field/Action
          leaf it belongs to. Composition groups entries by "{formTensorNodeId}::{sourceActionKey}"
          (never sourceActionKey alone) and merges each leaf's own matching entries by
          "{parentKey}::{key}" -- never a naive tensor-nodeId==record-key match (the tensor
          nodeId is the form's key, a structural node, which never receives runtimeInteractions)
          and never a bare-sourceActionKey match, which would cross-contaminate two different
          Forms that happen to author the same leaf key (Action/Field keys are only guaranteed
          unique within their own owning Form, the same way record keys are only guaranteed
          unique within their own branch -- see node_id_collision_handling). A malformed tensor
          runtimeInteractions shape (invalid JSON, a non-array value, a non-object entry, or an
          entry missing a non-empty sourceActionKey) is a real authoring defect ->
          LAYOUT_SCHEMA_RUNTIME_INTERACTIONS_INVALID, never silently skipped
          (LayoutSchemaTensorComposer.BuildInteractionsBySourceActionKey).
        runtime_interaction_attributability: >-
          A catalog_component leaf's authored runtimeInteractions may still be well-formed JSON
          yet carry an actionType outside the recognized runtime taxonomy (dispatchExternalPort,
          dispatchInstanceOperation, or a classified UI-state-update actionType) -- e.g. a real
          seed authoring an actionType the frontend event-binding pipeline does not implement.
          Such an entry resolves to zero recognized event bindings; frontend renderEmission()
          detects this (authored runtimeInteractions present, zero resulting bindings) and fails
          explicit as componentType="error" (code RUNTIME_INTERACTION_UNATTRIBUTABLE) at the same
          layer CATALOG_COMPONENT_KIND_REQUIRED already lives -- never silently rendered as a
          normal, unbound component that would only fail later, cryptically, deep inside the
          runtime factory (a RUNTIME_PRIMITIVE_RENDERER_MISSING_EVENT_BINDING crash renderEmission
          itself never sees). This is an authoring/wiring-completeness gap in the seed content,
          never a structural-render or projection-identity defect -- a layout containing such a
          leaf cannot claim render completion for that leaf until the interaction actually gains
          a recognized runtime handler or is removed, the same posture unresolved_gap already
          takes.
        localStateMutation_taxonomy: >-
          react-schema-topology-seed-translator-ssot.yaml
          wiring_lane_contract.lanes.internal_instance_wiring already declares localStateMutation
          as a canonical example (alongside modal_open_close/drawer_open_close/selected_row/
          tab_state) with targetRef_shape "ui-local:<nodeId>.<stateKey>" and no backend dispatch
          -- it is a UI-state-update actionType, not an unattributable one. Frontend
          wiringSettingCategoryOf classifies it as ui_state_update;
          resolveUiStateUpdateMutation resolves targetNodeId/statePath by parsing this targetRef
          when no separate targetNodeId/statePath field is present, and writes true (a flag
          write, the same "set true" semantic as openModal/openDrawer/openDialog -- never an
          invented business-data value the seed record does not carry). A catalog_component leaf
          whose runtimeInteractions consist entirely of correctly-shaped localStateMutation
          entries is therefore attributable and must not hit RUNTIME_INTERACTION_UNATTRIBUTABLE.
        authored_label_and_production_props: >-
          Every schema record carries an authored label (record_common_required_fields); a
          catalog_component leaf's LayoutNode.Label carries it through composition exactly like a
          structural_node's does -- never discarded. Frontend production (non-preview) rendering
          must build default props from this authored label and never inject the UI-Builder
          canvas-preview placeholder's inert content (a hardcoded caption, a fabricated sample
          option list, or action/button's forced disabled:true) -- a schema-composed leaf never
          carries node-local propsJson/design to override that placeholder, so reusing it
          unconditionally for production would make every schema-composed action permanently
          un-clickable in the real DOM.
        node_id_collision_handling: >-
          A record's authored key is only guaranteed unique within its own branch -- the seed
          schema permits the same key in two branches (a real, observed case: manifest 092's
          "approval_status" field appears under both user_auth_section and
          instance_operation_approval_form). Composition namespaces a colliding key as
          "{parentKey}::{key}" instead of colliding or silently dropping one occurrence.
        parent_scoped_identity_reconstruction: >-
          A colliding container key (e.g. two Sections both authored as "shared_section" under
          different Categories) is not merely a NodeId-string concern -- every child nested under
          EITHER duplicate must still resolve ParentNodeId to the SAME physical instance it was
          actually nested under, never to whichever duplicate happens to match by raw key.
          Composition resolves ParentNodeId by walking records in authored document order
          (already parent-before-child) and tracking each key's MOST RECENTLY composed NodeId so
          far, rather than a static whole-tree key lookup -- a child's parentKey is matched
          against this running map, so it attaches to the instance immediately preceding it in
          document order (the one it was genuinely nested under), not a static, order-independent
          lookup that cannot distinguish between duplicate instances at all.
        implicit_root_parent_handling: >-
          A record's authored parentKey referencing the translator's implicit/virtual tree root
          (never itself a record in records[]) resolves to a null (top-level) ParentNodeId, not a
          dangling LAYOUT_PATCH_MISSING_PARENT reference.
      absent_vs_invalid_records:
        absent_or_empty: >-
          layout_schema_json has no "records" key, or records is an empty array -> no
          schema-driven composition available; the existing tensor-only LayoutNode path applies
          unchanged (the common case for UI-Builder-authored layouts, where componentId/
          componentKind already live directly on tensor nodes).
        invalid_nonempty: >-
          layout_schema_json has a "records" key that is present and non-empty but malformed
          (not an array; or contains an entry missing a required recordType/key; or an
          unrecognized recordType) is an explicit LAYOUT_SCHEMA_RECORDS_INVALID failure -- never
          silently dropped to the tensor-only path and never a subset tree built by skipping the
          invalid entries.
        rule: >-
          Absence and invalidity are never conflated. A parser must distinguish "no records[] to
          compose from" (fallback is correct) from "records[] exists and is broken" (fallback
          would hide a real authoring defect) -- the same distinction db-schema.yaml's
          no_implicit_join_nullable_fallback_or_oldest_manifest_fallback invariant embodies for
          hub-relation target resolution.
      prohibited:
        - structural_node_receiving_a_componentId_or_componentKind
        - inventing_a_componentId_for_an_unresolvable_control_or_display_value
        - skipping_invalid_records_entries_to_synthesize_a_partial_tree
        - treating_a_malformed_nonempty_records_shape_as_equivalent_to_absent_records
        - judging_render_completion_by_tensor_node_presence_alone
        - rejecting_topology_ui_table_or_topology_ui_workflow_step_or_topology_ui_unresolved_as_an_unrecognized_recordType
        - silently_converting_topology_ui_unresolved_into_a_normal_catalog_component_or_structural_node
        - inventing_a_new_ui_component_registry_row_for_table_display_resolution_instead_of_reusing_declared_preset_rows
        - skipping_a_malformed_tensor_runtimeInteractions_entry_instead_of_LAYOUT_SCHEMA_RUNTIME_INTERACTIONS_INVALID
        - silently_rendering_a_catalog_component_leaf_whose_runtimeInteractions_resolved_to_zero_event_bindings_as_a_normal_component
        - discarding_a_catalog_component_leafs_authored_label_during_composition_or_production_default_props
        - reusing_the_ui_builder_canvas_preview_placeholder_for_production_default_props_of_a_schema_composed_leaf
        - a_schema_composed_action_button_reaching_the_real_dom_with_a_forced_disabled_true_it_never_authored
        - judging_render_completion_by_renderEmission_error_count_alone_without_connecting_layoutProjectionTree_runtimeComponentFactory_and_the_final_dom
        - merging_runtimeInteractions_by_bare_sourceActionKey_across_two_different_forms_that_share_a_leaf_key
        - resolving_a_childs_ParentNodeId_by_a_static_whole_tree_key_lookup_that_cannot_distinguish_between_duplicate_container_instances
      test_proof_contract:
        note: >-
          A completion proof for this contract must observe the composed LayoutNode[] for a real
          representative manifest (manifest 092, resolved through the SAME dispatch path as the
          canonical_default_entry_contract test above) passed through frontend renderEmission()
          with defaultComponentRegistry, and assert zero UNEXPECTED componentType==="error"
          specs in that single representative scenario -- a backend-only unresolved-leaf count
          and a separately hand-authored frontend fixture are each necessary but neither is
          sufficient alone. The proof must also connect renderEmission() output through
          LayoutProjectionTree -> runtimeComponentFactory (renderRuntimeComponent) for the
          well-attributed leaves, not stop at renderEmission()'s own error count -- a leaf whose
          componentEventBinding resolves but whose factory still requires a binding no seed
          content ever authored (e.g. a plain, unwired select field) is a documented,
          out-of-scope business-data/seed-authoring-completeness gap, not a regression of this
          contract, and is excluded from the representative proof's assertion scope rather than
          silently absorbed into it.
        positive_cases:
          - topology_ui_table_record_resolves_to_a_catalog_component_via_table_display_resolution
          - topology_ui_workflow_step_record_resolves_to_a_catalog_component_via_the_same_convention_as_topology_ui_action
          - a_catalog_component_leafs_authored_label_reaches_the_runtime_component_props_in_production_rendering
          - a_schema_composed_action_button_with_a_recognized_dispatchInstanceOperation_interaction_renders_enabled_disabled_false_through_the_real_runtime_factory
        negative_cases:
          - topology_ui_unresolved_record_composes_to_an_explicit_render_time_error_carrying_knownGapRefs_never_a_normal_component
          - a_recordType_outside_structural_node_record_types_plus_catalog_component_record_types_plus_unresolved_gap_record_types_is_LAYOUT_SCHEMA_RECORDS_INVALID_not_silently_skipped
          - a_malformed_or_sourceActionKey_missing_tensor_runtimeInteractions_entry_is_LAYOUT_SCHEMA_RUNTIME_INTERACTIONS_INVALID_not_silently_skipped
          - two_different_forms_authoring_the_same_leaf_key_with_different_runtimeInteractions_never_cross_contaminate_each_others_merge
          - a_duplicate_container_keys_children_attach_to_the_same_instance_they_were_nested_under_not_whichever_duplicate_matches_by_key
          - a_catalog_component_leaf_whose_authored_runtimeInteractions_resolve_to_zero_event_bindings_is_RUNTIME_INTERACTION_UNATTRIBUTABLE_not_a_silent_pass_through_to_the_factory

