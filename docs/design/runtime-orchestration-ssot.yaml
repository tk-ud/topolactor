          mount-conditional AND lifecycle-reachability invariants below in the SAME single
          representative scenario -- none is a substitute for another, and "all LayoutNodes render
          with zero errors" alone (this contract's own predecessor completion bar) must not be
          re-asserted as if it already proved category collapse.
        positive_cases:
          - at_initial_mount_only_the_default_categorys_subtree_is_present_in_the_DOM_the_other_categories_sections_are_absent_not_merely_visually_hidden
          - selecting_a_different_category_through_credential_category_filter_mounts_that_categorys_previously_absent_fields_actions_and_confirm_modals
          - the_previously_active_categorys_fields_actions_and_confirm_modals_unmount_on_the_same_selection_change
          - dispatchTargetRefByTrigger_and_payloadFrom_bindings_on_a_categorys_actions_are_identical_before_and_after_a_round_trip_through_hide_then_show_again
          - a_second_independent_consumer_outside_credential_management_drives_the_same_generic_evaluator_with_no_credential_specific_code_path_involved
          - selecting_an_option_in_credential_category_filter_writes_that_exact_option_value_into_the_predeclared_state_slot_via_event_value_payloadFrom
          - credential_category_filter_renders_a_real_non_empty_options_list_matching_the_backend_search_dispatchs_own_category_enum_exactly_never_an_empty_select
          - the_switch_is_driven_by_a_real_native_change_DOM_event_on_the_real_select_element_never_a_direct_state_store_mutation_standing_in_for_the_users_own_interaction
        negative_cases:
