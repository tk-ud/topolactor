instance_port_substrate_ssot:
  name: instance_port_substrate
  version: 0.1.0
  status: ssot_design_document
  canonical_path: docs/design/instance-port-substrate-ssot.yaml

  design_decision:
    selected_shape: sibling_substrate_not_external_port_extension
    rejected_shape: external_port_substrate_instance_port_extension
    rationale:
      - external_port_substrate owns HTTP/hook/access/response port records for external service ingress and egress.
      - instance_port_substrate owns credential-backed runtime connections to DB/runtime instances and manifest-authorized instance function calls.
      - DB/runtime instance connection authority, SQL function allowlists, timeout policy, and result sanitization require a separate authority boundary from HTTP/hook port dispatch.
      - Keeping this as a sibling prevents external_port_substrate operation_key growth and prevents weakening call_postgres_function's Topolactor-DB-only topology function boundary.
      - The substrate is intentionally consumer-agnostic and must support peer Topolactor instances and external PostgreSQL instances without provider-specific C# handlers.
    external_port_relationship:
      external_port_substrate_ref: docs/design/external-port-substrate-ssot.yaml
      relationship: sibling_substrate_with_shared_credential_requirement_vocabulary
      distinction:
        external_http_hook_ports: access_port / response_port / hook_port dispatch HTTP/service edges and hook intake through external_port_runtime policy steps.
        instance_ports: db_instance_port / runtime_instance_port resolve runtime-only credentials and call manifest-authorized instance functions through instance_port_runtime.
      non_extension_rule: Do not add db_instance_port or runtime_instance_port to external_port_substrate port_kinds.

  purpose:
    summary: >-
      Credential-backed instance connection and instance function call substrate.
      It lets Topolactor resolve a runtime-only credential reference, connect to an authorized
      external DB/runtime instance, and invoke a manifest-authorized abstract function such as
      call_instance_postgres_function without making the external instance a Topolactor runtime SSOT.
    goals:
      - credential_backed_instance_function
      - db_instance_port
      - runtime_instance_port
      - runtime_only_secret_resolution_by_reference_key
      - manifest_authorized_instance_function_call
      - instance_connection_policy
      - instance_function_authority_binding
    non_goals:
      - provider_specific_runtime_handler
      - provider_specific_runtime_selector
      - arbitrary_external_db_function_execution
      - direct_DB_write_from_external_tool
      - external_instance_as_topolactor_runtime_ssot
      - plaintext_connection_string_in_seed_ssot_projection_or_log
      - weakening_call_postgres_function_topology_only_boundary

  port_kinds:
    db_instance_port:
      role: credential_backed_connection_to_database_instance
      examples:
        - primary_external_db
        - reporting_external_db
        - peer_topolactor_reporting_db
      required_fields:
        - instance_authority_key
        - provider_kind
        - required_by_bundle
        - credential_requirement
        - connection_policy_key
        - active
      rule: Connection target values are resolved at runtime from reference_key / vault / runtime secret resolver only; seed and UI carry identifiers, not connection strings or endpoints.
    runtime_instance_port:
      role: credential_backed_connection_to_remote_runtime_instance
      required_fields:
        - instance_authority_key
        - provider_kind
        - required_by_bundle
        - credential_requirement
        - connection_policy_key
        - active
      rule: Runtime instance calls use manifest-authorized functions or commands only; the remote instance is never canonical Topolactor runtime authority.

  credential_requirement:
    fields:
      - credential_kind
      - reference_key
      - db_guarded_vault_or_runtime_secret_reference
      - provider_kind
      - required_by_bundle
    allowed_credential_sources:
      - topology.external_credential_vault_by_reference_key
      - runtime_secret_resolver_by_reference_key
    vault_reuse_decision:
      selected_shape: reuse_topology_external_credential_vault_with_instance_port_context
      rationale:
        - The existing vault already encodes provider_kind, required_by_bundle, reference_key, token_hash, encrypted_payload, lease, and fail-close refresh semantics.
        - Creating instance_credential_vault now would duplicate the guarded vault and risk a standalone credential plane.
        - Future DDL may add instance-specific attachment tables, but plaintext and connection strings must still remain outside seed, SSOT, projection, runtime_event_log, and audit log.
      constraints:
        - provider_kind_is_data_only
        - required_by_bundle_is_data_only
        - no_provider_kind_or_required_by_bundle_CSharp_if_switch_selector
        - no_dedicated_credential_runtime_or_admin_ui
        - plaintext_connection_string_forbidden_in_seed_ssot_projection_log

  runtime_boundary:
    runtime_lane:
      selected_lane: instance_port_runtime
      rationale:
        - external_port_runtime remains the HTTP/hook/access/response port dispatch lane.
        - instance_port_runtime is a sibling lane for credential-backed DB/runtime instance calls.
        - Sharing the external_port_runtime lane would mix hook/HTTP policy operations with instance connection and SQL function authority.
      required_route:
        - manifest_dispatcher
        - abstract_function_runtime
        - instance_port_runtime
        - credential_reference_resolution
        - instance_connection_policy
        - instance_function_authority_binding
        - call_instance_postgres_function_or_call_bound_instance_function
        - result_sanitize_and_secret_deny
      fail_close_statuses:
        - INSTANCE_PORT_RECORD_MISSING
        - INSTANCE_CREDENTIAL_REFERENCE_MISSING
        - INSTANCE_CONNECTION_POLICY_MISSING
        - INSTANCE_FUNCTION_AUTHORITY_MISSING
        - INSTANCE_FUNCTION_NOT_ALLOWLISTED
        - INSTANCE_FUNCTION_SCHEMA_NOT_ALLOWLISTED
        - INSTANCE_RESULT_SECRET_DENIED
        - INSTANCE_TIMEOUT_EXCEEDED
        - INSTANCE_PROVIDER_SELECTOR_FORBIDDEN

  abstract_function_primitives:
    selected_shape: abstract_function_primitive_not_external_port_policy_operation_key
    rationale:
      - call_instance_postgres_function needs manifest, authority binding, input binding, output shape, timeout, and secret-deny enforcement.
      - External port policy operation_key is for port-record policy sequencing and must not become a generic external DB execution surface.
      - call_postgres_function remains limited to Topolactor DB topology.* functions and fixed Topolactor connectionString.
    primitives:
      call_instance_postgres_function:
        role: Invoke a PostgreSQL function on a credential-backed db_instance_port.
        mandatory_authority:
          - function name allowlist
          - schema allowlist
          - instance authority binding
          - required instance_connection_policy
          - required output_shape and secret-deny projection
          - timeout and cancellation policy
          - fail-close on missing binding or sanitizer failure
        prohibited:
          - raw SQL string execution
          - payload_supplied_function_authority
          - frontend_payload_connection_string
          - seed_payload_connection_string
          - arbitrary_external_DB_function_execution
          - fallback_to_call_postgres_function
      call_bound_instance_function:
        role: Generic instance-bound abstract function call wrapper used when the target is not PostgreSQL-specific.
        mandatory_authority:
          - instance_function_authority_binding
          - function_key_binding
          - output_shape
          - secret_deny_projection
      credential_backed_instance_function:
        role: Higher-level contract requiring runtime-only credential resolution before any bound instance function call.
        mandatory_order:
          - resolve_instance_port_record
          - resolve_credential_reference_by_reference_key
          - materialize_runtime_only_connection
          - verify_instance_connection_policy
          - verify_instance_function_authority_binding
          - execute_allowed_function
          - sanitize_result
          - append_audit_without_secret_material

  authority_model:
    instance_connection_policy:
      owns:
        - instance_authority_key
        - credential_reference_key
        - connection_timeout_ms
        - statement_timeout_ms
        - max_result_bytes
        - allowed_schemas
        - allowed_function_names
        - result_sanitize_policy_key
      rule: Policy is data-defined and loaded by manifest/runtime; provider_kind and required_by_bundle remain data labels, not C# selectors.
    instance_function_authority_binding:
      selected_shape: extend_abstract_function_authority_bindings_with_instance_authority_kinds
      required_authority_kinds:
        - instance
        - instance_function
        - instance_schema
        - output
      note: Existing table/policy/output bindings are not enough because external instance authority is not a Topolactor physical table authority.
      binding_rule: The manifest must bind function_key to instance_authority_key plus schema/function allowlist before execution.
    multiple_instance_connections:
      rule: Multiple connection targets are represented by distinct instance_authority_key values, not provider-specific runtime classes.
      examples:
        - instance_authority_key: primary_external_db
          provider_kind: external_postgres
          required_by_bundle: generic_instance_integration
          data_only: true
        - instance_authority_key: reporting_external_db
          provider_kind: external_postgres
          required_by_bundle: analytics_instance_integration
          data_only: true

  call_postgres_function_boundary:
    existing_primitive: call_postgres_function
    invariant: >-
      call_postgres_function remains Topolactor DB only and must keep the ^topology\. function-name boundary plus the Topolactor DB connectionString.
      It must not be generalized for external DB connections.
    new_primitive: call_instance_postgres_function
    separation_rule: call_instance_postgres_function uses instance_port_runtime, instance_connection_policy, reference_key credential resolution, and instance_function_authority_binding.

  generic_consumer_example:
    status: example_only_not_provider_specific_design
    example_manifest:
      abstract_function_key: external_instance.allowed_operation
      runtime_lane: instance_port_runtime
      primitive: call_instance_postgres_function
      function: integration_schema.allowed_operation
      instance_authority_key: primary_external_db
      credential_requirement:
        reference_key: primary_external_db_secret
      result_projection:
        output_shape_required: true
        secret_deny_required: true
    constraints:
      - provider_kind_is_data_constraint_only
      - required_by_bundle_is_data_constraint_only
      - no_provider_specific_runtime_handler
      - no_provider_specific_schema_in_topolactor_db
      - no_external_instance_semantic_authority_in_topolactor_db

  prohibited_patterns:
    - provider_specific_schema_in_topolactor_db
    - external_instance_semantic_authority_in_topolactor_db
    - weakening_topology_only_call_postgres_function
    - frontend_payload_or_seed_payload_connection_string
    - raw_sql_or_table_authority_in_payload
    - provider_kind_or_required_by_bundle_CSharp_branching
    - provider_specific_runtime_handler_as_primary_design
    - credential_plaintext_or_endpoint_real_value_in_ssot_seed_projection_log
    - secret_store_adapter_as_standalone_runtime
    - silent_fallback
    - direct_DB_write_from_external_tool
    - webhook_direct_runtime_execution_without_scheduler
    - arbitrary_external_DB_function_execution
    - external_instance_as_runtime_SSOT

  completion_gate:
    required_before_implemented_claim:
      - SSOT and roadmap are wired as not_started/planned until runtime and DDL are implemented.
      - check-instance-port-substrate.sh passes.
      - call_instance_postgres_function tests prove it does not weaken call_postgres_function.
      - provider_kind and required_by_bundle have no C# if/switch selector.
      - no plaintext credential, connection string, endpoint real value, raw SQL, table authority, or function authority appears in seed, projection, logs, or SSOT examples.
      - abstract_function_authority_bindings or successor manifest binding controls instance/function/schema/output authority.
      - external instance is documented and tested as a call target, not Topolactor runtime SSOT.
