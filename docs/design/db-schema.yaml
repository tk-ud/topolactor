          type: bigint
          role: physical_record_pk
        - name: topology_manifest_id
          type: uuid
          role: soft_reference_hubs_topology_manifests
          note: formerly manifest_id FK to public.manifest; migrated to topology_manifest_id soft reference (no FK constraint)
        - name: snapshot_id
          type: uuid
          role: snapshot_reference_id
        - name: records
          type: jsonb
          role: one_input_row_equals_one_jsonb_record
        - name: status
          type: enum_text
          values: [valid, invalid]
          role: manifest_conformity_status_not_business_or_hub_lifecycle_state

    admin_import_apply_log:
