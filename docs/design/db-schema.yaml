          role: apply_execution_status


  meaning_collision_guardrails:
    - recommendation_lane_boundary: context_transition_stats is ui_pressure only; context_enum_transition_stats is state_pressure only; lanes must not be mixed across these tables
    - context_transition_stats_vs_enum: context_transition_stats tracks operation-level transitions; context_enum_transition_stats tracks enum-item transitions; recommendation_lane assignment is table-specific and must not be swapped
    - hubs_hub_relation_vs_relation_registry: hubs.hub.relation must be JSONB join config over topology.physical_tables.physical_table_id and must not be relation_registry_id.
    - hubs_hub_relation_vs_ui_order: hubs.hub.relation is not UI display or transition order.
    - hubs_space_hierarchy: "hubs.hub -> hubs.topology_manifests -> hubs.hub_relations; hub_relations source hub is derived via topology_manifests.hub_id, not hub_relations.hub_id."
    - hubs_hub_relations_sequence: hubs.hub_relations owns manifest-scoped hub sequence / UI transition order; not a global hub-to-hub relation graph.
    - logs_current_preserved: logs.current is the rebuildable trigger basis; logs.hub_current is an optional support cache / derived current; logs.attention is the append-only SQLAT / phaseAT generation log.
    - sql_attention_target: "SQL Attention resolves related topology_manifest_id arrays and explores hubs.hub_relations; hub_id is derived through hubs.topology_manifests."
    - sql_attention_persistence: "logs.current is a trigger-basis projection, logs.hub_current is not the exploration body, and logs.attention stores append-only evidence generations rather than Draft or adopted canonical state."
    - sql_attention_signal_sources: "logs.diff remains the physical mutation pressure source for logs.current; context_event remains the UI operation pressure source."
    - recommend_target: Recommend target is topology.*, topology.wiring_physical_to_package, topology.components_*, and context_* learning surfaces.
    - public_namespace: public/unqualified tables are drift, not SSOT authority.
    - topologys_namespace: topologys schema has been migrated to topology. All DB SQL and backend use topology.* canonical spelling.
    - manifest_split: unqualified manifest responsibility must split toward topology.wiring_physical_to_package and hubs.topology_manifests.



  manifest_topology_integration_boundary:
    authority:
      - topology.wiring_physical_to_package_defines_single_screen_manifest_wiring
      - hubs.topology_manifests_groups_topology_wiring_for_hub_side_manifest_sets
      - hubs.hub_defines_topology_meaning_space_and_join_definition
    drift_sources:
      - manifest_public_table_must_migrate_to_topology_wiring_or_hubs_topology_manifests_responsibility
      - topologys_schema_must_migrate_to_topology
    non_goal:
      - public_unqualified_table_as_canonical_authority


  active_db_path:
    physical_table_catalog:
      table: topology.physical_tables
      current_sources:
        - topologys.registrar_entries
      meaning: physical table catalog / imported-created-selected physical table id authority
      authority: db
      expected_shape:
        physical_table_id: bigint generated identity
        table_ref: text
      note: >-
        topology.physical_tables is the canonical physical table catalog.
        topologys.registrar_entries naming drift has been migrated to topology schema.

    manifest_hub:
      table: hubs.hub
      current_sources:
        - hubs.hubs
      meaning: topology meaning space / pseudo-RDB physical table group / join definition owner
      authority: db
      sql_attention_target: true
      recommendation_target: false
      expected_shape:
        hub_id: uuid
        status: enum
        relation: jsonb
        created_at: timestamptz
        updated_at: timestamptz
      relation_meaning: JSONB join definition over topology.physical_tables.physical_table_id
      relation_minimum_shape:
        - id: topology.physical_tables.physical_table_id
          relationKey: text
          joinType: text
      prohibited_meanings:
        - bigint_array
        - ui_display_order
        - relation_registry_id
        - runtime_weight
        - logs_current_pressure
      note: >-
        hubs.hub is the canonical name candidate for one topology meaning space.
        relation stores JSONB join config and is not UI order, registry vocabulary,
        runtime weight, or logs pressure.

    topology_manifest_wiring:
      table: topology.wiring_physical_to_package
      current_sources:
        - manifest
        - ui_component_package
        - ui_layout_registry
        - ui_wiring_registry
        - ui_topology_tensor
      meaning: single-screen manifest wiring between physical table / hub / package / layout / wiring
      authority: db
      note: >-
        The existing unqualified manifest table is migration target, not canonical namespace.

    topology_manifest_group:
      table: hubs.topology_manifests
      current_sources:
        - manifest
      meaning: hub-side grouping of topology.wiring_physical_to_package records
      authority: db

    hubs_space_hierarchy:
      tree: |
        hubs.hub
          └─ hubs.topology_manifests
               └─ hubs.hub_relations
      source_hub_derivation: >-
        hubs.hub_relations has no hub_id source authority. Source hub is derived through
        topology_manifest_id -> hubs.topology_manifests.hub_id -> hubs.hub.

    physical_table_manifest_binding:
      table: topology.physical_table_manifest_bindings
      meaning: explicit SQL Attention resolver association from topology.physical_tables to hubs.topology_manifests
      authority: db
      shape:
        binding_id: uuid
        physical_table_id: bigint
        topology_manifest_id: uuid
        active: boolean
        binding_evidence_json: jsonb
      unique_constraint: physical_table_id + topology_manifest_id
      invariant: no_implicit_join_nullable_fallback_or_oldest_manifest_fallback

    manifest_hub_chain:
      table: hubs.hub_relations
      parent: hubs.topology_manifests
      meaning: manifest-scoped hub sequence / UI transition order inside a topology manifest
      authority: db
      shape:
        hub_relation_id: uuid
        topology_manifest_id: uuid
        related_hub_id: uuid
        sequence_position: integer
        relation_config: jsonb
        status: enum active/deprecated
        created_at: timestamptz
        updated_at: timestamptz
      sequence_authority: sequence_position
      unique_constraint: topology_manifest_id + sequence_position
      note: >-
        Child of hubs.topology_manifests. Not a global hub-to-hub relation graph.
        related_hub_id is the sequenced hub entry. relation_config holds optional sequence metadata.
      navigation_target_resolution:
        note: >-
          Minimal design addendum (credential-management hub relation / navigation bundle).
          When a caller (e.g. runtime-orchestration-ssot.yaml
          ui_projection_render_reachability_contract.hub_navigation_resolution) needs a
          navigable topology_manifest for a hub_relations.related_hub_id, the target is
          resolved only when exactly one active hubs.topology_manifests row exists for that
          hub_id — mirroring physical_table_manifest_binding's
          no_implicit_join_nullable_fallback_or_oldest_manifest_fallback invariant above. Zero
          or multiple manifests under the related hub resolve to no target (null), never a
          guessed/oldest/first row.

    sql_attention_targets:
      target_space: hubs
      targets:
        - hubs.hub
        - hubs.hub_relations
        - hubs.topology_manifests
      persistence_surfaces:
        - logs.current
        - logs.hub_current
        - logs.attention
      signal_sources:
        - logs.diff
        - context_event
      meaning: SQL Attention rotates/explores hubs space; logs current/attention tables are persistence surfaces, not targets
      signal_meaning:
        logs.diff: physical table lifecycle mutation pressure source for logs.current and physical_table_id heat / l2_norm basis
      logs.diff_admin_master_roster_projection: >-
        Additional append envelope when source_set_id=admin_master_roster (see
        docs/design/admin-master-roster-management-ssot.yaml). SQL Attention semantics unchanged.
        context_event: UI operation pressure source
      not_targets:
        - logs current/evidence persistence surfaces
        - topology registry tables
        - recommendation learning surfaces

    recommend_targets:
      targets:
        - topology.*
        - topology.wiring_physical_to_package
        - topology.components_*
        - context_* learning surfaces
      meaning: recommendation uses topology and context learning surfaces, not SQL Attention hubs target semantics

    topology_ui_design:
      authority_tables:
        - topology.components_bucket
        - topology.ui_component_registry
        - topology.ui_component_package
        - topology.ui_package_component_map
        - topology.components_layout_design
        - topology.ui_wiring_registry
        - topology.ui_topology_tensor
        - topology.ui_builder_components
        - topology.components_style_design
        - topology.components_package_design
      migration_status: complete
      migration_ddl: db/migrations/ui_topology_to_canonical_schema.sql
      former_sources:
        - public.ui_component_bucket
        - public.ui_component_registry
        - public.ui_component_package
        - public.ui_package_component_map
        - public.ui_layout_registry
        - public.ui_wiring_registry
        - public.ui_topology_tensor
        - public.components
        - public.design
        - public.packages
      meaning: UI component/style/layout/package design authority under topology schema (migration complete)

    logs_current_attention_evidence:
      authority_tables:
        - logs.current
        - logs.hub_current
        - logs.attention
      meaning: SQL Attention current / hub current / attention evidence surfaces to preserve
      not_same_as:
        - hubs.hub.relation
        - hubs.hub_relations.sequence_position

