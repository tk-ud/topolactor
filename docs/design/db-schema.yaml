db_schema:
  name: topolactor_db_schema
  version: 0.1.0
  status: ssot_design_document
  source_files:
    - db/schema.sql
    - db/topology_tables.sql
    - db/promotion_tables.sql
    - db/sql_attention_logs_tables.sql
    - db/context_route_tables.sql
    - db/ui_topology_tables.sql
    - db/manifest_tables.sql

  categories:
    - topology_definition
    - converged_entity
    - promotion_policy
    - sql_attention_observation
    - context_route
    - ui_topology
    - manifest



  canonical_schema_namespaces:
    hubs:
      role: topology meaning space, hub manifest grouping, and fixed hub sequence
      canonical_tables:
        hub: hubs.hub
        topology_manifests: hubs.topology_manifests
        hub_relations: hubs.hub_relations
    topology:
      role: physical table catalog, UI component design/package/layout, and single-screen wiring manifests
      canonical_tables:
        components_bucket: topology.components_bucket
        components_style_design: topology.components_style_design
        components_layout_design: topology.components_layout_design
        components_package_design: topology.components_package_design
        physical_tables: topology.physical_tables
        wiring_physical_to_package: topology.wiring_physical_to_package
    logs:
      role: SQL Attention current, hub current, and attention evidence
      canonical_tables:
        current: logs.current
        hub_current: logs.hub_current
        attention: logs.attention
    namespace_rules:
      - public_or_unqualified_tables_are_schema_drift_not_canonical
      - topologys_schema_is_naming_drift_and_must_migrate_to_topology
      - physical_spelling_is_canonical
      - sql_attention_target_hubs_and_logs_current_surfaces
      - recommendation_target_topology_and_context_learning_surfaces

  postgresql_schema_namespaces:
    hubs:
      role: attractor_collapse_convergence_boundary
      tables:
        - hubs.hubs
        - hubs.hub_relations
    topologys:
      role: meaning_space_with_payload_definition_jsonb
      tables:
        - topologys.master_registry
        - topologys.state_registry
        - topologys.package_registry
        - topologys.schema_registry
        - topologys.component_registry
        - topologys.structure_maps
        - topologys.entities
        - topologys.topology_edit_log
        - topologys.demo_state_transitions
    logs:
      role: sql_attention_parent_observation_plane_statistics_current_attention_evidence
      tables:
        - logs.usage_metrics
        - logs.promotion_candidates
        - logs.current
        - logs.hub_current
        - logs.attention
    registry_schema_policy:
      has_dedicated_schema: false
      rule: registry_is_tensor_map_reference_concept_not_schema_namespace


  conceptual_namespace_reading:
    note: physical_schema_names_follow_canonical_contract_until_explicit_schema_contract_update
    logical_namespaces:
      hub_registry: hub_or_relation_composition_definitions
      topology_registry: topology_semantic_space_definitions
      ui_registry: ui_package_layout_wiring_definitions
      hubs: relation_maps_over_defined_ids_fk_and_reference_arrays
      ui_relation: parent_child_relation_map_parent_data_type_or_physical_table_to_child_package_payload_bundles
      logs: physical_time_axis_observations


  current_projection_namespace_contract:
    role: namespace_design_boundary
    intent:
      logs_namespace: SQL Attention physical heat, hub current, and attention evidence
      recommendation_namespace: topology and context learning surfaces
    canonical_mapping:
      logs.current: physical table heat / physical_table_id excitation strength
      logs.hub_current: hub current projection for SQL Attention
      logs.attention: append-only attention evidence and phase_vector_json carrier

  manifest_topology_integration_boundary:
    authority:
      - topology.wiring_physical_to_package_defines_single_screen_manifest_wiring
      - hubs.topology_manifests_groups_topology_wiring_for_hub_side_manifest_sets
      - hubs.hub_defines_topology_meaning_space_and_join_definition
    drift_sources:
      - manifest_public_table_must_migrate_to_topology_wiring_or_hubs_topology_manifests_responsibility
      - topologys_schema_must_migrate_to_topology
    non_goal:
      - public_unqualified_table_as_canonical_authority


  active_db_path:
    physical_table_catalog:
      table: topology.physical_tables
      current_sources:
        - topologys.registrar_entries
      meaning: physical table catalog / imported-created-selected physical table id authority
      authority: db
      expected_shape:
        physical_table_id: bigint generated identity
        table_ref: text
      note: >-
        topology.physical_tables is the canonical physical table catalog. Current
        topologys.registrar_entries is naming/schema drift and must migrate to topology.

    manifest_hub:
      table: hubs.hub
      current_sources:
        - hubs.hubs
      meaning: topology meaning space / pseudo-RDB physical table group / join definition owner
      authority: db
      sql_attention_target: true
      recommendation_target: false
      expected_shape:
        hub_id: uuid
        status: enum
        relation: jsonb
        created_at: timestamptz
        updated_at: timestamptz
      relation_meaning: JSONB join definition over topology.physical_tables.physical_table_id
      relation_minimum_shape:
        - id: topology.physical_tables.physical_table_id
          relationKey: text
          joinType: text
      prohibited_meanings:
        - bigint_array
        - ui_display_order
        - relation_registry_id
        - runtime_weight
        - logs_current_pressure
      note: >-
        hubs.hub is the canonical name candidate for one topology meaning space.
        relation stores JSONB join config and is not UI order, registry vocabulary,
        runtime weight, or logs pressure.

    topology_manifest_wiring:
      table: topology.wiring_physical_to_package
      current_sources:
        - manifest
        - ui_component_package
        - ui_layout_registry
        - ui_wiring_registry
        - ui_topology_tensor
      meaning: single-screen manifest wiring between physical table / hub / package / layout / wiring
      authority: db
      note: >-
        The existing unqualified manifest table is migration target, not canonical namespace.

    topology_manifest_group:
      table: hubs.topology_manifests
      current_sources:
        - manifest
      meaning: hub-side grouping of topology.wiring_physical_to_package records
      authority: db

    manifest_hub_chain:
      table: hubs.hub_relations
      meaning: fixed hub order / UI transition order / topology meaning space sequence
      authority: db
      status: redefine_required
      current_shape_drift:
        - current SQL uses hub_id plus relation_registry_id plus weight
        - weight is not fixed sequence authority
        - relation_registry_id is not physical table relation config
      expected_shape:
        hub_relation_id: uuid
        manifest_id: uuid
        source_hub_id: uuid
        target_hub_id: uuid
        sequence_index: integer
        relation_config: jsonb nullable
        status: enum
        created_at: timestamptz
        updated_at: timestamptz

    sql_attention_targets:
      targets:
        - hubs.hub
        - hubs.hub_relations
        - logs.current
        - logs.hub_current
        - logs.attention
      meaning: SQL Attention rotates/explores hubs space using logs current and attention evidence
      not_targets:
        - topology registry tables
        - recommendation learning surfaces

    recommend_targets:
      targets:
        - topology.*
        - topology.wiring_physical_to_package
        - topology.components_*
        - context_* learning surfaces
      meaning: recommendation uses topology and context learning surfaces, not SQL Attention hubs target semantics

    topology_ui_design:
      authority_tables:
        - topology.components_bucket
        - topology.components_style_design
        - topology.components_layout_design
        - topology.components_package_design
      current_sources:
        - ui_component_bucket
        - ui_component_registry
        - ui_component_package
        - ui_package_component_map
        - ui_layout_registry
        - ui_wiring_registry
        - ui_topology_tensor
        - components
        - design
        - packages
      meaning: UI component/style/layout/package design authority under topology schema

    logs_current_attention_evidence:
      authority_tables:
        - logs.current
        - logs.hub_current
        - logs.attention
      meaning: SQL Attention current / hub current / attention evidence surfaces to preserve
      not_same_as:
        - hubs.hub.relation
        - hubs.hub_relations.sequence_index

  namespace_drift:
    public_or_unqualified_tables:
      status: drift
      examples:
        - manifest
        - context_token_registry
        - context_event_vector_cache
        - ui_component_registry
        - ui_component_package
        - ui_topology_tensor
      rule: public/unqualified table names are not canonical SSOT tables
    topologys_schema:
      status: naming_drift
      migration_target: topology
      examples:
        - topologys.registrar_entries -> topology.physical_tables
        - topologys.structure_maps -> topology responsibility to be redefined
        - topologys.entities -> topology or hub responsibility to be redefined

  legacy_transition_candidates:
    - hubs.hubs -> hubs.hub
    - hubs.hub_relations -> hubs.hub_relations fixed sequence schema
    - topologys.* -> topology.*
    - manifest -> topology.wiring_physical_to_package / hubs.topology_manifests
    - public context_* -> topology placement decision
    - public ui_component_* -> topology.components_*
    - components
    - design
    - packages
    - logs.current / logs.hub_current / logs.attention remain canonical SQL Attention surfaces

  meaning_collision_guardrails:
    - hubs_hub_relation_vs_relation_registry: hubs.hub.relation must be JSONB join config over topology.physical_tables.physical_table_id and must not be relation_registry_id.
    - hubs_hub_relation_vs_ui_order: hubs.hub.relation is not UI display or transition order.
    - hubs_hub_relations_sequence: hubs.hub_relations owns fixed hub order / UI transition order / topology meaning space sequence.
    - logs_current_preserved: logs.current, logs.hub_current, and logs.attention remain canonical SQL Attention current/evidence surfaces.
    - sql_attention_target: SQL Attention target is hubs.hub, hubs.hub_relations, logs.current, logs.hub_current, and logs.attention.
    - recommend_target: Recommend target is topology.*, topology.wiring_physical_to_package, topology.components_*, and context_* learning surfaces.
    - public_namespace: public/unqualified tables are drift, not SSOT authority.
    - topologys_namespace: topologys is migration target to topology, not canonical spelling.
    - manifest_split: unqualified manifest responsibility must split toward topology.wiring_physical_to_package and hubs.topology_manifests.
  principles:
    - sql_files_are_implementation_not_ssot
    - tensor_or_json_key_value_only_in_communication
    - bare_id_alone_is_not_processable
    - manifest_stores_wiring_not_data
    - vector_caches_are_rebuildable_projection_not_sot

  tables:
    sql_attention_logs_alignment:
      canonical_reference:
        - docs/design/sql-attention-logs-ssot.md
        - docs/design/sql-attention-logs-ssot.yaml
      contract_reference:
        - layers.logs_signal_sources.schema_contract
        - layers.logs_current.schema_contract
        - layers.norm_trigger.schema_contract
        - layers.logs_attention.schema_contract
        - function_contract
        - trigger_contract
        - db_trigger_boundary
        - scheduler_runtime_boundary
        - phase_attention_function_contract
        - evidence_layer_separation
        - policy_sources
        - initial_minimal_basis
        - existing_table_alignment
        - non_goals
      initial_minimal_signal_basis:
        - table
        - column
        - ui


    # -------------------------------------------------------------------------
    # topology_definition — システムのトポロジ空間を定義するレジストリ群
    # -------------------------------------------------------------------------

    registrar_entries:
      category: topology_definition
      file: db/schema.sql
      role: meta_registry_of_all_topology_tables
      key_columns:
        - name: registrar_entry_id
          type: uuid
          role: pk
        - name: name
          type: text
          role: canonical_name
        - name: table_ref
          type: text
          role: physical_table_name_nullable
        - name: category
          type: text
          role: topology_category_label
        - name: active
          type: boolean

    master_registry:
      category: topology_definition
      file: db/schema.sql
      role: top_level_domain_concept_anchor
      key_columns:
        - name: master_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: category
          type: text
          role: domain_category_label
        - name: active
          type: boolean

    state_registry:
      category: topology_definition
      file: db/schema.sql
      role: named_state_definition
      key_columns:
        - name: state_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: owner
          type: text
          values: [system, business, none]

    relation_registry:
      category: topology_definition
      file: db/schema.sql
      role: abstract_space_definition
      key_columns:
        - name: relation_registry_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: master_ids
          type: uuid[]
          role: linked_master_registry_ids
        - name: manifest_candidate
          type: boolean
          role: eligible_for_manifest_promotion
        - name: active
          type: boolean

    package_registry:
      category: topology_definition
      file: db/schema.sql
      role: package_resolved_in_canonical_flow
      key_columns:
        - name: package_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: package_def
          type: jsonb
          role: package_definition_blob
        - name: active
          type: boolean

    schema_registry:
      category: topology_definition
      file: db/schema.sql
      role: schema_resolved_in_canonical_flow
      key_columns:
        - name: schema_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: schema_def
          type: jsonb
          role: schema_definition_blob
        - name: active
          type: boolean

    component_registry:
      category: topology_definition
      file: db/schema.sql
      role: component_expanded_in_canonical_flow
      key_columns:
        - name: component_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: component_type
          type: text
        - name: component_def
          type: jsonb
        - name: active
          type: boolean

    function_parameters:
      category: topology_definition
      file: db/schema.sql
      role: data_defined_runtime_policy_storage
      key_columns:
        - name: function_parameter_id
          type: uuid
          role: pk
        - name: function_name
          type: text
          role: canonical_flow_function_name
        - name: parameter_key
          type: text
        - name: parameter_value
          type: jsonb
          role: policy_value_not_hardcoded_constant
        - name: active
          type: boolean

    structure_maps:
      category: topology_definition
      file: db/topology_tables.sql
      role: attractor_key_to_package_schema_component_mapping
      key_columns:
        - name: structure_map_id
          type: uuid
          role: pk
        - name: attractor_key
          type: text
          role: canonical_dispatch_address
        - name: package_id
          type: uuid
          role: fk_package_registry
        - name: schema_id
          type: uuid
          role: fk_schema_registry
        - name: component_ids
          type: uuid[]
        - name: active
          type: boolean

    # -------------------------------------------------------------------------
    # converged_entity — canonical flow で収束した実体データ
    # -------------------------------------------------------------------------

    hubs:
      category: converged_entity
      file: db/topology_tables.sql
      role: abstract_concrete_connection_point
      key_columns:
        - name: hub_id
          type: uuid
          role: pk
        - name: relation_registry_id
          type: uuid
          role: fk_relation_registry
        - name: entity_id
          type: uuid
          role: fk_entities_nullable
        - name: state_id
          type: uuid
          role: fk_state_registry

    entities:
      category: converged_entity
      file: db/topology_tables.sql
      role: concrete_domain_data_body
      key_columns:
        - name: entity_id
          type: uuid
          role: pk
        - name: hub_id
          type: uuid
          role: fk_hubs
        - name: relation_ids
          type: uuid[]
        - name: entity_jsonb
          type: jsonb
          role: variable_payload
        - name: state_id
          type: uuid

    hub_relations:
      category: converged_entity
      file: db/topology_tables.sql
      role: redefine_required_manifest_scoped_topology_sequence_chain
      key_columns:
        - name: hub_relation_id
          type: uuid
          role: pk
        - name: source_hub_id
          type: uuid
        - name: target_hub_id
          type: uuid
        - name: relation_registry_id
          type: uuid
          role: current_shape_drift_not_physical_relation_config
      target_shape:
        - name: manifest_id
          type: uuid
        - name: source_hub_id
          type: uuid
        - name: target_hub_id
          type: uuid
        - name: sequence_index
          type: integer
        - name: relation_config
          type: jsonb nullable
        - name: status
          type: enum

    content_entity_drafts:
      category: topology_definition
      file: db/topology_tables.sql
      role: admin_entity_registration_staging
      notes:
        - draft rows are not visible to runtime browse
        - promote writes to topologys.entities
      key_columns:
        - name: draft_id
          type: uuid
          role: pk
        - name: hub_id
          type: uuid
          role: fk_hubs
        - name: entity_jsonb
          type: jsonb
        - name: relation_ids
          type: uuid[]
        - name: state_id
          type: uuid
        - name: status
          type: text
          role: draft_or_promoted
        - name: promoted_entity_id
          type: uuid
          role: fk_entities_nullable

    topology_edit_log:
      category: converged_entity
      file: db/topology_tables.sql
      role: abstract_space_definition_edit_audit_log
      naming_note: topology_label_can_be_misread_as_physical_table_lifecycle_diff
      sql_attention_logs_mapping:
        classification: mismatch
        reason: hub_tensor_or_topology_definition_edit_log_not_physical_table_lifecycle_diff
        note: do_not_reuse_directly_as_logs_diff
        adapter_requirement: explicit_physical_table_identity_contract_required_for_any_mapping

    # -------------------------------------------------------------------------
    # promotion_policy — 利用統計と昇格候補
    # -------------------------------------------------------------------------

    usage_metrics:
      category: promotion_policy
      file: db/promotion_tables.sql
      role: observed_access_usage_pressure_on_physical_time_axis
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.candidate
        condition:
          - preserve_table_column_jsonb_path_axis_pressure_trace
          - preserve_audit_archive_semantics

    promotion_candidates:
      category: promotion_policy
      file: db/promotion_tables.sql
      role: columnization_index_registry_or_physical_table_promotion_candidate_log
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.candidate
        condition:
          - status_lifecycle_pending_approved_or_rejected
          - approval_state_extractable_as_adopted_candidate
          - column_jsonb_path_axis_candidate_pressure_traceable
          - archive_audit_possible

    # -------------------------------------------------------------------------
    # context_route — 推薦エンジン child projection/registry surfaces (not SQL Attention parent observation plane)
    # -------------------------------------------------------------------------

    context_token_registry:
      category: context_route
      file: db/context_route_tables.sql
      role: discrete_token_dictionary_semantic_matrix
      note: registry_table_is_semantic_basis_not_config

    context_token_binding:
      category: context_route
      file: db/context_route_tables.sql
      role: token_to_hub_binding

    context_session:
      category: context_route
      file: db/context_route_tables.sql
      role: user_session_identity

    context_event:
      category: context_route
      file: db/context_route_tables.sql
      role: append_only_ui_operation_component_usage_pressure_source
      note: retention_policy_via_function_parameters
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.ui_operation
        condition:
          - canonical_source_for_logs_ui_operation
          - retention_manifest_or_policy_driven
          - append_only_session_sequence_semantics_preserved

    context_event_cold:
      category: context_route
      file: db/context_route_tables.sql
      role: archived_context_event_cold_storage

    context_record_snapshot_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_projection_cache
      note: not_source_of_truth

    context_event_vector_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_multi_hot_vector_cache
      note: not_source_of_truth

    context_prefix_vector_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_prefix_vector_cache
      note: not_source_of_truth

    context_transition_stats:
      category: context_route
      file: db/context_route_tables.sql
      role: operation_transition_frequency_aggregation

    context_cluster:
      category: context_route
      file: db/context_route_tables.sql
      role: session_cluster_grouping

    context_cluster_label:
      category: context_route
      file: db/context_route_tables.sql
      role: cluster_label_assignment

    context_drift_signal:
      category: context_route
      file: db/context_route_tables.sql
      role: distribution_drift_observation

    context_hub_recommendation_current:
      category: context_route
      file: db/context_route_tables.sql
      role: current_recommendation_projection_cache
      note: rebuildable_not_source_of_truth
      sql_attention_logs_mapping:
        classification: mismatch
        note: not_logs_current_calculation_basis

    context_hub_feedback_event:
      category: context_route
      file: db/context_route_tables.sql
      role: recommendation_feedback_log
    logs_current:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_physical_pressure_current_top_n_physical_items_by_signal_axes
      physical_table: logs.current
      persistence: regenerable_projection_cache

    logs_hub_current:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_hub_tensor_attractor_current
      physical_table: logs.hub_current
      persistence: regenerable_projection_cache
      note: sql_attention_target_is_hubs_tensor_attractor_not_topology_registry_search

    logs_attention:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_hub_attractor_hit_and_phase_evidence_log
      physical_table: logs.attention
      persistence: append_only_archive_required
      sql_attention_logs_mapping:
        classification: canonical_physical
        holds_hub_plane_identity:
          - hub_id
          - attractor_key
          - hub_relation_id
          - relation_registry_id
          - hub_current_id
        references:
          - current_id_to_logs_current
          - hub_current_id_to_logs_hub_current
        evidence_layers:
          - statistics_json_ema_score
          - l2_norm_vector_neighbor_score
          - phase_vector_json

    # -------------------------------------------------------------------------
    # ui_topology — UI コンポーネントのトポロジテンソル
    # -------------------------------------------------------------------------

    ui_component_bucket:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: unpackaged_component_candidates
      status_lifecycle: [bucketed, packaging, promoted, archived]
      key_columns:
        - name: bucket_item_id
          type: uuid
          role: pk
        - name: component_key
          type: text
        - name: source_path
          type: text
        - name: component_kind
          type: text
        - name: status
          type: text

    ui_component_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: promoted_component_registry

    ui_component_package:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_group_bundle

    ui_package_component_map:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: package_to_component_membership

    ui_layout_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: layout_definition

    ui_wiring_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: wiring_definition

    ui_topology_tensor:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: ui_projection_composition_route_package_layout_wiring_surface
      key_columns:
        - name: tensor_id
          type: uuid
          role: pk
        - name: route_key
          type: text
        - name: package_id
          type: uuid
          role: fk_ui_component_package
        - name: layout_id
          type: uuid
          role: fk_ui_layout_registry
        - name: wiring_id
          type: uuid
          role: fk_ui_wiring_registry

    # -- UI Component Builder (authoring layer) --------------------------------

    components:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: event_driven_component_definitions
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: component_id
          type: uuid
          role: pk
        - name: state
          type: text
        - name: name
          type: text
        - name: event
          type: jsonb
          role: event_binding_array
          shape: "[{key: string, value: string}, ...]"

    design:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_styling_definition
      css_dictionary_boundary:
        vocabulary_authority: docs/design/css-dictionary-ssot.yaml
        db_authority: design_or_layout_stores_cssTokenRefs_and_promoted_design_state_not_css_dictionary
        non_goal: no_css_token_registry_table_for_static_vocabulary
      key_columns:
        - name: design_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: design
          type: jsonb
          role: styling_with_soft_component_ref
          shape: "{componentId: uuid, classname: string, tailwind: string, cssTokenRefs?: string[], responsiveTokenRefs?: {[breakpoint: string]: string[]}}"
          note: componentId_is_soft_ref_for_editor_filtering_not_fk

    packages:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_design_bundle_referenced_by_manifest
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: package_id
          type: uuid
          role: pk
        - name: state
          type: text
        - name: name
          type: text
        - name: layout
          type: jsonb
          role: component_design_pair_vector
          shape: "[{componentId: uuid, designId: uuid}, ...]"
          note: same_component_can_appear_with_multiple_designs
      manifest_reference: manifest.topology[ui_projection].packageIds

    # -------------------------------------------------------------------------
    # manifest — dispatcher / projection の配線定義
    # -------------------------------------------------------------------------

    manifest:
      category: manifest
      file: db/manifest_tables.sql
