phase_attention_axis_mapping:
  quaternion_axes:
    w:
      meaning: l2_norm / physical table heat / physical_table_id excitation strength from logs.current
      attended_subject: physical_table_id
    x:
      meaning: hubs.hub_relations fixed hub sequence / UI transition axis
    y:
      meaning: hubs.hub topology meaning space axis
    z:
      meaning: hubs.topology_manifests manifest grouping axis
    i_j_k:
      meaning: phase movement amount / movement vector over hubs space
  movement_rule:
    - physical_table_id_is_attended_by_w
    - w_strength_controls_phase_movement_amount
    - movement_direction_is_based_on_cosine_neighborhood_rate
    - weak_w_moves_toward_near_neighbors
    - strong_w_moves_toward_farther_candidates_using_cosine_neighborhood_rate
  boundary:
    sql_attention_target: hubs
    phase_attention_role: rotates_and_explores_hubs_space_during_hub_construction
    phase_vector_json:
      is_not:
        - generic_diff
        - adopted_topology_state
      is: auxiliary_evidence_for_rotating_exploring_hubs_hub_relations_hubs_hub_hubs_topology_manifests
    semantic_axes_not_canonical:
      - population_count
      - recordcount

sql_attention_target_boundary:
  target:
    - hubs.hub
    - hubs.hub_relations
    - logs.current
    - logs.hub_current
    - logs.attention
  not_target:
    - topology_recommendation_surfaces
    - context_learning_surfaces
  interpretation_path: logs_current_heat_and_attention_evidence_rotate_explore_hubs_space

recommend_target_boundary:
  target:
    - topology.*
    - topology.wiring_physical_to_package
    - topology.components_*
    - context_* learning surfaces
  not_target:
    - sql_attention_hubs_rotation_target
  interpretation: recommendation_uses_topology_and_context_learning_surfaces

