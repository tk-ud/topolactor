db_schema:
  name: topolactor_db_schema
  version: 0.2.0
  status: ssot_design_document

  bootstrap_policy:
    standard_method: docker_compose_fresh_volume
    entrypoint: db/init.sql
    procedure: >-
      docker compose -v removes Docker volumes; on next `docker compose up`,
      docker-entrypoint-initdb.d/00-init.sql executes db/init.sql which applies
      all canonical db/*.sql files in explicit order with ON_ERROR_STOP.
    migration_policy: retired
    migration_note: >-
      db/migrations/ and db/patches/ are retired as of 2026-06-15.
      All canonical DDL and seed data lives in db/*.sql files.
      Existing-DB incremental migration is NOT the standard operational procedure.
      Use docker compose -v fresh bootstrap.
      Three data-preserving utilities for existing DBs are kept in db/legacy_utils/
      (hub_relations_legacy_to_manifest_scoped.sql, ui_topology_to_canonical_schema.sql,
      admin_import_topology_manifest_migration.sql); they are NOT executed during fresh
      bootstrap and are NOT included in db/init.sql.
    canonical_bootstrap_files:
      - db/schema.sql
      - db/topology_tables.sql
      - db/promotion_tables.sql
      - db/sql_attention_logs_tables.sql
      - db/ci_attention_guidance_tables.sql
      - db/context_route_tables.sql
      - db/ui_topology_tables.sql
      - db/topology_cross_table_wiring.sql
      - db/mock_preset_tables.sql
      - db/team_markdown_tables.sql
      - db/manifest_tables.sql
      - db/enum_tables.sql
      - db/enum_seed.sql
      - db/auth_tables.sql
      - db/auth_seed.sql
      - db/legacy_mirror_tables.sql
      - db/seed_empty.sql
      - db/hub_search_preset_seed.sql
      - db/physical_search_crud_aggregate_preset_seed.sql
      - db/physical_details_inline_editor_md_generator_preset_seed.sql
      - db/aggregate_dashboard_preset_seed.sql
      - db/ui_component_registry_preset_catalog_bootstrap.sql
      - db/runtime_orchestration_tables.sql
    canonical_bootstrap_files_note: >-
      db/init.sql applies additional canonical files not yet listed above
      (db/backend_error_evidence_tables.sql,
      db/external_port_compat_absorption_seed.sql, db/file_attachment_crud_preset_seed.sql,
      db/file_storage_export_job_preset_seed.sql, db/export_sftp_transfer_preset_seed.sql,
      db/audit_approval_form_preset_seed.sql, db/email_approval_form_preset_seed.sql,
      db/stripe_webhook_intake_preset_seed.sql, db/external_port_result_context_mapping_seed.sql,
      db/backend_error_notify_hook_port_seed.sql); this is a pre-existing list staleness
      outside aggregate_trigger_substrate scope and is not resolved by this change.
    demo_seed_boundary: >-
      db/demo_seed.sql is public scaffold/demo-only data (see its own file header) and is
      deliberately NOT part of db/init.sql's canonical bootstrap chain — it is applied manually
      when demo scaffold data is wanted locally. Proofs needing a representative seed fixture use
      a dedicated fixture (backend/tests/Topolactor.Runtime.Tests/fixtures/,
      frontend/tests/fixtures/) instead of depending on this non-canonical file.

  source_files:
    - db/schema.sql
    - db/auth_tables.sql
    - db/auth_seed.sql
    - db/enum_tables.sql
    - db/enum_seed.sql
    - db/topology_tables.sql
    - db/promotion_tables.sql
    - db/sql_attention_logs_tables.sql
    - db/context_route_tables.sql
    - db/ui_topology_tables.sql
    - db/topology_cross_table_wiring.sql
    - db/mock_preset_tables.sql
    - db/team_markdown_tables.sql
    - db/manifest_tables.sql
    - db/hub_search_preset_seed.sql
    - db/physical_search_crud_aggregate_preset_seed.sql
    - db/physical_details_inline_editor_md_generator_preset_seed.sql
    - db/aggregate_dashboard_preset_seed.sql
    - db/ui_component_registry_preset_catalog_bootstrap.sql
    - db/runtime_orchestration_tables.sql

  categories:
    - topology_definition
    - converged_entity
    - promotion_policy
    - sql_attention_observation
    - context_route
    - ui_topology
    - manifest
    - abstract_function_manifest
    - auth_identity_session
    - enum_dictionary

  tables:

    abstract_function_manifests:
      category: abstract_function_manifest
      source_file: db/topology_tables.sql
      role: execute_abstract_function manifest authority for runtime lane, authority scope, output shape, and projection deny keys; also the registry AggregateTriggerDefinitionValidator.ValidateProcessingFunctionAuthorityAsync loads against for aggregate_trigger_substrate_contract.processing_function_scope.function_id authority (aggregate_trigger_runtime rows are an authority lookup source here, not dispatched through AbstractFunctionExecutor)
      authority_rules:
        - frontend_payload_is_not_table_column_join_output_authority
        - raw_sql_payload_is_prohibited
        - runtime_lane_must_be_one_of_external_port_runtime_instance_port_runtime_admin_runtime_runtime_executor_scheduler_job_runtime_or_aggregate_trigger_runtime
        - secret_projection_denied_for_credential_signed_url_bucket_endpoint_storage_path_raw_storage_refs
        - aggregate_trigger_runtime_rows_require_authority_scope_equal_to_the_aggregate_trigger_definitions_operation_definition_id
    abstract_function_steps:
      category: abstract_function_manifest
      source_file: db/topology_tables.sql
      role: ordered generic primitive step list for execute_abstract_function
      authority_rules:
        - primitive_key_resolves_through_backend_generic_registry
        - provider_specific_handler_and_bundle_specific_handler_are_prohibited
    abstract_function_input_bindings:
      category: abstract_function_manifest
      source_file: db/topology_tables.sql
      role: typed input binding from payload, result_context, constants, manifest authority, physical table binding, or route context
      authority_rules:
        - payload_values_may_bind_values_only
        - table_column_join_output_authority_must_come_from_manifest_or_physical_binding
    abstract_function_authority_bindings:
      category: abstract_function_manifest
      source_file: db/topology_tables.sql
      role: table, column, join, output, and policy authority surface for fail-close checks

    context_transition_stats:
      schema: public
      transition_kind: operation
      recommendation_lane: ui_pressure
      role: workflow transition probability aggregate for operation-level recommendation pressure
    context_enum_transition_event:
      schema: public
      role: enum value transition events for enum-item recommendation pressure signal collection
    context_enum_transition_stats:
      schema: public
      transition_kind: enum_item
      recommendation_lane: state_pressure
      role: enum value transition probability aggregate for enum-item recommendation pressure
    component_operation_event_log:
      schema: public
      role: component operation event log for recommendation pressure signal collection

    sql_attention_logs_alignment:
      canonical_reference:
        - docs/design/sql-attention-logs-ssot.md
        - docs/design/sql-attention-logs-ssot.yaml
      contract_reference:
        - layers.logs_signal_sources.schema_contract
        - layers.logs_current.schema_contract
        - layers.norm_trigger.schema_contract
        - layers.logs_attention.schema_contract
        - function_contract
        - trigger_contract
        - db_trigger_boundary
        - scheduler_runtime_boundary
        - phase_attention_function_contract
        - evidence_layer_separation
        - policy_sources
        - initial_minimal_basis
        - existing_table_alignment
        - non_goals
      initial_minimal_signal_basis:
        - table
        - column
        - ui


    # -------------------------------------------------------------------------
    # topology_definition — システムのトポロジ空間を定義するレジストリ群
    # -------------------------------------------------------------------------

    registrar_entries:
      category: topology_definition
      file: db/schema.sql
      role: meta_registry_of_all_topology_tables
      key_columns:
        - name: registrar_entry_id
          type: uuid
          role: pk
        - name: name
          type: text
          role: canonical_name
        - name: table_ref
          type: text
          role: physical_table_name_nullable
        - name: category
          type: text
          role: topology_category_label
        - name: active
          type: boolean

    master_registry:
      category: topology_definition
      file: db/schema.sql
      role: top_level_domain_concept_anchor
      key_columns:
        - name: master_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: category
          type: text
          role: domain_category_label
        - name: active
          type: boolean

    state_registry:
      category: topology_definition
      file: db/schema.sql
      role: named_state_definition
      key_columns:
        - name: state_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: owner
          type: text
          values: [system, business, none]

    relation_registry:
      category: topology_definition
      file: db/schema.sql
      role: abstract_space_definition
      key_columns:
        - name: relation_registry_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: master_ids
          type: uuid[]
          role: linked_master_registry_ids
        - name: manifest_candidate
          type: boolean
          role: eligible_for_manifest_promotion
        - name: active
          type: boolean

    package_registry:
      category: topology_definition
      file: db/schema.sql
      role: package_resolved_in_canonical_flow
      key_columns:
        - name: package_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: package_def
          type: jsonb
          role: package_definition_blob
        - name: active
          type: boolean

    schema_registry:
      category: topology_definition
      file: db/schema.sql
      role: schema_resolved_in_canonical_flow
      key_columns:
        - name: schema_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: schema_def
          type: jsonb
          role: schema_definition_blob
        - name: active
          type: boolean

    component_registry:
      category: topology_definition
      file: db/schema.sql
      role: component_expanded_in_canonical_flow
      key_columns:
        - name: component_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: component_type
          type: text
        - name: component_def
          type: jsonb
        - name: active
          type: boolean

    function_parameters:
      category: topology_definition
      file: db/schema.sql
      role: data_defined_runtime_policy_storage
      key_columns:
        - name: function_parameter_id
          type: uuid
          role: pk
        - name: function_name
          type: text
          role: canonical_flow_function_name
        - name: parameter_key
          type: text
        - name: parameter_value
          type: jsonb
          role: policy_value_not_hardcoded_constant
        - name: active
          type: boolean

    structure_maps:
      category: topology_definition
      file: db/topology_tables.sql
      role: attractor_key_to_package_schema_component_mapping
      key_columns:
        - name: structure_map_id
          type: uuid
          role: pk
        - name: attractor_key
          type: text
          role: canonical_dispatch_address
        - name: package_id
          type: uuid
          role: fk_package_registry
        - name: schema_id
          type: uuid
          role: fk_schema_registry
        - name: component_ids
          type: uuid[]
        - name: active
          type: boolean

    # -------------------------------------------------------------------------
    # converged_entity — canonical flow で収束した実体データ
    # -------------------------------------------------------------------------

    hubs:
      category: converged_entity
      file: db/topology_tables.sql
      role: abstract_concrete_connection_point
      key_columns:
        - name: hub_id
          type: uuid
          role: pk
        - name: relation_registry_id
          type: uuid
          role: fk_relation_registry
        - name: entity_id
          type: uuid
          role: fk_entities_nullable
        - name: state_id
          type: uuid
          role: fk_state_registry

    entities:
      category: converged_entity
      file: db/topology_tables.sql
      role: concrete_domain_data_body
      key_columns:
        - name: entity_id
          type: uuid
          role: pk
        - name: hub_id
          type: uuid
          role: fk_hubs
        - name: relation_ids
          type: uuid[]
        - name: entity_jsonb
          type: jsonb
          role: variable_payload
        - name: state_id
          type: uuid

    hub_relations:
      category: converged_entity
      file: db/topology_tables.sql
      role: manifest_scoped_topology_sequence_chain
      sql_attention_role: canonical_manifest_scoped_exploration_field
      parent_table: hubs.topology_manifests
      bootstrap_policy: CREATE TABLE IF NOT EXISTS; no destructive DROP CASCADE in bootstrap DDL
      legacy_migration_ddl: db/migrations/hub_relations_legacy_to_manifest_scoped.sql
      legacy_migration_ref: compatibility_history.hub_relations_legacy_global_graph
      key_columns:
        - name: hub_relation_id
          type: uuid
          role: pk
        - name: topology_manifest_id
          type: uuid
          role: fk_topology_manifests
        - name: related_hub_id
          type: uuid
          role: fk_hubs_sequenced_hub_entry
        - name: sequence_position
          type: integer
          role: sequence_authority
        - name: relation_config
          type: jsonb
          role: optional_sequence_metadata
          canonical_default_entry_marker: >-
            relation_config.transition="canonical_default_entry" on an active row is the means by
            which a bare/no-selection projection entry resolves an initial manifest — see
            docs/design/runtime-orchestration-ssot.yaml
            ui_projection_render_reachability_contract.canonical_default_entry_contract for the
            full owner/singularity/resolution-priority/active-status/failure-semantics contract.
            Distinct from this table's ordinary sequence_position navigation-link role; at most
            one active row across the whole table may carry this marker.
        - name: status
          type: enum
          role: active_or_deprecated

    content_entity_drafts:
      category: topology_definition
      file: db/topology_tables.sql
      role: admin_entity_registration_staging
      notes:
        - draft rows are not visible to runtime browse
        - promote writes to topologys.entities
      key_columns:
        - name: draft_id
          type: uuid
          role: pk
        - name: hub_id
          type: uuid
          role: fk_hubs
        - name: entity_jsonb
          type: jsonb
        - name: relation_ids
          type: uuid[]
        - name: state_id
          type: uuid
        - name: status
          type: text
          role: draft_or_promoted
        - name: promoted_entity_id
          type: uuid
          role: fk_entities_nullable

    topology_edit_log:
      category: converged_entity
      file: db/topology_tables.sql
      role: abstract_space_definition_edit_audit_log
      naming_note: topology_label_can_be_misread_as_physical_table_lifecycle_diff
      sql_attention_logs_mapping:
        classification: mismatch
        reason: hub_tensor_or_topology_definition_edit_log_not_physical_table_lifecycle_diff
        note: do_not_reuse_directly_as_logs_diff
        adapter_requirement: explicit_physical_table_identity_contract_required_for_any_mapping

    # -------------------------------------------------------------------------
    # promotion_policy — 利用統計と昇格候補
    # -------------------------------------------------------------------------

    usage_metrics:
      category: promotion_policy
      file: db/promotion_tables.sql
      role: observed_access_usage_pressure_on_physical_time_axis
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.candidate
        condition:
          - preserve_table_column_jsonb_path_axis_pressure_trace
          - preserve_audit_archive_semantics

    promotion_candidates:
      category: promotion_policy
      file: db/promotion_tables.sql
      role: columnization_index_registry_or_physical_table_promotion_candidate_log
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.candidate
        condition:
          - status_lifecycle_pending_approved_or_rejected
          - approval_state_extractable_as_adopted_candidate
          - column_jsonb_path_axis_candidate_pressure_traceable
          - archive_audit_possible

    # -------------------------------------------------------------------------
    # context_route — 推薦エンジン child projection/registry surfaces (not SQL Attention parent observation plane)
    # -------------------------------------------------------------------------

    context_token_registry:
      category: context_route
      file: db/context_route_tables.sql
      role: discrete_token_dictionary_semantic_matrix
      note: registry_table_is_semantic_basis_not_config

    context_token_binding:
      category: context_route
      file: db/context_route_tables.sql
      role: token_to_hub_binding

    context_session:
      category: context_route
      file: db/context_route_tables.sql
      role: user_session_identity

    context_event:
      category: context_route
      file: db/context_route_tables.sql
      role: append_only_ui_operation_component_usage_pressure_source
      note: retention_policy_via_function_parameters
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.ui_operation
        condition:
          - canonical_source_for_logs_ui_operation
          - retention_manifest_or_policy_driven
          - append_only_session_sequence_semantics_preserved

    context_event_cold:
      category: context_route
      file: db/context_route_tables.sql
      role: archived_context_event_cold_storage

    context_record_snapshot_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_projection_cache
      note: not_source_of_truth

    context_event_vector_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_multi_hot_vector_cache
      note: not_source_of_truth

    context_prefix_vector_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_prefix_vector_cache
      note: not_source_of_truth

    context_cluster:
      category: context_route
      file: db/context_route_tables.sql
      role: session_cluster_grouping

    context_cluster_label:
      category: context_route
      file: db/context_route_tables.sql
      role: cluster_label_assignment

    context_drift_signal:
      category: context_route
      file: db/context_route_tables.sql
      role: distribution_drift_observation

    context_hub_recommendation_current:
      category: context_route
      file: db/context_route_tables.sql
      role: current_recommendation_projection_cache
      note: rebuildable_not_source_of_truth
      sql_attention_logs_mapping:
        classification: mismatch
        note: not_logs_current_calculation_basis

    context_hub_feedback_event:
      category: context_route
      file: db/context_route_tables.sql
      role: recommendation_feedback_log
    logs_current:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_physical_pressure_current_top_n_physical_items_by_signal_axes
      physical_table: logs.current
      persistence: regenerable_projection_cache
      sql_attention_role: policy_qualified_topN_rank_norm_level_trigger_basis

    logs_hub_current:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_optional_support_cache_derived_hub_current
      physical_table: logs.hub_current
      persistence: regenerable_projection_cache
      note: not_sql_attention_exploration_body_or_meaning_authority

    logs_attention:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_SQLAT_hit_and_phaseAT_evidence_generation_log
      physical_table: logs.attention
      persistence: append_only_archive_required
      boundary: evidence_rows_are_not_Draft_or_adopted_canonical_state
      sql_attention_logs_mapping:
        classification: canonical_physical
        holds_hub_plane_identity:
          - hub_id
          - attractor_key
          - hub_relation_id
          - relation_registry_id
          - hub_current_id
        required_generation_identity_alignment:
          - generation_line_id
          - source_attention_id
          - source_current_id
          - source_topology_manifest_ids
          - hit_hub_relation_ids
          - expanded_hub_relation_ids
          - expanded_topology_manifest_ids
          - expanded_hub_ids
        evidence_generations:
          - SQLAT_hit_evidence_row
          - phaseAT_evidence_row
          - draft_projection_explicit_command_row
          - adoption_result_explicit_command_row
          - rejection_result_explicit_command_row
        references:
          - current_id_to_logs_current
          - source_current_id_to_logs_current
          - source_attention_id_to_logs_attention
          - optional_hub_current_id_to_logs_hub_current_support_cache
        evidence_layers:
          - statistics_json_ema_score
          - l2_norm_vector_neighbor_score
          - phase_vector_json

    # -------------------------------------------------------------------------
    # ui_topology — UI コンポーネントのトポロジテンソル
    # -------------------------------------------------------------------------

    ui_component_bucket:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: unpackaged_component_candidates
      status_lifecycle: [bucketed, packaging, promoted, archived]
      key_columns:
        - name: bucket_item_id
          type: uuid
          role: pk
        - name: component_key
          type: text
        - name: source_path
          type: text
        - name: component_kind
          type: text
        - name: status
          type: text

    ui_component_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: promoted_component_registry

    ui_component_package:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_group_bundle

    ui_package_component_map:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: package_to_component_membership

    ui_layout_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: layout_definition

    ui_wiring_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: wiring_definition

    ui_topology_tensor:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: ui_projection_composition_route_package_layout_wiring_surface
      key_columns:
        - name: tensor_id
          type: uuid
          role: pk
        - name: route_key
          type: text
        - name: package_id
          type: uuid
          role: fk_ui_component_package
        - name: layout_id
          type: uuid
          role: fk_ui_layout_registry
        - name: wiring_id
          type: uuid
          role: fk_ui_wiring_registry

    # -- UI Component Builder (authoring layer) --------------------------------

    components:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: event_driven_component_definitions
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: component_id
          type: uuid
          role: pk
        - name: state
          type: text
        - name: name
          type: text
        - name: event
          type: jsonb
          role: event_binding_array
          shape: "[{key: string, value: string}, ...]"

    design:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_styling_definition
      css_dictionary_boundary:
        vocabulary_authority: docs/design/css-dictionary-ssot.yaml
        db_authority: design_or_layout_stores_cssTokenRefs_and_promoted_design_state_not_css_dictionary
        non_goal: no_css_token_registry_table_for_static_vocabulary
      key_columns:
        - name: design_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: design
          type: jsonb
          role: styling_with_soft_component_ref
          shape: "{componentId?: uuid, layoutNodeId?: string, classname: string, tailwind: string, cssTokenRefs?: string[], responsiveTokenRefs?: {[breakpoint: string]: string[]}, inlineText?: string, linkHref?: string, linkTarget?: string, reactionIntent?: string}"
          note: componentId_is_soft_ref_for_editor_filtering_not_fk

    packages:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_design_bundle_referenced_by_manifest
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: package_id
          type: uuid
          role: pk
        - name: state
          type: text
        - name: name
          type: text
        - name: layout
          type: jsonb
          role: component_design_pair_vector
          shape: "[{componentId?: uuid, layoutNodeId?: string, designId: uuid}, ...]"
          note: same_component_can_appear_with_multiple_designs
      manifest_reference: manifest.topology[ui_projection].packageIds

    # -------------------------------------------------------------------------
    # manifest — dispatcher / projection の配線定義
    # -------------------------------------------------------------------------

    manifest:
      category: manifest
      file: db/manifest_tables.sql
      role: wiring_definition_for_dispatcher_and_projection
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: manifest_id
          type: uuid
          role: pk
        - name: relation_registry_id
          type: uuid
          role: fk_relation_registry_nullable
        - name: topology
          type: jsonb[]
          role: id_references_and_vectors_only_no_actual_data
      manifest_resolution:
        api: resolve_active_by_role_target_layer_action
        sse: manifest_id_from_db_notify_payload
