db_schema:
  name: topolactor_db_schema
  version: 0.1.0
  status: ssot_design_document
  source_files:
    - db/schema.sql
    - db/topology_tables.sql
    - db/promotion_tables.sql
    - db/sql_attention_logs_tables.sql
    - db/context_route_tables.sql
    - db/ui_topology_tables.sql
    - db/manifest_tables.sql

  categories:
    - topology_definition
    - converged_entity
    - promotion_policy
    - sql_attention_observation
    - context_route
    - ui_topology
    - manifest


  postgresql_schema_namespaces:
    hubs:
      role: attractor_collapse_convergence_boundary
      tables:
        - hubs.hubs
        - hubs.hub_relations
    topologys:
      role: meaning_space_with_payload_definition_jsonb
      tables:
        - topologys.master_registry
        - topologys.state_registry
        - topologys.package_registry
        - topologys.schema_registry
        - topologys.component_registry
        - topologys.structure_maps
        - topologys.entities
        - topologys.topology_edit_log
        - topologys.demo_state_transitions
    logs:
      role: sql_attention_parent_observation_plane_statistics_current_attention_evidence
      tables:
        - logs.usage_metrics
        - logs.promotion_candidates
        - logs.current
        - logs.hub_current
        - logs.attention
    registry_schema_policy:
      has_dedicated_schema: false
      rule: registry_is_tensor_map_reference_concept_not_schema_namespace


  conceptual_namespace_reading:
    note: physical_schema_names_follow_canonical_contract_until_explicit_schema_contract_update
    logical_namespaces:
      hub_registry: hub_or_relation_composition_definitions
      topology_registry: topology_semantic_space_definitions
      ui_registry: ui_package_layout_wiring_definitions
      hubs: relation_maps_over_defined_ids_fk_and_reference_arrays
      ui_relation: parent_child_relation_map_parent_data_type_or_physical_table_to_child_package_payload_bundles
      logs: physical_time_axis_observations


  current_projection_namespace_contract:
    role: namespace_design_boundary
    intent:
      logs_namespace: physical_time_axis_logs_pressure_and_append_only_evidence
      current_namespace: rebuildable_current_relation_projections
    canonical_mapping:
      logs.current: current.table_relation_or_current.physical_relation
      logs.hub_current: current.hub_relation
      optional_ui_projection: current.ui_relation
      logs.attention: append_only_evidence_relation

  manifest_topology_integration_boundary:
    authority:
      - manifest.topology_defines_physical_table_definition_schema_reference_ui_projection_document_binding_aggregation_target_runtime_apply_action_mapping
      - topologys.schema_registry.schema_def_defines_records_jsonb_schema_field_type_validation
      - topologys.structure_maps_connect_attractor_package_schema_component_resolution
    non_goal:
      - no_dedicated_admin_authoring_manifest_table


  active_db_path:
    physical_table_catalog:
      table: topologys.registrar_entries
      meaning: physical table catalog
      authority: db
      future_required_columns:
        - physical_table_id bigint generated identity
        - table_ref text
      note: >-
        registrar_entries is the authority for physical table ids registered into Manifest Hub.
        The current SQL still exposes registrar_entry_id uuid; physical_table_id bigint is an explicit
        future migration requirement and is not introduced in this document-only change.

    manifest_hub:
      table: hubs.hubs
      meaning: topology meaning space / pseudo-RDB physical table group / Manifest projection unit
      authority: db
      expected_shape:
        hub_id: uuid
        status: enum
        relation: jsonb
        created_at: timestamptz
        updated_at: timestamptz
      relation_meaning: physical table relation config jsonb
      relation_minimum_shape:
        - id: registrar_entries.physical_table_id
          relationKey: text
          joinType: text
      prohibited_meanings:
        - bigint_array
        - ui_display_order
        - relation_registry_id
        - hub_relation_id
        - runtime_weight
        - semantic_relation_vocabulary
        - logs_current_pressure
      note: >-
        hubs.hubs groups pseudo-RDB physical tables into one topology meaning space that
        can be assigned to manifest as a projection unit. hubs.hubs.relation stores
        JSONB join/config entries such as id, relationKey, and joinType; id points to
        registrar_entries.physical_table_id. It is not UI display order,
        relation_registry_id, hub_relation_id, runtime weight, or logs.current pressure.

    manifest_hub_chain:
      table: hubs.hub_relations
      meaning: topology sequence / continuous processing order between hubs attached to a manifest
      authority: db
      status: redefine_required
      current_shape_drift:
        - current SQL uses hub_id plus relation_registry_id plus weight
        - weight is not topology sequence authority
        - relation_registry_id is not physical table relation config
      expected_shape:
        hub_relation_id: uuid
        manifest_id: uuid
        source_hub_id: uuid
        target_hub_id: uuid
        sequence_index: integer
        relation_config: jsonb nullable
        status: enum
        created_at: timestamptz
        updated_at: timestamptz
      note: >-
        hubs.hub_relations remains a valid concept, but the current schema must be
        redefined as the manifest-scoped chain between topology meaning spaces. It is
        not a simple delete candidate in this SSOT pass.

    runtime_manifest:
      table: manifest
      meaning: runtime dispatch distribution surface
      authority: db
      owns:
        - dispatcher_mapping
        - runtime_mapping
        - ui_projection
        - projection_constructor_mapping
        - sse_projection
      not_same_as:
        - hubs.hubs
        - physical_table_catalog
        - ui_component_package
      note: >-
        manifest is runtime dispatch distribution wiring. It is not Manifest Hub,
        the physical table catalog, or a UI component package.

    ui_topology:
      authority_tables:
        - ui_component_bucket
        - ui_component_registry
        - ui_component_package
        - ui_package_component_map
        - ui_layout_registry
        - ui_wiring_registry
        - ui_topology_tensor
      meaning: UI component/package/layout/wiring/projection DB authority
      display_order_authority: ui_layout_registry / ui_wiring_registry / ui_topology_tensor

    pressure_and_evidence:
      authority_tables:
        - logs.current
        - logs.hub_current
        - logs.attention
      meaning: physical table pressure / current / hub_current / attention evidence
      not_same_as:
        - hubs.hubs.relation
        - hubs.hub_relations.weight

    context_learning:
      authority_tables:
        - context_*
      meaning: operation log / recommendation learning

  legacy_transition_candidates:
    - hubs.hub_relations
    - topologys.entities
    - topologys.content_entity_drafts
    - topologys.structure_maps
    - components
    - design
    - packages
    - topologys.demo_state_transitions
    - topologys.topology_edit_log
    - logs.usage_metrics
    - logs.promotion_candidates
    - context_record_snapshot_cache
    - context_event_vector_cache
    - context_cluster
    - context_cluster_label
    - context_drift_signal

  meaning_collision_guardrails:
    - registrar_entries_vs_physical_table_id: registrar_entries is the catalog authority; physical_table_id bigint is the future canonical id required for Manifest Hub membership.
    - hubs_hubs_relation_vs_relation_registry: hubs.hubs.relation must be JSONB physical table relation config and must not be treated as relation_registry_id.
    - hubs_hub_relations_vs_hubs_hubs_relation: hubs.hub_relations is the redefine-required topology sequence / manifest hub chain, not hubs.hubs relation config.
    - manifest_vs_hubs_hubs: manifest owns runtime dispatch distribution; hubs.hubs owns one topology meaning space / pseudo-RDB physical table grouping.
    - manifest_ui_projection_packageIds_vs_packages_ui_component_package: manifest packageIds currently point at legacy packages semantics and need a decision to align with ui_component_package or ui_topology_tensor.
    - ui_component_registry_vs_components: ui_component_registry is active component authority; components is legacy UI builder catalog.
    - ui_component_package_vs_packages: ui_component_package is active package authority; packages is legacy UI builder package surface.
    - ui_package_component_map_vs_packages_layout: ui_package_component_map is normalized component membership; packages.layout is legacy json binding.
    - design_classname_tailwind_vs_css_dictionary_topology_layout_class: design.classname/tailwind semantics must not bypass css-dictionary/topology-layout-class SSOTs.
    - hubs_hub_relations_weight_vs_sequence_logs_current_hub_current_attention: hub_relations.weight is not topology sequence authority and is not dynamic pressure/current/attention evidence.
    - structure_maps_vs_manifest_dispatch_distribution: structure_maps is legacy/transition attractor resolution and must not be conflated with runtime manifest dispatch distribution.
    - entities_content_entity_drafts_vs_physical_table_records: entities/content_entity_drafts are not the physical table catalog or Manifest Hub membership authority.
  principles:
    - sql_files_are_implementation_not_ssot
    - tensor_or_json_key_value_only_in_communication
    - bare_id_alone_is_not_processable
    - manifest_stores_wiring_not_data
    - vector_caches_are_rebuildable_projection_not_sot

  tables:
    sql_attention_logs_alignment:
      canonical_reference:
        - docs/design/sql-attention-logs-ssot.md
        - docs/design/sql-attention-logs-ssot.yaml
      contract_reference:
        - layers.logs_signal_sources.schema_contract
        - layers.logs_current.schema_contract
        - layers.norm_trigger.schema_contract
        - layers.logs_attention.schema_contract
        - function_contract
        - trigger_contract
        - db_trigger_boundary
        - scheduler_runtime_boundary
        - phase_attention_function_contract
        - evidence_layer_separation
        - policy_sources
        - initial_minimal_basis
        - existing_table_alignment
        - non_goals
      initial_minimal_signal_basis:
        - table
        - column
        - ui


    # -------------------------------------------------------------------------
    # topology_definition — システムのトポロジ空間を定義するレジストリ群
    # -------------------------------------------------------------------------

    registrar_entries:
      category: topology_definition
      file: db/schema.sql
      role: meta_registry_of_all_topology_tables
      key_columns:
        - name: registrar_entry_id
          type: uuid
          role: pk
        - name: name
          type: text
          role: canonical_name
        - name: table_ref
          type: text
          role: physical_table_name_nullable
        - name: category
          type: text
          role: topology_category_label
        - name: active
          type: boolean

    master_registry:
      category: topology_definition
      file: db/schema.sql
      role: top_level_domain_concept_anchor
      key_columns:
        - name: master_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: category
          type: text
          role: domain_category_label
        - name: active
          type: boolean

    state_registry:
      category: topology_definition
      file: db/schema.sql
      role: named_state_definition
      key_columns:
        - name: state_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: owner
          type: text
          values: [system, business, none]

    relation_registry:
      category: topology_definition
      file: db/schema.sql
      role: abstract_space_definition
      key_columns:
        - name: relation_registry_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: master_ids
          type: uuid[]
          role: linked_master_registry_ids
        - name: manifest_candidate
          type: boolean
          role: eligible_for_manifest_promotion
        - name: active
          type: boolean

    package_registry:
      category: topology_definition
      file: db/schema.sql
      role: package_resolved_in_canonical_flow
      key_columns:
        - name: package_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: package_def
          type: jsonb
          role: package_definition_blob
        - name: active
          type: boolean

    schema_registry:
      category: topology_definition
      file: db/schema.sql
      role: schema_resolved_in_canonical_flow
      key_columns:
        - name: schema_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: schema_def
          type: jsonb
          role: schema_definition_blob
        - name: active
          type: boolean

    component_registry:
      category: topology_definition
      file: db/schema.sql
      role: component_expanded_in_canonical_flow
      key_columns:
        - name: component_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: component_type
          type: text
        - name: component_def
          type: jsonb
        - name: active
          type: boolean

    function_parameters:
      category: topology_definition
      file: db/schema.sql
      role: data_defined_runtime_policy_storage
      key_columns:
        - name: function_parameter_id
          type: uuid
          role: pk
        - name: function_name
          type: text
          role: canonical_flow_function_name
        - name: parameter_key
          type: text
        - name: parameter_value
          type: jsonb
          role: policy_value_not_hardcoded_constant
        - name: active
          type: boolean

    structure_maps:
      category: topology_definition
      file: db/topology_tables.sql
      role: attractor_key_to_package_schema_component_mapping
      key_columns:
        - name: structure_map_id
          type: uuid
          role: pk
        - name: attractor_key
          type: text
          role: canonical_dispatch_address
        - name: package_id
          type: uuid
          role: fk_package_registry
        - name: schema_id
          type: uuid
          role: fk_schema_registry
        - name: component_ids
          type: uuid[]
        - name: active
          type: boolean

    # -------------------------------------------------------------------------
    # converged_entity — canonical flow で収束した実体データ
    # -------------------------------------------------------------------------

    hubs:
      category: converged_entity
      file: db/topology_tables.sql
      role: abstract_concrete_connection_point
      key_columns:
        - name: hub_id
          type: uuid
          role: pk
        - name: relation_registry_id
          type: uuid
          role: fk_relation_registry
        - name: entity_id
          type: uuid
          role: fk_entities_nullable
        - name: state_id
          type: uuid
          role: fk_state_registry

    entities:
      category: converged_entity
      file: db/topology_tables.sql
      role: concrete_domain_data_body
      key_columns:
        - name: entity_id
          type: uuid
          role: pk
        - name: hub_id
          type: uuid
          role: fk_hubs
        - name: relation_ids
          type: uuid[]
        - name: entity_jsonb
          type: jsonb
          role: variable_payload
        - name: state_id
          type: uuid

    hub_relations:
      category: converged_entity
      file: db/topology_tables.sql
      role: redefine_required_manifest_scoped_topology_sequence_chain
      key_columns:
        - name: hub_relation_id
          type: uuid
          role: pk
        - name: source_hub_id
          type: uuid
        - name: target_hub_id
          type: uuid
        - name: relation_registry_id
          type: uuid
          role: current_shape_drift_not_physical_relation_config
      target_shape:
        - name: manifest_id
          type: uuid
        - name: source_hub_id
          type: uuid
        - name: target_hub_id
          type: uuid
        - name: sequence_index
          type: integer
        - name: relation_config
          type: jsonb nullable
        - name: status
          type: enum

    content_entity_drafts:
      category: topology_definition
      file: db/topology_tables.sql
      role: admin_entity_registration_staging
      notes:
        - draft rows are not visible to runtime browse
        - promote writes to topologys.entities
      key_columns:
        - name: draft_id
          type: uuid
          role: pk
        - name: hub_id
          type: uuid
          role: fk_hubs
        - name: entity_jsonb
          type: jsonb
        - name: relation_ids
          type: uuid[]
        - name: state_id
          type: uuid
        - name: status
          type: text
          role: draft_or_promoted
        - name: promoted_entity_id
          type: uuid
          role: fk_entities_nullable

    topology_edit_log:
      category: converged_entity
      file: db/topology_tables.sql
      role: abstract_space_definition_edit_audit_log
      naming_note: topology_label_can_be_misread_as_physical_table_lifecycle_diff
      sql_attention_logs_mapping:
        classification: mismatch
        reason: hub_tensor_or_topology_definition_edit_log_not_physical_table_lifecycle_diff
        note: do_not_reuse_directly_as_logs_diff
        adapter_requirement: explicit_physical_table_identity_contract_required_for_any_mapping

    # -------------------------------------------------------------------------
    # promotion_policy — 利用統計と昇格候補
    # -------------------------------------------------------------------------

    usage_metrics:
      category: promotion_policy
      file: db/promotion_tables.sql
      role: observed_access_usage_pressure_on_physical_time_axis
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.candidate
        condition:
          - preserve_table_column_jsonb_path_axis_pressure_trace
          - preserve_audit_archive_semantics

    promotion_candidates:
      category: promotion_policy
      file: db/promotion_tables.sql
      role: columnization_index_registry_or_physical_table_promotion_candidate_log
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.candidate
        condition:
          - status_lifecycle_pending_approved_or_rejected
          - approval_state_extractable_as_adopted_candidate
          - column_jsonb_path_axis_candidate_pressure_traceable
          - archive_audit_possible

    # -------------------------------------------------------------------------
    # context_route — 推薦エンジン child projection/registry surfaces (not SQL Attention parent observation plane)
    # -------------------------------------------------------------------------

    context_token_registry:
      category: context_route
      file: db/context_route_tables.sql
      role: discrete_token_dictionary_semantic_matrix
      note: registry_table_is_semantic_basis_not_config

    context_token_binding:
      category: context_route
      file: db/context_route_tables.sql
      role: token_to_hub_binding

    context_session:
      category: context_route
      file: db/context_route_tables.sql
      role: user_session_identity

    context_event:
      category: context_route
      file: db/context_route_tables.sql
      role: append_only_ui_operation_component_usage_pressure_source
      note: retention_policy_via_function_parameters
      sql_attention_logs_mapping:
        classification: canonical
        candidate_for: logs.ui_operation
        condition:
          - canonical_source_for_logs_ui_operation
          - retention_manifest_or_policy_driven
          - append_only_session_sequence_semantics_preserved

    context_event_cold:
      category: context_route
      file: db/context_route_tables.sql
      role: archived_context_event_cold_storage

    context_record_snapshot_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_projection_cache
      note: not_source_of_truth

    context_event_vector_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_multi_hot_vector_cache
      note: not_source_of_truth

    context_prefix_vector_cache:
      category: context_route
      file: db/context_route_tables.sql
      role: rebuildable_prefix_vector_cache
      note: not_source_of_truth

    context_transition_stats:
      category: context_route
      file: db/context_route_tables.sql
      role: operation_transition_frequency_aggregation

    context_cluster:
      category: context_route
      file: db/context_route_tables.sql
      role: session_cluster_grouping

    context_cluster_label:
      category: context_route
      file: db/context_route_tables.sql
      role: cluster_label_assignment

    context_drift_signal:
      category: context_route
      file: db/context_route_tables.sql
      role: distribution_drift_observation

    context_hub_recommendation_current:
      category: context_route
      file: db/context_route_tables.sql
      role: current_recommendation_projection_cache
      note: rebuildable_not_source_of_truth
      sql_attention_logs_mapping:
        classification: mismatch
        note: not_logs_current_calculation_basis

    context_hub_feedback_event:
      category: context_route
      file: db/context_route_tables.sql
      role: recommendation_feedback_log
    logs_current:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_physical_pressure_current_top_n_physical_items_by_signal_axes
      physical_table: logs.current
      persistence: regenerable_projection_cache

    logs_hub_current:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_hub_tensor_attractor_current
      physical_table: logs.hub_current
      persistence: regenerable_projection_cache
      note: sql_attention_target_is_hubs_tensor_attractor_not_topology_registry_search

    logs_attention:
      category: sql_attention_observation
      file: db/sql_attention_logs_tables.sql
      role: sql_attention_hub_attractor_hit_and_phase_evidence_log
      physical_table: logs.attention
      persistence: append_only_archive_required
      sql_attention_logs_mapping:
        classification: canonical_physical
        holds_hub_plane_identity:
          - hub_id
          - attractor_key
          - hub_relation_id
          - relation_registry_id
          - hub_current_id
        references:
          - current_id_to_logs_current
          - hub_current_id_to_logs_hub_current
        evidence_layers:
          - statistics_json_ema_score
          - l2_norm_vector_neighbor_score
          - phase_vector_json

    # -------------------------------------------------------------------------
    # ui_topology — UI コンポーネントのトポロジテンソル
    # -------------------------------------------------------------------------

    ui_component_bucket:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: unpackaged_component_candidates
      status_lifecycle: [bucketed, packaging, promoted, archived]
      key_columns:
        - name: bucket_item_id
          type: uuid
          role: pk
        - name: component_key
          type: text
        - name: source_path
          type: text
        - name: component_kind
          type: text
        - name: status
          type: text

    ui_component_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: promoted_component_registry

    ui_component_package:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_group_bundle

    ui_package_component_map:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: package_to_component_membership

    ui_layout_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: layout_definition

    ui_wiring_registry:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: wiring_definition

    ui_topology_tensor:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: ui_projection_composition_route_package_layout_wiring_surface
      key_columns:
        - name: tensor_id
          type: uuid
          role: pk
        - name: route_key
          type: text
        - name: package_id
          type: uuid
          role: fk_ui_component_package
        - name: layout_id
          type: uuid
          role: fk_ui_layout_registry
        - name: wiring_id
          type: uuid
          role: fk_ui_wiring_registry

    # -- UI Component Builder (authoring layer) --------------------------------

    components:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: event_driven_component_definitions
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: component_id
          type: uuid
          role: pk
        - name: state
          type: text
        - name: name
          type: text
        - name: event
          type: jsonb
          role: event_binding_array
          shape: "[{key: string, value: string}, ...]"

    design:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_styling_definition
      css_dictionary_boundary:
        vocabulary_authority: docs/design/css-dictionary-ssot.yaml
        db_authority: design_or_layout_stores_cssTokenRefs_and_promoted_design_state_not_css_dictionary
        non_goal: no_css_token_registry_table_for_static_vocabulary
      key_columns:
        - name: design_id
          type: uuid
          role: pk
        - name: name
          type: text
        - name: design
          type: jsonb
          role: styling_with_soft_component_ref
          shape: "{componentId: uuid, classname: string, tailwind: string, cssTokenRefs?: string[], responsiveTokenRefs?: {[breakpoint: string]: string[]}}"
          note: componentId_is_soft_ref_for_editor_filtering_not_fk

    packages:
      category: ui_topology
      file: db/ui_topology_tables.sql
      role: component_design_bundle_referenced_by_manifest
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: package_id
          type: uuid
          role: pk
        - name: state
          type: text
        - name: name
          type: text
        - name: layout
          type: jsonb
          role: component_design_pair_vector
          shape: "[{componentId: uuid, designId: uuid}, ...]"
          note: same_component_can_appear_with_multiple_designs
      manifest_reference: manifest.topology[ui_projection].packageIds

    # -------------------------------------------------------------------------
    # manifest — dispatcher / projection の配線定義
    # -------------------------------------------------------------------------

    manifest:
      category: manifest
      file: db/manifest_tables.sql
      role: wiring_definition_for_dispatcher_and_projection
      status_lifecycle: [draft, active, deprecated]
      key_columns:
        - name: manifest_id
          type: uuid
          role: pk
        - name: relation_registry_id
          type: uuid
          role: fk_relation_registry_nullable
        - name: topology
          type: jsonb[]
          role: id_references_and_vectors_only_no_actual_data
      manifest_resolution:
        api: resolve_active_by_role_target_layer_action
        sse: manifest_id_from_db_notify_payload
      topology_entry_types:
        - dispatcher_mapping
        - runtime_mapping
        - ui_projection
        - projection_constructor_mapping
        - sse_projection


    admin_import_snapshot:
      category: manifest
      file: db/manifest_tables.sql
      role: intake_snapshot_for_validate_preview_apply_cycle
      key_columns:
        - name: snapshot_id
          type: uuid
          role: pk_snapshot_reference_id
        - name: source_type
          type: text
          values: [csv, json]
        - name: manifest_id
          type: uuid
          role: manifest_reference_id
        - name: raw_rows_jsonb
          type: jsonb
          role: imported_row_snapshot_payload

    admin_import_records:
      category: manifest
      file: db/manifest_tables.sql
      role: per_row_jsonb_record_with_manifest_conformity_status
      key_columns:
        - name: id
          type: bigint
          role: physical_record_pk
        - name: manifest_id
          type: uuid
          role: manifest_reference_id
        - name: snapshot_id
          type: uuid
          role: snapshot_reference_id
        - name: records
          type: jsonb
          role: one_input_row_equals_one_jsonb_record
        - name: status
          type: enum_text
          values: [valid, invalid]
          role: manifest_conformity_status_not_business_or_hub_lifecycle_state

    admin_import_apply_log:
      category: manifest
      file: db/manifest_tables.sql
      role: explicit_apply_boundary_log_with_diff_reference
      key_columns:
        - name: apply_log_id
          type: uuid
          role: apply_reference_id
        - name: snapshot_id
          type: uuid
          role: snapshot_reference_id
        - name: applied_diff_jsonb
          type: jsonb
          role: minimal_applied_diff_reference
        - name: status
          type: text
          role: apply_execution_status

sql_attention_target_boundary:
  search_target: hubs
  not_search_target:
    - topologys
    - registry
  interpretation_path: hubs_relation_map_is_interpreted_under_topology_definition


sql_attention_target_note:
  target: hubs_tensor_attractor
  not_target:
    - topologys_direct_search
    - registry_direct_search
  interpretation: topology_is_semantic_definition_space_not_hubs_payload
  topology_recommendation_basis:
    - statistics
    - ema
    - usage_history
    - usage_frequency

