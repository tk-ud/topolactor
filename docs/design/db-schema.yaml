      logs: physical_time_axis_observations


  current_projection_namespace_contract:
    role: namespace_design_boundary
    intent:
      logs_namespace: SQL Attention physical mutation pressure, physical heat, hub current, and attention evidence
      recommendation_namespace: topology and context learning surfaces
    canonical_mapping:
      topology_physical: physical table and relation definition surfaces
      topology_ui: UI component, package, layout, and wiring definition surfaces
      hubs: topology meaning-space manifests and relation maps
      logs: SQL Attention and projection event observation surfaces

phase_attention_axis_mapping:
  quaternion_equation: q_equals_w_plus_xi_plus_yj_plus_zk
  q:
    meaning: logs.attention append-only phaseAT evidence row
    is_not:
      - Draft_canonical_object
      - adopted_canonical_state
  canonical_ID_space_axes:
    w:
      meaning: l2_norm
      attended_subject: physical_table_id
    x:
      meaning: SQL Attention near-neighbor hit hub_relation_id
    y:
      meaning: topology_manifest_id present on x
    z:
      meaning: hub_id registered by y
    i:
      meaning: farther hub_relation_id array from x ID vector bounded by w
    j:
      meaning: i plus farther topology_manifest_id array from y ID vector
    k:
      meaning: j plus farther hub_id array from z ID vector
  deprecated_count_scalar_interpretation:
    canonical: false
    legacy_only:
      - hub_relations_count
      - hub_count
      - topology_manifests_count
    allowed_use: statistics_or_support_cache_observation_only
  exploration_budget_gate:
    gate: w_l2_norm
    rule: Phase Attention does not perform full-space repeated search
    bounded_by:
      - data_defined_watched_topN_size
      - data_defined_topK_selection
      - data_defined_expansion_limits
  generation_line:
    append_only_evidence:
      - SQLAT_hit_evidence_row
      - phaseAT_evidence_row
    explicit_only:
      - Draft_promotion_command_or_user_operation
      - adopted_reflection_operation
    prohibited:
      - automatic_topology_mutation
      - automatic_registry_mutation
      - automatic_manifest_mutation
      - automatic_hub_relation_mutation

sql_attention_target_boundary:
  trigger_surface: logs.current topN rank and norm-level change
  related_manifest_resolution: physical_table_id / physical_table_name to topology_manifest_id array
  exploration_field: hubs.hub_relations
  hit_identity:
    - hub_relation_id
    - topology_manifest_id
    - hub_id_derived_through_hubs.topology_manifests
  persistence_surfaces:
    logs.current: rebuildable_trigger_basis
    logs.hub_current: optional_support_cache_derived_current_not_exploration_body
    logs.attention: append_only_SQLAT_phaseAT_evidence_generation_log
  signal_sources:
    - logs.diff
    - context_event
  not_targets:
    - logs_current_evidence_persistence_surfaces
    - topology_recommendation_surfaces
    - context_learning_surfaces
  interpretation_path: logs_diff_feeds_logs_current_trigger_then_related_manifest_IDs_scope_hubs_hub_relations_exploration_and_logs_attention_evidence_append

recommend_target_boundary:
  target:
    - topology.*
    - topology.wiring_physical_to_package
    - topology.components_*
    - context_* learning surfaces
  not_target:
    - sql_attention_hubs_rotation_target
  interpretation: recommendation_uses_topology_and_context_learning_surfaces

aggregate_trigger_table_contracts:
  status: canonical_active
  namespace: runtime_orchestration
  source_file: db/runtime_orchestration_tables.sql
  repository_implementation:
    - backend/repository/AggregateTriggerRepository.cs
    - backend/repository/NpgsqlAggregateTriggerRepository.cs
  live_db_proof:
    - backend/tests/Topolactor.Integration.Tests/AggregateTriggerRepositoryLiveDbTests.cs
    - backend/tests/Topolactor.Integration.Tests/AggregateTriggerSubstrateRouteLiveDbTests.cs
    - backend/tests/Topolactor.Integration.Tests/AdminRuntimeAggregateTriggerDefinitionPersistenceLiveDbTests.cs
  schema_qualified_tables:
    aggregate_trigger_definitions: runtime_orchestration.aggregate_trigger_definitions
    aggregate_trigger_event_evidence: runtime_orchestration.aggregate_trigger_event_evidence
    aggregate_trigger_current: runtime_orchestration.aggregate_trigger_current
    aggregate_trigger_materialization_evidence: runtime_orchestration.aggregate_trigger_materialization_evidence
  tables:
    runtime_orchestration.aggregate_trigger_definitions:
      role: canonical structured aggregate trigger definition store
      persistence_route: AdminRuntime validates admin/contents Step3 aggregate trigger definitions then calls AggregateTriggerRepository.SaveDefinitionAsync; screen_data_shape topology entry retains the same validated definitions as the Step3 authoring-draft projection for form re-hydration, not as execution authority.
      required_columns:
        - trigger_definition_id
        - processing_function_id
        - operation_definition_id
        - accepted_event_schema_ref
        - allowed_source_kinds_json
        - materialization_policy_ref
        - trigger_source_kind
        - execution_scope
        - transaction_boundary
        - aggregate_target_binding_json
        - conflict_key_fields_json
        - delta_map_json
        - threshold_policy_json
        - materialization_target_binding_json
        - materialization_payload_map_json
        - approval_policy
        - active
        - created_at
        - updated_at
      prohibited_columns:
        - raw_sql
        - raw_case_expression
        - raw_where_clause
        - arbitrary_table_name
    runtime_orchestration.aggregate_trigger_event_evidence:
      role: append-only idempotent input event evidence
      required_uniqueness: source_kind_source_id_correlation_id_event_fingerprint
    runtime_orchestration.aggregate_trigger_current:
      role: current aggregate row maintained by atomic upsert
      required_uniqueness: trigger_definition_id_plus_conflict_key_hash
    runtime_orchestration.aggregate_trigger_materialization_evidence:
      role: append-only evidence for controlled materialization attempts and outcomes
      required_uniqueness: trigger_definition_id_plus_materialization_target_plus_conflict_key_hash_plus_payload_fingerprint
  repository_requirements:
    - fixed_sql_template_only
    - parameterized_sql_only
    - atomic_upsert_for_aggregate_current
    - idempotent_append_for_event_evidence
    - duplicate_materialization_guard
    - aggregate_current_upsert_and_materialization_evidence_append_share_one_backend_transaction_when_materialization_is_attempted
