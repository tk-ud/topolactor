db_schema:
  name: topolactor_db_schema
  version: 0.1.0
  status: ssot_design_document
  source_files:
    - db/schema.sql
    - db/auth_tables.sql
    - db/auth_seed.sql
    - db/enum_tables.sql
    - db/enum_seed.sql
    - db/topology_tables.sql
    - db/promotion_tables.sql
    - db/sql_attention_logs_tables.sql
    - db/context_route_tables.sql
    - db/ui_topology_tables.sql
    - db/manifest_tables.sql

  categories:
    - topology_definition
    - converged_entity
    - promotion_policy
    - sql_attention_observation
    - context_route
    - ui_topology
    - manifest
    - auth_identity_session
    - enum_dictionary



  canonical_schema_namespaces:
    auth:
      status: canonical_active
      role: user identity, credentials, sessions, refresh tokens, login audit, grants
      reference: docs/design/auth-db-session-credential-ssot.yaml
      tables:
        - auth.users
        - auth.credentials
        - auth.sessions
        - auth.refresh_tokens
        - auth.login_events
        - auth.roles
        - auth.scopes
        - auth.grants
    enum:
      status: canonical_active
      role: enum item and enum group dictionary for admin column select and vector coordinates
      reference: docs/design/enum-dictionary-ssot.yaml
      tables:
        - enum.items
        - enum.groups
        - enum.group_items
    hubs:
      role: topology meaning space, hub manifest grouping, and fixed hub sequence
      canonical_tables:
        hub: hubs.hub
        topology_manifests: hubs.topology_manifests
        hub_relations: hubs.hub_relations
    topology:
      role: physical table catalog, UI component design/package/layout, and single-screen wiring manifests
      canonical_tables:
        components_bucket: topology.components_bucket
        components_style_design: topology.components_style_design
        components_layout_design: topology.components_layout_design
        components_package_design: topology.components_package_design
        physical_tables: topology.physical_tables
        wiring_physical_to_package: topology.wiring_physical_to_package
      migration_ddl_available_schema_surfaces:
        status: migration_ddl_available_bootstrap_included
        note: >-
          DDL included in db/init.sql (bootstrap) and CI backend-tests.yml schema setup step.
          Fresh deployments and rebuilt Docker volumes automatically create topology.mock_preset_* tables via bootstrap.
          Existing DBs outside the rebuild flow can apply db/migrations/mock_preset_registry_tables.sql manually.
          NpgsqlMockPresetRepository wired in Program.cs (DI/startup).
          E2E live DB integration tests (MockPresetLiveDbEndToEndTests) pass against local DB.
        mock_preset_registry: topology.mock_preset_registry
        mock_preset_object_mapping: topology.mock_preset_object_mapping
        mock_preset_wiring_candidate: topology.mock_preset_wiring_candidate
        mock_preset_compile_snapshot: topology.mock_preset_compile_snapshot
      planned_schema_surfaces:
        team_markdown_dashboard_saved_view:
          status: planned_schema_surface
          migration_status: not_created
          reference: docs/design/team-markdown-dashboard-saved-view-ssot.yaml
          parent_surface: Preset / preset seed / saved view ecosystem
          child_surface: team shared saved markdown view
          note: >-
            Planned Preset child surface only. No DB migration, bootstrap DDL, repository,
            backend runtime action, or UI component is created by this SSOT wiring. The saved
            Markdown view is a rendered projection; physical table / jsonb records remain the
            canonical data authority.
          ux_hard_gate_columns:
            - completed_preset_seed_json jsonb not null
            - card_metadata_json jsonb not null
          planned_topology_tables:
            - topology.team_markdown_template_registry
            - topology.team_markdown_saved_view
            - topology.team_markdown_saved_view_event
    logs:
      role: SQL Attention signal, current, hub current, and attention evidence
      canonical_tables:
        diff: logs.diff
        current: logs.current
        hub_current: logs.hub_current
        attention: logs.attention
    namespace_rules:
      - public_or_unqualified_tables_are_schema_drift_not_canonical
      - topologys_schema_is_naming_drift_and_must_migrate_to_topology
      - physical_spelling_is_canonical
      - sql_attention_target_hubs_space_with_logs_persistence_and_signal_surfaces
      - recommendation_target_topology_and_context_learning_surfaces

  postgresql_schema_namespaces:
    status: canonical_active
    note: >-
      Physical DB schema names in active canonical contract. topologys schema and hubs.hubs table
      migrations are recorded in compatibility_history below.
    hubs:
      status: canonical_active
      role: topology meaning space, hub manifest grouping, and fixed hub sequence
      tables:
        - hubs.hub
        - hubs.hub_relations
        - hubs.topology_manifests
    topology:
      status: canonical_active
      role: physical table catalog, registry tables, topology definition, wiring, UI component design/package/layout
      tables:
        - topology.physical_tables
        - topology.wiring_physical_to_package
        - topology.master_registry
        - topology.state_registry
        - topology.relation_registry
        - topology.package_registry
        - topology.schema_registry
        - topology.component_registry
        - topology.function_parameters
        - topology.structure_maps
        - topology.entities
        - topology.topology_edit_log
        - topology.demo_state_transitions
        - topology.content_entity_drafts
        - topology.admin_import_snapshot
        - topology.admin_import_records
        - topology.admin_import_apply_log
        - topology.components_bucket
        - topology.ui_component_registry
        - topology.ui_component_package
        - topology.ui_package_component_map
        - topology.components_layout_design
        - topology.ui_wiring_registry
        - topology.ui_topology_tensor
        - topology.ui_builder_components
        - topology.components_style_design
        - topology.components_package_design
      migration_ddl_available:
        status: migration_ddl_available_bootstrap_included
        reference: docs/design/mock-preset-intake-compiler-ssot.yaml
        migration_ddl: db/migrations/mock_preset_registry_tables.sql
        bootstrap_path: db/init.sql (includes mock_preset_registry_tables.sql after ui_topology_tables.sql)
        ci_path: .github/workflows/backend-tests.yml "Apply DB schema" step
        note: >-
          DDL idempotent migration (CREATE TABLE IF NOT EXISTS) included in db/init.sql bootstrap
          and CI backend-tests.yml schema setup. Fresh deployments and rebuilt Docker volumes create
          these tables automatically. Existing DBs outside the rebuild flow can apply
          db/migrations/mock_preset_registry_tables.sql manually. NpgsqlMockPresetRepository wired in
          Program.cs. E2E live DB integration tests pass.
        tables:
          - topology.mock_preset_registry
          - topology.mock_preset_object_mapping
          - topology.mock_preset_wiring_candidate
          - topology.mock_preset_compile_snapshot
      planned_schema_surface:
        status: planned_schema_surface
        migration_status: not_created
        reference: docs/design/team-markdown-dashboard-saved-view-ssot.yaml
        parent_surface: Preset / preset seed / saved view ecosystem
        child_surface: team shared saved markdown view
        not_canonical_active: true
        no_migration_created: true
        note: >-
          Topology placement is planned for the Preset child saved Markdown view surface only.
          completed_preset_seed_json and card_metadata_json are UX hard-gate JSONB columns,
          but no migration/DDL exists yet and this surface is not production ready.
        tables:
          - topology.team_markdown_template_registry
          - topology.team_markdown_saved_view
          - topology.team_markdown_saved_view_event
    logs:
      role: sql_attention_parent_observation_plane_statistics_current_attention_evidence
      tables:
        - logs.diff
        - logs.current
        - logs.hub_current
        - logs.attention
    compatibility_history:
      topologys_schema:
        status: migration_completed
        migration_target: topology
        note: All topologys.* tables migrated to topology.* schema. topologys schema deprecated.
        former_tables:
          - topologys.registrar_entries
          - topologys.master_registry
          - topologys.state_registry
          - topologys.relation_registry
          - topologys.package_registry
          - topologys.schema_registry
          - topologys.component_registry
          - topologys.function_parameters
          - topologys.structure_maps
          - topologys.entities
          - topologys.topology_edit_log
          - topologys.demo_state_transitions
          - topologys.content_entity_drafts
          - topologys.admin_import_snapshot
          - topologys.admin_import_records
          - topologys.admin_import_apply_log
      hubs_hubs_table:
        status: migration_completed
        migration_target: hubs.hub
        note: hubs.hubs renamed to hubs.hub with relation JSONB join definition added.
      admin_import_manifest_fk:
        status: migration_ddl_available
        migration_target: hubs.topology_manifests
        bootstrap_ddl: db/manifest_tables.sql
        migration_ddl: db/migrations/admin_import_topology_manifest_migration.sql
        remap_policy: >-
          Existing admin_import_snapshot rows hold old manifest_id UUIDs from public.manifest,
          which are not valid hubs.topology_manifests IDs. Before adding the FK constraint,
          orphaned rows are remapped to the oldest hubs.topology_manifests row (by created_at).
          Explicit RAISE EXCEPTION if no topology_manifests row exists and orphaned rows are present.
          admin_import_records topology_manifest_id remains a soft reference (no FK); linked via snapshot_id.
        note: >-
          admin_import_snapshot.manifest_id FK to public.manifest retired.
          Column renamed to topology_manifest_id, FK now references hubs.topology_manifests.
          admin_import_records.manifest_id renamed to topology_manifest_id (soft reference, no FK).
          public.manifest retained as compatibility-only for SeedImportApplyRepository runtime routing.
        former_columns:
          - admin_import_snapshot.manifest_id (FK to public.manifest)
          - admin_import_records.manifest_id (FK to public.manifest)
      ui_topology_to_canonical_schema:
        status: migration_ddl_available
        migration_target: topology schema
        bootstrap_ddl: db/ui_topology_tables.sql
        migration_ddl: db/migrations/ui_topology_to_canonical_schema.sql
        upsert_policy: >-
          Each INSERT uses ON CONFLICT (business_key) DO NOTHING. Canonical-table rows
          take precedence over old public rows with the same business key. Child FKs
          are remapped through canonical business keys. ui_topology_tensor.parent_tensor_id
          is restored through the canonical logical parent tuple, not direct UUID match.
          Non-NULL legacy parent references fail explicitly when the old parent row is
          dangling or its canonical logical tuple cannot be resolved; no silent NULL
          fallback is allowed. Idempotent on re-runs. DROP IF EXISTS is safe on fresh
          DBs (old tables never existed).
        note: >-
          All public UI component/design/layout/package tables migrated to topology.* canonical schema
          and then retired (DROPped in reverse dependency order with CASCADE).
          public.ui_component_bucket -> topology.components_bucket,
          public.ui_component_registry -> topology.ui_component_registry,
          public.ui_component_package -> topology.ui_component_package,
          public.ui_package_component_map -> topology.ui_package_component_map,
          public.ui_layout_registry -> topology.components_layout_design,
          public.ui_wiring_registry -> topology.ui_wiring_registry,
          public.ui_topology_tensor -> topology.ui_topology_tensor,
          public.components -> topology.ui_builder_components,
          public.design -> topology.components_style_design,
          public.packages -> topology.components_package_design.
        former_tables:
          - public.ui_component_bucket
          - public.ui_component_registry
          - public.ui_component_package
          - public.ui_package_component_map
          - public.ui_layout_registry
          - public.ui_wiring_registry
          - public.ui_topology_tensor
          - public.components
          - public.design
          - public.packages
      hub_relations_legacy_global_graph:
        status: migration_ddl_available
        migration_target: hubs.hub_relations
        bootstrap_ddl: db/topology_tables.sql
        migration_ddl: db/migrations/hub_relations_legacy_to_manifest_scoped.sql
        bootstrap_policy: CREATE TABLE IF NOT EXISTS only; no DROP TABLE CASCADE
        note: >-
          Legacy hub_relations used hub_id / target_hub_id / relation_registry_id as a global
          hub-to-hub graph. Canonical shape is manifest-scoped under hubs.topology_manifests
          (topology_manifest_id + related_hub_id + sequence_position + relation_config + status).
          Fresh DB bootstrap applies the new shape via topology_tables.sql. Existing DBs with
          legacy columns run db/migrations/hub_relations_legacy_to_manifest_scoped.sql:
          resolve or create one active topology_manifest per source hub_id, map target_hub_id to
          related_hub_id, preserve sequence_position, store relation_registry_id under
          relation_config.legacy. Ambiguous cases fail explicitly (no silent fallback).
        former_columns:
          - hub_id
          - target_hub_id
          - relation_registry_id
    registry_schema_policy:
      has_dedicated_schema: false
      rule: registry_is_tensor_map_reference_concept_not_schema_namespace


  conceptual_namespace_reading:
    note: physical_schema_names_follow_canonical_contract_until_explicit_schema_contract_update
    logical_namespaces:
      hub_registry: hub_or_relation_composition_definitions
      topology_registry: topology_semantic_space_definitions
      ui_registry: ui_package_layout_wiring_definitions
      wiring_definition_for_dispatcher_and_projection: topology_ui
      hubs: relation_maps_over_defined_ids_fk_and_reference_arrays
      ui_relation: parent_child_relation_map_parent_data_type_or_physical_table_to_child_package_payload_bundles
      logs: physical_time_axis_observations


  current_projection_namespace_contract:
    role: namespace_design_boundary
    intent:
      logs_namespace: SQL Attention physical mutation pressure, physical heat, hub current, and attention evidence
      recommendation_namespace: topology and context learning surfaces
    canonical_mapping:
      topology_physical: physical table and relation definition surfaces
      topology_ui: UI component, package, layout, and wiring definition surfaces
      hubs: topology meaning-space manifests and relation maps
      logs: SQL Attention and projection event observation surfaces
