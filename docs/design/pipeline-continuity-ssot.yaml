pipeline_continuity_ssot:
  name: topolactor_pipeline_continuity_ssot
  version: 0.2.3
  status: ssot_design_document

  purpose:
    - data_driven_vertical_slice_continuity
    - hardcode_guard_for_dispatcher_bypass_and_fallback_detection
    - canonical_route_identity_and_boundary_contract

  ci_contract_reference:
    source: docs/design/ci-contract-ssot.yaml
    usage:
      - csharp_dotnet_lane_tests_define_semantic_assertions
      - shell_gate_keeps_minimal_presence_checks
      - runtime_orchestration_vocabulary_is_audited_when_lane_contract_changes
      - workflow_registration_must_cover_lane_test_packages
      - ci_status_is_branchable_operational_signal
      - admin_runtime_diagnostic_read_surface_uses_runtime_callable_interface_not_test_runner
    minimal_gate_scope:
      - lane_definition_presence
      - ci_package_or_test_file_reference_presence
      - workflow_registration_presence
      - ssot_reference_presence
    ssot_vocabulary_contract:
      rule:
        - implementation_discrete_values_must_be_subset_of_ssot_allowed_values
        - pipeline_body_and_contract_tests_must_read_ssot_yaml
        - tests_must_not_redefine_expected_vocabulary
        - gap_blocking_drift_not_covered_are_not_equivalent_to_pass
        - pipeline_checks_must_expose_boundary_failures_as_structured_status_not_silent_fallback
        - enumerated_gap_status_must_not_be_treated_as_pass
        - admin_ui_diagnostic_lane_must_use_runtime_read_surface_and_must_not_treat_shell_or_test_runner_as_product_runtime
      applies_to:
        - component_catalog_classification
        - db_seed_status_type_kind
        - event_type
        - runtime_destination
        - property_naming
        - validation_class
        - pipeline_required_identity
        - prohibited_boundary_terms

  admin_runtime_diagnostic_read_lane_reference:
    source: docs/design/system-ci-admin-runtime-callable-surface.yaml
    route_intent:
      - frontend_dispatch_api
      - backend_dispatch_endpoint
      - runtime_timeline_scheduler
      - manifest_dispatcher
      - AdminRuntime.ExecuteDataAsync
      - system_ci_diagnostic_interface
    boundary:
      - diagnostics_evidence_eligibility_read_only_surface
      - no_test_runner_or_shell_invocation_in_product_runtime_lane
      - draft_authoring_must_not_be_blocked_by_ci_attention_fragment_state
      - canonical_promotion_gate_may_read_active_blocking_fragment_as_backend_guard_input

  ci_responsibility_split:
    sh_checks:
      role:
        - ai_agent_operational_guard
        - lightweight_structure_and_routing_guard
      verifies:
        - agents_rules_todo_summary_required_check_and_ssot_lane_existence
    csharp_dotnet_tests:
      role:
        - application_side_ssot_wiring_audit
        - runtime_registration_promotion_eligibility_validation
      verifies:
        - ssot_yaml_contracts
        - staging_and_fixture_data
        - registry_records_or_test_fixtures
        - runtime_outputs
        - diagnostics_and_evidence
      lanes:
        - topology_registration_ci
        - hub_registration_ci
        - scheduler_runtime_ci
        - component_registration_ci
      initial_scope_out:
        - no_db_writes
        - no_automatic_promotion
        - verdict_surface_is_diagnostics_evidence_eligibility

  # Pipeline body checks use data-driven fixture execution, not vocabulary grep.
  # See pipeline_body_test.ci_script for the delegation target in each lane.
  # check-pipeline-continuity.sh covers hardcode_guard and gap_status only (bash).
  # Pipeline body runs in default-entity-search.yml via check-default-entity-search.sh.

  lanes:

    api_command_lane:
      description: >
        client command enters via ui_action, passes through frontend_scheduler,
        api_client, backend_endpoint, backend_scheduler, manifest_dispatcher,
        topology_transform_runtime (RuntimeExecutor), entity/emission, and projects back
        through frontend projection components. Node wiring in this document declares canonical route boundaries and identity continuity.
      direction: client_to_server_to_client

      required_identity:
        # Data identity fields that must survive the full pipeline.
        # These are the subject of the data-driven fixture test, not code symbols.
        - target
        - layer
        - action
        - role
        - trigger_kind
        - attractor_key
        - structure_map_id
        - package_id
        - schema_id
        - component_ids

      nodes:
        - node: frontend.ui_action
          files:
            - frontend/islands/OperationPanel.tsx

        - node: frontend.scheduler
          files:
            - frontend/runtime/frontendScheduler.ts
          implementation_note: >
            Lane boundary: FIFO serial queue via queueClientCommand. Commands execute
            serially in enqueue order; errors propagate to the failed command's awaiter
            only; subsequent commands are unaffected. Owns client_command_order and async
            execution. sse_projection_order, projection_batch_boundary, rollback_boundary,
            and optimistic_update_boundary are separate runtime boundary contracts.

        - node: frontend.api_client
          files:
            - frontend/api/dispatch.ts
            - frontend/routes/api/dispatch.ts

        - node: backend.endpoint
          files:
            - backend/endpoint/DispatchEndpoint.cs

        - node: backend.scheduler
          files:
            - backend/scheduler/RuntimeTimelineScheduler.cs
          implementation_note: >
            Lane boundary: synchronous delegate to ManifestDispatcher. Client requests now
            enter via RuntimeTimelineScheduler → ManifestDispatcher → RuntimeExecutor.
            Ordering and collision control are separate runtime boundary contracts.

        - node: backend.manifest_dispatcher
          files:
            - backend/runtime/ManifestDispatcher.cs
          implementation_note: >
            Lane boundary: synchronous delegate to RuntimeExecutor. Manifest-driven routing
            by axes (role, target, layer, action) is a canonical runtime boundary contract.

        - node: backend.topology_transform_runtime
          files:
            - backend/runtime/RuntimeExecutor.cs
          implementation_note: >
            RuntimeExecutor boundary may cover backend_scheduler,
            manifest_dispatcher, and topology_transform_runtime roles only when
            scheduler → dispatcher → runtime identity is preserved.

        - node: backend.entity_and_emission
          files:
            - backend/runtime/EmissionBuilder.cs
            - backend/repository/TopologyRepository.cs

        - node: frontend.projection
          files:
            - frontend/components/EmissionView.tsx
            - frontend/components/ProjectionView.tsx
            - frontend/runtime/renderEmission.ts

      required_endpoint:
        path: /api/dispatch
        frontend_route: frontend/routes/api/dispatch.ts
        backend_handler: backend/endpoint/DispatchEndpoint.cs

      pipeline_body_test:
        kind: data_driven_fixture_execution
        ci_script: .agent/tests/check-default-entity-search.sh
        fixture_path: default:entity:search
        verifies:
          - EndpointRequestDto{target=default,layer=entity,action=Search} flows through RuntimeExecutor to Emission
          - emission.structureMapId is present and non-null
          - emission.packageId is present and non-null
          - emission.schemaId is present and non-null
          - emission.componentIds is non-empty
          - frontend renderEmission expands componentIds through registry to non-error specs
        test_files:
          - backend/tests/Topolactor.Integration.Tests/DefaultEntitySearchIntegrationTests.cs
          - backend/tests/Topolactor.Runtime.Tests/RuntimeExecutorTests.cs
          - frontend/tests/defaultEntitySearch.test.ts

      hardcode_guard:
        description: >
          Checks that topology_transform_runtime (RuntimeExecutor) does not accumulate
          hardcoded target/layer/action dispatch branching beyond documented boundary-contract
          exceptions. Such branching replaces data-driven manifest_dispatcher routing.
        file: backend/runtime/RuntimeExecutor.cs
        checks:
          - id: target_dispatch_branching
            patterns:
              - 'vector\.Target =='
              - 'string\.Equals(vector\.Target'
            allowed_count: 3
            preferred_count: 0
            allowed_exceptions:
              - demo_entity_check_in_TargetDispatchOverride
              - admin_path_in_TargetDispatchOverride
              - demo_validation_in_TargetDispatchOverride
            note: >
              0 is preferred — branches are isolated to TargetDispatchOverride boundary.
              Allowed up to 3 for isolated compatibility boundaries where
              manifest_dispatcher_routing_is_canonical_preferred_route.
              Count above 3 indicates a new hardcoded dispatch target being added to RuntimeExecutor;
              new targets must be routed through manifest_dispatcher, not hardcoded.

    frontend_component_event_log_lane:
      status: implemented_contract
      description: >
        UI components emit operation events to a frontend runtime queue. The frontend runtime
        scheduler batches those events and flushes them to the backend component-event-log
        intake boundary on a short interval (target: about 10 seconds). Components do not own
        DB persistence, backend API branching, topology judgment, or SQL Attention judgment.
        This lane is the canonical boundary for UI operation observation and future learning,
        recommendation, and audit usage.
      direction: client_observation_to_server_log

      required_identity:
        - component_id
        - package_id
        - layout_id
        - event_type
        - payload
        - actor_or_source
        - occurred_at
        - idempotency_key

      nodes:
        - node: frontend.component
          files:
            - frontend/components/
          implementation_note: >
            Components emit normalized operation events only. They must not call DB persistence
            APIs directly and must not own topology/API dispatch branching.

        - node: frontend.component_event_runtime
          files:
            - frontend/runtime/
          implementation_note: >
            Owns in-memory event queue, event normalization, ordering boundary, debounce/throttle,
            batch_size, flush_interval_seconds, retry policy, explicit failure state, and lifecycle
            flush handling. The default design target is periodic background flush around 10 seconds,
            not per-event DB persistence.

        - node: frontend.local_event_cache
          files:
            - frontend/runtime/
          implementation_note: >
            Fallback cache only. When scheduler/flush/offline/page lifecycle interruption prevents
            delivery, unsent events may be stored in localStorage as a bounded cache. Successful ACK
            releases cached events in order. Cache must define max_events, max_bytes, ttl,
            schema_version, and sensitive-payload exclusion.

        - node: frontend.component_event_api_client
          files:
            - frontend/routes/api/
          implementation_note: >
            Sends event batches produced by frontend.component_event_runtime. It does not receive
            arbitrary component-local API calls.

        - node: backend.component_event_log_intake
          files:
            - backend/endpoint/
            - backend/repository/
            - backend/schema/
          implementation_note: >
            Accepts component operation event batches, enforces idempotency_key duplicate handling,
            returns explicit success/failure ACK, and appends accepted events to the canonical DB log.

      event_types:
        - click
        - change
        - select
        - toggle
        - expand
        - collapse
        - submit
        - focus
        - blur
        - drag
        - drop

      persistence_policy:
        primary_queue: in_memory_frontend_runtime_queue
        fallback_cache: localStorage_bounded_cache
        flush_interval_target_seconds: 10
        ack_release: required
        duplicate_boundary: idempotency_key
        prohibited:
          - component_direct_db_api_call
          - silent_drop_on_flush_failure
          - unbounded_localStorage_growth
          - secret_or_large_payload_localStorage_cache
          - frontend_topology_or_sql_attention_judgment

      transport_selection_policy:
        default_event_log_transport: interval_batch_flush_or_polling
        default_event_log_transport_reason: >
          Standard business UI operation logs prioritize non-lossy observation, retry, append-only
          persistence, and auditability over sub-second bidirectional transport. Polling/interval
          batch flush is sufficient by default because server-to-client projection already has the
          SSE lane.
        server_to_client_projection_transport: sse_projection_lane
        websocket_default: not_required_for_standard_component_event_logs
        websocket_allowed_when:
          - high_frequency_pointer_stream
          - drawing_canvas
          - collaborative_editing
          - realtime_cursor_or_presence
          - continuous_drag_or_resize_preview
          - bidirectional_low_latency_ui_state_required
        websocket_requirements:
          - explicit_lane_or_policy_extension
          - event_identity_preservation
          - reconnect_and_dedup_boundary
          - backpressure_or_rate_limit_boundary
          - fallback_or_replay_boundary
        prohibited:
          - websocket_as_default_for_all_component_events
          - replacing_event_log_batch_flush_without_explicit_low_latency_requirement
          - using_transport_choice_to_bypass_canonical_event_log_persistence

      completion_condition:
        - components_emit_operation_events_to_frontend_runtime_queue
        - frontend_runtime_batches_and_flushes_events_on_interval
        - failed_or_interrupted_flush_can_recover_from_bounded_localStorage_cache
        - backend_event_log_intake_appends_events_with_idempotency_boundary
        - components_do_not_directly_call_persistence_api

      pipeline_body_test:
        kind: boundary_contract
        ci_script: .agent/tests/check-pipeline-continuity.sh
        test_files:
          - backend/tests/Topolactor.Runtime.Tests/FrontendComponentEventLogLaneTests.cs
          - frontend/tests/frontendComponentEventRuntime.test.ts
        verifies:
          - required_identity fields preserve through endpoint-to-repository append path
          - duplicate idempotency is accepted
          - invalid payload fails close (not ACK-only)
          - queue flush/retry/bounded fallback behavior remains explicit
        note: >
          check-pipeline-continuity.sh validates lane contract presence and CI registration;
          runtime semantics are delegated to dedicated dotnet/deno tests above.


    frontend_projection_constructor_lane:
      description: >
        component_definition payload is transformed into projection_definition,
        normalized through projectionConstructor, stored in ComponentDataHub shape,
        and projected as primitive props. This lane is the frontend projection surface
        contract and must preserve identity and explicit-failure boundaries.
      direction: server_projection_to_frontend_props

      required_identity:
        - componentId
        - componentKey
        - packageId
        - layoutId
        - component_kind
        - semantic_role
        - visual_role
        - event_binding
        - parameter_schema
        - merged_props

      nodes:
        - node: frontend.component_definition_payload
          files:
            - frontend/tests/projectionConstructor.test.ts

        - node: frontend.projection_definition
          files:
            - frontend/runtime/projectionConstructor.ts

        - node: frontend.projection_constructor
          files:
            - frontend/runtime/projectionConstructor.ts
          implementation_note: >
            Merge order is default_parameters -> json_key_value -> projectionOverrides.
            Any malformed payload/schema/event binding must fail explicitly without silent fallback.

        - node: frontend.component_data_hub
          files:
            - frontend/runtime/projectionConstructor.ts

        - node: frontend.primitive_props_projection
          files:
            - frontend/runtime/projectionConstructor.ts

      prohibited:
        - componentId_drift
        - silent_fallback_for_malformed_component_definition_payload
        - malformed_schema_silent_pass
        - unsupported_schema_type_silent_pass
        - invalid_event_binding_fallback_to_empty_object
        - boolean_coercion
        - frontend_topology_judgment
        - frontend_sql_attention_judgment
        - frontend_persistence_judgment
        - component_direct_api_or_db_persistence_decision

      pipeline_body_test:
        kind: unit_boundary_contract
        ci_script: .agent/tests/check-pipeline-continuity.sh
        note: >
          check-pipeline-continuity.sh validates this lane's SSOT vocabulary contract and
          delegates runtime semantics to projectionConstructor unit tests.
        test_files:
          - frontend/tests/projectionConstructor.test.ts
        verifies:
          - component_definition payload identity preservation
          - componentId drift is rejected
          - merge order default_parameters -> json_key_value -> projectionOverrides
          - malformed or unsupported parameter_schema returns explicit error
          - invalid event_binding payload returns explicit error
          - boolean coercion and silent fallback are prohibited
          - frontend does not own topology/SQL Attention/persistence judgment

    sse_projection_lane:
      description: >
        server event propagates through backend_sse_emitter, frontend_sse_receiver,
        frontend_sse_dispatcher, and projects through projection_runtime. Node wiring in this document declares canonical route boundaries and identity continuity. End-to-end SSE data flow follows this lane contract.
      direction: server_to_client
      event_types:
        - projection
        - Attention

      required_identity:
        - manifest_id
        - component_ids
        - attention_score

      nodes:
        - node: backend.attention_compute
          files:
            - backend/schema/ContextRouteContracts.cs

        - node: backend.sse_emitter
          files:
            - backend/endpoint/SseEndpoint.cs
          implementation_note: >
            Lane boundary: keep-alive ping plus projection event streaming.
            SseEndpoint streams broadcaster subscriber-channel events (including
            projection lane payloads) while also emitting ping keep-alive frames.
            Live DB pg_notify hardening and full production verification remain
            a separate runtime boundary contract.

        - node: frontend.sse_receiver
          files:
            - frontend/runtime/sseReceiver.ts
          implementation_note: >
            Lane boundary: EventSource-based receiver with connect/disconnect interface.
            Wiring to dispatcher and scheduler follows a separate runtime boundary contract.

        - node: frontend.sse_dispatcher
          files:
            - frontend/runtime/sseDispatcher.ts
          implementation_note: >
            Lane boundary: handler map with register/route interface. Feeds into
            frontend projection runtime as hook_trigger.

        - node: frontend.sse_projection
          files:
            - frontend/components/ProjectionView.tsx

      required_endpoint:
        path: /api/sse
        frontend_route: frontend/routes/api/sse.ts
        backend_handler: backend/endpoint/SseEndpoint.cs

      pipeline_body_test:
        kind: unit_boundary_contract
        ci_script: .agent/tests/check-default-entity-search.sh
        note: >
          SSE lane unit tests cover dispatcher/receiver/projection identity via
          frontend/tests/pipelineContinuity.test.ts. End-to-end SSE integration test
          (real server push through full lane) requires full lane event emission and verification under this contract.
        test_files:
          - frontend/tests/pipelineContinuity.test.ts

      contract_guard: >
        Node contract must be validated by listed files and pipeline body tests.
        Route changes require explicit SSOT contract updates.
