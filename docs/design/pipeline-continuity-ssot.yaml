pipeline_continuity_ssot:
  name: topolactor_pipeline_continuity_ssot
  version: 0.2.4
  status: ssot_design_document

  purpose:
    - data_driven_vertical_slice_continuity
    - hardcode_guard_for_dispatcher_bypass_and_fallback_detection
    - canonical_route_identity_and_boundary_contract

  ci_contract_reference:
    source: docs/design/ci-contract-ssot.yaml
    usage:
      - csharp_dotnet_lane_tests_define_semantic_assertions
      - shell_gate_keeps_minimal_presence_checks
      - runtime_orchestration_vocabulary_is_audited_when_lane_contract_changes
      - workflow_registration_must_cover_lane_test_packages
      - ci_status_is_branchable_operational_signal
      - admin_runtime_diagnostic_read_surface_uses_runtime_callable_interface_not_test_runner
    minimal_gate_scope:
      - lane_definition_presence
      - ci_package_or_test_file_reference_presence
      - workflow_registration_presence
      - ssot_reference_presence
    ssot_vocabulary_contract:
      rule:
        - implementation_discrete_values_must_be_subset_of_ssot_allowed_values
        - pipeline_body_and_contract_tests_must_read_ssot_yaml
        - tests_must_not_redefine_expected_vocabulary
        - gap_blocking_drift_not_covered_are_not_equivalent_to_pass
        - pipeline_checks_must_expose_boundary_failures_as_structured_status_not_silent_fallback
        - enumerated_gap_status_must_not_be_treated_as_pass
        - admin_ui_diagnostic_lane_must_use_runtime_read_surface_and_must_not_treat_shell_or_test_runner_as_product_runtime
      applies_to:
        - component_catalog_classification
        - db_seed_status_type_kind
        - event_type
        - runtime_destination
        - property_naming
        - validation_class
        - pipeline_required_identity
        - prohibited_boundary_terms

  test_tier_policy:
    purpose: >
      Classify verification depth for runtime pipeline changes without forcing every
      API or every CRUD-equivalent action through a full frontend-to-backend-to-frontend
      loop. Existing lane tests and helpers are the primary building blocks; add a
      scenario harness only when a product runtime crossing requires final state proof.

    tiers:
      tier_0_syntax_static:
        applies_to:
          - all_api_changes
          - all_runtime_changes
          - all_frontend_changes
        required_checks:
          - deno_fmt_lint_check_for_touched_frontend_scope
          - dotnet_build_and_dotnet_test_for_touched_backend_scope
          - ssot_vocabulary_membership
          - route_action_manifest_registration_presence
          - no_silent_fallback_guard
        completion_rule: syntax_static_success_is_required_but_not_sufficient_for_runtime_completion

      tier_1_lane_unit_boundary:
        applies_when: target_lane_or_boundary_changes
        lanes:
          - api_command_lane
          - frontend_component_event_log_lane
          - frontend_projection_constructor_lane
          - sse_projection_lane
          - ui_layout_patch_serialization_lane
        representative_assets:
          syntax_static_check:
            - .agent/tests/check-pipeline-continuity.sh
            - .agent/tests/check-structure.sh
          unit_test:
            - frontend/tests/runtimeComponentFactory.test.ts
            - frontend/tests/renderEmissionPropBindings.test.ts
            - frontend/tests/adminWiringExecutionLane.test.ts
            - backend/tests/Topolactor.Runtime.Tests/RuntimeExecutorTests.cs
          lane_boundary_test:
            - frontend/tests/projectionConstructor.test.ts
            - frontend/tests/defaultEntitySearch.test.ts
            - backend/tests/Topolactor.Runtime.Tests/FrontendComponentEventLogLaneTests.cs
          serialization_round_trip_test:
            - frontend/tests/visualLayoutBuilder.test.ts
            - frontend/tests/draftPreviewToEmission.test.ts
          dispatch_backend_runtime_test:
            - backend/tests/Topolactor.Runtime.Tests/RuntimeExecutorTests.cs
            - backend/tests/Topolactor.Runtime.Tests/SsotWiringAuditSchedulerRuntimeTests.cs
          db_repository_test:
            - backend/tests/Topolactor.Integration.Tests/DefaultEntitySearchIntegrationTests.cs
            - backend/tests/Topolactor.Runtime.Tests/SsotWiringAuditTopologyRegistrationTests.cs
          sse_projection_refresh_test:
            - backend/tests/Topolactor.Runtime.Tests/FrontendComponentEventLogLaneTests.cs
            - frontend/tests/uiRenderedInteraction.test.ts
          frontend_final_render_state_assertion_test:
            - frontend/tests/runtimeComponentFactory.test.ts
            - frontend/tests/defaultEntitySearch.test.ts
            - frontend/tests/uiRenderedInteraction.test.ts

      tier_2_scenario_harness:
        required_when:
          - new_runtime_added
          - new_dispatch_action_added
          - ui_operation_wiring_added
          - change_crosses_layout_patch_json_emission_renderEmission_runtimeComponentFactory
          - db_update_result_returns_to_projection_sse_frontend
          - runtime_ui_state_mutation_added_for_modal_drawer_dialog_tabs_accordion
          - backend_runtime_result_affects_frontend_final_state
        rule: >
          Compose existing test helpers and lane tests into a representative product-runtime
          scenario. Do not create a large new E2E platform first. The harness must assert
          the state source that changed and the final rendered/runtime state that consumes it.
        ui_builder_runtime_interaction_representative_scenario:
          id: button_click_modal_open_close
          test_files:
            - frontend/tests/runtimeUiInteractionScenario.test.ts
            - backend/tests/Topolactor.Runtime.Tests/NpgsqlUiTopologyRepositoryLayoutPatchValidationTests.cs
          helper_chain:
            - buildVisualLayoutPatchJson
            - parseVisualLayoutPatchJson
            - draftPreviewResultToEmission_or_backend_equivalent_emission_restore
            - renderEmission
            - parseEventBinding
            - emitBoundEvent
            - runtimeComponentFactory_or_projection_runtime_state_store
          fixture_steps:
            - create_layout_patch_fixture_with_button_node_and_modal_node
            - author_button_runtime_ui_interaction_wiring_for_modal_open
            - round_trip_through_buildVisualLayoutPatchJson_and_parseVisualLayoutPatchJson
            - restore_to_emission_via_draftPreviewResultToEmission_or_backend_equivalent
            - renderEmission_to_runtime_component_specs
            - assert_button_runtimeSpec_has_click_interaction
            - emitBoundEvent_button_click
            - assert_projection_local_state_store_sets_modal_open_true
            - assert_modal_final_props_or_dom_state_open_true
            - execute_close_action_and_assert_modal_open_false
          preview_boundary:
            - stateJson_open_is_initial_state_injection_only
            - propsJson_eventWirings_is_legacy_raw_fallback_until_migrated_to_canonical_contract
            - previewMode_uses_inert_binding_and_must_not_be_counted_as_production_runtime_execution
          responsibility_split:
            routeNavigation: frontend_local_route_change_only
            runtimeDispatch: backend_dispatch_lane_only
            local_ui_state_mutation: projection_local_state_update_for_target_node_props

      tier_3_full_product_acceptance_manual_hand_debug:
        required_only_when:
          - product_experience_crosses_multiple_runtimes_multiple_screens_auth_sse_db
          - release_acceptance
          - roadmap_completion_condition_final_confirmation
        rule: >
          Manual hand-debug or full product acceptance is not the default bar for every
          API. It is reserved for product experience acceptance and release-level evidence.

    non_goals_and_completion_guards:
      - do_not_require_frontend_api_dispatch_db_sse_frontend_final_assertion_for_every_api
      - crud_equivalent_apis_may_use_representative_fixture_plus_registration_static_vocabulary_checks
      - api_specific_unique_db_side_effect_projection_sse_or_frontend_state_requires_additional_scenario
      - backend_ok_true_only_is_not_completion_pass
      - frontend_render_only_is_not_completion_pass
      - event_log_append_only_is_not_ui_operation_execution_pass
      - runtime_with_db_update_must_assert_db_state_or_projection_source_changed
      - runtime_returning_to_frontend_must_assert_sse_or_refetch_final_dom_or_state

    backend_db_sse_scenario_harness_policy:
      representative_route: frontend_payload_to_dispatch_to_runtime_to_db_to_projection_or_sse_to_frontend_final_assertion
      fixture_policy:
        - one_representative_fixture_per_runtime_or_action_class_not_per_identical_api
        - crud_equivalent_runtime_uses_representative_fixture_plus_registration_vocabulary_static_checks
        - unique_side_effect_runtime_requires_individual_scenario
        - runtime_without_sse_contract_may_use_refetch_or_projection_response_assertion
        - runtime_with_sse_contract_must_assert_receive_then_final_render_or_state
      reusable_assets:
        - backend_endpoint_dispatch_tests
        - backend_runtime_executor_tests
        - backend_repository_or_integration_tests
        - sse_projection_lane_tests
        - frontend_renderEmission_and_runtimeComponentFactory_tests

  admin_runtime_diagnostic_read_lane_reference:
    source: docs/design/system-ci-admin-runtime-callable-surface.yaml
    route_intent:
      - frontend_dispatch_api
      - backend_dispatch_endpoint
      - runtime_timeline_scheduler
      - manifest_dispatcher
      - AdminRuntime.ExecuteDataAsync
      - system_ci_diagnostic_interface
    boundary:
      - diagnostics_evidence_eligibility_read_only_surface
      - no_test_runner_or_shell_invocation_in_product_runtime_lane
      - draft_authoring_must_not_be_blocked_by_ci_attention_fragment_state
      - canonical_promotion_gate_may_read_active_blocking_fragment_as_backend_guard_input

  ci_responsibility_split:
    sh_checks:
      role:
        - ai_agent_operational_guard
        - lightweight_structure_and_routing_guard
      verifies:
        - agents_rules_todo_summary_required_check_and_ssot_lane_existence
    csharp_dotnet_tests:
      role:
        - application_side_ssot_wiring_audit
        - runtime_registration_promotion_eligibility_validation
      verifies:
        - ssot_yaml_contracts
        - staging_and_fixture_data
        - registry_records_or_test_fixtures
        - runtime_outputs
        - diagnostics_and_evidence
      lanes:
        - topology_registration_ci
        - hub_registration_ci
        - scheduler_runtime_ci
        - component_registration_ci
      initial_scope_out:
        - no_db_writes
        - no_automatic_promotion
        - verdict_surface_is_diagnostics_evidence_eligibility

  # Pipeline body checks use data-driven fixture execution, not vocabulary grep.
  # See pipeline_body_test.ci_script for the delegation target in each lane.
  # check-pipeline-continuity.sh covers hardcode_guard and gap_status only (bash).
  # Pipeline body runs in default-entity-search.yml via check-default-entity-search.sh.

  lanes:
    api_command_lane:
      description: >
        client command enters via ui_action, passes through frontend_scheduler,
        api_client, backend_endpoint, backend_scheduler, manifest_dispatcher,
        topology_transform_runtime (RuntimeExecutor), entity/emission, and projects back
        through frontend projection components. Node wiring in this document declares canonical route boundaries and identity continuity.
      direction: client_to_server_to_client

      required_identity:
        # Data identity fields that must survive the full pipeline.
        # These are the subject of the data-driven fixture test, not code symbols.
        - target
        - layer
        - action
        - role
        - trigger_kind
        - attractor_key
        - structure_map_id
        - package_id
        - schema_id
        - component_ids

      nodes:
        - node: frontend.ui_action
          files:
            - frontend/islands/OperationPanel.tsx

        - node: frontend.scheduler
          files:
            - frontend/runtime/frontendScheduler.ts
          implementation_note: >
            Lane boundary: FIFO serial queue via queueClientCommand. Commands execute
            serially in enqueue order; errors propagate to the failed command's awaiter
            only; subsequent commands are unaffected. Owns client_command_order and async
            execution. sse_projection_order, projection_batch_boundary, rollback_boundary,
            and optimistic_update_boundary are separate runtime boundary contracts.

        - node: frontend.api_client
          files:
            - frontend/api/dispatch.ts
            - frontend/routes/api/dispatch.ts

        - node: backend.endpoint
          files:
            - backend/endpoint/DispatchEndpoint.cs

        - node: backend.scheduler
          files:
            - backend/scheduler/RuntimeTimelineScheduler.cs
          implementation_note: >
            Lane boundary: synchronous delegate to ManifestDispatcher. Client requests now
            enter via RuntimeTimelineScheduler → ManifestDispatcher → RuntimeExecutor.
            Ordering and collision control are separate runtime boundary contracts.

        - node: backend.manifest_dispatcher
          files:
            - backend/runtime/ManifestDispatcher.cs
          implementation_note: >
            Lane boundary: synchronous delegate to RuntimeExecutor. Manifest-driven routing
            by axes (role, target, layer, action) is a canonical runtime boundary contract.

        - node: backend.topology_transform_runtime
          files:
            - backend/runtime/RuntimeExecutor.cs
          implementation_note: >
            RuntimeExecutor boundary may cover backend_scheduler,
            manifest_dispatcher, and topology_transform_runtime roles only when
            scheduler → dispatcher → runtime identity is preserved.

        - node: backend.entity_and_emission
          files:
            - backend/runtime/EmissionBuilder.cs
            - backend/repository/TopologyRepository.cs

        - node: frontend.projection
          files:
            - frontend/components/EmissionView.tsx
            - frontend/components/ProjectionView.tsx
            - frontend/runtime/renderEmission.ts

      required_endpoint:
        path: /api/dispatch
        frontend_route: frontend/routes/api/dispatch.ts
        backend_handler: backend/endpoint/DispatchEndpoint.cs

      pipeline_body_test:
        kind: data_driven_fixture_execution
        ci_script: .agent/tests/check-default-entity-search.sh
        fixture_path: default:entity:search
        verifies:
          - EndpointRequestDto{target=default,layer=entity,action=Search} flows through RuntimeExecutor to Emission
          - emission.structureMapId is present and non-null
          - emission.packageId is present and non-null
          - emission.schemaId is present and non-null
          - emission.componentIds is non-empty
          - frontend renderEmission expands componentIds through registry to non-error specs
        test_files:
          - backend/tests/Topolactor.Integration.Tests/DefaultEntitySearchIntegrationTests.cs
          - backend/tests/Topolactor.Runtime.Tests/RuntimeExecutorTests.cs
          - frontend/tests/defaultEntitySearch.test.ts

      hardcode_guard:
        description: >
          Checks that topology_transform_runtime (RuntimeExecutor) does not accumulate
          hardcoded target/layer/action dispatch branching beyond documented boundary-contract
          exceptions. Such branching replaces data-driven manifest_dispatcher routing.
        file: backend/runtime/RuntimeExecutor.cs
        checks:
          - id: target_dispatch_branching
            patterns:
              - 'vector\.Target =='
              - 'string\.Equals(vector\.Target'
            allowed_count: 3
            preferred_count: 0
            allowed_exceptions:
              - demo_entity_check_in_TargetDispatchOverride
              - admin_path_in_TargetDispatchOverride
              - demo_validation_in_TargetDispatchOverride
            note: >
              0 is preferred — branches are isolated to TargetDispatchOverride boundary.
              Allowed up to 3 for isolated compatibility boundaries where
              manifest_dispatcher_routing_is_canonical_preferred_route.
              Count above 3 indicates a new hardcoded dispatch target being added to RuntimeExecutor;
              new targets must be routed through manifest_dispatcher, not hardcoded.

    frontend_component_event_log_lane:
      status: implemented_contract
      description: >
        UI components emit operation events to a frontend runtime queue. The frontend runtime
        scheduler batches those events and flushes them to the backend component-event-log
        intake boundary on a short interval (target: about 10 seconds). Components do not own
        DB persistence, backend API branching, topology judgment, or SQL Attention judgment.
        This lane is the canonical boundary for UI operation observation and future learning,
        recommendation, and audit usage.
      direction: client_observation_to_server_log

      required_identity:
        - component_id
        - package_id
        - layout_id
        - event_type
        - payload
        - actor_or_source
        - occurred_at
        - idempotency_key

      nodes:
        - node: frontend.component
          files:
            - frontend/components/
          implementation_note: >
            Components emit normalized operation events only. They must not call DB persistence
            APIs directly and must not own topology/API dispatch branching.

        - node: frontend.component_event_runtime
          files:
            - frontend/runtime/
          implementation_note: >
            Owns in-memory event queue, event normalization, ordering boundary, debounce/throttle,
            batch_size, flush_interval_seconds, retry policy, explicit failure state, and lifecycle
            flush handling. The default design target is periodic background flush around 10 seconds,
            not per-event DB persistence.

        - node: frontend.local_event_cache
          files:
            - frontend/runtime/
          implementation_note: >
            Fallback cache only. When scheduler/flush/offline/page lifecycle interruption prevents
            delivery, unsent events may be stored in localStorage as a bounded cache. Successful ACK
            releases cached events in order. Cache must define max_events, max_bytes, ttl,
            schema_version, and sensitive-payload exclusion.

        - node: frontend.component_event_api_client
          files:
            - frontend/routes/api/
          implementation_note: >
            Sends event batches produced by frontend.component_event_runtime. It does not receive
            arbitrary component-local API calls.

        - node: backend.component_event_log_intake
          files:
            - backend/endpoint/
            - backend/repository/
            - backend/schema/
          implementation_note: >
            Accepts component operation event batches, enforces idempotency_key duplicate handling,
            returns explicit success/failure ACK, and appends accepted events to the canonical DB log.

      event_types:
        - click
        - change
        - select
        - toggle
        - expand
        - collapse
        - submit
        - focus
        - blur
        - drag
        - drop

      persistence_policy:
        primary_queue: in_memory_frontend_runtime_queue
        fallback_cache: localStorage_bounded_cache
        flush_interval_target_seconds: 10
        ack_release: required
        duplicate_boundary: idempotency_key
        prohibited:
          - component_direct_db_api_call
          - silent_drop_on_flush_failure
          - unbounded_localStorage_growth
          - secret_or_large_payload_localStorage_cache
          - frontend_topology_or_sql_attention_judgment

      transport_selection_policy:
        default_event_log_transport: interval_batch_flush_or_polling
        default_event_log_transport_reason: >
          Standard business UI operation logs prioritize non-lossy observation, retry, append-only
          persistence, and auditability over sub-second bidirectional transport. Polling/interval
          batch flush is sufficient by default because server-to-client projection already has the
          SSE lane.
        server_to_client_projection_transport: sse_projection_lane
        websocket_default: not_required_for_standard_component_event_logs
        websocket_allowed_when:
          - high_frequency_pointer_stream
          - drawing_canvas
          - collaborative_editing
          - realtime_cursor_or_presence
          - continuous_drag_or_resize_preview
          - bidirectional_low_latency_ui_state_required
        websocket_requirements:
          - explicit_lane_or_policy_extension
          - event_identity_preservation
          - reconnect_and_dedup_boundary
          - backpressure_or_rate_limit_boundary
          - fallback_or_replay_boundary
        prohibited:
          - websocket_as_default_for_all_component_events
          - replacing_event_log_batch_flush_without_explicit_low_latency_requirement
          - using_transport_choice_to_bypass_canonical_event_log_persistence

      completion_condition:
        - components_emit_operation_events_to_frontend_runtime_queue
        - frontend_runtime_batches_and_flushes_events_on_interval
        - failed_or_interrupted_flush_can_recover_from_bounded_localStorage_cache
        - backend_event_log_intake_appends_events_with_idempotency_boundary
        - components_do_not_directly_call_persistence_api

      pipeline_body_test:
        kind: boundary_contract
        ci_script: .agent/tests/check-pipeline-continuity.sh
        test_files:
          - backend/tests/Topolactor.Runtime.Tests/FrontendComponentEventLogLaneTests.cs
          - frontend/tests/frontendComponentEventRuntime.test.ts
        verifies:
          - required_identity fields preserve through endpoint-to-repository append path
          - duplicate idempotency is accepted
          - invalid payload fails close (not ACK-only)
          - queue flush/retry/bounded fallback behavior remains explicit
        note: >
          check-pipeline-continuity.sh validates lane contract presence and CI registration;
          runtime semantics are delegated to dedicated dotnet/deno tests above.

    frontend_projection_constructor_lane:
      description: >
        component_definition payload is transformed into projection_definition,
        normalized through projectionConstructor, stored in ComponentDataHub shape,
        and projected as primitive props. This lane is the frontend projection surface
        contract and must preserve identity and explicit-failure boundaries.
      direction: server_projection_to_frontend_props

      required_identity:
        - componentId
        - componentKey
        - packageId
        - layoutId
        - component_kind
        - semantic_role
        - visual_role
        - event_binding
        - parameter_schema
        - merged_props

      nodes:
        - node: frontend.component_definition_payload
          files:
            - frontend/tests/projectionConstructor.test.ts

        - node: frontend.projection_definition
          files:
            - frontend/runtime/projectionConstructor.ts

        - node: frontend.projection_constructor
          files:
            - frontend/runtime/projectionConstructor.ts
          implementation_note: >
            Merge order is default_parameters -> json_key_value -> projectionOverrides.
            Any malformed payload/schema/event binding must fail explicitly without silent fallback.

        - node: frontend.component_data_hub
          files:
            - frontend/runtime/projectionConstructor.ts

        - node: frontend.primitive_props_projection
          files:
            - frontend/runtime/projectionConstructor.ts

      prohibited:
        - componentId_drift
        - silent_fallback_for_malformed_component_definition_payload
        - malformed_schema_silent_pass
        - unsupported_schema_type_silent_pass
        - invalid_event_binding_fallback_to_empty_object
        - boolean_coercion
        - frontend_topology_judgment
        - frontend_sql_attention_judgment
        - frontend_persistence_judgment
        - component_direct_api_or_db_persistence_decision

      pipeline_body_test:
        kind: unit_boundary_contract
        ci_script: .agent/tests/check-pipeline-continuity.sh
        note: >
          check-pipeline-continuity.sh validates this lane's SSOT vocabulary contract and
          delegates runtime semantics to projectionConstructor unit tests.
        test_files:
          - frontend/tests/projectionConstructor.test.ts
        verifies:
          - component_definition payload identity preservation
          - componentId drift is rejected
          - merge order default_parameters -> json_key_value -> projectionOverrides
          - malformed or unsupported parameter_schema returns explicit error
          - invalid event_binding payload returns explicit error
          - boolean coercion and silent fallback are prohibited
          - frontend does not own topology/SQL Attention/persistence judgment

    sse_projection_lane:
      description: >
        server event propagates through backend_sse_emitter, frontend_sse_receiver,
        frontend_sse_dispatcher, and projects through projection_runtime. Node wiring in this document declares canonical route boundaries and identity continuity. End-to-end SSE data flow follows this lane contract.
        Merges with layout_projection_dom_lane at the projection_shell_sse_refresh_boundary node:
        SSE projection events are treated as invalidation/refresh triggers only — frontend does not
        perform topology or layout judgment from the SSE payload. On receipt, ProjectionShell
        re-fetches the latest emission from the backend runtime via queueClientCommand and replaces
        the current DOM tree with the refreshed specs from renderEmission(). Old DOM nodes are
        discarded in full; patching from the SSE payload directly is prohibited.
      direction: server_to_client
      event_types:
        - projection
        - Attention

      required_identity:
        - manifest_id
        - component_ids
        - attention_score

      nodes:
        - node: backend.attention_compute
          files:
            - backend/schema/ContextRouteContracts.cs

        - node: backend.sse_emitter
          files:
            - backend/endpoint/SseEndpoint.cs
          implementation_note: >
            Lane boundary: keep-alive ping plus projection event streaming.
            SseEndpoint streams broadcaster subscriber-channel events (including
            projection lane payloads) while also emitting ping keep-alive frames.
            Live DB pg_notify hardening and full production verification remain
            a separate runtime boundary contract.

        - node: frontend.sse_receiver
          files:
            - frontend/runtime/sseReceiver.ts
          implementation_note: >
            Lane boundary: EventSource-based receiver with connect/disconnect interface.
            Wiring to dispatcher and scheduler follows a separate runtime boundary contract.

        - node: frontend.sse_dispatcher
          files:
            - frontend/runtime/sseDispatcher.ts
          implementation_note: >
            Lane boundary: handler map with register/route interface. Feeds into
            frontend projection runtime as hook_trigger.

        - node: frontend.sse_projection
          files:
            - frontend/components/ProjectionView.tsx

        - node: frontend.projection_shell_sse_refresh_boundary
          files:
            - frontend/islands/ProjectionShell.tsx
          implementation_note: >
            Merge point of sse_projection_lane and layout_projection_dom_lane.
            SSE projection event is received as hook_trigger and treated as an
            invalidation/refresh trigger only. ProjectionShell calls queueClientCommand
            to re-fetch the latest emission from the backend runtime. renderEmission()
            produces a new ComponentSpec[] from the fresh emission, replacing the old DOM tree
            in full. Race control via generation counter ensures only the latest refresh result
            applies when multiple events arrive concurrently. Refresh failure is explicit
            (console.error); old DOM is retained on failure. Frontend does not interpret
            SSE payload for topology or layout judgment. layoutId present without nodes
            → LAYOUT_NODES_NOT_FOUND error spec, no flat fallback. WebSocket replacement
            of this lane is prohibited.

      refresh_boundary_policy:
        trigger_source: sse_projection_event
        trigger_role: invalidation_refresh_trigger_only
        refresh_action: queueClientCommand_re_fetch_latest_emission
        dom_replacement: full_replacement_via_renderEmission_no_payload_patch
        race_control: generation_counter_latest_wins
        failure_policy: explicit_error_log_retain_old_dom
        topology_judgment: frontend_must_not_judge_from_sse_payload
        websocket_replacement: prohibited

      prohibited:
        - websocket_replacement_for_sse_lane_without_ssot_update
        - stale_dom_retained_after_projection_refresh
        - sse_event_direct_frontend_topology_judgment
        - projection_refresh_flat_fallback_when_layoutId_present

      required_endpoint:
        path: /api/sse
        frontend_route: frontend/routes/api/sse.ts
        backend_handler: backend/endpoint/SseEndpoint.cs

      pipeline_body_test:
        kind: unit_boundary_contract
        ci_script: .agent/tests/check-default-entity-search.sh
        note: >
          SSE lane unit tests cover dispatcher/receiver/projection identity via
          frontend/tests/pipelineContinuity.test.ts. ProjectionShell SSE refresh boundary
          tests cover the merge point of sse_projection_lane and layout_projection_dom_lane
          via frontend/tests/sseLane.test.ts. End-to-end SSE integration test
          (real server push through full lane) requires full lane event emission and verification under this contract.
        test_files:
          - frontend/tests/pipelineContinuity.test.ts
          - frontend/tests/sseLane.test.ts

      contract_guard: >
        Node contract must be validated by listed files and pipeline body tests.
        Route changes require explicit SSOT contract updates.

    layout_projection_dom_lane:
      description: >
        layout_patch_json.nodes[] authored in the UI builder canvas flows from the real DB
        through backend runtime emission to frontend DOM projection. Each node carries the
        structural and flow-layout spec: nodeId, nodeKind, htmlTag, componentKey, componentId,
        parentNodeId, slotKey, orderIndex, width, height, layoutClassRefs.
        structural_html nodes render as real HTML elements; catalog_component nodes render via
        the component registry. parentNodeId + orderIndex establish DOM nesting and sibling order.
        layoutClassRefs on container nodes resolve to flex/stack/grid flow CSS via
        topology-layout-class-ssot. width/height project as normal flow CSS (px, %, auto).
        Spacing (margin, padding, gap) projects from component_style_design cssTokenRefs —
        NOT from x/y. x/y are deprecated legacy absolute-geometry fields; they MUST NOT project
        to position:absolute left/top in flow mode. layoutClassRefs also project as className.
        No silent fallback: layoutId present without nodes → LAYOUT_NODES_NOT_FOUND error.
      direction: db_to_frontend_dom
      authority_ref: docs/design/admin-console-workflow-ssot.yaml ui_builder_canvas_workspace.layout_projection_model

      required_identity:
        - nodeId
        - nodeKind
        - htmlTag (structural_html only)
        - componentId (catalog_component only)
        - parentNodeId
        - slotKey
        - orderIndex
        - width
        - height
        - layoutClassRefs

      deprecated_legacy_absolute_geometry:
        fields:
          - x
          - y
        migration: explicit_conversion_required; silent_reinterpretation_prohibited

      nodes:
        - node: backend.tensor_row
          files:
            - db/ui_topology_tables.sql
          implementation_note: >
            topology.ui_topology_tensor.layout_patch_json stores the full canvas JSON
            authored via layout_patch:apply. One canonical tensor row per layout_id.

        - node: backend.load_layout_nodes
          files:
            - backend/repository/NpgsqlTopologyRepository.cs
            - backend/repository/TopologyRepository.cs
          implementation_note: >
            NpgsqlTopologyRepository.LoadLayoutNodesAsync reads layout_patch_json::text
            (ORDER BY updated_at DESC LIMIT 1) and parses nodes[] into LayoutNodeRecord[],
            sorted by orderIndex. Empty tensor row or absent nodes[] → returns empty list.

        - node: backend.structure_map_resolver
          files:
            - backend/runtime/StructureMapResolver.cs
          implementation_note: >
            Validates parsed nodes: duplicate nodeId, missing parent, parent cycle,
            structural_html tag allowlist. Builds LayoutNode[] using componentId from
            nodes[].componentId — NOT positional from structure_maps.component_ids.

        - node: backend.emission_builder
          files:
            - backend/runtime/EmissionBuilder.cs
          implementation_note: >
            Forwards LayoutNodes from RuntimeWorkingShape to Emission.layoutNodes unchanged.

        - node: frontend.render_emission
          files:
            - frontend/runtime/renderEmission.ts
            - frontend/api/dispatch.ts
          implementation_note: >
            renderEmission maps layoutNodes to ComponentSpec[] (flat, sorted by orderIndex).
            structural_html nodes produce componentType="structural_html" with htmlTag.
            catalog_component nodes resolve componentId through ComponentRegistry.
            Layout projection fields (nodeId, nodeKind, htmlTag, parentNodeId, width, height,
            layoutClassRefs) are preserved in ComponentSpec. Legacy x/y may be present in stored
            JSON but MUST NOT drive flow-mode DOM projection.

        - node: frontend.projection_shell
          files:
            - frontend/islands/ProjectionShell.tsx
          implementation_note: >
            Builds DOM tree from parentNodeId using buildChildrenMap. Renders structural_html
            nodes as actual HTML elements in document flow with layoutClassRefs class names and
            flow width/height. catalog_component nodes render within the tree. Design tokens
            (inlineText, cssTokenRefs, responsiveTokenRefs) apply to the live preview surface.
            position:absolute left/top from x/y is prohibited as the default projection path.

      prohibited:
        - silent_fallback_to_flat_componentIds_when_layoutId_present
        - positional_componentId_assignment_from_structure_map_component_ids
        - default_position_absolute_projection_for_layout_patch_nodes
        - mapping_legacy_x_y_to_left_top_px_in_flow_mode
        - treating_x_y_as_padding_or_margin_substitute
        - c_sharp_building_react_or_dom
        - frontend_direct_db_write
        - layout_nodes_not_validated_at_runtime

      test_files:
        - backend/tests/Topolactor.Integration.Tests/LayoutProjectionContinuityLiveDbEndToEndTests.cs
        - frontend/tests/pipelineContinuity.test.ts
        - frontend/tests/defaultEntitySearch.test.ts

    component_wiring_execution_lane:
      status: implemented_contract
      description: >
        Admin-configured component wiring (UI Builder) connects to runtime execution.
        Backend LayoutNode enrichment: catalog_component nodes are enriched with
        componentKind (from ui_component_registry) and the full wiring spec
        (wiring_id, wiring_key, wiring_kind, target_surface, target_ref) from
        ui_wiring_registry via ui_topology_tensor LEFT JOIN.
        Frontend renderEmission: catalog_component nodes with componentKind build a
        RuntimeDispatchSpec (operationType, target, layer, action, wiringKey, wiringId,
        targetRef) via buildRuntimeDispatchSpec. ComponentDataHub → adaptComponentDataHub
        → RuntimeComponentSpec stored in ComponentSpec.runtimeSpec. ProjectionShell
        renders catalog_component nodes via renderRuntimeComponent(runtimeSpec).
        User events fire TWO explicitly separated lanes:
          1. frontend_component_event_log_lane: emitComponentOperationEvent (observation, always)
          2a. component_wiring_execution_lane: enqueueRuntimeComponentCommand → queueAdminClientCommand
              (dispatch, when runtimeDispatch configured — all wiring kinds except navigation)
          2b. navigation_wiring_execution_lane: globalThis.location.href
              (frontend-local, when routeNavigation configured — navigation wiringKind only)
        Frontend is a projection surface only — does NOT judge topology, layout, or promotion.
        wiring_kind → layer mapping: search→screen_list, aggregate→screen_aggregation, CRUD→entity.
        wiring_kind → action mapping: search→Search, aggregate→Search, create→Create, update→diffUpdate, delete→logicalDelete.
        navigation wiringKind is frontend-local: buildRuntimeDispatchSpec returns null;
        buildRouteNavigationEventBinding produces routeNavigation binding; route:<routeKey>
        must never reach ManifestDispatcher as target_ref (TARGET_REF_INVALID if it does).
        target_ref routing: when payload carries target_ref="manifest:<uuid>:<wiring_key>",
        ManifestDispatcher resolves the manifest by UUID (LoadByIdAsync) instead of axes.
        This ensures admin-chosen manifest selection (PackageWiringEditor) is honoured at runtime.
      direction: client_to_server

      required_identity:
        - componentId
        - componentKind
        - wiringKind
        - action
        - target
        - layer
        - wiringKey
        - wiringId
        - targetRef

      nodes:
        - node: backend.layout_node_enrichment
          files:
            - backend/repository/NpgsqlTopologyRepository.cs
            - backend/repository/TopologyRepository.cs
            - backend/runtime/StructureMapResolver.cs
          implementation_note: >
            NpgsqlTopologyRepository.LoadLayoutNodesAsync LEFT JOINs ui_wiring_registry to read
            wiring_kind, wiring_id, wiring_key, target_surface, target_ref and derives
            runtimeDispatchAction from wiring_kind. LoadComponentKindsByIdsAsync batch-queries
            ui_component_registry by componentId. All fields are set on LayoutNodeRecord and
            forwarded to LayoutNode by StructureMapResolver.

        - node: backend.layout_node_contract
          files:
            - backend/schema/Contracts.cs
          implementation_note: >
            LayoutNode record carries ComponentKind, RuntimeDispatchAction, WiringId, WiringKey,
            WiringKind, TargetSurface, TargetRef as optional nullable fields. Serialized to JSON
            in Emission.layoutNodes and read by the frontend renderEmission path.

        - node: backend.manifest_dispatcher_target_ref
          files:
            - backend/runtime/ManifestDispatcher.cs
          implementation_note: >
            TryGetRawTargetRef extracts target_ref string from dispatch payload when present.
            TryParseManifestTargetRef validates "manifest:{uuid}:{wiring_key}" format.
            When target_ref is present and valid, ManifestDispatcher calls LoadByIdAsync to
            resolve the exact admin-chosen manifest rather than axes-based ResolveActiveManifestAsync.
            Absent or empty target_ref falls through to axes resolution.
            Malformed target_ref (non-manifest prefix or invalid UUID) returns TARGET_REF_INVALID —
            no silent axes-fallback, which could misroute to an unintended active manifest.
            Missing manifest after valid target_ref parse returns MANIFEST_NOT_FOUND.

        - node: frontend.render_emission_catalog_component
          files:
            - frontend/runtime/renderEmission.ts
            - frontend/api/dispatch.ts
          implementation_note: >
            LayoutNode type carries componentKind, wiringId, wiringKey, wiringKind,
            targetSurface, targetRef. renderEmission: buildRuntimeDispatchSpec derives full
            RuntimeDispatchSpec from node wiring metadata. buildCatalogComponentEventBinding
            populates standard triggers (click, change, select, submit, toggle) each carrying
            full runtimeDispatch spec. Absence of componentKind → explicit CATALOG_COMPONENT_KIND_REQUIRED
            error spec, not silent skip. No static registry fallback.

        - node: frontend.projection_shell_runtime_render
          files:
            - frontend/islands/ProjectionShell.tsx
          implementation_note: >
            LayoutNode component: spec.runtimeSpec present → renderRuntimeComponent(runtimeSpec).
            renderRuntimeComponent failure → explicit error SpecCard (not silent fallback).
            spec.runtimeSpec absent on catalog_component → console.warn + SpecCard.
            SpecCard is retained only as an explicit-error/observation fallback — never as
            the primary catalog_component render path.

        - node: frontend.component_wiring_dispatch
          files:
            - frontend/runtime/runtimeComponentFactory.ts
            - frontend/runtime/frontendScheduler.ts
          implementation_note: >
            EventBindingValue.runtimeDispatch carries full RuntimeDispatchSpec
            { operationType, target, layer, action, wiringKey?, wiringId?, targetRef? }.
            emitBoundEvent fires BOTH lanes:
              Lane 1 (always): emitComponentOperationEvent → frontend_component_event_log_lane
              Lane 2 (when runtimeDispatch present): enqueueRuntimeComponentCommand →
              queueAdminClientCommand → api_command_lane → backend dispatch.
            Lanes are explicitly separated — observation log does NOT drive backend dispatch.
            enqueueRuntimeComponentCommand forwards wiringKey as wiring_key, wiringId as
            wiring_id, and targetRef as target_ref in the dispatch payload. target and layer
            come from admin-configured wiring (targetSurface, wiringKind) — not hardcoded.

      wiring_kind_layer_mapping:
        search: screen_list
        aggregate: screen_aggregation
        create: entity
        update: entity
        delete: entity
        note: navigation is intentionally absent — navigation wiringKind is frontend-local only (see navigation_wiring_execution_contract)

      wiring_kind_action_mapping:
        search: Search
        aggregate: Search
        create: Create
        update: diffUpdate
        delete: logicalDelete
        note: navigation is intentionally absent — navigation wiringKind is frontend-local only (see navigation_wiring_execution_contract)

      navigation_wiring_execution_contract:
        wiring_kind: navigation
        execution_lane: frontend_local_only
        produces_runtime_dispatch_spec: false
        produces_route_navigation_binding: true
        target_ref_format: "route:<routeKey>"
        execution: globalThis.location.href
        rationale: >
          navigation wiringKind is frontend-local: buildRuntimeDispatchSpec returns null,
          buildRouteNavigationEventBinding produces { routeNavigation: { targetRef } } instead
          of { runtimeDispatch }. emitBoundEvent fires lane 1 (event log) always, then executes
          client-side navigation from routeNavigation.targetRef. route:<routeKey> must never
          reach ManifestDispatcher as target_ref — TryParseManifestTargetRef rejects non-manifest
          prefixes with TARGET_REF_INVALID.
        backend_dispatch_fields: none
        defensive_test: >
          ManifestDispatcherTargetRefTests.DispatchAsync_TargetRef_RoutePrefix_ReturnsTargetRefInvalidError
          verifies that route: prefix as target_ref returns TARGET_REF_INVALID even if it ever
          reaches ManifestDispatcher (misconfiguration guard).

      prohibited:
        - catalog_component_rendered_as_speccard_in_primary_path
        - silent_fallback_when_componentkind_absent
        - observation_log_driving_backend_dispatch
        - frontend_topology_or_layout_judgment
        - dispatch_firing_without_runtimedispatch_configured
        - hardcoded_target_default_layer_entity_in_enqueue
        - wiring_key_or_wiring_id_dropped_before_backend
        - navigation_wiringkind_in_wiring_kind_layer_or_action_mapping
        - route_prefix_reaching_manifest_dispatcher_as_target_ref

      pipeline_body_test:
        kind: unit_boundary_contract
        ci_script: .agent/tests/check-pipeline-continuity.sh
        test_files:
          - frontend/tests/adminWiringExecutionLane.test.ts
          - backend/tests/Topolactor.Runtime.Tests/AdminWiringExecutionLaneTests.cs
          - backend/tests/Topolactor.Runtime.Tests/ManifestDispatcherTargetRefTests.cs
        verifies:
          - LayoutNode carries ComponentKind, WiringId, WiringKey, WiringKind, TargetSurface, TargetRef
          - renderEmission builds runtimeSpec for catalog_component with componentKind
          - renderEmission produces error spec when componentKind absent
          - buildRuntimeDispatchSpec includes targetRef from node
          - buildRuntimeDispatchSpec returns null for navigation wiringKind (frontend-local lane)
          - buildRouteNavigationEventBinding produces routeNavigation binding for route: targetRef
          - parseEventBinding parses routeNavigation binding; rejects non-route: prefix
          - emitBoundEvent fires both log lane and dispatch lane when runtimeDispatch present
          - emitBoundEvent executes frontend-local navigation when routeNavigation present
          - enqueueRuntimeComponentCommand forwards wiringKey/wiringId/targetRef in payload
          - ManifestDispatcher routes to specific manifest when target_ref present in payload
          - ManifestDispatcher returns TARGET_REF_INVALID for route: prefix target_ref (defensive)
