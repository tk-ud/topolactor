runtime_bundle_secret_credential_implementation_ssot:
  name: runtime_bundle_secret_credential_implementation
  version: 0.1.0
  status: ssot_implementation_document
  canonical_path: docs/design/runtime-bundle-secret-credential-implementation-ssot.yaml
  design_ssot: docs/design/runtime-bundle-secret-credential-ssot.yaml

  purpose:
    summary: >-
      runtime-bundle-secret-credential-ssot.yaml の実装詳細を記述する実装 SSOT。
      seed-driven dispatch routing / admin UI surface / lifecycle semantics /
      audit ordering / startup validation 非ブロック方針を閉じる。
      credential 実体はこの SSOT を含む公開 SSOT に含めない。

  dispatch_routing:
    description: >-
      credential_registry アクションは ManifestDispatcher が直接 secret_credential_runtime へ
      ルーティングする。admin_runtime proxy 層を経由しない。
    manifest_seeds:
      - id: "0xc7"
        target: admin
        layer: credential_registry
        action: list
        runtime_destination: secret_credential_runtime
        role: admin
      - id: "0xc8"
        target: admin
        layer: credential_registry
        action: register
        runtime_destination: secret_credential_runtime
        role: admin
      - id: "0xc9"
        target: admin
        layer: credential_registry
        action: validate
        runtime_destination: secret_credential_runtime
        role: admin
      - id: "0xca"
        target: admin
        layer: credential_registry
        action: rotate
        runtime_destination: secret_credential_runtime
        role: admin
    structure_map_seeds:
      - id: "0xcd"
        name: admin_credential_registry_list
        attractor_key: "admin:credential_registry:list"
      - id: "0xce"
        name: admin_credential_registry_register
        attractor_key: "admin:credential_registry:register"
      - id: "0xcf"
        name: admin_credential_registry_validate
        attractor_key: "admin:credential_registry:validate"
      - id: "0xd0"
        name: admin_credential_registry_rotate
        attractor_key: "admin:credential_registry:rotate"
    handler_registry:
      key: secret_credential_runtime
      implementation: SecretCredentialBundleRuntime
      registered_in: backend/Program.cs (ManifestDispatcher handler dict)
    ssot_registration:
      runtime_orchestration_ssot: docs/design/runtime-orchestration-ssot.yaml
      section: handler_registry + backend_runtime_destinations

  admin_ui_surface:
    route: /admin/credentials
    route_ssot: docs/design/runtime-orchestration-ssot.yaml (frontend_routes.admin)
    route_file: frontend/routes/admin/credentials.tsx
    island: frontend/islands/AdminCredentialPanel.tsx
    dispatch_circuit: >-
      AdminCredentialPanel.tsx は queueAdminClientCommand を使用して
      seed-driven dispatch 回路を経由する。credential 専用 API 関数を使用しない。
      adminApi.ts には credential 専用エクスポート関数を追加しない。
    ui_pattern: >-
      admin UI は purpose-built island パターンを使用する。
      これは topolactor の既存 admin surface (AdminUsersRoster / AdminEnumsRoster 等) と
      同一のパターンである。seed が定義するのは dispatch routing authority であり、
      form/table の HTML 構造は island で実装する。
    prohibited:
      - credential_value_display
      - rotation_actor_id_in_frontend_payload
      - credential_specific_adminapi_exports
    security_boundary:
      - admin ui must display reference metadata only (reference_key, provider_kind, status, validation_status)
      - no credential values in any response or UI element
      - rotation_actor_id confirmed by backend from JWT sub claim

  registration_validation_lifecycle:
    description: >-
      post-registration validation の成否と registration 成功/失敗の関係を定義する。
    store_unavailable:
      outcome: registration_fails
      error_code: SECRET_STORE_UNAVAILABLE
      policy: fail-close
    credential_not_present:
      outcome: registration_succeeds_with_invalid_validation_status
      validation_status: invalid
      policy: >-
        store は利用可能だが credential が未設定。登録は成功し、validation_status=invalid を
        レスポンスに明示する。admin は後から secret store に credential を設定し、
        validate action で validation_status を更新する。silent success は禁止。
    credential_present:
      outcome: registration_succeeds_with_valid_validation_status
      validation_status: valid
      status: active

  rotation_audit_ordering:
    description: >-
      credential_rotated (success) audit event の書き込みタイミングを定義する。
    audit_sequence_on_success:
      1: UpdateRotationTimestampAsync (status = rotation_pending)
      2: ValidateAsync (post-rotation validation)
      3: ConfirmRotationAsync (status = active)
      4: AppendAuditEventAsync (credential_rotated, outcome=success)
    audit_sequence_on_failure:
      1: UpdateRotationTimestampAsync (status = rotation_pending)
      2: ValidateAsync (post-rotation validation → fails)
      3: AppendAuditEventAsync (credential_rotation_failed, outcome=failure)
      note: credential_rotated: success は書かない。status は rotation_pending のまま。
    prohibited:
      - writing_credential_rotated_success_before_validation
      - writing_credential_rotated_success_when_validation_fails

  startup_validation_policy:
    description: >-
      CredentialStartupValidationService (IHostedService) による runtime_startup 検証の方針。
    implementation: backend/runtime/CredentialStartupValidationService.cs
    behavior:
      - validates all registered credential_references on startup
      - writes validation_status to DB via CredentialValidationService.ValidateAsync
      - logs failure for each invalid credential reference
      - does NOT block runtime startup (startup is non-blocking)
    fail_close_boundary: >-
      fail-close (store_unavailable) は credential 使用時 (runtime injection 時) に適用する。
      startup validation failure は admin に通知するための状態記録であり、
      起動そのものを止めない。これにより admin は起動後に credential 状態を確認・修正できる。
    rationale: >-
      credential_references は複数存在しうる。一つの credential が無効でも、
      他の credential を使用するサービスは正常稼働できる。起動ブロックは
      全サービスへの影響が大きく、non-blocking + fail-close at usage が
      secret_credential_bundle の設計方針として適切である。

  repository:
    abstract_base: backend/repository/CredentialReferenceRepository.cs
    implementation: backend/repository/NpgsqlCredentialReferenceRepository.cs
    key_methods:
      - RegisterAsync: credential_reference を DB に登録
      - UpdateValidationStatusAsync: validation_status を更新
      - UpdateRotationTimestampAsync: last_rotated_at 更新 + status = rotation_pending
      - ConfirmRotationAsync: status = active (post-rotation validation 成功後のみ呼ぶ)
      - AppendAuditEventAsync: audit log に参照情報のみ記録

  secret_store_adapter:
    interface: ICredentialStore (backend/schema/SecretCredentialBundleContracts.cs)
    implementation: backend/runtime/EnvironmentVariableCredentialStore.cs
    provider_kind_validation: >-
      SetAsync は provider_kind が "env_var" 以外の場合に明示エラーを返す。
      unsupported provider_kind は CREDENTIAL_STORE_BINDING_FAILED で拒否する。

  audit_log_boundary:
    table: logs.credential_audit_log
    recorded_fields:
      - credential_reference_id (UUID — logical reference, not credential value)
      - reference_key (logical name — not credential value)
      - event_type (credential_registered / credential_rotated / credential_validated / credential_validation_failed / credential_rotation_failed)
      - outcome (success / failure)
      - failure_code (nullable — error code, not credential value)
    prohibited:
      - real_credential_value_in_any_field
      - api_key_in_any_field
      - connection_string_in_any_field

  test_coverage:
    file: backend/tests/Topolactor.Runtime.Tests/SecretCredentialBundleRuntimeTests.cs
    count: "29+ unit tests"
    coverage:
      - registration reference-only persistence
      - response/audit contains no credential values
      - registration store unavailable = fail-close
      - registration store binding failure = explicit error
      - validation failure = explicit structured error
      - validation store unavailable = fail-close, no silent fallback
      - rotation missing jwt_actor = explicit error
      - rotation missing reference = explicit error
      - rotation success lifecycle (rotation_pending → active)
      - rotation failure lifecycle (status remains rotation_pending)
      - credential_rotation_failed audit on failure
      - credential_rotated success audit ONLY on success path (not on failure)
      - credential_rotated audit written AFTER ConfirmRotationAsync
      - IDispatchableRuntime boundary
      - ManifestDispatcher routing to secret_credential_runtime handler

  related_ssot:
    - docs/design/runtime-bundle-secret-credential-ssot.yaml
    - docs/design/runtime-orchestration-ssot.yaml
    - docs/design/extended-runtime-bundle-registry-ssot.yaml
