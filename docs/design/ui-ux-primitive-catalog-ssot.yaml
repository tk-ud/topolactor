    relationship exploration. All results are candidate surfaces; they do not
    directly mutate canonical data.
  boundary: candidate_surface_only
  primitives:
    AutoCompleteInput:
      key: autocomplete_input.primitive
      kind: search_suggest/autocomplete_input
      description: Text input with inline autocomplete from registered candidate sources
      semantic_role: input
      visual_role: field
      candidate_surface: true
      mutation_boundary: preview_before_apply
      candidate_source_boundary: debounce_backend_readonly_search
      no_mutation_during_typing: true
      use_case: single_row_search_select
      onSearch_note: >
        onSearch prop triggers read-only backend search; caller must debounce;
        no mutation / DB write / apply during typing.
      runtimeConnected: true

    SuggestInput:
      key: suggest_input.primitive
