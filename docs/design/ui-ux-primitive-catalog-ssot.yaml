category_g_document_canvas:
  label: Document Canvas / Template Projection UI
  purpose: >
    Figma-like lightweight canvas for placing bound DB/JSONB fields onto
    document/template projection surfaces. This is a projection scaffold,
    not a production report layout engine.
  boundary: projection_scaffold_only
  primitives:
    DocumentCanvasTemplateEditor:
      key: document_canvas_template_editor.primitive
      kind: document_canvas/document_canvas_template_editor
      description: Lightweight canvas for background reference, text placement, field binding, preview, and export snapshot
      semantic_role: admin_operation
      visual_role: canvas
