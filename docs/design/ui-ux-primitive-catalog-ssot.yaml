category_g_external_lookup:
  label: External / Helper Lookup UI
  purpose: >
    Candidate-producing surfaces for kana assist, postal/address lookup, and
    tel/address resolution. External lookup results are candidates only.
    The canonical SSOT is always the registered master / topolactor DB topology.
  boundary: candidate_surface_only
  canonical_authority: topolactor_db_master_registered_data
  note: >
    External lookup primitives are adapter / candidate surfaces.
    They are NOT canonical SSOT. Results must be confirmed through
    LookupCandidateConfirmPanel before apply_confirmed_update.
  primitives:
    KanaAssistInput:
      key: kana_assist_input.primitive
      kind: external_lookup/kana_assist_input
      description: Input with kana reading assistance via extract_kana adapter
      semantic_role: input
