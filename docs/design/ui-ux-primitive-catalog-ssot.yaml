  purpose: >
    Support safe no-code operations with dry-run preview, permission hints,
    mutation boundary inspection, rollback candidates, and operation confirmation.
    All primitives in this category are defensive surfaces that protect the
    canonical route from accidental mutation.
  primitives:
    CommandPalette:
