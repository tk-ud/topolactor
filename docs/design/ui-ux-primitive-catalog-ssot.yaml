version: 1
ssot: ui_ux_primitive_catalog
purpose: >
  Define the UI/UX primitive lineup for the topolactor no-code / DB-driven UI /
  topology operation surface. This SSOT serves as the upper-level catalog for
  Issue #89 Admin Visual Layout Builder, abstract function registry, frontend
  component catalog, and runtime adapter/renderer expansion.

  This SSOT owns:
  - primitive category taxonomy and membership
  - mutation boundary declaration
  - external lookup boundary declaration
  - SQL Attention / recommendation boundary declaration
  - seed role boundary declaration
  - design token / layout token boundary declaration
  - #89 prerequisite primitive lineup

  This SSOT does NOT own:
  - React implementation (frontend implementation is separate)
  - runtime adapter/renderer wiring (runtimePrimitiveRenderer/runtimeComponentAdapter)
  - DB seed values (seed is bootstrap, not authority)
  - SQL Attention ranking logic
  - external provider connection details

prerequisite_for:
  - admin_visual_layout_builder (Issue #89)
  - no_code_db_driven_ui_operation_surface

# =============================================================================
# Meaning Boundaries (must be observed across all primitives)
# =============================================================================

meaning_boundaries:

  registration_boundary:
    rule: catalog_definition_only primitives are future topology-entity candidates
    catalog_contract:
      - runtimeConnected:false is maintained until adapter/renderer wiring exists
      - registrationRequired:true is required until DB registration/promotion is completed
    exception_policy:
      - registrationRequired:false is only for alias_maintained entries that reuse existing runtime registered paths
      - exceptions must be documented in frontend/components/catalog.ts notes and classification SSOT

  frontend_topology_judgment:
    rule: frontend does not own topology judgment
    allowed: candidate / preview / confirm surface only
    prohibited: frontend computing topology meaning, route direction, or registry authority

  mutation_boundary:
    rule: mutation must follow the explicit flow
    sequence:
      - preview_update_patch
      - validate_candidate
      - explicit_confirm_by_user_or_admin
      - apply_confirmed_update
      - append_diff_log
    prohibited:
      - immediate mutation on calculation result
      - silent mutation without preview
      - bypass of validate_candidate before write
      - mutation without diff_log append

  calculation_boundary:
    rule: calculation results are candidates not mutations
    sequence:
      - preview_computed_field
      - validate_formula_contract
      - explicit_confirm
      - apply_confirmed_update
    prohibited:
      - calculation result triggering immediate DB write
      - frontend computing topology scores authoritatively

  frontend_local_calculation_binding_boundary:
    rule: frontend-local calculation uses backend-loaded reference data as read-only input
    lane: frontend_local_only
    computation_trigger: input / change / select event on canvas node (no backend dispatch)
    reference_data: backend-loaded emission data; read-only; not mutated by calculation
    result_target: target node value / result / preview / inlineText (runtime props injection only)
    prohibited:
      - input_change_ごとの_backend_dispatch
      - ManifestDispatcher_呼び出し
      - queueAdminClientCommand_呼び出し
      - 計算結果の逐次DB保存
      - eval_or_Function
      - 業務基準値_literal_を本番計算定義に保存
      - unknown_rule_の_silent_fallback
    implementation_ref: frontend/runtime/frontendLocalCalculationResolver.ts

  external_lookup_boundary:
    rule: external lookup is candidate surface not canonical SSOT
    note: >
      External lookup primitives (postal code, kana, address, tel) are adapter
      surfaces that produce candidates. The canonical SSOT is always the registered
      master / topolactor DB topology. External lookup results must be confirmed
      before write.
    lookup_kinds:
      kana_assist:
        source: local_text_processing_or_allowed_provider
        authority: candidate_surface
      postal_address:
        source: allowed_postal_provider_or_internal_master
        authority: candidate_surface
      address_postal:
        source: allowed_address_provider_or_internal_master
        authority: candidate_surface
      tel_address:
        source: internal_master_or_registered_data_or_allowed_provider
        authority: candidate_surface
        restriction: internal_master_and_registered_data_and_allowed_provider_only
    prohibited:
      - external_lookup_result_treated_as_canonical_SSOT
      - lookup_result_written_without_candidate_confirm
      - external_provider_bypassing_canonical_route

  sql_attention_boundary:
    rule: SQL Attention is observation surface not mutation authority
    sql_attention_role:
      - observe_logs_pressure_and_hub_vector_evidence
      - produce_recommendation_candidates
      - produce_ranking_candidates
    prohibited:
      - sql_attention_mutating_registry_directly
      - sql_attention_auto_promoting_primitives_without_explicit_confirm
      - sql_attention_overwriting_route_state_automatically
    recommendation_surface:
      - candidate_surface_only
      - ranking_is_candidate_not_registry_authority
      - promotion_requires_preview_validate_explicit_confirm

  seed_role_boundary:
    rule: DB seed is bootstrap row not vocabulary authority
    seed_role:
      - initial_bootstrap_rows_only
      - not_canonical_vocabulary_source
      - not_static_classification_authority
    yaml_authority:
      - static_vocabulary
      - classification_definition
      - CI_membership_assertion
    prohibited:
      - treating_seed_as_static_vocabulary_SSOT
      - CI_failing_on_seed_value_not_in_seed_but_missing_yaml_definition

  style_token_boundary:
    rule: style tokens must flow through manifest / registry token, not hardcode
    prohibited:
      - hardcoding_font_color_spacing_in_component_code
      - frontend_deriving_design_token_from_component_props_without_registry
    allowed:
      - manifest_driven_style_token_reference
      - registry_token_resolution_at_render_time
      - preview_of_token_value_in_token_editor

  yaml_static_vocabulary_boundary:
    rule: YAML enum / classification vocabulary is static constraint, not DB migration target
    yaml_role:
      - static_constraint
      - CI_auxiliary
      - classification_definition
    prohibited:
      - migrating_yaml_classification_vocabulary_to_DB_as_authority
      - DB_replacing_yaml_as_classification_membership_source

  layout_builder_reference:
    rule: "#89 visual layout builder references this catalog as its primitive lineup"
    note: >
      This SSOT defines the placement target primitives for Issue #89.
      The layout builder reads this catalog for available primitive kinds,
      classification metadata, and boundary rules. The layout builder does not
      implement drag/drop runtime behavior defined here — this SSOT is the
      definition layer only.

# =============================================================================
