ssot: admin_authoring_m6
version: 1
status: draft
owner: topolactor
summary: >
  M6 self-hosted admin authoring MVP contract for CSV/JSON intake, JSONB manifest
  conformity validation, document canvas binding, and minimal PDF export record
  boundary. External connectors are explicitly future optional and out of M6
  completion scope.

scope:
  in_scope:
    - self_hosted_admin_csv_json_import
    - jsonb_manifest_conformity_validation
    - document_canvas_template_setting_storage_and_binding
    - pdf_export_minimal_record_boundary
  out_of_scope:
    - notion_connector
    - google_sheets_connector
    - slack_connector
    - github_issues_connector
    - generic_webhook_connector
    - external_rest_api_connector

contracts:
  data_table_import:
    principles:
      - physical_table_created_first
      - record_body_is_jsonb
      - import_entry_surface_is_admin_import_data_button_and_file_uploader
      - one_input_row_equals_one_jsonb_record
      - validation_status_means_manifest_conformity_only_not_business_state
    canonical_tables:
      - admin_authoring_manifest
      - admin_import_snapshot
      - admin_import_records
      - admin_import_apply_log

  jsonb_data_manifest:
    principles:
      - manifest_defines_column_name_value_type_as_data_definition
      - aggregation_rule_is_selectable
      - display_and_document_binding_must_not_be_fixed_in_manifest
      - display_and_binding_are_variable_in_document_surface

  document_canvas:
    principles:
      - canvas_document_is_ui_template_or_document_template
      - admin_can_save_and_edit_document_settings
      - binding_resolver_collects_target_hub_data_from_selected_id_and_hub_id
      - collected_data_binds_into_document_canvas_template
      - document_setting_must_be_persistent_not_frontend_transient_only

  pdf_export:
    principles:
      - mvp_primary_function_is_canvas_document_to_pdf
      - minimal_boundary_is_allowed_no_heavy_workflow_required
      - must_record_export_record_plus_source_snapshot_reference_plus_applied_diff_reference
      - pdf_generation_must_not_directly_mutate_canonical_data

  validate_preview_apply_boundary:
    principles:
      - preview_must_not_mutate_canonical_state
      - apply_must_be_explicit_boundary
      - apply_targets_manifest_valid_records_only
      - broken_mapping_or_missing_required_field_returns_explicit_validation_error
      - no_silent_fallback
      - no_frontend_direct_db_write_to_canonical_state

completion_bundle_boundaries:
  - admin_csv_json_import_endpoint_and_upload_ui
  - manifest_validation_runtime
  - validate_preview_apply_runtime_boundary
  - canonical_apply_and_diff_log_boundary
  - document_canvas_template_runtime
  - data_binding_to_document_canvas
  - pdf_export_minimal_record

references:
  roadmap:
    - docs/system-roadmap.yaml
  db_scaffold:
    - db/admin_authoring_m6_tables.sql
