      disclosure_state_wiring:
        meaning: >-
          UI-local overlay disclosure state (open/close/toggle) for a disclosure/modal target
          node -- the SAME actionType/targetNodeId/statePath vocabulary
          frontend/lib/runtimeInteractionAuthoring.ts (NodeEventAuthoringPanel.tsx's authoring
          flow) actually produces and
          backend/repository/NpgsqlUiTopologyRepository.cs ValidateRuntimeInteractions actually
          validates for an ACTIVE (admin_runtime-wired) topology layout. Round 24 (admin-enum
          subBundle, mutation-confirmation-workflow) addition: closes a real translator gap found
          by verifying against the actual authoring/validation code rather than assuming
          internal_instance_wiring's existing ui-local:<nodeId>.<stateKey> + localStateMutation
          shape was reusable for this. It is not: uiEventEffectRunner.ts's
          UI_STATE_UPDATE_OPEN_ACTIONS does treat localStateMutation as a member of the same
          ui_state_update family at RUNTIME, but ValidateRuntimeInteractions' isDisclosure /
          isActiveKey / isSetState checks never accept the literal actionType "localStateMutation"
          for an active-topology layout_patch save (RUNTIME_INTERACTION_ACTION_UNSUPPORTED) -- so
          it is not a shape a human author using the real UI Builder could actually persist for
          this purpose, only a shape a hand-authored seed SQL insert can bypass validation to use.
        examples: [openModal, closeModal, toggleModal]
        targetRef_shape: 'ui-local:<nodeId>.<stateKey>'
        authority_ref: >-
          frontend/lib/runtimeInteractionAuthoring.ts OVERLAY_OPENABLE_COMPONENT_KINDS;
          backend/repository/NpgsqlUiTopologyRepository.cs ValidateRuntimeInteractions
        allowed_authority_mapping_values: [draft_or_projection_only]
        allowed_payload_from_sources: []
        disclosure_action_type_field: >-
          The eventBinding for this lane additionally carries disclosureActionType (one of the
          examples above) plus disclosureTargetNodeId/disclosureStatePath (statePath defaults to
          "open") -- the two structured fields runtimeInteractions[]'s own targetNodeId/statePath
          actually need, since a single targetRef string cannot unambiguously carry both a node id
          and an actionType family. targetRef itself stays in the SAME ui-local:<nodeId>.<stateKey>
          shape internal_instance_wiring already established, purely so this lane's
          event_binding_shape targetRef_shape check has something consistent to validate; it is
          never read by build_runtime_interaction_candidate, which reads
          disclosureActionType/disclosureTargetNodeId/disclosureStatePath directly.
        record_carrier: >-
          Folded into tensorAdoptionCandidates[].layoutPatchJson.nodes[].runtimeInteractions[] as
          {trigger, actionType is disclosureActionType, targetNodeId is disclosureTargetNodeId,
          statePath is disclosureStatePath, sourceActionKey} -- the same runtimeInteractions[]
          shape build_runtime_interaction_candidate already produces for the dispatch lanes,
          never a localStateMutation/ui-local entry.
        secondary_combination: >-
          An action's PRIMARY eventBinding may declare a different lane entirely -- most commonly
          admin_runtime_dispatch_override_wiring, for a Confirm button that both dispatches the
          real write and closes its own confirm modal on the same trigger.
          secondaryDisclosureActionType/secondaryDisclosureTargetNodeId/secondaryDisclosureStatePath
          attrs on that SAME action tag add one ADDITIONAL runtimeInteractions[] entry independent
          of the primary lane's own candidate, mirroring how the real
          runtimeInteractions[] array lets one trigger carry more than one interaction and how
          renderEmission.ts's per-trigger componentEventBinding merge treats a runtimeDispatch
          binding and a ui_state_update (disclosure) binding as independent, non-colliding keys on
          the same trigger object.
        modal_self_close_invariant: >-
          Every Modal container node this translator emits automatically carries its own toggle
          trigger closeModal runtimeInteractions[] entry targeting itself with statePath open (not
          authorable, never omitted) -- frontend/runtime/runtimeComponentFactory.ts modalFactory
          calls requireBinding(spec, "toggle") and fails the ENTIRE render closed when a Modal node
          has no "toggle" eventBinding (the native backdrop/close-affordance path, independent of
          any authored Confirm/Cancel button).
    event_binding_shape:
      required: [trigger, wiringLane, targetRef, authority]
      optional: [payloadFrom, outputProp, stateTarget]
      field_rules:
        trigger: one of [click, change, submit, "item.click", mount, "custom:<name>"]
        wiringLane: exactly one of lanes above
        targetRef: must match the targetRef_shape declared by wiringLane
        authority: >-
          must be one of exchange_mapping.authority_mapping's six values, and must be a member
          of the owning lane's allowed_authority_mapping_values; must equal the owning node's
          authorityMarker
        payloadFrom: >-
          entries must match ui-builder-preset-ecosystem-ssot.yaml payloadFrom_resolver_contract
          recognized_source_patterns (node_value / event_path / literal), and each source kind
          must be a member of the owning lane's allowed_payload_from_sources
        outputProp: present only when the eventBinding also updates a component prop (rare; prefer PropBinding)
        stateTarget: present only for internal_instance_wiring or route_navigation_wiring eventBindings
    required_rules:
      - every_action_or_step_eventBinding_maps_to_exactly_one_wiring_lane
      - lane_determines_allowed_targetRef_shape
      - lane_determines_allowed_payloadFrom_sources
      - lane_determines_allowed_authority_mapping_values
      - unresolved_lane_is_blocking_known_gap_ref
      - lanes_must_not_collapse_into_one_generic_eventBinding_bucket
    prohibited:
      - inferring_authority_from_action_name_alone
      - sharing_one_ambiguous_dispatch_category_across_external_port_registered_instance_ui_local_and_contents_dto_operations
      - accepting_payloadFrom_syntax_without_lane_specific_validation
      - eventBinding_authority_disagreeing_with_owning_node_authorityMarker
      - treating_ui_wiring_registry_wiring_schema_json_content_as_execution_wiring_evidence
    known_gaps:
      - gap: admin_runtime_layer_action_dispatch_lane_not_yet_defined
        classification: missing_lane_ssot_gap
        status: resolved_direction_selected_generic_mechanism_implemented
        status_note: >-
          Mirrors docs/design/admin-uibuilder-ui-structure-wiring-ssot.yaml
          lane_storage_boundary.known_gaps[0].status (that entry is this cross-reference's
          own primary/authoritative source -- kept in sync here rather than left stale).
          2026-07-24: the same entry's write_payload_capture_mechanism_implemented sibling
          field additionally resolves the write-side sub-gap (node value tracking +
          Lane 2 payloadFrom resolution, live-DB write+reread proof) this cross-reference
          also covers. 2026-07-29 (round 17): the translator-side sub-gap this note used to
          describe ("none of the five lanes... from a seed-authored Action node") is now closed
          by the new admin_runtime_dispatch_override_wiring lane above (6th lane) plus
          build_admin_runtime_dispatch_override_candidate in
          .agent/scripts/react_schema_topology_seed_translator.py -- a seed-authored Action/Step
          CAN now declare this lane and have it reach
          tensorAdoptionCandidates[].layoutPatchJson.nodes[].dispatchTargetRefByTrigger /
          dispatchPayloadFromByTrigger via the generation pipeline, not only via hand-authored
          seed SQL. Not yet exercised by any real fixture (db/seed_empty.sql's ae210-ae280
          manifests, which already use this exact node shape, remain hand-authored, predating
