react_schema_topology_seed_translator_ssot:
  name: topolactor_react_schema_topology_seed_exchange_contract
  version: 0.3.0
  status: experimental_ssot_design_document
  canonical_path: docs/design/react-schema-topology-seed-translator-ssot.yaml

  authority:
    parent_ssot: docs/design/ui-builder-seed-first-gap-discovery-ssot.yaml
    ui_builder_preset_ecosystem_ref: docs/design/ui-builder-preset-ecosystem-ssot.yaml
    mock_intake_compiler_ref: docs/design/mock-preset-intake-compiler-ssot.yaml
    admin_console_ref: docs/design/admin-console-workflow-ssot.yaml
    runtime_orchestration_ref: docs/design/runtime-orchestration-ssot.yaml
    instance_settings_ref: docs/design/instance-port-substrate-ssot.yaml
    css_dictionary_ref: docs/design/css-dictionary-ssot.yaml
    component_classification_ref: docs/design/component-catalog-classification-ssot.yaml
    note: >-
      This SSOT defines the exchange contract between React-like UI schema and topology UI seed.
      It owns schema/seed shape, source evidence, validation invariants, and loss/gap reporting.
      It does not own tool implementation, docker compose wiring, nginx routing, C# integration,
      or work procedure.

  scope:
    owns:
      - react_schema_shape
      - topology_ui_seed_shape
      - schema_to_seed_exchange_mapping
      - seed_to_schema_exchange_mapping_candidate
      - source_yaml_reference_catalog
      - source_seed_reference_catalog
      - exchange_validation_rules
      - loss_and_gap_report_contract
    does_not_own:
      - python_tool_entrypoint
      - docker_compose_service_design
      - nginx_route_design
      - csharp_invocation_design
      - agent_work_procedure
      - active_topology_write_authority
      - frontend_component_implementation
      - backend_runtime_route_authority

  exchange_model:
    canonical_direction:
      direction: react_schema_to_topology_ui_seed
      status: required_first_direction
      rule: >-
        React-like schema may be normalized into topology UI seed only when each node has
        source evidence, a catalog identity or known_gap_ref, and an explicit authority boundary.
    reverse_direction:
      direction: topology_ui_seed_to_react_schema
      status: future_candidate_after_loss_reporting_is_stable
      rule: >-
        Reverse translation is allowed only after forward translation records enough identity,
        source_yaml_refs, source_seed_refs, and loss markers to reconstruct the authoring schema
        without silent inference.
    exchange_units:
      - projection
      - category
      - section
      - form
      - field
      - table
      - workflow
      - step
      - action
      - validation
      - prop_binding
      - payload_from
      - style_ref
      - known_gap_ref

  react_schema_contract:
    schema_id: topolactor.react_schema.v1
    role: authoring_schema_not_runtime_component
    required_root_fields:
      - schema
      - presetKey
      - surface
      - sourceYamlRefs
      - sourceSeedRefs
      - root
    node_common_required_fields:
      - key
      - label
      - sourceYamlRefs
      - sourceSeedRefs
    allowed_node_kinds:
      Projection:
        required: [children]
        emits_seed: topology_ui_projection
      Category:
        required: [children]
        emits_seed: topology_ui_category
      Section:
        required: [children]
        emits_seed: topology_ui_section
      Form:
        required: [target, mode, fields]
        emits_seed: topology_ui_form
      Field:
        required: [control, required]
        emits_seed: topology_ui_field
      Table:
        required: [source, display]
        emits_seed: topology_ui_table
      Workflow:
        required: [steps]
        emits_seed: topology_ui_workflow
      Step:
        required: [action, authority]
        emits_seed: topology_ui_workflow_step
      Action:
        required: [action, authority]
        emits_seed: topology_ui_action
      Validation:
        required: [rule, severity]
        emits_seed: topology_ui_validation
      PropBinding:
        required: [targetProp, source]
        emits_seed: topology_ui_prop_binding
      PayloadFrom:
        required: [targetField, source]
        emits_seed: topology_ui_payload_from
      StyleRef:
        required: [target, tokenRef]
        emits_seed: topology_ui_style_ref
    prohibited_features:
      - arbitrary_component_import
      - arbitrary_js_expression
      - frontend_direct_persistence
      - unbounded_inline_css
      - unknown_component_key_silent_fallback
      - unknown_control_silent_fallback
      - action_without_authority
      - field_without_label
      - node_without_source_yaml_refs
      - node_without_source_seed_refs_when_seed_backed

  topology_ui_seed_contract:
    schema_id: topolactor.topology_ui_seed.v1
    role: draft_intake_artifact_not_active_topology
    required_root_fields:
      - schema
      - seedKey
      - surface
      - sourceReactSchema
      - sourceYamlRefs
      - sourceSeedRefs
      - projections
      - exchangeReport
    record_common_required_fields:
      - recordType
      - key
      - label
      - sourceYamlRefs
      - sourceSeedRefs
      - sourceReactPath
      - knownGapRefs
    record_types:
      topology_ui_projection:
        required: [surface, categories]
      topology_ui_category:
        required: [categoryKey, sections]
      topology_ui_section:
        required: [sectionKey, sectionKind, children]
      topology_ui_form:
        required: [formKey, target, mode, fields, actions]
      topology_ui_field:
        required: [fieldKey, control, required, validationRefs]
      topology_ui_table:
        required: [tableKey, source, display, columns]
      topology_ui_workflow:
        required: [workflowKey, steps]
      topology_ui_workflow_step:
        required: [stepKey, actionRef, authority]
      topology_ui_action:
        required: [actionKey, actionRef, authority]
      topology_ui_validation:
        required: [validationKey, rule, severity]
      topology_ui_prop_binding:
        required: [targetProp, source]
      topology_ui_payload_from:
        required: [targetField, source]
      topology_ui_style_ref:
        required: [target, tokenRef]
    protected_material_boundary_ref: docs/design/instance-port-substrate-ssot.yaml seed_aligned_json_template_boundary.protected_boundary
    active_topology_rule: >-
      Topology UI seed is draft/intake material. It cannot write active topology or create callable
      execution authority without the existing preview / validate / apply / admin approval boundary.

  exchange_mapping:
    node_mapping:
      Projection: topology_ui_projection
      Category: topology_ui_category
      Section: topology_ui_section
      Form: topology_ui_form
      Field: topology_ui_field
      Table: topology_ui_table
      Workflow: topology_ui_workflow
      Step: topology_ui_workflow_step
      Action: topology_ui_action
      Validation: topology_ui_validation
      PropBinding: topology_ui_prop_binding
      PayloadFrom: topology_ui_payload_from
      StyleRef: topology_ui_style_ref
    identity_mapping:
      react_key: seed.key
      react_label: seed.label
      react_path: seed.sourceReactPath
      sourceYamlRefs: seed.sourceYamlRefs
      sourceSeedRefs: seed.sourceSeedRefs
      knownGapRefs: seed.knownGapRefs
    authority_mapping:
      frontend_intent: draft_or_projection_only
      backend_validate: validation_only
      backend_preview: preview_only
      backend_apply: draft_apply_not_execution_authority
      admin_approve: execution_candidate_authority_boundary
      runtime_execute: approved_runtime_execution_only
    loss_policy:
      no_silent_loss: true
      dropped_property_requires_loss_report_entry: true
      unresolved_mapping_requires_known_gap_ref: true
      reverse_translation_requires_no_unexplained_loss: true

  source_yaml_reference_catalog:
    seed_system_yaml:
      - file: docs/design/ui-builder-seed-first-gap-discovery-ssot.yaml
        sections: [authority, core_rule, development_loop, seed_contract, todo_policy]
        role: seed_first_development_and_gap_reporting_contract
      - file: docs/design/ui-builder-preset-ecosystem-ssot.yaml
        sections: [cross_preset_authoring_boundary, package_wiring_manifest_bridge, payloadFrom_resolver_contract, hub_search_preset.layout_tree, physical_search_crud_aggregate_preset.layout_tree]
        role: preset_seed_layout_tree_wiring_and_payload_contract
      - file: docs/design/mock-preset-intake-compiler-ssot.yaml
        sections: [authority_boundary, canonical_flow, source_intake_contract, mapping_contract]
        role: intake_snapshot_and_mapping_boundary_reference
      - file: docs/design/instance-port-substrate-ssot.yaml
        sections: [seed_aligned_json_template_boundary, import_contracts, existing_credential_management_projection_extension, admin_authoring_boundary]
        role: instance_settings_template_import_and_approval_boundary
    wiring_yaml:
      - file: docs/design/runtime-orchestration-ssot.yaml
        sections: [boundaries, frontend_routes, trigger_contract]
        role: runtime_route_projection_and_client_trigger_boundary
      - file: docs/design/admin-console-workflow-ssot.yaml
        sections: [authority, canonical_sequential_authoring_pipeline, ui_builder_canvas_workspace]
        role: admin_authoring_and_ui_builder_boundary
      - file: docs/design/pipeline-continuity-ssot.yaml
        sections: [pipeline_and_lane_verification, completion_condition_contracts]
        role: lane_continuity_and_proof_reference
      - file: docs/design/css-dictionary-ssot.yaml
        sections: [authority_boundary, binding_flow_contract, token_key_rule, css_property_allowlist]
        role: style_token_reference_boundary
    ui_yaml:
      - file: docs/design/ui-ux-primitive-catalog-ssot.yaml
        sections: [purpose, meaning_boundaries, category_a_search_suggest, category_b_inline_edit_preview_update_audit, category_c_table_list_view_operation, category_h_safety_inspector_operation_guard]
        role: primitive_taxonomy_and_mutation_boundary
      - file: docs/design/component-catalog-classification-ssot.yaml
        sections: [component_kind, catalog_vocabulary_contract, persistence, seed_boundary]
        role: component_classification_vocabulary_and_catalog_membership_contract
      - file: docs/design/topology-layout-class-ssot.yaml
        sections: [layout_class_vocabulary, validation_contract]
        role: layout_class_reference_validation_contract
      - file: docs/design/css-dictionary-ssot.yaml
        sections: [design_principles, binding_flow_contract]
        role: style_design_token_exchange_contract

  source_seed_reference_catalog:
    bootstrap_order_authority:
      file: db/README.md
      sections:
        - How to run
        - Bootstrap file order
        - Files
      role: canonical_seed_file_order_and_seed_file_purpose_reference
    structural_seed:
      - file: db/seed_empty.sql
        role: minimal_default_topology_and_manifest_seed
        seed_subjects:
          - state_registry_defaults
          - relation_registry_default
          - deterministic_default_package_schema_component_structure_map
          - default_dispatch_manifest
          - external_port_dispatch_manifest
          - admin_dispatch_manifests
          - sql_attention_dispatch_manifest
          - hub_navigation_dispatch_manifests
          - ui_topology_layout_patch_package_wiring_dispatch_manifests
          - enum_dictionary_dispatch_manifests
          - credential_management_projection_manifests
          - context_route_policy_function_parameters
        exchange_use: source_manifest_and_projection_seed_evidence
    ui_builder_preset_seeds:
      - file: db/hub_search_preset_seed.sql
        preset_key: hub_search.readonly.v1
        role: readonly_hub_search_preset_seed
        seed_records:
          - topology.mock_preset_registry
          - topology.mock_preset_object_mapping
          - topology.mock_preset_wiring_candidate
          - topology.mock_preset_compile_snapshot
        exchange_units:
          - layout_tree_nodes
          - component_keys
          - propBindings
          - payloadFrom
          - wiring_candidates
          - unresolved_json
      - file: db/physical_search_crud_aggregate_preset_seed.sql
        preset_key: physical_search_crud_aggregate.v1
        role: physical_search_crud_aggregate_preset_seed
        seed_records:
          - topology.mock_preset_registry
          - topology.mock_preset_object_mapping
          - topology.mock_preset_wiring_candidate
          - topology.mock_preset_compile_snapshot
        exchange_units:
          - layout_tree_nodes
          - form_field_nodes
          - modal_nodes
          - action_nodes
          - table_or_list_nodes
          - payloadFrom
          - wiring_candidates
          - unresolved_json
      - file: db/physical_details_inline_editor_md_generator_preset_seed.sql
        preset_key: physical_details_inline_editor_md_generator.v1
        role: detail_inline_editor_markdown_generator_preset_seed
        seed_records:
          - topology.mock_preset_registry
          - topology.mock_preset_object_mapping
          - topology.mock_preset_wiring_candidate
          - topology.mock_preset_compile_snapshot
        exchange_units:
          - detail_view_nodes
          - inline_edit_nodes
          - audit_history_nodes
          - markdown_preview_or_export_nodes
          - wiring_candidates
      - file: db/aggregate_dashboard_preset_seed.sql
        preset_key: aggregate_dashboard.v1
        role: aggregate_dashboard_preset_seed
        seed_records:
          - topology.mock_preset_registry
          - topology.mock_preset_object_mapping
          - topology.mock_preset_wiring_candidate
          - topology.mock_preset_compile_snapshot
        exchange_units:
          - dashboard_layout_nodes
          - aggregation_display_nodes
          - manifest_read_query_wiring_candidates
    component_registry_seed:
      - file: db/ui_component_registry_preset_catalog_bootstrap.sql
        role: component_bucket_and_ui_component_registry_bootstrap
        seed_records:
          - topology.components_bucket
          - topology.ui_component_registry
        exchange_units:
          - runtime_alias_component_keys
          - primitive_component_keys
          - template_component_keys
          - component_kind
          - source_path
          - classification_metadata
    external_port_consumer_preset_seeds:
      - file: db/file_attachment_crud_preset_seed.sql
        role: file_attachment_crud_consumer_preset_seed
      - file: db/export_sftp_transfer_preset_seed.sql
        role: export_sftp_transfer_consumer_preset_seed
      - file: db/file_storage_export_job_preset_seed.sql
        role: file_storage_export_job_consumer_preset_seed
      - file: db/audit_approval_form_preset_seed.sql
        role: audit_approval_form_consumer_preset_seed
      - file: db/email_approval_form_preset_seed.sql
        role: email_approval_form_consumer_preset_seed
    seed_reader_rule: >-
      Translator generation must read both YAML SSOT references and existing seed references when a seed-backed
      surface exists. YAML defines vocabulary and authority; seed files provide concrete bootstrap rows,
      component keys, layout trees, wiring candidates, and compile snapshots.

  exchange_validation_rules:
    react_schema_validation:
      - every_node_has_source_yaml_refs
      - seed_backed_node_has_source_seed_refs
      - every_component_or_control_maps_to_catalog_or_known_gap_ref
      - every_form_has_fields
      - every_field_has_label_control_required_marker
      - every_action_has_authority_marker
      - every_workflow_step_has_order_and_authority_marker
      - every_payloadFrom_matches_recognized_source_pattern_or_known_gap_ref
      - every_propBinding_source_is_declared_or_known_gap_ref
      - every_style_ref_uses_css_dictionary_token_or_known_gap_ref
      - no_arbitrary_react_execution_features
    topology_ui_seed_validation:
      - emitted_seed_has_sourceReactPath_for_every_record
      - emitted_seed_has_sourceYamlRefs_for_every_record
      - emitted_seed_has_sourceSeedRefs_for_seed_backed_records
      - emitted_seed_respects_protected_material_boundary_ref
      - emitted_seed_does_not_create_execution_authority_from_import_or_apply
      - emitted_seed_marks_unresolved_paths_with_knownGapRefs
      - emitted_seed_preserves_loss_report
    exchange_report_validation:
      - source_count_matches_emitted_record_count_or_loss_entries
      - dropped_properties_are_explicit
      - unresolved_mappings_are_explicit
      - reverse_translation_blockers_are_explicit

  exchange_report_contract:
    required_fields:
      - sourceSchemaId
      - outputSeedSchemaId
      - sourceYamlRefs
      - sourceSeedRefs
      - emittedRecords
      - knownGapRefs
      - lossEntries
      - reverseTranslationBlockers
      - validationErrors
    loss_entry_fields:
      - sourceReactPath
      - property
      - reason
      - severity
      - knownGapRef
    known_gap_ref_rule: >-
      A known_gap_ref may explain unresolved schema/seed exchange only when it points to an existing
      Bundle-level gap or an owner-approved temporary gap. It must not be used to mark incomplete
      exchange as implemented.

  minimal_instance_settings_fixture:
    projection_key: auth.external.credential_management.projection
    source_seed_refs:
      - db/seed_empty.sql credential_management_projection_manifests
    required_categories: [user_auth, external, instance_settings]
    required_instance_settings_forms:
      - instance_settings_import_form
      - instance_address_form
      - instance_operation_binding_form
      - instance_operation_approval_form
    protected_material_boundary_ref: docs/design/instance-port-substrate-ssot.yaml seed_aligned_json_template_boundary.protected_boundary
    authority_rule: import_and_apply_create_draft_metadata_only_callable_candidates_require_admin_approval
