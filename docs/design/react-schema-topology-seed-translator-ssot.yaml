  # ===========================================================================
  # 12. validation_rules
  # ===========================================================================

  validation_rules:
    input_format_validation:
      - inputText_must_not_be_empty
      - inputText_must_conform_to_input_text_markup_grammar_contract
      - targetSurface_must_resolve_to_declared_seed_surface_catalog_or_carry_known_gap_ref
      - sourceYamlRefs_must_be_non_empty
      - mode_must_be_one_of_input_format_contract_mode_vocabulary
      - no_protected_boundary_vocabulary_value_in_inputText_or_optionalHints
      - seedEvidence_is_passthrough_only_never_resolved_by_reading_db_sql_files

    input_text_markup_grammar_validation:
      - every_tag_has_a_key_attribute_and_a_sourceYamlRefs_attribute
      - unknown_unitKind_in_a_tag_is_blocking
      - unresolved_fragment_requires_known_gap_ref
      - container_tags_have_matching_close_tags
      - action_and_step_tags_declare_a_recognized_wiringLane

    react_schema_validation:
      - every_node_has_sourceYamlRefs
      - every_component_or_control_maps_to_a_registered_componentKind_in_ui_catalog_boundary_contract_frontend_component_catalog_or_known_gap_ref
      - every_seed_backed_surface_maps_to_a_declared_seed_surface_catalog_entry
      - every_form_has_fields
      - every_field_has_label_control_and_required_marker
      - every_action_has_authorityMarker
      - every_action_or_step_has_a_wiringLane_and_conforming_eventBinding
      - no_mutation_action_without_an_owning_form
      - every_workflow_step_has_order_and_authorityMarker
      - every_payload_from_matches_a_recognized_source_pattern_allowed_by_its_wiring_lane_or_known_gap_ref
      - every_prop_binding_source_starts_with_emission_data_or_carries_known_gap_ref
      - every_style_ref_uses_a_css_dictionary_token_or_topology_layout_class_ref_or_known_gap_ref
      - no_arbitrary_react_execution_features
      - no_raw_html_tag_emission
      - no_protected_boundary_vocabulary_value_present

    topology_ui_seed_validation:
      - emitted_seed_has_sourceReactPath_for_every_record
      - emitted_seed_has_sourceYamlRefs_for_every_record
      - emitted_seed_respects_protected_material_boundary_ref
      - emitted_seed_does_not_create_execution_authority_from_import_or_apply
      - emitted_seed_marks_unresolved_paths_with_knownGapRefs
      - emitted_seed_preserves_the_loss_report
      - emitted_form_and_action_records_carry_authorityMarker
      - every_emitted_seed_record_is_recursively_checked_against_record_common_required_fields
      - every_emitted_seed_record_is_recursively_checked_against_its_record_type_required_fields
      - no_emitted_seed_record_carries_a_null_or_empty_required_field
      - emitted_action_and_step_records_carry_a_lane_conforming_eventBinding

    storage_adoption_validation: >-
      see storage_adoption_contract.validation_rules; enforced by
      validate_flat_seed_records against every topologyUiSeedFlatRecords element
      (SEED_RECORD_EXCEEDS_STORAGE_BUDGET, blocking), and by validate_adoption_candidates
      against the built adoptionCandidates bundle for the six
      top_ssot_violation_rule_definitions ids (manifest_topology_contains_ui_payload_material /
      flattened_seed_record_used_as_manifest_final_shape /
      ui_payload_not_split_to_package_layout_design_wiring_tensor /
      runtime_interactions_not_persisted_layout_path /
      idempotency_carrier_missing_for_runtime_dispatch / credential_secret_projection_detected).
      All validators in this SSOT (not only this one) collect every detected violation into
      validationErrors rather than stopping at the first blocking error -- fail-fast
      short-circuiting on the first error is prohibited; output_format_contract.validationErrors
      is defined as the full list, and a caller must be able to see every violation from one run.

    wiring_lane_validation:
      - every_action_or_step_eventBinding_maps_to_exactly_one_lane
      - eventBinding_targetRef_matches_the_lanes_targetRef_shape
      - eventBinding_authority_is_a_member_of_the_lanes_allowed_authority_mapping_values
      - eventBinding_authority_equals_owning_node_authorityMarker
      - eventBinding_payloadFrom_sources_are_members_of_the_lanes_allowed_payload_from_sources
      - unresolved_lane_is_blocking_known_gap_ref

    ui_catalog_boundary_validation:
      - componentKind_must_be_registered_in_frontend_component_catalog_or_carry_known_gap_ref
      - style_ref_must_use_css_dictionary_token_or_topology_layout_class_ref_or_carry_known_gap_ref
      - no_raw_html_tag_emitted_by_seed
      - no_arbitrary_inline_css_or_raw_tailwind_string
      - html_tag_catalog_refs_never_treated_as_frontend_component_catalog_authority

    projection_render_validation:
      - componentKind_must_resolve_to_a_registered_runtime_component_factory_entry_or_carry_known_gap_ref
      - runtime_component_spec_candidate_is_not_active_topology
      - runtime_component_spec_candidate_does_not_imply_new_frontend_component_implementation

    exchange_report_validation:
      - source_count_matches_emitted_record_count_or_loss_entries
      - dropped_properties_are_explicit_in_lossEntries
      - unresolved_mappings_are_explicit_in_knownGapRefs
      - reverse_translation_blockers_are_explicit_when_mode_is_round_trip_check

  # ===========================================================================
  # Minimal instance_settings fixture (kept minimal; not a seed-authoring guide)
  # ===========================================================================

  minimal_instance_settings_fixture:
    projection_key: auth.external.credential_management.projection
    declared_seed_surface_ref: declared_seed_surface_catalog.known_declared_surfaces[auth.external.credential_management.projection]
    required_categories: [user_auth, external, instance_settings]
    required_instance_settings_forms:
      - instance_settings_import_form
      - instance_address_form
      - instance_operation_binding_form
      - instance_operation_approval_form
    protected_material_boundary_ref: docs/design/instance-port-substrate-ssot.yaml seed_aligned_json_template_boundary.protected_boundary
    authority_rule: import_and_apply_create_draft_metadata_only; callable_candidates_require_admin_approve_authorityMarker

  # ===========================================================================
  # 13. generated_artifact_operation_policy
  # ===========================================================================

  generated_artifact_operation_policy:
    purpose: >-
      Defines the authority boundary and storage policy for translator-generated
      schema/seed/debug artifacts. Generated artifacts are projection artifacts,
      not design authority, not seed adoption authority, and not proof completion.
    operational_persistence_surface:
      - "*seed.sql"
    design_authority:
      - docs/design/react-schema-topology-seed-translator-ssot.yaml
      - referenced SSOT docs
    generated_artifact_surface:
      path: .agent/tools/generated/*
      git_policy: ignored
      role: local_tmp_regeneration_output
      authority: projection_artifact_only
    generation_trace_surface:
      path: .agent/tools/logs/generate.log
      git_policy: tracked
      format: json_lines
      role: trace_and_regeneration_index
      authority: not_proof_completion_not_seed_adoption
    full_translator_output_role: debug_and_proof_artifact_only_not_schema_or_seed_artifact
    seed_sql_fragment_role: >-
      generate-topology-seed's optional --seed-sql-fragment output (storage_adoption_contract)
      writes under generated_artifact_surface the same as any other --output artifact: local/tmp,
      gitignored, review-required-before-adoption. It is a rendering convenience over
      topologyUiSeedFlatRecords, not a new authority tier.
    prohibited_authority:
      - generated_json_as_ssot
      - generated_json_as_seed_adoption_authority
      - full_translator_output_as_schema_artifact
      - full_translator_output_as_seed_artifact
      - generate_log_as_proof_completion
      - generate_log_as_regeneration_source_by_itself
      - seed_sql_fragment_as_unreviewed_seed_adoption_authority
    regeneration_rule: >-
      Regeneration uses referenced input, SSOT, and when applicable *seed.sql.
      generate.log is an index/evidence trail, not the source material itself.
    reverse_generation_scope:
      seed_to_schema: future_scope_not_implemented
      round_trip_check: not_implemented_out_of_scope
