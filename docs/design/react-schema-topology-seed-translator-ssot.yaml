react_schema_topology_seed_translator_ssot:
  name: topolactor_react_schema_topology_seed_translator
  version: 1.1.0
  status: ssot_design_document
  canonical_path: docs/design/react-schema-topology-seed-translator-ssot.yaml

  authority:
    parent_ssot: docs/design/ui-builder-seed-first-gap-discovery-ssot.yaml
    ui_builder_preset_ecosystem_ref: docs/design/ui-builder-preset-ecosystem-ssot.yaml
    mock_intake_compiler_ref: docs/design/mock-preset-intake-compiler-ssot.yaml
    component_classification_ref: docs/design/component-catalog-classification-ssot.yaml
    ui_ux_primitive_catalog_ref: docs/design/ui-ux-primitive-catalog-ssot.yaml
    instance_port_substrate_ref: docs/design/instance-port-substrate-ssot.yaml
    runtime_orchestration_ref: docs/design/runtime-orchestration-ssot.yaml
    admin_console_ref: docs/design/admin-console-workflow-ssot.yaml
    css_dictionary_ref: docs/design/css-dictionary-ssot.yaml
    topology_layout_class_ref: docs/design/topology-layout-class-ssot.yaml
    production_policy_ref: docs/design/react-schema-topology-seed-translator-production-policy.md
    seed_authoring_reference_ref: docs/reference/seed-data-authoring-guide.md
    seed_authoring_reference_note: >-
      docs/reference/seed-data-authoring-guide.md is non-SSOT authoring/comparison guidance
      (its own Document Status declares Authority: non-SSOT) for seed and translator-output
      adoption -- canonical carrier classification, the canonical-conformance-vs-runtime-
      reachability axis split, and the seed authoring checklist. It does not own, extend, or
      override any shape/grammar/mapping/validation this SSOT owns; on conflict this SSOT
      wins. Routed structurally (not just linked) into the schema<->seed translator entry
      gate's own output (authoringReferences, present on every gateStatus -- see
      .agent/scripts/agent_tools/schema_seed_translator_entry_gate.py) and
      .agent/tools/README.md's seed authoring starting order, so every entry point that uses
      this translator reaches the same reference pointer without re-deriving it.
    note: >-
      This SSOT is the exchange contract only, between a React-like authoring schema and a
      topology UI seed. A next-Bundle Python3 tool reads this YAML and decomposes an input
      text into normalized elements, a generated React schema candidate, and a generated
      topology UI seed candidate. This file owns input/output shape, the inputText markup
      grammar, text decomposition, schema/seed shape, wiring lane classification, the UI
      catalog authority boundary, the projection/render exchange boundary, the input format
      ⇆ output format exchange mapping, the declared seed surface catalog, and validation
      rules. It does NOT own tool implementation, CLI shape, docker compose, nginx routing,
      C# invocation, or agent work procedure — those belong to production_policy_ref as
      non-SSOT guidance and must not be authored here.

  scope:
    owns:
      - input_format_shape
      - input_text_markup_grammar
      - text_decomposition_shape
      - react_schema_shape
      - topology_ui_seed_shape
      - output_format_shape
      - wiring_lane_classification
      - ui_catalog_authority_boundary
      - projection_render_exchange_boundary
      - input_format_to_output_format_exchange_mapping
      - declared_seed_surface_catalog
      - validation_rules
      - generated_artifact_operation_policy
    does_not_own:
      - python_tool_entrypoint_or_cli_shape
      - docker_compose_service_design
      - nginx_route_design
      - csharp_invocation_design
      - agent_work_procedure
      - active_topology_write_authority
      - frontend_component_implementation
      - backend_runtime_route_authority
      - direct_sql_seed_parsing_contract

  translator_input_authority:
    allowed_inputs:
      - this_ssot_yaml_file
      - other_ssot_yaml_files_reachable_through_source_yaml_refs_or_declared_seed_surface_catalog
      - an_inputText_string_supplied_by_the_caller_at_runtime_conforming_to_input_text_markup_grammar_contract
    prohibited_inputs:
      - db_seed_sql_files_as_translator_source
      - runtime_database_state
      - backend_server_response
      - frontend_runtime_state
      - free_text_without_a_declared_targetSurface_and_sourceYamlRefs
    rule: >-
      The translator reads SSOT YAML only. Anything in existing seed SQL that matters to the
      exchange must already be declared here as a declared_seed_surface_catalog entry before
      the translator can treat it as known. db/*.sql seed files stay reference material for the
      humans who author/maintain this SSOT; the translator itself never opens them and they are
      never source authority for a generated schema or seed candidate.
    protected_boundary_vocabulary:
      ref: docs/design/instance-port-substrate-ssot.yaml seed_aligned_json_template_boundary.protected_boundary
      values:
        - plaintext_secret
        - connection_string
        - endpoint_real_value
        - credential_plaintext
        - private_key_material
        - runtime_only_decrypted_payload
        - raw_SQL
        - unapproved_executable_function_or_schema_authority
      rule: >-
        No input_format field, decomposition unit, react_schema node, or topology_ui_seed
        record may carry a protected_boundary_vocabulary value. Any input text fragment that
        looks like one of these must become a validation error, not a normalized element.

  # ===========================================================================
  # 1. input_format_contract
  # ===========================================================================

  input_format_contract:
    schema_id: topolactor.translator_input.v1
    purpose: >-
      Shape of the object the Python tool reads before it runs text decomposition.
      input text -> semantic element decomposition -> React schema candidate is the
      canonical first pass; other modes reuse the same envelope.
    required_fields:
      schemaId:
        value: topolactor.translator_input.v1
        rule: literal_marker_must_match_exactly
      inputText:
        type: string
        rule: >-
          non_empty; the raw text to decompose. Must conform to
          input_text_markup_grammar_contract — free prose with no recognized tag never
          becomes a typed node, it becomes an Unresolved element.
      targetSurface:
        type: string
        rule: >-
          must equal an existing declared_seed_surface_catalog[].seed_surface_key, or be a new
          surface key explicitly paired with at least one known_gap_ref of classification
          ssot_ambiguity_gap or component_catalog_gap in knownGapRefs
      mode:
        type: enum
        values: [generate_react_schema, generate_topology_ui_seed, round_trip_check]
      sourceYamlRefs:
        type: list<source_yaml_ref>
        rule: non_empty; each entry is "file[ section_or_key_path]"
      knownGapRefs:
        type: list<known_gap_ref>
        rule: optional_but_required_when_targetSurface_is_new_or_inputText_names_an_unresolved_path
      protectedBoundaryRefs:
        type: list<string>
        rule: >-
          optional declaration of which protected_boundary_vocabulary values the caller has
          already screened inputText against; absence does not waive validation
    optional_fields:
      optionalHints:
        type: object
        rule: >-
          freeform authoring hints (e.g. preferred component family, preferred layout class).
          Hints are never authority: they cannot substitute for sourceYamlRefs, cannot resolve
          a knownGapRef, and cannot bypass a validation error.
      seedEvidence:
        type: object
        required_subfields: [screenUuidNamespace, screenUuid, manifestKey]
        rule: >-
          pre-resolved seed-backed evidence metadata (e.g. which manifest.manifest_id backs a
          declared_seed_surface_catalog entry, and which other-namespace UUID collisions were
          ruled out). The translator never opens db/*.sql to produce this field itself -- see
          translator_input_authority. Resolving/verifying seedEvidence against db/*.sql is an
          evidence/proof verification concern outside the translator body (e.g. the paired
          check-*.sh/*.py test surface for a given fixture). When supplied, the translator
          validates required_subfields presence and passes the object through to
          output_format_contract unchanged; it performs no lookup, derivation, or correction.
    mode_vocabulary:
      generate_react_schema: "inputText -> semantic element decomposition -> react schema candidate"
      generate_topology_ui_seed: "react schema candidate (passed as inputText JSON) -> topology ui seed candidate"
      round_trip_check: "topology ui seed candidate (passed as inputText JSON) -> react schema candidate -> loss/blocker comparison against the original react schema candidate"
    validation:
      - inputText_must_not_be_empty
      - inputText_must_conform_to_input_text_markup_grammar_contract
      - targetSurface_must_resolve_per_required_fields_rule_above
      - sourceYamlRefs_must_be_non_empty
      - mode_must_be_one_of_mode_vocabulary
      - protectedBoundaryRefs_absence_is_not_a_pass
      - seedEvidence_when_present_must_carry_required_subfields_and_is_never_resolved_by_the_translator_from_db_files

  # ===========================================================================
  # 2. text_decomposition_contract
  # ===========================================================================

  text_decomposition_contract:
    purpose: >-
      Defines the minimum set of element kinds the tool must recognize when segmenting
      inputText, and the rules every recognized element instance must satisfy. The concrete
      notation used to spot unit boundaries in inputText is input_text_markup_grammar_contract;
      this section defines the unit vocabulary that grammar is parsed into.
    deterministic: true
    ai_allowed: false
    units:
      projection:
        meaning: top-level authored surface (one screen/route worth of UI)
        maps_to_react_node: Projection
      category:
        meaning: grouping of sections within a projection (e.g. mode/tab switch group)
        maps_to_react_node: Category
      section:
        meaning: a disclosure/layout region inside a category or projection
        maps_to_react_node: Section
      form:
        meaning: a named mutation-or-input surface with one or more fields and an owning target
        maps_to_react_node: Form
      field:
        meaning: a single controlled input/control belonging to a form or standalone display
        maps_to_react_node: Field
      table:
        meaning: a tabular or list-shaped display/read surface
        maps_to_react_node: Table
      workflow:
        meaning: an ordered sequence of steps toward a lifecycle outcome (e.g. validate -> save -> promote)
        maps_to_react_node: Workflow
      step:
        meaning: one ordered stage inside a workflow, carrying its own eventBinding and authority marker
        maps_to_react_node: Step
      action:
        meaning: >-
          a dispatchable operation (click/change/submit) carrying an eventBinding classified
          into exactly one wiring_lane_contract lane
        maps_to_react_node: Action
      validation:
        meaning: a rule attached to a field, form, or action that can block or warn
        maps_to_react_node: Validation
      prop_binding:
        meaning: a read-only projection of runtime emission data into a component prop
        maps_to_react_node: PropBinding
      payload_from:
        meaning: a dispatch payload field sourced from a node value, event path, or literal
        maps_to_react_node: PayloadFrom
      style_ref:
        meaning: a reference to a css-dictionary token or topology-layout-class ref (see ui_catalog_boundary_contract.style_catalog)
        maps_to_react_node: StyleRef
      authority_marker:
        meaning: >-
          not a standalone node — an attached tag on a Form/Action/Step/Workflow element naming
          which authority_mapping stage (see exchange_mapping.authority_mapping) the element sits
          at (draft_or_projection_only | validation_only | preview_only |
          draft_apply_not_execution_authority | execution_candidate_authority_boundary |
          approved_runtime_execution_only)
        maps_to_react_node: null
      known_gap_ref:
        meaning: >-
          not a standalone node — an attached tag on any element that could not be resolved to a
          catalog identity, a recognized payload_from/prop_binding pattern, a style token, or a
          wiring lane. classification must be one of the canonical_gap_types in
          docs/design/ui-builder-seed-first-gap-discovery-ssot.yaml (component_catalog_gap,
          prop_binding_gap, event_payload_resolver_gap, runtime_dispatch_or_projection_gap,
          ssot_ambiguity_gap)
        maps_to_react_node: null
    rules:
      - every_recognized_unit_instance_carries_sourceYamlRefs
      - unit_boundaries_are_resolved_from_explicit_markup_in_inputText_per_input_text_markup_grammar_contract_not_from_free_nlp_inference
      - an_input_fragment_that_matches_no_unit_becomes_an_unresolved_element_not_a_silent_drop
      - decomposition_output_is_an_ordered_list_of_normalized_input_elements_preserving_source_order
      - authority_marker_and_known_gap_ref_are_attached_metadata_not_addressable_top_level_elements
      - action_and_step_units_carry_a_wiringLane_per_wiring_lane_contract

  # ===========================================================================
  # 3. input_text_markup_grammar_contract
  # ===========================================================================

  input_text_markup_grammar_contract:
    purpose: >-
      Defines the explicit, parseable notation inputText must use so
      text_decomposition_contract can resolve unit boundaries deterministically, without free
      NLP inference. This closes the gap left by text_decomposition_contract's
      "explicit markup, not inference" rule by naming the markup itself.
    deterministic: true
    ai_allowed: false
    grammar_kind: bracket_tag_line_based
    tag_shape:
      container_units: [projection, category, section, form, workflow, modal]
      leaf_units: [field, table, step, action, validation, prop_binding, payload_from, style_ref]
      open_tag_syntax: '[unitKind key=.. attr=.. attr2="value with space" ...]'
      close_tag_syntax: "[/unitKind]"
      leaf_tag_syntax: '[unitKind key=.. attr=.. ...]'
      note: leaf units terminate at end of line; they never require a matching close tag.
    common_attributes:
      key:
        required_on: [all_units]
        rule: stable identifier, unique within its parent container
      label:
        required_on: [all_units]
        rule: >-
          required on every unit, not only containers/fields. react_schema_contract's
          node_common_required_fields and topology_ui_seed_contract's
          record_common_required_fields both require label universally (including on
          Action/Step/Validation/PropBinding/PayloadFrom/StyleRef); a topology UI seed
          record must never carry label = null.
      sourceYamlRefs:
        required_on: [all_units]
        rule: comma-separated "file#section" tokens, e.g. "ui-builder-preset-ecosystem-ssot.yaml#hub_search_preset"
      knownGapRefs:
        required_on: conditional
        rule: >-
          comma-separated known_gap_ref ids; required whenever the unit cannot resolve a
          catalog identity, a recognized payload_from/prop_binding pattern, a style token, or
          a wiring lane
      authorityMarker:
        required_on: [form, action, step, workflow]
        required_on_conditional:
          field: >-
            round 37 -- required if and only if the Field also declares a wiringLane attribute
            (admin_runtime_dispatch_override_wiring); a Field authoring neither never needs
            authorityMarker. See wiring_lane_contract.lanes.admin_runtime_dispatch_override_wiring.
            field_participation rule 4.
        rule: one of exchange_mapping.authority_mapping target-stage values
      wiringLane:
        required_on: [action, step]
        rule: one of wiring_lane_contract.lanes keys
    per_unit_grammar:
      projection: '[projection key=.. label=.. sourceYamlRefs=..] ... [/projection]'
      category: '[category key=.. label=.. sourceYamlRefs=..] ... [/category]'
      section: '[section key=.. label=.. sectionKind=.. sourceYamlRefs=..] ... [/section]'
      form: '[form key=.. label=.. target=.. mode=.. authorityMarker=.. sourceYamlRefs=..] ... [/form]'
      field: '[field key=.. label=.. control=.. required=true|false sourceYamlRefs=.. knownGapRefs=.. valueFrom=.. wiringLane=.. actionRef=.. trigger=.. payloadFrom=.. optionsSource=.. optionsLabelPath=.. optionsValuePath=.. authorityMarker=.. debounceMs=..]'
      table: '[table key=.. label=.. source=.. display=.. displayColumns=.. rowsSource=.. sourceYamlRefs=..]'
      workflow: '[workflow key=.. label=.. authorityMarker=.. sourceYamlRefs=..] ... [/workflow]'
      modal: '[modal key=.. label=.. title=.. body=.. sourceYamlRefs=..] ... [/modal]'
      step: '[step key=.. actionRef=.. wiringLane=.. authorityMarker=.. order=.. sourceYamlRefs=..]'
      action: '[action key=.. actionRef=.. wiringLane=.. authorityMarker=.. sourceYamlRefs=.. knownGapRefs=.. disclosureActionType=.. disclosureTargetNodeId=.. disclosureStatePath=.. secondaryDisclosureActionType=.. secondaryDisclosureTargetNodeId=.. secondaryDisclosureStatePath=..]'
      validation: '[validation key=.. appliesTo=.. rule=.. severity=blocking|warning sourceYamlRefs=..]'
      prop_binding: '[prop_binding targetProp=.. source=.. sourceYamlRefs=..]'
      payload_from: '[payload_from targetField=.. source=.. sourceYamlRefs=..]'
      style_ref: '[style_ref target=.. tokenRef=.. sourceYamlRefs=..]'
    attachment_rule: >-
      authorityMarker, wiringLane, and knownGapRefs are attributes on their owning tag, never
      standalone bracket units; this matches text_decomposition_contract's authority_marker /
      known_gap_ref "not a standalone node" rule.
    disclosure_action_attributes: >-
      disclosureActionType/disclosureTargetNodeId/disclosureStatePath (round 24, admin-enum
      subBundle) are read only when the action/step's wiringLane is disclosure_state_wiring --
      see wiring_lane_contract.lanes.disclosure_state_wiring for the actionType vocabulary and
      the targetNodeId/statePath shape they produce. secondaryDisclosureActionType/
      secondaryDisclosureTargetNodeId/secondaryDisclosureStatePath are independent of wiringLane
      entirely: any action/step may carry them regardless of its primary lane, adding one
      additional runtimeInteractions[] entry alongside whatever the primary lane already
      produces (see wiring_lane_contract.lanes.disclosure_state_wiring.secondary_combination).
    unresolved_fragment_rule: >-
      Any inputText line/fragment that is not inside a recognized open/leaf tag, or whose
      unitKind is not in text_decomposition_contract.units, becomes an Unresolved element
      (react_schema_contract.allowed_node_kinds.Unresolved) carrying rawFragment and a
      mandatory knownGapRefs entry. The translator must never infer structure from
      unrecognized free text.
    table_display_and_rows_binding_attributes: >-
      round 3 (preview-gap audit, 2026-08-05). displayColumns and rowsSource are a Table's own
      data-defined carrier for a bound data_display/table's column list and rows propBinding
      source -- promoted from a translator-internal hardcode (propBindings.rows.source was
      unconditionally emitted as the literal "emission.data" for every Table with displayColumns,
      regardless of what was authored) into two explicit, independently-validated attributes.
      displayColumns is `key:Header,key2:Header 2` (comma-separated key:header pairs, order
      preserved) -- parse_columns in .agent/scripts/react_schema_topology_seed_translator.py is the
      canonical parser; find_display_columns_issues re-parses the SAME raw string strictly for
      validation (below). rowsSource is a JSON traversal path into the dispatched Emission --
      "emission.data" or "emission.data.<path>", the EXACT shape
      frontend/runtime/propBindingResolver.ts's own resolveRuntimeDataPath (isRecognizedPropBinding
      Source) accepts -- NEVER the Table's own `source` attribute value verbatim: `source` is a
      domain/table lineage identifier (e.g. "enum.groups", matching a
      docs/design/*-ssot.yaml#canonical_tables entry for sourceYamlRefs traceability) with no
      guaranteed relationship to the dispatched response's actual JSON shape, which is
      backend-action-specific (e.g. enum_dictionary:list_groups happens to return the whole groups
      array AT emission.data's root, not nested under an "enum"/"groups" key -- a literal-source-
      to-rowsSource mapping would be actively wrong here). displayColumns and rowsSource are
      authored TOGETHER or NEITHER (table_display_and_rows_binding_validation below) -- a Table
      binding real data needs both a column list and a data source.
      round 4 (2026-08-05): split_flat_records_into_adoption_candidates
      (.agent/scripts/react_schema_topology_seed_translator.py) reads rowsSource ONLY -- it never
      substitutes "emission.data" (or any other literal) as a default when rowsSource is
      missing/empty, including on the path where a caller feeds a hand-built react schema
      candidate directly into generate-topology-seed and bypasses generate-react-schema's own
      markup-attribute parsing (the only path where validate_table_display_columns_and_rows_
      source's own blocking TABLE_ROWS_SOURCE_REQUIRED_WITH_DISPLAY_COLUMNS error, which
      accumulates but does not itself halt generation, could otherwise be silently worked around).
      A topology_ui_table record reaching tensor generation with displayColumns set and no
      rowsSource raises SystemExit and fails the whole run closed rather than emitting a
      translator-guessed propBindings.rows.source.
    field_options_source_attributes: >-
      round 36 (admin-enum subBundle closure). optionsSource/optionsLabelPath/optionsValuePath are
      a Field's own OPTIONAL data-defined carrier for a data-bound select's options -- e.g. a
      "filter by group" dropdown whose choices come from the same roster the surface already
      displays, never a hardcoded/authored-literal option list (a select filtering user-editable
      data must reflect that data, not a translator/author-frozen snapshot).
      Mirrors Table's own displayColumns/rowsSource pairing exactly: optionsSource is a JSON
      traversal path into the dispatched Emission ("emission.data" or "emission.data.<path>", the
      SAME ROWS_SOURCE_SHAPE_RE shape rowsSource already uses and
      frontend/runtime/propBindingResolver.ts's own resolveRuntimeDataPath already accepts), while
      optionsLabelPath/optionsValuePath are the per-row property names used to build each option's
      label/value. All three are authored TOGETHER or NEITHER
      (validate_field_options_source below) -- a data-bound select needs a data source AND both
      identity paths.
      When authored, this becomes propBindings.options =
      {"source":optionsSource,"transform":"rowsToOptions","labelPath":optionsLabelPath,
      "valuePath":optionsValuePath} on the tensor node -- the SAME rowsToOptions-transform shape
      frontend/runtime/propBindingResolver.ts's COMPONENT_ARRAY_PROP_CAPABILITIES and
      backend/runtime/StructureMapResolver.cs's ComponentArrayPropCapabilities already validate
      and resolve for form_input/select's "options" prop at the RUNTIME layer (this capability
      predates round 36 -- see ValidateLayoutNodes_AcceptsValidRowsToOptionsWithPathFields) but
      which the translator's AUTHORING/GENERATION layer had no attribute to actually produce
      before this round -- a real generation gap, the same shape of gap round 3's rowsSource/
      displayColumns work closed for Table. Mutually exclusive with valueFrom in every Field
      authored to date (a Field is either a value-prefilled input or a data-bound select, never
      both) -- see convert_node_to_seed_record's per-nodeId single-owner propBindings merge
      comment in .agent/scripts/react_schema_topology_seed_translator.py for why this convention
      matters generically, not just for this specific Field.
    field_value_from_attribute: >-
      admin-enum subBundle closure round. valueFrom is a Field's own OPTIONAL data-defined carrier
      for selected-row-relative field prefill -- e.g. a group-detail input field whose value should
      seed from the currently-selected row of a sibling table. Grammar:
      "node:<id>.value" or "node:<id>.value.<path>", the IDENTICAL grammar
      ui-builder-preset-ecosystem-ssot.yaml payloadFrom_resolver_contract.recognized_source_
      patterns.node_value_path already defines for payloadFrom at dispatch time -- reused here for
      display-time prefill rather than invented as a second parallel source vocabulary
      (validate_field_value_from_source / FIELD_VALUE_FROM_NODE_REF_RE in
      .agent/scripts/react_schema_topology_seed_translator.py is the canonical validator/regex,
      shared with payloadFromResolver.ts's own NODE_VALUE_RE per that contract's own
      cross_implementation_parity rule). When authored, valueFrom is transcribed into the tensor
      node's propsJson as propBindings.value.source (generate_topology_ui_seed / seed transcription
      step) and resolved reactively at runtime by frontend/runtime/liveNodeValueTracker.ts's
      cascadeNodeValueReferences, which re-resolves only the nodes whose valueFrom-derived source
      references the node that just changed, writing through the SAME applyLiveNodeValueOverride
      slot the tracker already exposes -- never a second live-value mechanism. An emission.data-
      shaped source is out of scope for valueFrom and belongs to the separate, pre-existing
      propBindings.value resolution path against emissionData (seedTrackerFromPropBindingsValue).
    field_admin_runtime_dispatch_override_attributes: >-
      admin-enum subBundle closure round. A Field markup tag MAY additionally carry wiringLane/
      actionRef/trigger/payloadFrom attributes (the SAME attribute names Action/Step already
      author) to produce an eventBinding on that Field, consumed by
      build_admin_runtime_dispatch_override_candidate the SAME way an Action/Step's eventBinding
      already is -- no separate build function, no Field-specific candidate shape. trigger defaults
      to "change" when omitted (a typed field's own keystroke/selection event), unlike Action's
      "click" default. This exists for a generic read/filter use case: a typed search/filter field
      sourcing an EXISTING read action's optional filter payload from its own current value, never a
      new action or a new dispatch mechanism. Because validate_structural_node's
      VALID_ACTION_OWNER_NODE_KINDS / SECTION_OWNABLE_ACTION_LANES ownership check and
      validate_admin_runtime_preview_action_pairing's dryRun/confirmed pairing checks both gate on
      kind=="Action" only (a Field is never Action-owned by a Form/Workflow/Modal/Section in the
      first place, so those rules do not apply and must not be stretched to cover it), a Field's
      own use of this lane is validated by a SEPARATE, Field-specific fail-close check --
      validate_field_admin_runtime_dispatch_wiring, see
      wiring_lane_contract.lanes.admin_runtime_dispatch_override_wiring.field_participation --
      restricting it to generic read/filter use and rejecting any shape that would let a Field carry
      mutation authority.
    prohibited:
      - inferring_a_unit_kind_from_prose_without_a_matching_tag
      - silently_upgrading_an_unresolved_fragment_to_a_typed_node
      - accepting_a_tag_with_no_key_attribute
      - accepting_a_tag_with_no_sourceYamlRefs_attribute
      - accepting_an_action_or_step_tag_with_no_wiringLane_attribute
      - deriving_rowsSource_from_the_table_source_attribute_or_any_other_hardcoded_literal
      - substituting_a_default_rowsSource_when_validation_was_bypassed_or_skipped
      - field_owned_admin_runtime_dispatch_override_wiring_eventBinding_declaring_an_authority_flag_key_or_pairing_with_a_secondaryDisclosureAction_or_targeting_a_mutation_verb_action
    validation:
      - every_open_tag_has_a_matching_close_tag_for_container_units
      - every_tag_key_is_unique_within_its_parent
      - unknown_unitKind_in_a_tag_is_a_blocking_validation_error_not_silent_ignore
      - action_and_step_tags_declare_a_wiringLane_recognized_by_wiring_lane_contract
    table_display_and_rows_binding_validation: >-
      validate_table_display_columns_and_rows_source (.agent/scripts/react_schema_topology_seed_
      translator.py), run over every Table node alongside validate_admin_runtime_preview_action_
      pairing: (1) TABLE_DISPLAY_COLUMNS_MALFORMED -- a malformed/empty/duplicate-key displayColumns
      segment (missing ':' separator, empty key, empty header, or a key repeated) is a blocking
      validation error, never silently dropped from validation even though parse_columns' own
      lenient parsing still omits the malformed entry from the returned column list; (2)
      TABLE_ROWS_SOURCE_REQUIRED_WITH_DISPLAY_COLUMNS / TABLE_DISPLAY_COLUMNS_REQUIRED_WITH_ROWS_
      SOURCE -- displayColumns and rowsSource must be authored together; (3) TABLE_ROWS_SOURCE_
      INVALID -- rowsSource, when present, must match ROWS_SOURCE_SHAPE_RE (^emission\.data(\..+)?$),
      the same shape frontend/runtime/propBindingResolver.ts's isRecognizedPropBindingSource
      accepts.

  # ===========================================================================
  # 4. react_schema_contract
  # ===========================================================================

  react_schema_contract:
    schema_id: topolactor.react_schema.v1
    role: authoring_schema_not_runtime_component_not_arbitrary_react
    required_root_fields:
      - schema
      - presetKey
      - surface
      - sourceYamlRefs
      - root
    node_common_required_fields:
      - key
      - label
      - sourceYamlRefs
    node_common_optional_fields:
      - knownGapRefs
      - authorityMarker
    allowed_node_kinds:
      Projection:
        required: [children]
        emits_seed: topology_ui_projection
      Category:
        required: [children]
        emits_seed: topology_ui_category
      Section:
        required: [children]
        emits_seed: topology_ui_section
      Form:
        required: [target, mode, fields, authorityMarker]
        emits_seed: topology_ui_form
      Field:
        required: [control, required]
        optional: [valueFrom, eventBinding, authorityMarker, debounceMs]
        optional_paired: [optionsSource, optionsLabelPath, optionsValuePath]
        optional_note: >-
          admin-enum subBundle closure round. valueFrom is the authored propBindings.value.source
          node-reference for selected-row-relative field prefill -- see
          input_text_markup_grammar_contract.field_value_from_attribute below. eventBinding is
          produced only when the field markup tag also carries a wiringLane attribute (the SAME
          admin_runtime_dispatch_override_wiring lane Action/Step already author, extended to Field
          for a generic read/filter use case such as a typed search field sourcing an existing read
          action's optional filter payload) -- see
          wiring_lane_contract.lanes.admin_runtime_dispatch_override_wiring.field_participation
          below for the read-only fail-close restriction this participation is subject to. Both are
          absent for the common case (most Fields author neither). round 37: authorityMarker becomes
          REQUIRED (not merely optional) the moment a Field also carries wiringLane -- see
          authorityMarker.required_on_conditional.field above and field_participation rule 4.
          debounceMs (round 37, search_filter_input_contract debounce_policy) becomes REQUIRED
          (a positive integer, milliseconds) the moment control="form_input/search_input" AND
          wiringLane is authored -- see field_participation rule 5; absent for the common case (a
          Field with no wiringLane, or a non-search_input control, never needs it). Mirrors
          Step/Action's pre-existing debounceMs authoring_metadata_field
          (admin-uibuilder-ui-structure-wiring-ssot.yaml high_frequency_policy) but travels through
          a DIFFERENT runtime lane (admin_runtime, not externalPortDispatch/
          instanceOperationDispatch) -- see frontend/runtime/runtimeComponentFactory.ts
          scheduleOrDispatchRuntimeCommand for the runtime behavior it drives.
        optional_paired_note: >-
          round 36: optionsSource/optionsLabelPath/optionsValuePath (authored together or none --
          see input_text_markup_grammar_contract.field_options_source_attributes below) become this
          Field's own propBindings.options for a data-bound select (e.g. a "filter by group"
          dropdown). Absent for the common case (most Fields are not data-bound selects).
        emits_seed: topology_ui_field
      Table:
        required: [source, display]
        optional_paired: [displayColumns, rowsSource]
        optional_paired_note: >-
          round 3: displayColumns (column list) and rowsSource (propBindings.rows.source JSON
          traversal path, see input_text_markup_grammar_contract.table_display_and_rows_binding_
          attributes) are authored together or neither -- table_display_and_rows_binding_validation
          fails closed on a lone one.
        emits_seed: topology_ui_table
      Workflow:
        required: [steps, authorityMarker]
        emits_seed: topology_ui_workflow
      Modal:
        required: [componentKind, children]
        emits_seed: topology_ui_modal
        note: >-
          componentKind is always "disclosure/modal" (round 24 -- the translator does not yet
          support Drawer/Dialog container kinds; a future round adds those alongside their own
          disclosure_state_wiring targetKind support). title/body are optional display props,
          carried through to the tensor node's propsJson by the seed transcription step, never
          read or validated by the translator itself. That transcription step MUST nest
          title/body (and an explicit "open":false) under a top-level "data" key in propsJson --
          e.g. {"data":{"open":false,"title":"...","body":"..."}} -- never flat top-level
          {"title":"...","body":"..."} (round 25 fix; round 24's original db/seed_empty.sql shape
          was flat and wrong). frontend/runtime/renderEmission.ts mergeNodeLocalProps only ever
          shallow-merges propsJson onto componentKind's default props, and
          frontend/runtime/layoutComponentPreview.ts's own "disclosure/modal" default props are
          {data:{open:true,title:"Modal",body:"プレビュー"}} (a UI-Builder canvas-preview
          convenience) -- a flat propsJson would add new unrelated top-level keys while leaving
          that default's own nested "data" (still open:true, wrong title/body) completely
          untouched, since modalFactory reads props.data whenever it is present. Only a real
          ProjectionShell DOM mount test caught this; neither Composer unit tests nor live-DB
          structural proof exercise propsJson merging at all.
      Step:
        required: [eventBinding, authorityMarker]
        emits_seed: topology_ui_workflow_step
      Action:
        required: [eventBinding, authorityMarker]
        emits_seed: topology_ui_action
      Validation:
        required: [rule, severity]
        emits_seed: topology_ui_validation
      PropBinding:
        required: [targetProp, source]
        emits_seed: topology_ui_prop_binding
      PayloadFrom:
        required: [targetField, source]
        emits_seed: topology_ui_payload_from
      StyleRef:
        required: [target, tokenRef]
        emits_seed: topology_ui_style_ref
      Unresolved:
        required: [rawFragment, knownGapRefs]
        emits_seed: topology_ui_unresolved
        note: >-
          terminal node kind for input fragments that text_decomposition_contract could not
          classify into any other unit; always carries at least one known_gap_ref
    event_binding_field_ref: wiring_lane_contract.event_binding_shape
    prohibited_features:
      - arbitrary_component_import
      - arbitrary_js_expression
      - frontend_direct_persistence
      - unbounded_inline_css
      - unknown_component_key_silent_fallback
      - unknown_control_silent_fallback
      - action_without_authorityMarker
      - action_or_step_without_wiringLane
      - form_without_fields
      - mutation_action_not_owned_by_a_form
      - section_owned_admin_runtime_action_without_dryrun_openmodal_confirm_pairing
      - field_without_label
      - node_without_label
      - node_without_source_yaml_refs
      - protected_boundary_vocabulary_value_present
      - raw_html_tag_emission
      - topology_ui_seed_record_missing_common_or_type_required_field
      - componentKind_absent_from_ui_catalog_boundary_contract_frontend_component_catalog

  # ===========================================================================
  # 5. topology_ui_seed_contract
  # ===========================================================================

  topology_ui_seed_contract:
    schema_id: topolactor.topology_ui_seed.v1
    role: draft_intake_artifact_not_active_topology
    required_root_fields:
      - schema
      - seedKey
      - surface
      - sourceReactSchema
      - sourceYamlRefs
      - projections
      - exchangeReport
    record_common_required_fields:
      - recordType
      - key
      - label
      - sourceYamlRefs
      - sourceReactPath
      - knownGapRefs
    record_types:
      topology_ui_projection:
        required: [surface, categories]
      topology_ui_category:
        required: [categoryKey, sections]
      topology_ui_section:
        required: [sectionKey, sectionKind, children]
      topology_ui_form:
        required: [formKey, target, mode, fields, actions, authorityMarker]
      topology_ui_field:
        required: [fieldKey, control, required, validationRefs]
      topology_ui_table:
        required: [tableKey, source, display, columns]
        optional_paired: [displayColumns, rowsSource]
      topology_ui_workflow:
        required: [workflowKey, steps, authorityMarker]
      topology_ui_modal:
        required: [modalKey, componentKind, children]
      topology_ui_workflow_step:
        required: [stepKey, actionRef, eventBinding, authorityMarker]
      topology_ui_action:
        required: [actionKey, actionRef, eventBinding, authorityMarker]
      topology_ui_validation:
        required: [validationKey, rule, severity]
      topology_ui_prop_binding:
        required: [targetProp, source]
      topology_ui_payload_from:
        required: [targetField, source]
      topology_ui_style_ref:
        required: [target, tokenRef]
      topology_ui_unresolved:
        required: [rawFragment, knownGapRefs]
    projection_category_section_form_field_table_workflow_action_mapping_ref: >-
      exchange_mapping.schema_to_seed_record_mapping (single source of truth for the
      React-node-kind -> seed-record-type table; not duplicated here)
    event_binding_field_ref: wiring_lane_contract.event_binding_shape
    runtime_interactions_candidate_contract:
      role: draft_layout_patch_runtimeInteractions_candidate_not_final_identity_authority
      owner: topology_ui_action_and_topology_ui_workflow_step_records
      relationship_to_eventBinding: >-
        eventBinding remains the lane/target/payload authoring contract. When an
        Action or Workflow Step can become a layout_patch_json runtime interaction,
        the translator/template generator must preserve the same trigger, lane-derived
        actionType, backend-validation-compatible runtime targetRef field
        (for dispatchInstanceOperation this is instanceTargetRef using the
        instance-port:<portKind>:<instancePortId>:<operationBindingKey> vocabulary),
        payloadFrom, idempotencyPolicy, lifecycleDispatchConfirmed, and debounceMs in
        runtimeInteractions[] candidate entries.
      forbidden:
        - runtimeInteractionId_generation_in_translator_template_or_seed_candidate
        - treating_eventBinding_alone_as_the_layout_patch_runtimeInteractions_candidate
        - dropping_idempotencyPolicy_lifecycleDispatchConfirmed_or_debounceMs_before_backend_persist_boundary
      backend_assignment_boundary_ref: docs/design/admin-uibuilder-ui-structure-wiring-ssot.yaml lifecycle_policy.projection_authority_runtime_interaction_identity
    projection_render_ref: projection_render_exchange_contract
    exchange_report_ref: exchange_report_contract
    loss_report_ref: exchange_report_contract.loss_entry_fields
    validation_errors_ref: validation_rules.topology_ui_seed_validation
    protected_material_boundary_ref: docs/design/instance-port-substrate-ssot.yaml seed_aligned_json_template_boundary.protected_boundary
    active_topology_rule: >-
      Topology UI seed is draft/intake material only. It cannot write active topology or create
      callable execution authority by itself; it still requires the existing preview / validate /
      apply / admin-approve boundary described in authority_mapping before anything it describes
      can execute. This holds even after a record is advanced into a RuntimeComponentSpec
      candidate under projection_render_exchange_contract.

  # ===========================================================================
  # 5a. storage_adoption_contract
  # ===========================================================================
  # Added after PR #573 (credential_management_ui_seed_rebuild): a
  # topologyUiSeedCandidate with validationErrorCount: 0 was adopted into
  # manifest.topology as a single ~17KB jsonb[] array element and broke a
  # real Postgres INSERT with "index row size 3776 exceeds maximum 2712 for
  # index idx_manifest_topology". topology_ui_seed_contract's own
  # validation_rules never checked the candidate against the actual storage
  # column's index constraint, only against this SSOT's own record shape
  # rules. This section closes that gap.

  storage_adoption_contract:
    target_storage:
      table: manifest
      column: topology
      column_type: jsonb[]
      index: idx_manifest_topology
      index_type: gin
      index_definition_ref: db/manifest_tables.sql
    constraint:
      each_jsonb_array_element_must_fit_indexable_item_budget: true
      budget_bytes: 2712
      budget_measurement: utf8_encoded_byte_length_not_python_character_length
      budget_rationale: >-
        idx_manifest_topology is a GIN index over a jsonb[] column. A GIN index over an array
        type indexes each array element as one indexable item, subject to Postgres's
        page-size-derived index item size ceiling (observed failure: "index row size 3776
        exceeds maximum 2712"). A topologyUiSeedCandidate's nested projections tree, if
        embedded as a single jsonb[] element, routinely exceeds this budget once it covers more
        than a handful of fields/actions.
      rule: >-
        topology UI seed adoption into manifest.topology must never require a single oversized
        jsonb[] element. The nested topologyUiSeedCandidate is debug/review output only; only
        the flattened topologyUiSeedFlatRecords shape (or an equivalent manual flattening) may be
        adopted into a seed file.
    top_ssot_alignment:
      note: >-
        Added for the ui-seed-translator-uibuilder-top-ssot-alignment bundle. top SSOT
        (docs/framework-core.yaml topolactor_space_model, docs/framework-policy.yaml
        ui_topology_tensor_persistence, db/manifest_tables.sql) holds that manifest.topology
        is a registry-refs / package-refs / layout-refs / relay-refs / runtime-vector store,
        never a UI-entity payload store. PR #573's fix (this section, pre-alignment) treated
        the flattened_topology_ui_seed_record_array shape itself as "the seed adoption
        shape" for manifest.topology -- i.e. it fixed the GIN-index byte-budget failure by
        splitting the array into smaller elements, but kept adopting UI-entity payload
        (record trees) directly into manifest.topology, which top SSOT does not allow
        regardless of element size. adoption_candidate_separation_contract below is the
        actual fix: UI payload moves to topology.ui_component_package /
        components_layout_design / components_style_design / components_package_design /
        ui_wiring_registry / ui_topology_tensor (db/ui_topology_tables.sql), and
        manifest.topology receives only a refs-only ui_projection-shaped entry
        (packageIds / layoutId / wiringId / tensorId) per db/manifest_tables.sql.
    allowed_adoption_shapes:
      - shape: nested_topology_ui_seed_candidate
        role: local_tmp_review_artifact_only
        seed_adoptable: false
      - shape: flattened_topology_ui_seed_record_array
        role: review_migration_temporary_adoption_artifact
        seed_adoptable: false
        manifest_topology_final_shape: false
        note: >-
          Downgraded from PR #573's "seed_adoption_shape". This shape remains useful as a
          reviewable, byte-budget-checked intermediate rendering of a topologyUiSeedCandidate
          tree (e.g. for a human/agent to read before hand-authoring package/layout/wiring/
          tensor rows, or as a migration source for adoption_candidate_separation_contract's
          bucketing step), but it must never be pasted into manifest.topology as final
          content -- see manifest_topology_contains_ui_payload_material and
          flattened_seed_record_used_as_manifest_final_shape in validation_rules below.
      - shape: adoption_candidate_bundle
        role: seed_adoption_shape
        seed_adoptable: true
        ref: adoption_candidate_separation_contract
    adoption_candidate_separation_contract:
      purpose: >-
        The actual seed-safe adoption shape. Splits a topologyUiSeedFlatRecords list (or the
        tree it was flattened from) into per-target-table candidate buckets plus a refs-only
        manifest candidate, so nothing UI-entity-shaped is ever proposed for adoption into
        manifest.topology.
      tool_ref: >-
        .agent/scripts/react_schema_topology_seed_translator.py
        split_flat_records_into_adoption_candidates implements this contract, called from
        generate-topology-seed after flatten_topology_ui_seed_tree /
        validate_flat_seed_records.
      primary_and_derived_candidate_relationship:
        note: >-
          PR580 review follow-up: topology_ui_action / topology_ui_workflow_step records
          contribute to THREE candidate buckets (layoutAdoptionCandidates,
          wiringAdoptionCandidates, tensorAdoptionCandidates), which required_rules'
          every_topologyUiSeedFlatRecords_element_is_assigned_to_exactly_one_non_manifest_bucket_by_recordType
          could misread as three competing primary-bucket assignments. This is not a top
          SSOT change -- it clarifies, within this subordinate SSOT, which of the three is
          the PRIMARY storage bucket and which are DERIVED candidates projected from that
          same primary record:
            - PRIMARY bucket: layoutAdoptionCandidates. topology_ui_action /
              topology_ui_workflow_step records are structural layout-tree content (label,
              eventBinding, authorityMarker) exactly like topology_ui_category /
              topology_ui_section / topology_ui_form / etc., and are stored in full inside
              layoutAdoptionCandidates.layoutSchemaJson.records, the same as every other
              layout-tree record type. This satisfies "exactly one non-manifest bucket by
              recordType" -- the PRIMARY assignment.
            - DERIVED bucket 1: wiringAdoptionCandidates. A narrower projection of the same
              record (eventBinding + authorityMarker only) for topology.ui_wiring_registry
              persistence -- see the aggregate shape below.
            - DERIVED bucket 2: tensorAdoptionCandidates. A narrower projection of the same
              record's runtimeInteractions for topology.ui_topology_tensor persistence.
          Derived candidates are additional projections built FROM the primary record, not
          a second full storage of it, and do not violate "exactly one" at the primary-bucket
          level. tool_ref: split_flat_records_into_adoption_candidates's module-level and
          inline comments implement and document this relationship directly (see
          "primary_and_derived_candidate_relationship" docstring reference in that function).
      package_authority_boundary:
        note: >-
          docs/design/db-schema.yaml draws two DISTINCT "package" table identities that must
          never be conflated:
            - topology.components_package_design (formerly packages): role
              component_design_bundle_referenced_by_manifest, with an explicit
              manifest_reference: manifest.topology[ui_projection].packageIds. This is the
              manifest-facing package authority -- the same one
              projection_constructor_mapping / sse_projection manifest entries already
              reference (db/manifest_tables.sql).
            - topology.ui_component_package: role component_group_bundle, required only by
              topology.ui_topology_tensor.package_id's own FK constraint
              (db/ui_topology_tables.sql). It is a supporting identity for tensor
              persistence, never a manifest.packageIds target.
          packageAdoptionCandidates below targets the former (manifest authority).
          componentGroupBundleAdoptionCandidates targets the latter (tensor FK
          prerequisite) -- a distinct bucket, not a renaming of the same concept, because
          persisting a tensorAdoptionCandidates row requires a real row in
          topology.ui_component_package to satisfy its package_id FK, independent of
          whatever the manifest-facing package authority is.
      candidate_buckets:
        packageAdoptionCandidates:
          target_table: topology.components_package_design
          source_record_types: [topology_ui_projection]
          shape: >-
            one candidate per Projection record: {packageKey, layout: []}. layout mirrors
            topology.components_package_design.layout's shape
            ([{componentId?, layoutNodeId?, designId}, ...]) and is honestly empty when the
            surface authored no component+design pairs via UI Component Builder (e.g. a
            fixed_form_projection with ui_builder_authority:false) -- never invented.
            packageKey is derived from seedKey, never invented.
        componentGroupBundleAdoptionCandidates:
          target_table: topology.ui_component_package
          source_record_types: [topology_ui_projection]
          shape: >-
            one candidate per Projection record: {componentGroupBundleKey, packageKind:
            "fixed_form_projection"|"ui_builder_authored", packageSchemaJson: {seedKey,
            surface, categoryKeys}}. componentGroupBundleKey is derived from seedKey, never
            invented, and MUST NOT reuse packageAdoptionCandidates' packageKey verbatim (see
            package_authority_boundary) -- distinct identities need distinguishable keys.
            Exists solely so tensorAdoptionCandidates has a real package_id to persist
            against; not itself a manifest.packageIds target.
        layoutAdoptionCandidates:
          target_table: topology.components_layout_design
          source_record_types: [topology_ui_category, topology_ui_section, topology_ui_form, topology_ui_field, topology_ui_table, topology_ui_workflow, topology_ui_action, topology_ui_workflow_step, topology_ui_validation, topology_ui_unresolved]
          primary_bucket_note: >-
            The PRIMARY storage bucket for topology_ui_action / topology_ui_workflow_step
            too (see primary_and_derived_candidate_relationship above) -- their full record
            content lives here, same as every other structural layout-tree record type.
            wiringAdoptionCandidates / tensorAdoptionCandidates below are derived
            projections of the same record, not a second primary assignment.
          shape: >-
            one candidate per Projection record: {layoutKey, layoutKind,
            layoutSchemaJson: {records: <the same topology_ui_seed_record[] wrapper list
            flatten_topology_ui_seed_tree produces, unmodified>}}. layout_schema_json has
            no per-array-element GIN index budget (plain jsonb column, not jsonb[]), so no
            further flattening/splitting is required once it lives here -- the
            storage_adoption_contract.constraint byte budget applies only to
            manifest.topology's idx_manifest_topology GIN index, which this candidate never
            targets.
        designAdoptionCandidates:
          target_table: topology.components_style_design
          source_record_types: [topology_ui_style_ref]
          shape: one candidate per StyleRef record; empty list when a surface has no style_ref records (not an error -- design/style content is optional, not every surface uses it)
        wiringAdoptionCandidates:
          target_table: topology.ui_wiring_registry
          source_record_types: [topology_ui_action, topology_ui_workflow_step]
          shape: >-
            ONE aggregate candidate per Projection (never one per Action/Step -- see
            cardinality_note below): {wiringKey: "<seedKey>.wiring", wiringKind:
            "action_bundle", targetSurface: "manifest", wiringSchemaJson: {actions: [one
            entry per Action/Step record carrying eventBinding: {wiringKey, wiringKind:
            eventBinding.wiringLane, targetSurface: "manifest", wiringSchemaJson:
            {eventBinding, sourceActionKey, authorityMarker}, sourceRecordKey}, ...]}}.
          cardinality_note: >-
            PR580 review follow-up (Blocking 2): db/manifest_tables.sql's ui_projection
            shape (top SSOT, unchanged) declares wiringId as a single ref, and
            topology.ui_topology_tensor.wiring_id / topology.ui_wiring_registry.wiring_id
            are both singular (db/ui_topology_tables.sql). A translator that emitted one
            wiringAdoptionCandidates entry per Action/Step (as an earlier version of this
            contract did) produces a manifestRefsCandidate.wiringId that cannot resolve to
            any single one of them. This aggregate shape -- matching
            db/seed_empty.sql's already-adopted
            auth.external.credential_management.projection.wiring row, whose
            wiring_schema_json carries an "actions" array of six individual action wiring
            entries -- is the correct, already-proven-in-production shape; the translator
            implementation was the out-of-sync side, not the seed or top SSOT.
        tensorAdoptionCandidates:
          target_table: topology.ui_topology_tensor
          source_record_types: [topology_ui_action, topology_ui_workflow_step]
          shape: >-
            one layout_patch_json candidate per Projection, plus the packageId reference the
            persisted tensor row's own package_id FK needs: {tensorKey, packageIdRef:
            <componentGroupBundleAdoptionCandidates componentGroupBundleKey for this same
            Projection -- NEVER packageAdoptionCandidates' packageKey, per
            package_authority_boundary>, nodes: [{nodeId: <owning Form/Section key>,
            nodeKind, runtimeInteractions: [<build_runtime_interaction_candidate output per
            action, no runtimeInteractionId -- see
            runtime_interactions_candidate_contract.forbidden>]}]}. This is the carrier
            runtime_interactions_not_persisted_layout_path checks: every Action/Step
            eventBinding with a dispatch-shaped wiringLane (external_integration_wiring /
            external_instance_wiring) must appear inside some tensor candidate's
            nodes[].runtimeInteractions[], never dropped silently.
        manifestRefsCandidate:
          target_table: manifest
          shape: >-
            {"type":"ui_projection","packageIds":[<packageAdoptionCandidates
            (topology.components_package_design) ids once persisted -- NEVER
            componentGroupBundleAdoptionCandidates ids, per package_authority_boundary>],
            "layoutId":<layoutAdoptionCandidates id>,"wiringId":<wiringAdoptionCandidates
            id>,"tensorId":<tensorAdoptionCandidates id>} -- ids are placeholders
            (candidate-local keys) until a reviewer persists the referenced rows and fills
            in real UUIDs; the translator never invents or assigns UUIDs itself.
            required_rules: manifestRefsCandidate must never carry a `record`, `fields`,
            `actions`, `columns`, `sections`, or `categories` key -- refs and vectors only.
            Being refs-only is necessary but not sufficient: every ref (packageIds entries,
            layoutId, wiringId, tensorId) must also resolve to a key an emitted candidate
            in the matching bucket actually carries -- see
            manifest_refs_candidate_reference_resolution below. A refs-only shape whose refs
            point at nothing is not proof of correct wiring.
      required_rules:
        - every_topologyUiSeedFlatRecords_element_is_assigned_to_exactly_one_non_manifest_bucket_by_recordType
        - manifestRefsCandidate_never_carries_ui_payload_fields
        - manifestRefsCandidate_packageIds_reference_packageAdoptionCandidates_never_componentGroupBundleAdoptionCandidates
        - tensorAdoptionCandidates_packageIdRef_references_componentGroupBundleAdoptionCandidates_never_packageAdoptionCandidates
        - tensor_candidate_runtimeInteractions_never_carries_runtimeInteractionId
        - empty_bucket_is_valid_when_no_source_record_type_present_not_an_error
        - manifest_refs_candidate_reference_resolution
      prohibited:
        - proposing_topologyUiSeedFlatRecords_or_topologyUiSeedCandidate_as_a_manifest_topology_adoption_candidate
        - manifestRefsCandidate_embedding_record_or_nested_list_fields
        - conflating_components_package_design_and_ui_component_package_as_the_same_authority
        - manifestRefsCandidate_packageIds_pointing_at_a_componentGroupBundleAdoptionCandidates_id
        - manifestRefsCandidate_ref_field_pointing_at_a_key_no_emitted_candidate_in_the_matching_bucket_carries
        - emitting_one_wiringAdoptionCandidates_entry_per_Action_or_Step_record_instead_of_one_aggregate_entry_per_Projection
    flattened_record_contract:
      wrapper_type: topology_ui_seed_record
      required_fields: [type, seedKey, parentKey, record]
      parent_link_rule: >-
        parentKey reconstructs the generated tree: the root projection record's parentKey is
        null; every other record's parentKey equals the key of the record it was nested under
        (recordType-specific nesting: topology_ui_projection.categories,
        topology_ui_category.sections, topology_ui_section.children,
        topology_ui_form.{fields,actions}, topology_ui_table.columns,
        topology_ui_workflow.steps -- see exchange_mapping.schema_to_seed_record_mapping for the
        authoritative node-kind list).
      record_rule: >-
        record is the original topology_ui_* node from topology_ui_seed_contract.record_types
        with its nested list field(s), if any, replaced by a `<listKey>Keys` array of the
        child records' own `key` values (e.g. topology_ui_category's `sections` becomes
        `sectionKeys`); record_common_required_fields, authorityMarker (where the record type
        requires it), and eventBinding (where the record type requires it) are preserved
        unchanged.
      generated_json_authority: false
      seed_sql_authority: false
      seed_sql_authority_note: >-
        Downgraded from PR #573 (true -> false): this shape by itself is never final
        manifest.topology content (manifest_topology_final_shape: false above). It becomes
        seed-adoptable only after adoption_candidate_separation_contract buckets it into
        packageAdoptionCandidates / layoutAdoptionCandidates / designAdoptionCandidates /
        wiringAdoptionCandidates / tensorAdoptionCandidates plus a refs-only
        manifestRefsCandidate -- those candidates carry seed_sql_authority, this
        intermediate shape does not.
    validation_rules:
      - serialized_flattened_record_must_fit_target_storage_budget
      - flattened_records_must_reconstruct_a_single_projection_tree_via_parentKey
      - parentKey_must_resolve_to_another_record_in_the_same_seedKey_group_or_be_null_for_the_root
      - every_flattened_record_must_preserve_sourceYamlRefs_and_sourceReactPath
      - every_action_or_workflow_step_record_must_preserve_authorityMarker_and_eventBinding
      - no_flattened_record_may_carry_protected_boundary_vocabulary
      - manifest_topology_contains_ui_payload_material
      - flattened_seed_record_used_as_manifest_final_shape
      - ui_payload_not_split_to_package_layout_design_wiring_tensor
      - runtime_interactions_not_persisted_layout_path
      - idempotency_carrier_missing_for_runtime_dispatch
      - credential_secret_projection_detected
      - package_authority_target_table_mismatch
      - manifest_refs_candidate_reference_resolution
    top_ssot_violation_rule_definitions:
      note: >-
        Full definitions of the eight top-SSOT-violation rule ids added above (kept here,
        adjacent to the contract they enforce, rather than only in validation_rules'
        flatter list, since these are new rules with non-obvious detection conditions).
      manifest_topology_contains_ui_payload_material:
        detects: a candidate proposed for manifest.topology adoption (manifestRefsCandidate
          or an ad hoc equivalent) carries a `record`, `fields`, `actions`, `columns`,
          `sections`, or `categories` key instead of only ref/vector fields
        severity: blocking
      flattened_seed_record_used_as_manifest_final_shape:
        detects: any topology_ui_seed_record-typed element (flattened or nested) appears in
          output destined for manifest.topology rather than layoutAdoptionCandidates
        severity: blocking
      ui_payload_not_split_to_package_layout_design_wiring_tensor:
        detects: generate-topology-seed output omits
          adoption_candidate_separation_contract candidate buckets entirely (i.e. only the
          legacy topologyUiSeedFlatRecords/topologyUiSeedCandidate shapes are present) when
          topologyUiSeedFlatRecords is non-empty
        severity: blocking
      runtime_interactions_not_persisted_layout_path:
        detects: an Action/Step record whose eventBinding.wiringLane is
          external_integration_wiring or external_instance_wiring has no corresponding
          entry in any tensorAdoptionCandidates[].layout_patch_json.nodes[].runtimeInteractions[]
        severity: blocking
      idempotency_carrier_missing_for_runtime_dispatch:
        detects: a tensorAdoptionCandidates runtimeInteractions[] entry with actionType
          dispatchExternalPort or dispatchInstanceOperation is missing the idempotency route
          fields it must carry through to the backend persistence boundary (trigger,
          actionType, targetRef/portTargetRef/instanceTargetRef, payloadFrom) -- NOT a check
          for idempotencyPolicy/lifecycleDispatchConfirmed, which lifecycle_policy in
          docs/design/admin-uibuilder-ui-structure-wiring-ssot.yaml already requires only for
          lifecycle-triggered dispatch, and NOT a check for runtimeInteractionId, which this
          translator must never generate (see runtime_interactions_candidate_contract.forbidden)
        severity: blocking
      credential_secret_projection_detected:
        detects: any candidate bucket (package/layout/design/wiring/tensor/manifestRefs)
          carries a protected_boundary_vocabulary value; a stricter, adoption-candidate-scoped
          restatement of translator_input_authority.protected_boundary_vocabulary.rule so the
          check runs again at the adoption-candidate boundary, not only at input-envelope time
        severity: blocking
      package_authority_target_table_mismatch:
        detects: >-
          package_authority_boundary violated -- either manifestRefsCandidate.packageIds
          references a componentGroupBundleAdoptionCandidates key instead of a
          packageAdoptionCandidates key, or tensorAdoptionCandidates' packageIdRef
          references a packageAdoptionCandidates key instead of a
          componentGroupBundleAdoptionCandidates key. Added after a real PR review finding
          (ui-seed-translator-uibuilder-top-ssot-alignment bundle follow-up) that conflated
          topology.ui_component_package (component_group_bundle, tensor-FK-only) with
          topology.components_package_design (component_design_bundle_referenced_by_manifest,
          the actual manifest.topology[ui_projection].packageIds authority per
          docs/design/db-schema.yaml) -- this rule exists specifically so that conflation
          cannot silently reproduce.
        severity: blocking
        checker_ref: >-
          .agent/scripts/check_react_schema_topology_seed_translator.py additionally
          cross-reads docs/design/db-schema.yaml's packages/components_package_design
          manifest_reference field and this SSOT's packageAdoptionCandidates.target_table
          field and fails if they disagree, since the translator itself never reads
          db-schema.yaml (translator_input_authority) -- that cross-check is a
          checker-side-only concern.
      manifest_refs_candidate_reference_resolution:
        detects: >-
          manifestRefsCandidate.packageIds / layoutId / wiringId / tensorId carries a
          value that does not equal any actually-emitted candidate key in the matching
          bucket (packageAdoptionCandidates[].packageKey / layoutAdoptionCandidates[].
          layoutKey / wiringAdoptionCandidates[].wiringKey / tensorAdoptionCandidates[].
          tensorKey, each `<...>`-wrapped). Added after a real PR review finding (PR580
          translator-adoptionCandidates-top-ssot-conformance follow-up): a refs-only
          manifestRefsCandidate shape is necessary but not sufficient proof of correct
          wiring -- the refs must also resolve. The concrete bug this rule targets: an
          earlier translator version emitted one wiringAdoptionCandidates entry per
          Action/Step record but a single aggregate-style wiringId
          (`<seedKey>.wiring`), which could never match any of the per-Action keys
          (`<seedKey>.<actionKey>.wiring`) actually emitted -- see
          candidate_buckets.wiringAdoptionCandidates.cardinality_note.
        severity: blocking
        checker_ref: >-
          .agent/scripts/react_schema_topology_seed_translator.py validate_adoption_candidates
          checks all four ref fields against the actual emitted candidate key sets built
          from the same candidates bundle, not existence-of-any-value alone.
    tool_ref: >-
      .agent/scripts/react_schema_topology_seed_translator.py implements this contract:
      flatten_topology_ui_seed_tree builds the flattened_record_contract shape from the same
      record tree topologyUiSeedCandidate is built from; validate_flat_seed_records checks the
      constraint (SEED_RECORD_EXCEEDS_STORAGE_BUDGET, blocking);
      split_flat_records_into_adoption_candidates implements adoption_candidate_separation_contract;
      validate_adoption_candidates implements the eight top_ssot_violation_rule_definitions
      above, collecting every violation found rather than stopping at the first
      (fail-fast is prohibited for this check -- see validation_rules ordering note in
      react_schema_validation); generate-topology-seed's optional --seed-sql-fragment flag
      renders the flattened records as ready-to-paste jsonb[] array element lines (still a
      generated artifact per generated_artifact_operation_policy, not seed adoption
      authority by itself -- a reviewer must read and adopt it).

  # ===========================================================================
  # 6. output_format_contract
  # ===========================================================================

  output_format_contract:
    schema_id: topolactor.translator_output.v1
    purpose: shape of the object the Python tool returns for every mode in input_format_contract.mode_vocabulary.
    required_fields:
      normalizedInputElements:
        type: list<normalized_element>
        source: text_decomposition_contract
        rule: >-
          ordered list mirroring inputText; every element carries unitKind (one of
          text_decomposition_contract.units, or "unresolved"), rawFragment, and sourceYamlRefs
      reactSchemaCandidate:
        type: topolactor.react_schema.v1 | null
        rule: populated when mode is generate_react_schema or round_trip_check; null for generate_topology_ui_seed unless the caller also supplied a react schema candidate to carry through
      topologyUiSeedCandidate:
        type: topolactor.topology_ui_seed.v1 | null
        rule: >-
          populated when mode is generate_topology_ui_seed or round_trip_check; null for
          generate_react_schema. This nested tree is a debug/review artifact only -- see
          storage_adoption_contract for why it must never be adopted as a single
          manifest.topology array element.
      topologyUiSeedFlatRecords:
        type: list<topology_ui_seed_record> | null
        rule: >-
          populated only for generate_topology_ui_seed, derived from the same tree as
          topologyUiSeedCandidate but flattened per storage_adoption_contract.flattened_record_contract;
          null for generate_react_schema and round_trip_check. This is a review/migration
          intermediate artifact only (storage_adoption_contract.flattened_record_contract.seed_sql_authority
          is false) -- each element is independently checked against
          storage_adoption_contract.constraint, but the seed-safe adoption shape is
          adoptionCandidates below, not this field directly.
      adoptionCandidates:
        type: adoption_candidate_bundle | null
        rule: >-
          populated only for generate_topology_ui_seed, built from topologyUiSeedFlatRecords
          per storage_adoption_contract.adoption_candidate_separation_contract; null for
          generate_react_schema and round_trip_check. Object with fields
          packageAdoptionCandidates / layoutAdoptionCandidates / designAdoptionCandidates /
          wiringAdoptionCandidates / tensorAdoptionCandidates / manifestRefsCandidate (each a
          list except manifestRefsCandidate, which is a single refs-only object or null when
          the surface emitted no Projection record). This is the seed-safe adoption shape.
      exchangeReport:
        type: exchange_report_contract
        rule: always populated, even when empty (zero records still yields a report shell)
      validationErrors:
        type: list<validation_error>
        rule: >-
          each entry names the failing rule id from validation_rules, the offending path, and
          whether it is blocking or a warning; empty list means no errors, never omitted
      unresolvedGaps:
        type: list<known_gap_ref>
        rule: every Unresolved / topology_ui_unresolved node's knownGapRefs, deduplicated
      reverseTranslationBlockers:
        type: list<reverse_translation_blocker>
        rule: populated only for round_trip_check mode; empty list (not null) for the other two modes
    validation_error_shape:
      required: [ruleId, path, severity, message]
      severity_values: [blocking, warning]
    reverse_translation_blocker_shape:
      required: [seedRecordPath, reason, knownGapRef]

  # ===========================================================================
  # 7. exchange_mapping
  # ===========================================================================

  exchange_mapping:
    canonical_direction:
      direction: react_schema_to_topology_ui_seed
      status: required_first_direction
      rule: >-
        A React-like schema may be normalized into a topology UI seed only when every node has
        sourceYamlRefs, a catalog identity or known_gap_ref, and an explicit authorityMarker
        where the node kind requires one.
    reverse_direction:
      direction: topology_ui_seed_to_react_schema
      status: future_candidate_gated_by_round_trip_check_mode
      rule: >-
        Reverse translation is allowed only after the forward pass recorded enough identity,
        sourceYamlRefs, and loss markers on the seed to reconstruct the authoring schema without
        inventing new information; any record that cannot be reconstructed produces a
        reverse_translation_blocker instead of a guessed React node.

    text_to_schema_mapping:
      projection: Projection
      category: Category
      section: Section
      form: Form
      field: Field
      table: Table
      workflow: Workflow
      modal: Modal
      step: Step
      action: Action
      validation: Validation
      prop_binding: PropBinding
      payload_from: PayloadFrom
      style_ref: StyleRef
      authority_marker: attaches_authorityMarker_field_to_owning_Form_Action_Step_or_Workflow_node
      known_gap_ref: attaches_knownGapRefs_entry_to_owning_node

    schema_to_seed_record_mapping:
      Projection: topology_ui_projection
      Category: topology_ui_category
      Section: topology_ui_section
      Form: topology_ui_form
      Field: topology_ui_field
      Table: topology_ui_table
      Workflow: topology_ui_workflow
      Modal: topology_ui_modal
      Step: topology_ui_workflow_step
      Action: topology_ui_action
      Validation: topology_ui_validation
      PropBinding: topology_ui_prop_binding
      PayloadFrom: topology_ui_payload_from
      StyleRef: topology_ui_style_ref
      Unresolved: topology_ui_unresolved

    seed_record_to_schema_candidate_mapping:
      rule: inverse of schema_to_seed_record_mapping, applied only under reverse_direction
      per_record_requirement:
        - record.sourceReactPath_must_resolve_to_a_reconstructable_node_shape
        - record.sourceYamlRefs_must_carry_over_unchanged
        - record.knownGapRefs_must_carry_over_unchanged
      on_failure: emit reverse_translation_blocker; never emit a guessed React node

    identity_mapping:
      react_key: seed.key
      react_label: seed.label
      react_path: seed.sourceReactPath
      sourceYamlRefs: seed.sourceYamlRefs
      knownGapRefs: seed.knownGapRefs
      authorityMarker: seed.authorityMarker

    authority_mapping:
      frontend_intent: draft_or_projection_only
      backend_validate: validation_only
      backend_preview: preview_only
      backend_apply: draft_apply_not_execution_authority
      admin_approve: execution_candidate_authority_boundary
      runtime_execute: approved_runtime_execution_only
      wiring_lane_cross_check_ref: >-
        wiring_lane_contract.lanes[].event_binding_shape.authority must be one of these six
        values; wiring_lane_contract narrows which of these values a given lane may use.

    unmapped_element_handling:
      unmapped_input_text_fragment:
        becomes: normalizedInputElements entry with unitKind unresolved, and a react_schema Unresolved node
        requirement: knownGapRefs non_empty; appears in output_format_contract.unresolvedGaps
      unmapped_react_schema_node:
        condition: node kind absent from react_schema_contract.allowed_node_kinds, or missing a required field
        handling: validationErrors entry with severity blocking; translator must fail-closed, never silently drop the node
      unmapped_seed_record_during_reverse:
        condition: recordType absent from topology_ui_seed_contract.record_types, or sourceReactPath missing/unreconstructable
        handling: reverseTranslationBlockers entry; reverse pass must not guess a React node

    loss_policy:
      no_silent_loss: true
      dropped_property_requires_loss_report_entry: true
      unresolved_mapping_requires_known_gap_ref: true
      reverse_translation_requires_no_unexplained_loss: true
      loss_report_shape_ref: exchange_report_contract.loss_entry_fields

  exchange_report_contract:
    required_fields:
      - sourceSchemaId
      - outputSeedSchemaId
      - sourceYamlRefs
      - emittedRecords
      - knownGapRefs
      - lossEntries
      - reverseTranslationBlockers
      - validationErrors
    loss_entry_fields:
      - sourceReactPath
      - property
      - reason
      - severity
      - knownGapRef
    known_gap_ref_rule: >-
      A known_gap_ref may explain unresolved schema/seed exchange only when it points to an
      existing Bundle-level gap (see ui-builder-seed-first-gap-discovery-ssot.yaml
      canonical_gap_types) or an owner-approved temporary gap. It must never be used to mark
      incomplete exchange as implemented.

  # ===========================================================================
  # 8. wiring_lane_contract
  # ===========================================================================

  wiring_lane_contract:
    purpose: >-
      Classify every Action/Step eventBinding into exactly one wiring lane, so that targetRef
      shape, allowed payloadFrom sources, and authority boundary are lane-specific instead of
      one generic dispatch bucket. Authority is never inferred from action name alone.
    lanes:
      external_integration_wiring:
        meaning: external service / external API / external port dispatch
        examples: [sftp_transfer, file_export, email_send, browser_http_call]
        targetRef_shape: 'external-port:<portKind>:<portId>'
        authority_ref: docs/design/instance-port-substrate-ssot.yaml port_kinds
        allowed_authority_mapping_values: [validation_only, preview_only, draft_apply_not_execution_authority, execution_candidate_authority_boundary, approved_runtime_execution_only]
        allowed_payload_from_sources: [node_value, event_path, literal]
      external_instance_wiring:
        meaning: registered external instance operation (db_instance_port / runtime_instance_port)
        examples: [registered_db_instance_call, registered_runtime_instance_call, credential_ref_use, connection_policy_ref_use, approved_operation_binding]
        targetRef_shape: 'instance:<db_instance_port|runtime_instance_port>:<instanceAuthorityKey>:<operationBindingKey>'
        authority_ref: docs/design/instance-port-substrate-ssot.yaml authority_model
        allowed_authority_mapping_values: [validation_only, preview_only, draft_apply_not_execution_authority, execution_candidate_authority_boundary, approved_runtime_execution_only]
        allowed_payload_from_sources: [node_value, event_path, literal]
        requires_admin_approve_before_runtime_execute: true
        gap_discovery_note: >-
          draft_apply_not_execution_authority was added to this lane's allowed authority values
          during the credential-management-0092 generate-react-schema fixture build: an
          instance-operation "apply" step needs a draft-apply stage before admin_approve, the
          same as contents_api_wiring's create/update draft stage. Recorded here per
          ui-builder-seed-first-gap-discovery-ssot.yaml as a reusable contract fix rather than a
          fixture-specific authority workaround.
      internal_instance_wiring:
        meaning: UI-local state / local trigger / projection-local state; no backend dispatch
        examples: [modal_open_close, drawer_open_close, selected_row, tab_state, localStateMutation, calcTriggerCallback, searchCallback_local_only, payloadFrom_node_value_only]
        targetRef_shape: 'ui-local:<nodeId>.<stateKey>'
        authority_ref: null
        allowed_authority_mapping_values: [draft_or_projection_only]
        allowed_payload_from_sources: [node_value, literal]
      contents_api_wiring:
        meaning: >-
          contents API / DTO / entity operation, including both entity CRUD dispatch
          (content_bundle:*) and contents-side aggregation / read-query dispatch
          (manifest:<manifestId>:<wiringKey> via package_wiring_manifest_bridge)
        examples: [content_bundle:search, content_bundle:create_entity_draft, content_bundle:update_entity_draft, content_bundle:validate_draft, content_bundle:promote_draft, content_bundle:get_entity, content_bundle:list_states, 'manifest:<manifestId>:<wiringKey>']
        targetRef_shape:
          one_of:
            - 'content_bundle:<operation>'
            - 'manifest:<manifestId>:<wiringKey>'
        authority_ref: docs/design/ui-builder-preset-ecosystem-ssot.yaml existing_entity_validate_save_dispatch_alignment_contract, package_wiring_manifest_bridge
        allowed_authority_mapping_values: [validation_only, preview_only, draft_apply_not_execution_authority]
        allowed_payload_from_sources: [node_value, event_path, literal]
      route_navigation_wiring:
        meaning: >-
          admin-authored cross-route/package navigation; UI-local trigger but with a
          canonical persisted targetRef, distinct from internal_instance_wiring's ephemeral
          UI-only state
        examples: [back_button_navigation, open_related_route, open_detail_route]
        targetRef_shape: 'route:<routeKey>'
        authority_ref: docs/design/ui-builder-preset-ecosystem-ssot.yaml cross_preset_authoring_boundary.author_resolution_map.route_navigation_targetRef
        allowed_authority_mapping_values: [draft_or_projection_only, draft_apply_not_execution_authority]
        allowed_payload_from_sources: [literal]
      admin_runtime_dispatch_override_wiring:
        meaning: >-
          per-trigger override of a node's admin_runtime dispatch target (dispatchTargetRefByTrigger)
          and/or payload (dispatchPayloadFromByTrigger), independent of the owning layout's own
          uniform wiring_kind=admin_runtime target_ref. Round 17 (2026-07-29) addition, closing the
          known_gaps entry below: none of the other five lanes maps to this shape, so an
          Action/Step authoring this override previously had no wiringLane it could legally declare.
        examples: [enum_group_create_preview, enum_group_create_confirm, admin_write_operation_selector_override]
        targetRef_shape: 'manifest:<manifestId>:<layer>:<action>'
        authority_ref: docs/design/admin-uibuilder-ui-structure-wiring-ssot.yaml admin_runtime_target_ref_override_contract
        allowed_authority_mapping_values: [validation_only, preview_only, draft_apply_not_execution_authority, draft_or_projection_only]
        allowed_authority_mapping_values_note: >-
          draft_or_projection_only (round 37) is additive and Field-only -- see
          field_participation's rule 4 below. Action/Step's own use of this lane (rules 1-5 above,
          gated on kind=="Action") is unaffected and still uses only the original three values;
          nothing about this addition changes what an Action/Step may declare.
        allowed_payload_from_sources: [node_value, event_path, literal]
        record_carrier: >-
          Distinct from every other lane above: this lane's Action/Step candidate is NEVER folded
          into tensorAdoptionCandidates[].layoutPatchJson.nodes[].runtimeInteractions[] (round 6/15/16
          design: action-authority-vs-effect-data separation). It is carried as its own
          adminRuntimeDispatchOverride candidate (build_admin_runtime_dispatch_override_candidate in
          .agent/scripts/react_schema_topology_seed_translator.py) and merged into that SAME tensor
          node's own dispatchTargetRefByTrigger / dispatchPayloadFromByTrigger maps, keyed by trigger.
        section_owned_dryrun_preview_pairing: >-
          preview-gap round (2026-08-04). react_schema_contract.prohibited_features'
          mutation_action_not_owned_by_a_form rule (VALID_ACTION_OWNER_NODE_KINDS = Form/Workflow/
          Modal in .agent/scripts/react_schema_topology_seed_translator.py) additionally permits a
          Section to directly own an Action via SECTION_OWNABLE_ACTION_LANES when that Action's own
          wiringLane is disclosure_state_wiring OR (this round's addition)
          admin_runtime_dispatch_override_wiring -- the SAME structural role a
          disclosure_state_wiring open-trigger button already occupied there -- but ONLY as a
          non-mutating dryRun preview trigger, never a bare ungated mutation. This is a fail-close
          structural check (validate_admin_runtime_preview_action_pairing in
          .agent/scripts/react_schema_topology_seed_translator.py), not lane-name allowlist
          membership alone: a Section-owned use of this lane MUST pair with a
          secondaryDisclosureActionType=openModal (never closeModal/toggleModal -- ruleId
          ADMIN_RUNTIME_PREVIEW_ACTION_SECONDARY_OPEN_MODAL_REQUIRED when missing/wrong type), MUST
          declare payloadFrom.dryRun="literal:true" and MUST NOT declare any OTHER member of
          AUTHORITY_FLAG_KEYS ({dryRun, confirmed} -- the closed mutation_confirmation_contract
          flag vocabulary; ADMIN_RUNTIME_PREVIEW_ACTION_DRYRUN_REQUIRED /
          ADMIN_RUNTIME_PREVIEW_ACTION_CONFIRMED_NOT_ALLOWED), and the Modal it opens MUST contain
          exactly one child Action on this SAME lane (the Confirm button --
          ADMIN_RUNTIME_PREVIEW_ACTION_CONFIRM_TARGET_AMBIGUOUS when zero or more than one) whose
          own target_ref (ADMIN_RUNTIME_PREVIEW_ACTION_TARGET_REF_MISMATCH) and business-field
          payloadFrom set -- every key except dryRun on the preview side / confirmed on the confirm
          side -- (ADMIN_RUNTIME_PREVIEW_ACTION_PAYLOAD_FIELDS_MISMATCH) are IDENTICAL to the
          preview Action's own. examples above (enum_group_create_preview /
          enum_group_create_confirm) are exactly this pairing -- a preview that resolved a different
          manifest/layer/action/field set than its own Confirm would silently ship a UI that
          previews one write and executes another.
        confirm_action_authority_pairing: >-
          round 3 (preview-gap audit, 2026-08-05). Rules 1-4 above prove the resolved Confirm
          button (the SAME same-lane child under the opened Modal) is the CORRECT target to pair
          against -- they do not themselves prove that button actually carries write-confirmation
          authority; lane membership plus Modal position was previously trusted as sufficient. This
          additional structural check on the SAME resolved confirm_action closes that gap: its own
          payloadFrom MUST declare confirmed="literal:true" exactly
          (ADMIN_RUNTIME_CONFIRM_ACTION_CONFIRMED_LITERAL_TRUE_REQUIRED when absent/wrong value) and
          MUST NOT declare any OTHER AUTHORITY_FLAG_KEYS member (never a leftover dryRun, never a
          future third authority flag -- ADMIN_RUNTIME_CONFIRM_ACTION_EXTRA_AUTHORITY_FLAG_NOT_
          ALLOWED). AUTHORITY_FLAG_KEYS is a closed, generic set (frozenset({"dryRun",
          "confirmed"})) checked via set difference on both the preview and confirm sides, not two
          independent single-key checks -- a third authority-shaped flag introduced later to either
          side fails closed here rather than silently passing.
        field_participation: >-
          admin-enum subBundle closure round (round 36, strengthened round 37). A Field node (see
          input_text_markup_grammar_contract.field_admin_runtime_dispatch_override_attributes) may
          ALSO declare this lane on its own eventBinding, independent of the Action-only rules
          above -- rules 1-5 and confirm_action_authority_pairing all gate on
          `node.get("kind") == "Action"` and never run for a Field, by design (a Field is never
          Action-owned by a Form/Workflow/Modal/Section, so the preview/confirm-modal-pairing shape
          those rules protect does not apply to it at all). A Field's own use of this lane is
          instead a SEPARATE, narrower, generic fail-close restricting it to read/filter use only --
          validate_field_admin_runtime_dispatch_wiring in
          .agent/scripts/react_schema_topology_seed_translator.py, run over every Field node
          (never keyed by nodeId, manifest UUID, or operation name):
            1. FIELD_ADMIN_RUNTIME_DISPATCH_AUTHORITY_FLAG_NOT_ALLOWED -- the Field's own
               payloadFrom must not declare ANY AUTHORITY_FLAG_KEYS member (neither "dryRun" nor
               "confirmed"). A Field can never legally carry write-confirmation authority, and
               unlike an Action it can never pair into the Section-owned dryRun-preview shape
               either (that shape structurally requires a paired Modal Confirm child, which a bare
               Field can never own) -- so even dryRun is disallowed here, not just confirmed.
            2. FIELD_ADMIN_RUNTIME_DISPATCH_MODAL_MUTATION_NOT_ALLOWED -- the Field must not carry
               a secondaryDisclosureAction. Disclosure/Modal open-close authority belongs to
               Action/Step's own disclosure_state_wiring lane and its documented
               secondary_combination with this lane; a Field driving Modal state as a side effect
               of a keystroke/change event is exactly the kind of ungated mutation-adjacent
               authority this restriction exists to prevent.
            3. FIELD_ADMIN_RUNTIME_DISPATCH_MUTATION_TARGET_NOT_ALLOWED -- the Field's own
               targetRef (manifest:<manifestId>:<layer>:<action>) must resolve to a resource:action
               pair listed under a "_read" group of docs/design/admin-master-roster-management-
               ssot.yaml admin_runtime_actions. Round 37 replaced the prior
               MUTATION_ACTION_VERB_PREFIXES verb-heuristic denylist ({"create", "update", "delete",
               "set"}) with this POSITIVE allowlist -- ADMIN_RUNTIME_READ_ACTIONS in
               .agent/scripts/react_schema_topology_seed_translator.py, mirroring the SSOT's
               enum_dictionary_read/auth_users_read groups verbatim -- because a denylist only
               catches verbs someone thought to list (it would silently pass a Field wired to
               manifest:promote, layout_patch:apply, seed_runtime:import, package_generator:
               promote_package, etc., none of which start with create/update/delete/set). Any
               resource:action absent from the SSOT's admin_runtime_actions block at all (not just
               one explicitly listed under a "_write" group) is rejected by this same allowlist,
               fail-closed by construction rather than by an ever-growing verb list.
            4. FIELD_ADMIN_RUNTIME_DISPATCH_AUTHORITY_MARKER_REQUIRED /
               FIELD_ADMIN_RUNTIME_DISPATCH_AUTHORITY_MARKER_MISMATCH (round 37) -- a Field
               declaring this lane must carry an explicit authorityMarker equal to
               "draft_or_projection_only" (exchange_mapping.authority_mapping's own
               frontend_intent value -- the weakest of the six authority tiers, semantically exact
               for "Field-driven frontend read/filter intent, no backend mutation authority").
               react_schema_contract.node_common_optional_fields already lists authorityMarker as a
               Field-legal attribute; this rule makes it REQUIRED specifically when (and only when)
               the Field also declares admin_runtime_dispatch_override_wiring, mirroring
               EVENT_BINDING_AUTHORITY_MISMATCH's existing "eventBinding authority must equal owning
               node authorityMarker" rule (previously enforced only for Form/Action/Step/Workflow)
               rather than inventing a second pattern. "draft_or_projection_only" was added to this
               lane's own allowed_authority_mapping_values (below) as an additive, Field-only legal
               value -- Action/Step's own three existing values for this lane are unchanged. This is
               an independent, author-asserted-intent signal that must AGREE with rule 3's
               allowlist-derived classification; either one failing alone still fails the whole
               Field closed (they are not redundant with each other -- rule 3 checks what the
               targetRef actually resolves to, rule 4 checks what the author declared they meant it
               to be, and BOTH must hold).
            5. FIELD_ADMIN_RUNTIME_SEARCH_DISPATCH_REQUIRES_DEBOUNCE_MS (round 37,
               search_filter_input_contract debounce_policy; runtime fail-close added round 39) --
               a Field with control="form_input/search_input" declaring this lane must carry a
               valid positive-integer debounceMs. Scoped to search_input specifically: a
               discrete-choice control (e.g. form_input/select) fires once per selection via its
               own onChange, never once per keystroke, so it carries none of the "uncontrolled on
               every keystroke" risk this rule exists to close and is never required to declare
               one. Round 39 connected this to a matching backend persistence-boundary check
               (NpgsqlUiTopologyRepository.ValidateFieldOwnedAdminRuntimeSearchDebounce,
               RUNTIME_INTERACTION_FIELD_SEARCH_DISPATCH_REQUIRES_DEBOUNCE_MS) and a frontend
               runtime fail-close (runtimeComponentFactory.ts emitBoundEvent, same error code
               prefix) that rejects the dispatch outright -- before ever scheduling anything --
               when spec.componentType is exactly "form_input/search_input" and
               isValidFieldDebounceMs(spec.debounceMs) is false, rather than silently falling
               through to an immediate dispatch (see search_filter_input_contract below for the
               full 3-layer accept/reject matrix these three checks share). Runtime
               ENFORCEMENT (distinct from the round-39 fail-close guard above, which runs
               before any scheduling decision): frontend/runtime/runtimeComponentFactory.ts
               scheduleOrDispatchRuntimeCommand delays the actual network enqueue by
               debounceMs, canceling any still-pending timer for the SAME
               runtimeDispatchCircuitKey (round 38 -- targetRef-scoped, so every Field/Action
               dispatching to the SAME admin_runtime target shares one circuit, never keyed by
               the catalog componentId two unrelated nodes might share) on a new firing --
               collapsing rapid typing to one dispatch per debounce window, and correctly
               canceling a still-pending debounced dispatch when a DIFFERENT field on the SAME
               circuit (e.g. a filter select) fires immediately during that window. A per-circuit
               monotonic dispatch sequence number (runtimeDispatchSeqByCircuitId) additionally
               discards a settled response that is no longer the latest fired call for that
               circuit (stale-result boundary) -- generic to every admin_runtime dispatch, not
               scoped to debounced Fields alone.
          Round 40 (schema-composed authoring persistence-boundary parity): rules 3 and 5 above,
