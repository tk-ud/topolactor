  # ===========================================================================
  # 9. ui_catalog_boundary_contract
  # ===========================================================================

  ui_catalog_boundary_contract:
    purpose: >-
      Define the authority boundary between built frontend components, style/layout tokens,
      and HTML tag vocabulary, so seed emission never invents raw HTML/CSS or treats
      implementation classification metadata as an independent authoring authority.
    catalogs:
      frontend_component_catalog:
        role: runtime_projection_authority
        source_of_truth:
          - docs/design/component-catalog-classification-ssot.yaml catalog_vocabulary_contract (componentFamily / semanticRole / visualRole / lifecycleStatus / capabilityTags)
          - frontend/components/catalog.ts (implementation surface; not read by the translator, referenced for humans only)
        rule: >-
          A seed may select only a registered componentKey/componentKind pair. Runtime-selectable
          only when registered per component-catalog-classification-ssot.yaml registration_required.
      style_catalog:
        role: presentation_reference_only
        source_of_truth:
          - docs/design/css-dictionary-ssot.yaml token_key_rule (css token refs)
          - docs/design/topology-layout-class-ssot.yaml class_key_rule (layout class refs)
        rule: >-
          style_ref nodes/records must use a css-dictionary token key or a topology-layout-class
          ref; no raw inline CSS, no raw Tailwind string, no arbitrary className.
      html_tag_catalog:
        role: classification_metadata_only
        source_of_truth: docs/design/mock-preset-intake-compiler-ssot.yaml mapping_contract.allowed_mapping_kinds (structural_html)
        rule: >-
          HTML tag vocabulary describes how a built frontend component is implemented
          internally (e.g. a Section node renders a <section> tag). It is implementation
          classification metadata only; the translator never emits a raw HTML tag as a seed
          record on its own. A structural_html mapping is only valid when it uses an
          allowlisted tag per mock-preset-intake-compiler-ssot.yaml mapping_contract.
    required_rules:
      - frontend_component_catalog_is_the_runtime_projection_authority
      - seed_may_select_only_registered_componentKey_or_componentKind
      - style_must_use_css_dictionary_token_or_topology_layout_class_ref
      - html_tag_catalog_is_classification_metadata_only_not_directly_emitted_by_seed
      - seed_must_not_emit_arbitrary_raw_html_tag
      - seed_must_not_emit_arbitrary_js
      - unknown_component_or_control_or_style_token_is_blocking_known_gap_ref
    prohibited:
      - treating_raw_html_tag_generation_as_normal_seed_output
      - accepting_arbitrary_inline_css_without_allowlist_or_token_ref
      - treating_component_catalog_and_html_tag_catalog_as_the_same_authority

  # ===========================================================================
  # 10. projection_render_exchange_contract
  # ===========================================================================

  projection_render_exchange_contract:
    purpose: >-
      Extend the exchange beyond react_schema ⇆ topology_ui_seed to the projection runtime
      boundary that turns a topology ui seed record into a candidate RuntimeComponentSpec,
      without granting seed emission any build-time authority.
    stages:
      - topology_ui_seed_record
      - registered_componentKey_or_componentKind (ui_catalog_boundary_contract.frontend_component_catalog)
      - props (react_schema PropBinding / static field values)
      - eventBinding (wiring_lane_contract.event_binding_shape)
      - runtimeInteractions[] candidate (derived from eventBinding plus idempotency route fields, with backend-validation-compatible targetRef vocabulary; no runtimeInteractionId)
      - payloadFrom (wiring_lane_contract lane-validated payloadFrom)
      - design_or_style_refs (ui_catalog_boundary_contract.style_catalog)
      - RuntimeComponentSpec_candidate
      - registered_runtime_component_factory (existing frontend/runtime/runtimeComponentFactory.ts; referenced only, not modified by this SSOT)
    runtime_component_spec_shape:
      required: [componentKey, componentKind, props, eventBindings, styleRefs, sourceSeedRecordPath, knownGapRefs]
    required_rules:
      - registered_componentKind_may_be_selected_at_runtime_only_if_present_in_frontend_component_catalog
      - props_eventBinding_payloadFrom_design_refs_may_vary_at_runtime_without_changing_the_seed_contract
      - runtimeInteractions_candidate_preserves_idempotency_route_fields_until_backend_assignment_boundary
      - runtimeInteractions_candidate_must_not_carry_runtimeInteractionId
      - unregistered_componentKind_is_blocking_known_gap_ref
      - seed_must_not_imply_new_frontend_component_implementation
      - seed_must_not_imply_build_less_creation_of_new_html_or_js_behavior
      - runtime_component_spec_is_the_projection_target_not_active_topology
      - html_and_js_behavior_is_owned_by_built_frontend_components_not_by_the_seed
    prohibited:
      - treating_seed_as_an_arbitrary_html_js_generator
      - silently_falling_back_for_unknown_component_kinds
      - treating_build_time_component_implementation_as_runtime_seed_authority
      - translator_emitting_frontend_implementation_behavior_instead_of_seed_or_spec_candidates
    authority_boundary: >-
      RuntimeComponentSpec candidates are still draft/intake material per
      topology_ui_seed_contract.active_topology_rule; producing a spec candidate does not grant
      execution authority or bypass preview/validate/apply.
    layout_schema_structural_render_authority_boundary:
      owner_ref: >-
        docs/design/runtime-orchestration-ssot.yaml
        ui_projection_render_reachability_contract.layout_schema_structural_render_contract owns
        the RUNTIME PROJECTION/RENDER classification (structural_node vs catalog_component vs
        unresolved_gap, resolution conventions, explicit-failure behavior) once a topology_ui_seed
        record reaches components_layout_design.layout_schema_json.records[] via
        layoutAdoptionCandidates. This SSOT owns the SEED EMISSION shape only
        (react_schema_contract.allowed_node_kinds, topology_ui_seed_contract.record_types,
        exchange_mapping.schema_to_seed_record_mapping). Neither SSOT restates the other's
        classification -- this section is a pointer, not a duplicate definition.
      runtime_projection_semantics_by_record_type: >-
        Every recordType in storage_adoption_contract.adoption_candidate_separation_contract
        .candidate_buckets.layoutAdoptionCandidates.source_record_types has a runtime
        classification in the owner_ref contract above:
        topology_ui_category/topology_ui_section/topology_ui_form/topology_ui_workflow/
        topology_ui_validation are structural_node;
        topology_ui_field/topology_ui_action/topology_ui_table/topology_ui_workflow_step are
        catalog_component (each with its own resolution convention: control-based for Field,
        display-based for Table, shared with Action for WorkflowStep); topology_ui_unresolved is
        unresolved_gap, an explicit render-time error carrying knownGapRefs, never a normal
        component. None of the ten source_record_types is rejected as an unrecognized recordType
        at runtime.
      prohibited:
        - this_ssot_redefining_or_diverging_from_the_owner_ref_runtime_classification
        - treating_a_layoutAdoptionCandidates_source_record_type_as_having_no_runtime_projection_semantics

  # ===========================================================================
  # 11. declared_seed_surface_catalog
  # ===========================================================================

  declared_seed_surface_catalog:
    rule: >-
      Existing seed content that the exchange needs must be declared here, by meaning, before
      the translator can treat it as known. The translator never reads db/*.sql directly; this
