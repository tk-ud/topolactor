          item.
        note: >-
          Cross-reference: docs/design/admin-uibuilder-ui-structure-wiring-ssot.yaml
          lane_storage_boundary.known_gaps carries the full determination (confirmed via
          PR #597 admin-enum Gate0 re-audit, 2026-07-22). None of the five lanes above
          covers generic manifest-authorized admin_runtime layer:action dispatch
          (enum_dictionary:*, auth_users:*, team_markdown:*, scheduler_jobs:*,
          content_bundle:*) from a seed-authored Action node.
          topology.ui_wiring_registry.wiring_schema_json (as adopted from this contract's
          own wiringAdoptionCandidates output into db/seed_empty.sql by the
          credential-management, admin-dashboard, and admin-enum subBundle seeds) has
          zero runtime or frontend consumers anywhere in the codebase (verified by
          exhaustive grep) -- the wiringAdoptionCandidates -> wiring_schema_json adoption
          convention those seeds followed is not itself incorrect per this contract's own
          schema, but it must not be read by any future bundle as proof that seed-authored
