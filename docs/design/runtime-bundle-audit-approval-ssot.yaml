runtime_bundle_audit_approval_ssot:
  name: runtime_bundle_audit_approval
  version: 0.1.0
  status: ssot_design_document
  canonical_path: docs/design/runtime-bundle-audit-approval-ssot.yaml

  purpose:
    summary: >-
      Audit/Approval BundleのSSOT。
      承認フロー・監査ログ・export job approval 境界を定義する。
      CLI/MCP audit logはcli-model-context-protocols-port-ssotで定義済みであり、
      このBundleはCLI/MCP read/export境界を破らない。
      UI approval / audit log write / export job approval の境界を本SSOTで定義する。
    non_goals:
      - cli_mcp_audit_log_redefinition
      - cli_mcp_read_export_boundary_bypass
      - automated_approval_without_human_action
      - silent_audit_log_omission
      - approval_as_ai_autonomous_decision

  authority_boundary:
    approval_authority: ui_human_explicit_action_only
    audit_log_authority: runtime_event_log_write_on_all_operations
    prohibited_authorities:
      - ai_autonomous_approval
      - implicit_approval
      - silent_audit_log_skip
      - cli_mcp_approval_trigger

  trigger_kind:
    allowed:
      - ui_approval_action
      - admin_approval_action
      - export_job_approval_action
    prohibited:
      - ai_autonomous_approval_trigger
      - implicit_approval_trigger
      - cli_mcp_approval_trigger

  allowed_side_effects:
    - approval_record_write_to_runtime_event_log
    - audit_log_write_on_all_approval_actions
    - export_job_approval_state_update
    - approval_chain_progression

  prohibited_operations:
    - ai_autonomous_approval_without_human_action
    - implicit_approval_on_timeout
    - silent_audit_log_omission
    - approval_bypass
    - cli_mcp_read_export_boundary_violation
    - approval_state_mutation_without_audit_log

  public_safe_config_policy:
    allowed_in_public_ssot:
      - approval_flow_boundary_definition
      - audit_log_boundary_definition
      - export_job_approval_boundary
      - failure_policy_definition
    prohibited_in_public_ssot:
      - approver_identity_data
      - approval_secret_tokens
      - audit_log_retention_system_credentials

  secret_credential_boundary:
    location: runtime_secret_store_not_in_public_ssot
    policy: >-
      承認フローで使用するsecret token / credential実体は
      公開SSOTに記載しない。runtime環境変数またはsecret store経由で注入する。

  port_substrate_relation:
    substrate_ssot: docs/design/external-port-substrate-ssot.yaml
    classification: port_consumer_bundle
    port_consumer:
      - response_port
    credential_kind: external
    note: >-
      承認通知等の外部送信 credential は external_port_substrate の
      response_port に付属する credential_requirement として管理する。
      credential の standalone 管理 plane は作らない。

  approval_flow_boundary:
    request:
      description: 承認リクエストの作成。UI/adminから明示的に作成する。
      actor: authorized_user_or_system
    review:
      description: >-
        承認者によるレビュー。preview / validate 済みのものを対象とする。
      requires: review_subject_validated
    approval:
      description: >-
        明示的ユーザー承認。UI上での確認アクション必須。
        AI単独判断・暗黙的承認は禁止。
      actor: human_approver
      required: true
      prohibited:
        - ai_autonomous_approval
        - implicit_approval_on_timeout
    rejection:
      description: >-
        明示的拒否。拒否理由をaudit logに記録する。
      actor: human_approver
      logs_to: runtime_event_log

  export_job_approval_boundary:
    policy: >-
      export_jobのapprovalはこのBundleの承認フロー境界を通す。
      CLI/MCP portからのexport_job approvalは禁止
      （CLI/MCPはcreate_export_jobまで。approvalはUI/human操作）。
    reference: docs/design/cli-model-context-protocols-port-ssot.yaml

  scheduler_boundary:
    policy: >-
      承認後のruntime executionはscheduler経由で行う。
      approval_direct_runtime_execution_without_schedulerは禁止。

  approval_boundary:
    required: true
    policy: >-
      承認は必ずUI/Human explicit actionを経てから反映する。
      暗黙的・AI単独・タイムアウト自動承認は禁止。

  audit_log_boundary:
    required: runtime_event_log
    scope:
      - approval_requested
      - approval_reviewed
      - approval_granted
      - approval_rejected
      - export_job_approval_initiated
      - export_job_approved
      - export_job_rejected
      - audit_log_write_failure

  failure_policy:
    on_approval_failure:
      - expose_failure_explicitly
      - record_to_runtime_event_log
      - do_not_silently_fallback
    on_audit_log_write_failure:
      - expose_failure_explicitly
      - do_not_silently_skip_audit_record

  idempotency_policy:
    policy: >-
      同一approval request IDに対する承認操作は冪等に扱う。
      二重承認防止のためapproval_idempotency_keyを使用する。
      実装詳細は後段実装SSOTで定義する。

  relation_to_extended_runtime_bundle_registry:
    registry_entry: audit_approval_bundle
    registry_path: docs/design/extended-runtime-bundle-registry-ssot.yaml

  relation_to_cli_mcp_port:
    ssot_path: docs/design/cli-model-context-protocols-port-ssot.yaml
    boundary: approval_is_explicitly_ui_human_only_cli_mcp_read_export_boundary_preserved
    policy: >-
      CLI/MCP read/export portはapproval operationをout_of_scopeとして宣言している。
      このBundleはそのboundaryを尊重し、CLI/MCP経由のapproval経路を提供しない。
      CLI/MCP audit log読み取りはcli-model-context-protocols-port-ssotで定義済みの
      read/export範囲内でのみ許可する。

  explicitly_out_of_scope:
    - cli_mcp_audit_log_system_redefinition
    - automated_approval_system_design
    - approval_workflow_engine_selection
    - audit_log_retention_infrastructure_design
    - compliance_regulation_specification
    - cli_mcp_approval_trigger

  implementation_boundary_requirements:
    items:
      - approval_request_schema_design
      - approval_state_machine_design
      - export_job_approval_schema_design
      - audit_log_schema_design
      - approval_notification_design
      - approval_idempotency_key_schema
      - approval_ui_component_design
    policy: >-
      実装はこのSSOTの境界定義に基づいて別途実装SSOTを作成してから行う。
      CLI/MCP read/export境界との整合をcli-model-context-protocols-port-ssotで確認してから実装する。
